# Reusable fragments

# code + params: the stable code and its values (REQ-1350) — a refused delete lists what still
# refers to the object in params.dependents (REQ-1918).
fragment MutationResult on MutationResult {
  success
  message
  code
  params
}

fragment ColumnFields on TableColumnType {
  id
  columnName
  visibleTo
  masks {
    to
    mask {
      type
      pattern
      replace
      value
      precision
    }
  }
  alias
  computedSqlAlias
  computedGqlAlias
  description
  dataType
  nativeFilterType
  nativeFilterRequired
  requiredBySteward
  path
  embedding
  embeddingModel
  isPrimaryKey
  isForeignKey
  isAlternateKey
  scope
  isImplicitMeasure
  isImplicitDimension
  fake
  fakeStable
  fakeStableVersion
  syntheticRule
  isPii
}

fragment WriteGrantFields on WriteGrantType {
  role
  operation
  columns
  rows
  check
  presets {
    column
    source
    name
    value
  }
}

