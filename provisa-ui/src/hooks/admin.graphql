# Reusable fragments

fragment MutationResult on MutationResult {
  success
  message
}

fragment ColumnFields on TableColumnType {
  id
  columnName
  visibleTo
  writableBy
  unmaskedTo
  maskType
  maskPattern
  maskReplace
  maskValue
  maskPrecision
  alias
  computedSqlAlias
  description
  dataType
  nativeFilterType
  isPrimaryKey
  isForeignKey
  isAlternateKey
  scope
  isImplicitMeasure
  isImplicitDimension
}

fragment ColumnPresetFields on ColumnPresetType {
  column
  source
  name
  value
  dataType
}

