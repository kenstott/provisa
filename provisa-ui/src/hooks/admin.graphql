# REQ-1143: preview the effective refresh/serving summary for draft (unsaved) editor knobs.
query RefreshPolicyPreview(
  $sourceId: String!
  $domainId: String!
  $schemaName: String!
  $tableName: String!
  $cacheTtl: Int
  $replicate: Int
  $loadProtected: Boolean
  $offPeakWindow: String
  $offPeakTz: String
  $changeSignal: String
) {
  refreshPolicyPreview(
    sourceId: $sourceId
    domainId: $domainId
    schemaName: $schemaName
    tableName: $tableName
    cacheTtl: $cacheTtl
    replicate: $replicate
    loadProtected: $loadProtected
    offPeakWindow: $offPeakWindow
    offPeakTz: $offPeakTz
    changeSignal: $changeSignal
  ) {
    text
    serving
    warning
  }
}

# REQ-1443: the data-quality contract builder. Parsing and serialization are server calls so the
# soda / Great Expectations dialects have exactly one implementation, and the panel can never emit a
# shape the checker refuses to run.
query Neo4jPreview($sourceId: String!, $cypher: String!) {
  neo4jPreview(sourceId: $sourceId, cypher: $cypher) {
    rows
    columns {
      name
      dataType
    }
    error
  }
}

