      extra
    }
  }
}

# REQ-1443 clause 7: the checks the picker may offer. Scoped by the contract's own dataset, which
# the server resolves the same way the registration and the dry run do, so the offered checks match
# the columns the checker will really see.
query DqCheckCatalog($checker: String!, $dataset: String!) {
  dqCheckCatalog(checker: $checker, dataset: $dataset) {
    error
    datasetChecks {
      checkType
      scope
      comparators
      metrics
      levels
      thresholdUnits
      params {
        name
        valueType
        required
        choices
      }
    }
    columns {
      name
      dataType
      checks {
        checkType
        scope
        comparators
        metrics
        levels
        thresholdUnits
        params {
          name
          valueType
          required
          choices
        }
      }
    }
  }
}

# One check's definition text from the picker, threshold and severity editors.
query DqCheckDefinition($checker: String!, $check: DqCheckBuildInput!) {
  dqCheckDefinition(checker: $checker, check: $check) {
    definition
    error
  }
}

query DqContractBuild($checker: String!, $dataset: String!, $checks: [DqCheckInput!]!) {
  dqContractBuild(checker: $checker, dataset: $dataset, checks: $checks) {
    text
    error
  }
}

# REQ-1443 clause 7: run the contract against the live table, landing nothing.
mutation DryRunDqContract($sourceId: String!, $contractText: String!) {
  dryRunDqContract(sourceId: $sourceId, contractText: $contractText) {
    success
    message
    checkerVersion
    checks {
      columnName
      checkType
      outcome
      rowsTested
      failedRows
      value
      diagnostics
    }
  }
}

# REQ-1443: run a checker table's poll job now instead of waiting for its cadence; lands rows.
mutation RunDqCheckNow($tableId: Int!) {
  runDqCheckNow(tableId: $tableId) {
    ...MutationResult
  }
}

