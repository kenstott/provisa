# REQ-1143: preview the effective refresh/serving summary for draft (unsaved) editor knobs.
query RefreshPolicyPreview(
  $sourceId: String!
  $domainId: String!
  $schemaName: String!
  $tableName: String!
  $cacheTtl: Int
  $preferMaterialized: Boolean
  $loadProtected: Boolean
  $offPeakWindow: String
  $offPeakTz: String
  $changeSignal: String
) {
  refreshPolicyPreview(
    sourceId: $sourceId
    domainId: $domainId
    schemaName: $schemaName
    tableName: $tableName
    cacheTtl: $cacheTtl
    preferMaterialized: $preferMaterialized
    loadProtected: $loadProtected
    offPeakWindow: $offPeakWindow
    offPeakTz: $offPeakTz
    changeSignal: $changeSignal
  ) {
    text
    serving
    warning
  }
}

# REQ-1443: the data-quality contract builder. Parsing and serialization are server calls so the
# soda / Great Expectations dialects have exactly one implementation, and the panel can never emit a
# shape the checker refuses to run.
query DqContractParse($checker: String!, $contractText: String!) {
  dqContractParse(checker: $checker, contractText: $contractText) {
    dataset
    checker
    error
    checks {
      columnName
      checkType
      definition
      extra
    }
  }
}

# REQ-1443 clause 7: the checks the picker may offer. Scoped by the contract's own dataset, which
# the server resolves the same way the registration and the dry run do, so the offered checks match
# the columns the checker will really see.
query DqCheckCatalog($checker: String!, $dataset: String!) {
  dqCheckCatalog(checker: $checker, dataset: $dataset) {
    error
    datasetChecks {
      checkType
      scope
      comparators
      metrics
      levels
      thresholdUnits
      params {
        name
        valueType
        required
        choices
      }
    }
    columns {
      name
      dataType
      checks {
        checkType
        scope
        comparators
        metrics
        levels
        thresholdUnits
        params {
          name
          valueType
          required
          choices
        }
      }
    }
  }
}

# One check's definition text from the picker, threshold and severity editors.
query DqCheckDefinition($checker: String!, $check: DqCheckBuildInput!) {
  dqCheckDefinition(checker: $checker, check: $check) {
    definition
    error
  }
}

query DqContractBuild($checker: String!, $dataset: String!, $checks: [DqCheckInput!]!) {
  dqContractBuild(checker: $checker, dataset: $dataset, checks: $checks) {
    text
    error
  }
}

# REQ-1443 clause 7: run the contract against the live table, landing nothing.
mutation DryRunDqContract($sourceId: String!, $contractText: String!) {
  dryRunDqContract(sourceId: $sourceId, contractText: $contractText) {
    success
    message
    checkerVersion
    checks {
      columnName
      checkType
      outcome
      rowsTested
      failedRows
      value
      diagnostics
    }
  }
}

