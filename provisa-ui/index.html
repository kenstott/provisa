<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#1F2933" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Provisa</title>
    <!-- Runtime Firebase web config (REQ-1266). ui_server serves this from the node
         env so one built image serves any Firebase project; sets window.__PROVISA_FIREBASE__
         before the app bundle. A 404 in dev (no ui_server) is harmless — lib/firebase.ts
         then falls back to the VITE_FIREBASE_* build-time env. -->
    <script src="/firebase-config.js"></script>
    <script>
      // Set the Mantine color-scheme attribute before first paint to avoid a
      // light/dark flash (REQ-1011). Mirrors @mantine/core's ColorSchemeScript
      // for this non-SSR Vite app. Key + default must match MantineProvider.
      (function () {
        try {
          var stored = localStorage.getItem("provisa-color-scheme");
          document.documentElement.setAttribute(
            "data-mantine-color-scheme",
            stored === "light" || stored === "dark" ? stored : "dark",
          );
        } catch (e) {
          document.documentElement.setAttribute("data-mantine-color-scheme", "dark");
        }
      })();
    </script>
    <style>
      /* Convergence splash — painted on first paint, before the JS bundle loads, and faded
         out when the React app signals ready (window.__provisaHideSplash). Streams of binary
         flow inward along a flow field into the mark (splash/binary-streams.js, the renderer
         the SaaS front door's waking page also runs). */
      #provisa-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(120% 120% at 50% 45%, #16213f 0%, #0f1117 55%, #0b0d13 100%);
        opacity: 1;
        transition: opacity 350ms ease;
      }
      #provisa-splash.provisa-splash-hide {
        opacity: 0;
        pointer-events: none;
      }
      #provisa-splash-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .provisa-splash-mark {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        animation: provisa-splash-rise 700ms ease both;
      }
      .provisa-splash-mark svg {
        filter: drop-shadow(0 0 22px rgba(16, 185, 129, 0.35));
      }
      .provisa-splash-word {
        font: 600 15px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        letter-spacing: 0.42em;
        text-indent: 0.42em;
        color: #e1e4ed;
        opacity: 0.9;
      }
      /* Status line under the mark. Empty (and invisible) on a normal load; filled in
         only when the app is taking long enough that the user needs to be told why. */
      .provisa-splash-note {
        max-width: 24rem;
        margin-top: 6px;
        text-align: center;
        font: 400 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #9aa3b5;
        opacity: 0;
        transition: opacity 400ms ease;
      }
      .provisa-splash-note.provisa-splash-note-show {
        opacity: 1;
      }
      @keyframes provisa-splash-rise {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .provisa-splash-mark {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="provisa-splash" role="presentation">
      <canvas id="provisa-splash-canvas"></canvas>
      <div class="provisa-splash-mark">
        <svg viewBox="0 0 100 100" width="76" height="76" role="img" aria-label="Provisa">
          <g fill="#e1e4ed">
            <rect x="28" y="18" width="15" height="64" rx="7" />
            <circle cx="50" cy="35" r="22" />
          </g>
          <circle cx="50" cy="35" r="10.5" fill="#0f1117" />
          <circle cx="50" cy="35" r="4.5" fill="#10B981" />
        </svg>
        <div class="provisa-splash-word">PROVISA</div>
        <div id="provisa-splash-note" class="provisa-splash-note" role="status" aria-live="polite"></div>
      </div>
    </div>
    <!-- provisa:binary-streams -->
    <script>
      // Vanilla, runs during parse (before the deferred module) so the field animates immediately.
      (function () {
        var splash = document.getElementById("provisa-splash");
        if (!splash) return;
        var start = Date.now();
        var MIN_MS = 450; // avoid a jarring blink on very fast (native-tier) loads
        var reduce =
          window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        var canvas = document.getElementById("provisa-splash-canvas");
        var streams = null;
        if (canvas && canvas.getContext) {
          // The centre of the P's loop (viewBox 50,35 of 100) — the halo converges here so the
          // loop sits exactly in it. Measured from the SVG rect (canvas is inset:0, so client
          // coords == viewport coords); falls back to the prior fixed anchor if the mark isn't
          // laid out yet. Read every frame: the status note reflows the centred column.
          var markSvg = document.querySelector(".provisa-splash-mark svg");
          var mark = document.querySelector(".provisa-splash-mark");
          streams = window.provisaBinaryStreams(canvas, {
            center: function () {
              var r = markSvg && markSvg.getBoundingClientRect();
              if (r && r.width) return { x: r.left + r.width * 0.5, y: r.top + r.height * 0.35 };
              return { x: canvas.clientWidth / 2, y: canvas.clientHeight * 0.45 };
            },
            avoid: function () {
              return mark;
            },
            reduce: reduce,
          });
        }

        function hide() {
          var wait = Math.max(0, MIN_MS - (Date.now() - start));
          setTimeout(function () {
            splash.classList.add("provisa-splash-hide");
            setTimeout(function () {
              if (streams) streams.stop();
              if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
            }, 380);
          }, wait);
        }
        window.__provisaHideSplash = hide;

        // A slow load is almost always a cold coordinator: the front door woke a
        // scaled-to-zero VM and the bundles are being fetched while it finishes
        // booting. Say so instead of tearing the splash down — the previous safety
        // net removed it after 8 s whether or not React had mounted, which left a
        // black page with no explanation on exactly the wake it was meant to cover.
        var note = document.getElementById("provisa-splash-note");
        function say(text) {
          if (!note || splash.classList.contains("provisa-splash-hide")) return;
          note.textContent = text;
          note.classList.add("provisa-splash-note-show");
        }
        setTimeout(function () {
          say("Starting up — this can take a couple of minutes after an idle period.");
        }, 6000);
        setTimeout(function () {
          say("Still starting. Leave this page open; it will continue on its own.");
        }, 30000);
        setTimeout(function () {
          say("This is taking longer than expected. Reload the page to try again.");
        }, 120000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
