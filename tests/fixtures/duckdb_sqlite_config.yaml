# A fully DuckDB + SQLite stack for tests: the DuckDB federation engine over a SQLite
# source, with auth disabled. The control-plane store (SQLite) and the materialize store
# (DuckDB) are supplied by the test via env/injection, not hardcoded here.
federation_engine: duckdb
auth:
  provider: none
  assignments_source: provisa
  default_assignments:
    - domain_id: '*'
      role_id: org_admin
naming:
  domain_prefix: false
  rules: []
cache:
  enabled: false
domains:
  - id: shelter
    description: Animal shelter
roles:
  # REQ-1297: the DATA-plane administrator, without the platform-bypass 'admin'/'superadmin'
  # capabilities — those are platform_admin's alone, and platform_admin holds no data rights.
  - id: org_admin
    capabilities:
      - source_registration
      - table_registration
      - create_relationship
      - create_view
      - approve_view
      - approve_relationship
      - access_config
      - user_management
      - masking_config
      - column_grant
      - view_governance
      - query_development
      - full_results
      - write
      - usage
    domain_access:
      - '*'
sources:
  - id: inquiries-sqlite
    type: sqlite
    path: ./demo/files/inquiries.sqlite
tables:
  - source_id: inquiries-sqlite
    table: inquiries
    schema: default
    domain_id: shelter
    columns:
      - name: pet_id
        data_type: integer
        visible_to: [org_admin]
      - name: user_id
        data_type: integer
        visible_to: [org_admin]
      - name: inquiry_type
        data_type: varchar
        visible_to: [org_admin]
      - name: message
        data_type: varchar
        visible_to: [org_admin]
      - name: status
        data_type: varchar
        visible_to: [org_admin]
      - name: submitted_at
        data_type: varchar
        visible_to: [org_admin]
