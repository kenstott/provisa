# REQ-1661: a DuckDB + SQLite stack over one remote GraphQL source with two tables, served by
# the test's own HTTP server; the control-plane and materialize stores come from the test.
federation_engine: duckdb
auth:
  provider: none
  assignments_source: provisa
  default_assignments:
    - domain_id: '*'
      role_id: org_admin
naming:
  domain_prefix: false
  rules: []
cache:
  enabled: false
domains:
  - id: shelter
    description: Animal shelter
roles:
  # REQ-1297: the DATA-plane administrator, without the platform-bypass 'admin'/'superadmin'
  # capabilities — those are platform_admin's alone, and platform_admin holds no data rights.
  - id: org_admin
    capabilities:
      - source_registration
      - table_registration
      - create_relationship
      - create_view
      - approve_view
      - approve_relationship
      - access_config
      - user_management
      - masking_config
      - column_grant
      - view_governance
      - query_development
      - full_results
      - write
      - usage
    domain_access:
      - '*'
sources:
  - id: remote-gql
    type: graphql_remote
    path: ${env:PROVISA_TEST_GQL_REMOTE_URL}
tables:
  - source_id: remote-gql
    table: good_items
    schema: graphql
    domain_id: shelter
    columns:
      - name: id
        data_type: integer
        visible_to: [org_admin]
  - source_id: remote-gql
    table: bad_items
    schema: graphql
    domain_id: shelter
    columns:
      - name: id
        data_type: integer
        visible_to: [org_admin]
