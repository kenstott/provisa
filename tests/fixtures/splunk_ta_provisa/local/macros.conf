# Splunk_SA_CIM ships this macro as `definition = ()` — no index restriction — and expects each
# deployment to narrow it. Scoping it to the fixture index is both the realistic configuration and
# what keeps the model from scanning unrelated test data in the same container.
#
# local/, not default/: Splunk_SA_CIM defines cim_Authentication_indexes in its own default/, and
# conf precedence between two apps' default/ directories is decided by app-directory name. local/
# outranks every app's default/, so this override wins without depending on that ordering.
[cim_Authentication_indexes]
definition = index=provisa_cim
iseval = 0
