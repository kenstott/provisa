# REQ-2208 (THE TAGS REPORT): two domains, a table in each, a tag on both tables and on a column of
# the sales table, and a role reading sales alone. The tags report is read through SQL as each.
auth:
  provider: none
  assignments_source: provisa
  default_assignments:
    - domain_id: '*'
      role_id: org_admin
naming:
  domain_prefix: false
  rules: []
cache:
  enabled: false
domains:
  - id: trs
    description: Sales
  - id: trh
    description: People
sources:
  - id: tr-pg
    type: postgresql
    host: ${env:PG_HOST}
    port: ${env:PG_PORT}
    database: ${env:PG_DATABASE}
    username: ${env:PG_USER}
    password: ${env:PG_PASSWORD}
tables:
  - source_id: tr-pg
    domain_id: trs
    schema: tr_e2e
    table: orders
    columns:
      - {name: id, data_type: integer, visible_to: [org_admin, sales_reader]}
      - {name: email, data_type: varchar, visible_to: [org_admin, sales_reader]}
  - source_id: tr-pg
    domain_id: trh
    schema: tr_e2e
    table: staff
    columns:
      - {name: id, data_type: integer, visible_to: [org_admin]}
tags:
  - id: approved
    description: Approved for use
    applies_to: [table, column]
tag_assignments:
  - {tag_id: approved, object_type: table, table_ref: tr-pg.tr_e2e.orders}
  - {tag_id: approved, object_type: table, table_ref: tr-pg.tr_e2e.staff}
  - {tag_id: approved, object_type: column, table_ref: tr-pg.tr_e2e.orders, column_name: email}
roles:
  - id: sales_reader
    description: Reads the sales domain and its catalog.
    capabilities: [catalog_read]
    domain_access: [trs, meta]
