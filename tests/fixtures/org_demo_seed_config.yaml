# REQ-1293: minimal demo config for the org-provisioning seed test. The source host is the
# pytest-host-reachable Postgres (the same one the tenant plane uses), so build_org_runtime's
# config load, source-pool build and engine registration all run for real against a live DB.
sources:
  - id: sales-pg
    type: postgresql
    host: ${env:PG_HOST}
    port: ${env:PG_PORT}
    database: provisa
    username: provisa
    password: ${env:PG_PASSWORD}

domains:
  - id: sales-analytics
    description: Sales operational and analytical data

tables:
  - source_id: sales-pg
    domain_id: sales-analytics
    schema: public
    table: orders
    columns:
      - name: id
        data_type: integer
        visible_to: [org_admin]
      - name: amount
        visible_to: [org_admin]

roles:
  # REQ-1297: the DATA-plane administrator, without the platform-bypass 'admin'/'superadmin'
  # capabilities — those are platform_admin's alone, and platform_admin holds no data rights.
  - id: org_admin
    capabilities:
      - source_registration
      - table_registration
      - create_relationship
      - create_view
      - approve_view
      - approve_relationship
      - access_config
      - user_management
      - masking_config
      - column_grant
      - view_governance
      - query_development
      - full_results
      - write
      - usage
    domain_access: ["*"]
