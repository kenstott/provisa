# REQ-1661: a DuckDB + SQLite stack whose one source is an RSS feed -- a type no engine
# attaches, so every read lands it first. The feed URL is the test's own local HTTP server; the
# control-plane store (SQLite) and the materialize store (DuckDB) are supplied by the test.
federation_engine: duckdb
auth:
  provider: none
  assignments_source: provisa
  default_assignments:
    - domain_id: '*'
      role_id: org_admin
naming:
  domain_prefix: false
  rules: []
cache:
  enabled: false
domains:
  - id: shelter
    description: Animal shelter
roles:
  # REQ-1297: the DATA-plane administrator, without the platform-bypass 'admin'/'superadmin'
  # capabilities — those are platform_admin's alone, and platform_admin holds no data rights.
  - id: org_admin
    capabilities:
      - source_registration
      - table_registration
      - create_relationship
      - create_view
      - approve_view
      - approve_relationship
      - access_config
      - user_management
      - masking_config
      - column_grant
      - view_governance
      - query_development
      - full_results
      - write
      - usage
    domain_access:
      - '*'
sources:
  - id: feed-rss
    type: rss
    cache_ttl: 2
    federation_hints:
      feed_url: ${env:PROVISA_TEST_RSS_FEED_URL}
tables:
  - source_id: feed-rss
    table: feed_items
    schema: default
    domain_id: shelter
    columns:
      - name: id
        data_type: varchar
        visible_to: [org_admin]
      - name: title
        data_type: varchar
        visible_to: [org_admin]
      - name: link
        data_type: varchar
        visible_to: [org_admin]
      - name: description
        data_type: varchar
        visible_to: [org_admin]
      - name: published
        data_type: timestamp
        visible_to: [org_admin]
