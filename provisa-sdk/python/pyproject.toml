[project]
name = "provisa-sdk"
version = "0.1.0"
description = "Optional types-only SDK for Provisa Python code sources: decorators for the docstring tags, result and column type aliases, and provisa_services stubs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["provisa_sdk", "provisa_services-stubs"]

[tool.setuptools.package-data]
provisa_sdk = ["py.typed"]
"provisa_services-stubs" = ["__init__.pyi"]

[tool.ruff]
extend = "../../pyproject.toml"
# Written by gen_services_stubs.py and compared byte for byte with its output.
extend-exclude = ["provisa_services-stubs"]
