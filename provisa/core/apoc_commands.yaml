#
# The APOC calls Cypher tools and agent frameworks make, shipped as command declarations on the
# command-binding mechanism (REQ-2168). Each is bound in Cypher to its APOC name and offered in SQL
# under its own name (SQL cannot be excluded); it is excluded from GraphQL, REST, MCP and SPARQL.
# The introspection procedures are built-ins answered from the acting role's label map; the
# functions are SQL expression templates, transpiled per engine so they push down with the query.
functions:
- name: apoc_meta_data
  description: 'The graph''s schema as APOC''s apoc.meta.data answers it: one row per node property, relationship
    and relationship property the acting role reads.'
  domain_id: meta
  kind: query
  impl_kind: builtin
  source_id: ''
  function_name: apoc_meta_data
  returns: ''
  binding:
    callable: apoc.meta.data
  arguments:
  - name: config
    type: json
  visible_to: []
  language_bindings:
    cypher:
      name: apoc.meta.data
    graphql:
      exclude: true
    rest:
      exclude: true
    mcp:
      exclude: true
    sparql:
      exclude: true
- name: apoc_meta_schema
  description: 'The graph''s schema as APOC''s apoc.meta.schema answers it: one map of each label and
    relationship type the acting role reads.'
  domain_id: meta
  kind: query
  impl_kind: builtin
  source_id: ''
  function_name: apoc_meta_schema
  returns: ''
  binding:
