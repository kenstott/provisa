- name: apoc_text_join
  description: Joins a list of strings with a delimiter.
  domain_id: meta
  kind: query
  impl_kind: sql_expression
  source_id: ''
  function_name: apoc_text_join
  returns: ''
  binding:
    sql: array_to_string({list}, {delimiter})
  arguments:
