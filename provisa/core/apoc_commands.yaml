  visible_to: []
  language_bindings:
    cypher:
      name: apoc.meta.schema
    graphql:
      exclude: true
    rest:
      exclude: true
    mcp:
      exclude: true
    sparql:
      exclude: true
- name: apoc_schema_nodes
  description: The graph's node indexes and constraints as APOC answers them; a Provisa graph declares
