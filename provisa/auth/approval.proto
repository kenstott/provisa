syntax = "proto3";

package provisa.auth;

option java_package = "com.provisa.auth";
option go_package = "provisa/auth";

service ApprovalService {
  rpc Evaluate (ApprovalRequest) returns (ApprovalResponse);
}

message ApprovalRequest {
  string user = 1;
  repeated string roles = 2;
  repeated string tables = 3;
  repeated string columns = 4;
  string operation = 5;
  map<string, string> session_vars = 6;
  // REQ-1924: a command call's name, and its arguments as a JSON object; empty for a query.
  string command = 7;
  string arguments_json = 8;
}

message ApprovalResponse {
  bool approved = 1;
  string reason = 2;
  string additional_filter = 3;
}
