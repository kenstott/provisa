# Core services only — postgres, redis, trino, zaychik. No observability, no demo.
# Usage: docker compose -f docker-compose.core.yml -f docker-compose.dev-install.yml up
#
# No credential has a default here. Every launcher (scripts/provisa, the first-launch scripts,
# start-ui*.sh, the test harnesses) sets PROVISA_PG_PASSWORD, PROVISA_REDIS_PASSWORD,
# PROVISA_MINIO_ROOT_USER, PROVISA_MINIO_ROOT_PASSWORD and PROVISA_TRINO_SHARED_SECRET, the
# passwords generated per deployment,
# and PROVISA_STORE_BIND_IP: the address the stores and the engine publish on (127.0.0.1 on a
# node of its own).
services:
  postgres:
    restart: unless-stopped
    image: postgres:16
    command: >
      postgres
      -c wal_level=logical
      -c max_replication_slots=10
      -c max_wal_senders=10
    environment:
      POSTGRES_DB: provisa
      POSTGRES_USER: provisa
      POSTGRES_PASSWORD: "${PROVISA_PG_PASSWORD:?the control-plane PostgreSQL password, generated by the launcher}"
    ports:
      - "${PROVISA_STORE_BIND_IP:?the address the stores publish on: 127.0.0.1 alone, or the node private address its peers dial}:${PG_PORT:-5432}:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      # Healthy once it serves THIS deployment's password: a volume initialised under another one
      # keeps that one, so it is set again, over the local socket, whenever signing in with the
      # current one fails. Everything that signs in waits on this (service_healthy).
      test:
        - CMD-SHELL
        - >-
          pg_isready -U provisa &&
          { PGPASSWORD="$$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U provisa -d provisa -tAc 'select 1' >/dev/null 2>&1 ||
          printf '%s\n' "ALTER ROLE provisa PASSWORD :'pw';" | psql -v ON_ERROR_STOP=1 -q -U provisa -d provisa -v pw="$$POSTGRES_PASSWORD"; }
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  pgbouncer:
    restart: unless-stopped
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: provisa
      # The postgres service's own role: without it PgBouncer logs in as "postgres", which this
      # server has no password for, and every client connection fails server_login_retry.
      DB_USER: provisa
      DB_PASSWORD: "${PROVISA_PG_PASSWORD:?the control-plane PostgreSQL password, generated by the launcher}"
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      LISTEN_PORT: 6432
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${PROVISA_REDIS_PASSWORD:?the Redis password, generated by the launcher}"]
    environment:
      # redis-cli (the healthcheck) authenticates with it.
      REDISCLI_AUTH: "${PROVISA_REDIS_PASSWORD:?the Redis password, generated by the launcher}"
    ports:
      - "${PROVISA_STORE_BIND_IP:?the address the stores publish on: 127.0.0.1 alone, or the node private address its peers dial}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  # A fresh provisa_exchange named volume is created root:root; Trino runs as
  # uid 1000 and cannot write FTE (retry-policy=TASK) exchange spooling files,
  # so every query fails with GENERIC_INTERNAL_ERROR. Chown the volume before
  # Trino starts so the mount is writable regardless of volume recreation.
  #
  # Trino keeps the catalogs Provisa creates in memory (catalog.store=memory): no catalog, and so
  # none of the connection passwords in one, is written to disk, and nothing mounts
  # /etc/trino/catalog. A restarted Trino comes back with none of them and Provisa reissues them
  # (provisa/federation/engine_wake.py, reissue_after_coordinator_restart).
  #
  # PROVISA_TRINO_ETC_HOST (kafka/, kafka-client/, redis/) is the host side of the directories the
  # APP writes into at runtime: the Kafka and Redis table-description JSON and the Kafka client
  # properties. The isolated stack points it at a per-session directory (tests/itest_stack.py) so a
  # previous session's description files never outlive it.
  trino-exchange-init:
    image: busybox
    # One line: a YAML folded scalar keeps the newline before a MORE-indented continuation, so the
    # wrapped form reached busybox sh as two lines and died with `unexpected "&&"`, failing every
    # service that waits on service_completed_successfully.
    #
    # The two cache volumes are given to Trino's user here too (REQ-1946): Docker creates a named
    # volume's root owned by root when the image has no directory at its mount path, and the
    # Salesforce catalog keeps its describe results under /data/trino/cache (mkdir there was
    # "Permission denied" for uid 1000 on a fresh volume).
    #
    # It also removes what the engine tree no longer holds on disk, as root, since Trino's user
    # wrote it: the catalog directory an earlier release's file catalog store filled with each
    # catalog's properties, passwords included (the catalogs are in Trino's memory now), and the
    # files PROVISA_DEAD_ENGINE_FILES names (docker-compose.app.yml: the Kafka client properties
    # left on disk before they moved to a tmpfs).
    command: sh -c "mkdir -p /data/provisa/exchange && chown -R 1000:1000 /data/provisa/exchange && chown 1000:1000 /data/trino/cache /data/trino/worker-cache && rm -rf /engine-tree/catalog $${PROVISA_DEAD_ENGINE_FILES}"
    environment:
      PROVISA_DEAD_ENGINE_FILES: ""
    volumes:
      - ${PROVISA_TRINO_ETC_HOST:-./trino}:/engine-tree
      - provisa_exchange:/data/provisa/exchange
      - trino_cache:/data/trino/cache
      - trino_worker_cache:/data/trino/worker-cache
    restart: "no"

  trino:
    restart: unless-stopped
    image: trinodb/trino:481
    mem_limit: 7g
    ports:
      - "${PROVISA_STORE_BIND_IP:?the address the stores publish on: 127.0.0.1 alone, or the node private address its peers dial}:${TRINO_PORT:-8080}:8080"
    volumes:
      - ${PROVISA_TRINO_ETC_HOST:-./trino}/etc/config.properties:/etc/trino/config.properties:ro
      - ${PROVISA_TRINO_ETC_HOST:-./trino}/etc/exchange-manager.properties:/etc/trino/exchange-manager.properties:ro
      - ${PROVISA_TRINO_ETC_HOST:-./trino}/etc/jvm.config:/etc/trino/jvm.config:ro
      - ${PROVISA_TRINO_ETC_HOST:-./trino}/etc/node.properties:/etc/trino/node.properties:ro
      - ${PROVISA_TRINO_ETC_HOST:-./trino}/etc/resource-groups.json:/etc/trino/resource-groups.json:ro
      - ${PROVISA_TRINO_ETC_HOST:-./trino}/etc/resource-groups.properties:/etc/trino/resource-groups.properties:ro
      - ${PROVISA_TRINO_ETC_HOST:-./trino}/kafka:/etc/trino/kafka:ro
      # REQ-1992: each Kafka catalog's client properties, named by its org-qualified catalog.
      - ${PROVISA_TRINO_ETC_HOST:-./trino}/kafka-client:/etc/trino/kafka-client:ro
      # Redis table-description files (REQ-251): write_table_definitions writes them here on the
      # host; the connector reads them at redis.table-description-dir (provisa/redis/source.py
      # TABLE_DESCRIPTION_DIR). Without the mount the catalog loads and every table has no columns.
      # Mounted on the worker too — splits read the same descriptions the coordinator planned with.
      - ${PROVISA_TRINO_ETC_HOST:-./trino}/redis:/etc/trino/redis:ro
      - trino_cache:/data/trino/cache
      - provisa_exchange:/data/provisa/exchange
      - ./observability/trino-otel:/etc/trino/otel:ro
      - trino_logs:/var/log/trino
      - ./trino/plugins/trino-sharepoint:/usr/lib/trino/plugin/trino-sharepoint:ro
      - ./trino/plugins/trino-splunk:/usr/lib/trino/plugin/trino-splunk:ro
      - ./trino/plugins/trino-file:/usr/lib/trino/plugin/trino-file:ro
      - ./trino/plugins/trino-salesforce:/usr/lib/trino/plugin/trino-salesforce:ro
      - ./trino/plugins/trino-cloudops:/usr/lib/trino/plugin/trino-cloudops:ro
      # REQ-1494: Provisa's fake functions, and the platform fake keys they are keyed by -- each
      # written to this directory as <fingerprint>.key by the Provisa sharing it (its own
      # PROVISA_FAKE_KEY_DIR), read by the plugin.
      - ./trino/plugins/provisa-functions:/usr/lib/trino/plugin/provisa-functions:ro
      - ${PROVISA_FAKE_KEY_DIR:-./.provisa/fake-key}:/etc/provisa/fake-key:ro
      - ./demo/files:/data/files:ro
      # Shared with the itest hive-metastore so Trino's Hadoop FS reads the local Hive warehouse
      # (file:/opt/hive/data/warehouse) the metastore records for non-S3 hive tables (REQ-1097).
      - hive_warehouse:/opt/hive/data/warehouse
    environment:
      JAVA_TOOL_OPTIONS: "-Dotel.javaagent.enabled=false"
      PROVISA_FAKE_KEY_DIR: /etc/provisa/fake-key  # REQ-1494
      # The secret the coordinator and its workers authenticate each other with
      # (internal-communication.shared-secret in config.properties).
      PROVISA_TRINO_SHARED_SECRET: "${PROVISA_TRINO_SHARED_SECRET:?the Trino nodes' shared secret, generated by the launcher}"
    depends_on:
      postgres:
        condition: service_healthy
      trino-exchange-init:
        condition: service_completed_successfully
      hive-metastore:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "trino --execute 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 42
      start_period: 120s

  trino-worker:
    restart: unless-stopped
    image: trinodb/trino:481
    entrypoint: ["/etc/trino/worker/entrypoint.sh"]
    volumes:
      - ${PROVISA_TRINO_ETC_HOST:-./trino}/etc/worker/config.properties:/etc/trino/config.properties:ro
      - ${PROVISA_TRINO_ETC_HOST:-./trino}/etc/exchange-manager.properties:/etc/trino/exchange-manager.properties:ro
      - ${PROVISA_TRINO_ETC_HOST:-./trino}/etc/jvm.config:/etc/trino/jvm.config:ro
      - ${PROVISA_TRINO_ETC_HOST:-./trino}/etc/worker/entrypoint.sh:/etc/trino/worker/entrypoint.sh:ro
      - ${PROVISA_TRINO_ETC_HOST:-./trino}/kafka:/etc/trino/kafka:ro
      # REQ-1992: each Kafka catalog's client properties, named by its org-qualified catalog.
      - ${PROVISA_TRINO_ETC_HOST:-./trino}/kafka-client:/etc/trino/kafka-client:ro
      # Redis table-description files (REQ-251): write_table_definitions writes them here on the
      # host; the connector reads them at redis.table-description-dir (provisa/redis/source.py
      # TABLE_DESCRIPTION_DIR). Without the mount the catalog loads and every table has no columns.
      # Mounted on the worker too — splits read the same descriptions the coordinator planned with.
      - ${PROVISA_TRINO_ETC_HOST:-./trino}/redis:/etc/trino/redis:ro
      - trino_worker_cache:/data/trino/cache
      - provisa_exchange:/data/provisa/exchange
      - ./observability/trino-otel:/etc/trino/otel:ro
      - trino_worker_logs:/var/log/trino
      - ./trino/plugins/trino-sharepoint:/usr/lib/trino/plugin/trino-sharepoint:ro
      - ./trino/plugins/trino-splunk:/usr/lib/trino/plugin/trino-splunk:ro
      - ./trino/plugins/trino-file:/usr/lib/trino/plugin/trino-file:ro
      - ./trino/plugins/trino-salesforce:/usr/lib/trino/plugin/trino-salesforce:ro
      - ./trino/plugins/trino-cloudops:/usr/lib/trino/plugin/trino-cloudops:ro
      # REQ-1494: Provisa's fake functions, and the platform fake keys they are keyed by -- each
      # written to this directory as <fingerprint>.key by the Provisa sharing it (its own
      # PROVISA_FAKE_KEY_DIR), read by the plugin.
      - ./trino/plugins/provisa-functions:/usr/lib/trino/plugin/provisa-functions:ro
      - ${PROVISA_FAKE_KEY_DIR:-./.provisa/fake-key}:/etc/provisa/fake-key:ro
      - ./demo/files:/data/files:ro
      - hive_warehouse:/opt/hive/data/warehouse
    environment:
      JAVA_TOOL_OPTIONS: "-Dotel.javaagent.enabled=false"
      PROVISA_FAKE_KEY_DIR: /etc/provisa/fake-key  # REQ-1494
      # The secret the coordinator and its workers authenticate each other with
      # (internal-communication.shared-secret in config.properties).
      PROVISA_TRINO_SHARED_SECRET: "${PROVISA_TRINO_SHARED_SECRET:?the Trino nodes' shared secret, generated by the launcher}"
    depends_on:
      trino:
        condition: service_healthy
      trino-exchange-init:
        condition: service_completed_successfully
    deploy:
      replicas: 0

  # Shared Hive Thrift metastore for delta_lake/iceberg Trino catalogs (REQ-1730). Those two source
  # types are bare-path sources (no host/port of their own, REQ-899) — DuckDB reads them straight off
  # disk with no catalog at all, but Trino's real delta_lake/iceberg connectors require a metastore
  # (iceberg.catalog.type=hive_metastore / hive.metastore.uri) to know a schema.table exists at all.
  # This metastore is empty at boot; TrinoIcebergConnector/TrinoDeltaLakeConnector's post_create
  # (provisa/federation/trino_connectors.py) calls the connector's own register_table procedure to
  # attach each source's already-written table files (REQ-1743) the first time it is registered.
  # Shares the same hive_warehouse volume Trino already mounts, same image as docker-compose.test.yml's
  # hive-metastore (Derby-embedded, no external DB needed).
  hive-metastore:
    restart: unless-stopped
    image: apache/hive:4.0.0
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: derby
    volumes:
      - hive_warehouse:/opt/hive/data/warehouse
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/localhost/9083' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 36
      start_period: 90s

  zaychik:
    restart: unless-stopped
    build: ./zaychik
    # Pin a fixed, project-neutral image tag so every compose project (dev
    # `provisa`, isolated `provisa-e2e`, worktrees) reuses the one built image
    # instead of rebuilding a per-project `<project>-zaychik` tag.
    image: zaychik:latest
    ports:
      - "${PROVISA_STORE_BIND_IP:?the address the stores publish on: 127.0.0.1 alone, or the node private address its peers dial}:${ZAYCHIK_PORT:-8480}:8480"
    environment:
      TF_TRINO_HOST: trino
      TF_TRINO_PORT: 8080
      TF_TRINO_SSL: "false"
      TF_FLIGHT_HOST: 0.0.0.0
      TF_FLIGHT_PORT: 8480
      TF_FLIGHT_SSL: "false"
      TF_FLIGHT_AUTH_TYPE: trino
      TF_FLIGHT_BATCH_SIZE: 10000
    depends_on:
      trino:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/8480' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
      start_interval: 2s

  # MinIO is a CORE dependency (REQ-815): Trino's S3-backed iceberg/results catalog is
  # exercised on every app startup, so it belongs with the runtime, not the observability
  # overlay. Observability's otlp2parquet reaches this same minio by service name.
  minio:
    restart: unless-stopped
    # MinIO shut off anonymous pulls entirely (quay.io/minio/minio and docker.io/minio/minio both
    # 401 anonymously on every tag, verified live 2026-09-24 — not just :latest, the whole repo).
    # bitnamilegacy/minio is Bitnami's still-anonymous mirror; this is only our test-harness/
    # quickstart default, never a production requirement — s3.endpoint (docs/deployment.md) lets a
    # real deployment point at any S3-compatible bucket instead. Data dir is /bitnami/minio/data,
    # not /data (Bitnami's own convention — verified live: the image runs as non-root uid 1001).
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: "${PROVISA_MINIO_ROOT_USER:?the MinIO root user, set by the launcher}"
      MINIO_ROOT_PASSWORD: "${PROVISA_MINIO_ROOT_PASSWORD:?the MinIO root password, generated by the launcher}"
    command: server /bitnami/minio/data --console-address ":9001"
    volumes:
      - minio_data:/bitnami/minio/data
    ports:
      - "${PROVISA_STORE_BIND_IP:?the address the stores publish on: 127.0.0.1 alone, or the node private address its peers dial}:${MINIO_PORT:-9000}:9000"
      - "${PROVISA_STORE_BIND_IP:?the address the stores publish on: 127.0.0.1 alone, or the node private address its peers dial}:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  minio-init:
    image: bitnamilegacy/minio-client:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: "${PROVISA_MINIO_ROOT_USER:?the MinIO root user, set by the launcher}"
      MINIO_ROOT_PASSWORD: "${PROVISA_MINIO_ROOT_PASSWORD:?the MinIO root password, generated by the launcher}"
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
        mc mb --ignore-existing local/${PROVISA_OTEL_BUCKET:-provisa-otel} &&
        mc mb --ignore-existing local/provisa-results &&
        mc mb --ignore-existing local/provisa-hive-s3
      "

volumes:
  pg_data:
  redis_data:
  trino_cache:
  trino_worker_cache:
  provisa_exchange:
  trino_logs:
  trino_worker_logs:
  minio_data:
  # The Hive warehouse the metastore and Trino share. A plain named volume here: what an install
  # starts names no path outside the install (#201). A test or development stack that needs the
  # same files on the host adds docker-compose.e2e-mounts.yml, which backs it with a host directory.
  hive_warehouse:
