# Core services only — postgres, redis, trino, zaychik. No observability, no demo.
# Usage: docker compose -f docker-compose.core.yml -f docker-compose.dev-install.yml up
services:
  postgres:
    restart: unless-stopped
    image: postgres:16
    command: >
      postgres
      -c wal_level=logical
      -c max_replication_slots=10
      -c max_wal_senders=10
    environment:
      POSTGRES_DB: provisa
      POSTGRES_USER: provisa
      POSTGRES_PASSWORD: provisa
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provisa"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  pgbouncer:
    restart: unless-stopped
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: provisa
      POOL_MODE: transaction
      LISTEN_PORT: 6432
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  # A fresh provisa_exchange named volume is created root:root; Trino runs as
  # uid 1000 and cannot write FTE (retry-policy=TASK) exchange spooling files,
  # so every query fails with GENERIC_INTERNAL_ERROR. Chown the volume before
  # Trino starts so the mount is writable regardless of volume recreation.
  #
  # ./trino/catalog needs the same treatment for a different reason: with
  # catalog.management=dynamic, CREATE CATALOG writes <name>.properties.tmp into
  # catalog.config-dir through FileCatalogStore. On a Linux host that directory
  # arrives root-owned, so uid 1000 gets "Permission denied" and every catalog
  # registration fails with CATALOG_STORE_ERROR — which took the whole API down
  # at startup, since register_system_catalogs runs inside the lifespan.
  #
  # PROVISA_TRINO_ETC_HOST (catalog/, kafka/, redis/) is the host side of the three
  # directories the APP writes into at runtime — dynamic catalog .properties, and the Kafka and
  # Redis table-description JSON. Sharing the repo's ./trino across pytest sessions made a
  # previous session's catalog outlive it: Trino loaded kafka_pipeline.properties at container
  # start, BEFORE the app rewrote the description file, so the FILE supplier cached a table with
  # no columns and the connector fell back to topic == table name. The isolated stack points this
  # at a per-session directory (tests/itest_stack.py) so each session starts from an empty
  # catalog store and the description files are always written before CREATE CATALOG.
  trino-exchange-init:
    image: busybox
    # One line: a YAML folded scalar keeps the newline before a MORE-indented continuation, so the
    # wrapped form reached busybox sh as two lines and died with `unexpected "&&"`, failing every
    # service that waits on service_completed_successfully.
    command: sh -c "mkdir -p /data/provisa/exchange && chown -R 1000:1000 /data/provisa/exchange && mkdir -p /etc/trino/catalog && chown -R 1000:1000 /etc/trino/catalog"
    volumes:
      - provisa_exchange:/data/provisa/exchange
      - ${PROVISA_TRINO_ETC_HOST:-./trino}/catalog:/etc/trino/catalog
    restart: "no"

  trino:
    restart: unless-stopped
    image: trinodb/trino:481
    mem_limit: 7g
    ports:
      - "${TRINO_PORT:-8080}:8080"
    volumes:
      - ./trino/etc/config.properties:/etc/trino/config.properties:ro
      - ./trino/etc/exchange-manager.properties:/etc/trino/exchange-manager.properties:ro
      - ./trino/etc/jvm.config:/etc/trino/jvm.config:ro
      - ./trino/etc/node.properties:/etc/trino/node.properties:ro
      - ./trino/etc/resource-groups.json:/etc/trino/resource-groups.json:ro
      - ./trino/etc/resource-groups.properties:/etc/trino/resource-groups.properties:ro
      - ${PROVISA_TRINO_ETC_HOST:-./trino}/catalog:/etc/trino/catalog
      - ${PROVISA_TRINO_ETC_HOST:-./trino}/kafka:/etc/trino/kafka:ro
      # Redis table-description files (REQ-251): write_table_definitions writes them here on the
      # host; the connector reads them at redis.table-description-dir (provisa/redis/source.py
      # TABLE_DESCRIPTION_DIR). Without the mount the catalog loads and every table has no columns.
      # Mounted on the worker too — splits read the same descriptions the coordinator planned with.
      - ${PROVISA_TRINO_ETC_HOST:-./trino}/redis:/etc/trino/redis:ro
      # REQ-1730 engine-swap: delta_lake/iceberg/csv/parquet/files are SCAN-mechanism sources
      # DuckDB reads directly off a host path (no ATTACH, no network service) — the engine-swap
      # harness's own registration backend runs natively and can read any host path, but Trino
      # runs in this container and has no such access. Mounted at the SAME absolute path inside
      # the container as on the host (an identity mount, not a translated one): Iceberg's
      # register_table requires the table_location argument to match the location its own
      # metadata.json recorded verbatim (verified live 2026-09-16, ICEBERG_INVALID_METADATA
      # "differs from location provided"), and that metadata is written by pyiceberg running
      # NATIVELY on the host — its recorded location is the host's own absolute path, which only
      # Trino can also resolve if the same absolute path exists inside its container too. Default
      # matches this repo's own checkout path; override via the env var for a different checkout
      # (a different absolute path needs a different mount target, not just a different source).
      - ${PROVISA_E2E_FILE_LAKE_HOST:-/Volumes/main/Users/kennethstott/PycharmProjects/provisa/.e2e-file-lake}:${PROVISA_E2E_FILE_LAKE_HOST:-/Volumes/main/Users/kennethstott/PycharmProjects/provisa/.e2e-file-lake}
      - trino_cache:/data/trino/cache
      - provisa_exchange:/data/provisa/exchange
      - ./observability/trino-otel:/etc/trino/otel:ro
      - trino_logs:/var/log/trino
      - ./trino/plugins/trino-sharepoint:/usr/lib/trino/plugin/trino-sharepoint:ro
      - ./trino/plugins/trino-splunk:/usr/lib/trino/plugin/trino-splunk:ro
      # trino-sharepoint's CERTIFICATE auth reads the .pfx from a host FILE PATH
      # (SharePointAuthFactory.createCertificateAuth, calcite's sharepoint-list module — no inline/
      # base64 alternative exists there, unlike TrinoBigQueryConnector's credentials-key). Same
      # identity-mount reasoning as FILE_LAKE_HOST above: the path Provisa's own connector passes
      # (SP_CERT_PATH, resolved absolute) must resolve inside the container too, or Trino's own
      # FileInputStream throws FileNotFoundException — verified live 2026-09-17. Default matches
      # this repo's own checkout path.
      - ${PROVISA_E2E_SHAREPOINT_CERT_HOST:-/Volumes/main/Users/kennethstott/PycharmProjects/provisa/sharepoint.pfx}:${PROVISA_E2E_SHAREPOINT_CERT_HOST:-/Volumes/main/Users/kennethstott/PycharmProjects/provisa/sharepoint.pfx}:ro
      - ./trino/plugins/trino-file:/usr/lib/trino/plugin/trino-file:ro
      - ./sharepoint.pfx:/certs/sharepoint.pfx:ro
      - ./demo/files:/data/files:ro
      # Shared with the itest hive-metastore so Trino's Hadoop FS reads the local Hive warehouse
      # (file:/opt/hive/data/warehouse) the metastore records for non-S3 hive tables (REQ-1097).
      - hive_warehouse:/opt/hive/data/warehouse
    environment:
      JAVA_TOOL_OPTIONS: "-Dotel.javaagent.enabled=false"
    depends_on:
      postgres:
        condition: service_healthy
      trino-exchange-init:
        condition: service_completed_successfully
      hive-metastore:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "trino --execute 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 42
      start_period: 120s

  trino-worker:
    restart: unless-stopped
    image: trinodb/trino:481
    entrypoint: ["/etc/trino/worker/entrypoint.sh"]
    volumes:
      - ./trino/etc/worker/config.properties:/etc/trino/config.properties:ro
      - ./trino/etc/exchange-manager.properties:/etc/trino/exchange-manager.properties:ro
      - ./trino/etc/jvm.config:/etc/trino/jvm.config:ro
      - ./trino/etc/worker/entrypoint.sh:/etc/trino/worker/entrypoint.sh:ro
      - ${PROVISA_TRINO_ETC_HOST:-./trino}/catalog:/etc/trino/catalog
      - ${PROVISA_TRINO_ETC_HOST:-./trino}/kafka:/etc/trino/kafka:ro
      # Redis table-description files (REQ-251): write_table_definitions writes them here on the
      # host; the connector reads them at redis.table-description-dir (provisa/redis/source.py
      # TABLE_DESCRIPTION_DIR). Without the mount the catalog loads and every table has no columns.
      # Mounted on the worker too — splits read the same descriptions the coordinator planned with.
      - ${PROVISA_TRINO_ETC_HOST:-./trino}/redis:/etc/trino/redis:ro
      - trino_worker_cache:/data/trino/cache
      - provisa_exchange:/data/provisa/exchange
      - ./observability/trino-otel:/etc/trino/otel:ro
      - trino_worker_logs:/var/log/trino
      - ./trino/plugins/trino-sharepoint:/usr/lib/trino/plugin/trino-sharepoint:ro
      - ./trino/plugins/trino-splunk:/usr/lib/trino/plugin/trino-splunk:ro
      - ./trino/plugins/trino-file:/usr/lib/trino/plugin/trino-file:ro
      - ./sharepoint.pfx:/certs/sharepoint.pfx:ro
      - ./demo/files:/data/files:ro
      - hive_warehouse:/opt/hive/data/warehouse
    environment:
      JAVA_TOOL_OPTIONS: "-Dotel.javaagent.enabled=false"
    depends_on:
      trino:
        condition: service_healthy
      trino-exchange-init:
        condition: service_completed_successfully
    deploy:
      replicas: 0

  # Shared Hive Thrift metastore for delta_lake/iceberg Trino catalogs (REQ-1730). Those two source
  # types are bare-path sources (no host/port of their own, REQ-899) — DuckDB reads them straight off
  # disk with no catalog at all, but Trino's real delta_lake/iceberg connectors require a metastore
  # (iceberg.catalog.type=hive_metastore / hive.metastore.uri) to know a schema.table exists at all.
  # This metastore is empty at boot; TrinoIcebergConnector/TrinoDeltaLakeConnector's post_create
  # (provisa/federation/trino_connectors.py) calls the connector's own register_table procedure to
  # attach each source's already-written table files (REQ-1743) the first time it is registered.
  # Shares the same hive_warehouse volume Trino already mounts, same image as docker-compose.test.yml's
  # hive-metastore (Derby-embedded, no external DB needed).
  hive-metastore:
    restart: unless-stopped
    image: apache/hive:4.0.0
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: derby
    volumes:
      - hive_warehouse:/opt/hive/data/warehouse
      # delta_lake's Trino connector validates/creates a registered table's location THROUGH the
      # metastore process itself (not just through Trino's own filesystem access) — confirmed live
      # 2026-09-16: register_table failed HIVE_METASTORE_ERROR "not a directory or unable to create
      # one" until this same mount (already on trino) was added here too. Same identity-mount
      # reasoning as trino's own mount above (see its comment) — same absolute path both sides.
      - ${PROVISA_E2E_FILE_LAKE_HOST:-/Volumes/main/Users/kennethstott/PycharmProjects/provisa/.e2e-file-lake}:${PROVISA_E2E_FILE_LAKE_HOST:-/Volumes/main/Users/kennethstott/PycharmProjects/provisa/.e2e-file-lake}
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/localhost/9083' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 36
      start_period: 90s

  zaychik:
    restart: unless-stopped
    build: ./zaychik
    # Pin a fixed, project-neutral image tag so every compose project (dev
    # `provisa`, isolated `provisa-e2e`, worktrees) reuses the one built image
    # instead of rebuilding a per-project `<project>-zaychik` tag.
    image: zaychik:latest
    ports:
      - "${ZAYCHIK_PORT:-8480}:8480"
    environment:
      TF_TRINO_HOST: trino
      TF_TRINO_PORT: 8080
      TF_TRINO_SSL: "false"
      TF_FLIGHT_HOST: 0.0.0.0
      TF_FLIGHT_PORT: 8480
      TF_FLIGHT_SSL: "false"
      TF_FLIGHT_AUTH_TYPE: trino
      TF_FLIGHT_BATCH_SIZE: 10000
    depends_on:
      trino:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/8480' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
      start_interval: 2s

  # MinIO is a CORE dependency (REQ-815): Trino's S3-backed iceberg/results catalog is
  # exercised on every app startup, so it belongs with the runtime, not the observability
  # overlay. Observability's otlp2parquet reaches this same minio by service name.
  minio:
    restart: unless-stopped
    # Docker Hub's minio/minio repo now denies anonymous pulls ("pull access denied ... may
    # require 'docker login'") — verified live, and CI's "UI e2e (Trino lane)" has failed on this
    # exact error since at least 2026-09-12. quay.io/minio/minio is MinIO's own current public
    # distribution (verified pullable); same for minio/mc below.
    image: quay.io/minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/${PROVISA_OTEL_BUCKET:-provisa-otel} &&
        mc mb --ignore-existing local/provisa-results &&
        mc mb --ignore-existing local/provisa-hive-s3
      "

volumes:
  pg_data:
  redis_data:
  trino_cache:
  trino_worker_cache:
  provisa_exchange:
  trino_logs:
  trino_worker_logs:
  minio_data:
  # Local Hive warehouse shared between the itest hive-metastore and Trino (REQ-1097).
  hive_warehouse:
