apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
data:
  provisa.yaml: |
    sources:
      - id: sales-pg
        type: postgresql
        host: {{ .Release.Name }}-postgresql
        port: {{ .Values.postgresql.port }}
        database: {{ .Values.postgresql.database }}
        username: {{ .Values.postgresql.username }}
        password: ${env:PG_PASSWORD}
      - id: analytics-pg
        type: postgresql
        host: {{ .Release.Name }}-postgresql
        port: {{ .Values.postgresql.port }}
        database: {{ .Values.postgresql.database }}
        username: {{ .Values.postgresql.username }}
        password: ${env:PG_PASSWORD}
      {{- if .Values.mongodb.enabled }}
      - id: reviews-mongo
        type: mongodb
        host: {{ .Release.Name }}-mongodb
        port: {{ .Values.mongodb.port }}
        database: provisa
        username: ""
        password: ""
      {{- end }}

    domains:
      - id: sales-analytics
        description: Sales operational and analytical data
      - id: product-catalog
        description: Product catalog data
      - id: customer-insights
        description: Customer segmentation and analytics

    naming:
      rules:
        - pattern: "^prod_pg_"
          replace: ""

    # REQ-1426: a column's data_type is design-time metadata the config carries; nothing infers it
    # at load, and an untyped column is refused (it stopped the API's boot in the cluster lane).
    tables:
      - source_id: sales-pg
        domain_id: sales-analytics
        schema: public
        table: orders
        governance: pre-approved
        columns:
          - name: id
            data_type: integer
            visible_to: [data_steward, sales_analytics_analyst]
          - name: customer_id
            data_type: integer
            visible_to: [data_steward, sales_analytics_analyst]
          - name: product_id
            data_type: integer
            visible_to: [data_steward]
          - name: amount
            data_type: numeric(10,2)
            visible_to: [data_steward]
          - name: region
            data_type: varchar
            visible_to: [data_steward, sales_analytics_analyst]
          - name: status
            data_type: varchar
            visible_to: [data_steward, sales_analytics_analyst]
          - name: created_at
            data_type: timestamp
            visible_to: [data_steward, sales_analytics_analyst]
      - source_id: sales-pg
        domain_id: sales-analytics
        schema: public
        table: customers
        governance: pre-approved
        columns:
          - name: id
            data_type: integer
            visible_to: [data_steward, sales_analytics_analyst]
          - name: name
            data_type: varchar
            visible_to: [data_steward, sales_analytics_analyst]
          - name: email
            data_type: varchar
            visible_to: [data_steward]
          - name: region
            data_type: varchar
            visible_to: [data_steward, sales_analytics_analyst]
      - source_id: sales-pg
        domain_id: product-catalog
        schema: public
        table: products
        governance: registry-required
        columns:
          - name: id
            data_type: integer
            visible_to: [data_steward, sales_analytics_analyst]
          - name: name
            data_type: varchar
            visible_to: [data_steward, sales_analytics_analyst]
          - name: price
            data_type: numeric(10,2)
            visible_to: [data_steward]
          - name: category
            data_type: varchar
            visible_to: [data_steward, sales_analytics_analyst]
      {{- if .Values.mongodb.enabled }}
      - source_id: reviews-mongo
        domain_id: product-catalog
        schema: provisa
        table: product_reviews
        governance: pre-approved
        columns:
          - name: product_id
            data_type: integer
            visible_to: [data_steward, sales_analytics_analyst]
          - name: reviewer
            data_type: varchar
            visible_to: [data_steward, sales_analytics_analyst]
          - name: rating
            data_type: integer
            visible_to: [data_steward, sales_analytics_analyst]
          - name: comment
            data_type: varchar
            visible_to: [data_steward]
      {{- end }}
      - source_id: analytics-pg
        domain_id: customer-insights
        schema: analytics
        table: customer_segments
        governance: pre-approved
        columns:
          - name: customer_id
            data_type: integer
            visible_to: [data_steward, sales_analytics_analyst]
          - name: segment
            data_type: varchar
            visible_to: [data_steward, sales_analytics_analyst]
          - name: score
            data_type: numeric
            visible_to: [data_steward]

    relationships:
      - id: orders-to-customers
        source_table_id: orders
        target_table_id: customers
        source_column: customer_id
        target_column: id
        cardinality: many-to-one
      - id: customers-to-segments
        source_table_id: customers
        target_table_id: customer_segments
        source_column: id
        target_column: customer_id
        cardinality: one-to-many
      {{- if .Values.mongodb.enabled }}
      - id: orders-to-reviews
        source_table_id: orders
        target_table_id: product_reviews
        source_column: product_id
        target_column: product_id
        cardinality: one-to-many
      {{- end }}

    roles:
      # The standard roles (viewer, analyst, data_steward, org_admin, ...) are Provisa's and are
      # not redefined here: the loader refuses it. This org's analyst is a child of the standard one.
      - id: sales_analytics_analyst
        parents: [analyst]
        description: "Queries the sales analytics domain, each analyst their own region's orders."
        capabilities: [query_development]
        domain_access: [sales-analytics]

    rls_rules:
      - table_id: orders
        role_id: sales_analytics_analyst
        description: "An analyst reads only the orders of their own region."
        filter: "region = current_setting('provisa.user_region')"
    {{- include "provisa.auth" . | nindent 4 }}
