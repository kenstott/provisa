{{- if and .Values.trino.enabled .Values.minio.enabled (not .Values.trino.exchange.s3.endpoint) }}
{{- /*
  Creates the FTE exchange bucket in the in-cluster MinIO, alongside the release's other
  resources. Only runs when the exchange manager targets in-cluster MinIO; for external S3 the
  bucket is expected to already exist.

  Not a post-install hook: Helm runs those only after `helm install --wait` sees every pod Ready,
  and the API pod is not Ready until its boot has provisioned catalogs on Trino, whose
  fault-tolerant execution spools to this bucket. As a hook the bucket never existed when it was
  needed (Trino: NoSuchBucket, rescheduling forever) and the install deadlocked. The name carries
  the revision, since a Job's spec cannot change in place on an upgrade.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-trino-exchange-bucket-{{ .Release.Revision }}
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: trino
        role: exchange-bucket-init
    spec:
      restartPolicy: OnFailure
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mc
          # quay.io/minio/mc and docker.io/minio/mc both now deny anonymous pulls on every tag —
          # see docker-compose.core.yml's minio-init service for the same fix and verification.
          image: docker.io/bitnamilegacy/minio-client:latest
          command: ["/bin/sh", "-c"]
          args:
            - >
              until mc alias set x http://{{ .Release.Name }}-minio:9000 "$ACCESS_KEY" "$SECRET_KEY"; do
                echo "waiting for minio"; sleep 2;
              done &&
              mc mb --ignore-existing x/{{ .Values.trino.exchange.bucket }}
          env:
            - name: ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: minio-access-key
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: minio-secret-key
{{- end }}
