{{- /*
REQ-2072: Trino's internal TLS certificate, generated by the chart: a CA and one certificate for
every node, naming the coordinator Service and any pod in the namespace (each node is addressed by
its pod DNS name). Generated once and kept across upgrades through lookup, so an upgrade does not
rotate it.
*/ -}}
{{- if and .Values.trino.enabled .Values.trino.internalTls }}
{{- $name := printf "%s-trino-internal-tls" .Release.Name -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $keystore := "" -}}
{{- $truststore := "" -}}
{{- if $existing -}}
{{- $keystore = index $existing.data "keystore.pem" | b64dec -}}
{{- $truststore = index $existing.data "truststore.pem" | b64dec -}}
{{- else -}}
{{- $host := include "provisa.trinoCoordinatorHost" . -}}
{{- $ns := .Release.Namespace -}}
{{- $names := list $host (printf "%s.%s" $host $ns) (printf "%s.%s.svc.cluster.local" $host $ns) (printf "*.%s.pod.cluster.local" $ns) -}}
{{- $ca := genCA "provisa-trino-internal-ca" 3650 -}}
{{- $cert := genSignedCert $host nil $names 3650 $ca -}}
{{- $keystore = printf "%s%s" $cert.Cert $cert.Key -}}
{{- $truststore = $ca.Cert -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
type: Opaque
data:
  # The node's certificate and key in one PEM file, as Trino reads a PEM keystore.
  keystore.pem: {{ $keystore | b64enc }}
  truststore.pem: {{ $truststore | b64enc }}
{{- end }}
