{{- /*
REQ-1494: the platform fake key. Generated once (hex of 32 random bytes) and kept across upgrades
through lookup, so every fake stays the same. Provisa takes it as PROVISA_FAKE_KEY and stores it as
the platform's guarded `fakes.key` setting at its first start; the engine reads it, named by its
fingerprint, from the mounted file <fingerprint>.key.
*/ -}}
{{- $name := printf "%s-fake-key" .Release.Name -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $key := "" -}}
{{- if $existing -}}
{{- $key = index $existing.data "key" | b64dec -}}
{{- else -}}
{{- $key = randAlphaNum 64 | sha256sum -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  key: {{ $key | b64enc }}
  # The engine's file: named by the key's fingerprint, the first 16 hex digits of its SHA-256.
  {{ printf "%s.key" (sha256sum $key | trunc 16) }}: {{ $key | b64enc }}
