{{- if .Values.trino.enabled }}
# Workers are stateless — they discover the coordinator via config and do not need
# stable DNS identities. Using Deployment (not StatefulSet) enables correct HPA
# scale-down behaviour and standard rolling updates.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-trino-worker
  labels:
    app: trino
    role: worker
spec:
  replicas: {{ .Values.trino.worker.replicaCount }}
  selector:
    matchLabels:
      app: trino
      role: worker
  template:
    metadata:
      annotations:
        # A subPath mount is never refreshed by the kubelet, so a change to the Trino config
        # (internal TLS turned on, say) rolls the workers through this digest.
        checksum/trino-config: {{ include (print $.Template.BasePath "/trino-configmap.yaml") . | sha256sum }}
      labels:
        app: trino
        role: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: trino
          image: "{{ .Values.trino.image.repository }}:{{ .Values.trino.image.tag }}"
          {{- if .Values.trino.internalTls }}
          {{- include "provisa.trinoInternalTlsStart" . | nindent 10 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: {{ .Values.trino.port }}
          env:
            - name: TRINO_NODE_TYPE
              value: worker
            {{- if .Values.trino.internalTls }}
            {{- include "provisa.trinoInternalTlsEnv" . | nindent 12 }}
            {{- end }}
            - name: PROVISA_TRINO_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "provisa.credentialsSecret" . }}
                  key: trino-shared-secret
            {{- if not .Values.trino.exchange.s3.endpoint }}
            - name: PROVISA_EXCHANGE_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "provisa.credentialsSecret" . }}
                  key: minio-access-key
            - name: PROVISA_EXCHANGE_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "provisa.credentialsSecret" . }}
                  key: minio-secret-key
            {{- end }}
            - name: PROVISA_FAKE_KEY_DIR  # REQ-1494
              value: /etc/provisa/fake-key
          volumeMounts:
            - name: fake-key
              mountPath: /etc/provisa/fake-key
              readOnly: true
            {{- if .Values.trino.internalTls }}
            - name: internal-tls
              mountPath: {{ include "provisa.trinoInternalTlsDir" . }}
              readOnly: true
            {{- end }}
            - name: config
              mountPath: /etc/trino/config.properties
              subPath: worker-config.properties
            - name: exchange
              mountPath: /etc/trino/exchange-manager.properties
              subPath: exchange-manager.properties
          resources:
            {{- toYaml .Values.trino.worker.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /v1/info
              port: {{ .Values.trino.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/info
              port: {{ .Values.trino.port }}
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: fake-key
          secret:
            secretName: {{ .Release.Name }}-fake-key
        {{- if .Values.trino.internalTls }}
        - name: internal-tls
          secret:
            secretName: {{ .Release.Name }}-trino-internal-tls
            defaultMode: 0440
        {{- end }}
        - name: config
          configMap:
            name: {{ .Release.Name }}-trino-config
        - name: exchange
          secret:
            secretName: {{ .Release.Name }}-trino-exchange
{{- if .Values.trino.worker.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-trino-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-trino-worker
  minReplicas: {{ .Values.trino.worker.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.trino.worker.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.trino.worker.autoscaling.targetCPUUtilization }}
{{- end }}
{{- end }}
