# Provisa Helm chart values

# Global settings applied across all workloads
global:
  # imagePullSecrets: [{name: registry-credentials}]
  imagePullSecrets: []
  # storageClass: "" uses cluster default; set to e.g. "fast-ssd" for enterprise clusters
  storageClass: ""
  # Node selector applied to all pods (e.g. {workload: data-platform})
  nodeSelector: {}
  # Tolerations applied to all pods
  tolerations: []

# Deployment choices (parity with the desktop installer wizard, REQ-972..979).
# engine:   trino    — federate through the in-cluster Trino (set trino.enabled=true)
#           external — point at an operator-supplied engine via engineUrl
# obs is configured under `observability` below; demo under `demo`.
deployment:
  engine: trino
  # External engine DSN when engine=external (e.g. postgresql+psycopg://user:pass@host:5432/db).
  engineUrl: ""
  # Optional external materialization-store DSN.
  materializeUrl: ""

# Operator TLS on every in-cluster endpoint (REQ-1226 / REQ-1257 parity with the
# cloud-VM deploy). Supply the cert as a standard kubernetes.io/tls Secret holding
# tls.crt and tls.key — issue it with cert-manager or your PKI. When enabled the
# API and UI containers serve uvicorn over HTTPS and the app's wire-protocol
# listeners (pgwire/bolt/mcp/grpc) start TLS. This is the pod-level listener cert;
# the ingress may terminate its own edge TLS separately (ingress.tls). Unlike the
# VM installer there is NO self-signed generation here — bring a Secret.
tls:
  enabled: false
  # Existing Secret of type kubernetes.io/tls with keys tls.crt and tls.key.
  secretName: provisa-tls

# The deployment's master key (envelope encryption of the secrets vault and of encrypted
# columns). Every API pod must hold the SAME key, and the key must outlive any pod: a key kept
# only in a container's own filesystem is gone when the pod is replaced, and the next pod then
# faces a vault it cannot open and refuses to start.
#
# ONE of the two below is required; the chart fails to render with neither. There is no default
# key and the chart never generates one.
#
#   existingSecret  (recommended, and the only choice that suits more than one replica on
#                    ReadWriteOnce storage) — a Kubernetes Secret you create, holding a 32-byte
#                    key, base64-encoded, under `secretKey`. It is given to the API as
#                    PROVISA_ENCRYPTION_KEY, which the product uses ahead of any key on disk.
#                      kubectl create secret generic provisa-master-key \
#                        --from-literal=master-key="$(openssl rand -base64 32)"
#
#   dataVolume      — a persistent volume mounted at PROVISA_DATA_DIR, where the product keeps
#                    the key it mints at the first stored secret (and its other on-disk state).
#                    Every replica mounts the same claim, so with more than one replica the
#                    claim must be ReadWriteMany.
#
# Both may be set: the Secret's key is used, and the volume keeps the rest of the data directory.
encryption:
  existingSecret: ""
  secretKey: master-key
  dataVolume:
    enabled: false
    # Use a claim you already have; empty creates `<release>-provisa-data`.
    existingClaim: ""
    size: 1Gi
    accessMode: ReadWriteMany
    # "" uses global.storageClass (and that, when empty, the cluster default).
    storageClass: ""
    mountPath: /var/lib/provisa

# Who may sign in (REQ-1265). The provider is chosen here, at install time, and rendered into the
# API's provisa.yaml. Every credential comes from a Kubernetes Secret you create; the chart holds
# none and generates none.
#
#   none   No authentication: every request is trusted. Development only.
#   oidc   A corporate OpenID Connect issuer. Clients present its tokens.
#   ldap   An LDAP or Active Directory server. Users sign in with their directory password.
#   saml   A SAML 2.0 identity provider.
#   local  No identity provider: the break-glass account below is the only sign-in.
#
# REQUIRED: the chart does not render until one is chosen. There is no default, so a deployment
# is never unsecured because nobody decided.
auth:
  provider: ""
  # The role of a signed-in user no role-mapping rule matches. Empty keeps the product default.
  defaultRole: ""
  # Rules mapping a claim to a role, passed through as written, e.g.
  #   - {type: contains, claim: groups, value: data-admins, role: org_admin}
  roleMapping: []
  # Signs browser sessions. Required for ldap, saml, local and whenever breakGlass is set.
  #   kubectl create secret generic provisa-session \
  #     --from-literal=session-secret="$(openssl rand -base64 48)"
  sessionSecret:
    existingSecret: ""
    secretKey: session-secret
  # The platform operator's own account, independent of the identity provider: it still signs in
  # when the provider is down or misconfigured. Optional beside oidc, ldap and saml; required
  # for local.
  #   kubectl create secret generic provisa-break-glass \
  #     --from-literal=password="$(openssl rand -base64 24)"
  breakGlass:
    username: ""
    existingSecret: ""
    secretKey: password
  oidc:
    # The issuer's base URL; its discovery document is read from
    # <issuerUrl>/.well-known/openid-configuration.
    issuerUrl: ""
    clientId: ""
    # The audience tokens must carry. Empty means the client id.
    audience: ""
    # The claim that lists the user's roles. Empty means `roles`.
    roleClaim: ""
  saml:
    # The identity provider's metadata (entity id, sign-on URL, signing certificates).
    idpMetadataUrl: ""
    # The address browsers reach Provisa at. The service provider's entity id, its assertion
    # consumer URL and the sign-in page are derived from it; register
    # <publicUrl>/auth/saml/metadata at the identity provider.
    publicUrl: ""
    # Attributes read from the assertion. An empty user id attribute uses the NameID.
    userIdAttribute: ""
    emailAttribute: ""
    displayNameAttribute: ""
    # Its values become the user's roles.
    groupsAttribute: ""
  ldap:
    # ldap://host:389 or ldaps://host:636
    server: ""
    # Upgrade an ldap:// connection with StartTLS before any bind.
    startTls: false
    # A CA bundle mounted in the API container, for a directory whose certificate the system
    # trust store does not cover.
    caCertFile: ""
    # The service account that searches for users and groups.
    bindDn: ""
    bindPassword:
      existingSecret: ""
      secretKey: bind-password
    # The subtree users are searched under.
    baseDn: ""
    # Finds one user; {username} is the login name. e.g. (uid={username}) or
    # (sAMAccountName={username})
    userFilter: ""
    # The attribute holding the stable user id, e.g. uid or entryUUID.
    userIdAttribute: ""
    emailAttribute: ""
    displayNameAttribute: ""
    # Group membership becomes the user's roles. Set all three or none.
    # groupFilter takes {user_dn} and {username}, e.g. (member={user_dn})
    groupBaseDn: ""
    groupFilter: ""
    groupNameAttribute: ""

provisa:
  replicaCount: 2
  image:
    repository: provisa
    tag: latest
    pullPolicy: IfNotPresent
  port: 8000
  flightPort: 8815
  flightService:
    # ClusterIP  — internal only, use kubectl port-forward for local dev
    # LoadBalancer — cloud provider assigns an external IP (recommended for production)
    # NodePort    — accessible at any node IP on a fixed high port
    type: LoadBalancer
    nodePort: ""  # optional; leave blank to auto-assign when type=NodePort
  # Wire-protocol listeners served by the API container (REQ-1258 parity with the
  # cloud-VM deploy). Each enabled protocol is published as a port on the provisa
  # Service. Ports match the app's default listeners. These are non-HTTP protocols
  # (raw TCP / gRPC) — reach them in-cluster via the ClusterIP Service or expose a
  # per-protocol LoadBalancer/NodePort out of band.
  protocols:
    pgwire:
      enabled: true
      port: 5439
    bolt:
      enabled: true
      port: 7687
    mcp:
      enabled: true
      port: 8009
    grpc:
      enabled: true
      port: 50051
  # Served UI (REQ-1256): a separate Deployment running provisa.ui_server — the SPA
  # static server + API reverse proxy. The browser reaches it through the ingress;
  # the proxy hop to the API uses http/https matching tls.enabled. Uses the provisa
  # image (same wheel bundles the compiled UI).
  ui:
    enabled: true
    replicaCount: 2
    port: 3000
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  env:
    # PROVISA_MODE is the launch's process mode (every | query | coordinator, REQ-1916); unset
    # runs every role in one process. It no longer means production vs test.
    PROVISA_CONFIG: /app/config/provisa.yaml
  configMap: provisa-config
  # Prefer scheduling replicas on different nodes
  podAntiAffinity: true
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilization: 70
  pdb:
    minAvailable: 1

trino:
  enabled: true
  coordinator:
    replicaCount: 1
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi
    readinessProbe:
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 6
    livenessProbe:
      initialDelaySeconds: 60
      periodSeconds: 30
      failureThreshold: 5
    pdb:
      minAvailable: 1
  worker:
    replicaCount: 2
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 10
      targetCPUUtilization: 70
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "4"
        memory: 8Gi
    pdb:
      minAvailable: 1
  image:
    repository: trinodb/trino
    tag: "481"
  port: 8080
  memory:
    maxMemory: 4GB
    maxMemoryPerNode: 2GB
    maxTotalMemory: 8GB
  # Fault-tolerant execution (replaces legacy spill-to-disk). Requires an
  # exchange manager backed by shared object storage (below).
  fte:
    taskMemory: 5GB
  exchange:
    bucket: provisa-exchange
    region: us-east-1
    s3:
      # endpoint empty → use the in-cluster MinIO service (needs minio.enabled).
      # Set to an external S3 endpoint (+accessKey/secretKey) to use managed storage.
      endpoint: ""
      accessKey: ""
      secretKey: ""

postgresql:
  enabled: true
  host: ""  # set if using external PG
  port: 5432
  database: provisa
  username: provisa
  password: provisa  # override via --set or a secrets manager
  storageClass: ""   # "" = use cluster default; set for enterprise (e.g. "standard-ssd")
  storage: 5Gi
  pdb:
    minAvailable: 1

pgbouncer:
  enabled: true
  tag: "latest"
  port: 6432
  poolMode: transaction
  defaultPoolSize: 20
  maxClientConn: 200
  pdb:
    minAvailable: 1

zaychik:
  enabled: true
  image:
    repository: zaychik
    tag: latest
    pullPolicy: IfNotPresent
  port: 8480
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

mongodb:
  enabled: true
  port: 27017
  storageClass: ""
  storage: 2Gi
  pdb:
    minAvailable: 1

minio:
  enabled: true
  tag: "latest"
  accessKey: minioadmin
  secretKey: minioadmin
  storageClass: ""
  storage: 10Gi
  pdb:
    minAvailable: 1

redis:
  enabled: true
  host: ""        # set to external host (ElastiCache, Azure Cache, Memorystore) to skip in-cluster deployment
  port: 6379
  password: "provisa"  # always set; in-cluster Redis starts with --requirepass
  tls: false
  tag: "7.2"
  storageClass: ""
  storage: 1Gi
  pdb:
    minAvailable: 1

# Demo add-on (parity with the desktop wizard's demo toggle). When enabled, the
# demo mock-source servers are deployed and PROVISA_INSTALL_DEMO is set so the app
# seeds the demo domains and the UI opens the guided tour. The demo is a complete,
# fully functional deployment — nothing is limited; set this to false and helm
# upgrade to reconfigure with your own sources later.
demo:
  enabled: false
  graphql:
    image:
      repository: provisa-demo-graphql
      tag: latest
      pullPolicy: IfNotPresent
    port: 4000
  petstore:
    image:
      repository: provisa-demo-petstore
      tag: latest
      pullPolicy: IfNotPresent
    port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

ingress:
  enabled: false
  # className: "" uses the cluster default ingress controller.
  # Set explicitly to match your cluster: "nginx", "traefik", "haproxy", "alb", etc.
  className: ""
  host: provisa.example.com
  tls:
    enabled: false
    secretName: provisa-tls

observability:
  # Three mutually-exclusive modes (parity with the desktop wizard's obs choice):
  #   built-in only — enabled=false, externalEndpoint=""  (deploy nothing, export nowhere)
  #   in-cluster    — enabled=true                        (deploy collector+tempo+prometheus+grafana)
  #   collector     — enabled=false, externalEndpoint set (deploy nothing, export OTLP out)
  enabled: false  # deploy the in-cluster otel-collector + tempo + prometheus + grafana
  # externalEndpoint exports OTLP to an operator-supplied collector when enabled=false
  # (e.g. http://otel-gateway:4317). Ignored when enabled=true (in-cluster wins).
  externalEndpoint: ""
  # Which OTLP transport externalEndpoint speaks: "grpc" (default) or "http/protobuf". The URL
  # cannot say — a gRPC endpoint is written http://host:4317 exactly as an HTTP one is written
  # http://host:4318 (REQ-549). The in-cluster collector is always reached over gRPC.
  externalProtocol: "grpc"

  otelCollector:
    image: otel/opentelemetry-collector-contrib
    tag: "0.99.0"
    otlpGrpcPort: 4317
    otlpHttpPort: 4318
    prometheusPort: 8889
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

  tempo:
    image: grafana/tempo
    tag: "2.4.1"
    httpPort: 3200
    otlpGrpcPort: 4317
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
    persistence:
      enabled: false   # set true for durable trace retention
      size: 5Gi
      storageClass: ""

  prometheus:
    image: prom/prometheus
    tag: "v2.51.2"
    port: 9090
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
    persistence:
      enabled: false   # set true for durable metric retention
      size: 10Gi
      storageClass: ""

  grafana:
    image: grafana/grafana
    tag: "10.4.2"
    port: 3000
    adminPassword: provisa
    service:
      type: ClusterIP
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    persistence:
      enabled: false   # set true to persist dashboards/state
      size: 1Gi
      storageClass: ""
