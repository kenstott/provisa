# Test-only services (kafka, schema-registry, mongodb, elasticsearch, neo4j,
# fuseki) layered onto docker-compose.core.yml INSIDE one isolated compose project
# (see tests/conftest.py::_DockerServiceManager). They share that project's own
# default network, so Trino/debezium reach kafka (kafka:29092) and the others by
# service name — no external dev network. Host ports are ephemeral (${*_PORT},
# allocated per run) and there are no fixed container_names, so the isolated stack
# never collides with the local dev stack or a parallel run.
#
# Usage (core + test in the SAME project):
#   docker compose -p provisa-itest -f docker-compose.core.yml -f docker-compose.test.yml up -d --wait
services:
  kafka:
    hostname: kafka
    restart: unless-stopped
    image: confluentinc/cp-kafka:7.6.0
    # HOST listener published on the same ephemeral port both sides so the advertised
    # address handed back to host clients (localhost:${KAFKA_HOST_PORT}) is reachable.
    ports:
      - "${KAFKA_HOST_PORT:-9092}:${KAFKA_HOST_PORT:-9092}"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,HOST://localhost:${KAFKA_HOST_PORT:-9092}"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,HOST://0.0.0.0:${KAFKA_HOST_PORT:-9092}"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: 3W4Vn7JTS4yUfx7dcvUlPg
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      # Trino's JVM is capped at 8G in an 11.67G Docker VM; without this Kafka's
      # default 1G heap triggers an OOM kill (exit 137) before health-check passes.
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"
    volumes:
      - kafka_test_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:${KAFKA_HOST_PORT:-9092} || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 42
      start_period: 120s

  schema-registry:
    hostname: schema-registry
    restart: unless-stopped
    image: confluentinc/cp-schema-registry:7.6.0
    ports:
      - "${SCHEMA_REGISTRY_PORT:-8081}:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  mariadb:
    restart: unless-stopped
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: provisa
      MARIADB_DATABASE: provisa
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    volumes:
      - mariadb_test_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  tidb:
    restart: unless-stopped
    image: pingcap/tidb:latest
    ports:
      - "${TIDB_PORT:-4000}:4000"
    volumes:
      - tidb_test_data:/tmp/tidb
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/4000' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  cockroachdb:
    restart: unless-stopped
    image: cockroachdb/cockroach:v24.1.0
    command: start-single-node --insecure
    ports:
      - "${COCKROACHDB_PORT:-26257}:26257"
    volumes:
      - cockroach_test_data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health?ready=1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  yugabytedb:
    restart: unless-stopped
    image: yugabytedb/yugabyte:latest
    command: ["bin/yugabyted", "start", "--background=false"]
    ports:
      - "${YUGABYTEDB_PORT:-5433}:5433"
    volumes:
      - yugabyte_test_data:/home/yugabyte/var
    healthcheck:
      test: ["CMD-SHELL", "bin/yugabyted status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 120s

  # Greenplum is Postgres-wire (reuses the postgresql asyncpg driver + pg dialect, REQ-950/1097).
  # datagrip/greenplum:6.8 is a single-node GPDB used for tooling tests: the entrypoint builds the
  # cluster under /home/gpadmin on boot (so NO data volume — a mount there would collide with init),
  # superuser gpadmin (trust auth, no password), default db postgres, master listening on 5432.
  greenplum:
    restart: unless-stopped
    image: datagrip/greenplum:6.8
    ports:
      - "${GREENPLUM_PORT:-15432}:5432"
    healthcheck:
      # gpadmin's login shell is dash — use POSIX `.` (not bash `source`) to load greenplum_path.sh.
      test: ["CMD-SHELL", "su - gpadmin -c '. /opt/greenplum-db-6.8.1/greenplum_path.sh && psql -p 5432 -d postgres -Atc \"select 1\"' 2>/dev/null | grep -qx 1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 40
      start_period: 180s

  sqlserver:
    restart: unless-stopped
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Provisa_2026!"
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - mssql_test_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"Provisa_2026!\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 90s

  oracle:
    restart: unless-stopped
    image: gvenzl/oracle-free:slim
    environment:
      ORACLE_PASSWORD: provisa
    ports:
      - "${ORACLE_PORT:-1521}:1521"
    volumes:
      - oracle_test_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s

  # Connector source (federation-engine → Trino cassandra catalog, not a direct driver).
  # Trino reaches it in-network at cassandra:9042; ${CASSANDRA_PORT} is host-published only
  # for seeding via `docker exec ... cqlsh`. Slow to boot (JVM + gossip), hence start_period.
  cassandra:
    restart: unless-stopped
    image: cassandra:5
    ports:
      - "${CASSANDRA_PORT:-9042}:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: provisa-itest
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      HEAP_NEWSIZE: 128M
      MAX_HEAP_SIZE: 512M
    volumes:
      - cassandra_test_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 90s

  # Direct driver source (REQ-986): the test process reaches ClickHouse over clickhouse-connect HTTP
  # at localhost:${CLICKHOUSE_PORT}, the same client family the ClickHouse federation engine uses.
  # No Trino catalog involved, so the host-published port is the actual data path (not just seeding).
  clickhouse:
    restart: unless-stopped
    image: clickhouse/clickhouse-server:24.3
    ports:
      - "${CLICKHOUSE_PORT:-8123}:8123"
    # The stock image ships default-user.xml restricting `default` to 127.0.0.1/::1, so a
    # host-published connection (arriving via the docker gateway, a non-loopback IP) is rejected
    # with AUTHENTICATION_FAILED. Providing CLICKHOUSE_USER/PASSWORD makes the entrypoint rewrite
    # the default user to allow any network (<ip>::/0</ip>) with this password — conftest exports
    # the matching CLICKHOUSE_PASSWORD so the test client authenticates.
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: provisa
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  # Reached via the DuckDB firebird COMMUNITY EXTENSION (REQ-899), not a Trino connector and not a
  # direct driver — DuckDBFirebirdConnector ATTACHes it in place from an in-process DuckDB connection.
  # ${FIREBIRD_PORT} is host-published for both the in-process DuckDB ATTACH and seeding via
  # `docker exec ... isql`; there is no Trino catalog involved for this source type.
  firebird:
    restart: unless-stopped
    image: jacobalberty/firebird:v4
    ports:
      - "${FIREBIRD_PORT:-3050}:3050"
    environment:
      FIREBIRD_DATABASE: test.fdb
      FIREBIRD_USER: provisa
      FIREBIRD_PASSWORD: provisa
      ISC_PASSWORD: masterkey
    volumes:
      - firebird_test_data:/firebird/data
    healthcheck:
      test: ["CMD-SHELL", "test -f /firebird/data/test.fdb || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Connector source (Trino exasol catalog). Image is linux/amd64 only — unbootable under arm64
  # emulation, so the test is arch-gated (skipif) and this service is dropped from provisioning on
  # non-amd64 hosts (conftest). Trino reaches it in-network at exasol:8563.
  exasol:
    restart: unless-stopped
    image: exasol/docker-db:latest
    privileged: true
    shm_size: 2g
    ports:
      - "${EXASOL_PORT:-8563}:8563"
    # No volume: /exa lives on the container's writable layer and dies with it. exasol is a
    # _HEAVY_MARKERS service, so `_heavy_db_service` SIGKILLs and removes the container after
    # every test that uses it. A *named* volume outlived those removals, so the second test's
    # container booted on an /exa left behind by a killed instance: EXAStorage never finished
    # recovery, the container was reported healthy once and then crash-looped, and exaplus
    # answered "java.net.ConnectException: Connection refused" for the rest of the run. Each
    # per-test container now initialises a clean /exa, which is the state the first (passing)
    # boot always had.
    healthcheck:
      # A TCP probe on 8563 is NOT readiness: the listener opens while EXAStorage is still
      # loading the database, and every login in that window fails with "no-8563". The probe
      # therefore executes a statement — the same exaplus the tests use — so "healthy" means
      # the engine accepts SQL.
      #
      # On failure the probe echoes exaplus's own output. Docker keeps the last five healthcheck
      # invocations' stdout in .State.Health.Log, and that is the ONLY place the reason surfaces:
      # exasol/docker-db writes nothing to the container's stdout, so `docker compose logs exasol`
      # is empty. Discarding this output left a 60-retry CI failure with no reason recorded at all.
      #
      # Exasol 8 always serves TLS, with a self-signed certificate generated per container, so the
      # plain form fails PKIX validation ("unable to find valid certification path"). The driver's
      # documented alternative to importing the CA is pinning the server's SHA-256 fingerprint in
      # the connection string as host/<FINGERPRINT>:port — and exaplus prints exactly that string
      # in the failure, so the probe takes it from there rather than guessing a cert path or an
      # openssl invocation that may not exist in the image. Pinning what this container presents is
      # the point: the certificate is generated at boot, so there is nothing else to pin it to.
      test:
        - "CMD-SHELL"
        - "out=$$(exaplus -c localhost:8563 -u sys -p exasol -sql 'SELECT 1;' -q 2>&1) && exit 0; fp=$$(printf '%s' \"$$out\" | sed -n 's|.*localhost/\\([0-9A-F]\\{64\\}\\):8563.*|\\1|p' | head -1); [ -n \"$$fp\" ] || { printf '%s\\n' \"$$out\" | tail -20; exit 1; }; out=$$(exaplus -c localhost/$$fp:8563 -u sys -p exasol -sql 'SELECT 1;' -q 2>&1) || { printf '%s\\n' \"$$out\" | tail -20; exit 1; }"
      interval: 10s
      timeout: 15s
      retries: 60
      start_period: 180s

  singlestore:
    restart: unless-stopped
    image: ghcr.io/singlestore-labs/singlestoredb-dev:latest
    environment:
      SINGLESTORE_LICENSE: "${SINGLESTORE_LICENSE:-}"
      ROOT_PASSWORD: provisa
    ports:
      - "${SINGLESTORE_PORT:-3306}:3306"
    volumes:
      - singlestore_test_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -pprovisa || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  # Connector source (federation-engine → Trino splunk catalog, not a direct driver — see
  # TrinoSplunkConnector in provisa/federation/trino_connectors.py). Trino reaches it in-network at
  # splunk:8089 over the Splunk management/REST port (the trino-splunk plugin wraps Calcite's Splunk
  # JDBC driver, itself REST-based — no separate "query port"). ${SPLUNK_MGMT_PORT} is host-published
  # so the TEST PROCESS can seed an index/data-model via the same management REST API from outside the
  # container; ${SPLUNK_HEC_PORT} is host-published only for seeding events via HTTP Event Collector.
  # Neither host-published port is used by Trino. Newer Splunk images require BOTH the general terms
  # AND license acceptance env vars or the container refuses to start. Slow to boot (full Splunk
  # instance init), hence the long start_period — the image ships its own readiness script.
  splunk:
    restart: unless-stopped
    image: splunk/splunk:latest
    # splunk/splunk publishes amd64 only — on arm64 the pull fails with "no matching manifest for
    # linux/arm64/v8" and takes the whole lane's `up --wait` down with it. Same pin as druid below.
    platform: linux/amd64
    ports:
      - "${SPLUNK_MGMT_PORT:-8089}:8089"
      - "${SPLUNK_HEC_PORT:-8088}:8088"
    environment:
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_PASSWORD: Provisa_2026!
    volumes:
      - splunk_test_data:/opt/splunk/var
      # The Common Information Model add-on, vendored by scripts/fetch-splunk-cim.sh (Splunkbase
      # app 1621, credentials in .env). It is what makes this fixture resemble a real Splunk
      # deployment: CIM's 23 normalized data models — Authentication, Web, Network_Traffic, … —
      # each surface as one Calcite/Trino table, whereas a stock container offers only its two
      # sample models. Read-write because Splunk writes local/ and metadata/local.meta at load.
      # Absent (script never run) the directory mounts empty; the splunk tests fail loudly on the
      # missing models rather than skipping.
      - ./.splunk-cim/Splunk_SA_CIM:/opt/splunk/etc/apps/Splunk_SA_CIM
      # The technology add-on that maps the fixture's events onto CIM's Authentication model.
      # Splunk_SA_CIM ships the models only; selecting events into one (tag=authentication) and
      # scoping it to an index (the cim_*_indexes macro) is always a separate add-on, in the
      # fixture exactly as in production. See tests/fixtures/splunk_ta_provisa/README.md.
      - ./tests/fixtures/splunk_ta_provisa:/opt/splunk/etc/apps/provisa_cim_ta
    healthcheck:
      test: ["CMD", "/sbin/checkstate.sh"]
      interval: 15s
      timeout: 15s
      retries: 20
      # 180s fits splunk's cold start in isolation (~125s here) but NOT when the
      # default/core lane brings up ~26 amd64-emulated services at once on arm64:
      # under that CPU/mem contention splunk crosses 180s, flips starting->unhealthy,
      # and `up --wait` aborts the whole lane. 420s covers the emulated-under-load case.
      start_period: 420s

  # Reached via the DuckDB `airport` COMMUNITY EXTENSION (REQ-899/1097), not a Trino connector and
  # not a direct driver — DuckDBAirportConnector ATTACHes it in place from an in-process DuckDB
  # connection (same shape as firebird above). airport speaks a bespoke Arrow Flight application
  # protocol (custom DoAction/catalog RPCs) distinct from Flight SQL — zaychik (Flight SQL) cannot
  # serve it, hence this tiny purpose-built server (tests/fixtures/airport_shim, ~30 lines of Go
  # via github.com/hugr-lab/airport-go) exposing a static catalog: schema "test", table "widgets".
  # Plaintext gRPC, no TLS, no auth. ${AIRPORT_PORT} is host-published because the in-process
  # DuckDB connection (running in the pytest process on the HOST, not in this compose network)
  # attaches directly at grpc://localhost:${AIRPORT_PORT} — there is no Trino catalog involved.
  airport-shim:
    restart: unless-stopped
    build: ./tests/fixtures/airport_shim
    image: airport-shim:latest
    ports:
      - "${AIRPORT_PORT:-50051}:50051"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "50051"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # Connector source (federation-engine → Trino pinot catalog, not a direct driver) — REQ-1097.
  # QuickStart -type batch brings up zookeeper+controller+broker+server in ONE container with sample
  # tables (airlineStats, baseballStats, …). Trino reaches the controller in-network at pinot:9000;
  # ${PINOT_CONTROLLER_PORT}/${PINOT_BROKER_PORT} are host-published only for the seeding/wait probe.
  # Controller host default is 9010, NOT 9000: minio (docker-compose.core.yml) publishes host 9000,
  # and the default/core lane leaves both env vars unset, so a 9000 default collides at `up --wait`.
  # In-network is unaffected — Trino/probe still reach the controller at pinot:9000 (container port).
  pinot:
    restart: unless-stopped
    image: apachepinot/pinot:1.2.0
    command: ["QuickStart", "-type", "batch"]
    ports:
      - "${PINOT_CONTROLLER_PORT:-9010}:9000"
      - "${PINOT_BROKER_PORT:-8099}:8099"
    environment:
      JAVA_OPTS: "-Xms256M -Xmx1G"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 120s

  # Druid as a connector-source (federation-engine -> Trino druid catalog, not a direct driver).
  # Trino reaches the BROKER in-network at druid:8082 over Avatica; the source's jdbc_url() emits
  # jdbc:avatica:remote:url=http://druid:8082/druid/v2/sql/avatica/ (see provisa/core/models.py).
  # The official apache/druid image has NO perl, so bin/supervise (the single-container quickstart)
  # cannot run — Druid must be split into its normal processes (each via /druid.sh <service>) with an
  # external ZooKeeper and a Postgres metadata store, exactly the upstream multi-container layout.
  # amd64-only image -> runs under emulation on arm64 (like exasol), hence the generous start_period.
  # ${DRUID_BROKER_PORT}/${DRUID_COORD_PORT} are host-published ONLY so the test process can poll the
  # broker and submit ingestion tasks to the overlord (coordinator asOverlord); Trino never uses them.
  druid-zookeeper:
    restart: unless-stopped
    image: zookeeper:3.8
    environment:
      ZOO_MY_ID: "1"
      ZOO_4LW_COMMANDS_WHITELIST: ruok
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w2 localhost 2181 | grep -q imok"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  druid-metadata:
    restart: unless-stopped
    image: postgres:16
    environment:
      POSTGRES_USER: druid
      POSTGRES_PASSWORD: diurd
      POSTGRES_DB: druid
    volumes:
      - druid_metadata_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U druid -d druid"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  druid-coordinator:
    restart: unless-stopped
    image: &druid_image apache/druid:30.0.0
    platform: linux/amd64
    command: ["coordinator"]
    depends_on:
      druid-zookeeper: {condition: service_healthy}
      druid-metadata: {condition: service_healthy}
    ports:
      - "${DRUID_COORD_PORT:-8081}:8081"
    environment: &druid_env
      ZOOKEEPER: druid-zookeeper
      DRUID_XMS: 256m
      DRUID_XMX: 512m
      DRUID_MAXDIRECTMEMORYSIZE: 512m
      druid_metadata_storage_type: postgresql
      druid_metadata_storage_connector_connectURI: jdbc:postgresql://druid-metadata:5432/druid
      druid_metadata_storage_connector_user: druid
      druid_metadata_storage_connector_password: diurd
      druid_extensions_loadList: '["postgresql-metadata-storage", "druid-multi-stage-query"]'
      druid_storage_type: local
      druid_storage_storageDirectory: /opt/shared/segments
      druid_indexer_logs_type: file
      druid_indexer_logs_directory: /opt/shared/indexing-logs
      druid_processing_numThreads: "1"
      druid_processing_numMergeBuffers: "2"
      druid_processing_buffer_sizeBytes: "50000000"
      druid_server_maxSize: "100000000"
      druid_emitter: noop
      druid_indexer_runner_javaOptsArray: '["-server","-Xms256m","-Xmx256m","-XX:MaxDirectMemorySize=256m","-Duser.timezone=UTC","-Dfile.encoding=UTF-8"]'
      druid_coordinator_asOverlord_enabled: "true"
      druid_coordinator_asOverlord_overlordService: druid/overlord
    volumes:
      - druid_shared:/opt/shared
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/status/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 180s

  druid-historical:
    restart: unless-stopped
    image: *druid_image
    platform: linux/amd64
    command: ["historical"]
    depends_on:
      druid-coordinator: {condition: service_healthy}
    environment: *druid_env
    volumes:
      - druid_shared:/opt/shared
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8083/status/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 180s

  druid-middlemanager:
    restart: unless-stopped
    image: *druid_image
    platform: linux/amd64
    command: ["middleManager"]
    depends_on:
      druid-coordinator: {condition: service_healthy}
    environment: *druid_env
    volumes:
      - druid_shared:/opt/shared
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8091/status/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 180s

  # The BROKER is the query entry point Trino's druid connector attaches to (druid:8082 Avatica).
  # Named "druid" so the Source.host handed to create_catalog resolves it on the isolated network.
  druid:
    restart: unless-stopped
    image: *druid_image
    platform: linux/amd64
    command: ["broker"]
    depends_on:
      druid-coordinator: {condition: service_healthy}
    ports:
      - "${DRUID_BROKER_PORT:-8082}:8082"
    environment: *druid_env
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8082/status/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 180s

  mongodb:
    restart: unless-stopped
    image: mongo:7
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - ./db/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
      - mongo_test_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  elasticsearch:
    restart: unless-stopped
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - es_test_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  neo4j:
    restart: unless-stopped
    image: neo4j:5.19
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: none
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_test_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  fuseki:
    restart: unless-stopped
    image: atomgraph/fuseki:latest
    ports:
      - "${FUSEKI_PORT:-3030}:3030"
    command: ["--mem", "/provisa"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null 'http://localhost:3030/provisa/query?query=ASK%7B%7D' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  # Debezium Connect (REQ-824 CDC). Lives here now (was in dev.yml) so it shares the
  # isolated project's network with kafka + postgres and reaches them by service name.
  debezium-connect:
    restart: unless-stopped
    image: quay.io/debezium/connect:2.7
    ports:
      - "${DEBEZIUM_PORT:-8083}:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: debezium-connect
      CONFIG_STORAGE_TOPIC: debezium_connect_configs
      OFFSET_STORAGE_TOPIC: debezium_connect_offsets
      STATUS_STORAGE_TOPIC: debezium_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # Prometheus for the prometheus-connector integration test (requires_prometheus).
  # Internal-only: Trino's connector reaches it at prometheus:9090 on the project
  # network. Reuses the dev scrape config — its trino:8080 target resolves inside
  # this project, so the `up` metric populates and the test can query it.
  prometheus:
    restart: unless-stopped
    image: prom/prometheus:v2.51.2
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Hive (local warehouse) as a connector-source: Trino reaches the Thrift metastore at
  # hive-metastore:9083 and reads table data from a warehouse volume SHARED with Trino at the same
  # path (/opt/hive/data/warehouse) via Trino's Hadoop-native filesystem (fs.hadoop.enabled). The
  # metastore records file:/ locations; both containers run uid 1000 so the shared volume is writable
  # by each. Seeding is done THROUGH Trino (CREATE TABLE / INSERT) — no beeline needed. The Derby
  # metastore DB is embedded (DB_DRIVER=derby); schema is auto-initialized by the image entrypoint.
  hive-metastore:
    restart: unless-stopped
    image: &hive_image apache/hive:4.0.0
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: derby
    volumes:
      - hive_warehouse:/opt/hive/data/warehouse
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/localhost/9083' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 36
      start_period: 90s

  # Hive on S3 (MinIO) as a connector-source: the same Thrift metastore, but the warehouse lives on
  # s3a://provisa-hive-s3. The metastore is given the bundled hadoop-aws + aws-sdk jars
  # (HIVE_AUX_JARS_PATH) and the S3A settings (db/hive-s3-conf/hive-site.xml) so it can create the
  # database dir on MinIO; Trino reads the data via its NATIVE S3 filesystem. Reuses the core MinIO
  # service (reached at minio:9000 on the project network).
  hive-s3-metastore:
    restart: unless-stopped
    image: *hive_image
    depends_on:
      minio:
        condition: service_healthy
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: derby
      HIVE_CUSTOM_CONF_DIR: /hive-custom-conf
      HIVE_AUX_JARS_PATH: /opt/hadoop/share/hadoop/tools/lib/hadoop-aws-3.3.6.jar:/opt/hadoop/share/hadoop/tools/lib/aws-java-sdk-bundle-1.12.367.jar
    volumes:
      - ./db/hive-s3-conf:/hive-custom-conf:ro
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/localhost/9083' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 36
      start_period: 90s

  # REQ-1069 — the OpenLineage reference server. The metadata-export e2e publishes a snapshot
  # through the real adapter and reads the datasets and column lineage back out of Marquez, so
  # what the suite proves is that a standards-compliant consumer accepts the payload, not that
  # our own mapping agrees with itself.
  marquez-db:
    restart: unless-stopped
    image: postgres:16
    environment:
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
      POSTGRES_DB: marquez
    volumes:
      - marquez_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marquez -d marquez"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  marquez:
    restart: unless-stopped
    image: marquezproject/marquez:0.49.0
    depends_on:
      marquez-db:
        condition: service_healthy
    ports:
      - "${MARQUEZ_PORT:-5000}:5000"
    # The bundled marquez.dev.yml hardcodes the db host as `postgres`, which on this network is
    # Provisa's core Postgres. MARQUEZ_CONFIG points the server at a config that names marquez-db.
    volumes:
      - ./docker/marquez.yml:/usr/src/app/marquez.yml:ro
    environment:
      MARQUEZ_CONFIG: marquez.yml
      POSTGRES_HOST: marquez-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: marquez
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
      MARQUEZ_PORT: 5000
      MARQUEZ_ADMIN_PORT: 5001
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5001/healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # REQ-1069 — OpenMetadata, the asset target. Its own MySQL; search reuses the core-stack
  # `elasticsearch` service rather than a second cluster, because two 512m JVMs plus the
  # OpenMetadata server itself is more than the Docker VM has to spare.
  openmetadata-db:
    restart: unless-stopped
    image: mysql:8.0
    command: --sql_mode=""
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: openmetadata_db
      MYSQL_USER: openmetadata_user
      MYSQL_PASSWORD: openmetadata_password
    volumes:
      - openmetadata_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -ppassword || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  # The server refuses to boot against an unmigrated database, so migrate runs in the same
  # entrypoint rather than in a one-shot sidecar: `up --wait` on a sidecar that exits is the kind
  # of thing that reports the whole stack unhealthy, and OpenMetadata's migrate is idempotent —
  # a second run against an already-migrated schema is a no-op.
  openmetadata:
    restart: unless-stopped
    image: openmetadata/server:1.5.11
    depends_on:
      openmetadata-db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    ports:
      - "${OPENMETADATA_PORT:-8585}:8585"
    entrypoint:
      - /bin/bash
      - -c
      # The start script lives at the image root, not in the /opt/openmetadata workdir the ops
      # script sits under — the image's own CMD is `/openmetadata-start.sh`.
      - ./bootstrap/openmetadata-ops.sh -d migrate && /openmetadata-start.sh
    environment:
      DB_HOST: openmetadata-db
      DB_PORT: 3306
      DB_SCHEME: mysql
      DB_USER: openmetadata_user
      DB_USER_PASSWORD: openmetadata_password
      OM_DATABASE: openmetadata_db
      SEARCH_TYPE: elasticsearch
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: 9200
      ELASTICSEARCH_SCHEME: http
      AUTHENTICATION_PROVIDER: basic
      AUTHENTICATION_PUBLIC_KEYS: '[http://openmetadata:8585/api/v1/system/config/jwks]'
      AUTHENTICATION_AUTHORITY: https://accounts.google.com
      AUTHORIZER_CLASS_NAME: org.openmetadata.service.security.DefaultAuthorizer
      AUTHORIZER_REQUEST_FILTER: org.openmetadata.service.security.JwtFilter
      AUTHORIZER_ADMIN_PRINCIPALS: '[admin]'
      AUTHORIZER_PRINCIPAL_DOMAIN: open-metadata.org
      RSA_PUBLIC_KEY_FILE_PATH: ./conf/public_key.der
      RSA_PRIVATE_KEY_FILE_PATH: ./conf/private_key.der
      JWT_ISSUER: open-metadata.org
      JWT_KEY_ID: Gb389a-9f76-gdjs-a92j-0242bk94356
      PIPELINE_SERVICE_CLIENT_ENABLED: "false"
      OPENMETADATA_HEAP_OPTS: "-Xmx1G -Xms1G"
    healthcheck:
      # wget, not curl: the image ships no curl, so a curl probe fails for the life of the
      # container and the server never reports healthy however long it is given.
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8586/healthcheck || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 180s

  # REQ-1069 — Apache Atlas, the vendor target Microsoft Purview is API-compatible with. The
  # image bundles its own embedded HBase and Solr, so it needs no companion services; that is
  # also why it is slow to become healthy and carries a long start_period.
  atlas:
    restart: unless-stopped
    image: sburn/apache-atlas:latest
    # No `command`: the image's own CMD starts Atlas and then tails its log to keep PID 1 alive.
    # Naming the start script explicitly gets the path wrong for whatever version is tagged.
    ports:
      - "${ATLAS_PORT:-21000}:21000"
    healthcheck:
      # wget, not curl: the image ships no curl. Every Atlas API route requires auth, so the
      # probe carries the image's built-in admin credentials.
      test:
        - "CMD-SHELL"
        - "wget -q -O /dev/null --user=admin --password=admin http://localhost:21000/api/atlas/admin/status || exit 1"
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s

volumes:
  hive_warehouse:
  marquez_db_data:
  openmetadata_db_data:
  kafka_test_data:
  mariadb_test_data:
  tidb_test_data:
  cockroach_test_data:
  yugabyte_test_data:
  mssql_test_data:
  oracle_test_data:
  singlestore_test_data:
  cassandra_test_data:
  firebird_test_data:
  splunk_test_data:
  druid_metadata_data:
  druid_shared:
  mongo_test_data:
  es_test_data:
  neo4j_test_data:
