# provisa-duckdb-ext-warehouse: the warehouse part of provisa-duckdb-ext. One platform's extensions pass PyPI's
# 100 MB per-file limit in one wheel, so they are split; packaging/duckdb-ext/collect.py assigns each one.
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "provisa-duckdb-ext-warehouse"
version = "0.1.2"
description = "DuckDB extension binaries for the Provisa embedded tier: delta, bigquery, snowflake, motherduck, mssql."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["duckdb==1.5.5"]

[tool.setuptools]
packages = ["provisa_duckdb_ext_warehouse"]

[tool.setuptools.package-data]
"provisa_duckdb_ext_warehouse" = ["_ext/**/*"]
