# REQ-1443: one results table per contract. The suite below is the whole registration: the scanned
# target is read back out of meta.dataset (REQ-939), the 16 shipped result columns replace what is
# declared here, and scan_time becomes the watermark so each scan appends and the table IS the scan
# history. The single declared column exists only to carry visible_to.
- alias: pets_quality
  columns:
  - description: Placeholder carrying visible_to; replaced by the shipped results schema at parse
    name: scan_id
    data_type: varchar
    visible_to:
    - org_admin
    - analyst
  cache_ttl: 3600
  change_signal: ttl_probe
  description: "Quality scan results for the pet inventory — one row per check\
    \ per scan, with outcome, metric value and threshold"
  domain_id: pet-store
  dq_contract: |
    name: pets_quality
    meta:
      dataset: provisa/pet_store/pets
    expectations:
      - type: expect_table_row_count_to_be_between
        kwargs:
          min_value: 1
      - type: expect_column_values_to_not_be_null
        kwargs:
          column: name
      - type: expect_column_values_to_be_between
        kwargs:
          column: price
          min_value: 0
      - type: expect_column_values_to_not_be_null
        kwargs:
          column: species
  probe_type: watermark
  schema: quality
  source_id: dq-checker
  table: pets_scan
