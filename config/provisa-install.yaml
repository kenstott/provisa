auth:
  assignments_source: provisa
  default_assignments:
  # REQ-1297: org_admin only. platform_admin is control-plane and confers no data rights, so a
  # default assignment naming it grants nothing and would only surface it as a selectable role.
  - domain_id: '*'
    role_id: org_admin
  provider: none
cache:
  default_ttl: 300
  enabled: true
discovery:
  api_key: ${env:ANTHROPIC_API_KEY:-}
  min_confidence: 0.7
  sample_size: 20
domains:
- description: "Pet store \u2014 Petstore public API (OpenAPI), internal inventory\
    \ (PG), and customer inquiries (SQLite) federated into one virtual database"
  id: pet-store
- description: "Animal shelter staff and breed management \u2014 employees, assignments,\
    \ schedules from GraphQL demo server"
  id: shelter
federation_engine: duckdb
functions:
- arguments:
  - arg_kind: result_set
    columns:
    - name: id
      type: integer
    - name: region
      type: text
    name: input
    type: String
  binding:
    method: /provisa.demo.Enrich/EnrichRows
    target: ${env:DEMO_GRPC_TARGET:-localhost:50071}
  description: "Demo gRPC command that ENRICHES an input relation \u2014 materializes\
    \ the referenced result_set, sends its rows to the service, returns each row plus\
    \ a deterministic embedding + geo marker (REQ-885)"
  domain_id: pet-store
  function_name: enrich_grpc_set
  impl_kind: grpc
  kind: query
  name: enrich_grpc_set
  output_columns:
  - name: embedding
    type: text
  - name: geo
    type: text
  - name: id
    type: integer
  return_schema:
    items:
      properties:
        embedding:
          type: string
        geo:
          type: string
        id:
          type: integer
      type: object
    type: array
  returns: ''
  source_id: ''
  visible_to:
  - org_admin
- binding:
    method: /provisa.demo.RandomData/GetRandomSet
    target: ${env:DEMO_GRPC_TARGET:-localhost:50071}
  description: Demo gRPC command returning a random-valued dataset (set-returning)
    via the JSON unary bridge (REQ-885)
  domain_id: pet-store
  function_name: random_grpc_set
  impl_kind: grpc
  kind: query
  name: random_grpc_set
  return_schema:
    items:
      properties:
        active:
          type: boolean
        amount:
          type: number
        id:
          type: integer
        region:
          type: string
      type: object
    type: array
  returns: ''
  source_id: ''
  visible_to:
  - org_admin
- arguments:
  - name: rows
    type: Int
  - name: seed
    type: Int
  binding:
    callable: demo.py_functions:random_dataset
  description: Demo Provisa-hosted Python command returning a random-valued dataset
    (set-returning, REQ-885)
  domain_id: pet-store
  function_name: random_python_set
  impl_kind: python
  kind: query
  name: random_python_set
  return_schema:
    items:
      properties:
        active:
          type: boolean
        amount:
          type: number
        id:
          type: integer
        region:
          type: string
      type: object
    type: array
  returns: ''
  source_id: ''
  visible_to:
  - org_admin
graphql_remote:
  max_list_depth: 2
  max_list_items: 100
  max_object_depth: 5
metrics:
- datatype: bigint
  description: Number of customer inquiries, re-grainable by any dim_pet attribute
  expression: COUNT(fact_pet_inquiries.id)
  from_fact: fact_pet_inquiries
  name: fact_pet_inquiries_id_count
  visible_to:
  - org_admin
  - analyst
naming:
  domain_prefix: true
  rules: []
observability:
  endpoint: http://localhost:4319
  ops_snapshot_retention_hours: 1
  sample_rate: 1.0
  service_name: provisa
relationships:
- alias: ABOUT_PET
  cardinality: many-to-one
  id: fact_pet_inquiries__pet_id
  source_column: pet_id
  source_table_id: fact_pet_inquiries
  target_column: id
  target_table_id: dim_pet
- alias: DETAIL
  cardinality: many-to-one
  id: find-pets-by-status-to-get-pet-by-id
  source_column: id
  source_table_id: pet_by_status
  target_column: id
  target_table_id: pet_by_id
- alias: HAS_PETS
  cardinality: many-to-one
  id: inquiries-to-pets
  source_column: pet_id
  source_table_id: inquiries
  target_column: id
  target_table_id: pets
- alias: SUBMITTED_BY
  cardinality: many-to-one
  id: inquiries-to-users
  source_column: user_id
  source_table_id: inquiries
  target_column: id
  target_table_id: users
- alias: FOR_PET
  cardinality: many-to-one
  id: order-to-find-pets-by-status
  source_column: petId
  source_table_id: order_by_id
  target_column: id
  target_table_id: pet_by_status
- alias: LISTED_AS
  cardinality: many-to-one
  id: pets-to-find-pets-by-status
  source_column: name
  source_table_id: pets
  target_column: name
  target_table_id: pet_by_status
- alias: HAS_INQUIRY
  cardinality: one-to-many
  id: pets-to-inquiries
  source_column: id
  source_table_id: pets
  target_column: pet_id
  target_table_id: inquiries
- cardinality: many-to-one
  id: pets-to-shelter-assignments
  source_column: breed_name
  source_table_id: pets
  target_column: breed_name
  target_table_id: assignments
- alias: BREED_INFO
  cardinality: many-to-one
  id: pets-to-shelter-breed
  source_column: breed_name
  source_table_id: pets
  target_column: name
  target_table_id: animal_breeds
- alias: ASSIGNMENT_BREED
  cardinality: many-to-one
  graphql_alias: breed
  id: shelter-assignments-to-breeds
  source_column: breed_name
  source_table_id: assignments
  target_column: name
  target_table_id: animal_breeds
- alias: ASSIGNMENT_EMPLOYEE
  cardinality: many-to-one
  id: shelter-assignments-to-employees
  source_column: employee_id
  source_table_id: assignments
  target_column: id
  target_table_id: employees
- cardinality: one-to-many
  id: shelter-assignments-to-pets
  source_column: breed_name
  source_table_id: assignments
  target_column: breed_name
  target_table_id: pets
- alias: PETS_OF_BREED
  cardinality: one-to-many
  id: shelter-breed-to-pets
  source_column: name
  source_table_id: animal_breeds
  target_column: breed_name
  target_table_id: pets
- alias: SUBMITTED
  cardinality: one-to-many
  id: users-to-inquiries
  source_column: id
  source_table_id: users
  target_column: user_id
  target_table_id: inquiries
roles:
- capabilities:
  - query_development
  domain_access:
  - pet-store
  - shelter
  id: analyst
- capabilities:
  - source_registration
  - table_registration
  - create_relationship
  - access_config
  - query_development
  - approve_view
  - approve_relationship
  - create_view
  - column_grant
  - user_management
  - masking_config
  - view_governance
  - full_results
  - usage
  - ad_hoc_query
  - write
  domain_access:
  - '*'
  id: org_admin
# REQ-1297: platform_admin is deliberately absent — seeded by schema.sql with only the control-plane
# bypass capabilities, and role_repo.upsert refuses any redefinition of it.
server:
  limits:
    default_row_limit: 100
    request_timeout: 60
    trino_query_timeout: 120
sources:
- description: "Animal shelter GraphQL API \u2014 staff schedules, breed catalogue,\
    \ and animal assignment records managed by shelter operations"
  id: graphql-demo
  path: ${env:GRAPHQL_DEMO_URL:-http://graphql-demo:4000/graphql}
  type: graphql_remote
- description: "Customer adoption inquiry records \u2014 prospective pet owner interest\
    \ submissions tracked by the front-desk team, including inquiry type, message,\
    \ and resolution status"
  id: inquiries-sqlite
  path: ${env:PROVISA_DEMO_DIR:-./demo/files}/inquiries.sqlite
  type: sqlite
- description: "Internal pet store inventory \u2014 tracks animals available for sale,\
    \ pricing, species, and breed assignments managed by the inventory department"
  id: pet-store-sqlite
  path: ${env:PROVISA_DEMO_DIR:-./demo/files}/pet_store.sqlite
  type: sqlite
- auth_config:
    type: none
  base_url: ${env:PETSTORE_BASE_URL:-http://petstore-mock:8080/api/v3}
  cache_ttl: 300
  description: "Petstore e-commerce API \u2014 browse available animals, check inventory\
    \ levels, retrieve purchase orders, and manage customer accounts through the public\
    \ storefront"
  id: petstore-api
  path: ${env:PETSTORE_BASE_URL:-http://petstore-mock:8080/api/v3}/openapi.json
  type: openapi
