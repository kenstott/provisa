auth:
  assignments_source: provisa
  default_assignments:
  - domain_id: '*'
    role_id: org_admin
  provider: none
cache:
  default_ttl: 300
  enabled: true
discovery:
  api_key: ${env:ANTHROPIC_API_KEY:-}
  min_confidence: 0.7
  sample_size: 20
domains:
- description: "Pet store \u2014 Petstore public API (OpenAPI), internal inventory\
    \ (PG), and customer inquiries (SQLite) federated into one virtual database"
  id: pet-store
- description: "Animal shelter staff and breed management \u2014 employees, assignments,\
    \ schedules from GraphQL demo server"
  id: shelter
federation_engine: duckdb
functions:
- arguments:
  - arg_kind: result_set
    columns:
    - name: id
      type: integer
    - name: region
      type: text
    name: input
    type: String
  binding:
    method: /provisa.demo.Enrich/EnrichRows
    target: ${env:DEMO_GRPC_TARGET:-localhost:50071}
  description: "Demo gRPC command that ENRICHES an input relation \u2014 materializes\
    \ the referenced result_set, sends its rows to the service, returns each row plus\
    \ a deterministic embedding + geo marker (REQ-885)"
  domain_id: pet-store
  function_name: enrich_grpc_set
  impl_kind: grpc
  kind: query
  name: enrich_grpc_set
  output_columns:
  - name: embedding
    type: text
  - name: geo
    type: text
  - name: id
    type: integer
  return_schema:
    items:
      properties:
        embedding:
          type: string
        geo:
          type: string
        id:
          type: integer
      type: object
    type: array
  returns: ''
  source_id: ''
  visible_to:
  - org_admin
- binding:
    method: /provisa.demo.RandomData/GetRandomSet
    target: ${env:DEMO_GRPC_TARGET:-localhost:50071}
  description: Demo gRPC command returning a random-valued dataset (set-returning)
    via the JSON unary bridge (REQ-885)
  domain_id: pet-store
  function_name: random_grpc_set
  impl_kind: grpc
  kind: query
  name: random_grpc_set
  return_schema:
    items:
      properties:
        active:
          type: boolean
        amount:
          type: number
        id:
          type: integer
        region:
          type: string
      type: object
    type: array
  returns: ''
  source_id: ''
  visible_to:
  - org_admin
- arguments:
  - name: rows
    type: Int
  - name: seed
    type: Int
  binding:
    callable: demo.py_functions:random_dataset
  description: Demo Provisa-hosted Python command returning a random-valued dataset
    (set-returning, REQ-885)
  domain_id: pet-store
  function_name: random_python_set
  impl_kind: python
  kind: query
  name: random_python_set
  return_schema:
    items:
      properties:
        active:
          type: boolean
        amount:
          type: number
        id:
          type: integer
        region:
          type: string
      type: object
    type: array
  returns: ''
  source_id: ''
  visible_to:
  - org_admin
graphql_remote:
  max_list_depth: 2
  max_list_items: 100
  max_object_depth: 5
mail:
  base_url: ${env:PROVISA_MAIL_BASE_URL:-http://localhost:5173}
  from_address: ${env:PROVISA_MAIL_FROM:-provisa@localhost}
  provider: ${env:PROVISA_MAIL_PROVIDER:-smtp}
  # REQ-1576: each transport carries its own credentials, so they no longer share one api_key.
  # The Email settings page writes these; the env defaults are what a fresh node boots with.
  resend:
    api_key: ${env:PROVISA_EMAIL_API_KEY:-}
  microsoft365:
    tenant_id: ${env:PROVISA_MAIL_M365_TENANT_ID:-}
    client_id: ${env:PROVISA_MAIL_M365_CLIENT_ID:-}
    client_secret: ${env:PROVISA_MAIL_M365_CLIENT_SECRET:-}
    sender: ${env:PROVISA_MAIL_M365_SENDER:-}
metrics:
- datatype: bigint
  description: Number of customer inquiries, re-grainable by any dim_pet attribute
  expression: COUNT(fact_pet_inquiries.id)
  from_fact: fact_pet_inquiries
  name: fact_pet_inquiries_id_count
  visible_to:
  - org_admin
  - analyst
naming:
  domain_prefix: true
  rules: []
observability:
  endpoint: http://localhost:4319
  ops_snapshot_retention_hours: 1
  protocol: http/protobuf
  sample_rate: 1.0
  service_name: provisa
relationships:
- alias: ABOUT_PET
  cardinality: many-to-one
  id: fact_pet_inquiries__pet_id
  source_column: pet_id
  source_table_id: fact_pet_inquiries
  target_column: id
  target_table_id: dim_pet
- alias: DETAIL
  cardinality: many-to-one
  id: find-pets-by-status-to-get-pet-by-id
  source_column: id
  source_table_id: pet_by_status
  target_column: id
  target_table_id: pet_by_id
- alias: HAS_PETS
  cardinality: many-to-one
  id: inquiries-to-pets
  source_column: pet_id
  source_table_id: inquiries
  target_column: id
  target_table_id: pets
- alias: SUBMITTED_BY
  cardinality: many-to-one
  id: inquiries-to-users
  source_column: user_id
  source_table_id: inquiries
  target_column: id
  target_table_id: users
- alias: FOR_PET
  cardinality: many-to-one
  id: order-to-find-pets-by-status
  source_column: petId
  source_table_id: order_by_id
  target_column: id
  target_table_id: pet_by_status
- alias: LISTED_AS
  cardinality: many-to-one
  id: pets-to-find-pets-by-status
  source_column: name
  source_table_id: pets
  target_column: name
  target_table_id: pet_by_status
- alias: HAS_INQUIRY
  cardinality: one-to-many
  id: pets-to-inquiries
  source_column: id
  source_table_id: pets
  target_column: pet_id
  target_table_id: inquiries
- cardinality: many-to-one
  id: pets-to-shelter-assignments
  source_column: breed_name
  source_table_id: pets
  target_column: breed_name
  target_table_id: assignments
- alias: BREED_INFO
  cardinality: many-to-one
  id: pets-to-shelter-breed
  source_column: breed_name
  source_table_id: pets
  target_column: name
  target_table_id: animal_breeds
- alias: ASSIGNMENT_BREED
  cardinality: many-to-one
  graphql_alias: breed
  id: shelter-assignments-to-breeds
  source_column: breed_name
  source_table_id: assignments
  target_column: name
  target_table_id: animal_breeds
- alias: ASSIGNMENT_EMPLOYEE
  cardinality: many-to-one
  id: shelter-assignments-to-employees
  source_column: employee_id
  source_table_id: assignments
  target_column: id
  target_table_id: employees
- cardinality: one-to-many
  id: shelter-assignments-to-pets
  source_column: breed_name
  source_table_id: assignments
  target_column: breed_name
  target_table_id: pets
- alias: PETS_OF_BREED
  cardinality: one-to-many
  id: shelter-breed-to-pets
  source_column: name
  source_table_id: animal_breeds
  target_column: breed_name
  target_table_id: pets
- alias: SUBMITTED
  cardinality: one-to-many
  id: users-to-inquiries
  source_column: id
  source_table_id: users
  target_column: user_id
  target_table_id: inquiries
roles:
- capabilities:
  - query_development
  domain_access:
  - pet-store
  - shelter
  id: analyst
server:
  limits:
    default_row_limit: 100
    request_timeout: 60
    trino_query_timeout: 120
sources:
# REQ-1443: the demo's data-quality checker. Great Expectations, not Soda: Apache 2.0 carries no
# hosted-service bar, so the same demo config is valid in the cloud plane. The checker connects back
# through Provisa's OWN pgwire endpoint, which is what makes it scan the federated view. Under the
# demo's auth provider (none) pgwire is in trust mode and the startup user IS the role, so the scan
# identity is org_admin: a filtered row set must never produce a silently passing check.
- description: "Great Expectations quality scans \u2014 each results table is one\
    \ suite's per-check outcomes, landed as ordinary source rows"
  id: dq-checker
  mapping:
    database: provisa
    host: ${env:PROVISA_DQ_HOST:-localhost}
    password: ${env:PROVISA_DQ_PASSWORD:-provisa}
    port: ${env:PROVISA_PGWIRE_PORT:-5439}
    user: ${env:PROVISA_DQ_USER:-org_admin}
  type: great_expectations
- description: "Animal shelter GraphQL API \u2014 staff schedules, breed catalogue,\
    \ and animal assignment records managed by shelter operations"
  id: graphql-demo
  path: ${env:GRAPHQL_DEMO_URL:-http://graphql-demo:4000/graphql}
  type: graphql_remote
- description: "Customer adoption inquiry records \u2014 prospective pet owner interest\
    \ submissions tracked by the front-desk team, including inquiry type, message,\
    \ and resolution status"
  id: inquiries-sqlite
  path: ${env:PROVISA_DEMO_DIR:-./demo/files}/inquiries.sqlite
  type: sqlite
- description: "Internal pet store inventory \u2014 tracks animals available for sale,\
    \ pricing, species, and breed assignments managed by the inventory department"
  id: pet-store-sqlite
  path: ${env:PROVISA_DEMO_DIR:-./demo/files}/pet_store.sqlite
  type: sqlite
- auth_config:
    type: none
  base_url: ${env:PETSTORE_BASE_URL:-http://petstore-mock:8080/api/v3}
  cache_ttl: 300
  description: "Petstore e-commerce API \u2014 browse available animals, check inventory\
    \ levels, retrieve purchase orders, and manage customer accounts through the public\
    \ storefront"
  id: petstore-api
  path: ${env:PETSTORE_BASE_URL:-http://petstore-mock:8080/api/v3}/openapi.json
  type: openapi
tables:
- alias: animal_breed
  columns:
  - description: Breed name to fetch - sent to the GraphQL query as an argument
    name: _nf_name
    data_type: varchar
    native_filter_type: query_param
    visible_to: []
  - description: Typical lifespan of the breed in years
    name: avg_lifespan_years
    data_type: integer
    visible_to:
    - org_admin
    - analyst
  - description: How much day-to-day care the breed needs
    name: care_level
    data_type: varchar
    visible_to:
    - org_admin
    - analyst
  - description: Notes shelter staff keep on the breed
    name: description
    data_type: varchar
    visible_to:
    - org_admin
    - analyst
  - description: Breed name, unique across the shelter's catalogue
    name: name
    data_type: varchar
    visible_to:
    - org_admin
    - analyst
  - description: Species the breed belongs to
    name: species
    data_type: varchar
    visible_to:
    - org_admin
    - analyst
  - description: Environment the breed is suited to
    name: typical_habitat
    data_type: varchar
    visible_to:
    - org_admin
    - analyst
  description: "Care requirements and placement context for a single breed \u2014\
    \ use before making a staffing assignment or adoption decision"
  domain_id: shelter
  schema: graphql
  source_id: graphql-demo
  table: animalBreed
- alias: animal_breeds
  columns:
  - description: Typical lifespan of the breed in years
    name: avg_lifespan_years
    data_type: integer
    visible_to:
    - org_admin
    - analyst
  - description: How much day-to-day care the breed needs
    name: care_level
    data_type: varchar
    visible_to:
    - org_admin
    - analyst
  - description: Notes shelter staff keep on the breed
    name: description
    data_type: varchar
    visible_to:
    - org_admin
    - analyst
  - description: Breed name, unique across the shelter's catalogue
    name: name
    data_type: varchar
    visible_to:
    - org_admin
    - analyst
  - description: Species the breed belongs to
    name: species
    data_type: varchar
    visible_to:
    - org_admin
    - analyst
  - description: Environment the breed is suited to
    name: typical_habitat
    data_type: varchar
    visible_to:
    - org_admin
    - analyst
  description: "Full breed catalog \u2014 use to answer what care protocols apply\
    \ and which adopter profiles match each species in custody"
  domain_id: shelter
  schema: graphql
  source_id: graphql-demo
  table: animalBreeds
- columns:
  - description: Breed the employee is assigned to care for
    name: breed_name
    data_type: varchar
    visible_to:
    - org_admin
    - analyst
  - description: Employee the breed is assigned to
    name: employee_id
    data_type: integer
    visible_to:
    - org_admin
    - analyst
  - description: Date the assignment ended, null while it is current
    name: end_date
    data_type: varchar
    visible_to:
    - org_admin
    - analyst
  - description: Identifier of the assignment
    name: id
    data_type: integer
    visible_to:
    - org_admin
    - analyst
  - description: Role the employee holds on that breed
    name: role
    data_type: varchar
    visible_to:
    - org_admin
    - analyst
  - description: Date the assignment started
    name: start_date
    data_type: varchar
    visible_to:
    - org_admin
    - analyst
  description: "Complete accountability map of staff to breeds \u2014 use to spot\
    \ coverage gaps or single-keeper risk across all species"
  domain_id: shelter
  schema: graphql
  source_id: graphql-demo
  table: assignments
- alias: assignments_by_breed
  columns:
  - description: Breed name to filter on - sent to the GraphQL query as an argument
    name: _nf_breed_name
    data_type: varchar
    native_filter_type: query_param
    visible_to: []
  - description: Breed the employee is assigned to care for
    name: breed_name
    data_type: varchar
    visible_to:
    - org_admin
    - analyst
  - description: Employee the breed is assigned to
    name: employee_id
    data_type: integer
    visible_to:
    - org_admin
    - analyst
  - description: Date the assignment ended, null while it is current
    name: end_date
    data_type: varchar
    visible_to:
    - org_admin
    - analyst
  - description: Identifier of the assignment
    name: id
    data_type: integer
    visible_to:
    - org_admin
    - analyst
  - description: Role the employee holds on that breed
    name: role
    data_type: varchar
    visible_to:
    - org_admin
    - analyst
  - description: Date the assignment started
    name: start_date
    data_type: varchar
    visible_to:
    - org_admin
    - analyst
  description: "All staff responsible for a breed \u2014 use to verify minimum keeper\
    \ coverage and identify backup gaps"
  domain_id: shelter
  schema: graphql
  source_id: graphql-demo
  table: assignmentsByBreed
- alias: assignments_by_employee
  columns:
  - description: Employee id to filter on - sent to the GraphQL query as an argument
    name: _nf_employee_id
    data_type: integer
    native_filter_type: query_param
    visible_to: []
  - description: Breed the employee is assigned to care for
    name: breed_name
    data_type: varchar
    visible_to:
    - org_admin
    - analyst
  - description: Employee the breed is assigned to
    name: employee_id
    data_type: integer
    visible_to:
    - org_admin
    - analyst
  - description: Date the assignment ended, null while it is current
    name: end_date
    data_type: varchar
    visible_to:
    - org_admin
    - analyst
  - description: Identifier of the assignment
    name: id
    data_type: integer
    visible_to:
    - org_admin
    - analyst
  - description: Role the employee holds on that breed
    name: role
    data_type: varchar
    visible_to:
    - org_admin
    - analyst
  - description: Date the assignment started
    name: start_date
    data_type: varchar
    visible_to:
    - org_admin
    - analyst
  description: "All breeds a given staff member is accountable for \u2014 use to assess\
    \ workload before adding a new assignment"
  domain_id: shelter
  schema: graphql
  source_id: graphql-demo
  table: assignmentsByEmployee
- columns:
  - description: Whether the pet is currently available for purchase
    name: available
    data_type: bigint
    visible_to:
    - org_admin
    - analyst
  - description: Breed of the pet
    name: breed_name
    data_type: varchar
    visible_to:
    - org_admin
    - analyst
  - description: Identifier of the pet record
    name: id
    data_type: bigint
    visible_to:
    - org_admin
    - analyst
  - description: Name the pet is known by
    name: name
    data_type: varchar
    visible_to:
    - org_admin
    - analyst
  - description: Sale price of the pet in USD
    name: price
    data_type: double
    visible_to:
    - org_admin
    - analyst
  - description: Species of the pet (e.g. dog, cat, bird)
    name: species
    data_type: varchar
    visible_to:
    - org_admin
    - analyst
  description: "Pet dimension \u2014 entity projection of the pet inventory (star-schema\
    \ demo)"
  domain_id: pet-store
  materialize: true
  modeling_role: dimension
  schema: views
  source_id: __derived__
  table: dim_pet
  view_sql: SELECT "id", "name", "species", "breed_name", "price", "available" FROM
    "pet_store_sqlite"."pet_store"."pets"
- columns:
  - description: Employee id to fetch - sent to the GraphQL query as an argument
    name: _nf_id
    data_type: integer
    native_filter_type: query_param
    visible_to: []
  - data_type: jsonb
    description: Employee's contact details
    name: contact
    object_fields:
    - name: email
      type: string
      visible_to:
      - org_admin
      - analyst
    - name: phone
      type: string
      visible_to:
      - org_admin
      - analyst
    - name: ssn
      type: string
      visible_to:
      - org_admin
    visible_to:
    - org_admin
    - analyst
  - description: Shelter department the employee works in
    name: department
    data_type: varchar
    visible_to:
    - org_admin
    - analyst
  - description: Employee's first name
    name: first_name
    data_type: varchar
    visible_to:
    - org_admin
    - analyst
  - description: Date the employee joined the shelter
    name: hire_date
    data_type: varchar
    visible_to:
    - org_admin
    - analyst
  - description: Identifier of the shelter employee
    name: id
    data_type: integer
    visible_to:
    - org_admin
    - analyst
  - description: Employee's last name
    name: last_name
    data_type: varchar
    visible_to:
    - org_admin
    - analyst
  description: "Contact details and department for a single staff member \u2014 use\
    \ to route assignment requests or resolve scheduling conflicts"
  domain_id: shelter
  schema: graphql
  source_id: graphql-demo
  table: employee
- columns:
  - data_type: jsonb
    description: Employee's contact details
    name: contact
    object_fields:
    - name: email
      type: string
      visible_to:
      - org_admin
      - analyst
    - name: phone
      type: string
      visible_to:
      - org_admin
      - analyst
    - name: ssn
      type: string
      visible_to:
      - org_admin
    visible_to:
    - org_admin
    - analyst
  - description: Shelter department the employee works in
    name: department
    data_type: varchar
    visible_to:
    - org_admin
    - analyst
  - description: Employee's first name
    name: first_name
    data_type: varchar
    visible_to:
    - org_admin
    - analyst
  - description: Date the employee joined the shelter
    name: hire_date
    data_type: varchar
    visible_to:
    - org_admin
    - analyst
  - description: Identifier of the shelter employee
    name: id
    data_type: integer
    visible_to:
    - org_admin
    - analyst
  - description: Employee's last name
    name: last_name
    data_type: varchar
    visible_to:
    - org_admin
    - analyst
  description: "All staff eligible for breed assignments \u2014 use to identify who\
    \ can be assigned or scheduled"
  domain_id: shelter
  schema: graphql
  source_id: graphql-demo
  table: employees
- columns:
  - description: Identifier of the inquiry
    name: id
    data_type: bigint
    visible_to:
    - org_admin
    - analyst
  - description: Pet the inquiry is about
    name: pet_id
    data_type: bigint
    visible_to:
    - org_admin
    - analyst
  description: "Inquiry fact at pet grain \u2014 inquiry count per pet, linked to\
    \ dim_pet (star-schema demo)"
  domain_id: pet-store
  materialize: true
  modeling_role: fact
  schema: views
  source_id: __derived__
  table: fact_pet_inquiries
  view_sql: SELECT "pet_id", COUNT("id") AS "id" FROM "inquiries_sqlite"."default"."inquiries"
    GROUP BY "pet_id"
- alias: pet_by_status
  columns:
  - description: Status to filter on - sent to the Petstore API as a query parameter
    name: _nf_status
    data_type: varchar
    native_filter_type: query_param
    visible_to: []
  - description: Store category the pet is listed under
    name: category
    data_type: json
    visible_to:
    - org_admin
    - analyst
  - description: Pet identifier assigned by the Petstore API
    name: id
    data_type: integer
    visible_to:
    - org_admin
    - analyst
  - description: Pet's name as listed in the store
    name: name
    data_type: varchar
    visible_to:
    - org_admin
    - analyst
  - description: Photo URLs published with the listing
    name: photoUrls
    data_type: json
    visible_to:
    - org_admin
    - analyst
  - description: Availability status - available, pending, or sold
    name: status
    data_type: varchar
    visible_to:
    - org_admin
    - analyst
  - description: Tags the store applies to the pet
    name: tags
    data_type: json
    visible_to:
    - org_admin
    - analyst
  description: "Pets available for purchase \u2014 filtered by status from Petstore\
    \ API"
  domain_id: pet-store
  schema: default
  source_id: petstore-api
  table: find_pets_by_status
- alias: pet_by_tags
  columns:
  - description: Tags to filter on - sent to the Petstore API as a query parameter
    name: _nf_tags
    data_type: json
    native_filter_type: query_param
    visible_to: []
  - description: Store category the pet is listed under
    name: category
    data_type: json
    visible_to:
    - org_admin
    - analyst
  - description: Pet identifier assigned by the Petstore API
    name: id
    data_type: integer
    visible_to:
    - org_admin
    - analyst
  - description: Pet's name as listed in the store
    name: name
    data_type: varchar
    visible_to:
    - org_admin
    - analyst
  - description: Photo URLs published with the listing
    name: photoUrls
    data_type: json
    visible_to:
    - org_admin
    - analyst
  - description: Availability status - available, pending, or sold
    name: status
    data_type: varchar
    visible_to:
    - org_admin
    - analyst
  - description: Tags the store applies to the pet
    name: tags
    data_type: json
    visible_to:
    - org_admin
    - analyst
  description: Pets filtered by tag from Petstore API
  domain_id: pet-store
  schema: default
  source_id: petstore-api
  table: find_pets_by_tags
- alias: inventory
  columns:
  - description: Number of pets in the store with that status
    name: count
    data_type: integer
    visible_to:
    - org_admin
    - analyst
  - description: Availability status the count is grouped by
    name: status
    data_type: varchar
    visible_to:
    - org_admin
    - analyst
  description: Pet inventory counts by status from Petstore API
  domain_id: pet-store
  schema: default
  source_id: petstore-api
  table: get_inventory
- alias: order_by_id
  columns:
  - description: Whether the order has been fulfilled
    name: complete
    data_type: boolean
    visible_to:
    - org_admin
    - analyst
  - description: Order identifier assigned by the Petstore API
    name: id
    data_type: integer
    visible_to:
    - org_admin
    - analyst
  - description: Order id to fetch - sent to the Petstore API as a path parameter
    name: orderId
    data_type: integer
    native_filter_type: path_param
    visible_to: []
  - description: Pet the order was placed for
    name: petId
    data_type: integer
    visible_to:
    - org_admin
    - analyst
  - description: Number of animals on the order
    name: quantity
    data_type: integer
    visible_to:
    - org_admin
