sources:
- id: pet-store-pg
  type: postgresql
  host: ${env:POSTGRES_HOST:-postgres}
  port: 5432
  database: provisa
  username: provisa
  password: ${env:PG_PASSWORD:-provisa}
  description: "Internal pet store inventory \u2014 tracks animals available for sale,\
    \ pricing, species, and breed assignments managed by the inventory department"
domains:
- id: pet-store
  description: "Pet store \u2014 internal inventory (PostgreSQL)"
naming:
  domain_prefix: true
  rules: []
tables:
- source_id: pet-store-pg
  domain_id: pet-store
  schema: pet_store
  table: pets
  description: "Pet inventory \u2014 managed by the inventory department"
  columns:
  - name: id
    data_type: integer
    visible_to:
    - analyst
    - org_admin
  - name: name
    data_type: varchar(100)
    visible_to:
    - analyst
    - org_admin
  - name: species
    data_type: varchar(50)
    visible_to:
    - analyst
    - org_admin
  - name: breed_name
    data_type: varchar(100)
    visible_to:
    - analyst
    - org_admin
  - name: price
    data_type: decimal(10,2)
    visible_to:
    - org_admin
  - name: available
    data_type: boolean
    visible_to:
    - analyst
    - org_admin
roles:
# REQ-1297: platform_admin is deliberately absent. schema.sql seeds it with exactly
# ['admin','superadmin'] — control-plane bypass only — and role_repo.upsert refuses to overwrite that
# row. It holds no data capabilities, appears in no column grant, and is stripped from the resolved
# assignment set in every tenant org.
# org_admin: full administrative power WITHIN a single org, deliberately WITHOUT the global
# 'admin'/'superadmin' capability (which bypass every capability + org check). Isolation comes from
# active-org + membership confinement (middleware), so a tenant's first admin administers only its org.
- id: org_admin
  capabilities:
  - source_registration
  - table_registration
  - create_relationship
  - access_config
  - query_development
  - approve_view
  - approve_relationship
  - create_view
  - column_grant
  - user_management
  - masking_config
  - view_governance
  - full_results
  - usage
  - ad_hoc_query
  - write
  domain_access:
  - '*'
- id: analyst
  capabilities:
  - query_development
  domain_access:
  - pet-store
cache:
  enabled: true
  default_ttl: 300
discovery:
  sample_size: 20
  min_confidence: 0.7
  # Empty default so a keyless install boots (AI discovery stays off) instead of the API
  # crashing at startup when ANTHROPIC_API_KEY is unset (secret resolution raises KeyError).
  api_key: ${env:ANTHROPIC_API_KEY:-}
observability:
  endpoint: ''
  service_name: provisa
  sample_rate: 1.0
auth:
  provider: none
