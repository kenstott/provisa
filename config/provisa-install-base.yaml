sources:
- id: pet-store-pg
  type: postgresql
  host: ${env:POSTGRES_HOST:-postgres}
  port: 5432
  database: provisa
  username: provisa
  password: ${env:PG_PASSWORD:-provisa}
  description: "Internal pet store inventory \u2014 tracks animals available for sale,\
    \ pricing, species, and breed assignments managed by the inventory department"
domains:
- id: pet-store
  description: "Pet store \u2014 internal inventory (PostgreSQL)"
naming:
  domain_prefix: true
  rules: []
tables:
- source_id: pet-store-pg
  domain_id: pet-store
  schema: pet_store
  table: pets
  description: "Pet inventory \u2014 managed by the inventory department"
  columns:
  - name: id
    data_type: integer
    visible_to:
    - analyst
    - org_admin
  - name: name
    data_type: varchar(100)
    visible_to:
    - analyst
    - org_admin
  - name: species
    data_type: varchar(50)
    visible_to:
    - analyst
    - org_admin
  - name: breed_name
    data_type: varchar(100)
    visible_to:
    - analyst
    - org_admin
  - name: price
    data_type: decimal(10,2)
    visible_to:
    - org_admin
  - name: available
    data_type: boolean
    visible_to:
    - analyst
    - org_admin
roles:
# REQ-1297/REQ-1349: platform_admin and org_admin are both absent by design. schema.sql seeds each
# — platform_admin control-plane only, org_admin with the org-scoped rights including org_settings
# and observability — and role_repo.upsert refuses to overwrite either row. A block here loads AFTER
# apply_tenancy_role_grants and overwrites capabilities wholesale, which is how org_admin lost both
# org-scoped rights and its Admin tab.
- id: analyst
  capabilities:
  - query_development
  domain_access:
  - pet-store
cache:
  enabled: true
  default_ttl: 300
discovery:
  sample_size: 20
  min_confidence: 0.7
  # Empty default so a keyless install boots (AI discovery stays off) instead of the API
  # crashing at startup when ANTHROPIC_API_KEY is unset (secret resolution raises KeyError).
  api_key: ${env:ANTHROPIC_API_KEY:-}
observability:
  endpoint: ''
  service_name: provisa
  sample_rate: 1.0
auth:
  provider: none
# REQ-1330: outbound mail behind the EmailSender port; see provisa-install.yaml.
mail:
  provider: ${env:PROVISA_MAIL_PROVIDER:-smtp}
  from_address: ${env:PROVISA_MAIL_FROM:-provisa@localhost}
  base_url: ${env:PROVISA_MAIL_BASE_URL:-http://localhost:5173}
  # REQ-1576: per-transport credentials; the settings page writes the rest.
  resend:
    api_key: ${env:PROVISA_EMAIL_API_KEY:-}
  microsoft365:
    tenant_id: ${env:PROVISA_MAIL_M365_TENANT_ID:-}
    client_id: ${env:PROVISA_MAIL_M365_CLIENT_ID:-}
    client_secret: ${env:PROVISA_MAIL_M365_CLIENT_SECRET:-}
    sender: ${env:PROVISA_MAIL_M365_SENDER:-}
