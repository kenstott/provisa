# REQ-2068: the regions sandbox tier's own deployment config -- the tier that serves the demos whose
# models select regions (the retail demo), and the bundle build's seeding node of each region.
#
# The platform declares eu and us; the node runs as one of them (PROVISA_REGION). Its boot org
# (ORG_ID, never the deployment's own org, whose model selects no region) selects both, each keeping
# its replicas, views, state and record in that region's own PostgreSQL (a captive one per region,
# PROVISA_DEMO_<REGION>_PG_URL); it holds no sources or tables of its own. Each demo's template and
# sandboxes are orgs of their own, modelled by the demo's config.yaml.

federation_engine: duckdb
multitenancy: true

platform:
  regions:
    - { id: eu, address: "${env:PROVISA_DEMO_EU_ADDRESS}" }
    - { id: us, address: "${env:PROVISA_DEMO_US_ADDRESS}" }

stores:
  - { id: eu_engine, url: "duckdb:///${env:PROVISA_DATA_DIR}/regions-tier-eu-engine.duckdb", kind: duckdb }
  - { id: us_engine, url: "duckdb:///${env:PROVISA_DATA_DIR}/regions-tier-us-engine.duckdb", kind: duckdb }
  - { id: eu_data, url: "${env:PROVISA_DEMO_EU_PG_URL}" }
  - { id: us_data, url: "${env:PROVISA_DEMO_US_PG_URL}" }
  - { id: cache, url: "${env:REDIS_URL}" }

regions:
  - { id: eu, engine: eu_engine, replicas: eu_data, views: eu_data, cache: cache, state: eu_data, record: eu_data }
  - { id: us, engine: us_engine, replicas: us_data, views: us_data, cache: cache, state: us_data, record: us_data }

auth:
  # As the sandbox tier's (config/provisa-install.yaml): its provider is the one the deployment's
  # setup or Admin › Settings writes here.
  assignments_source: provisa
  default_assignments:
  - domain_id: '*'
    role_id: org_admin
  provider: none

naming:
  domain_prefix: false
  rules: []

cache:
  enabled: false

domains:
  - { id: ops, description: "the regions sandbox tier's own" }

roles: []
sources: []
tables: []
