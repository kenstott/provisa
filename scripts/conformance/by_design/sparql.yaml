# The W3C SPARQL 1.1 suite's cases skipped by design (REQ-2167, amended 2026-10-27 and 2026-10-28),
# never counted as failed: each group quotes the rule that excludes it. scripts/conformance/by_design.py.
#
# Only an update whose whole subject is a named graph is here: an INSERT or DELETE that could map
# onto a governed table write stays failed until it does. The groups match the suite's directory
# of graph-management tests and the refusal naming them, so a test that stops being refused this
# way, or a directory the suite repurposes, is never skipped by accident.

- group: Graph management updates
  requirement: REQ-2167
  decision: >-
    "a write needing structure the model lacks is refused by name": ADD, COPY, MOVE, CLEAR, DROP
    and CREATE act on named graphs, and the model has tables, not graphs. Move rows with a
    governed write to the tables instead.
  case: "^(add|copy|move|clear|drop)::"
  reason: "acts on a named graph"

- kind: adapted
  group: Datasets declared as fixture tables
  became: >-
    the test's data file is declared in the fixture model, a table per class with a column per
    literal predicate and a relationship per resource predicate, in a domain and role of its own.
    The query's constant IRIs are mapped onto the model's and the answer's back, and a variable
    predicate is kept by a FILTER from what the tables add (the key column, an untyped table's
    class); nothing else of the query changes.
  case: "^(?!syntax-|add::|copy::|move::|clear::|drop::|basic-update::|delete|update-silent::)"
