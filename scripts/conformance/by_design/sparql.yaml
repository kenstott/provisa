# The W3C SPARQL 1.1 suite's cases skipped by design (REQ-2167, amended 2026-10-27 and 2026-10-28),
# never counted as failed: each group quotes the rule that excludes it. scripts/conformance/by_design.py.
#
# Only an update refused because it acts on the model's own graph, or LOADs from outside, is here.
# REQ-2135, amended 2026-11-23 (282097af2d): any graph IRI outside the model's base IRI is a
# session graph, and DROP, CLEAR, CREATE, COPY, MOVE and ADD work on session graphs, so a case on
# such a graph is no longer here -- it passes or stays failed. A graph IRI under the base, DEFAULT
# and ALL name the model's own graph and are refused by name. LOAD reads a document from outside
# the session and stays refused by name (REQ-2135, amended 2026-11-22 in 04536b79c3). Each group
# matches its refusal, so a test that stops being refused this way is never skipped by accident.

- group: Graph management of the model's own graph
  requirement: REQ-2135, REQ-2167
  decision: >-
    "a graph IRI under the base is refused by name": a graph IRI under the model's base IRI,
    DEFAULT and ALL name the model's own graph, whose rows are written as rows, without a graph.
    Session objects are kept in a graph outside the base.
  reason: "^400: .* names the model's own graph, under its base IRI"

- group: LOAD
  requirement: REQ-2135, REQ-2167
  decision: >-
    "Graph management (DROP, CLEAR, LOAD, ...) is refused by name; its W3C cases are listed as by
    design", amended to leave LOAD alone refused: LOAD reads a document from outside the session.
    Insert its triples with INSERT DATA instead.
  reason: "^400: LOAD reads a document from outside the session"

- kind: adapted
  group: Datasets declared as fixture tables
  became: >-
    the test's data file is declared in the fixture model, a table per class with a column per
    literal predicate and a relationship per resource predicate, in a domain and role of its own.
    The query's constant IRIs are mapped onto the model's and the answer's back, and a variable
    predicate is kept by a FILTER from what the tables add (the key column, an untyped table's
    class); nothing else of the query changes.
  case: "^(?!syntax-|add::|copy::|move::|clear::|drop::|basic-update::|delete|update-silent::)"
