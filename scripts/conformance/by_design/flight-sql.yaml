# The ADBC driver validation suite against Provisa's Flight SQL endpoint (REQ-2167, amended
# 2026-10-27 and 2026-10-28). scripts/conformance/by_design.py. Each case is passed, skipped by
# design (a group below citing its requirement and decision), or failed. A case whose setup
# creates its table is adapted, not excluded: the table is declared in the job's fixture model
# (flightsql/fixtures.py) and the case runs and counts, marked on the page with what its setup
# became. A case whose client driver never sends what it needs -- it refuses before any request,
# or drops what it was given -- is skipped by design (REQ-2167, amended), its client group citing
# the driver's evidence and a workaround.

- kind: adapted
  group: Type cases' tables
  became: >-
    Its setup_query runs in the job's PostgreSQL (schema conformance) before the instance starts,
    and the table it creates is declared in the fixture model's conformance domain, where the
    case's own query reads it. binary's setup is written in PostgreSQL's spelling (BYTEA for BLOB,
    '\x..'::bytea for X'..'). Its table is listed with its own columns and then the two link
    columns every model table carries (_name_, _domain_), so the schema the case expects its
    table listed with has them too (flightsql/queries/type/select/<case>.txtcase, generated from
    the suite's case and checked against it).
  case: "TestQuery::test_(query|execute_schema|get_table_schema)\\[provisa:flightsql:type/select/(?!timestamp)"

- kind: adapted
  group: Timestamp cases' tables
  became: >-
    The ten precisions of timestamp and of timestamptz each create test_timestamp or
    test_timestamptz with different contents, so each case's table is named for the case
    (test_timestamp3tz, ...), declared in the fixture model and seeded by its setup; the case's
    query and metadata name it, and its listed schema has the link columns every model table
    carries (flightsql/queries/type/select/<case>.txtcase, generated from the suite's case and
    checked against it).
  case: "TestQuery::test_(query|execute_schema|get_table_schema)\\[provisa:flightsql:type/select/timestamp"

- kind: adapted
  group: get_objects table
  became: >-
    The table the suite would ingest (ints INTEGER, strs TEXT; rows (1, NULL), (NULL, 'foo'),
    (42, 'spam')) is getobjects_fixture, declared in the fixture model's conformance domain (the
    suite's would be in the current schema, public), so the tests that look for it in the
    current schema look in conformance; and it is listed with the link columns every model table
    carries after its own, which the tests that list its exact columns expect too. Dropping a
    table is a no-op, as the model holds every table.
  case: "TestConnection::test_get_objects_(table|column)_"

- kind: adapted
  group: Statement tests' tables
  became: >-
    sample_table (id INTEGER, value TEXT) and test_rows_affected (id INTEGER) are seeded empty in
    the job's PostgreSQL and declared in the fixture model, writable by org_admin; each test's
    CREATE TABLE is replaced by DELETE FROM the table, which leaves it empty as the CREATE did,
    and its writes run through the governed pipeline.
  case: "TestStatement::test_(execute_schema_noalias|parameter_null_typed|rows_affected)\\["

- kind: adapted
  group: Secondary schema's table
  became: >-
    test_get_table_schema_schema (spam INTEGER, eggs TEXT), which the case would create in the
    secondary schema, is declared in the fixture model's conformance domain -- the secondary
    schema, beside the current schema public -- and listed with the link columns every model
    table carries after its own, which the case's assertion expects too.
  case: "TestConnection::test_get_table_schema_schema\\["

- kind: adapted
  group: Ingest tests' tables
  became: >-
    Each table an ingest test would create is declared in the fixture model, with its case's
    input columns as PostgreSQL types, seeded empty and writable by org_admin. The test's setup
    ingest that would create it (mode create; replace for test_many_columns) appends to the
    declared table instead (mode create_append); its other ingests are made as it makes them, and
    every row is written through the governed pipeline. A temporary ingest lands in the session's
    own temporary table, which the session reads and lists under pg_temp, and which ends with it.
  case: "TestIngest::test_(create|create_dictionary|append|createappend|create_conflict|append_schema_mismatch|createappend_schema_mismatch|create_multiple_batches|create_large_batch|create_long_values|many_columns|schema|ingest_then_query|temporary|temporary_get_objects)\\["

- kind: client
  group: Bind with no Prepare
  requirement: REQ-2167
  decision: >-
    The client refuses before sending any request. ADBC apache-arrow-adbc-24 (adbc-driver-flightsql 1.12.0, Go driver at commit a3f81c6feb11):
    go/adbc/driver/flightsql/flightsql_statement.go:720-724 (Bind) only stages the values on
    the statement when no statement is prepared, and :526-531 (ExecuteQuery) and :602-607
    (ExecuteUpdate) then return INVALID_STATE "[Flight SQL Statement] must set
    IngestTargetTable before bulk ingestion" for a staged bind with no ingest target, before any
    RPC. test_ingest_then_query meets the same check: SetSqlQuery (:495) clears the ingest target
    but keeps the values the ingest staged.
  client: adbc-driver-flightsql 1.12.0 (the Go driver)
  behavior: >-
    Refuses the Bind: "[Flight SQL Statement] must set IngestTargetTable before bulk ingestion"
    (INVALID_STATE).
  evidence: >-
    flightsql_statement.go:720-724 and :526-531 at apache-arrow-adbc-24; against a probe Flight
    SQL server that records every call, the same Bind sends no RPC.
  workaround: >-
    Prepare the statement before binding (the DB-API cursor's execute does), as
    tests/unit/test_flightsql_prepared.py does against Provisa.
  reason: "must set IngestTargetTable before"
  case: "^tests\\.test_query\\.TestQuery::(test_query\\[provisa:flightsql:type/bind/\\w+\\]|test_query_bind_dictionary\\[provisa:flightsql:type/bind/(large_)?string\\]|test_query_bind_stream\\[provisa:flightsql:type/bind/(large_)?string-(single_batch|multiple_batches|multiple_batches_with_empty)\\])$|^tests\\.test_ingest\\.TestIngest::test_ingest_then_query\\[provisa:flightsql:ingest/string\\]$"

- kind: client
  group: Bind before Prepare
  requirement: REQ-2167
  decision: >-
    The client drops the bound values. ADBC apache-arrow-adbc-24 (adbc-driver-flightsql 1.12.0, Go driver at commit a3f81c6feb11):
    go/adbc/driver/flightsql/flightsql_statement.go:720-724 (Bind) stages values bound before
    Prepare on the statement; Prepare (:659-687) creates the prepared statement (:686) without
    them, and ExecuteQuery runs the prepared statement (:555-556); nothing else reads the staged
    values but bulk ingest (flightsql_bulk_ingest.go:109-152). The server receives no parameters.
  client: adbc-driver-flightsql 1.12.0 (the Go driver)
  behavior: >-
    Accepts the Bind and keeps the values, then sends the statement it prepares without them.
  evidence: >-
    flightsql_statement.go:720-724, :659-687 and :555-556 at apache-arrow-adbc-24; against
    Provisa's server, set_sql_query, bind, prepare and execute send no DoPut: the server runs
    "SELECT 1 + $1" with no values, and its engine answers "Values were not provided".
  workaround: >-
    Bind after Prepare, as the suite's other bind tests do.
  reason: "Values were not provided for the following prepared statement parameter"
  case: "^tests\\.test_statement\\.TestStatement::test_parameter_execute\\[provisa:flightsql\\]$"

- group: Times and timestamps beyond microseconds
  requirement: REQ-1961
  decision: >-
    A time or timestamp column is read at the precision its source declares. PostgreSQL holds at
    most six digits: it declares a TIME(7) to (9) or TIMESTAMP(7) to (9) column with six, and a
    nanosecond value ingested lands as microseconds, so the column holds microseconds and is read
    as microseconds, where the suite expects nanoseconds.
  reason: "(timestamp|time64)\\[ns.*(timestamp|time64)\\[us"
  case: "\\[provisa:flightsql:(type/select/timestamp[789](tz)?|ingest/(timestamp(tz)?|time)_ns)\\]"

- group: One catalog per connection
  requirement: REQ-588
  decision: >-
    Every catalog a client sees is the served database: a connection is served one catalog, so there is no second catalog to set as current or to
    read a table's schema from.
  case: "TestConnection::test_(set_current_catalog|get_table_schema_catalog)\\["

- kind: client
  group: GetStatistics not provided
  requirement: REQ-2167
  skipped: true
  decision: >-
    The client provides no GetStatistics. ADBC apache-arrow-adbc-24 (adbc-driver-flightsql 1.12.0, Go driver at commit a3f81c6feb11): go/adbc/pkg/flightsql/driver.go:1170-1172
    answers NOT_IMPLEMENTED "AdbcConnectionGetStatistics: not supported", since the Flight SQL
    connection does not implement adbc.ConnectionGetStatistics (go/adbc/adbc.go:846); Flight
    SQL itself defines no statistics command. The suite gates the case on the feature
    (adbc_drivers_validation/tests/connection.py:1089, requires_features
    connection_get_statistics, validation at 9f9f441), which no Flight SQL driver can claim.
  client: adbc-driver-flightsql 1.12.0 (the Go driver)
  behavior: >-
    Provides no GetStatistics; no request reaches the server.
  evidence: >-
    go/adbc/pkg/flightsql/driver.go:1170-1172 at apache-arrow-adbc-24.
  workaround: >-
    Read a table's row count with a statement (SELECT count(*) ...).
  case: "^tests\\.test_connection\\.TestConnection::test_get_statistics\\[provisa:flightsql\\]$"

- kind: client
  group: GetObjects reports no constraints
  requirement: REQ-2167
  skipped: true
  decision: >-
    The client never fetches a table's keys in GetObjects. ADBC apache-arrow-adbc-24 (adbc-driver-flightsql 1.12.0, Go driver at commit a3f81c6feb11):
    go/adbc/driver/flightsql/flightsql_connection.go:882 (GetObjectsTables) reads GetTables
    alone, and :939-943 builds each table from its name, type and schema, with no constraints, so
    table_constraints is empty whatever the server serves. The suite skips each constraints case
    for a driver that does not claim it (adbc_drivers_validation/tests/connection.py:91-102,
    validation at 9f9f441).
  client: adbc-driver-flightsql 1.12.0 (the Go driver)
  behavior: >-
    Reports no table constraints in GetObjects.
  evidence: >-
    flightsql_connection.go:882 and :939-943 at apache-arrow-adbc-24; Provisa serves the keys
    over GetPrimaryKeys, GetImportedKeys, GetExportedKeys and GetCrossReference
    (tests/unit/test_flightsql_catalog.py), and the driver sends none of them during GetObjects.
  workaround: >-
    Read the keys with the key commands (GetPrimaryKeys and GetImportedKeys over Flight SQL).
  case: "^tests\\.test_connection\\.TestConnection::test_get_objects_constraints_(check|foreign|primary|unique)\\[provisa:flightsql\\]$"

- group: Nothing defined through a query protocol
  requirement: REQ-1926
  decision: >-
    Nothing is defined through a query protocol; an object is defined in the model. An ingest
    that replaces a table drops and defines it again, so it is refused on a table the model
    declares, and one that creates a table the model does not declare is refused too.
  reason: "defined in the model"
  case: "TestIngest::test_(replace|replace_noop|replace_schema)\\["

- group: One catalog to ingest into
  requirement: REQ-588
  decision: >-
    Every catalog a client sees is the served database: a connection is served one catalog, so
    there is no second catalog to ingest into.
  case: "TestIngest::test_(catalog|replace_catalog)\\["

- group: Numeric of negative scale
  requirement: REQ-1961
  decision: >-
    The model records a numeric column's precision and scale, a scale of 0 to the precision, so a
    column of negative scale (decimal128(2, -2)) cannot be declared to ingest into.
  case: "TestIngest::test_create\\[provisa:flightsql:ingest/decimal_scale_negative\\]"

- kind: client
  group: GetObjects reports no xdbc nullability
  requirement: REQ-2167
  skipped: true
  decision: >-
    The client drops each column's xdbc nullability in GetObjects. ADBC apache-arrow-adbc-24 (adbc-driver-flightsql 1.12.0, Go driver at commit a3f81c6feb11):
    go/adbc/driver/flightsql/flightsql_connection.go:75-77 (flightSqlMetadata.SetMetadata) keeps
    a column's metadata for its own fields only and never sets the shared builder's, so
    go/adbc/driver/internal/shared_utils.go:558-564 (SetXdbcNullable) and :598-602
    (SetXdbcIsNullable) find no XDBC_NULLABLE or XDBC_IS_NULLABLE and answer null. The suite
    skips test_not_null for a driver that cannot claim xdbc_nullable
    (adbc_drivers_validation/tests/ingest.py:586-587, validation at 9f9f441).
  client: adbc-driver-flightsql 1.12.0 (the Go driver)
  behavior: >-
    Leaves xdbc_nullable and xdbc_is_nullable null in GetObjects.
  evidence: >-
    flightsql_connection.go:75-77 and shared_utils.go:558-564 at apache-arrow-adbc-24; Provisa
    puts XDBC_NULLABLE and XDBC_IS_NULLABLE in each column's metadata of GetTables' table schema
    (tests/unit/test_flightsql_catalog.py).
  workaround: >-
    Read nullability from GetTables with include_schema, or from adbc_get_table_schema.
  case: "^tests\\.test_ingest\\.TestIngest::test_not_null\\[provisa:flightsql\\]$"

- group: Status the Flight server library cannot send
  requirement: REQ-2175
  decision: >-
    A bulk ingest that would create a table that already exists, or whose columns do not match
    the table it appends to, is refused by name with the status INVALID_ARGUMENT, not
    ALREADY_EXISTS: the Flight server library Provisa serves on (pyarrow) can send no
    ALREADY_EXISTS status.
  # Only that status difference is this group's: any other answer stays failed.
  reason: "INVALID_ARGUMENT: 5> == <AdbcStatusCode.ALREADY_EXISTS: 4>"
  case: "TestIngest::test_(create_conflict|append_schema_mismatch|createappend_schema_mismatch)\\["
