# pgwire (REQ-2167, amended 2026-10-27, PGWIRE'S CATALOG FUNCTIONS). scripts/conformance/by_design.py.
#
# The pg_catalog functions the engine does not have and no client calls -- psql's describe.c,
# pgjdbc's PgDatabaseMetaData, pgAdmin and DBeaver name none of them (a type named only as a cast
# aside) -- are not served by design: a statement's own SQL uses the engine's functions, and these
# are not emulated. Each group lists the functions of one family the conformance probe found
# unserved (PostgreSQL 17.11 against the DuckDB engine); a function a client calls is in no group,
# so it is answered or stays a failure. The catalog report (pgwire_catalog_types.py) counts a
# function a group names as not served by design.

