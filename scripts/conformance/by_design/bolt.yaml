# The Neo4j Python driver's integration tests skipped by design (REQ-2167, amended 2026-10-27
# and 2026-10-28), never counted as failed: each group quotes the rule of the requirement that
# excludes it. scripts/conformance/by_design.py. An example that creates its nodes only as setup
# is adapted over the fixture model (scripts/conformance/bolt/fixtures.py), not excluded: it runs
# as written and counts, marked on the page with what its setup became.

- kind: adapted
  group: The examples' graph
  became: >-
    The labels and relationship types the examples create are declared in a domain of the job's
    fixture model that holds them alone: Person, Company and Greeting, KNOWS (Person to Person,
    with the from property the driver introduction example writes) and WORKS_FOR (Person to
    Company), each relationship a junction table. The driver's user acts as a role whose domain
    access is that domain alone, writing it, so each example's MATCH (_) DETACH DELETE _ cleanup
    empties the examples' graph and nothing else.
  case: "examples\\.test_(autocommit_transaction|hello_world|pass_bookmarks|read_write_transaction|result_consume|result_retain|session|transaction_function|transaction_metadata_config|transaction_timeout_config)_example::|test_readme::test_should_run_readme$"

- kind: adapted
  group: Sign-in cost
  became: >-
    The test user's password is hashed at the minimum bcrypt cost; reconnect-per-cancel is the
    driver's behaviour.
  case: "test_async_cancellation::test_async_cancellation_does_not_leak$"

- group: Digits below the microsecond
  requirement: REQ-2173
  decision: >-
    "Every temporal value, read from a column or built in a query, has microsecond precision,
    what the engines and their drivers hold; its nanosecond property is its microseconds times
    1000."
  # Each example sends a value with nanoseconds (4123 ns, 4 ns) and asserts it comes back whole.
  # Only that difference is this group's: the answer must be the value sent with its digits below
  # the microsecond as zeros, so any other difference -- an offset on a local time, say -- stays a
  # failure.
  reason: "assert '(?P<a>[^']*?)000(?P<z>[^']*)' == '(?P=a)\\d{3}(?P=z)'|assert '(?P<d>P[^']*T\\d+)S' == '(?P=d)\\.\\d{9}S'"
  case: "test_temporal_types_example::test_(datetime|time|local_datetime|local_time|duration_example)$"

# The driver's own suite skips these for every server, whatever it is (REQ-2167, amended): each is
# skipped by design, citing the suite's own reason.
- kind: suite
  group: Encryption examples the suite skips
  requirement: REQ-2167
  suite: neo4j-python-driver integration tests
  evidence: >-
    The examples are marked skip in the driver's own tests, "re-enable when we can test with
    encrypted=True on Docker", for every server.
  case: "examples\\.test_config_(secure|trust)_example::test_example$"

- kind: suite
  group: Enterprise edition example the suite skips
  requirement: REQ-2167
  suite: neo4j-python-driver integration tests
  evidence: >-
    The example requires a Neo4j Enterprise server ("requires server edition 'enterprise'"), and
    the suite skips it on any other.
  case: "examples\\.test_database_selection_example::test_database_selection_example$"

- kind: suite
  group: Kerberos example the suite skips
  requirement: REQ-2167
  suite: neo4j-python-driver integration tests
  evidence: >-
    The example is marked skip in the driver's own tests, "Currently no way to test Kerberos
    auth", for every server.
  case: "examples\\.test_kerberos_auth_example::test_example$"

- kind: suite
  group: Service-unavailable example the suite skips
  requirement: REQ-2167
  suite: neo4j-python-driver integration tests
  evidence: >-
    The example is marked skip in the driver's own tests, "Fix better error messages for the
    user. Be able to kill the server.", for every server.
  case: "examples\\.test_service_unavailable_example::test_example$"
