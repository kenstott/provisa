# The Neo4j Python driver's integration tests Provisa fails by design (REQ-2167, amended
# 2026-10-27): each group quotes the rule of the requirement that excludes it.
# scripts/conformance/by_design.py. An example that creates its nodes only as setup is adapted
# over the fixture model, not excluded; until it is, it counts as a failure. The examples' DETACH
# DELETE is their cleanup, not their subject, so it is adapted too.

- group: Writes to relationships
  requirement: REQ-665
  decision: >-
    "CREATE, SET, and DELETE cannot target relationship entities. Attempting to write a
    relationship is a hard error at translation time."
  reason: "cannot target relationships"
