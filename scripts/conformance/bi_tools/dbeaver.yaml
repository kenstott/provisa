- id: 71
  protocol: extended
  sql: "SELECT c.oid,c.*,d.description,pg_catalog.pg_get_expr(c.relpartbound, c.oid) as partition_expr,\
    \  pg_catalog.pg_get_partkeydef(c.oid) as partition_key \nFROM pg_catalog.pg_class c\nLEFT OUTER JOIN\
    \ pg_catalog.pg_description d ON d.objoid=c.oid AND d.objsubid=0 AND d.classoid='pg_class'::regclass\n\
    WHERE c.relnamespace=$1 AND c.relkind not in ('i','I','c') AND relname=$2"
  params:
  - type: 20
    value: '11'
  - type: 1043
    value: pg_stat_activity
- id: 72
  protocol: extended
  sql: |-
    SELECT c.relname,a.*,pg_catalog.pg_get_expr(ad.adbin, ad.adrelid, true) as def_value,dsc.description,dep.objid
    FROM pg_catalog.pg_attribute a
    INNER JOIN pg_catalog.pg_class c ON (a.attrelid=c.oid)
    LEFT OUTER JOIN pg_catalog.pg_attrdef ad ON (a.attrelid=ad.adrelid AND a.attnum = ad.adnum)
    LEFT OUTER JOIN pg_catalog.pg_description dsc ON (c.oid=dsc.objoid AND a.attnum = dsc.objsubid)
    LEFT OUTER JOIN pg_depend dep on dep.refobjid = a.attrelid AND dep.deptype = 'i' and dep.refobjsubid = a.attnum and dep.classid = dep.refclassid
    WHERE NOT a.attisdropped AND c.relkind not in ('i','I','c') AND c.oid=$1
    ORDER BY a.attnum
  params:
  - type: 20
    value: '12222'
- id: 73
  protocol: extended
  sql: |-
    SELECT
        (SELECT count(*) AS "Active" FROM pg_catalog.pg_stat_activity sa WHERE state='active'),
        (SELECT count(*) AS "Idle" FROM pg_catalog.pg_stat_activity sa WHERE state='idle'),
        (SELECT count(*) AS "Total" FROM pg_catalog.pg_stat_activity sa WHERE state IS NOT NULL)
- id: 74
  protocol: extended
  sql: |-
    SELECT
        (SELECT sum(xact_commit) + sum(xact_rollback) AS "Total" FROM pg_stat_database),
        (SELECT sum(xact_commit) AS "Commit" FROM pg_stat_database),
        (SELECT sum(xact_rollback) AS "Rollback" FROM pg_stat_database)
- id: 75
  protocol: extended
  sql: |-
    SELECT
        (SELECT sum(blks_read) as "Read" FROM pg_stat_database),
        (SELECT sum(blks_hit) as "Hits" FROM pg_stat_database)
