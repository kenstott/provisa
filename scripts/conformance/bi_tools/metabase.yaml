method: 'Automated: metabase/metabase:v0.64.5 through its HTTP API: setup, add the database (first sync,
  analysis), sync_schema, then the database''s and each table''s metadata.'
browse:
- POST /api/database (first sync and analysis)
- POST /api/database/:id/sync_schema
- GET /api/database/:id/metadata
- GET /api/table/:id/query_metadata for each table
