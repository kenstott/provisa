# The legs of Conformance (functions) (.github/workflows/conformance-functions.yml), one per engine
# kind of provisa/core/engine_kinds.py ENGINE_KINDS that runs in a container a hosted runner can
# boot, and why each other kind is not run. function_legs.py plans the workflow's matrix from it and
# function_support.py merge lists it on the report. A unit test holds every engine kind to exactly
# one of `legs` and `not_run`.
#
# Every direct-only source can be an engine (maintainer, 2026-11-03), so a leg measures the engine
# and the direct path of its platform at once.
#
# A leg:
#   engine        the engine kind ($PROVISA_ENGINE)
#   lane          free: any dispatch; warehouse: only a dispatch with lanes warehouse or all, the
#                 gating of the integration suite's warehouse lane (integration-suite-lanes.yml,
#                 warehouse job), whose repository secrets it reads
#   image         the container the engine runs in, as the report lists it
#   service       the docker-compose.test.yml service the integration tests start for it (started by
#                 scripts/conformance/engine_service.sh); none for in-process or external engines
#   demo-source   instead of a service: the demo/sources/<name> container another CI lane already
#                 starts for this engine (demo/sources/provision.py, by engine_service.sh demo)
#   engine-url    $PROVISA_ENGINE_URL; a warehouse leg's is written by warehouse_leg.py up
#   secrets       a warehouse leg's: the warehouse lane's secrets it reads, each checked before
#                 anything runs (warehouse_leg.py up)
#   concurrency   a warehouse leg that wakes compute every run shares (REQ-254): the warehouse
#                 lane's concurrency group, so it never runs beside a run that stops that compute
#   ready-sql     a statement the engine URL answers once the engine accepts SQL (function_legs.py
#                 wait); none where the service's own healthcheck says so
#   setup-sql     statements run once it is ready, on setup-url (the URL without its database)
#   extras        the extras of the locked environment the leg installs (default dev)
#   pip           the SQLAlchemy dialect the engine URL names, where the locked environment has
#                 none: installed into the leg's environment only (reported: the product ships none)
#   apt           system libraries the dialect loads
#   odbc          true when the dialect connects through Microsoft's ODBC Driver 18
#   source-host   runner when the engine runs in a container and reads the conformance PostgreSQL
#                 itself (ATTACH), by the runner's own address; else the source is read by Provisa
#   wait          seconds the service gets to become ready (default 600)

legs:
  # --- in-process, or the runner's own PostgreSQL --------------------------------------------
  - engine: duckdb
    lane: free
    image: in-process (duckdb)
  - engine: pg
    lane: free
    image: postgres:17.11 (the workflow's PostgreSQL service)
    engine-url: postgresql://postgres:conformance@127.0.0.1:55432/conformance
  - engine: clickhouse
    lane: free
    image: in-process (chdb)
  # The compose stack the Trino UI lane runs: the engine, its object store, its Arrow proxy, its
  # metastore, and the control plane Trino reads over JDBC.
  - engine: trino
    lane: free
    image: trinodb/trino:481 (docker-compose.core.yml)
    control-plane-url: postgresql+psycopg://provisa:provisa@localhost:5432/provisa
    boot-attempts: "300"
  # Any SQLAlchemy URL: here the runner's PostgreSQL by its generic dialect, its own database.
  - engine: sqlalchemy
    lane: free
    image: postgres:17.11 (the workflow's PostgreSQL service)
    engine-url: postgresql+psycopg2://postgres:conformance@127.0.0.1:55432/postgres

  # --- containers the integration tests already start (docker-compose.test.yml) -------------
  - engine: clickhouse-server
    lane: free
    image: clickhouse/clickhouse-server:24.3
    service: clickhouse
    engine-url: clickhouse://default:provisa@127.0.0.1:8123/default
    source-host: runner
  - engine: mysql
    lane: free
    image: mysql:8.4
    service: mysql
    engine-url: mysql+pymysql://root:provisa@127.0.0.1:3307/provisa
    ready-sql: SELECT 1
  - engine: mariadb
    lane: free
    image: mariadb:11
    service: mariadb
    engine-url: mariadb+pymysql://root:provisa@127.0.0.1:3306/provisa
    ready-sql: SELECT 1
  - engine: tidb
    lane: free
    image: pingcap/tidb:latest
    service: tidb
    engine-url: mysql+pymysql://root@127.0.0.1:4000/test
    ready-sql: SELECT 1
  - engine: mssql
    lane: free
    image: mcr.microsoft.com/mssql/server:2022-latest
    service: sqlserver
    engine-url: mssql+pyodbc://sa:Provisa_2026!@127.0.0.1:1433/master?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
    ready-sql: SELECT 1
    odbc: true
  - engine: oracle
    lane: free
    image: gvenzl/oracle-free:slim
    service: oracle
    engine-url: oracle+oracledb://system:provisa@127.0.0.1:1521/?service_name=FREEPDB1
    ready-sql: SELECT 1 FROM DUAL
    wait: 900
  - engine: firebird
    lane: free
    image: jacobalberty/firebird:v4
    service: firebird
    engine-url: firebird+firebird://provisa:provisa@127.0.0.1:3050//firebird/data/test.fdb
    ready-sql: SELECT 1 FROM RDB$DATABASE
    pip: sqlalchemy-firebird firebird-driver
    apt: libfbclient2
  - engine: cockroachdb
    lane: free
    image: cockroachdb/cockroach:v24.1.0
    service: cockroachdb
    engine-url: cockroachdb://root@127.0.0.1:26257/defaultdb?sslmode=disable
    ready-sql: SELECT 1
    pip: sqlalchemy-cockroachdb
  - engine: yugabytedb
    lane: free
    image: yugabytedb/yugabyte:2026.1.1.1-b2
    service: yugabytedb
    engine-url: postgresql+psycopg2://yugabyte@127.0.0.1:5433/yugabyte
    ready-sql: SELECT 1
  - engine: greenplum
    lane: free
    image: datagrip/greenplum:6.8
    service: greenplum
    engine-url: postgresql+psycopg2://gpadmin@127.0.0.1:15432/postgres
    ready-sql: SELECT 1
    wait: 900
  - engine: exasol
    lane: free
    image: exasol/docker-db:latest
    service: exasol
    engine-url: exa+websocket://sys:exasol@127.0.0.1:8563/PROVISA?SSLCertificate=SSL_VERIFY_NONE
    setup-url: exa+websocket://sys:exasol@127.0.0.1:8563?SSLCertificate=SSL_VERIFY_NONE
    setup-sql: CREATE SCHEMA IF NOT EXISTS PROVISA
    ready-sql: SELECT 1
    pip: sqlalchemy-exasol
    wait: 900

  # --- containers started for this run alone (docker-compose.test.yml, no test of their own) --
  - engine: monetdb
    lane: free
    image: monetdb/monetdb:latest
    service: monetdb
    engine-url: monetdb://monetdb:monetdb@127.0.0.1:50000/provisa
    ready-sql: SELECT 1
    pip: sqlalchemy-monetdb
  - engine: opengauss
    lane: free
    image: opengauss/opengauss:latest
    service: opengauss
    engine-url: opengauss://gaussdb:Provisa_2026@127.0.0.1:15433/postgres
    ready-sql: SELECT 1
    pip: opengauss-sqlalchemy
  - engine: vertica
    lane: free
    image: vertica/vertica-ce:24.1.0-0
    service: vertica
    engine-url: vertica+vertica_python://dbadmin@127.0.0.1:5434/VMart
    ready-sql: SELECT 1
    pip: sqlalchemy-vertica-python
    wait: 900
  - engine: db2
    lane: free
    image: icr.io/db2_community/db2:11.5.9.0
    service: db2
    engine-url: db2+ibm_db://db2inst1:provisa@127.0.0.1:50001/PROVISA
    ready-sql: SELECT 1 FROM SYSIBM.SYSDUMMY1
    pip: ibm-db-sa
    wait: 1200

  # --- a container another CI lane already starts (demo/sources) ---------------------------
  # The SAP HANA express edition the swap UI lane boots on amd64 (ui-e2e-swap-amd64.yml,
  # engine-swap.spec.ts provisionSwapSource: demo/sources/provision.py up saphana), with the dialect
  # that lane installs (the saphana extra). The tenant HXE answers on 39041 (compose.yml says why).
  - engine: saphana
    lane: free
    image: saplabs/hanaexpress:latest
    demo-source: saphana
    engine-url: hana+hdbcli://SYSTEM:HXEHana1@127.0.0.1:39041
    ready-sql: SELECT 1 FROM DUMMY
    extras: dev saphana
    wait: 1200

  # --- live warehouses: the integration suite's warehouse lane's, by its secrets ------------
  # warehouse_leg.py up wakes or provisions each with that lane's own helpers and writes its engine
  # URL; down leaves it stopped, suspended, paused or deleted, as the lane does.
  - engine: snowflake
    lane: warehouse
    image: none (the warehouse lane's Snowflake account)
    secrets: [SNOWFLAKE_ACCOUNT, SNOWFLAKE_USER, SNOWFLAKE_PASSWORD, SNOWFLAKE_WAREHOUSE, SNOWFLAKE_DATABASE]
    concurrency: live-cloud-warehouses
  - engine: databricks
    lane: warehouse
    image: none (the warehouse lane's Databricks SQL warehouse)
    secrets: [DATABRICKS_SERVER_HOSTNAME, DATABRICKS_HTTP_PATH, DATABRICKS_TOKEN]
    concurrency: live-cloud-warehouses
  - engine: bigquery
    lane: warehouse
    image: none (the warehouse lane's BigQuery project)
    secrets: [GOOGLE_CLOUD_PROJECT, GOOGLE_APPLICATION_CREDENTIALS_JSON]
  - engine: fabric
    lane: warehouse
    image: none (the warehouse lane's Fabric warehouse and capacity)
    secrets: [FABRIC_SQL_SERVER, FABRIC_DATABASE, FABRIC_WORKSPACE_ID, FABRIC_CAPACITY_NAME, FABRIC_RESOURCE_GROUP, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID]
    concurrency: live-cloud-warehouses
    odbc: true
  - engine: synapse
    lane: warehouse
    image: none (the warehouse lane's standing Synapse serverless workspace)
    secrets: [SYNAPSE_SQL_SERVER, SYNAPSE_DATABASE, FABRIC_RESOURCE_GROUP, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID]
    odbc: true
  - engine: redshift
    lane: warehouse
    image: none (a Redshift Serverless workgroup provisioned for the leg, scripts/redshift_e2e.py)
    secrets: [REDSHIFT_AWS_ACCESS_KEY_ID, REDSHIFT_AWS_SECRET_ACCESS_KEY, REDSHIFT_AWS_REGION]
  - engine: motherduck
    lane: warehouse
    image: none (a scratch database in the warehouse lane's MotherDuck account)
    secrets: [MOTHERDUCK_API_TOKEN]
  - engine: singlestore
    lane: warehouse
    image: none (the warehouse lane's hosted SingleStore instance)
    secrets: [SINGLESTORE_HOST, SINGLESTORE_PORT, SINGLESTORE_USERNAME, SINGLESTORE_PASSWORD, SINGLESTORE_DATABASE]

not_run:
  teradata: >-
    no container image: Teradata Vantage Express is a VirtualBox/VMware virtual machine, which a
    hosted runner cannot boot as a container
  sapase: >-
    no container image: SAP ASE Developer Edition is an installer behind SAP's registration, with no
    published image
  sqlanywhere: >-
    no container image: SAP SQL Anywhere is an installer behind SAP's registration, with no
    published image
  trino-byo: >-
    the trino leg: trino-byo is built by the same builder (provisa/federation/engine.py
    _ENGINE_BUILDERS, build_trino_engine), and the trino leg already reaches its coordinator in a
    compose container that Provisa does not manage, which is what trino-byo is
