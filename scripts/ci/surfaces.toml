# The surfaces of the product and what verifies each. Read by scripts/ci/surface_map.py, which
# verify-surface.yml runs; tests/unit/test_ci_surface_map.py holds this file to the repository.
#
# A surface:
#   wider   the surface a change takes when it also touches a sibling: the nearest common wider
#           surface of everything it touches. Nothing wider than control-plane.
#   suites  the workflows that are its own full test, by the names verify-surface.yml knows.
#   lanes   the container lanes it runs whole (run_lane.py). Without any, it runs its `tests` alone.
#   paths   the code it owns, as fnmatch patterns (`*` crosses `/`).
#   tests   the tests/integration files it owns, as fnmatch patterns.
#
# No file belongs to two surfaces. A file no surface names belongs to control-plane: it runs with
# that surface's lanes, and with the lane its markers select when that is another lane.

[contract]
# A change to one of these is a change between surfaces: the run widens to every conformance suite
# and the whole integration suite.
#
# The SQL goldens: each translation is replayed byte for byte, and a change to one is approved
# query by query (tests/fixtures/cypher_golden/README.md, tests/unit/test_cypher_golden_sql.py,
# tests/unit/test_graphql_golden_sql.py).
sql_goldens = [
    "tests/fixtures/cypher_golden/approved.jsonl",
    "tests/fixtures/cypher_golden/entries.jsonl",
    "tests/fixtures/graphql_golden/entries.jsonl",
]
# FederationEngine (REQ-840), its backend and terminal dispatch (REQ-825), the certification every
# engine passes (REQ-827), and the store side of replication.
engine_interfaces = [
    "provisa/federation/backend.py",
    "provisa/federation/conformance.py",
    "provisa/federation/engine.py",
    "provisa/federation/replica_target.py",
    "provisa/federation/runtime.py",
]
# Connector (REQ-842), SourceContract (REQ-1756), DirectDriver (REQ-027), and the source side of
# replication.
source_interfaces = [
    "provisa/executor/drivers/base.py",
    "provisa/federation/connector_base.py",
    "provisa/federation/connector_contract.py",
    "provisa/federation/replica_source.py",
]

# Its paths are what is not named elsewhere: provisa/core, for one, less the glossary below.
[surfaces.control-plane]
lanes = ["core", "app"]
paths = [
    "provisa/audit/*",
    "provisa/auth/*",
    "provisa/control_plane/*",
    "provisa/encryption/*",
    "provisa/events/*",
    "provisa/licensing/*",
    "provisa/scheduler/*",
    "provisa/security/*",
]
tests = [
    "tests/integration/test_auth_integration.py",
    "tests/integration/test_control_plane_*.py",
    "tests/integration/test_multi_org_onboarding_flow.py",
    "tests/integration/test_org_*.py",
    "tests/integration/test_scheduler_single_holder.py",
]

[surfaces.compiler]
wider = "control-plane"
paths = ["provisa/compiler/*", "provisa/transpiler/*"]
tests = [
    "tests/integration/test_ast_transform_e2e.py",
    "tests/integration/test_compile_endpoint.py",
    "tests/integration/test_compiler_integration.py",
    "tests/integration/test_cross_vendor_parity_e2e.py",
    "tests/integration/test_view_input_refusal_e2e.py",
    "tests/integration/test_view_lowering_e2e.py",
]

[surfaces.engines]
wider = "control-plane"
suites = ["ui-swap"]
paths = [
    "provisa/cache/*",
