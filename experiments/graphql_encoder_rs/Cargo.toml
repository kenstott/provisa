[package]
name = "graphql_encoder_rs"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "graphql_encoder_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.25", features = ["extension-module"] }
arrow = { version = "56", default-features = false, features = ["pyarrow", "ffi"] }
itoa = "1"
ryu = "1"
hashbrown = "0.16"
half = "2"

[profile.release]
lto = "fat"
codegen-units = 1
