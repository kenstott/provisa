[package]
name = "pgwire_encoder_rs"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "pgwire_encoder_rs"
# An rlib: provisa._encoders (rust/encoders) links it as its pgwire submodule. build.sh asks for
# the cdylib it benchmarks on its own command line (cargo rustc --crate-type cdylib).
crate-type = ["rlib"]

[dependencies]
pyo3 = { version = "0.25", features = ["extension-module"] }
arrow = { version = "56", default-features = false, features = ["pyarrow", "ffi"] }
itoa = "1"

[profile.release]
lto = "fat"
codegen-units = 1
