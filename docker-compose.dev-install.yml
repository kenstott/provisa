# Install-simulation overlay — exposes core service ports for local backend access.
# Matches the installed product's service set (no kafka, mongo, elasticsearch, observability).
# Usage: docker compose -f docker-compose.core.yml -f docker-compose.dev-install.yml up
services:
  postgres:
    ports:
      - "${PROVISA_STORE_BIND_IP:?the address the stores publish on}:${PG_PORT:-5432}:5432"

  pgbouncer:
    ports:
      - "${PROVISA_STORE_BIND_IP:?the address the stores publish on}:${PGBOUNCER_PORT:-6432}:6432"

  redis:
    ports:
      - "${PROVISA_STORE_BIND_IP:?the address the stores publish on}:${REDIS_PORT:-6379}:6379"

  # REQ-1332: nothing is mounted at Trino's catalog.config-dir. Its catalogs are created by
  # Provisa and kept in memory (catalog.store=memory); catalog-install/ is staging that
  # write_kafka_catalog_files writes, never a catalog.config-dir.
  trino:
    ports:
      - "${PROVISA_STORE_BIND_IP:?the address the stores publish on}:${TRINO_PORT:-8080}:8080"

  zaychik:
    ports:
      - "${PROVISA_STORE_BIND_IP:?the address the stores publish on}:${ZAYCHIK_PORT:-8480}:8480"


