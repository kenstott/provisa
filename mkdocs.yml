site_name: Provisa
site_description: Federation, metrics, ontology and governance from a single model. 73 connectors reaching 85+ kinds of source; query with GraphQL, Cypher, or SQL.
site_url: https://provisa.dev/docs/
site_dir: docs_site
repo_url: https://github.com/kenstott/provisa
repo_name: provisa
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    # navigation.instant intentionally omitted: incompatible with
    # mkdocs-static-i18n's per-page language switcher (it falls back to the
    # target locale's homepage instead of the equivalent page).
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details

plugins:
  - search
  # Serves docs/<lng>/*.md (produced by the docs-translate skill) as parallel
  # locale trees at /docs/<lng>/. Add one `languages` entry per locale once its
  # docs/<lng>/ tree exists — see docs/i18n/manifest.json for translation scope.
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: es
          name: Español
          build: true
        - locale: fr
          name: Français
          build: true
        - locale: de
          name: Deutsch
          build: true
        - locale: pt
          name: Português
          build: true
        - locale: it
          name: Italiano
          build: true
        - locale: zh
          name: 中文
          build: true
        - locale: ru
          name: Русский
          build: true
        - locale: he
          name: עברית
          build: true
        # zh-HK must stay LAST: mkdocs_static_i18n's apply_user_overrides()
        # snapshots the current (already locale-mutated) theme.language value
        # as the "original" the first time a per-language theme: override
        # applies, then unconditionally restores that snapshot before every
        # later locale build — so this override would permanently corrupt
        # theme.language to the literal string "zh-HK" for every locale
        # built after it. Placing it last confines the corruption to zh-HK's
        # own build.
        - locale: zh-HK
          name: 繁體中文（香港）
          build: true
          # mkdocs-material ships no partials/languages/zh-HK.html; zh-Hant is
          # the closest supported theme-chrome locale (Traditional Chinese).
          theme:
            language: zh-Hant

# Auto-link every REQ-NNN mention to its section on the Requirements page.
hooks:
  - scripts/mkdocs_hooks.py
  # Each locale's search reads only that locale's pages: mkdocs-static-i18n merges every locale
  # into one search index, which this hook splits into one per locale after the build.
  - scripts/mkdocs_search_per_locale.py

