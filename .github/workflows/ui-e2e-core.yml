name: UI e2e (core lane)

# 143 of the 145 Playwright tests run against the DuckDB (NativeBackend) backend and need no
# container at all:
#   - control plane on SQLite  — db.py::_init_schema_portable bootstraps from the dialect-neutral
#     schema_org metadata instead of the PostgreSQL-only schema.sql, and OrgRouter gives
#     file-per-org isolation where PG uses org_<id> schemas (capabilities.yaml presets already
#     declare control_plane_store: sqlite, so this is the shipped embedded tier, not a test-only
#     shortcut)
#   - cache on embedded fakeredis — no config sets cache.redis_url and no REDIS_URL is exported,
#     so app.py resolves state.redis_url to None
#   - federation on DuckDB — PROVISA_ENGINE is only set to trino on the second backend
#
# The remaining specs need a Trino catalog and a networked control plane; they live in
# ui-e2e-trino.yml (playwright.config.ts's TRINO_SPECS — sharepoint, splunk, and, since the
# REQ-1763 amendment of 2026-09-15, source-to-query-olap-lake-trino.spec.ts's pinot/hive_s3/hive/
# druid: those four have no direct driver, only a Trino connector, so they were split out of
# source-to-query-olap-lake.spec.ts — this lane's own PROVISA_E2E_LANE=core never starts the
# Trino-backed webServer they need, so they could never actually run here). Together the two
# lanes run every spec — neither skips.
#
# REQ-1759: this lane's own container/service fixtures make it expensive — real-world runs
# consistently ran 30-60+ minutes even after the timeout was raised to cover genuine (not
# hung/contention) runtime. unit-tests.yml runs on every push/PR instead and is the fast per-commit
# gate; this lane runs on release branches/tags and on-demand (Actions tab -> Run workflow), not on
# every push to main.

on:
  push:
    branches: ["release/**"]
    tags: ["v*"]
    paths:
      - "provisa-ui/**"
      - "provisa/**"
      - "main.py"
      - "config/provisa-install.yaml"
      - "demo/**"
      - ".github/workflows/ui-e2e-core.yml"
  workflow_dispatch:
  # Callable: by an orchestrator, and by the proof of the CI's own structure. Every secret its two
  # jobs read, by name; the caller passes each one and nothing is inherited.
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      AZURE_TENANT_ID:
        required: false
      DATABRICKS_HTTP_PATH:
        required: false
      DATABRICKS_SERVER_HOSTNAME:
        required: false
      DATABRICKS_TOKEN:
        required: false
      FABRIC_CAPACITY_NAME:
        required: false
      FABRIC_DATABASE:
        required: false
      FABRIC_RESOURCE_GROUP:
        required: false
      FABRIC_SQL_SERVER:
        required: false
      GOOGLE_APPLICATION_CREDENTIALS_JSON:
        required: false
      GOOGLE_CLOUD_PROJECT:
        required: false
      GSHEETS_TEST_SHEET_ID:
        required: false
      SNOWFLAKE_ACCOUNT:
        required: false
      SNOWFLAKE_PASSWORD:
        required: false
      SNOWFLAKE_USER:
        required: false
      SNOWFLAKE_WAREHOUSE:
        required: false
      SP_CERT_P12_BASE64:
        required: false
      SP_CERT_PASSWORD:
        required: false
      SP_CLIENT_ID:
        required: false
      SP_SITE_URL:
        required: false
      SP_TENANT_ID:
        required: false

permissions:
  contents: read

# Naming the shell makes GitHub run every step with `bash -eo pipefail`: the ODBC driver step
# pipes a download into gpg and tee, and under the default (`bash -e`) a failed download passed.
defaults:
  run:
    shell: bash

concurrency:
  group: ui-e2e-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Both jobs are the one lane workflow (lane.yml). They run side by side on two runners: the
  # lane took 2.0 h as one job (run 37918605161, which reached its 120-minute bound), and the
  # provisioning specs must not share a host with other workers' pages -- a Docker network made
  # or removed on the runner aborts whatever page is loading (playwright.config.ts
  # PROVISIONING_SPECS).
  playwright:
    name: Playwright core lane
    uses: ./.github/workflows/lane.yml
    with:
      name: ui-core
      timeout: 120
      # Fabric's SQL endpoint (the cloud-warehouse spec) is reached through ODBC Driver 18.
      odbc: true
      # playwright.config.ts's webServer commands invoke `.venv/bin/uvicorn` by path, so the
      # environment must be a real repo-root .venv. `cassandra` and `saphana` are their demo
      # primers' own dependencies (demo/sources/*/prime.py); `gx` and `soda` are the two
      # data-quality checkers the demo model this lane serves registers as sources -- without
      # them every read of the whole model failed (run 37874182519).
      python-extras: dev cassandra saphana gx soda
      # No --with-deps: the ubuntu-24.04 runner image already carries chromium's shared
      # libraries and fonts, and the apt refresh it triggers has stalled past the job timeout.
      ui: chromium
      ui-timeout: 12
      # CI: every webServer is started by the harness, never adopted from a stale process.
      # PROVISA_E2E_LANE: the SQLite control plane, and no Trino webServer in the config.
      env: |
        CI=true
        PROVISA_E2E_LANE=core
      working-directory: provisa-ui
      # json beside the list and the HTML report (in a file of its own: the HTML reporter empties
      # its folder): the run's own record of what did not execute.
      # Playwright stops ITSELF after 95 minutes, inside the job's bound: a run the job timeout
      # kills writes no report at all (release .479, run 38022153596: 108 failed attempts and
      # not one line of error text, no artifact). Stopped by its own limit it prints every
      # failure and writes the HTML and JSON reports, which the steps after this one upload.
      run: >-
        PLAYWRIGHT_JSON_OUTPUT_NAME=playwright-results.json
        npx playwright test --project=core --global-timeout=5700000 --reporter=list,html,json
      # prepare: the credential files of the live sources. after: every test that did not run,
      # by name and reason, under its own count (not a pass); the Fabric capacity paused again;
      # the credential files removed.
      prepare: scripts/ci/lanes/ui-core-prepare.sh
      after: bash ../scripts/ci/lanes/ui-core-after.sh playwright-results.json
      # What held the runner while the lane ran (run 37918605161 could not say).
      sampler: true
      artifact-name: playwright-report-core
      artifact-path: |
        provisa-ui/playwright-report/
        provisa-ui/playwright-results.json
      artifact-retention: 7
    secrets:
      # chat-panel-streaming.spec.ts drives a live model and fails by name without it. This
      # workflow runs on release pushes, tags and dispatch only (no pull_request trigger), so
      # the secret never reaches a fork's code.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # The live sources this job's specs register: Snowflake, Databricks, BigQuery, Google
      # Sheets and Fabric (source-to-query-cloud-warehouse / -special-cases). Passed by name.
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      DATABRICKS_SERVER_HOSTNAME: ${{ secrets.DATABRICKS_SERVER_HOSTNAME }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      GSHEETS_TEST_SHEET_ID: ${{ secrets.GSHEETS_TEST_SHEET_ID }}
      FABRIC_SQL_SERVER: ${{ secrets.FABRIC_SQL_SERVER }}
      FABRIC_DATABASE: ${{ secrets.FABRIC_DATABASE }}
      FABRIC_RESOURCE_GROUP: ${{ secrets.FABRIC_RESOURCE_GROUP }}
      FABRIC_CAPACITY_NAME: ${{ secrets.FABRIC_CAPACITY_NAME }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  # The specs that bring source stacks up and down, with ONE worker on a runner of their own.
  provisioning:
    name: Playwright core lane, provisioning specs
    uses: ./.github/workflows/lane.yml
    with:
      name: ui-core-provisioning
      timeout: 150
      python-extras: dev cassandra saphana gx soda
      # demo/sources/sqlserver/prime.py connects with pyodbc through "ODBC Driver 18 for SQL
      # Server", which the runner image does not carry (run 37874182519: the generic-RDBMS
      # stack never provisioned).
      odbc: true
      ui: chromium
      ui-timeout: 12
      env: |
        CI=true
        PROVISA_E2E_LANE=core
      working-directory: provisa-ui
      # json beside the list and the HTML report (in a file of its own: the HTML reporter empties
      # its folder): the run's own record of what did not execute.
      # Playwright stops ITSELF after 125 minutes, inside the job's bound: a run the job timeout
      # kills writes no report at all (release .479, run 38022153596: 108 failed attempts and
      # not one line of error text, no artifact). Stopped by its own limit it prints every
      # failure and writes the HTML and JSON reports, which the steps after this one upload.
      run: >-
        PLAYWRIGHT_JSON_OUTPUT_NAME=playwright-results.json
        npx playwright test --project=core-provisioning --workers=1 --global-timeout=7500000 --reporter=list,html,json
      # prepare: the credential files of the live sources. after: every test that did not run,
      # by name and reason, under its own count (not a pass); the Fabric capacity paused again;
      # the credential files removed.
      prepare: scripts/ci/lanes/ui-core-prepare.sh
      after: bash ../scripts/ci/lanes/ui-core-after.sh playwright-results.json
      # What held the runner while the lane ran (run 37918605161 could not say).
      sampler: true
      artifact-name: playwright-report-core-provisioning
      artifact-path: |
        provisa-ui/playwright-report/
        provisa-ui/playwright-results.json
      artifact-retention: 7
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # SharePoint (source-to-query.spec.ts), the one live source among this job's specs.
      SP_CERT_P12_BASE64: ${{ secrets.SP_CERT_P12_BASE64 }}
      SP_TENANT_ID: ${{ secrets.SP_TENANT_ID }}
      SP_CLIENT_ID: ${{ secrets.SP_CLIENT_ID }}
      SP_SITE_URL: ${{ secrets.SP_SITE_URL }}
      SP_CERT_PASSWORD: ${{ secrets.SP_CERT_PASSWORD }}
