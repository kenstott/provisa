name: UI e2e (core lane)

# 143 of the 145 Playwright tests run against the DuckDB (NativeBackend) backend and need no
# container at all:
#   - control plane on SQLite  — db.py::_init_schema_portable bootstraps from the dialect-neutral
#     schema_org metadata instead of the PostgreSQL-only schema.sql, and OrgRouter gives
#     file-per-org isolation where PG uses org_<id> schemas (capabilities.yaml presets already
#     declare control_plane_store: sqlite, so this is the shipped embedded tier, not a test-only
#     shortcut)
#   - cache on embedded fakeredis — no config sets cache.redis_url and no REDIS_URL is exported,
#     so app.py resolves state.redis_url to None
#   - federation on DuckDB — PROVISA_ENGINE is only set to trino on the second backend
#
# The remaining two specs (sharepoint, splunk) need a Trino catalog and a networked control plane;
# they live in ui-e2e-trino.yml. Together the two lanes run every spec — neither skips.
#
# REQ-1759: this lane's own container/service fixtures make it expensive — real-world runs
# consistently ran 30-60+ minutes even after the timeout was raised to cover genuine (not
# hung/contention) runtime. unit-tests.yml runs on every push/PR instead and is the fast per-commit
# gate; this lane runs on release branches/tags and on-demand (Actions tab -> Run workflow), not on
# every push to main.

on:
  push:
    branches: ["release/**"]
    tags: ["v*"]
    paths:
      - "provisa-ui/**"
      - "provisa/**"
      - "main.py"
      - "config/provisa-install.yaml"
      - "demo/**"
      - ".github/workflows/ui-e2e-core.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-e2e-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright core lane
    runs-on: ubuntu-latest
    # Was 30: the core-lane suite has grown past that budget — every run since at least
    # 2026-09-12 was cancelled at the 30m mark mid-suite, not from a hang (the last log inspected
    # was still making steady per-test progress at cancellation). Raised to 60 as an immediate
    # unblock, then to 90: source-to-query-generic-rdbms.spec.ts's beforeAll now also provisions
    # saphana, whose HXE tenant DB alone can take up to 15 minutes past container-healthy
    # (demo/sources/saphana/prime.py's own retry budget), serially on top of every other fixture in
    # that file. The real fix (splitting/parallelizing this job, or trimming serial per-file
    # container provisioning — several files stand up every fixture in one beforeAll even when most
    # of that file's tests are skipped) is tracked separately, not done here.
    timeout-minutes: 90
    env:
      # playwright.config.ts keys `reuseExistingServer` off this: under CI every webServer must be
      # started by the harness, never adopted from a stale process.
      CI: "true"
      # Selects the SQLite control plane and drops the Trino webServer from the config. Without it
      # the config would call `docker compose port postgres`, which throws with no daemon running.
      PROVISA_E2E_LANE: core
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # playwright.config.ts's webServer commands invoke `.venv/bin/uvicorn` by path, so the
      # environment must be a real repo-root .venv — uv sync creates exactly that.
      # The `cassandra` extra is demo/sources/cassandra/prime.py's own dependency: this lane's
      # global setup provisions every DEMO_SOURCES entry (demo-source-containers.ts), cassandra
      # included, and prime.py imports cassandra-driver directly rather than through a lazy import
      # a missing package could degrade gracefully around. `saphana` (hdbcli + sqlalchemy-hana) is
      # demo/sources/saphana/prime.py's own dependency and the product's own hana+hdbcli driver —
      # source-to-query-generic-rdbms.spec.ts's saphana case runs for real on this runner (a genuine
      # amd64 host, see that spec's RUNNING_IN_CI gate).
      - name: Install Python deps
        run: uv sync --frozen --extra dev --extra cassandra --extra saphana

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: provisa-ui/package-lock.json

      - name: Install UI deps
        working-directory: provisa-ui
        run: npm ci

      # No --with-deps: the ubuntu-24.04 runner image already carries chromium's shared
      # libraries and fonts, and the apt refresh it triggers has stalled past the job
      # timeout when the azure mirror is unreachable (run 32158624857: 28.5 minutes on
      # `Get:5 ... noble-security InRelease`, zero tests run).
      - name: Install Playwright browser
        working-directory: provisa-ui
        timeout-minutes: 6
        run: npx playwright install chromium

      - name: Run Playwright core lane
        working-directory: provisa-ui
        run: npx playwright test --project=core --reporter=list,html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-core
          path: provisa-ui/playwright-report/
          retention-days: 7
