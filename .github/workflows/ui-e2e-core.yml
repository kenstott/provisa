name: UI e2e (core lane)

# 143 of the 145 Playwright tests run against the DuckDB (NativeBackend) backend and need no
# container at all:
#   - control plane on SQLite  — db.py::_init_schema_portable bootstraps from the dialect-neutral
#     schema_org metadata instead of the PostgreSQL-only schema.sql, and OrgRouter gives
#     file-per-org isolation where PG uses org_<id> schemas (capabilities.yaml presets already
#     declare control_plane_store: sqlite, so this is the shipped embedded tier, not a test-only
#     shortcut)
#   - cache on embedded fakeredis — no config sets cache.redis_url and no REDIS_URL is exported,
#     so app.py resolves state.redis_url to None
#   - federation on DuckDB — PROVISA_ENGINE is only set to trino on the second backend
#
# The remaining specs need a Trino catalog and a networked control plane; they live in
# ui-e2e-trino.yml (playwright.config.ts's TRINO_SPECS — sharepoint, splunk, and, since the
# REQ-1763 amendment of 2026-09-15, source-to-query-olap-lake-trino.spec.ts's pinot/hive_s3/hive/
# druid: those four have no direct driver, only a Trino connector, so they were split out of
# source-to-query-olap-lake.spec.ts — this lane's own PROVISA_E2E_LANE=core never starts the
# Trino-backed webServer they need, so they could never actually run here). Together the two
# lanes run every spec — neither skips.
#
# REQ-1759: this lane's own container/service fixtures make it expensive — real-world runs
# consistently ran 30-60+ minutes even after the timeout was raised to cover genuine (not
# hung/contention) runtime. unit-tests.yml runs on every push/PR instead and is the fast per-commit
# gate; this lane runs on release branches/tags and on-demand (Actions tab -> Run workflow), not on
# every push to main.

on:
  push:
    branches: ["release/**"]
    tags: ["v*"]
    paths:
      - "provisa-ui/**"
      - "provisa/**"
      - "main.py"
      - "config/provisa-install.yaml"
      - "demo/**"
      - ".github/workflows/ui-e2e-core.yml"
  workflow_dispatch:

permissions:
  contents: read

# Naming the shell makes GitHub run every step with `bash -eo pipefail`: the ODBC driver step
# pipes a download into gpg and tee, and under the default (`bash -e`) a failed download passed.
defaults:
  run:
    shell: bash

concurrency:
  group: ui-e2e-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Both jobs are the one lane workflow (lane.yml). They run side by side on two runners: the
  # lane took 2.0 h as one job (run 37918605161, which reached its 120-minute bound), and the
  # provisioning specs must not share a host with other workers' pages -- a Docker network made
  # or removed on the runner aborts whatever page is loading (playwright.config.ts
  # PROVISIONING_SPECS).
  playwright:
    name: Playwright core lane
    uses: ./.github/workflows/lane.yml
    with:
      name: ui-core
      timeout: 120
      # playwright.config.ts's webServer commands invoke `.venv/bin/uvicorn` by path, so the
      # environment must be a real repo-root .venv. `cassandra` and `saphana` are their demo
      # primers' own dependencies (demo/sources/*/prime.py); `gx` and `soda` are the two
      # data-quality checkers the demo model this lane serves registers as sources -- without
      # them every read of the whole model failed (run 37874182519).
      python-extras: dev cassandra saphana gx soda
      # No --with-deps: the ubuntu-24.04 runner image already carries chromium's shared
      # libraries and fonts, and the apt refresh it triggers has stalled past the job timeout.
      ui: chromium
      ui-timeout: 12
      # CI: every webServer is started by the harness, never adopted from a stale process.
      # PROVISA_E2E_LANE: the SQLite control plane, and no Trino webServer in the config.
      env: |
        CI=true
        PROVISA_E2E_LANE=core
      working-directory: provisa-ui
      run: npx playwright test --project=core --reporter=list,html
      artifact-name: playwright-report-core
      artifact-path: provisa-ui/playwright-report/
      artifact-retention: 7
    secrets:
      # chat-panel-streaming.spec.ts drives a live model and fails by name without it. This
      # workflow runs on release pushes, tags and dispatch only (no pull_request trigger), so
      # the secret never reaches a fork's code.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  # The specs that bring source stacks up and down, with ONE worker on a runner of their own.
  provisioning:
    name: Playwright core lane, provisioning specs
    uses: ./.github/workflows/lane.yml
    with:
      name: ui-core-provisioning
      timeout: 150
      python-extras: dev cassandra saphana gx soda
      # demo/sources/sqlserver/prime.py connects with pyodbc through "ODBC Driver 18 for SQL
      # Server", which the runner image does not carry (run 37874182519: the generic-RDBMS
      # stack never provisioned).
      odbc: true
      ui: chromium
      ui-timeout: 12
      env: |
        CI=true
        PROVISA_E2E_LANE=core
      working-directory: provisa-ui
      run: npx playwright test --project=core-provisioning --workers=1 --reporter=list,html
      artifact-name: playwright-report-core-provisioning
      artifact-path: provisa-ui/playwright-report/
      artifact-retention: 7
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
