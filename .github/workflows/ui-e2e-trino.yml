name: UI e2e (Trino lane)

# playwright.config.ts's TRINO_SPECS — every spec whose tests address TRINO_BACKEND_URL because
# their SourceType has no direct driver, only a Trino connector, so NativeBackend (DuckDB) is a
# no-op and the schema dropdown never populates: sharepoint, splunk, and (REQ-1763 amendment,
# 2026-09-15) source-to-query-olap-lake-trino.spec.ts's pinot/hive_s3/hive/druid. Trino loads
# catalog specs over JDBC from inside its own container, which a SQLite control plane cannot
# serve. Hence the compose Postgres plus a Trino coordinator. Every other spec is in the core
# lane; between the two workflows nothing is skipped.
#
# source-to-query-olap-lake-trino.spec.ts's four cases used to live inside
# source-to-query-olap-lake.spec.ts, in the "core" project's testMatch — reachable only when
# someone ran locally with PROVISA_E2E_LANE left at its default "all" (which starts the Trino
# backend too), never under this repo's real ui-e2e-core.yml (PROVISA_E2E_LANE=core hardcoded,
# RUNS_TRINO false, Trino-backed webServer never started). Moved here so they run against a Trino
# backend that is actually live.
#
# playwright.config.ts still starts the DuckDB backend, the graphql-demo and petstore-mock servers
# and Vite here: the UI these specs drive is served by the same app.
#
# Runner is amd64 ubuntu-latest: the Trino coordinator alone takes mem_limit 7g, so the job
# brings up postgres + trino + minio + zaychik and no worker (replicas: 0). Redis is not
# started: neither provisa-install.yaml nor
# provisa-trino-e2e.yaml sets cache.redis_url and the harness sets no REDIS_URL, so app.py
# resolves state.redis_url to None and both the response cache and the rate limiter (REQ-371)
# run on embedded fakeredis.
#
# REQ-1759: like ui-e2e-core.yml, this lane is expensive (a 7g Trino coordinator cold boot) and no
# longer runs on every push/PR — unit-tests.yml is the fast per-commit gate. Runs on dispatch
# (for a release branch, or on demand) only.

on:
  # Runs on dispatch for a release (gh workflow run <workflow> --ref <release branch>): it gates the
  # release (REQ-1989). No push starts it.
  workflow_dispatch:
    # A retest of named specs: each a file or file:line under provisa-ui (e2e/x.spec.ts,
    # e2e/x.spec.ts:42), space-separated. The lane's provisioning runs as on a full run; Playwright
    # is given only these. Empty: the whole lane.
    inputs:
      specs:
        description: "Only these specs (e2e/x.spec.ts or e2e/x.spec.ts:42, space-separated); empty runs the whole lane"
        type: string
        required: false
        default: ""
  # Callable: by an orchestrator, and by the proof of the CI's own structure. The caller passes
  # the one secret the lane reads, by name.
  workflow_call:
    secrets:
      SP_CERT_P12_BASE64:
        required: false

permissions:
  contents: read

concurrency:
  group: ui-e2e-trino-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright Trino lane
    uses: ./.github/workflows/lane.yml
    with:
      name: ui-trino
      # Trino's healthcheck start_period alone is 120s, and the Trino-engine backend's
      # register_system_catalogs() gets a 300s webServer timeout on a cold JVM;
      # source-to-query-olap-lake-trino.spec.ts's druid case alone budgets a 900s beforeAll for
      # its 6-service amd64 cold boot, on top of pinot/hive_s3/hive's own 300s-per-test budgets,
      # and the single worker runs every spec file serially (REQ-1763 amendment).
      timeout: 150
      ui: chromium
      # CI: every webServer is started by the harness. PROVISA_E2E_LANE=trino declares the Trino
      # webServer and keeps the control plane on the compose Postgres. PG_PORT / TRINO_PORT pin
      # what docker-compose.core.yml publishes so playwright.config.ts's `docker compose port`
      # lookup and the Trino backend agree with the binding. PROVISA_OTEL_S3_ENDPOINT: the
      # backends run on the host, where the compose name "minio" does not resolve; minio
      # publishes 9000 there.
      env: |
        CI=true
        PROVISA_E2E_LANE=trino
        PROVISA_E2E_SPECS=${{ inputs.specs }}
        PG_PORT=5432
        TRINO_PORT=8080
        PROVISA_OTEL_S3_ENDPOINT=http://localhost:9000
      # The stack the lane needs before Playwright: the SharePoint client certificate Trino
      # authenticates with (a secret), the connector plugins, the function plugin, the images
      # (splunk's too), and the core compose services.
      prepare: scripts/ci/lanes/trino-stack-prepare.sh sharepoint-cert pull-splunk
      working-directory: provisa-ui
      # A named spec that is not there fails here: with --pass-with-no-tests a mistyped one would
      # otherwise run nothing and pass.
      run: >-
        for spec in $PROVISA_E2E_SPECS; do test -f "${spec%%:*}" || { echo "::error::no spec ${spec%%:*}"; exit 1; }; done; 
        npx playwright test --project=trino --reporter=list,html $PROVISA_E2E_SPECS ${PROVISA_E2E_SPECS:+--pass-with-no-tests}
      on-failure: scripts/ci/lanes/trino-stack-on-failure.sh
      artifact-name: playwright-report-trino
      artifact-path: provisa-ui/playwright-report/
      artifact-retention: 7
      artifact-on-failure-name: trino-container-log
      artifact-on-failure-path: trino-container.log
    secrets:
      SP_CERT_P12_BASE64: ${{ secrets.SP_CERT_P12_BASE64 }}
