name: Pgwire Maven Bundles

# REQ-294: connector bundles reach installs through Maven Central. This lays out, signs and attaches
# as a workflow artifact the Central bundles of one engine release: one artifact per connector and
# platform, and one pgwire-shared-<variant> per platform holding the files the bundles have in common.
# It uploads nothing to Maven Central: the promote is a separate step the maintainer confirms, given
# the sizes this prints (Central's free tier caps monthly publishing).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "engine release of kenstott/calcite (e.g. engine-v0.123.2)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  bundles:
    name: Bundles of ${{ inputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the release's connector tarballs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p tarballs
          gh release download "$TAG" --repo kenstott/calcite --dir tarballs --pattern 'pgwire-*.tar.gz'

      - name: Split the shared files and lay out the Central bundles
        env:
          TAG: ${{ inputs.tag }}
        run: python scripts/ci/pgwire_maven_bundles.py tarballs bundles "${TAG#engine-v}"

      - name: Import GPG key
        run: echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 -d | gpg --batch --import

      - name: Sign, checksum and zip each bundle
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#engine-v}"
          for dir in bundles/*/; do
            artifact="$(basename "$dir")"
            find "$dir" -type f ! -name '*.sha256' -print0 | while IFS= read -r -d '' f; do
              gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
                --local-user "$GPG_KEY_ID" --armor --detach-sign "$f"
              md5sum "$f" | cut -d' ' -f1 > "$f.md5"
              sha1sum "$f" | cut -d' ' -f1 > "$f.sha1"
            done
            ( cd "$dir" && zip -qr0 "../${artifact}-${version}-central-bundle.zip" io )
          done
          ls -l bundles/*.zip

      - name: Report the bundle sizes for the promote
        run: |
          cat bundles/sizes.json
          { echo '### Central bundle sizes (bytes)'; echo '```json'; cat bundles/sizes.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the bundles
        uses: actions/upload-artifact@v4
        with:
          name: pgwire-maven-bundles-${{ inputs.tag }}
          path: |
            bundles/*.zip
            bundles/sizes.json
          retention-days: 7
