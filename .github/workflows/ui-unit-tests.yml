name: UI Unit Tests

# provisa-ui's type check and its vitest suite: no server, no containers, no secrets. Until this
# workflow they ran only on a maintainer's machine, so a type error or a failing component test
# reached main unseen by CI (the Playwright workflows are release-branch and on demand).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref supersedes the run before it.
concurrency:
  group: ui-unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The type check, lint and the generated-page checks, beside the vitest shards. It also lists
  # the test files for the check that every one ran in one shard.
  static:
    name: tsc + lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: provisa-ui
    steps:
      - uses: actions/checkout@v4

      # Node and the install, as the Playwright workflows do them.
      - name: Set up the UI toolchain
        uses: ./.github/actions/setup-ui
        with:
          graph-render: "true"

      - name: Type check
        run: npx tsc -b --noEmit

      # eslint over the whole package, e2e/ included. No workflow ran it before, so e2e files went
      # past max-lines and kept unused imports unseen.
      - name: Lint
        run: npx eslint .

      - name: List the vitest files
        run: npx vitest list --filesOnly --json="$GITHUB_WORKSPACE/vitest-files.json"

      - uses: actions/upload-artifact@v4
        with:
          name: vitest-files
          path: vitest-files.json
          if-no-files-found: error

      # REQ-2006: provisa.dev's live demos page is generated from demo/named/*/demo.yaml; a demo
      # published, changed or withdrawn without regenerating the page fails here.
      - name: Live demos page in step with its demos
        run: node ../scripts/gen-site-demos.mjs --check

      # The site's source picker and every count of connectors it states, in figures or in words,
      # are generated from SOURCE_TYPES; a source added without regenerating them fails here.
      - name: Site source picker and counts in step with SOURCE_TYPES
        run: node ../scripts/gen-site-source-picker.mjs --check

      # render_graph's renderer (REQ-1990): its own package, tested by node --test against its
      # built bundle -- each layout on each theme, as the MCP server runs it.
      - name: Graph renderer -- type check, build, test
        working-directory: provisa-ui/graph-render
        run: |
          npm run typecheck
          npm run build
          npm test

  # Vitest's own file shards, each on its own runner. Each writes its json report for the check.
  vitest:
    name: vitest ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: provisa-ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up the UI toolchain
        uses: ./.github/actions/setup-ui

      - name: Unit tests
        env:
          SHARD: ${{ matrix.shard }}/3
        run: >-
          npx vitest run --shard="$SHARD" --reporter=default --reporter=json
          --outputFile.json="$GITHUB_WORKSPACE/vitest-results.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-results-${{ matrix.shard }}
          path: vitest-results.json
          if-no-files-found: error

  # Every test runs once: each listed test file in exactly one shard's results.
  check:
    name: every vitest file in one shard
    needs: [static, vitest]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: results

      - name: Compare
        run: >-
          python3 scripts/ci/unit_shard.py check-vitest results/vitest-files/vitest-files.json
          results/vitest-results-*/vitest-results.json

  # The workflow's verdict under the job name it had before sharding.
  ui:
    name: tsc + vitest
    needs: [static, vitest, check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: The checks passed, and every shard ran every test once
        env:
          STATIC: ${{ needs.static.result }}
          VITEST: ${{ needs.vitest.result }}
          CHECK: ${{ needs.check.result }}
        run: |
          echo "tsc + lint: $STATIC; vitest: $VITEST; check: $CHECK"
          [ "$STATIC" = success ] && [ "$VITEST" = success ] && [ "$CHECK" = success ]
