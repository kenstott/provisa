name: UI Unit Tests

# provisa-ui's type check and its vitest suite: no server, no containers, no secrets. Until this
# workflow they ran only on a maintainer's machine, so a type error or a failing component test
# reached main unseen by CI (the Playwright workflows are release-branch and on demand).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref supersedes the run before it.
concurrency:
  group: ui-unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: tsc + vitest
    runs-on: ubuntu-latest
    # One job: the type check and the tests share one install and one runner.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: provisa-ui
    steps:
      - uses: actions/checkout@v4

      # Node and the install, as the Playwright workflows do them.
      - name: Set up the UI toolchain
        uses: ./.github/actions/setup-ui
        with:
          graph-render: "true"

      - name: Type check
        run: npx tsc -b --noEmit

      # eslint over the whole package, e2e/ included. No workflow ran it before, so e2e files went
      # past max-lines and kept unused imports unseen.
      - name: Lint
        run: npx eslint .

      - name: Unit tests
        run: npx vitest run

      # REQ-2006: provisa.dev's live demos page is generated from demo/named/*/demo.yaml; a demo
      # published, changed or withdrawn without regenerating the page fails here.
      - name: Live demos page in step with its demos
        run: node ../scripts/gen-site-demos.mjs --check

      # The site's source picker and every count of connectors it states, in figures or in words,
      # are generated from SOURCE_TYPES; a source added without regenerating them fails here.
      - name: Site source picker and counts in step with SOURCE_TYPES
        run: node ../scripts/gen-site-source-picker.mjs --check

      # render_graph's renderer (REQ-1990): its own package, tested by node --test against its
      # built bundle -- each layout on each theme, as the MCP server runs it.
      - name: Graph renderer -- type check, build, test
        working-directory: provisa-ui/graph-render
        run: |
          npm run typecheck
          npm run build
          npm test
