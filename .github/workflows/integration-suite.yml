name: Integration suite (containers)

# The triggers and the run queue of the container-backed suite. The lanes themselves are
# integration-suite-lanes.yml, called below as one job so that one concurrency group can hold a
# whole run.
#
# Two rules, at two levels because a level takes one concurrency group:
#   * A newer push to a branch replaces that branch's older run, running or waiting (the
#     workflow-level group, per ref, cancel-in-progress). It never touches another branch's run.
#   * Runs of different branches do not overlap: the account's concurrent-job limit is smaller
#     than two runs' lanes, and two at once left each waiting hours for runners. The job-level
#     group is suite-wide and waits instead of cancelling; `queue: max` keeps every waiting run
#     (the default keeps one and cancels the rest), first in, first out.

on:
  # During alpha the full suite runs only on request (maintainer 2026-10-15): no run on push.
  # The nightly below is the warehouse lane only.
  schedule:
    # Nightly, for the warehouse lane only (06:00 UTC). A scheduled run uses the default branch's
    # copy of this file and tests that same commit: main.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit to test (a short SHA is resolved to the full one)"
        required: false
        default: ""
      lanes:
        description: "Lanes: all, or comma-separated (core, app, hive_s3, kafka, neo4j, datastores, isolated, e2e, vector, cluster)"
        required: false
        default: "all"
      tests:
        description: "Targeted run: space-separated pytest node ids or files; each named lane runs only its own of them, unsharded (empty: the whole lane)"
        required: false
        default: ""
      include_warehouse:
        description: "Also run the warehouse lane (live cloud warehouses)"
        type: boolean
        required: false
        default: false
      include_salesforce:
        description: "Also run the Salesforce lane (live org; about 2,450 of its 15,000 daily API calls when cold)"
        type: boolean
        required: false
        default: false
      include_athena:
        description: "Also run the Amazon Athena lane (live account; a few cents of scanned data)"
        type: boolean
        required: false
        default: false
      include_servicenow:
        description: "Also run the ServiceNow lane (live instance)"
        type: boolean
        required: false
        default: false
      servicenow_calcite_ref:
        description: "The kenstott/calcite ref the ServiceNow lane builds its server from"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: integration-suite-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # actions/checkout fetches a branch or a full SHA, not a short one (git exits 1 on it): a short
  # SHA dispatched as `ref` is resolved here, once, and every lane checks out the full commit. A
  # branch, a full SHA, or nothing passes through unchanged. Nothing is checked out.
  resolve-ref:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref || '' }}
        run: |
          if [[ "$REF" =~ ^[0-9a-fA-F]{7,39}$ ]]; then
            full=$(gh api "repos/$GITHUB_REPOSITORY/commits/$REF" --jq .sha)
            echo "resolved $REF -> $full"
            REF="$full"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

  lanes:
    name: lanes
    needs: resolve-ref
    uses: ./.github/workflows/integration-suite-lanes.yml
    # Passed by name; nothing is inherited.
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SPLUNKBASE_USERNAME: ${{ secrets.SPLUNKBASE_USERNAME }}
      SPLUNKBASE_PASSWORD: ${{ secrets.SPLUNKBASE_PASSWORD }}
      ASKAMERICA_API_KEY: ${{ secrets.ASKAMERICA_API_KEY }}
      ATHENA_AWS_ACCESS_KEY_ID: ${{ secrets.ATHENA_AWS_ACCESS_KEY_ID }}
      ATHENA_AWS_SECRET_ACCESS_KEY: ${{ secrets.ATHENA_AWS_SECRET_ACCESS_KEY }}
      ATHENA_REGION: ${{ secrets.ATHENA_REGION }}
      ATHENA_S3_BUCKET: ${{ secrets.ATHENA_S3_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_ENDPOINT_OVERRIDE: ${{ secrets.AWS_ENDPOINT_OVERRIDE }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      BIGQUERY_LOCATION: ${{ secrets.BIGQUERY_LOCATION }}
      BIGQUERY_TEST_GCS_BUCKET: ${{ secrets.BIGQUERY_TEST_GCS_BUCKET }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDOPS_AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDOPS_AWS_ACCESS_KEY_ID }}
      CLOUDOPS_AWS_ACCOUNT_IDS: ${{ secrets.CLOUDOPS_AWS_ACCOUNT_IDS }}
      CLOUDOPS_AWS_REGION: ${{ secrets.CLOUDOPS_AWS_REGION }}
      CLOUDOPS_AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDOPS_AWS_SECRET_ACCESS_KEY }}
      CLOUDOPS_AZURE_CLIENT_ID: ${{ secrets.CLOUDOPS_AZURE_CLIENT_ID }}
      CLOUDOPS_AZURE_CLIENT_SECRET: ${{ secrets.CLOUDOPS_AZURE_CLIENT_SECRET }}
      CLOUDOPS_AZURE_SUBSCRIPTION_IDS: ${{ secrets.CLOUDOPS_AZURE_SUBSCRIPTION_IDS }}
      CLOUDOPS_AZURE_TENANT_ID: ${{ secrets.CLOUDOPS_AZURE_TENANT_ID }}
      CLOUDOPS_GCP_CREDENTIALS_JSON_BASE64: ${{ secrets.CLOUDOPS_GCP_CREDENTIALS_JSON_BASE64 }}
      CLOUDOPS_GCP_PROJECT_IDS: ${{ secrets.CLOUDOPS_GCP_PROJECT_IDS }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DATABRICKS_SERVER_HOSTNAME: ${{ secrets.DATABRICKS_SERVER_HOSTNAME }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      FABRIC_CAPACITY_NAME: ${{ secrets.FABRIC_CAPACITY_NAME }}
      FABRIC_DATABASE: ${{ secrets.FABRIC_DATABASE }}
      FABRIC_RESOURCE_GROUP: ${{ secrets.FABRIC_RESOURCE_GROUP }}
      FABRIC_SQL_SERVER: ${{ secrets.FABRIC_SQL_SERVER }}
      FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
      SYNAPSE_SQL_SERVER: ${{ secrets.SYNAPSE_SQL_SERVER }}
      SYNAPSE_DATABASE: ${{ secrets.SYNAPSE_DATABASE }}
      SYNAPSE_ADLS_URL: ${{ secrets.SYNAPSE_ADLS_URL }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
      GSHEETS_TEST_SHEET_ID: ${{ secrets.GSHEETS_TEST_SHEET_ID }}
      PROVISA_E2E_PURVIEW_ENDPOINT: ${{ secrets.PROVISA_E2E_PURVIEW_ENDPOINT }}
      PROVISA_E2E_COLLIBRA_ENDPOINT: ${{ secrets.PROVISA_E2E_COLLIBRA_ENDPOINT }}
      PROVISA_E2E_COLLIBRA_TOKEN: ${{ secrets.PROVISA_E2E_COLLIBRA_TOKEN }}
      PROVISA_E2E_ATLAN_ENDPOINT: ${{ secrets.PROVISA_E2E_ATLAN_ENDPOINT }}
      PROVISA_E2E_ATLAN_API_TOKEN: ${{ secrets.PROVISA_E2E_ATLAN_API_TOKEN }}
      PROVISA_E2E_DATAZONE_AWS_ACCESS_KEY_ID: ${{ secrets.PROVISA_E2E_DATAZONE_AWS_ACCESS_KEY_ID }}
      PROVISA_E2E_DATAZONE_AWS_SECRET_ACCESS_KEY: ${{ secrets.PROVISA_E2E_DATAZONE_AWS_SECRET_ACCESS_KEY }}
      PROVISA_E2E_DATAZONE_DOMAIN_ID: ${{ secrets.PROVISA_E2E_DATAZONE_DOMAIN_ID }}
      PROVISA_E2E_DATAZONE_PROJECT_ID: ${{ secrets.PROVISA_E2E_DATAZONE_PROJECT_ID }}
      REDSHIFT_AWS_ACCESS_KEY_ID: ${{ secrets.REDSHIFT_AWS_ACCESS_KEY_ID }}
      REDSHIFT_AWS_REGION: ${{ secrets.REDSHIFT_AWS_REGION }}
      REDSHIFT_AWS_SECRET_ACCESS_KEY: ${{ secrets.REDSHIFT_AWS_SECRET_ACCESS_KEY }}
      SERVICENOW_INSTANCE_URL: ${{ secrets.SERVICENOW_INSTANCE_URL }}
      SERVICENOW_PASSWORD: ${{ secrets.SERVICENOW_PASSWORD }}
      SERVICENOW_USERNAME: ${{ secrets.SERVICENOW_USERNAME }}
      SF_CONSUMER_KEY: ${{ secrets.SF_CONSUMER_KEY }}
      SF_CONSUMER_SECRET: ${{ secrets.SF_CONSUMER_SECRET }}
      SF_LOGIN_URL: ${{ secrets.SF_LOGIN_URL }}
      SF_NICKNAME: ${{ secrets.SF_NICKNAME }}
      SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
      SF_SECURITY_TOKEN: ${{ secrets.SF_SECURITY_TOKEN }}
      MOTHERDUCK_API_TOKEN: ${{ secrets.MOTHERDUCK_API_TOKEN }}
      SINGLESTORE_DATABASE: ${{ secrets.SINGLESTORE_DATABASE }}
      SINGLESTORE_HOST: ${{ secrets.SINGLESTORE_HOST }}
      SINGLESTORE_PASSWORD: ${{ secrets.SINGLESTORE_PASSWORD }}
      SINGLESTORE_PORT: ${{ secrets.SINGLESTORE_PORT }}
      SINGLESTORE_USERNAME: ${{ secrets.SINGLESTORE_USERNAME }}
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SP_AUTH_TYPE: ${{ secrets.SP_AUTH_TYPE }}
      SP_CERT_P12_BASE64: ${{ secrets.SP_CERT_P12_BASE64 }}
      SP_CERT_PASSWORD: ${{ secrets.SP_CERT_PASSWORD }}
      SP_CLIENT_ID: ${{ secrets.SP_CLIENT_ID }}
      SP_SITE_URL: ${{ secrets.SP_SITE_URL }}
      SP_TENANT_ID: ${{ secrets.SP_TENANT_ID }}
    with:
      ref: ${{ needs.resolve-ref.outputs.ref }}
      lanes: ${{ inputs.lanes || 'all' }}
      tests: ${{ inputs.tests || '' }}
      include_warehouse: ${{ inputs.include_warehouse || false }}
      include_salesforce: ${{ inputs.include_salesforce || false }}
      include_athena: ${{ inputs.include_athena || false }}
      include_servicenow: ${{ inputs.include_servicenow || false }}
      servicenow_calcite_ref: ${{ inputs.servicenow_calcite_ref || '' }}
    concurrency:
      group: integration-suite
      queue: max
