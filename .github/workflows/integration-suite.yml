name: Integration suite (containers)

# The triggers and the run queue of the container-backed suite. The lanes themselves are
# integration-suite-lanes.yml, called below as one job so that one concurrency group can hold a
# whole run.
#
# Two rules, at two levels because a level takes one concurrency group:
#   * A newer push to a branch replaces that branch's older run, running or waiting (the
#     workflow-level group, per ref, cancel-in-progress). It never touches another branch's run.
#   * Runs of different branches do not overlap: the account's concurrent-job limit is smaller
#     than two runs' lanes, and two at once left each waiting hours for runners. The job-level
#     group is suite-wide and waits instead of cancelling; `queue: max` keeps every waiting run
#     (the default keeps one and cancels the rest), first in, first out.

on:
  push:
    branches: [integration, main]
    # A push that touches only the website, the documentation or a markdown file starts no
    # run -- and so replaces none: each push starts a run that cancels its branch's run in
    # flight, and a day of site and docs pushes cancelled every run before its lanes finished.
    # Later patterns win. The one documentation file a lane reads is kept in
    # (tests/steps/steps_metadata_export_docs.py reads docs/metadata-export.md); mkdocs.yml is
    # not under docs/ and counts as code. Dispatches and the nightly are not filtered.
    paths:
      - "**"
      - "!site/**"
      - "!docs/**"
      - "!**/*.md"
      - "!.github/workflows/docs.yml"
      # The website's generators write only site/ pages (2942c57fe restarted a suite mid-run for
      # a caption on the site's source picker).
      - "!scripts/gen-site-*.mjs"
      - "docs/metadata-export.md"
  schedule:
    # Nightly, for the warehouse lane only (06:00 UTC). Scheduled runs use the default branch's
    # copy of this file; the warehouse job checks out `integration` explicitly.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit to test"
        required: false
        default: ""
      lanes:
        description: "Lanes: all, or comma-separated (core, app, hive_s3, kafka, neo4j, datastores, isolated, e2e, cluster)"
        required: false
        default: "all"
      include_warehouse:
        description: "Also run the warehouse lane (live cloud warehouses)"
        type: boolean
        required: false
        default: false
      include_salesforce:
        description: "Also run the Salesforce lane (live org; about 2,450 of its 15,000 daily API calls when cold)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: integration-suite-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  lanes:
    name: lanes
    uses: ./.github/workflows/integration-suite-lanes.yml
    secrets: inherit
    with:
      ref: ${{ inputs.ref || '' }}
      lanes: ${{ inputs.lanes || 'all' }}
      include_warehouse: ${{ inputs.include_warehouse || false }}
      include_salesforce: ${{ inputs.include_salesforce || false }}
    concurrency:
      group: integration-suite
      queue: max
