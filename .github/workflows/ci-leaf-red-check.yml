# The one leaf check that ENDS RED BY DESIGN: the release job does not run after a failed need.
#
# The release's publish job runs although a job it needs was skipped (a dry run), and must NOT
# run when a job it needs failed. That second half can only be shown with a job that really
# fails: a failure contained by continue-on-error shows `success` to the job that needs it (run
# 37983239912). A run with a failed job is a failed run, so this check is kept apart from
# ci-leaf-check.yml, which must end green.
#
# How to read a run of it: `build` FAILED (on purpose), `release` SKIPPED, and `what the release
# job did` SUCCEEDED. Anything else is a defect in the release's condition.
#
# It starts only when this file or the stand-in leg changes, on a ci/** branch -- never on main
# or a tag. It reads no secret and publishes nothing.
name: CI leaf check (ends red by design)

on:
  push:
    branches: ["ci/**"]
    paths:
      - ".github/workflows/ci-leaf-red-check.yml"
      - ".github/workflows/ci-leaf-stub-leg.yml"

permissions:
  contents: read

concurrency:
  group: ci-leaf-red-check-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  release-after-a-failed-need:
    name: release / a failed need
    if: startsWith(github.ref, 'refs/heads/ci/')
    uses: ./.github/workflows/ci-leaf-stub-leg.yml
    with:
      version: v0.0.0-rc.1
      publish: false
      fail-a-need: true

  results:
    name: what the release job did
    needs: [release-after-a-failed-need]
    if: ${{ always() && startsWith(github.ref, 'refs/heads/ci/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The stand-in failed, and its release job did not run
        env:
          RESULT: ${{ needs.release-after-a-failed-need.result }}
          RAN: ${{ needs.release-after-a-failed-need.outputs.release-ran }}
        run: |
          echo "the stand-in: $RESULT; its release job ran: '${RAN}'"
          [ "$RESULT" = "failure" ]
          [ -z "$RAN" ]
