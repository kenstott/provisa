# Release: packages
#
# The Python client, the notebook assets package and the server's platform wheels (REQ-2194), each with its CVE scan, and the JDBC driver. Built here; published by the publish leg.
#
# One leg of the release. Called by build-dmg.yml (the release orchestrator) on a tag, and by a
# manual dry run of it. `version` is the release's tag; nothing here reads the pushed ref.
# `publish` is false on a dry run: every artifact is built and uploaded to the RUN exactly as on
# a tag, and every step that leaves the run -- the draft release, its attachments, PyPI, an image
# push, a signed attestation -- is skipped. A failed job of this leg is re-run alone with
# "Re-run failed jobs" on the release's run; the legs it reads from (their artifacts are the
# run's) are not built again.
name: "Release: packages"

on:
  workflow_call:
    inputs:
      version:
        description: The release tag (v0.1.0-alpha.477).
        type: string
        required: true
      publish:
        description: Leave the run (draft release, attachments, PyPI, image pushes). False on a dry run.
        type: boolean
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      jdbc_name: ${{ steps.meta.outputs.jdbc_name }}
      py_version: ${{ steps.meta.outputs.py_version }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        uses: ./.github/actions/release-metadata
        with:
          version: ${{ inputs.version }}

  # ── Python client + JDBC (unchanged) ────────────────────────────────────────

  build-python-client:
    name: Build and test Python client
    runs-on: ubuntu-latest
    needs: [metadata]
    permissions:
      contents: write   # attaches its SBOM + CVE report to the draft release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install and test
        run: |
          pip install -e "provisa-client/[dev]" -q
          python -m pytest provisa-client/tests/ -x -q

      - name: Stamp version and build dist
        run: |
          sed -i 's/^version = .*/version = "${{ needs.metadata.outputs.py_version }}"/' \
            provisa-client/pyproject.toml
          pip install build -q
          python -m build provisa-client/ --outdir provisa-client/dist/

      # SBOM + vulnerability gate for what actually ships: the venv "Install and test" resolved
      # for provisa-client (its own pyproject has no lockfile, unlike the root package's uv.lock).
      # pip-audit's non-zero exit on any finding fails this job, which fails publish-pypi via its
      # existing `needs: build-python-client` — no separate gating job/needs wiring required.
      - name: Generate SBOM (CycloneDX)
        run: |
          mkdir -p sbom
          pip install cyclonedx-bom -q
          cyclonedx-py environment --of JSON -o sbom/provisa-client-sbom.cdx.json

      - name: CVE scan (gates PyPI publish)
        run: |
          set -o pipefail
          pip install pip-audit -q
          pip-audit --timeout 60 -f json | tee sbom/provisa-client-cve-report.json

      - name: Ensure release exists
        if: inputs.publish
        uses: ./.github/actions/ensure-release
        with:
          tag: ${{ inputs.version }}

      # Kept OUT of provisa-client/dist/ (a sibling sbom/ dir): pypa/gh-action-pypi-publish globs
      # packages-dir for everything to upload to PyPI, and these attestation-adjacent JSON files
      # are not packages — they attach to the GitHub Release only.
      - name: Attach SBOM + CVE report to draft release
        if: inputs.publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            sbom/provisa-client-sbom.cdx.json \
            sbom/provisa-client-cve-report.json \
            --clobber

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: python-client-dist
          path: provisa-client/dist/
          retention-days: 1

  # REQ-2194: the UI, built once; the same built assets go into every platform's provisa wheel.
  build-provisa-ui:
    name: Build the provisa UI (for every provisa wheel)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python (offline docs site)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node 20 (vite build)
        uses: ./.github/actions/setup-ui
        with:
          node-version: "20"

      # `npm run build`'s prebuild hook renders the offline MkDocs site into the UI's build; without
      # mkdocs on PATH it fails with ENOENT.
      - name: Install docs-site build deps (mkdocs)
        uses: ./.github/actions/docs-site-deps

      - name: Build provisa-ui
        run: cd provisa-ui && npm run build

      # Not a -dist name: it is an input of the wheels, not a release asset.
      - name: Upload the built UI
        uses: actions/upload-artifact@v4
        with:
          name: provisa-ui-build
          path: provisa-ui/dist/
          if-no-files-found: error
          retention-days: 1

  # REQ-2194: provisa's wheels. provisa carries provisa._encoders, Provisa's Rust encoders compiled
  # by setuptools-rust, so it is one cp312 wheel per supported platform (REQ-294: macOS arm64,
  # Linux x86_64, Linux arm64 and Windows x86_64), each
  # with the UI built above, the config and buenavista. Linux wheels come from the Dockerfile's
  # provisa-wheel stage (manylinux_2_28, zig-linked); macOS (arm64 only: Intel Macs are not
  # supported) and Windows from `python -m build` on the runner. Each wheel is checked and imported
  # on its own platform before it is uploaded. The linux-x86_64 row also builds the sdist, and proves a wheel builds from it with
  # cargo present. Published to PyPI by the orchestrator, after every artifact exists; the -dist
  # names also attach them to the GitHub release.
  build-provisa-wheel:
    name: Build provisa wheel (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    needs: [metadata, build-provisa-ui]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux-x86_64, runner: ubuntu-latest, arch: x64, tag: manylinux_2_28_x86_64, sdist: true }
          - { label: linux-aarch64, runner: ubuntu-24.04-arm, arch: arm64, tag: manylinux_2_28_aarch64 }
          - { label: macos-arm64, runner: macos-15, arch: arm64, tag: 'macosx_\d+_\d+_arm64' }
          - { label: windows-x64, runner: windows-latest, arch: x64, tag: win_amd64 }
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}

      - name: Download the built UI
        uses: actions/download-artifact@v4
        with:
          name: provisa-ui-build
          path: provisa-ui/dist/

      # The toolchain every recipe names (the Dockerfile's rust image). Linux wheels compile in the
      # Dockerfile's stage; the linux-x86_64 row's sdist check compiles here.
      - name: Install the Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal

      # REQ-2071: provisa depends on provisa-notebook at this same release's version.
      - name: Stamp the version
        run: |
          sed -i.orig 's/^version = .*/version = "${{ needs.metadata.outputs.py_version }}"/' pyproject.toml
          sed -i.orig 's/"provisa-notebook==[^"]*"/"provisa-notebook==${{ needs.metadata.outputs.py_version }}"/' pyproject.toml
          rm pyproject.toml.orig
          grep -q '^version = "${{ needs.metadata.outputs.py_version }}"' pyproject.toml
          grep -q '"provisa-notebook==${{ needs.metadata.outputs.py_version }}"' pyproject.toml

      - name: Build the wheel (bundles the UI, config, buenavista and provisa._encoders)
        env:
          PY: ${{ steps.python.outputs.python-path }}
          SDIST: ${{ matrix.sdist }}
        run: |
          "$PY" -m pip install --quiet "build==1.6.1"
          if [ "$SDIST" = "true" ]; then
            PROVISA_SKIP_UI_BUILD=1 PYTHON="$PY" scripts/build-wheel.sh --sdist --wheel
          else
            PROVISA_SKIP_UI_BUILD=1 PYTHON="$PY" scripts/build-wheel.sh --wheel
          fi

      - name: Verify the wheel's tag and import its encoders
        env:
          PY: ${{ steps.python.outputs.python-path }}
          TAG: ${{ matrix.tag }}
        run: '"$PY" scripts/check-provisa-wheel.py dist/provisa-*.whl --tag "$TAG" --import'

      - name: Verify the wheel is self-contained
        env:
          PY: ${{ steps.python.outputs.python-path }}
        run: |
          "$PY" - <<'PY'
          import glob, zipfile, sys
          wheel = glob.glob("dist/provisa-*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          missing = [n for n in ("provisa/cli.py", "buenavista/core.py", "provisa/_ui/index.html") if n not in names]
          missing += [p for p in ("provisa/_ui/", "provisa/_config/") if not any(n.startswith(p) for n in names)]
          leaked = [n for n in names if "node_modules" in n or n.startswith("provisa_client/")]
          if missing or leaked:
              print("missing:", missing, "\nleaked:", leaked[:5]); sys.exit(1)
          print(f"OK: {wheel} self-contained ({len(names)} members)")
          PY

      # The sdist is published only because a wheel builds from it where cargo is present.
      - name: Build a wheel from the sdist and import its encoders
        if: matrix.sdist
        env:
          PY: ${{ steps.python.outputs.python-path }}
          RUSTUP_TOOLCHAIN: '1.95.0'
        run: |
          set -euo pipefail
          "$PY" -m pip wheel --quiet --no-deps --wheel-dir sdist-check dist/provisa-*.tar.gz
          "$PY" scripts/check-provisa-wheel.py sdist-check/provisa-*.whl --import

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: provisa-wheel-${{ matrix.label }}-dist
          path: dist/provisa-*
          if-no-files-found: error
          retention-days: 1

  # The server's SBOM and CVE report, once for every provisa wheel (one locked dependency set).
  provisa-sbom:
    name: provisa SBOM + CVE scan
    runs-on: ubuntu-latest
    needs: [metadata]
    permissions:
      contents: write   # attaches its SBOM + CVE report to the draft release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: ./.github/actions/setup-python
        with:
          sync: "false"

      # SBOM + vulnerability gate for what actually ships: the root uv.lock (same locked
      # dependency set cve-audit.yml already scans continuously) rather than the build runner's
      # own pip environment, which only has `build`/mkdocs installed, not provisa's own deps.
      # pip-audit's non-zero exit on any finding fails this job, so this leg, which
      # publish-provisa-pypi needs — no separate gating job/needs wiring needed.
      - name: Export locked dependencies
        # pipefail: without it the step's status is grep's, and an export that failed left an
        # empty or partial file for the audit to pass on.
        run: |
          set -o pipefail
          uv export --frozen --all-extras --no-emit-project --no-hashes --format requirements-txt \
            | grep -vE '^-e |@ file://|^[[:space:]]*#' > requirements-audit.txt

      - name: Generate SBOM (CycloneDX)
        run: |
          mkdir -p sbom
          uvx --from cyclonedx-bom cyclonedx-py requirements requirements-audit.txt \
            --of JSON -o sbom/provisa-sbom.cdx.json

      - name: CVE scan (gates PyPI publish)
        run: |
          set -o pipefail
          uvx --python 3.12 pip-audit --timeout 60 -r requirements-audit.txt --no-deps -f json \
            | tee sbom/provisa-cve-report.json

      - name: Ensure release exists
        if: inputs.publish
        uses: ./.github/actions/ensure-release
        with:
          tag: ${{ inputs.version }}

      # Kept OUT of dist/ (a sibling sbom/ dir): pypa/gh-action-pypi-publish globs packages-dir
      # for everything to upload to PyPI, and these attestation-adjacent JSON files are not
      # packages — they attach to the GitHub Release only.
      - name: Attach SBOM + CVE report to draft release
        if: inputs.publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            sbom/provisa-sbom.cdx.json \
            sbom/provisa-cve-report.json \
            --clobber

  # REQ-2071: the Data Science area's Pyodide, its packages and the provisa-client wheel, a
  # package of its own beside provisa (PyPI caps a file at 100 MB) at the same version, which
  # provisa pins. Published with provisa by the orchestrator, after every artifact exists.
  build-provisa-notebook:
    name: Build provisa-notebook (in-browser Python assets)
    runs-on: ubuntu-latest
    needs: [metadata]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: ./.github/actions/setup-python
        with:
          sync: "false"

      - name: Test
        run: |
          PYTHONPATH=provisa-notebook uvx --with pytest pytest provisa-notebook/tests -q

      # The client wheel inside it carries the release's version, as the published client does.
      - name: Stamp versions, fetch the assets and build the wheel
        run: |
          sed -i 's/^version = .*/version = "${{ needs.metadata.outputs.py_version }}"/' \
            provisa-notebook/pyproject.toml provisa-client/pyproject.toml
          (cd provisa-notebook && python -m provisa_notebook.build)
          pip install build -q
          python -m build --wheel provisa-notebook/ --outdir provisa-notebook/dist/

      - name: Verify the wheel carries its assets and fits PyPI
        run: |
          python - <<'PY'
          import glob, json, os, sys, zipfile
          [wheel] = glob.glob("provisa-notebook/dist/provisa_notebook-*.whl")
          z = zipfile.ZipFile(wheel)
          names = set(z.namelist())
          base = "provisa_notebook/assets/pyodide/"
          manifest = json.loads(z.read(base + "manifest.json"))
          need = [base + n for n in ("pyodide.mjs", "pyodide.asm.wasm", "python_stdlib.zip",
                                     "pyodide-lock.json", manifest["client_wheel"])]
          need.append("provisa_notebook/assets/lite/jupyter-lite.json")
          missing = [n for n in need if n not in names]
          size = os.path.getsize(wheel)
          print(f"{wheel}: {size / 1e6:.1f} MB, {len(names)} members, {manifest['packages']}")
          if missing or size >= 100 * 1000 * 1000:
              print("missing:", missing, "size:", size); sys.exit(1)
          PY

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: provisa-notebook-dist
          path: provisa-notebook/dist/
          retention-days: 1

  build-jdbc:
    name: Build JDBC driver
    runs-on: ubuntu-latest
    needs: [metadata]
    permissions:
      contents: write   # attest-build-provenance + attach SBOM/CVE report to the draft release
      id-token: write   # actions/attest-build-provenance signs via Sigstore/OIDC
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Build shaded JAR
        run: mvn -f jdbc-driver/pom.xml -B package -DskipTests

      - name: Rename JAR with version + channel
        run: |
          mv jdbc-driver/target/provisa-jdbc-*.jar \
             "jdbc-driver/target/${{ needs.metadata.outputs.jdbc_name }}"

      # CycloneDX Maven plugin (invoked ad hoc — not added to jdbc-driver/pom.xml, this is a
      # CI-only concern) has the real dependency tree; grype below only sees the shaded jar's
      # flattened classes, so the two are complementary rather than redundant.
      - name: Generate SBOM (CycloneDX Maven plugin)
        run: |
          mvn -f jdbc-driver/pom.xml -q org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
          mkdir -p sbom
          cp jdbc-driver/target/bom.json sbom/provisa-jdbc-sbom.cdx.json

      - name: Install grype
        # pipefail: a failed download otherwise hands `sh` nothing and the step passes.
        run: |
          set -o pipefail
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: CVE scan (gates the release — fails on any medium+ finding)
        run: |
          grype "jdbc-driver/target/${{ needs.metadata.outputs.jdbc_name }}" \
            -o json --file sbom/provisa-jdbc-cve-report.json --fail-on medium

      # GitHub-native artifact attestation (Sigstore-backed, same trust root as PyPI's PEP 740):
      # this jar is attached to the Release, never published to Maven Central, so there is no
      # gh-action-pypi-publish step to hook attestations:true into.
      - name: Sign JAR (Sigstore attestation)
        if: inputs.publish
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "jdbc-driver/target/${{ needs.metadata.outputs.jdbc_name }}"

      - name: Ensure release exists
        if: inputs.publish
        uses: ./.github/actions/ensure-release
        with:
          tag: ${{ inputs.version }}

      - name: Attach SBOM + CVE report to draft release
        if: inputs.publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            sbom/provisa-jdbc-sbom.cdx.json \
            sbom/provisa-jdbc-cve-report.json \
            --clobber

      - name: Upload JDBC JAR
        uses: actions/upload-artifact@v4
        with:
          name: jdbc-jar
          path: "jdbc-driver/target/${{ needs.metadata.outputs.jdbc_name }}"
          retention-days: 1
