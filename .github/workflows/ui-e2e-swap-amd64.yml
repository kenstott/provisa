name: UI e2e (swap lane, amd64-only sources)

# engine-swap.spec.ts's "swap" Playwright project (playwright.config.ts's SWAP_SPECS) runs in NO
# other workflow — ui-e2e-trino.yml runs only --project=trino and ui-e2e-core.yml only
# --project=core. Its exasol and saphana cases are themselves gated on RUNNING_IN_CI (exasol:
# exasol/docker-db never turns healthy under Apple Silicon's QEMU, same root cause as
# amd64-engines.yml; saphana: HXE doesn't start under Docker Desktop's Apple Silicon VM either),
# so before this workflow they never ran anywhere, CI or dev box. Scoped to just these two
# sources for now (-g), not the full swap suite — see amd64-engines.yml's own module comment for
# the same "only a genuine amd64 host runs this for real" reasoning.
#
# Needs the same core-service stack as ui-e2e-trino.yml (postgres/trino/minio/zaychik): the swap
# Playwright project requires RUNS_TRINO (playwright.config.ts), and both exasol's and saphana's
# swap tests query through the Trino engine after the DuckDB-registered source is swapped.

on:
  # Runs on dispatch for a release (gh workflow run <workflow> --ref <release branch>): it gates the
  # release (REQ-1989). No push starts it.
  workflow_dispatch:
    # A retest of named specs: each a file or file:line under provisa-ui (e2e/x.spec.ts,
    # e2e/x.spec.ts:42), space-separated. The lane's provisioning runs as on a full run; Playwright
    # is given only these. Empty: the whole lane.
    inputs:
      specs:
        description: "Only these specs (e2e/x.spec.ts or e2e/x.spec.ts:42, space-separated); empty runs the whole lane"
        type: string
        required: false
        default: ""
  # Callable: by an orchestrator, and by the proof of the CI's own structure. Reads no secret.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ui-e2e-swap-amd64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright swap lane (exasol, saphana)
    uses: ./.github/workflows/lane.yml
    with:
      name: ui-swap-amd64
      timeout: 90
      # saphana (hdbcli + sqlalchemy-hana) is demo/sources/saphana/prime.py's own dependency.
      python-extras: dev saphana
      ui: chromium
      # CI: every webServer is started by the harness. PROVISA_E2E_LANE=trino declares the Trino
      # webServer and keeps the control plane on the compose Postgres. PG_PORT / TRINO_PORT pin
      # what docker-compose.core.yml publishes so playwright.config.ts's `docker compose port`
      # lookup and the Trino backend agree with the binding. PROVISA_OTEL_S3_ENDPOINT: the
      # backends run on the host, where the compose name "minio" does not resolve; minio
      # publishes 9000 there.
      # PROVISA_E2E_ORG_ID == PROVISA_E2E_TRINO_ORG_ID: the harness registers a source on the
      # DuckDB backend and reads it back on the Trino one, so both must serve the SAME org schema
      # (engine-swap.spec.ts's documented invocation). Left unset they are "e2e" and "e2e_trino",
      # and the second engine answered "source … not found on this engine's control-plane
      # schema" (swap lane on v0.1.0-alpha.478).
      env: |
        CI=true
        PROVISA_E2E_LANE=trino
        PROVISA_E2E_SPECS=${{ inputs.specs }}
        PG_PORT=5432
        TRINO_PORT=8080
        PROVISA_OTEL_S3_ENDPOINT=http://localhost:9000
        PROVISA_E2E_ORG_ID=e2e_swap
        PROVISA_E2E_TRINO_ORG_ID=e2e_swap
      prepare: scripts/ci/lanes/trino-stack-prepare.sh placeholder-cert
      working-directory: provisa-ui
      # A named spec that is not there fails here: with --pass-with-no-tests a mistyped one would
      # otherwise run nothing and pass.
      run: >-
        for spec in $PROVISA_E2E_SPECS; do test -f "${spec%%:*}" || { echo "::error::no spec ${spec%%:*}"; exit 1; }; done; 
        npx playwright test --project=swap -g "exasol|saphana" --reporter=list,html $PROVISA_E2E_SPECS ${PROVISA_E2E_SPECS:+--pass-with-no-tests}
      on-failure: scripts/ci/lanes/trino-stack-on-failure.sh
      artifact-name: playwright-report-swap-amd64
      artifact-path: provisa-ui/playwright-report/
      artifact-retention: 7
      artifact-on-failure-name: trino-container-log-swap-amd64
      artifact-on-failure-path: trino-container.log
