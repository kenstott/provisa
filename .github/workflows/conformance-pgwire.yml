name: Conformance (pgwire)

# REQ-2167: Provisa's pgwire endpoint against public conformance checks, the first conformance job.
# Four parts, one run, one report:
#
#   * pgspec, the PostgreSQL v3 wire-protocol compliance suite (github.com/goceleris/celeris,
#     package test/pgspec, Apache-2.0), fetched at a pinned version by `go mod download` (checked
#     against sum.golang.org) and run with `go test -json -tags pgspec`, one top-level test per
#     invocation so a test that panics the binary costs only its own subtests;
#   * catalog shape: every pg_catalog / information_schema relation and pg_catalog function
#     Provisa serves, against a real PostgreSQL of a pinned version (pg_attribute, pg_proc);
#   * catalog coverage: the relations and functions that PostgreSQL has and Provisa does not;
#   * type conversions: type OID, typmod, text and binary encoding of each fixture type and of the
#     casts tools commonly issue, against the same statement on that PostgreSQL.
#
# A failing test or a difference is data, written to the job summary and to the artifact
# conformance-pgwire.json, never a job failure. The job fails only when the Provisa instance did
# not start or the suite did not run.
#
# The instance is the one the core UI lane boots (provisa-ui/playwright.config.ts): the embedded
# PostgreSQL control plane (provisa.core.control_plane_pg) and `uvicorn main:app` on the DuckDB
# engine, natively on the runner, its pgwire server on PROVISA_PGWIRE_PORT, the model loaded by
# PUT /admin/config as global-setup does. No auth provider, so pgwire is in trust mode: the startup
# user names the role (org_admin) and no password is asked for.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit or branch to test (default: the dispatched one)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: conformance-pgwire-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  pgwire:
    name: pgwire conformance
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # pgspec's pinned version: its module, its Go toolchain (go.mod says go 1.27.0).
      PGSPEC_MODULE: github.com/goceleris/celeris
      PGSPEC_VERSION: v1.5.11
      # The ports the core UI lane gives its first backend (playwright.config.ts: base + 1..5).
      PROVISA_API_PORT: "8901"
      PROVISA_PGWIRE_PORT: "8906"
      # The real PostgreSQL (the service below) the catalog and type comparisons run against, and
      # the source Provisa registers over it. An ephemeral service on the runner: not a secret.
      CONFORMANCE_PG_HOST: 127.0.0.1
      CONFORMANCE_PG_PORT: "55432"
      CONFORMANCE_PG_DATABASE: conformance
      CONFORMANCE_PG_USER: postgres
      CONFORMANCE_PG_PASSWORD: conformance
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_PASSWORD: conformance
          POSTGRES_DB: conformance
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python
        uses: ./.github/actions/setup-python
        with:
          extras: dev

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: false

      - name: Fetch pgspec
        run: |
          mod_dir=$(go mod download -json "$PGSPEC_MODULE@$PGSPEC_VERSION" | python3 -c 'import json,sys; print(json.load(sys.stdin)["Dir"])')
          # The module cache is read-only; the suite builds from a writable copy.
          cp -R "$mod_dir" "$RUNNER_TEMP/celeris"
          chmod -R u+w "$RUNNER_TEMP/celeris"
          echo "PGSPEC_DIR=$RUNNER_TEMP/celeris" >> "$GITHUB_ENV"
          head -n 3 "$RUNNER_TEMP/celeris/LICENSE"
          cd "$RUNNER_TEMP/celeris"
          go vet -tags pgspec ./test/pgspec/
          go test -tags pgspec -list '.*' ./test/pgspec/ | grep '^Test' > "$RUNNER_TEMP/pgspec-tests.txt"
          echo "top-level tests:"; cat "$RUNNER_TEMP/pgspec-tests.txt"
          test -s "$RUNNER_TEMP/pgspec-tests.txt"

      # The fixture the type comparison reads, in the real PostgreSQL: conformance.types_fixture,
      # one column per type, one row. pgspec needs no fixture -- every table it touches it creates
      # itself, in its own session, as CREATE TEMP TABLE pgspec_* -- and no particular database:
      # its DSN names Provisa's default database, provisa.
      - name: Seed the PostgreSQL fixture
        run: |
          .venv/bin/python scripts/conformance/pgwire_catalog_types.py seed \
            --pg "host=$CONFORMANCE_PG_HOST port=$CONFORMANCE_PG_PORT dbname=$CONFORMANCE_PG_DATABASE user=$CONFORMANCE_PG_USER password=$CONFORMANCE_PG_PASSWORD"

      # The model, and how it presents the fixture under the names PostgreSQL gives it, so the same
      # statement runs unchanged on both servers:
      #   domain  conformance           -> the pgwire schema `conformance`
      #   source  conformance-pg        -> the PostgreSQL service above (postgresql)
      #   table   types_fixture         -> registered from schema `conformance`, alias types_fixture
      #   columns c_bool .. c_point     -> their own names, every one visible to org_admin
      # naming.domain_prefix is false, so the table keeps its own name under the domain's schema.
      # The full model is scripts/conformance/pgwire_catalog_types.py (provisa_config).
      - name: Start the Provisa instance
        id: start
        run: |
          home="$RUNNER_TEMP/provisa"
          mkdir -p "$home"
          .venv/bin/python scripts/conformance/pgwire_catalog_types.py config \
            --out "$home/provisa.yaml" --pg-port "$CONFORMANCE_PG_PORT"
          started=$(.venv/bin/python -m provisa.core.control_plane_pg start "$home/control-pg" --init-sql db/init.sql)
          cp_host=$(sed -n 's/^PG_HOST=//p' <<<"$started")
          cp_port=$(sed -n 's/^PG_PORT=//p' <<<"$started")
          cp_password=$(sed -n 's/^PG_PASSWORD=//p' <<<"$started")
          echo "::add-mask::$cp_password"
          test -n "$cp_host" && test -n "$cp_port" && test -n "$cp_password"
          cp_url="postgresql+psycopg://provisa:$cp_password@/provisa?host=$cp_host&port=$cp_port"
          key=$(python3 -c 'import base64, os; print(base64.b64encode(os.urandom(32)).decode())')
          echo "::add-mask::$key"
          GRPC_PORT=$((PROVISA_API_PORT + 1)) \
          FLIGHT_PORT=$((PROVISA_API_PORT + 2)) \
          PROVISA_BOLT_PORT=$((PROVISA_API_PORT + 3)) \
          PROVISA_MCP_PORT=$((PROVISA_API_PORT + 4)) \
          PROVISA_DATA_DIR="$home" \
          PROVISA_TELEMETRY_DIR="$home/telemetry" \
          PROVISA_CONFIG="$home/provisa.yaml" \
          PROVISA_HOME="$home" \
          PROVISA_LICENSING_SANDBOX_DIR="$home/licensing" \
          PYTHON_KEYRING_BACKEND=tests._memory_keyring.MemoryKeyring \
          PROVISA_ENCRYPTION_KEY="$key" \
          ORG_ID=conformance \
          TENANT_DATABASE_URL="$cp_url" \
          PLATFORM_DATABASE_URL="$cp_url" \
            nohup .venv/bin/uvicorn main:app --host 127.0.0.1 --port "$PROVISA_API_PORT" \
            > "$home/server.log" 2>&1 &
          echo $! > "$home/server.pid"
          for _ in $(seq 1 90); do
            curl -sf "http://127.0.0.1:$PROVISA_API_PORT/health" >/dev/null && break
            sleep 2
          done
          curl -sf "http://127.0.0.1:$PROVISA_API_PORT/health" >/dev/null || { echo "::error::Provisa never answered /health"; tail -n 200 "$home/server.log"; exit 1; }
          # The model, as global-setup.ts bootstraps each backend (PUT /admin/config).
          status=$(curl -s -o "$home/config-response.txt" -w '%{http_code}' --retry 5 --retry-all-errors --retry-delay 3 \
            -X PUT -H 'Content-Type: application/yaml' --data-binary @"$home/provisa.yaml" \
            "http://127.0.0.1:$PROVISA_API_PORT/admin/config")
          if [ "${status:0:1}" != "2" ]; then
            echo "::error::PUT /admin/config answered $status"; cat "$home/config-response.txt"; tail -n 200 "$home/server.log"; exit 1
          fi
          # Warm (REQ-1882's readiness probe): the first statement is not paying for the warm-up.
          for _ in $(seq 1 90); do
            curl -sf "http://127.0.0.1:$PROVISA_API_PORT/ready" >/dev/null && break
            sleep 2
          done
          curl -sf "http://127.0.0.1:$PROVISA_API_PORT/ready" >/dev/null || { echo "::error::Provisa never answered /ready"; tail -n 200 "$home/server.log"; exit 1; }
          for _ in $(seq 1 60); do
            (exec 3<>"/dev/tcp/127.0.0.1/$PROVISA_PGWIRE_PORT") 2>/dev/null && break
            sleep 2
          done
          (exec 3<>"/dev/tcp/127.0.0.1/$PROVISA_PGWIRE_PORT") 2>/dev/null || { echo "::error::pgwire never listened on $PROVISA_PGWIRE_PORT"; tail -n 200 "$home/server.log"; exit 1; }
          echo "Provisa is up: API $PROVISA_API_PORT, pgwire $PROVISA_PGWIRE_PORT"

      # One `go test` per top-level test: a failure is data (continue-on-error), and a test that
      # panics the binary loses only its own subtests, which the summary names "not reached".
      - name: Run pgspec
        continue-on-error: true
        timeout-minutes: 30
        env:
          CELERIS_PG_DSN: postgres://org_admin@127.0.0.1:${{ env.PROVISA_PGWIRE_PORT }}/provisa?sslmode=disable
        run: |
          cd "$PGSPEC_DIR"
          : > "$RUNNER_TEMP/pgspec-results.jsonl"
          failed=0
          while read -r t; do
            echo "::group::$t"
            go test -json -tags pgspec -count=1 -timeout 300s -run "^${t}\$" ./test/pgspec/ \
              | tee -a "$RUNNER_TEMP/pgspec-results.jsonl" \
              | python3 -c 'import json,sys
          for l in sys.stdin:
              e = json.loads(l) if l.startswith("{") else {}
              if e.get("Action") in ("pass", "fail", "skip") and e.get("Test"):
                  print(e["Action"], e["Test"])' || failed=1
            echo "::endgroup::"
          done < "$RUNNER_TEMP/pgspec-tests.txt"
          exit "$failed"

      - name: Compare the catalog and types with PostgreSQL
        timeout-minutes: 30
        run: |
          .venv/bin/python scripts/conformance/pgwire_catalog_types.py probe \
            --pg "host=$CONFORMANCE_PG_HOST port=$CONFORMANCE_PG_PORT dbname=$CONFORMANCE_PG_DATABASE user=$CONFORMANCE_PG_USER password=$CONFORMANCE_PG_PASSWORD" \
            --provisa "host=127.0.0.1 port=$PROVISA_PGWIRE_PORT dbname=provisa user=org_admin sslmode=disable" \
            --out-json "$RUNNER_TEMP/catalog-types.json" --out-md "$RUNNER_TEMP/catalog-types.md"

      - name: Summarise
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/report"
          python3 scripts/conformance/pgspec_summary.py \
            "$PGSPEC_DIR/test/pgspec/pgspec_test.go" "$RUNNER_TEMP/pgspec-results.jsonl" \
            "$RUNNER_TEMP/pgspec.json" "$RUNNER_TEMP/pgspec.md" "$PGSPEC_VERSION" || ran=$?
          if [ -f "$RUNNER_TEMP/catalog-types.json" ]; then
            jq -s '{pgspec: .[0], catalog_relations: .[1].catalog_relations, catalog_functions: .[1].catalog_functions, type_conversions: .[1].type_conversions, postgres_version: .[1].postgres_version}' \
              "$RUNNER_TEMP/pgspec.json" "$RUNNER_TEMP/catalog-types.json" > "$RUNNER_TEMP/report/conformance-pgwire.json"
          else
            echo "## pgwire catalog and types: the comparison did not complete (see its step)" > "$RUNNER_TEMP/catalog-types.md"
            jq '{pgspec: ., catalog_relations: null, catalog_functions: null, type_conversions: null}' \
              "$RUNNER_TEMP/pgspec.json" > "$RUNNER_TEMP/report/conformance-pgwire.json"
          fi
          cat "$RUNNER_TEMP/pgspec.md" "$RUNNER_TEMP/catalog-types.md" > "$RUNNER_TEMP/report/conformance-pgwire.md"
          cat "$RUNNER_TEMP/report/conformance-pgwire.md" >> "$GITHUB_STEP_SUMMARY"
          cp "$RUNNER_TEMP/pgspec-results.jsonl" "$RUNNER_TEMP/provisa/server.log" "$RUNNER_TEMP/report/"
          exit "${ran:-0}"

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: conformance-pgwire
          path: ${{ runner.temp }}/report/
          if-no-files-found: warn

      - name: Server log on failure
        if: ${{ failure() }}
        run: tail -n 400 "$RUNNER_TEMP/provisa/server.log" || true

      - name: Stop the Provisa instance
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/provisa/server.pid" ]; then kill "$(cat "$RUNNER_TEMP/provisa/server.pid")" || true; fi
          if [ -d "$RUNNER_TEMP/provisa/control-pg" ]; then .venv/bin/python -m provisa.core.control_plane_pg stop "$RUNNER_TEMP/provisa/control-pg" || true; fi
