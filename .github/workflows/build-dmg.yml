# The release: every installer, package and image of one version, and its publication.
#
# A thin orchestrator. Each job below is one leg, a reusable workflow of its own
# (release-prebuilt / -packages / -macos / -windows / -linux / -publish); this file says only
# what a release is made of and in what order.
#
#   prebuilt ─┬─ macos ───┐
#             ├─ windows ─┤
#             └─ linux ───┼─ publish
#   packages ─────────────┘
#
# On a tag (v*) the release is built and published as it always was. Run by hand (Actions ->
# Build Provisa Packages -> Run workflow) it is a DRY RUN: every artifact is built and uploaded
# to the run under the names the given `version` produces, and nothing leaves the run -- no
# draft release, no attachment, no PyPI upload, no image push, no signed attestation. A manual
# run publishes only when it is started ON the tag whose version it names (re-publishing that
# tag) with `publish` checked.
#
# A failed job is re-run alone with "Re-run failed jobs": the legs that passed are not built
# again, and the artifacts they uploaded to the run are still there for the leg that reads them.
name: Build Provisa Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: The version to build, as a tag (v0.0.0-dryrun.1). Names every artifact.
        type: string
        required: true
      publish:
        description: Publish. Honoured only when this run is started on that same tag.
        type: boolean
        default: false

# One release at a time; a dry run never cancels one (nor another dry run of another ref).
concurrency:
  group: ${{ github.event_name == 'push' && 'release' || format('release-dry-run-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  prebuilt:
    name: Prebuilt inputs
    uses: ./.github/workflows/release-prebuilt.yml
    with:
      version: ${{ inputs.version || github.ref_name }}
      publish: ${{ github.event_name == 'push' || (inputs.publish == true && github.ref_type == 'tag' && github.ref_name == inputs.version) }}

  packages:
    name: Packages
    # The union of what the leg's jobs ask for: attach SBOMs to the draft release (contents),
    # Sigstore for the JAR's attestation (id-token, attestations).
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-packages.yml
    with:
      version: ${{ inputs.version || github.ref_name }}
      publish: ${{ github.event_name == 'push' || (inputs.publish == true && github.ref_type == 'tag' && github.ref_name == inputs.version) }}

  macos:
    name: macOS installers
    needs: prebuilt
    uses: ./.github/workflows/release-macos.yml
    with:
      version: ${{ inputs.version || github.ref_name }}
      publish: ${{ github.event_name == 'push' || (inputs.publish == true && github.ref_type == 'tag' && github.ref_name == inputs.version) }}
    secrets:
      APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
      APPLE_CERT_P12_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
      APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
      APPLE_NOTARYTOOL_APPLE_ID: ${{ secrets.APPLE_NOTARYTOOL_APPLE_ID }}
      APPLE_NOTARYTOOL_PASSWORD: ${{ secrets.APPLE_NOTARYTOOL_PASSWORD }}
      APPLE_NOTARYTOOL_TEAM_ID: ${{ secrets.APPLE_NOTARYTOOL_TEAM_ID }}

  windows:
    name: Windows installers
    needs: prebuilt
    uses: ./.github/workflows/release-windows.yml
    with:
      version: ${{ inputs.version || github.ref_name }}
      publish: ${{ github.event_name == 'push' || (inputs.publish == true && github.ref_type == 'tag' && github.ref_name == inputs.version) }}
    secrets:
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PFX_PASSWORD }}
      WINDOWS_CERT_TIMESTAMP_URL: ${{ secrets.WINDOWS_CERT_TIMESTAMP_URL }}

  linux:
    name: Linux AppImage
    needs: prebuilt
    uses: ./.github/workflows/release-linux.yml
    with:
      version: ${{ inputs.version || github.ref_name }}
      publish: ${{ github.event_name == 'push' || (inputs.publish == true && github.ref_type == 'tag' && github.ref_name == inputs.version) }}

  # Only after every leg has succeeded, and every publication is in this leg -- PyPI (server and
  # client), the release's attachments and undraft, the image pushes. Nothing that cannot be
  # taken back happens until every artifact exists; a failed or partial run publishes nothing.
  publish:
    name: Attach and publish
    needs: [prebuilt, packages, macos, windows, linux]
    # The union of what the leg's jobs ask for: attach to and undraft the release (contents),
    # PyPI trusted publishing with its Sigstore attestation (id-token), the image pushes
    # (packages).
    permissions:
      contents: write
      id-token: write
      packages: write
    uses: ./.github/workflows/release-publish.yml
    with:
      version: ${{ inputs.version || github.ref_name }}
      publish: ${{ github.event_name == 'push' || (inputs.publish == true && github.ref_type == 'tag' && github.ref_name == inputs.version) }}
