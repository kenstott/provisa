# The release: every installer, package and image of one version, and its publication.
#
# A thin orchestrator. Each job below is one leg, a reusable workflow of its own
# (release-prebuilt / -packages / -macos / -windows / -linux / -publish); this file says only
# what a release is made of and in what order.
#
#   prebuilt ─┬─ macos ───┐
#             ├─ windows ─┤
#             └─ linux ───┼─ publish-pypi, publish-notebook-pypi ── publish-provisa-pypi ── publish
#   packages ─────────────┘
#
# A tag starts nothing. Run by hand (Actions -> Build Provisa Packages -> Run workflow) on
# release/<version>, once the suites are green there, it is the release's DRY RUN, which "Release:
# cut" requires: every artifact is built and uploaded to the run under the names the given
# `version` produces, and nothing leaves the run -- no draft release, no attachment, no PyPI
# upload, no image push, no signed attestation. A run publishes only when it is started ON the tag
# whose version it names with `publish` checked, which is how "Release: cut" starts it.
#
# A failed job is re-run alone with "Re-run failed jobs": the legs that passed are not built
# again, and the artifacts they uploaded to the run are still there for the leg that reads them.
name: Build Provisa Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          The version to build, shaped as a release tag (v0.0.0-alpha.1): it names every artifact
          and is stamped into the wheels, so only -alpha.N / -beta.N / -rc.N suffixes convert.
        type: string
        required: true
      publish:
        description: Publish. Honoured only when this run is started on that same tag.
        type: boolean
        default: false

# Per ref: a dry run never cancels a release on its tag, nor a dry run of another ref.
concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # REQ-2225: the platform connector block, written first: every package of the release carries it
  # (.github/actions/platform-connectors in each job that packages provisa). It needs the image's
  # digest, so on a release the image is pushed here, before the other legs; nothing names it until
  # a package carrying this block is published. A dry run pushes nothing and ships the empty block.
  platform-connectors:
    name: Platform connector block
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ inputs.publish == true && github.ref_type == 'tag' && github.ref_name == inputs.version }}
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: meta
        uses: ./.github/actions/release-metadata
        with:
          version: ${{ inputs.version || github.ref_name }}

      # The image carries provisa._encoders from the Linux wheel of this very version.
      - name: Stamp the version
        if: env.PUBLISH == 'true'
        run: |
          sed -i 's/^version = .*/version = "${{ steps.meta.outputs.py_version }}"/' pyproject.toml
          sed -i 's/"provisa-notebook==[^"]*"/"provisa-notebook==${{ steps.meta.outputs.py_version }}"/' pyproject.toml

      - name: Set up Python
        if: env.PUBLISH == 'true'
        uses: ./.github/actions/setup-python

      - name: Build the Linux wheel the image's encoders come from
        if: env.PUBLISH == 'true'
        run: docker build --platform linux/amd64 --target provisa-wheel --output type=local,dest=wheelhouse .

      - name: Build the Spark connector and fill the block
        if: env.PUBLISH == 'true'
        env:
          PROVISA_WHEELHOUSE: ${{ github.workspace }}/wheelhouse
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          uv run provisa connector build "https://github.com/${GITHUB_REPOSITORY}.git" \
            --name spark --ref "$VERSION" --commit "$GITHUB_SHA" --path connectors/spark \
            --build-command "python3 connectors/spark/_build_client.py" \
            --image ghcr.io/kenstott/provisa-spark-connector --arch amd64 \
            --registry-user "$GITHUB_ACTOR" --registry-password-env REGISTRY_PASSWORD > block.yaml
          uv run python scripts/fill_platform_connectors.py block.yaml

      - name: Keep the block for the packaging jobs
        uses: actions/upload-artifact@v4
        with:
          name: platform-connectors
          path: provisa/core/platform_connectors.yaml
          retention-days: 1

  prebuilt:
    name: Prebuilt inputs
    needs: platform-connectors
    uses: ./.github/workflows/release-prebuilt.yml
    with:
      version: ${{ inputs.version || github.ref_name }}
      publish: ${{ inputs.publish == true && github.ref_type == 'tag' && github.ref_name == inputs.version }}

  packages:
    name: Packages
    needs: platform-connectors
    # The union of what the leg's jobs ask for: attach SBOMs to the draft release (contents),
    # Sigstore for the JAR's attestation (id-token, attestations).
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-packages.yml
    with:
      version: ${{ inputs.version || github.ref_name }}
      publish: ${{ inputs.publish == true && github.ref_type == 'tag' && github.ref_name == inputs.version }}

  macos:
    name: macOS installers
    needs: prebuilt
    uses: ./.github/workflows/release-macos.yml
    with:
      version: ${{ inputs.version || github.ref_name }}
      publish: ${{ inputs.publish == true && github.ref_type == 'tag' && github.ref_name == inputs.version }}
    secrets:
      APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
      APPLE_CERT_P12_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
      APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
      APPLE_NOTARYTOOL_APPLE_ID: ${{ secrets.APPLE_NOTARYTOOL_APPLE_ID }}
      APPLE_NOTARYTOOL_PASSWORD: ${{ secrets.APPLE_NOTARYTOOL_PASSWORD }}
      APPLE_NOTARYTOOL_TEAM_ID: ${{ secrets.APPLE_NOTARYTOOL_TEAM_ID }}

  windows:
    name: Windows installers
    needs: prebuilt
    uses: ./.github/workflows/release-windows.yml
    with:
      version: ${{ inputs.version || github.ref_name }}
      publish: ${{ inputs.publish == true && github.ref_type == 'tag' && github.ref_name == inputs.version }}
    secrets:
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PFX_PASSWORD }}
      WINDOWS_CERT_TIMESTAMP_URL: ${{ secrets.WINDOWS_CERT_TIMESTAMP_URL }}

  linux:
    name: Linux AppImage
    needs: prebuilt
    uses: ./.github/workflows/release-linux.yml
    with:
      version: ${{ inputs.version || github.ref_name }}
      publish: ${{ inputs.publish == true && github.ref_type == 'tag' && github.ref_name == inputs.version }}

  # PyPI, server and client: the orchestrator's own jobs, never a reusable workflow's -- PyPI
  # trusted publishing does not accept a token issued to a reusable workflow
  # (pypa/gh-action-pypi-publish#166). Only after every leg has succeeded; nothing that cannot
  # be taken back happens until every artifact exists. Not run on a dry run.
  publish-pypi:
    name: Publish Python client to PyPI
    # Publishes and does nothing else: not run on a dry run.
    if: ${{ inputs.publish == true && github.ref_type == 'tag' && github.ref_name == inputs.version }}
    needs: [prebuilt, packages, macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: python-client-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          attestations: true

  # REQ-2071: provisa pins provisa-notebook at its own version, so the notebook package is on PyPI
  # before provisa is: a `pip install provisa` never resolves to a provisa whose dependency is not
  # there yet. Built with everything else; published only after every leg has succeeded.
  publish-notebook-pypi:
    name: Publish provisa-notebook to PyPI
    # Publishes and does nothing else: not run on a dry run.
    if: ${{ inputs.publish == true && github.ref_type == 'tag' && github.ref_name == inputs.version }}
    needs: [prebuilt, packages, macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: provisa-notebook-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          attestations: true

  publish-provisa-pypi:
    name: Publish provisa server to PyPI
    # Publishes and does nothing else: not run on a dry run.
    if: ${{ inputs.publish == true && github.ref_type == 'tag' && github.ref_name == inputs.version }}
    needs: [prebuilt, packages, macos, windows, linux, publish-notebook-pypi]
    runs-on: ubuntu-latest
    # id-token: write is what lets gh-action-pypi-publish request a Sigstore-signed PEP 740
    # attestation for each uploaded file — PyPI removed GPG signature uploads in 2023, so this
    # (not a detached .asc) is the only signing PyPI currently accepts.
    permissions:
      id-token: write
    steps:
      # REQ-2194: one provisa wheel per platform (each carries the compiled encoders), and the sdist.
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          pattern: provisa-wheel-*-dist
          path: dist/
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          attestations: true

  # After every PyPI publication: the release's attachments and undraft, the image pushes. A
  # failed or partial run publishes nothing. On a dry run the PyPI jobs are skipped, and a job is
  # skipped with the jobs it needs unless it says otherwise: this one still runs (its dry run
  # proves the asset set is whole), and never after a publication that failed or was cancelled.
  publish:
    name: Attach and publish
    needs: [prebuilt, packages, macos, windows, linux, publish-pypi, publish-notebook-pypi, publish-provisa-pypi]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    # The union of what the leg's jobs ask for: attach to and undraft the release (contents),
    # Sigstore attestations (id-token), the image pushes (packages).
    permissions:
      contents: write
      id-token: write
      packages: write
    uses: ./.github/workflows/release-publish.yml
    with:
      version: ${{ inputs.version || github.ref_name }}
      publish: ${{ inputs.publish == true && github.ref_type == 'tag' && github.ref_name == inputs.version }}
