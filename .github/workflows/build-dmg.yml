# The release: every installer, package and image of one version, and its publication.
#
# A thin orchestrator. Each job below is one leg, a reusable workflow of its own
# (release-prebuilt / -packages / -macos / -windows / -linux / -publish); this file says only
# what a release is made of and in what order.
#
#   prebuilt ─┬─ macos ───┐
#             ├─ windows ─┤
#             └─ linux ───┼─ publish-connector-image ─┬─ publish
#   packages ─────────────┘                           ┘
#   prebuilt + packages ── install-host (a dry run only: install-host.sh, then the smoke checks)
#
# Every job that builds a release asset attaches it to the draft release itself, once
# (.github/actions/attach-release-assets); the publish leg copies nothing -- it checks the draft
# has every asset, undrafts it and regenerates the index. The provisa server wheel is not uploaded
# to PyPI: it outgrew PyPI's 10 GB project limit (alpha.510). Nothing is published to PyPI at all
# (maintainer 2026-11-21): the server, client and notebook wheels (and the client and notebook
# sdists) are release assets, listed by the package index on GitHub Pages (`pip install provisa
# --extra-index-url https://kenstott.github.io/provisa/simple/`).
#
# A tag starts nothing. Run by hand (Actions -> Build Provisa Packages -> Run workflow) on
# release/<version>, once the suites are green there, it is the release's DRY RUN, which "Release:
# cut" requires: every artifact is built and uploaded to the run under the names the given
# `version` produces (an asset's upload fails when its file is missing), and nothing leaves the
# run -- no draft release, no attachment, no image push, no signed attestation. A run publishes only when it is started ON the tag
# whose version it names with `publish` checked, which is how "Release: cut" starts it.
#
# A failed job is re-run alone with "Re-run failed jobs": the legs that passed are not built
# again, their assets are already on the draft, and the artifacts they uploaded to the run are
# still there for the leg that reads them.
name: Build Provisa Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          The version to build, shaped as a release tag (v0.0.0-alpha.1): it names every artifact
          and is stamped into the wheels, so only -alpha.N / -beta.N / -rc.N suffixes convert.
        type: string
        required: true
      publish:
        description: Publish. Honoured only when this run is started on that same tag.
        type: boolean
        default: false

# Per ref: a dry run never cancels a release on its tag, nor a dry run of another ref.
concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # REQ-2225: the platform connector block, first: every package of the release carries it (each
  # leg job that packages provisa downloads it over its checkout). On a release the connector's
  # image is built here and kept in the run; publish-connector-image pushes it after every leg.
  # A dry run builds no image and ships the empty block.
  platform-connectors:
    name: Platform connector block
    permissions:
      contents: read
    uses: ./.github/workflows/release-platform-connectors.yml
    with:
      version: ${{ inputs.version || github.ref_name }}
      publish: ${{ inputs.publish == true && github.ref_type == 'tag' && github.ref_name == inputs.version }}

  prebuilt:
    name: Prebuilt inputs
    needs: platform-connectors
    # Each job attaches what it builds to the draft release itself (contents).
    permissions:
      contents: write
    uses: ./.github/workflows/release-prebuilt.yml
    with:
      version: ${{ inputs.version || github.ref_name }}
      publish: ${{ inputs.publish == true && github.ref_type == 'tag' && github.ref_name == inputs.version }}

  packages:
    name: Packages
    needs: platform-connectors
    # The union of what the leg's jobs ask for: attach SBOMs to the draft release (contents),
    # Sigstore for the JAR's attestation (id-token, attestations).
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-packages.yml
    with:
      version: ${{ inputs.version || github.ref_name }}
      publish: ${{ inputs.publish == true && github.ref_type == 'tag' && github.ref_name == inputs.version }}

  macos:
    name: macOS installers
    needs: prebuilt
    # Each job attaches what it builds to the draft release itself (contents).
    permissions:
      contents: write
    uses: ./.github/workflows/release-macos.yml
    with:
      version: ${{ inputs.version || github.ref_name }}
      publish: ${{ inputs.publish == true && github.ref_type == 'tag' && github.ref_name == inputs.version }}
    secrets:
      APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
      APPLE_CERT_P12_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
      APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
      APPLE_NOTARYTOOL_APPLE_ID: ${{ secrets.APPLE_NOTARYTOOL_APPLE_ID }}
      APPLE_NOTARYTOOL_PASSWORD: ${{ secrets.APPLE_NOTARYTOOL_PASSWORD }}
      APPLE_NOTARYTOOL_TEAM_ID: ${{ secrets.APPLE_NOTARYTOOL_TEAM_ID }}

  windows:
    name: Windows installers
    needs: prebuilt
    # Each job attaches what it builds to the draft release itself (contents).
    permissions:
      contents: write
    uses: ./.github/workflows/release-windows.yml
    with:
      version: ${{ inputs.version || github.ref_name }}
      publish: ${{ inputs.publish == true && github.ref_type == 'tag' && github.ref_name == inputs.version }}
    secrets:
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PFX_PASSWORD }}
      WINDOWS_CERT_TIMESTAMP_URL: ${{ secrets.WINDOWS_CERT_TIMESTAMP_URL }}

  linux:
    name: Linux AppImage
    needs: prebuilt
    # Each job attaches what it builds to the draft release itself (contents).
    permissions:
      contents: write
    uses: ./.github/workflows/release-linux.yml
    with:
      version: ${{ inputs.version || github.ref_name }}
      publish: ${{ inputs.publish == true && github.ref_type == 'tag' && github.ref_name == inputs.version }}

  # REQ-2269: the one-script Linux install, run on a clean Ubuntu host from this run's own assets
  # (the provisa wheel and provisa_notebook from packages, provisa_duckdb_ext and the Trino plugins
  # from prebuilt), then the smoke checks against the installed host. A dry run's leg: a release
  # is cut from a dry run that passed it, so the publishing jobs below do not wait for it.
  install-host:
    name: Install on a Linux host
    needs: [prebuilt, packages]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/release-install-host.yml
    with:
      version: ${{ inputs.version || github.ref_name }}
      publish: ${{ inputs.publish == true && github.ref_type == 'tag' && github.ref_name == inputs.version }}

  # REQ-2225: the Spark connector's image, built by platform-connectors and kept in the run, pushed
  # to the registry byte for byte -- after every leg, and before any package naming it (the provisa
  # wheel and the installers carry the block) is published. `connector push` refuses an image other
  # than the one the block's digest names.
  publish-connector-image:
    name: Publish Spark connector image
    # Publishes and does nothing else: not run on a dry run.
    if: ${{ inputs.publish == true && github.ref_type == 'tag' && github.ref_name == inputs.version }}
    needs: [platform-connectors, prebuilt, packages, macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: ./.github/actions/setup-python

      - name: Download the block
        uses: actions/download-artifact@v4
        with:
          name: platform-connectors
          path: provisa/core

      - name: Download the image
        uses: actions/download-artifact@v4
        with:
          name: spark-connector-image
          path: spark-connector-image

      - name: Push the image the block names
        env:
          REGISTRY_PASSWORD: ${{ secrets.GHCR_ORG_TOKEN }}
        run: |
          set -euo pipefail
          uv run provisa connector push spark-connector-image \
            --config provisa/core/platform_connectors.yaml --name spark \
            --registry-user "$GITHUB_ACTOR" --registry-password-env REGISTRY_PASSWORD

  # After every leg: the check that the draft has every asset and its undraft, the wheel index on
  # GitHub Pages, the image pushes. A failed or partial run publishes nothing. On a dry run the
  # publishing jobs are skipped, and a job is skipped with the jobs it needs unless it says
  # otherwise: this one still runs (its images build without a push), and never after a
  # publication that failed or was cancelled.
  publish:
    name: Attach and publish
    needs: [platform-connectors, prebuilt, packages, macos, windows, linux, publish-connector-image]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    # The union of what the leg's jobs ask for: undraft the release (contents), the Pages
    # deployment's token (id-token), the image pushes (packages), the wheel index's deployment
    # (pages).
    permissions:
      contents: write
      id-token: write
      packages: write
      pages: write
    uses: ./.github/workflows/release-publish.yml
    with:
      version: ${{ inputs.version || github.ref_name }}
      publish: ${{ inputs.publish == true && github.ref_type == 'tag' && github.ref_name == inputs.version }}
    secrets:
      GHCR_ORG_TOKEN: ${{ secrets.GHCR_ORG_TOKEN }}
