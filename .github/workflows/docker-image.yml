name: Docker Image

# The app image (Dockerfile) built on every push to main, and on dispatch for a release branch, without pushing it
# anywhere: the release workflows build it only at release time, so a break in the Dockerfile reached
# a release unseen. The
# built image then draws render_graph's PNGs through its own node, renderer and fonts (REQ-1990),
# and starts a files source's connector server in its own JVM.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref supersedes the run before it.
concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: build + render_graph smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build the app image (linux/amd64, not pushed)
        run: docker build --platform linux/amd64 -t provisa/provisa:ci .

      # REQ-2194: provisa's compiled encoders are in the image (the Dockerfile imports them too).
      - name: provisa's encoders import inside the image
        run: docker run --rm provisa/provisa:ci python -c "import provisa._encoders.pgwire"

      - name: render_graph draws inside the image
        run: docker run --rm -i provisa/provisa:ci python - < scripts/ci/render_graph_smoke.py

      - name: a files source's connector server runs inside the image
        run: docker run --rm -i provisa/provisa:ci python - < scripts/ci/files_connector_smoke.py

      # REQ-2227: a Rust source is prepared inside the image. serde's derive and build script are
      # compiled and linked by the image's own C compiler.
      - name: a Rust source is prepared inside the image
        run: docker run --rm -i -v "$PWD/tests/fixtures/rust_source:/fixture:ro" provisa/provisa:ci python - /fixture < scripts/ci/rust_source_smoke.py
