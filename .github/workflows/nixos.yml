name: NixOS

# What NixOS does differently from the Ubuntu runners every other workflow tests on. Linux itself
# is covered there; this covers the host side that depends on the distro: the uv environment and
# its prebuilt wheels, the embedded PostgreSQL, the native tier run as a systemd service,
# Playwright's Chromium, the ODBC driver, the JDK, and AskAmerica's bundled pgwire server. The container-backed lanes' images are the
# same on any distro, so only the core lane is repeated here, for the host processes it starts.
# The repository's root flake is tested here too: its checks, a host that imports its module and
# runs its service, and `nix run` of its package, both of these on the AppImage this commit builds.
#
# A hosted runner is Ubuntu, so NixOS is a QEMU guest on it (.github/actions/nixos-vm, the system
# in packaging/nixos). Every step after the boot runs in the guest through packaging/nixos/vm-run.

on:
  # e2e and integration runs start only on request (maintainer 2026-10-29): pushes run unit tests only.
  workflow_dispatch:
    inputs:
      lanes:
        description: "Container lanes to run in the guest: comma-separated (core, app, kafka, ...), or none"
        required: false
        default: "core"

permissions:
  contents: read

env:
  # The Splunk CIM add-on tests/conftest.py fetches: integration-suite-lanes.yml's version.
  SPLUNK_CIM_VERSION: "6.1.0"

concurrency:
  group: nixos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: deploy + unit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/nixos-vm

      # REQ-294: the service and the unit tests load DuckDB extensions, which a checkout stages.
      - name: Install dependencies
        id: deps
        run: |
          packaging/nixos/vm-run '
            uv sync --frozen --extra dev --extra embedded --extra docs
            uv pip install -e "provisa-client/[dev]" -q
            uv run --no-sync python scripts/stage_duckdb_extensions.py
            cd provisa-ui && npm ci
          '

      # The UI server serves the repo-root static/ from a source checkout. The build bundles the
      # docs site, which it makes with `python3` and `mkdocs`: on NixOS both are the venv's.
      - name: Build the UI
        id: ui
        run: |
          packaging/nixos/vm-run '
            export PATH="$HOME/provisa/.venv/bin:$PATH"
            cd provisa-ui && npm run build
            cp -r dist/. ../static/
          '

      # /ready, not /health: 200 only once the store is attached and the engine is warm.
      - name: Start the provisa service
        id: service
        run: |
          packaging/nixos/vm-run '
            sudo systemctl start provisa
            for _ in $(seq 1 120); do
              if curl -sf -o /dev/null http://127.0.0.1:8000/ready; then
                curl -sf http://127.0.0.1:8000/health
                curl -sf -o /dev/null http://127.0.0.1:3000/
                exit 0
              fi
              systemctl is-active -q provisa || break
              sleep 5
            done
            exit 1
          '

      - name: Chromium opens the deployed UI
        if: ${{ !cancelled() && steps.service.outcome == 'success' }}
        run: |
          packaging/nixos/vm-run '
            cd provisa-ui
            npx playwright install chromium
            node -e "
              const { chromium } = require(\"@playwright/test\");
              (async () => {
                const browser = await chromium.launch();
                const page = await browser.newPage();
                const response = await page.goto(\"http://127.0.0.1:3000/\");
                if (!response.ok()) throw new Error(\"UI answered \" + response.status());
                console.log(\"title:\", await page.title());
                await browser.close();
              })().catch((e) => { console.error(e); process.exit(1); });
            "
          '

      # How long AskAmerica's credentials API takes to answer, from the runner and from the guest:
      # the product gives it 10 seconds, and which side is slow tells a NixOS difference from the API.
      - name: AskAmerica credentials API, timed from the runner and the guest
        if: ${{ !cancelled() && steps.service.outcome == 'success' }}
        env:
          FREE_ASKAMERICA_KEY: ${{ secrets.FREE_ASKAMERICA_KEY }}
        run: |
          probe='for n in 1 2 3; do curl -s -o /dev/null -m 60 -A provisa-askamerica/1.0 -H "X-API-Key: $FREE_ASKAMERICA_KEY" -w "%{http_code} dns=%{time_namelookup}s connect=%{time_connect}s tls=%{time_appconnect}s total=%{time_total}s\n" https://api.askamerica.ai/v1/catalog/credentials; done'
          echo "runner:"; bash -c "$probe"
          echo "guest:"; packaging/nixos/vm-run "$probe"

      # The minute the spec below gives AskAmerica's server excludes the cold bundle download
      # (maintainer, 2026-10-11): the ~900 MB pgwire-govdata bundle is fetched into the service
      # user's runtime-deps cache first, where the save then finds it.
      - name: AskAmerica bundle fetched before the spec
        if: ${{ !cancelled() && steps.service.outcome == 'success' }}
        run: |
          packaging/nixos/vm-run '
            time uv run python -c "from provisa.runtime_deps.pgwire_bundles import BundleResolver, bundle_spec_for, download_release_asset; print(BundleResolver(downloader=download_release_asset).resolve(bundle_spec_for(\"govdata\")))"
          '

      # What the host owes a live AskAmerica source (US government open data), against the service
      # above: saved through the UI, its bundled pgwire server is started and listens, and that
      # server's Python has started its JVM. How long the server then takes to answer its first
      # catalog query is the server's own business; the UI lanes' full case judges that.
      - name: AskAmerica through the deployed UI (add a source; its server listens, its JVM is up)
        if: ${{ !cancelled() && steps.service.outcome == 'success' }}
        env:
          FREE_ASKAMERICA_KEY: ${{ secrets.FREE_ASKAMERICA_KEY }}
        run: |
          # The spec skips itself without the key, and a skip would read here as a pass.
          test -n "$FREE_ASKAMERICA_KEY"
          packaging/nixos/vm-run '
            cd provisa-ui
            npx playwright install chromium
            PROVISA_E2E_DEPLOYED_URL=http://127.0.0.1:3000 npx playwright test -c playwright.deployed.config.ts --reporter=list || { cat test-results/*/error-context.md; exit 1; }
            grep -H "JVM started" ~/.cache/provisa/runtime_deps/*/pgwire-govdata/pgwire-server.log
          '

      # An adapter server writes to a file, not to the journal: in its own state directory or,
      # for AskAmerica, in the bundle it runs from.
      - name: Adapter server logs
        if: ${{ !cancelled() && steps.service.outcome == 'success' }}
        run: |
          packaging/nixos/vm-run '
            mkdir -p ~/.provisa ~/.cache/provisa
            find ~/.provisa ~/.cache/provisa -name pgwire-server.log -exec sh -c "echo \"=== \$1\"; grep -c . \"\$1\"; head -n 40 \"\$1\"; echo ...; tail -n 300 \"\$1\"" _ {} \;
          '

      - name: Service log
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: packaging/nixos/vm-run 'systemctl status provisa --no-pager -l || true; journalctl -u provisa --no-pager -n 3000'

      # Stopped before the suites: they bind ports of their own.
      - name: Stop the provisa service
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: packaging/nixos/vm-run 'sudo systemctl stop provisa'

      # Each suite runs whatever the one before it did: the job's purpose is the list of
      # differences, not the first one.
      - name: Python unit tests
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: packaging/nixos/vm-run 'uv run pytest tests/unit/ --no-cov -q -n auto -o faulthandler_timeout=300'

      - name: UI unit tests
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: packaging/nixos/vm-run 'cd provisa-ui && npx vitest run'

      - name: JDBC driver unit tests
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: packaging/nixos/vm-run 'mvn -f jdbc-driver/pom.xml -B test'

      - name: ODBC driver is registered
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: packaging/nixos/vm-run 'odbcinst -q -d -n "ODBC Driver 18 for SQL Server"'

      - &console
        name: Upload the guest's console
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nixos-console-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/vm-console.log
          if-no-files-found: ignore

  # install.sh on NixOS. A host without Provisa's settings is told the steps and nothing is
  # installed; a host with them (the settings file the installer hands out is the one the `ci`
  # guest is built from) is installed on, and its services answer.
  installer:
    name: installer (${{ matrix.guest }} host)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        guest: [bare, ci]
    # install.sh starts the compose stack from the checkout, and Trino mounts trino/plugins/<name>
    # from it: jars that are not in git. Without them each mount is an empty directory, Trino
    # refuses it and never becomes healthy (run 45655242557).
    needs: trino-plugins
    steps:
      - uses: actions/checkout@v4

      # Before the VM boots: the guest copies the checkout to ~/provisa, jars included.
      - name: Restore Trino plugins
        uses: ./.github/actions/trino-plugins
        with:
          phase: restore

      - uses: ./.github/actions/nixos-vm
        with:
          system: ${{ matrix.guest }}

      - name: The installer names the steps and stops
        if: matrix.guest == 'bare'
        run: packaging/nixos/vm-run 'packaging/nixos/ci/installer-refuses.sh'

      - name: The installer installs and the services answer
        id: install
        if: matrix.guest == 'ci'
        run: packaging/nixos/vm-run 'packaging/nixos/ci/installer-installs.sh'

      - name: Containers
        if: ${{ failure() && steps.install.outcome == 'failure' }}
        run: |
          packaging/nixos/vm-run '
            docker ps -a --format "{{.Names}}\t{{.Status}}"
            for c in $(docker ps -a --format "{{.Names}}"); do
              echo "=== $c"; docker logs --tail 100 "$c" 2>&1
            done
          '

      - *console

  # The Linux download IS the NixOS download: the site offers one file, the AppImage. It is built
  # here from this commit exactly as the release builds it, and that one file -- nothing else of
  # the checkout -- is what the guests below run.
  appimage-build:
    name: build the Linux download
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-ui

      # The UI build renders the offline docs site first (provisa-ui's prebuild).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/docs-site-deps

      # The wheel the AppImage carries includes the built UI, and the script that builds the wheel
      # is told the UI is already built -- as it is in the release, whose Linux job is handed it.
      - name: Build the UI
        working-directory: provisa-ui
        run: npm run build

      # provisa-notebook's build takes Pyodide from this directory, not from its CDN.
      - name: Pyodide downloads
        uses: ./.github/actions/pyodide-downloads

      # This commit's provisa-duckdb-ext wheels, which the AppImage's image stages (REQ-294): the
      # Pages index holds only what a release already published.
      - name: DuckDB extension wheels
        uses: ./.github/actions/duckdb-ext-wheels
        with:
          phase: prime

      # Fails if the packed runtime names a loader (require_static_runtime): such a file does not
      # start on NixOS at all.
      - name: Build the AppImage
        run: packaging/linux/build-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: provisa-appimage
          path: packaging/linux/dist/Provisa.AppImage
          retention-days: 1
          compression-level: 0

  # The download on NixOS. On stock NixOS (`bare`) it starts, names the steps and installs
  # nothing; on stock NixOS after those steps (`prepared`: the settings and nothing more) it
  # installs the default native tier and its API and UI answer. Each leg says whether the
  # AppImage mounted its payload or had to unpack itself.
  appimage:
    name: download (${{ matrix.guest }} host)
    needs: appimage-build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        guest: [bare, prepared]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/nixos-vm
        with:
          system: ${{ matrix.guest }}

      - uses: actions/download-artifact@v4
        with:
          name: provisa-appimage
          path: ${{ runner.temp }}/download

      - name: Put the one file in the guest's home
        run: scp -F "$PROVISA_VM_SSH_CONFIG" "$RUNNER_TEMP/download/Provisa.AppImage" vm:Provisa.AppImage

      - name: The download names the steps and stops
        if: matrix.guest == 'bare'
        run: packaging/nixos/vm-run 'packaging/nixos/ci/appimage-refuses.sh'

      - name: The download installs and the services answer
        if: matrix.guest == 'prepared'
        run: packaging/nixos/vm-run 'packaging/nixos/ci/appimage-installs.sh'

      - *console

  # The repository's root flake, as a Nix user meets it. Its outputs evaluate and its checks
  # pass, and a host flake that imports inputs.provisa.nixosModules.provisa builds, against this
  # checkout in place of github:kenstott/provisa.
  flake:
    name: root flake (check + module import)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/free-runner-disk

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: nix flake check
        run: nix flake check --print-build-logs

      - name: A host flake that imports the module builds
        run: |
          nix build "path:$GITHUB_WORKSPACE/packaging/nixos/host#nixosConfigurations.host.config.system.build.toplevel" \
            --override-input provisa "git+file://$GITHUB_WORKSPACE" \
            --no-write-lock-file --no-link --print-build-logs

  # `nix run` of the root flake on stock NixOS (`bare`: no nix-ld, no Docker): the package
  # starts, and its API and UI answer. The package runs the AppImage this commit builds, not the
  # pinned release (packaging/nixos/this-commit): the leg tests what ships. The pinned release
  # is fetched, and its hash checked, where the flake job builds the importing host.
  flake-run:
    name: nix run (bare host)
    needs: appimage-build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Before the VM boots: the guest copies the checkout, this file included.
      - uses: actions/download-artifact@v4
        with:
          name: provisa-appimage
          path: packaging/nixos/this-commit

      - uses: ./.github/actions/nixos-vm
        with:
          system: bare

      - name: nix run starts Provisa and the services answer
        run: packaging/nixos/vm-run 'packaging/nixos/ci/flake-runs.sh'

      - *console

  # A user's host (packaging/nixos/host) that enables the root flake's nixosModules.provisa: its
  # provisa service runs the package as the unprivileged service user, and the API and UI answer.
  # The guest's package runs the AppImage this commit builds, not the pinned release.
  flake-module:
    name: module service (user host)
    needs: appimage-build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Beside the host flake, which the VM build reads by path: its `ci` system's package.
      - uses: actions/download-artifact@v4
        with:
          name: provisa-appimage
          path: packaging/nixos/host

      - uses: ./.github/actions/nixos-vm
        with:
          flake: packaging/nixos/host
          system: ci
          user: ci

      - name: The provisa service is active and answers
        run: packaging/nixos/vm-run 'packaging/nixos/ci/module-runs.sh'

      - *console

  # The same matrix integration-suite-lanes.yml builds, for the lanes asked for.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          LANES: ${{ inputs.lanes || 'core' }}
        run: |
          if [ "$LANES" = "none" ]; then
            matrix='{"include":[]}'
          else
            # Each lane's own bound, plus the guest: its build, its boot, and installs with no cache.
            matrix=$(python3 scripts/ci/run_lane.py --matrix "$LANES" | jq -c '.include[].timeout += 45')
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          any=$(python3 -c "import json,sys; print('true' if json.loads(sys.argv[1])['include'] else 'false')" "$matrix")
          echo "any=$any" >> "$GITHUB_OUTPUT"

  # Maven Central is asked for the pinned Trino plugin jars once per pin, here: each job that
  # mounts them needs this one and restores its cache (.github/actions/trino-plugins), so
  # parallel jobs never fetch at once (release 510: HTTP 429 mid-collection, run 44081179966).
  # Primed on every dispatch: the installer job restores the jars whatever lanes are asked for.
  trino-plugins:
    name: Trino plugins
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/trino-plugins
        with:
          phase: prime

  lane:
    name: ${{ matrix.lane }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }}
    needs: [plan, trino-plugins]
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Lane name
        id: key
        run: |
          name="${{ matrix.lane }}${{ matrix.shard && format('-{0}', matrix.shard) || '' }}"
          echo "lane=${name//\//of}" >> "$GITHUB_OUTPUT"

      # Before the VM boots: the guest copies the checkout (/mnt/src) to ~/provisa, jars included.
      - name: Restore Trino plugins
        id: trino-plugins
        uses: ./.github/actions/trino-plugins
        with:
          phase: restore

      - uses: ./.github/actions/nixos-vm

      - name: Install dependencies
        run: |
          packaging/nixos/vm-run '
            uv sync --frozen --extra dev
            uv pip install -e "provisa-client/[dev]" -q
          '

      # What the Ubuntu lanes stage before they run (.github/actions/setup-python,
      # scripts/ci/lanes/suite-prepare.sh). REQ-294: a running Provisa never installs a DuckDB
      # extension or fetches a connector bundle, so unstaged, a test's source is refused with
      # ExtensionNotStaged or BundleNotStaged (run 45680556710, every core shard).
      - name: Stage DuckDB extensions and connector bundles
        run: |
          packaging/nixos/vm-run '
            uv run --no-sync python scripts/stage_duckdb_extensions.py
            uv run --no-sync python -m provisa.runtime_deps.stage_pgwire_bundles --only file --only splunk --github-release
          '

      - name: Stack slots in the guest
        run: |
          packaging/nixos/vm-run '
            uv run python -c "from tests.itest_stack import concurrent_session_limit as n; print(\"docker stack slots in the guest:\", n()); assert n() >= 1"
          '

      - name: Run lane
        env:
          # For the Splunk CIM fetch tests/conftest.py runs before starting splunk; ssh forwards
          # them to the guest (SendEnv / AcceptEnv).
          SPLUNKBASE_USERNAME: ${{ secrets.SPLUNKBASE_USERNAME }}
          SPLUNKBASE_PASSWORD: ${{ secrets.SPLUNKBASE_PASSWORD }}
        run: |
          packaging/nixos/vm-run '
            export SPLUNK_CIM_VERSION=${{ env.SPLUNK_CIM_VERSION }}
            export PROVISA_TEST_SERVER_LOG_DIR="$HOME/provisa/results/server-logs"
            uv run python scripts/ci/run_lane.py ${{ matrix.lane }} ${{ matrix.shard && format('--shard {0}', matrix.shard) || '' }} --junitxml results/junit.xml
          '

      - name: Containers that were not healthy
        if: failure()
        run: |
          packaging/nixos/vm-run '
            docker ps -a --format "{{.Names}}\t{{.Status}}"
            for c in $(docker ps -a --filter health=unhealthy --filter status=exited --format "{{.Names}}"); do
              echo "=== $c"; docker logs --tail 200 "$c" 2>&1
            done
          '

      # The contrib FDW build writes to a file, not to the test's output.
      - name: FDW build log
        if: failure()
        run: |
          packaging/nixos/vm-run '
            mkdir -p ~/.cache/provisa-fdw
            find ~/.cache/provisa-fdw -maxdepth 1 -name build.log -exec tail -n 150 {} \;
          '

      - name: Results off the guest
        if: always()
        run: scp -F "$PROVISA_VM_SSH_CONFIG" -r vm:provisa/results "results-${{ steps.key.outputs.lane }}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nixos-lane-${{ steps.key.outputs.lane }}
          path: results-${{ steps.key.outputs.lane }}/
          if-no-files-found: error

      - *console
