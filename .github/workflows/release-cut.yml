# Release: cut (REQ-1989)
#
# How a release is made. A release branch, release/<version>, is cut from a main commit (or from
# the last release with a subset cherry-picked) and then takes only fixes. Run by hand on that
# branch (Actions -> Release: cut -> Run workflow, branch release/v0.1.0-alpha.480) with the
# version to cut (v0.1.0-alpha.480). The suites run on the branch; the whole release build runs
# there as a dry run, publishing nothing (build-dmg.yml dispatched on the branch with publish
# false). The nightly alpha (alpha-nightly.yml) starts all of them itself. A failure is fixed on
# the branch and cascades by merging it forward, and no version is lost, because the tag is made
# last, after packaging. In order:
#
#   0. The run is on release/<version> for the version it names: any other ref is refused.
#   1. scripts/release_gate.py reads the suites and the dry-run build on this commit of this
#      branch. For a beta or production release one not green stops the cut, by name, and is not
#      waivable. An alpha ships at the end of its time box: each suite not green is reported and
#      listed in step 4, but an alpha that did not package is not tagged. requirements-ci is not
#      in an alpha's gate.
#   2. scripts/release_cut_check.py: the version is a release tag, its tag does not exist, no
#      hand-written docs/releases/<version>.md would be overwritten, and the previous release's
#      tag, by semantic version, is found and is in this branch's history. A branch started while
#      the release before it was publishing merges that tag first: the check says so.
#   3. scripts/gen_release_notes.py from the previous tag to HEAD. Its exit 2 stops the cut here:
#      nothing is committed and no tag is made. A release before the first one shown writes no
#      page, and the cut stops too: a release's body is its page. A hand-written page under
#      docs/releases that the generator changed or removed stops it as well (--written).
#   4. The notes -- the UI's releaseNotes.json, docs/releases/<version>.md (with an alpha's list
#      of what failed), mkdocs.yml and CHANGELOG.md -- are committed to the release branch, the
#      annotated tag is made on that commit, and both are pushed in one atomic push. Nothing else
#      may have changed.
#   5. A tag starts nothing and publishes nothing: it tracks the stage. Publishing is its own
#      step: each release workflow is started here on the tag, build-dmg.yml (the release
#      orchestrator) with publish=true, which it honours on a run started on the tag it names, and
#      the others with no inputs. ensure-release takes the draft release's body from the tag's
#      docs/releases/<version>.md.
#
# After the release is published, the lead runs scripts/release_merge.py --version <version>: it
# merges the release to main and deletes the branch. A conflict stops it and is reported; nothing
# is forced.
#
# A cut that failed before its atomic push is run again from the start: nothing of it reached the
# branch. The next release can be started while this one publishes: its branch and this one share
# nothing that either run writes.
name: "Release: cut"

on:
  workflow_dispatch:
    inputs:
      version:
        description: The release tag to cut (v0.1.0-alpha.480).
        type: string
        required: true

# One cut at a time, and a cut is never cancelled half-way.
concurrency:
  group: release-cut
  cancel-in-progress: false

permissions:
  contents: write # the notes commit on the release branch and the tag
  actions: write # starting the release's workflows on the tag

jobs:
  cut:
    name: Generate the notes, commit them and tag the release
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      # The run's own commit: the release branch as it was when the cut was started. Should the
      # branch move before the notes are pushed, the push is refused rather than the tag made on
      # another commit.
      - uses: actions/checkout@v4
        with:
          # The generator reads the log of the range and requirements.yaml at both ends of it.
          fetch-depth: 0

      - name: Set up Python
        uses: ./.github/actions/setup-python

      # A failing step, not a job-level `if`: a skipped job would refuse nothing and report nothing.
      - name: Refuse unless this is the release's own branch
        run: uv run python scripts/release_cut_check.py --ref "$GITHUB_REF" --version "$VERSION"

      # The suites and the dry run of the whole release build (scripts/release_gate.py). A run
      # counts only on this commit of this branch: failed, cancelled, running or never run is not
      # green. A beta or production release refuses the cut, by name, so a failure costs no
      # version. An alpha is stopped only by its dry-run build: what else is left goes into its
      # notes below.
      - name: Gate on the suites and the dry-run build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/release_gate.py --version "$VERSION" --branch "$GITHUB_REF_NAME" --sha "$GITHUB_SHA" --out "$RUNNER_TEMP/gate-failures.md"

      - name: Check the release can be cut
        id: check
        run: uv run python scripts/release_cut_check.py --version "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate the release notes
        env:
          PREVIOUS: ${{ steps.check.outputs.previous }}
        run: |
          set -euo pipefail
          uv run python scripts/gen_release_notes.py --from "$PREVIOUS" --to HEAD --version "$VERSION"
          if [ ! -f "docs/releases/$VERSION.md" ]; then
            echo "::error::no notes were written for $VERSION (a release before the first one shown); it has no release body"
            exit 1
          fi
          uv run python scripts/release_cut_check.py --version "$VERSION" --written

      # An alpha ships at the end of its time box with what is left listed.
      - name: List an alpha's failures in its notes
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/gate-failures.md" ]; then cat "$RUNNER_TEMP/gate-failures.md" >> "docs/releases/$VERSION.md"; fi

      - name: Commit the notes, tag the release and push both
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A provisa-ui/src/generated/releaseNotes.json docs/releases mkdocs.yml CHANGELOG.md
          if [ -n "$(git status --porcelain --untracked-files=no -- . ':!provisa-ui/src/generated/releaseNotes.json' ':!docs/releases' ':!mkdocs.yml' ':!CHANGELOG.md')" ]; then
            echo "::error::the notes generator changed files other than the notes:"
            git status --porcelain
            exit 1
          fi
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): $VERSION notes"
          fi
          git tag -a "$VERSION" -m "$VERSION"
          # One atomic push: the branch never holds the notes without the tag, so a failed cut
          # leaves nothing behind and is run again on the commit the gates passed.
          git push --atomic origin "HEAD:refs/heads/release/$VERSION" "refs/tags/$VERSION"

      # A tag starts nothing, so publishing is started here, on the tag, once it exists.
      - name: Publish the release from its tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run build-dmg.yml --ref "$VERSION" -f version="$VERSION" -f publish=true
          for workflow in build-duckdb-extensions.yml build-pg-extensions.yml release-exports.yml; do
            gh workflow run "$workflow" --ref "$VERSION"
          done
