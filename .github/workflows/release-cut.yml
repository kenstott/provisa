# Release: cut (REQ-1989)
#
# How a release is made. Work lands on dev; each release has its own branch, release/<version>,
# cut from dev; main only ever takes a release. Run by hand on that branch (Actions -> Release:
# cut -> Run workflow, branch release/v0.1.0-alpha.480) with the version to cut
# (v0.1.0-alpha.480). The suites run on the branch when it is pushed; the whole release build runs
# there as a dry run, publishing nothing (build-dmg.yml dispatched on the branch with publish
# false). A failure is fixed on the branch and merged back to dev, and no version is lost, because
# the tag is made last. In order, and stopping at the first failure:
#
#   0. The run is on release/<version> for the version it names: any other ref is refused.
#   1. If asked for (ui_gate), every UI e2e lane passed on the commit being cut.
#   2. The suites and the dry-run build completed green on this commit of this branch. One that
#      did not is named and the cut stops. This gate is not waivable.
#   3. scripts/release_cut_check.py: the version is a release tag, its tag does not exist, no
#      hand-written docs/releases/<version>.md would be overwritten, and the previous release's
#      tag is found and is in this branch's history. A branch started while the release before
#      it was publishing merges that tag first: the check says so.
#   4. scripts/gen_release_notes.py from the previous tag to HEAD. Its exit 2 stops the cut here:
#      nothing is committed and no tag is made. A release before the first one shown writes no
#      page, and the cut stops too: a release's body is its page. A hand-written page under
#      docs/releases that the generator changed or removed stops it as well (--written).
#   5. The notes -- the UI's releaseNotes.json, docs/releases/<version>.md, mkdocs.yml and
#      CHANGELOG.md -- are committed to the release branch, the annotated tag is made on that
#      commit, and both are pushed in one atomic push. Nothing else may have changed.
#   6. A tag pushed with this workflow's token starts no workflow, so each workflow a v* tag
#      starts is started here on the tag: build-dmg.yml (the release orchestrator) with
#      publish=true, which it honours on a run started on the tag it names, and the others with
#      no inputs. ensure-release takes the draft release's body from the tag's
#      docs/releases/<version>.md.
#
# After the release is published, the release's last job (merge-release in release-publish.yml)
# merges the branch to main and to dev and deletes it. A conflict stops there and is reported;
# nothing is forced.
#
# A cut that failed before its atomic push is run again from the start: nothing of it reached the
# branch. The next release can be started while this one publishes: its branch and this one share
# nothing that either run writes.
name: "Release: cut"

on:
  workflow_dispatch:
    inputs:
      version:
        description: The release tag to cut (v0.1.0-alpha.480).
        type: string
        required: true
      ui_gate:
        description: "skip (default during alpha): no UI e2e gate. enforce: every UI e2e lane must be green on this commit (dispatch the lanes first). waived: the maintainer waives an enforced gate; waiver_reason is required and goes into the release notes."
        type: choice
        options: [skip, enforce, waived]
        default: skip
      waiver_reason:
        description: Required when ui_gate is waived; written into the release notes.
        type: string
        required: false
        default: ""

# One cut at a time, and a cut is never cancelled half-way.
concurrency:
  group: release-cut
  cancel-in-progress: false

permissions:
  contents: write # the notes commit on the release branch and the tag
  actions: write # starting the release's workflows on the tag

jobs:
  cut:
    name: Generate the notes, commit them and tag the release
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      # The run's own commit: the release branch as it was when the cut was started. Should the
      # branch move before the notes are pushed, the push is refused rather than the tag made on
      # another commit.
      - uses: actions/checkout@v4
        with:
          # The generator reads the log of the range and requirements.yaml at both ends of it.
          fetch-depth: 0

      - name: Set up Python
        uses: ./.github/actions/setup-python

      # A failing step, not a job-level `if`: a skipped job would refuse nothing and report nothing.
      - name: Refuse unless this is the release's own branch
        run: uv run python scripts/release_cut_check.py --ref "$GITHUB_REF" --version "$VERSION"

      # During alpha the maintainer runs the full suites only on request (2026-10-15), so the gate is
      # skipped unless asked for. Enforced, a release is cut only from a commit that every UI
      # e2e lane passed. A lane not green on it -- failed, cancelled, still running or never run --
      # refuses the cut, by name.
      - name: Refuse unless every UI e2e lane is green on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          UI_GATE: ${{ inputs.ui_gate }}
          WAIVER_REASON: ${{ inputs.waiver_reason }}
        run: |
          set -euo pipefail
          if [ "$UI_GATE" = "skip" ]; then
            echo "::notice::no UI e2e gate for $VERSION (alpha: full suites run only on request)"
            exit 0
          fi
          if [ "$UI_GATE" = "waived" ]; then
            if [ -z "${WAIVER_REASON// /}" ]; then
              echo "::error::ui_gate is waived but no waiver_reason was given"
              exit 1
            fi
            echo "::warning::the UI e2e gate is waived for $VERSION: $WAIVER_REASON"
            exit 0
          fi
          refused=0
          for workflow in ui-e2e-core.yml ui-e2e-trino.yml ui-e2e-swap-amd64.yml; do
            run="$(gh run list --workflow "$workflow" \
              --commit "$GITHUB_SHA" --limit 1 --json status,conclusion,url \
              --jq '.[0] // {} | "\(.status // "never run") \(.conclusion // "") \(.url // "")"')"
            if [ "${run#completed success }" = "$run" ]; then
              echo "::error::$workflow is not green on $GITHUB_SHA: $run"
              refused=1
            fi
          done
          exit "$refused"

      # The suites a push to the branch starts, and the dry run of the whole release build. A run
      # counts only on this commit of this branch: failed, cancelled, running or never run refuses
      # the cut, by name. The tag is made after this, so a failure here costs no version.
      - name: Refuse unless the suites and the dry-run build are green on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          refused=0
          for workflow in unit-tests.yml ui-unit-tests.yml lint.yml requirements-ci.yml cve-audit.yml docker-image.yml build-dmg.yml; do
            run="$(gh run list --workflow "$workflow" --branch "$GITHUB_REF_NAME" \
              --commit "$GITHUB_SHA" --limit 1 --json status,conclusion,url \
              --jq '.[0] // {} | "\(.status // "never run") \(.conclusion // "") \(.url // "")"')"
            if [ "${run#completed success }" = "$run" ]; then
              echo "::error::$workflow is not green on $GITHUB_REF_NAME at $GITHUB_SHA: $run"
              refused=1
            fi
          done
          if [ "$refused" -ne 0 ]; then
            echo "A dry run is started from Actions -> Build Provisa Packages on $GITHUB_REF_NAME, version $VERSION, publish unchecked."
          fi
          exit "$refused"

      - name: Check the release can be cut
        id: check
        run: uv run python scripts/release_cut_check.py --version "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate the release notes
        env:
          PREVIOUS: ${{ steps.check.outputs.previous }}
        run: |
          set -euo pipefail
          uv run python scripts/gen_release_notes.py --from "$PREVIOUS" --to HEAD --version "$VERSION"
          if [ ! -f "docs/releases/$VERSION.md" ]; then
            echo "::error::no notes were written for $VERSION (a release before the first one shown); it has no release body"
            exit 1
          fi
          uv run python scripts/release_cut_check.py --version "$VERSION" --written

      # A waived UI gate is stated in the release's own notes, with the maintainer's reason.
      - name: Record a waived UI gate in the notes
        if: inputs.ui_gate == 'waived'
        env:
          WAIVER_REASON: ${{ inputs.waiver_reason }}
        run: |
          set -euo pipefail
          printf '\n## Release gate\n\nThe UI end-to-end gate was waived for this release: %s\n' "$WAIVER_REASON" >> "docs/releases/$VERSION.md"

      - name: Commit the notes, tag the release and push both
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A provisa-ui/src/generated/releaseNotes.json docs/releases mkdocs.yml CHANGELOG.md
          if [ -n "$(git status --porcelain --untracked-files=no -- . ':!provisa-ui/src/generated/releaseNotes.json' ':!docs/releases' ':!mkdocs.yml' ':!CHANGELOG.md')" ]; then
            echo "::error::the notes generator changed files other than the notes:"
            git status --porcelain
            exit 1
          fi
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): $VERSION notes"
          fi
          git tag -a "$VERSION" -m "$VERSION"
          # One atomic push: the branch never holds the notes without the tag, so a failed cut
          # leaves nothing behind and is run again on the commit the gates passed.
          git push --atomic origin "HEAD:refs/heads/release/$VERSION" "refs/tags/$VERSION"

      - name: Start the release on its tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run build-dmg.yml --ref "$VERSION" -f version="$VERSION" -f publish=true
          for workflow in build-duckdb-extensions.yml build-pg-extensions.yml release-exports.yml; do
            gh workflow run "$workflow" --ref "$VERSION"
          done
          # The UI e2e lanes run on the tag only when the gate is enforced: during alpha the full
          # suites run only on request (maintainer 2026-10-15).
          if [ "${{ inputs.ui_gate }}" = "enforce" ]; then
            for workflow in ui-e2e-core.yml ui-e2e-swap-amd64.yml ui-e2e-trino.yml; do
              gh workflow run "$workflow" --ref "$VERSION"
            done
          fi
