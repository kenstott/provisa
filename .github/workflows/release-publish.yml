# Release: attach and publish
#
# The release's publications: the draft release checked for every asset and undrafted,
# the provisa wheel index regenerated on GitHub Pages, the engine and Flight proxy images pushed.
# Nothing goes to PyPI (maintainer 2026-11-21). The server, client and notebook wheels are release
# assets: users install them through the Pages index, https://kenstott.github.io/provisa/simple/.
#
# Nothing is attached here. Every job that builds a release asset attaches it to the draft itself,
# once (.github/actions/attach-release-assets): GitHub has no server-side copy from a workflow
# artifact to a release asset, and alpha.510's download-then-upload of every artifact here took
# 30+ minutes.
#
# One leg of the release. Called by build-dmg.yml (the release orchestrator) on a tag, and by a
# manual dry run of it. `version` is the release's tag; nothing here reads the pushed ref.
#
# Also dispatched by hand to publish a release whose own publish leg did not run (alpha.510: its
# server PyPI upload failed, and this leg, which needed it, was skipped): the assets are already on
# the draft, so the dispatch verifies them, undrafts it, writes the index and pushes the images.
# `publish` is false on a dry run: there is no draft to check, the images build without a push,
# and nothing leaves the run. A failed job of this leg is re-run alone with "Re-run failed jobs"
# on the release's run.
name: "Release: attach and publish"

on:
  workflow_call:
    inputs:
      version:
        description: The release tag (v0.1.0-alpha.477).
        type: string
        required: true
      publish:
        description: Leave the run (undraft, wheel index, image pushes). False on a dry run.
        type: boolean
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: The release tag (v0.1.0-alpha.510).
        type: string
        required: true
      publish:
        description: Leave the run (undraft, wheel index, image pushes).
        type: boolean
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      channel: ${{ steps.meta.outputs.channel }}
      dmg_name: ${{ steps.meta.outputs.dmg_name }}
      dmg_obs_name: ${{ steps.meta.outputs.dmg_obs_name }}
      dmg_container_name: ${{ steps.meta.outputs.dmg_container_name }}
      dmg_demo_name: ${{ steps.meta.outputs.dmg_demo_name }}
      linux_name: ${{ steps.meta.outputs.linux_name }}
      windows_name: ${{ steps.meta.outputs.windows_name }}
      windows_container_name: ${{ steps.meta.outputs.windows_container_name }}
      jdbc_name: ${{ steps.meta.outputs.jdbc_name }}
      py_version: ${{ steps.meta.outputs.py_version }}
      npm_version: ${{ steps.meta.outputs.npm_version }}
      obs_images_name: ${{ steps.meta.outputs.obs_images_name }}
      demo_images_name: ${{ steps.meta.outputs.demo_images_name }}
      core_images_name: ${{ steps.meta.outputs.core_images_name }}
      core_images_amd64_name: ${{ steps.meta.outputs.core_images_amd64_name }}
      trino_image_name: ${{ steps.meta.outputs.trino_image_name }}
      trino_image_amd64_name: ${{ steps.meta.outputs.trino_image_amd64_name }}
      plugins_name: ${{ steps.meta.outputs.plugins_name }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        uses: ./.github/actions/release-metadata
        with:
          version: ${{ inputs.version }}

  # ── Release ──────────────────────────────────────────────────────────────────
  # Nothing that cannot be taken back happens until every artifact exists: this leg starts only
  # after every other leg has succeeded and the connector image is pushed (the orchestrator's
  # `publish` job needs them all), so a failed installer blocks the release. The undraft verifies
  # every wheel, client and notebook included, is attached.
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [metadata]
    # The caller never starts this leg after a publication that failed or was cancelled.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    permissions:
      contents: write
    steps:
      # ── Publish (the SOLE undraft) ──────────────────────────────────────────
      # This is the only step in any workflow that publishes the release. Every asset was attached
      # to the draft by the job that built it; this step reads the draft's asset list and, if any
      # expected asset is missing, fails WITHOUT publishing, so the release stays a draft
      # (unpublished, skipped by /dl) -- never a partial published release. A line of REQUIRED
      # may be a glob: a server wheel's macOS platform tag carries the SDK version it was built on.
      - name: Publish release (verify every asset, then undraft)
        # Only a release: a dry run has no draft, and each asset's job proved its file exists (its
        # dry-run upload fails without it).
        if: inputs.publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout: gh names the repository from here.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.version }}
          CHANNEL: ${{ needs.metadata.outputs.channel }}
          REQUIRED: |
            ${{ needs.metadata.outputs.dmg_name }}
            ${{ needs.metadata.outputs.dmg_container_name }}
            ${{ needs.metadata.outputs.dmg_obs_name }}
            ${{ needs.metadata.outputs.dmg_demo_name }}
            ${{ needs.metadata.outputs.linux_name }}
            ${{ needs.metadata.outputs.windows_name }}
            ${{ needs.metadata.outputs.windows_container_name }}
            ${{ needs.metadata.outputs.jdbc_name }}
            ${{ needs.metadata.outputs.obs_images_name }}
            ${{ needs.metadata.outputs.demo_images_name }}
            ${{ needs.metadata.outputs.core_images_name }}
            ${{ needs.metadata.outputs.core_images_amd64_name }}
            ${{ needs.metadata.outputs.trino_image_name }}
            ${{ needs.metadata.outputs.trino_image_amd64_name }}
            ${{ needs.metadata.outputs.plugins_name }}
            provisa_client-${{ needs.metadata.outputs.py_version }}-py3-none-any.whl
            provisa_notebook-${{ needs.metadata.outputs.py_version }}-py3-none-any.whl
            provisa_sdk-${{ needs.metadata.outputs.py_version }}-py3-none-any.whl
            provisa_pyspark-${{ needs.metadata.outputs.py_version }}-py3-none-any.whl
            provisa_pyspark-${{ needs.metadata.outputs.py_version }}.tar.gz
            provisa-sdk-${{ needs.metadata.outputs.npm_version }}.tgz
            provisa-${{ needs.metadata.outputs.npm_version }}.vsix
            provisa-${{ needs.metadata.outputs.py_version }}-cp312-cp312-manylinux_2_28_x86_64.whl
            provisa-${{ needs.metadata.outputs.py_version }}-cp312-cp312-manylinux_2_28_aarch64.whl
            provisa-${{ needs.metadata.outputs.py_version }}-cp312-cp312-macosx_*_arm64.whl
            provisa-${{ needs.metadata.outputs.py_version }}-cp312-cp312-win_amd64.whl
            provisa_pg_ext-*-py3-none-any.whl
            provisa_duckdb_ext-*-py3-none-macosx_*_arm64.whl
            provisa_duckdb_ext-*-py3-none-manylinux_2_28_x86_64.whl
            provisa_duckdb_ext-*-py3-none-manylinux_2_28_aarch64.whl
            provisa_duckdb_ext-*-py3-none-win_amd64.whl
        run: |
          set -euo pipefail

          # Assets attached to the release right now.
          attached="$(gh release view "$TAG" --json assets --jq '.assets[].name')"

          missing=()
          count=0
          while IFS= read -r want; do
            [ -z "$want" ] && continue
            count=$((count + 1))
            found=0
            while IFS= read -r have; do
              # shellcheck disable=SC2053 # $want is matched as a glob on purpose
              if [[ "$have" == $want ]]; then found=1; break; fi
            done <<< "$attached"
            [ "$found" = 1 ] || missing+=("$want")
          done <<< "$REQUIRED"

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Refusing to publish $TAG — missing release asset(s): ${missing[*]}"
            echo "Release stays a DRAFT (unpublished). Fix the failed build and re-run." >&2
            exit 1
          fi

          # Complete -- publish. While alpha is the current stage an alpha is the release users
          # get, so it is marked latest. GitHub cannot mark a release flagged prerelease as latest,
          # so an alpha carries no prerelease flag; its tag still says it is an alpha. A beta or rc
          # is a pre-release of the next version and is never latest.
          case "$CHANNEL" in
            beta|rc) gh release edit "$TAG" --draft=false --prerelease --latest=false ;;
            *) gh release edit "$TAG" --draft=false --prerelease=false --latest ;;
          esac
          echo "Published $TAG with all $count required assets."

  # ── provisa wheel index (GitHub Pages) ──────────────────────────────────────────
  # A PEP 503 simple index at /simple/provisa/ listing every provisa server wheel attached to a
  # published release, linked at its release download URL with its sha256. Regenerated from all
  # releases each time, after the release is undrafted (a draft's assets are not served).
  publish-wheel-index:
    name: Publish provisa wheel index
    # Publishes and does nothing else: not run on a dry run.
    if: inputs.publish
    runs-on: ubuntu-latest
    needs: [publish-release]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}simple/provisa/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List the releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate --slurp > releases.json

      - name: Generate the index
        run: python3 scripts/release_wheel_index.py releases.json site

      - name: Upload the index
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy the index
        id: deploy
        uses: actions/deploy-pages@v4

  # ── SaaS federation-engine image ─────────────────────────────────────────────

  publish-engine-image:
    name: Publish federation-engine image
    # Publishes and does nothing else: not run on a dry run.
    if: inputs.publish
    runs-on: ubuntu-latest
    # After publish-release, not in parallel with it: the Dockerfile curls the
    # plugins tarball from the release's public download URL, and a draft's assets
    # are not served there. Building earlier 404s.
    needs: [metadata, publish-release]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR, not Artifact Registry: public packages are free to host and pull, so
      # the engine image adds nothing to the zero-customer floor (REQ-1447).
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 only — every GKE engine node pool runs amd64 (terraform/gcp-saas/gke.tf).
      - name: Build and push engine image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/trino-engine.Dockerfile
          platforms: linux/amd64
          push: ${{ inputs.publish }}
          provenance: false
          build-args: |
            PROVISA_VERSION=${{ inputs.version }}
            GITHUB_REPO=${{ github.repository }}
          tags: ghcr.io/${{ github.repository_owner }}/provisa-trino-engine:${{ inputs.version }}

  publish-zaychik-image:
    name: Publish Arrow Flight SQL proxy image
    runs-on: ubuntu-latest
    # Only metadata is needed: the image is the upstream proxy at a pinned commit
    # plus a local patch, and it carries nothing out of the release.
    needs: [metadata]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 only, and for the same reason as the engine image: this runs as a
      # sidecar in the engine's own pod (REQ-1448), so it lands wherever that lands.
      - name: Build and push zaychik image
        uses: docker/build-push-action@v6
        with:
          context: ./zaychik
          platforms: linux/amd64
          push: ${{ inputs.publish }}
          provenance: false
          tags: ghcr.io/${{ github.repository_owner }}/provisa-zaychik:${{ inputs.version }}
