# Release: Windows installers
#
# The two Windows installers. The core installer embeds the UI dist the prebuilt leg of the same run uploaded.
#
# One leg of the release. Called by build-dmg.yml (the release orchestrator) on a tag, and by a
# manual dry run of it. `version` is the release's tag; nothing here reads the pushed ref.
# `publish` is false on a dry run: every artifact is built and uploaded to the RUN exactly as on
# a tag, and every step that leaves the run -- the draft release, its attachments, PyPI, an image
# push, a signed attestation -- is skipped. A failed job of this leg is re-run alone with
# "Re-run failed jobs" on the release's run; the legs it reads from (their artifacts are the
# run's) are not built again.
name: "Release: Windows installers"

on:
  workflow_call:
    inputs:
      version:
        description: The release tag (v0.1.0-alpha.477).
        type: string
        required: true
      publish:
        description: Leave the run (draft release, attachments, PyPI, image pushes). False on a dry run.
        type: boolean
        required: true
    secrets:
      # Passed by name: the code-signing certificate and its timestamp service. Absent, the installer is built unsigned.
      WINDOWS_CERT_PFX_BASE64:
        required: false
      WINDOWS_CERT_PFX_PASSWORD:
        required: false
      WINDOWS_CERT_TIMESTAMP_URL:
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.meta.outputs.channel }}
      windows_name: ${{ steps.meta.outputs.windows_name }}
      windows_container_name: ${{ steps.meta.outputs.windows_container_name }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        uses: ./.github/actions/release-metadata
        with:
          version: ${{ inputs.version }}

  build-windows-core:
    name: Build Windows Core installer (${{ needs.metadata.outputs.channel }})
    runs-on: windows-latest
    needs: [metadata]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download prebuilt provisa-ui dist
        uses: actions/download-artifact@v4
        with:
          name: provisa-ui-dist
          path: provisa-ui/dist/

      - name: Build installer (native tier, Inno Setup)
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PFX_PASSWORD }}
          WINDOWS_CERT_TIMESTAMP_URL: ${{ secrets.WINDOWS_CERT_TIMESTAMP_URL }}
        run: packaging/windows/build-sfx.ps1

      - name: Rename installer
        shell: pwsh
        run: |
          Move-Item packaging/windows/dist/Provisa-Setup.exe `
            "packaging/windows/dist/${{ needs.metadata.outputs.windows_name }}"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-core-dist
          path: "packaging/windows/dist/${{ needs.metadata.outputs.windows_name }}"
          retention-days: 1

  build-windows-container:
    name: Build Windows Container-tier installer (${{ needs.metadata.outputs.channel }})
    runs-on: windows-latest
    needs: [metadata]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build container-tier installer (WSL2, Inno Setup)
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PFX_PASSWORD }}
          WINDOWS_CERT_TIMESTAMP_URL: ${{ secrets.WINDOWS_CERT_TIMESTAMP_URL }}
        run: packaging/windows/build-container.ps1

      - name: Rename installer
        shell: pwsh
        run: |
          Move-Item packaging/windows/dist/Provisa-Container-Setup.exe `
            "packaging/windows/dist/${{ needs.metadata.outputs.windows_container_name }}"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-container-dist
          path: "packaging/windows/dist/${{ needs.metadata.outputs.windows_container_name }}"
          retention-days: 1
