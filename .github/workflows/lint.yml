name: Lint

# ruff and pyright over the product package. The pre-commit config declares both, but
# core.hooksPath points at .githooks, so the hook pre-commit installs under .git/hooks is
# never consulted -- which is how the type-error count grew unobserved. CI is the gate that
# does not depend on a developer's local hook wiring.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: ruff + pyright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install deps
        run: uv sync --frozen --extra dev

      - name: ruff check
        run: uv run ruff check

      - name: ruff format --check
        run: uv run ruff format --check

      - name: pyright
        run: uv run pyright
