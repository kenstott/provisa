name: Unit Tests

# tests/unit/ — pure, no Docker/live-service dependency (verified: no test in this directory
# carries an integration/e2e/requires_* marker). Runs on every push/PR so a regression is caught
# in minutes, not only when the (much more expensive) e2e lanes happen to run — see
# ui-e2e-core.yml/ui-e2e-trino.yml, which are workflow_dispatch/release-branch only.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref supersedes the run before it: without this every push kept its own
# runner until it finished, and the runs queued behind them (integration-suite.yml's lanes).
concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: pytest tests/unit
    runs-on: ubuntu-latest
    # The suite takes about eight minutes. Without a limit a run that stops making progress held
    # its runner for the hosted default of six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # client: tests/unit/test_client_encryption.py and test_client_role.py import provisa_client —
      # the sibling package (versioned/shipped independently), not part of this project's own deps.
      - name: Set up Python
        uses: ./.github/actions/setup-python
        with:
          client: "true"

      - name: Run unit tests
        # faulthandler_timeout: a test still running after five minutes has every thread's stack
        # written to the log, so a run that stops making progress names the test it stopped in.
        run: uv run pytest tests/unit/ --no-cov -q -n auto -o faulthandler_timeout=300

  jdbc-driver:
    # The JDBC driver's own JUnit tests (jdbc-driver/src/test, *Test classes): no container and
    # no Provisa server — their HTTP and Flight peers are stubs inside the test JVM. The *IT
    # classes need a live server and run in the integration suite's core lane
    # (tests/integration/test_jdbc_driver_e2e.py).
    name: mvn test jdbc-driver
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run the driver's unit tests
        run: mvn -f jdbc-driver/pom.xml -B test
