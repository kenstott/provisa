name: amd64-only engines

# The engines whose images are published linux/amd64 ONLY and that do not boot under QEMU on an
# arm64 (Apple Silicon) dev box. Today that is Exasol: exasol/docker-db comes up far enough for
# cored to start, then EXAStorage never finishes — /exa/data/storage stays empty, the DB instance
# is never launched, port 8563 never listens, and the container can never turn healthy. The tests
# therefore carry an arch skipif (tests/integration/test_exasol_source_e2e.py `_AMD64`), which
# keeps the arm64 lanes green but means NOTHING runs them. This runner is amd64, so here they run
# for real — a skip on the dev box is only acceptable while some lane still executes the test.
#
# Nothing is pre-provisioned: the isolated-stack harness (tests/conftest.py::_DockerServiceManager)
# downloads the Trino plugin jars, brings up its own compose project on ephemeral ports, and
# _heavy_db_service starts/stops exasol around the single test that needs it.

on:
  push:
    branches: [main]
    paths:
      - "tests/integration/test_exasol_*.py"
      - "tests/integration/connector_source_harness.py"
      - "tests/conftest.py"
      - "tests/itest_stack.py"
      - "docker-compose.core.yml"
      - "docker-compose.test.yml"
      - "provisa/federation/**"
      - ".github/workflows/amd64-engines.yml"
  pull_request:
    paths:
      - "tests/integration/test_exasol_*.py"
      - "tests/integration/connector_source_harness.py"
      - "tests/conftest.py"
      - "tests/itest_stack.py"
      - "docker-compose.core.yml"
      - "docker-compose.test.yml"
      - "provisa/federation/**"
      - ".github/workflows/amd64-engines.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amd64-engines-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exasol:
    name: Exasol (source + pipeline e2e)
    runs-on: ubuntu-latest   # amd64 — the whole point of this workflow
    # Exasol's own boot is minutes even natively, and it runs after the core stack (Trino's
    # start_period alone is 120s) plus a zaychik image build.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install deps
        run: uv sync --frozen --extra dev

      # docker-compose.core.yml bind-mounts ./sharepoint.pfx into Trino. The file is a real
      # certificate on a developer box and is gitignored, so it is absent here — and Docker
      # silently creates a DIRECTORY in place of a missing bind-mount source, leaving an
      # untracked directory named like a cert in the checkout. Create the empty file instead;
      # no catalog in this lane reads it.
      - name: Placeholder for the gitignored SharePoint cert mount
        run: touch sharepoint.pfx

      - name: Assert the runner is amd64
        run: |
          arch="$(uname -m)"
          echo "runner arch: $arch"
          # A silent arch change here would turn every test in this lane into a skip, i.e. a
          # green run that executed nothing — exactly what this workflow exists to prevent.
          [ "$arch" = "x86_64" ] || { echo "::error::amd64 lane running on $arch"; exit 1; }

      # tests/conftest.py fetches the pinned Trino plugin jars from Maven Central at collection, and
      # a refused fetch ends the run before any test (release run 37874425655: HTTP 404 for a jar
      # that exists). The same steps as the integration suite's lanes, sharing its cache: the jars
      # are restored by their pin, and saved after the tests once every one is present, so Maven
      # Central is asked once per pin, not on every run.
      - name: Trino plugin pin
        id: trino-pin
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import ast
          tree = ast.parse(open("tests/conftest.py").read())
          pins = {
              t.id: ast.literal_eval(n.value)
              for n in tree.body if isinstance(n, ast.Assign)
              for t in n.targets if isinstance(t, ast.Name)
              and t.id in ("_TRINO_PLUGIN_VERSION", "_TRINO_PLUGINS", "_TRINO_PLUGIN_VERSIONS")
          }
          # A plugin named in _TRINO_PLUGIN_VERSIONS is fetched at its own version; the cache key
          # carries each of those beside the pin, so moving any one of them is a new cache.
          own = pins["_TRINO_PLUGIN_VERSIONS"]
          versions = {n: own.get(n, pins["_TRINO_PLUGIN_VERSION"]) for n in pins["_TRINO_PLUGINS"]}
          print("version=" + "_".join([pins["_TRINO_PLUGIN_VERSION"], *(f"{n}-{own[n]}" for n in sorted(own))]))
          print("jars=" + " ".join(f"trino/plugins/{n}/{n}-{v}.jar" for n, v in versions.items()))
          EOF

      - name: Restore Trino plugins
        id: trino-plugins
        uses: actions/cache/restore@v4
        with:
          path: trino/plugins/trino-*
          key: trino-plugins-${{ steps.trino-pin.outputs.version }}

      # -o addopts="": the ini addopts carry the default-lane marker filter and
      # --ignore=tests/e2e; the modules are named explicitly here instead.
      # -rA prints a reason for every outcome, so a skip is visible in the log rather than
      # hiding inside a pass count.
      - name: Exasol tests
        run: |
          uv run pytest \
            tests/integration/test_exasol_source_e2e.py \
            tests/integration/test_exasol_pipeline_e2e.py \
            -o addopts="" -p no:randomly -v -rA

      - name: Container logs on failure
        if: failure()
        run: docker ps -a && docker compose ls

      - name: Trino plugins fetched
        id: trino-plugins-fetched
        if: always() && steps.trino-plugins.outputs.cache-hit != 'true'
        run: |
          for jar in ${{ steps.trino-pin.outputs.jars }}; do
            if [ ! -s "$jar" ]; then echo "present=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Cache Trino plugins
        if: always() && steps.trino-plugins-fetched.outputs.present == 'true'
        uses: actions/cache/save@v4
        with:
          path: trino/plugins/trino-*
          key: trino-plugins-${{ steps.trino-pin.outputs.version }}
