# Release: the one-script Linux install (REQ-2269)
#
# The path a user installs by, tested on every packaging dry run, so every night on main
# (nightly-main.yml starts build-dmg.yml there; release-ready.yml counts that run). On a fresh
# Ubuntu runner -- Docker and systemd, nothing of Provisa's -- scripts/install-host.sh runs as a
# user runs it, under sudo, on this run's own release assets: the provisa wheel, provisa_notebook,
# provisa_duckdb_ext, the Trino plugin tarball and the amd64 core images (Zaychik), the files it
# takes from a release. It ends with its own health check (Provisa a systemd service, Trino its
# federation engine, PostgreSQL, MinIO and Zaychik healthy beside it). The smoke
# checks (tests/smoke/test_main_is_startable.py) then run against that installed host: one known
# query through each front door, a read from each default source, a restricted role getting less.
#
# One leg of the release, called by build-dmg.yml after the legs that build those assets. A dry
# run only: on a release the provisa wheel goes to the draft and not to the run, and the dry run
# that comes before every release ("Release: cut") has already installed it. Dispatched on its
# own, it installs the assets of the dry run `run_id` names (the run's artifacts last one day).
name: "Release: install on a Linux host"

on:
  workflow_call:
    inputs:
      version:
        description: The release tag (v0.1.0-alpha.477).
        type: string
        required: true
      publish:
        description: True on a release, which this leg does not install (see above).
        type: boolean
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: The version the dry run `run_id` was built for (v0.1.0-alpha.513).
        type: string
        required: true
      run_id:
        description: The id of a Build Provisa Packages dry run whose assets are installed.
        type: string
        required: true

permissions:
  contents: read
  actions: read # a dispatched run reads another run's artifacts

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    shell: bash

jobs:
  install-host:
    name: install-host.sh on a clean Ubuntu host, then the smoke checks
    if: ${{ !inputs.publish }}
    runs-on: ubuntu-latest
    # The install (a Python environment from PyPI, the Trino image) and the smoke check each take
    # minutes; without a limit a run that stops making progress held its runner for six hours.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The run's own artifacts when build-dmg.yml calls this leg; the named run's when dispatched.
      - name: The release assets (this run's)
        if: inputs.run_id == ''
        uses: actions/download-artifact@v4
        with:
          pattern: "{provisa-wheel-linux-x86_64-dist,provisa-notebook-dist,provisa-duckdb-ext-wheels,trino-plugins,core-images-amd64-tarball}"
          path: artifacts/

      - name: The release assets (run ${{ inputs.run_id }})
        if: inputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          pattern: "{provisa-wheel-linux-x86_64-dist,provisa-notebook-dist,provisa-duckdb-ext-wheels,trino-plugins,core-images-amd64-tarball}"
          path: artifacts/
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      # The files as a release carries them, named as install-host.sh selects them. The
      # plugin tarball is packed as release-prebuilt.yml's package-plugins packs it.
      - name: Lay the assets out as a release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p assets
          cp artifacts/provisa-wheel-linux-x86_64-dist/provisa-*.whl assets/
          cp artifacts/provisa-notebook-dist/provisa_notebook-*.whl assets/
          cp artifacts/provisa-duckdb-ext-wheels/provisa_duckdb_ext-*.whl assets/
          tar -czf "assets/provisa-trino-plugins-${VERSION}.tar.gz" -C artifacts/trino-plugins/ .
          # The amd64 core images (release-prebuilt.yml's package-core-images-amd64): Zaychik is
          # loaded from it, as a published release's image is pulled from GHCR.
          cp "artifacts/core-images-amd64-tarball/provisa-core-images-amd64-${VERSION}.zip" assets/
          ls -l assets/

      - name: Install with install-host.sh
        env:
          VERSION: ${{ inputs.version }}
        run: sudo scripts/install-host.sh --version "$VERSION" --assets-dir assets

      # After the install, so the install ran on a machine with nothing of Provisa's on it. The
      # smoke check's clients: gx and soda are the demo's data-quality sources, provisa_client
      # reads the Flight front door, Playwright drives the browser step.
      - name: Set up Python (the smoke check's clients)
        uses: ./.github/actions/setup-python
        with:
          extras: dev gx soda
          client: "true"
          cache: "true"

      - name: Set up the UI toolchain
        uses: ./.github/actions/setup-ui
        timeout-minutes: 12
        with:
          playwright: chromium

      # The smoke check against the installed host (tests/smoke/test_main_is_startable.py, its
      # installed-host mode): the values are install-host.sh's defaults, which the step above used.
      - name: Run the smoke check against the installed host
        env:
          CI: "true"
          # No compose stack: tests/conftest.py would otherwise start one for a test outside
          # tests/unit.
          PYTEST_NO_DOCKER: "1"
          PROVISA_SMOKE_LOG_DIR: ${{ github.workspace }}/smoke-logs
          PROVISA_SMOKE_INSTALLED: "1"
          PROVISA_SMOKE_INSTALL_PREFIX: /opt/provisa
          PROVISA_SMOKE_INSTALL_CONFIG_DIR: /etc/provisa
          PROVISA_SMOKE_INSTALL_DATA_DIR: /var/lib/provisa
          PROVISA_SMOKE_INSTALL_API_PORT: "8000"
          PROVISA_SMOKE_INSTALL_UI_PORT: "3000"
        run: >-
          .venv/bin/python -m pytest -m isolated tests/smoke/test_main_is_startable.py
          --no-cov -v --durations=0 -o faulthandler_timeout=300

      - name: The installed host's logs
        if: always()
        run: |
          set -euo pipefail
          mkdir -p smoke-logs
          sudo journalctl -u provisa --no-pager > smoke-logs/provisa-service.log
          sudo docker logs provisa-trino > smoke-logs/trino.log 2>&1
          for c in postgres minio zaychik; do
            sudo docker logs "provisa-$c" > "smoke-logs/$c.log" 2>&1
          done
          sudo chown -R "$(id -u):$(id -g)" smoke-logs

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-host-smoke-logs
          path: smoke-logs/
          retention-days: 7
          if-no-files-found: error
