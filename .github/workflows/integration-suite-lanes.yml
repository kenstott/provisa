name: Integration suite lanes

# The container-backed suite: tests/integration, tests/steps and tests/e2e, which provision their
# own Docker Compose stacks (tests/conftest.py, tests/itest_stack.py), plus the Helm chart on a
# minikube of its own. tests/unit runs in unit-tests.yml and is not repeated here.
#
# Lanes are scripts/test-all's (scripts/ci/run_lane.py holds them): each groups the tests whose
# session-provisioned services fit one Docker host together. The two largest lanes are cut into
# file shards so each job fits a runner. One test session per runner, so the harness's stack slot
# (acquire_stack_slot) always admits it; the first step of every job prints the slot count.
#
# The salesforce lane uses a live Salesforce org with a daily API allowance: it runs only when a
# dispatch asks for it (include_salesforce), never nightly and never on a push.
# The warehouse lane uses live cloud warehouses and their credentials (repo secrets). It runs
# nightly against main and on demand, not on every push. A warehouse test that
# cannot run because something is not set FAILS, naming what (tests/skip_is_failure.py).
#
# Secrets reach only the jobs and steps that need them (warehouse, e2e, the suite lane's
# Splunk CIM fetch), and only on pushes to this repository's own branches and on schedule/dispatch;
# there is no pull_request trigger here.

# Called by integration-suite.yml, which holds the triggers and the run queue. `github` here is
# the caller's context (its event, ref and sha); the inputs are the dispatcher's, passed through.

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""
      lanes:
        type: string
        required: false
        default: "all"
      # A targeted run's pytest node ids or files (scripts/ci/run_lane.py named_tests); empty runs
      # each lane whole.
      tests:
        type: string
        required: false
        default: ""
      include_warehouse:
        type: boolean
        required: false
        default: false
      include_salesforce:
        type: boolean
        required: false
        default: false
      include_athena:
        type: boolean
        required: false
        default: false
      include_servicenow:
        type: boolean
        required: false
        default: false
      # The kenstott/calcite ref the servicenow lane builds pgwire-servicenow from.
      servicenow_calcite_ref:
        type: string
        required: false
        default: ""
    # Every secret a job of this workflow reads, by name: the caller passes each one, and
    # nothing is inherited. The matrix lanes read only the first three; the rest are the
    # warehouse and salesforce jobs' live credentials.
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      OPENROUTER_API_KEY:
        required: false
      SPLUNKBASE_USERNAME:
        required: false
      SPLUNKBASE_PASSWORD:
        required: false
      ASKAMERICA_API_KEY:
        required: false
      ATHENA_AWS_ACCESS_KEY_ID:
        required: false
      ATHENA_AWS_SECRET_ACCESS_KEY:
        required: false
      ATHENA_REGION:
        required: false
      ATHENA_S3_BUCKET:
        required: false
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_ENDPOINT_OVERRIDE:
        required: false
      AWS_REGION:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      AZURE_TENANT_ID:
        required: false
      BIGQUERY_LOCATION:
        required: false
      BIGQUERY_TEST_GCS_BUCKET:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      CLOUDOPS_AWS_ACCESS_KEY_ID:
        required: false
      CLOUDOPS_AWS_ACCOUNT_IDS:
        required: false
      CLOUDOPS_AWS_REGION:
        required: false
      CLOUDOPS_AWS_SECRET_ACCESS_KEY:
        required: false
      CLOUDOPS_AZURE_CLIENT_ID:
        required: false
      CLOUDOPS_AZURE_CLIENT_SECRET:
        required: false
      CLOUDOPS_AZURE_SUBSCRIPTION_IDS:
        required: false
      CLOUDOPS_AZURE_TENANT_ID:
        required: false
      CLOUDOPS_GCP_CREDENTIALS_JSON_BASE64:
        required: false
      CLOUDOPS_GCP_PROJECT_IDS:
        required: false
      DATABRICKS_HTTP_PATH:
        required: false
      DATABRICKS_SERVER_HOSTNAME:
        required: false
      DATABRICKS_TOKEN:
        required: false
      FABRIC_CAPACITY_NAME:
        required: false
      FABRIC_DATABASE:
        required: false
      FABRIC_RESOURCE_GROUP:
        required: false
      FABRIC_SQL_SERVER:
        required: false
      FABRIC_WORKSPACE_ID:
        required: false
      # The standing Synapse workspace CI pins (tests/integration/synapse_provision.py).
      SYNAPSE_SQL_SERVER:
        required: false
      SYNAPSE_DATABASE:
        required: false
      SYNAPSE_ADLS_URL:
        required: false
      GOOGLE_APPLICATION_CREDENTIALS_JSON:
        required: false
      GOOGLE_CLOUD_PROJECT:
        required: false
      GSHEETS_TEST_SHEET_ID:
        required: false
      PROVISA_E2E_PURVIEW_ENDPOINT:
        required: false
      PROVISA_E2E_DATAZONE_AWS_ACCESS_KEY_ID:
        required: false
      PROVISA_E2E_DATAZONE_AWS_SECRET_ACCESS_KEY:
        required: false
      PROVISA_E2E_DATAZONE_DOMAIN_ID:
        required: false
      PROVISA_E2E_DATAZONE_PROJECT_ID:
        required: false
      REDSHIFT_AWS_ACCESS_KEY_ID:
        required: false
      REDSHIFT_AWS_REGION:
        required: false
      REDSHIFT_AWS_SECRET_ACCESS_KEY:
        required: false
      SERVICENOW_INSTANCE_URL:
        required: false
      SERVICENOW_PASSWORD:
        required: false
      SERVICENOW_USERNAME:
        required: false
      SF_CONSUMER_KEY:
        required: false
      SF_CONSUMER_SECRET:
        required: false
      SF_LOGIN_URL:
        required: false
      SF_NICKNAME:
        required: false
      SF_PASSWORD:
        required: false
      SF_SECURITY_TOKEN:
        required: false
      SINGLESTORE_DATABASE:
        required: false
      MOTHERDUCK_API_TOKEN:
        required: false
      SINGLESTORE_HOST:
        required: false
      SINGLESTORE_PASSWORD:
        required: false
      SINGLESTORE_PORT:
        required: false
      SINGLESTORE_USERNAME:
        required: false
      SNOWFLAKE_ACCOUNT:
        required: false
      SNOWFLAKE_DATABASE:
        required: false
      SNOWFLAKE_PASSWORD:
        required: false
      SNOWFLAKE_USER:
        required: false
      SNOWFLAKE_WAREHOUSE:
        required: false
      SP_AUTH_TYPE:
        required: false
      SP_CERT_P12_BASE64:
        required: false
      SP_CERT_PASSWORD:
        required: false
      SP_CLIENT_ID:
        required: false
      SP_SITE_URL:
        required: false
      SP_TENANT_ID:
        required: false

permissions:
  contents: read

# Naming the shell makes GitHub run every step with `bash -eo pipefail`. The default
# (`bash -e`) gives a pipeline its LAST command's status: a failed download piped into an
# installer, or a failed `docker save` piped into a compressor, passed.
defaults:
  run:
    shell: bash

env:
  # The harness tears its own stacks down at session end; nothing is kept between steps.
  PYTEST_DOCKER_KEEP: ""
  # The Splunk CIM add-on release scripts/fetch-splunk-cim.sh vendors (and the cache key names).
  SPLUNK_CIM_VERSION: "6.1.0"
  # A lane whose interpreter dies on a signal leaves its traceback and the output written before it:
  # without these the block-buffered pytest output was lost and the lane ended in a bare exit code.
  PYTHONFAULTHANDLER: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  # Which lanes this run tests: every one on a push, the dispatcher's choice on demand, none of the
  # suite on the nightly (warehouse-only) schedule. The matrix comes from scripts/ci/run_lane.py,
  # which refuses an unknown lane name rather than dispatching an empty run.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      suite: ${{ steps.plan.outputs.suite }}
      cluster: ${{ steps.plan.outputs.cluster }}
      # Whether each live lane's own job runs: always for a whole-lane run, and for a targeted run
      # (inputs.tests) only when it names a test under the lane's paths.
      warehouse: ${{ steps.plan.outputs.warehouse }}
      salesforce: ${{ steps.plan.outputs.salesforce }}
      athena: ${{ steps.plan.outputs.athena }}
      servicenow: ${{ steps.plan.outputs.servicenow }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - id: plan
        env:
          # The caller's choice: 'all' on a push, the dispatcher's list on demand.
          LANES: ${{ inputs.lanes }}
          PROVISA_LANE_TESTS: ${{ inputs.tests }}
          # A targeted run is routed to the lanes whose markers select its tests, a live lane among
          # them only when the dispatch includes it; one naming a test no such lane selects fails
          # here, naming the test and the lane it needs (run_lane.py routes).
          PROVISA_INCLUDE_LIVE: >-
            ${{ inputs.include_warehouse && 'warehouse' || '' }},${{ inputs.include_salesforce && 'salesforce' || '' }},${{ inputs.include_athena && 'athena' || '' }},${{ inputs.include_servicenow && 'servicenow' || '' }}
        run: |
          matrix=$(python3 scripts/ci/run_lane.py --matrix "$LANES")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          suite=$(python3 -c "import json,sys; print('true' if json.loads(sys.argv[1])['include'] else 'false')" "$matrix")
          echo "suite=$suite" >> "$GITHUB_OUTPUT"
          if [ -n "$PROVISA_LANE_TESTS" ]; then
            c=$(python3 scripts/ci/run_lane.py --has-targets cluster)
          else
            case ",${LANES// /}," in *,all,*|*,cluster,*) c=true;; *) c=false;; esac
          fi
          echo "cluster=$c" >> "$GITHUB_OUTPUT"
          for lane in warehouse salesforce athena servicenow; do
            echo "$lane=$(python3 scripts/ci/run_lane.py --has-targets "$lane")" >> "$GITHUB_OUTPUT"
          done

  # Every lane of the matrix is the one lane workflow (lane.yml), called with what a container-suite
  # lane needs.
  suite:
    name: ${{ matrix.lane }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }}
    needs: plan
    if: github.event_name != 'schedule' && needs.plan.outputs.suite == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/lane.yml
    with:
      name: ${{ matrix.lane }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }}
      ref: ${{ inputs.ref || github.sha }}
      timeout: ${{ matrix.timeout }}
      client: true
      uv-cache: true
      # The SQL Server warehouse replica target (provisa/federation/mssql_warehouse_runtime.py)
      # connects through Microsoft's ODBC Driver 18, which the runner image does not ship; its
      # requires_sqlserver tests run in the suite shards.
      odbc: true
      # tests/integration/test_jdbc_driver_e2e.py (core lane) runs the JDBC driver's Flight IT
      # with Maven against the server it starts; the driver is built for Java 21.
      java: ${{ matrix.lane == 'core' }}
      trino-plugins: true
      image-cache: true
      splunk-cim-cache: true
      env: |
        PYTEST_DOCKER_KEEP=
        PYTHONFAULTHANDLER=1
        PYTHONUNBUFFERED=1
        PROVISA_LANE_TESTS=${{ inputs.tests }}
      # The lane's name: the vector lane also installs the vector extra (REQ-2016).
      prepare: scripts/ci/lanes/suite-prepare.sh ${{ matrix.lane }}
      run: >-
        uv run python scripts/ci/run_lane.py ${{ matrix.lane }}
        ${{ matrix.shard && format('--shard {0}', matrix.shard) || '' }}
        --junitxml "results/$LANE_SLUG/junit.xml"
      on-failure: scripts/ci/lanes/suite-on-failure.sh
      # Uploaded as lane-<name as a file name> (lane-core-1of6, lane-e2e), which `report` collects.
      artifact-path: results/
      artifact-required: error
    secrets:
      # The e2e lane's LLM-evaluation tests reach the live model.
      ANTHROPIC_API_KEY: ${{ matrix.lane == 'e2e' && secrets.ANTHROPIC_API_KEY || '' }}
      OPENROUTER_API_KEY: ${{ matrix.lane == 'e2e' && secrets.OPENROUTER_API_KEY || '' }}
      # For the Splunk CIM fetch tests/conftest.py runs before starting splunk.
      SPLUNKBASE_USERNAME: ${{ secrets.SPLUNKBASE_USERNAME }}
      SPLUNKBASE_PASSWORD: ${{ secrets.SPLUNKBASE_PASSWORD }}

  cluster:
    name: cluster (helm on minikube)
    needs: plan
    if: github.event_name != 'schedule' && needs.plan.outputs.cluster == 'true'
    runs-on: ubuntu-latest
    # Past tests/e2e/test_helm_minikube.py's per-test bound (CLUSTER_TEST_BOUND_S, the sum of its
    # named deadlines) plus these prep steps, so a stalled call fails with its own message before
    # the job is cancelled and its log lost. tests/unit/test_helm_minikube_bounds.py holds this.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up Python
        uses: ./.github/actions/setup-python
        with:
          cache: "true"
          client: "true"

      - name: Restore Trino plugins
        id: trino-plugins
        uses: ./.github/actions/trino-plugins
        with:
          phase: restore

      - name: Install minikube and helm
        run: |
          curl -fsSLo minikube https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
          sudo install minikube /usr/local/bin/minikube
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Build the zaychik image the chart deploys
        # core.yml interpolates the store credentials even to build: the test instance's.
        run: |
          set -a
          eval "$(bash scripts/ci/test-store-env.sh)"
          set +a
          docker compose -f docker-compose.core.yml build zaychik && docker tag zaychik:latest provisa-zaychik:latest

      # tests/e2e/test_helm_minikube.py builds provisa:latest, starts a minikube profile of its own
      # under a kubeconfig of its own, installs the chart with auth.provider=local, and deletes the
      # profile however it ends.
      - name: Run lane
        run: |
          uv run python scripts/ci/run_lane.py cluster --junitxml results/cluster/junit.xml

      - name: Cache Trino plugins
        if: always()
        uses: ./.github/actions/trino-plugins
        with:
          phase: save
          cache-hit: ${{ steps.trino-plugins.outputs.cache-hit }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-cluster
          path: results/
          if-no-files-found: error

  warehouse:
    name: warehouse (live cloud warehouses)
    needs: plan
    if: (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.include_warehouse)) && needs.plan.outputs.warehouse == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # A targeted run (inputs.tests) runs only its named tests; none runs the whole lane.
      PROVISA_LANE_TESTS: ${{ inputs.tests }}
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      DATABRICKS_SERVER_HOSTNAME: ${{ secrets.DATABRICKS_SERVER_HOSTNAME }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
      BIGQUERY_LOCATION: ${{ secrets.BIGQUERY_LOCATION }}
      BIGQUERY_TEST_GCS_BUCKET: ${{ secrets.BIGQUERY_TEST_GCS_BUCKET }}
      GSHEETS_TEST_SHEET_ID: ${{ secrets.GSHEETS_TEST_SHEET_ID }}
      PROVISA_E2E_PURVIEW_ENDPOINT: ${{ secrets.PROVISA_E2E_PURVIEW_ENDPOINT }}
      PROVISA_E2E_DATAZONE_AWS_ACCESS_KEY_ID: ${{ secrets.PROVISA_E2E_DATAZONE_AWS_ACCESS_KEY_ID }}
      PROVISA_E2E_DATAZONE_AWS_SECRET_ACCESS_KEY: ${{ secrets.PROVISA_E2E_DATAZONE_AWS_SECRET_ACCESS_KEY }}
      PROVISA_E2E_DATAZONE_DOMAIN_ID: ${{ secrets.PROVISA_E2E_DATAZONE_DOMAIN_ID }}
      PROVISA_E2E_DATAZONE_PROJECT_ID: ${{ secrets.PROVISA_E2E_DATAZONE_PROJECT_ID }}
      FABRIC_SQL_SERVER: ${{ secrets.FABRIC_SQL_SERVER }}
      FABRIC_DATABASE: ${{ secrets.FABRIC_DATABASE }}
      FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
      FABRIC_CAPACITY_NAME: ${{ secrets.FABRIC_CAPACITY_NAME }}
      FABRIC_RESOURCE_GROUP: ${{ secrets.FABRIC_RESOURCE_GROUP }}
      REDSHIFT_AWS_ACCESS_KEY_ID: ${{ secrets.REDSHIFT_AWS_ACCESS_KEY_ID }}
      REDSHIFT_AWS_SECRET_ACCESS_KEY: ${{ secrets.REDSHIFT_AWS_SECRET_ACCESS_KEY }}
      REDSHIFT_AWS_REGION: ${{ secrets.REDSHIFT_AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_OVERRIDE: ${{ secrets.AWS_ENDPOINT_OVERRIDE }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # MotherDuck, read in place by the DuckDB engine and through pg_duckdb (REQ-1998, REQ-1868).
      MOTHERDUCK_API_TOKEN: ${{ secrets.MOTHERDUCK_API_TOKEN }}
      # GovData's engine fetches its R2 read credentials with this key.
      ASKAMERICA_API_KEY: ${{ secrets.ASKAMERICA_API_KEY }}
      SINGLESTORE_HOST: ${{ secrets.SINGLESTORE_HOST }}
      SINGLESTORE_PORT: ${{ secrets.SINGLESTORE_PORT }}
      SINGLESTORE_USERNAME: ${{ secrets.SINGLESTORE_USERNAME }}
      SINGLESTORE_PASSWORD: ${{ secrets.SINGLESTORE_PASSWORD }}
      SINGLESTORE_DATABASE: ${{ secrets.SINGLESTORE_DATABASE }}
      SP_AUTH_TYPE: ${{ secrets.SP_AUTH_TYPE }}
      SP_CLIENT_ID: ${{ secrets.SP_CLIENT_ID }}
      SP_SITE_URL: ${{ secrets.SP_SITE_URL }}
      SP_TENANT_ID: ${{ secrets.SP_TENANT_ID }}
      # The password of the client certificate below: Trino's SharePoint catalog and the pgwire
      # server both open the PFX with it.
      SP_CERT_PASSWORD: ${{ secrets.SP_CERT_PASSWORD }}
      # Synapse provisions through the Azure CLI, logged in as this service principal.
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      # The cloudops source's three clouds (tests/integration/test_cloudops_source_e2e.py). The GCP
      # service-account key is a file the source is pointed at; it arrives as base64 and is
      # written under RUNNER_TEMP by "Credentials present" (CLOUDOPS_GCP_CREDENTIALS_PATH).
      # CLOUDOPS_AWS_ROLE_ARN is optional to the source and no role is assumed here.
      CLOUDOPS_AZURE_TENANT_ID: ${{ secrets.CLOUDOPS_AZURE_TENANT_ID }}
      CLOUDOPS_AZURE_CLIENT_ID: ${{ secrets.CLOUDOPS_AZURE_CLIENT_ID }}
      CLOUDOPS_AZURE_CLIENT_SECRET: ${{ secrets.CLOUDOPS_AZURE_CLIENT_SECRET }}
      CLOUDOPS_AZURE_SUBSCRIPTION_IDS: ${{ secrets.CLOUDOPS_AZURE_SUBSCRIPTION_IDS }}
      CLOUDOPS_AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDOPS_AWS_ACCESS_KEY_ID }}
      CLOUDOPS_AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDOPS_AWS_SECRET_ACCESS_KEY }}
      CLOUDOPS_AWS_ACCOUNT_IDS: ${{ secrets.CLOUDOPS_AWS_ACCOUNT_IDS }}
      CLOUDOPS_AWS_REGION: ${{ secrets.CLOUDOPS_AWS_REGION }}
      CLOUDOPS_AWS_ROLE_ARN: ""
      CLOUDOPS_GCP_PROJECT_IDS: ${{ secrets.CLOUDOPS_GCP_PROJECT_IDS }}
      # The standing Synapse workspace the lane pins: a workspace the CI principal creates never
      # admits it (tests/integration/synapse_provision.py says why, and its one-time setup).
      SYNAPSE_SQL_SERVER: ${{ secrets.SYNAPSE_SQL_SERVER }}
      SYNAPSE_DATABASE: ${{ secrets.SYNAPSE_DATABASE }}
      SYNAPSE_ADLS_URL: ${{ secrets.SYNAPSE_ADLS_URL }}
      # The Google Sheets read reaches the live sheet only when asked to.
      PROVISA_GSHEETS_LIVE: "1"
      # Where a demo test writes the real answers its card is shot from (the agriculture
      # notebook's): uploaded with the lane's results as lane-warehouse.
      PROVISA_DEMO_CAPTURE_DIR: results/warehouse/captures
    steps:
      - uses: actions/checkout@v4
        with:
          # Nightly: main, the commit the schedule runs on. On demand: the ref asked for. The
          # actions and lane scripts below are read from this checkout, so it is never a branch
          # other than the one this file came from.
          ref: ${{ inputs.ref || github.sha }}
      # Fabric's SQL endpoint is reached through ODBC Driver 18
      - name: Install Microsoft ODBC Driver 18 for SQL Server
        uses: ./.github/actions/mssql-odbc
        timeout-minutes: 10
      - name: Set up Python
        uses: ./.github/actions/setup-python
        with:
          cache: "true"
          client: "true"

      - name: Restore Trino plugins
        id: trino-plugins
        uses: ./.github/actions/trino-plugins
        with:
          phase: restore

      # Every credential the lane needs, checked before anything runs: a missing one fails the lane
      # by name rather than surfacing as a skipped test.
      - name: Credentials present
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          SP_CERT_P12_BASE64: ${{ secrets.SP_CERT_P12_BASE64 }}
          CLOUDOPS_GCP_CREDENTIALS_JSON_BASE64: ${{ secrets.CLOUDOPS_GCP_CREDENTIALS_JSON_BASE64 }}
        run: |
          missing=""
          for v in SNOWFLAKE_ACCOUNT SNOWFLAKE_USER SNOWFLAKE_PASSWORD SNOWFLAKE_WAREHOUSE \
                   SNOWFLAKE_DATABASE DATABRICKS_SERVER_HOSTNAME DATABRICKS_HTTP_PATH \
                   DATABRICKS_TOKEN GOOGLE_CLOUD_PROJECT GOOGLE_APPLICATION_CREDENTIALS_JSON \
                   BIGQUERY_LOCATION BIGQUERY_TEST_GCS_BUCKET GSHEETS_TEST_SHEET_ID \
                   FABRIC_SQL_SERVER FABRIC_DATABASE FABRIC_WORKSPACE_ID \
                   REDSHIFT_AWS_ACCESS_KEY_ID REDSHIFT_AWS_SECRET_ACCESS_KEY \
                   AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_ENDPOINT_OVERRIDE \
                   SINGLESTORE_HOST SINGLESTORE_PORT SINGLESTORE_USERNAME SINGLESTORE_PASSWORD \
                   SINGLESTORE_DATABASE CLOUDFLARE_ACCOUNT_ID MOTHERDUCK_API_TOKEN ASKAMERICA_API_KEY SP_AUTH_TYPE SP_CLIENT_ID SP_SITE_URL SP_TENANT_ID \
                   AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID SP_CERT_P12_BASE64 \
                   SP_CERT_PASSWORD \
                   CLOUDOPS_AZURE_TENANT_ID CLOUDOPS_AZURE_CLIENT_ID CLOUDOPS_AZURE_CLIENT_SECRET \
                   CLOUDOPS_AZURE_SUBSCRIPTION_IDS CLOUDOPS_AWS_ACCESS_KEY_ID \
                   CLOUDOPS_AWS_SECRET_ACCESS_KEY CLOUDOPS_AWS_ACCOUNT_IDS CLOUDOPS_AWS_REGION \
                   CLOUDOPS_GCP_PROJECT_IDS CLOUDOPS_GCP_CREDENTIALS_JSON_BASE64; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::warehouse lane cannot run; repo secrets not set:$missing"
            exit 1
          fi
          printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$RUNNER_TEMP/gcp-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-key.json" >> "$GITHUB_ENV"
          # SharePoint authenticates with the app's client certificate (a PFX opened with
          # SP_CERT_PASSWORD; one exported with an empty password is not readable by Trino's JVM:
          # run 37777052154, "failed to decrypt safe contents entry"), not a
          # client secret; the certificate is gitignored, so it arrives as a base64 secret.
          # It goes where compose mounts it into Trino from: ./sharepoint.pfx (docker-compose.core.yml).
          printf '%s' "$SP_CERT_P12_BASE64" | base64 -d > "$GITHUB_WORKSPACE/sharepoint.pfx"
          echo "SP_CERT_PATH=$GITHUB_WORKSPACE/sharepoint.pfx" >> "$GITHUB_ENV"
          echo "PROVISA_E2E_SHAREPOINT_CERT_HOST=$GITHUB_WORKSPACE/sharepoint.pfx" >> "$GITHUB_ENV"
          # The cloudops source reads its GCP service-account key from a file, by absolute path.
          printf '%s' "$CLOUDOPS_GCP_CREDENTIALS_JSON_BASE64" | base64 -d > "$RUNNER_TEMP/cloudops-gcp-key.json"
          echo "CLOUDOPS_GCP_CREDENTIALS_PATH=$RUNNER_TEMP/cloudops-gcp-key.json" >> "$GITHUB_ENV"

      # GovData's JDBC driver is the calcite engine's govdata jar, from the engine release
      # provisa/runtime_deps/pgwire_bundles.py pins (CONNECTOR_RELEASE["govdata"]); the test loads lib/calcite-govdata-*.jar.
      - name: GovData engine jar (engine-v0.122.2)
        run: |
          mkdir -p lib
          curl -fsSL -o lib/calcite-govdata-all.jar \
            https://github.com/kenstott/calcite/releases/download/engine-v0.122.2/sih-govdata.jar
          echo "1caf42720188cbfc2f78f7fd80cf3f826bd594be9a71aad35b5b8232523cba8e  lib/calcite-govdata-all.jar" \
            | sha256sum -c -

      - name: Azure CLI login (Synapse provisioning)
        run: az login --service-principal -u "$AZURE_CLIENT_ID" -p "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID" --output none

      - name: Stack slots on this runner
        run: bash scripts/ci/lanes/suite-prepare.sh

      - name: Run lane
        run: uv run python scripts/ci/run_lane.py warehouse --junitxml results/warehouse/junit.xml

      - name: Cache Trino plugins
        if: always()
        uses: ./.github/actions/trino-plugins
        with:
          phase: save
          cache-hit: ${{ steps.trino-plugins.outputs.cache-hit }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-warehouse
          path: results/
          if-no-files-found: error

  # The live Salesforce org. A cold run describes every sObject of the org -- about 2,450 API calls
  # of the 15,000 the org is allowed a day -- so this job runs only when a dispatch asks for it.
  # Both describe caches (the pgwire server's and the Trino plugin's) are kept between runs, keyed
  # on the org, so a rerun within the cache's day costs the test's statements and no describe.
  salesforce:
    name: salesforce (live org)
    needs: plan
    if: (github.event_name == 'workflow_dispatch' && inputs.include_salesforce) && needs.plan.outputs.salesforce == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # A targeted run (inputs.tests) runs only its named tests; none runs the whole lane.
      PROVISA_LANE_TESTS: ${{ inputs.tests }}
      SF_LOGIN_URL: ${{ secrets.SF_LOGIN_URL }}
      SF_CONSUMER_KEY: ${{ secrets.SF_CONSUMER_KEY }}
      SF_CONSUMER_SECRET: ${{ secrets.SF_CONSUMER_SECRET }}
      SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
      SF_SECURITY_TOKEN: ${{ secrets.SF_SECURITY_TOKEN }}
      SF_NICKNAME: ${{ secrets.SF_NICKNAME }}
      # Where the downloaded bundles and both describe caches live (default_cache_root).
      PROVISA_RUNTIME_DEPS_CACHE: ${{ github.workspace }}/.runtime-deps
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up Python
        uses: ./.github/actions/setup-python
        with:
          cache: "true"
          client: "true"

      - name: Restore Trino plugins
        id: trino-plugins
        uses: ./.github/actions/trino-plugins
        with:
          phase: restore

      # A missing credential fails the lane by name rather than surfacing as a skipped test.
      - name: Credentials present
        id: org
        run: |
          missing=""
          for v in SF_LOGIN_URL SF_CONSUMER_KEY SF_CONSUMER_SECRET SF_PASSWORD SF_SECURITY_TOKEN \
                   SF_NICKNAME; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::salesforce lane cannot run; repo secrets not set:$missing"
            exit 1
          fi
          # The caches are one org's: the key carries a digest of the login URL, as the test's
          # source id does.
          echo "digest=$(printf '%s' "$SF_LOGIN_URL" | sha256sum | cut -c1-8)" >> "$GITHUB_OUTPUT"

      # A cache entry is written once per key, so each run saves under its own and restores the
      # newest of its org.
      - name: Restore Salesforce describe caches
        uses: actions/cache/restore@v4
        with:
          path: &salesforce-describe |
            .runtime-deps/salesforce-itest-state
            .runtime-deps/itest-trino-salesforce-describe
          key: salesforce-describe-${{ steps.org.outputs.digest }}-${{ github.run_id }}
          restore-keys: salesforce-describe-${{ steps.org.outputs.digest }}-

      - name: Stack slots on this runner
        run: bash scripts/ci/lanes/suite-prepare.sh

      - name: Run lane
        run: uv run python scripts/ci/run_lane.py salesforce --junitxml results/salesforce/junit.xml

      # The Trino container writes its describe results as its own user.
      - name: Describe caches readable
        if: always()
        run: sudo chmod -R a+rX .runtime-deps/salesforce-itest-state .runtime-deps/itest-trino-salesforce-describe

      - name: Cache Salesforce describe caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: *salesforce-describe
          key: salesforce-describe-${{ steps.org.outputs.digest }}-${{ github.run_id }}

      - name: Cache Trino plugins
        if: always()
        uses: ./.github/actions/trino-plugins
        with:
          phase: save
          cache-hit: ${{ steps.trino-plugins.outputs.cache-hit }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-salesforce
          path: results/
          if-no-files-found: error

  # The live Amazon Athena account (REQ-1981): a dispatch asks for it (include_athena). Each run
  # makes its own Glue database and S3 prefix and removes them.
  athena:
    name: athena (live account)
    needs: plan
    if: (github.event_name == 'workflow_dispatch' && inputs.include_athena) && needs.plan.outputs.athena == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # A targeted run (inputs.tests) runs only its named tests; none runs the whole lane.
      PROVISA_LANE_TESTS: ${{ inputs.tests }}
      ATHENA_AWS_ACCESS_KEY_ID: ${{ secrets.ATHENA_AWS_ACCESS_KEY_ID }}
      ATHENA_AWS_SECRET_ACCESS_KEY: ${{ secrets.ATHENA_AWS_SECRET_ACCESS_KEY }}
      ATHENA_REGION: ${{ secrets.ATHENA_REGION }}
      ATHENA_S3_BUCKET: ${{ secrets.ATHENA_S3_BUCKET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up Python
        uses: ./.github/actions/setup-python
        with:
          cache: "true"
          client: "true"

      - name: Restore Trino plugins
        id: trino-plugins
        uses: ./.github/actions/trino-plugins
        with:
          phase: restore

      # A missing credential fails the lane by name rather than surfacing as a skipped test.
      - name: Credentials present
        run: |
          missing=""
          for v in ATHENA_AWS_ACCESS_KEY_ID ATHENA_AWS_SECRET_ACCESS_KEY ATHENA_REGION \
                   ATHENA_S3_BUCKET; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::athena lane cannot run; repo secrets not set:$missing"
            exit 1
          fi

      - name: Stack slots on this runner
        run: bash scripts/ci/lanes/suite-prepare.sh

      - name: Run lane
        run: uv run python scripts/ci/run_lane.py athena --junitxml results/athena/junit.xml

      - name: Cache Trino plugins
        if: always()
        uses: ./.github/actions/trino-plugins
        with:
          phase: save
          cache-hit: ${{ steps.trino-plugins.outputs.cache-hit }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-athena
          path: results/
          if-no-files-found: error


  # The live ServiceNow instance (REQ-1954): a dispatch asks for it, as for the Salesforce org.
  servicenow:
    name: servicenow (live instance)
    needs: plan
    if: (github.event_name == 'workflow_dispatch' && inputs.include_servicenow) && needs.plan.outputs.servicenow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # A targeted run (inputs.tests) runs only its named tests; none runs the whole lane.
      PROVISA_LANE_TESTS: ${{ inputs.tests }}
      SERVICENOW_INSTANCE_URL: ${{ secrets.SERVICENOW_INSTANCE_URL }}
      SERVICENOW_USERNAME: ${{ secrets.SERVICENOW_USERNAME }}
      SERVICENOW_PASSWORD: ${{ secrets.SERVICENOW_PASSWORD }}
      # Where the downloaded bundles live (default_cache_root).
      PROVISA_RUNTIME_DEPS_CACHE: ${{ github.workspace }}/.runtime-deps
      SERVICENOW_CALCITE_REF: ${{ inputs.servicenow_calcite_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up Python
        uses: ./.github/actions/setup-python
        with:
          cache: "true"
          client: "true"

      - name: Restore Trino plugins
        id: trino-plugins
        uses: ./.github/actions/trino-plugins
        with:
          phase: restore

      # A missing credential or calcite ref fails the lane by name rather than surfacing as a
      # skipped test.
      - name: Credentials present
        run: |
          missing=""
          for v in SERVICENOW_INSTANCE_URL SERVICENOW_USERNAME SERVICENOW_PASSWORD \
                   SERVICENOW_CALCITE_REF; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::servicenow lane cannot run; repo secrets not set:$missing"
            exit 1
          fi

      # The ServiceNow server is built from the calcite ref the dispatch names (REQ-1954), and the
      # app is pointed at that build; the pinned release is never fetched in its place.
      - name: Check out the ServiceNow adapter
        uses: actions/checkout@v4
        with:
          repository: kenstott/calcite
          ref: ${{ inputs.servicenow_calcite_ref }}
          path: calcite
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build pgwire-servicenow
        working-directory: calcite
        env:
          PGWIRE_BUNDLE_VERSION: dev
        run: |
          bash pgwire-calcite/packaging/build-bundle.sh servicenow linux-x86_64 "$RUNNER_TEMP/pgw"
          echo "PROVISA_PGWIRE_BUNDLE_SERVICENOW=$RUNNER_TEMP/pgw/pgwire-servicenow-dev-linux-x86_64" >> "$GITHUB_ENV"

      - name: Stack slots on this runner
        run: bash scripts/ci/lanes/suite-prepare.sh

      - name: Run lane
        run: uv run python scripts/ci/run_lane.py servicenow --junitxml results/servicenow/junit.xml

      - name: Cache Trino plugins
        if: always()
        uses: ./.github/actions/trino-plugins
        with:
          phase: save
          cache-hit: ${{ steps.trino-plugins.outputs.cache-hit }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-servicenow
          path: results/
          if-no-files-found: error

  report:
    name: results by lane
    needs: [plan, suite, cluster, warehouse, salesforce, athena, servicenow]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: lane-*
          path: artifacts
          merge-multiple: true
      - name: Table
        run: |
          set -o pipefail
          python3 scripts/ci/lane_report.py artifacts \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
