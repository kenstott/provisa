name: Conformance (MCP)

# REQ-2167: Provisa's MCP server against the MCP conformance suite (npm
# @modelcontextprotocol/conformance, MIT), installed at a pinned version, never vendored, its
# active server scenarios run against the Streamable HTTP endpoint on the loopback; and against
# the MCP specification's lifecycle, tools, ping and authorization rules for the model's own tools,
# which the suite's scenarios do not reach. scripts/conformance/mcp_conformance.py reads the
# suite's results and runs the specification scenarios; each case is passed, skipped by design or
# failed (amended 2026-10-28).
#
# The suite's client sends no credential, so the server acts on the loopback for the principal and
# role its operator names (mcp.principal and mcp.role, REQ-1105): the job user, as org_admin, set
# by the break-glass account through the settings catalog before the suite runs.
#
# The report is written to the job summary and to the artifact conformance-mcp.json (read by
# scripts/conformance/fill_docs.py into docs/conformance/mcp.md). The job fails when a case fails
# that scripts/conformance/expected/mcp.json does not list, judged by
# scripts/conformance/baseline_gate.py at its last step, when the instance did not start, or when
# no case ran.
#
# The instance is the pgwire conformance job's (see conformance-pgwire.yml); its MCP port is the
# API port plus four (.github/actions/conformance-instance).

on:
  # Runs on dispatch for a release (gh workflow run <workflow> --ref <release branch>): it gates the
  # release (REQ-1989). No push starts it.
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit or branch to test (default: the dispatched one)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: conformance-mcp-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  mcp:
    name: MCP conformance
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      MCP_CONFORMANCE_VERSION: "0.1.16"
      PROVISA_MCP_HOST: 127.0.0.1
      PROVISA_API_PORT: "8901"
      PROVISA_PGWIRE_PORT: "8906"
      CONFORMANCE_PG_HOST: 127.0.0.1
      CONFORMANCE_PG_PORT: "15432"
      CONFORMANCE_PG_DATABASE: conformance
      CONFORMANCE_PG_USER: postgres
      CONFORMANCE_PG_PASSWORD: conformance-pg-password
      # pgwire's password auth (basic provider, SCRAM-SHA-256): the break-glass account the
      # instance boots with, the job user it creates, and the session signing key. Ephemeral, on
      # a throwaway instance: not secrets.
      PROVISA_SUPERUSER_USERNAME: conformance-su
      PROVISA_SUPERUSER_PASSWORD: conformance-su-password
      CONFORMANCE_USER: conformance
      CONFORMANCE_PASSWORD: conformance-password
      CONFORMANCE_JWT_SECRET: conformance-jwt-signing-key-not-a-secret-0000
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_PASSWORD: conformance-pg-password
          POSTGRES_DB: conformance
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python
        uses: ./.github/actions/setup-python
        with:
          extras: dev

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Fetch the MCP conformance suite
        run: |
          mkdir -p "$RUNNER_TEMP/mcp-conformance"
          cd "$RUNNER_TEMP/mcp-conformance"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "@modelcontextprotocol/conformance@$MCP_CONFORMANCE_VERSION"
          head -n 3 node_modules/@modelcontextprotocol/conformance/LICENSE
          grep -q "MIT License" node_modules/@modelcontextprotocol/conformance/LICENSE

      # The instance (.github/actions/conformance-instance): fixture, model, server, job user and
      # its token in CONFORMANCE_AUTHORIZATION.
      - name: Start the Provisa instance
        id: start
        uses: ./.github/actions/conformance-instance

      # REQ-1105: the principal and role a loopback call with no bearer acts for -- the job user,
      # as org_admin -- stored by the break-glass account (both are guarded: named in confirm).
      - name: Name the MCP principal
        run: |
          user_id=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["id"])' "$RUNNER_TEMP/provisa/user-response.txt")
          body=$(python3 -c 'import json, sys; print(json.dumps({"values": {"mcp.role": "org_admin", "mcp.principal": sys.argv[1]}, "confirm": ["mcp.role", "mcp.principal"]}))' "$user_id")
          status=$(curl -s -o "$RUNNER_TEMP/provisa/mcp-settings.txt" -w '%{http_code}' \
            -u "$PROVISA_SUPERUSER_USERNAME:$PROVISA_SUPERUSER_PASSWORD" -X PUT \
            -H 'Content-Type: application/json' --data "$body" \
            "http://127.0.0.1:$PROVISA_API_PORT/admin/settings/catalog")
          if [ "${status:0:1}" != "2" ]; then
            echo "::error::PUT /admin/settings/catalog answered $status"; cat "$RUNNER_TEMP/provisa/mcp-settings.txt"; exit 1
          fi
          port=$((PROVISA_API_PORT + 4))
          for _ in $(seq 1 60); do
            (exec 3<>"/dev/tcp/127.0.0.1/$port") 2>/dev/null && break
            sleep 2
          done
          (exec 3<>"/dev/tcp/127.0.0.1/$port") 2>/dev/null || { echo "::error::MCP never listened on $port"; tail -n 200 "$RUNNER_TEMP/provisa/server.log"; exit 1; }
          echo "CONFORMANCE_MCP_URL=http://127.0.0.1:$port/mcp" >> "$GITHUB_ENV"

      # The suite exits non-zero when a scenario fails: a failure is data, judged by the gate.
      - name: Run the MCP conformance suite
        timeout-minutes: 20
        run: |
          node "$RUNNER_TEMP/mcp-conformance/node_modules/@modelcontextprotocol/conformance/dist/index.js" \
            server --url "$CONFORMANCE_MCP_URL" --suite active --output-dir "$RUNNER_TEMP/mcp-results" || echo "the suite reported failing scenarios (exit $?)"

      - name: Run the scenarios
        timeout-minutes: 20
        run: |
          mkdir -p "$RUNNER_TEMP/report"
          .venv/bin/python scripts/conformance/mcp_conformance.py \
            "$CONFORMANCE_MCP_URL" "$RUNNER_TEMP/mcp-results" "$MCP_CONFORMANCE_VERSION" \
            "$RUNNER_TEMP/report/conformance-mcp.json" "$RUNNER_TEMP/report/conformance-mcp.md" || ran=$?
          cat "$RUNNER_TEMP/report/conformance-mcp.md" >> "$GITHUB_STEP_SUMMARY"
          exit "${ran:-0}"

      - name: Upload results
        if: ${{ !cancelled() }}
        run: cp "$RUNNER_TEMP/provisa/server.log" "$RUNNER_TEMP/report/" || true

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: conformance-mcp
          path: ${{ runner.temp }}/report/
          if-no-files-found: warn

      - name: Server log on failure
        if: ${{ failure() }}
        run: tail -n 400 "$RUNNER_TEMP/provisa/server.log" || true

      - name: Stop the Provisa instance
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/provisa/server.pid" ]; then kill "$(cat "$RUNNER_TEMP/provisa/server.pid")" || true; fi
          if [ -d "$RUNNER_TEMP/provisa/control-pg" ]; then .venv/bin/python -m provisa.core.control_plane_pg stop "$RUNNER_TEMP/provisa/control-pg" || true; fi

      # REQ-2167: the run judged against its committed expected-failures list
      # (scripts/conformance/expected/mcp.json): a case that fails and is not listed fails the
      # job, and so does a listed case that now passes (take it off in the change that fixes it),
      # a partial run, or a missing report. The last step, after the instance stops.
      - name: Judge against the expected-failures list
        if: ${{ !cancelled() }}
        run: .venv/bin/python scripts/conformance/baseline_gate.py cases mcp "$RUNNER_TEMP/report/conformance-mcp.json"
