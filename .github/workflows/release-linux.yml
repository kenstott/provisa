# Release: Linux AppImage
#
# The Linux AppImage, from the plugins and the UI dist the prebuilt leg of the same run uploaded.
#
# One leg of the release. Called by build-dmg.yml (the release orchestrator) on a tag, and by a
# manual dry run of it. `version` is the release's tag; nothing here reads the pushed ref.
# `publish` is false on a dry run: every artifact is built and uploaded to the RUN, and every
# step that leaves the run -- the draft release, its attachments, PyPI, an image push, a signed
# attestation -- is skipped. On a release each job attaches the assets it built straight to the
# draft (.github/actions/attach-release-assets) instead of uploading them to the run, unless
# another job of the run reads them. A failed job of this leg is re-run alone with
# "Re-run failed jobs" on the release's run; the legs it reads from (their artifacts are the
# run's) are not built again.
name: "Release: Linux AppImage"

on:
  workflow_call:
    inputs:
      version:
        description: The release tag (v0.1.0-alpha.477).
        type: string
        required: true
      publish:
        description: Leave the run (draft release, attachments, PyPI, image pushes). False on a dry run.
        type: boolean
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.meta.outputs.channel }}
      linux_name: ${{ steps.meta.outputs.linux_name }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        uses: ./.github/actions/release-metadata
        with:
          version: ${{ inputs.version }}

  # ── Linux build job ──────────────────────────────────────────────────────────

  build-linux:
    name: Build Linux AppImage (core, ${{ needs.metadata.outputs.channel }})
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attaches what it builds to the draft release
    needs: [metadata]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # REQ-2225: the platform connector block of this run (release-platform-connectors.yml)
      # over the checkout's, before anything is packaged.
      - name: Platform connector block
        uses: actions/download-artifact@v4
        with:
          name: platform-connectors
          path: provisa/core

      # Slim AppImage: images are NOT bundled (they'd push it over GitHub's 2 GB
      # asset limit alongside the native venv payload). The Docker tier acquires
      # core image assets (provisa-core-images-amd64-<ver>.sha256 lists them) on demand at
      # first launch.

      # The native tier's wheel + ui-dist payload need a host-built UI (the Docker
      # image builds the UI internally, but bundle_native_payload runs on the host).
      - name: Download prebuilt provisa-ui dist
        uses: actions/download-artifact@v4
        with:
          name: provisa-ui-dist
          path: provisa-ui/dist/

      # Obs images are NOT bundled in the AppImage (2GB asset limit); they ship as the
      # provisa-obs-images-<version>.tar.gz add-on.

      - name: Download Calcite plugins
        uses: actions/download-artifact@v4
        with:
          name: trino-plugins
          path: trino/plugins/

      # provisa-notebook's build takes Pyodide from this directory, not from its CDN.
      - name: Pyodide downloads
        uses: ./.github/actions/pyodide-downloads

      # This commit's provisa-duckdb-ext wheels, which the AppImage's image stages (REQ-294): the
      # Pages index holds only what a release already published.
      - name: DuckDB extension wheels
        uses: ./.github/actions/duckdb-ext-wheels
        with:
          phase: prime

      - name: Build AppImage
        run: |
          chmod +x packaging/linux/build-appimage.sh
          packaging/linux/build-appimage.sh

      - name: Rename AppImage
        run: |
          mv packaging/linux/dist/Provisa.AppImage \
             "packaging/linux/dist/${{ needs.metadata.outputs.linux_name }}"

      # A dry run keeps it in the run (its only home: nothing is attached); a release attaches it
      # to the draft directly, never through an artifact.
      - name: Upload AppImage artifact
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: "packaging/linux/dist/${{ needs.metadata.outputs.linux_name }}"
          if-no-files-found: error
          retention-days: 1

      - name: Attach the AppImage to the draft release
        if: inputs.publish
        uses: ./.github/actions/attach-release-assets
        with:
          tag: ${{ inputs.version }}
          files: "packaging/linux/dist/${{ needs.metadata.outputs.linux_name }}"
