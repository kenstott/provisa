# Inventory and removal of what Provisa's tests created in the Snowflake account (REQ-254).
# Manual only: `list` is read-only and uploads the inventory; `delete` drops exactly the objects
# given (a JSON list from a list run) and nothing else.
name: Snowflake cleanup

on:
  workflow_dispatch:
    inputs:
      mode:
        description: list (read-only) or delete (exactly the objects given)
        type: choice
        options: [list, delete]
        required: true
      items:
        description: 'JSON list of {"kind","name"} from a list run (required for delete)'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: snowflake-cleanup
  cancel-in-progress: false

jobs:
  snowflake-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      MODE: ${{ inputs.mode }}
      ITEMS: ${{ inputs.items }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the Snowflake connector
        run: python -m pip install "snowflake-connector-python"
      - name: Require items for delete
        if: env.MODE == 'delete' && env.ITEMS == ''
        run: |
          echo "delete needs the items input" >&2
          exit 1
      - name: List
        if: env.MODE == 'list'
        run: |
          python scripts/snowflake_cleanup.py list --out snowflake-inventory.json > report.txt
          cat report.txt
          cat report.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload inventory
        if: env.MODE == 'list'
        uses: actions/upload-artifact@v4
        with:
          name: snowflake-inventory
          path: snowflake-inventory.json
          if-no-files-found: error
      - name: Delete
        if: env.MODE == 'delete'
        run: |
          python scripts/snowflake_cleanup.py delete --items "$ITEMS" > report.txt
          cat report.txt
          cat report.txt >> "$GITHUB_STEP_SUMMARY"
