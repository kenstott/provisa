name: Conformance (functions)

# REQ-2167 (THE GOAL IS THE GUARANTEED LIST), REQ-2171 (AN ANSWER THAT DIFFERS IS REFUSED, EXACT OR
# EQUIVALENT, RESULTS ARE BY ENGINE): which pg_catalog functions work today, per federation engine.
# Each overload has a result on each engine: exact, equivalent under a written rule, refused by name
# or differs. Nothing adds the engines up. Measurement only: it writes no function form, and nothing
# it finds fails a gate. Separate from Conformance (pgwire), whose land gate reads its own report.
# Each overload with a sample value is called once more reading it from a column of
# conformance.function_columns, which this workflow alone seeds and registers: a pass whose column
# call fails passes on literals only, reported beside its result and changing none.
#
# One leg per free engine that boots on a runner, each the instance every conformance job tests
# (.github/actions/conformance-instance) on that engine, measured against the same real PostgreSQL
# by scripts/conformance/function_support.py, whose docstring says exactly what is compared. A leg
# is failed only when it left the measurement unfinished, never by a wrong answer. A last job
# merges the legs into scripts/conformance/function_support.json, with the guaranteed list, fills
# the per-engine sections of docs/conformance/pgwire.md and overview.md from it, and uploads all
# three. It is failed when any leg left no complete result: such a list guarantees nothing.
#
# The legs are scripts/conformance/function_legs.yaml, one per engine kind of
# provisa/core/engine_kinds.py that runs in a container a hosted runner can boot, which also says
# why each other kind is not run; the plan job reads it and the merge lists it on the report. Every
# direct-only source can be an engine (maintainer, 2026-11-03), so a leg measures the engine and the
# direct path of its platform. An engine with a server runs in the docker-compose.test.yml service
# the integration tests start for it, or in the demo/sources container another CI lane starts for it
# (SAP HANA, as the swap UI lane does) (scripts/conformance/engine_service.sh). A leg whose engine
# does not start is a failure, and its reason is on the report (function_legs.py failure).
#
# The live warehouses (snowflake, databricks, bigquery, fabric, synapse, redshift, motherduck and the
# hosted singlestore) are the warehouse lane, under the gating of the integration suite's warehouse
# lane (integration-suite-lanes.yml, warehouse job), whose repository secrets they read and no
# others: planned only by a dispatch with lanes warehouse or all; each secret a leg reads checked
# by name before anything runs; a leg that wakes compute every run shares (Snowflake, Databricks,
# the Fabric capacity) in that lane's live-cloud-warehouses concurrency group, never cancelled; and
# what a leg woke or provisioned left stopped, suspended, paused or deleted whatever happened
# (REQ-254; scripts/conformance/warehouse_leg.py). No push or schedule runs this workflow.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit or branch to test (default: the dispatched one)"
        required: false
        default: ""
      lanes:
        description: "free: the engines a hosted runner boots; warehouse: the warehouse lane's live warehouses, by its secrets; all: both"
        required: false
        type: choice
        default: free
        options: [free, warehouse, all]

permissions:
  contents: read

concurrency:
  group: conformance-functions-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: legs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      engines: ${{ steps.plan.outputs.engines }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python
        uses: ./.github/actions/setup-python
        with:
          extras: dev

      - name: Plan the legs
        id: plan
        run: |
          .venv/bin/python scripts/conformance/function_legs.py plan --lanes "${{ inputs.lanes || 'free' }}" \
            | tee -a "$GITHUB_OUTPUT"

  probe:
    name: functions on ${{ matrix.engine }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 160
    # A leg that wakes shared warehouse compute waits for any run of the warehouse lane (or of
    # another such leg) that holds it, and is never cancelled by one (integration-suite-lanes.yml,
    # warehouse job, REQ-254); every other leg is a group of its own.
    concurrency:
      group: ${{ matrix.concurrency || format('conformance-functions-{0}-{1}', github.run_id, matrix.engine) }}
      queue: max
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PROVISA_ENGINE: ${{ matrix.engine }}
      PROVISA_ENGINE_URL: ${{ matrix.engine-url }}
      PROVISA_API_PORT: "8901"
      PROVISA_PGWIRE_PORT: "8906"
      CONFORMANCE_PG_HOST: 127.0.0.1
      CONFORMANCE_PG_PORT: "55432"
      CONFORMANCE_PG_DATABASE: conformance
      CONFORMANCE_PG_USER: postgres
      CONFORMANCE_PG_PASSWORD: conformance
      # Ephemeral, on a throwaway instance: not secrets (conformance-pgwire.yml).
      PROVISA_SUPERUSER_USERNAME: conformance-su
      PROVISA_SUPERUSER_PASSWORD: conformance-su-password
      CONFORMANCE_USER: conformance
      CONFORMANCE_PASSWORD: conformance-password
      CONFORMANCE_JWT_SECRET: conformance-jwt-signing-key-not-a-secret-0000
      # What docker-compose.core.yml publishes (the Trino leg alone starts it).
      PG_PORT: "5432"
      TRINO_PORT: "8080"
    services:
      postgres:
        # The PostgreSQL the catalog is generated from (scripts/gen_pgwire_pg17_catalog.py).
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: conformance
          POSTGRES_DB: conformance
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python
        uses: ./.github/actions/setup-python
        with:
          extras: ${{ matrix.extras }}

      - name: Install ODBC Driver 18
        id: odbc
        if: matrix.odbc
        timeout-minutes: 10
        uses: ./.github/actions/mssql-odbc

      # The SQLAlchemy dialect the engine URL names, where the locked environment has none, into
      # this leg's environment alone.
      - name: Install the engine's client
        id: client
        if: matrix.pip != '' || matrix.apt != ''
        run: |
          if [ -n "${{ matrix.apt }}" ]; then
            sudo apt-get -o DPkg::Lock::Timeout=300 update -q
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=300 install -y -q ${{ matrix.apt }}
          fi
          if [ -n "${{ matrix.pip }}" ]; then
            uv pip install --python .venv/bin/python ${{ matrix.pip }}
          fi

      - name: Start the engine's server
        id: service
        if: matrix.service != '' || matrix.demo-source != ''
        env:
          SERVICE: ${{ matrix.service }}
          DEMO_SOURCE: ${{ matrix.demo-source }}
          WAIT: ${{ matrix.wait }}
          READY_SQL: ${{ matrix.ready-sql }}
          SETUP_URL: ${{ matrix.setup-url }}
          SETUP_SQL: ${{ matrix.setup-sql }}
          SOURCE_HOST: ${{ matrix.source-host }}
        run: |
          if [ -n "$DEMO_SOURCE" ]; then
            bash scripts/conformance/engine_service.sh demo "$DEMO_SOURCE"
          else
            bash scripts/conformance/engine_service.sh up "$SERVICE" "$WAIT"
          fi
          if [ -n "$SETUP_SQL" ]; then
            .venv/bin/python scripts/conformance/function_legs.py wait --url "$SETUP_URL" --sql "$READY_SQL" --timeout "$WAIT"
            .venv/bin/python scripts/conformance/function_legs.py setup --url "$SETUP_URL" --sql "$SETUP_SQL"
          fi
          if [ -n "$READY_SQL" ]; then
            .venv/bin/python scripts/conformance/function_legs.py wait --url "$PROVISA_ENGINE_URL" --sql "$READY_SQL" --timeout "$WAIT"
          fi
          # An engine in a container that reads the conformance PostgreSQL itself reaches it by the
          # runner's own address.
          if [ "$SOURCE_HOST" = runner ]; then
            echo "CONFORMANCE_PG_HOST=$(hostname -I | cut -d' ' -f1)" >> "$GITHUB_ENV"
          fi

      # scripts/ci/lanes/trino-stack-prepare.sh, the Trino lanes' one copy; no catalog here reads
      # the certificate. The app runs on this host and Trino in a container, so each is told the
      # address the other side dials: playwright.config.ts's Trino webServer, name for name. The
      # conformance source is addressed by the runner's own address, which both can reach.
      - name: Start the Trino stack
        id: trino
        if: matrix.engine == 'trino'
        run: |
          bash scripts/ci/test-store-env.sh | tee -a "$GITHUB_ENV" > "$RUNNER_TEMP/store-env"
          set -a; . "$RUNNER_TEMP/store-env"; set +a
          bash scripts/ci/lanes/trino-stack-prepare.sh placeholder-cert
          {
            echo "CONFORMANCE_PG_HOST=$(hostname -I | cut -d' ' -f1)"
            echo "PROVISA_ENGINE_CONTROL_PLANE_HOST=postgres"
            echo "PROVISA_ENGINE_CONTROL_PLANE_PORT=5432"
            echo "PROVISA_OTEL_S3_ENDPOINT=http://localhost:9000"
            echo "PROVISA_ENGINE_OTEL_S3_ENDPOINT=http://minio:9000"
            echo "PROVISA_ENGINE_LAKEHOUSE_METASTORE_HOST=hive-metastore"
            echo "PROVISA_ENGINE_LAKEHOUSE_METASTORE_PORT=9083"
          } >> "$GITHUB_ENV"

      # A warehouse leg's warehouse, from the warehouse lane's repository secrets (its job's env in
      # integration-suite-lanes.yml, name for name): those this leg names are checked, given to the
      # instance through $GITHUB_ENV, and what it uses woken or provisioned, with its engine URL.
      - name: Bring up the warehouse
        id: warehouse
        if: matrix.lane == 'warehouse'
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          DATABRICKS_SERVER_HOSTNAME: ${{ secrets.DATABRICKS_SERVER_HOSTNAME }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          FABRIC_SQL_SERVER: ${{ secrets.FABRIC_SQL_SERVER }}
          FABRIC_DATABASE: ${{ secrets.FABRIC_DATABASE }}
          FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
          FABRIC_CAPACITY_NAME: ${{ secrets.FABRIC_CAPACITY_NAME }}
          FABRIC_RESOURCE_GROUP: ${{ secrets.FABRIC_RESOURCE_GROUP }}
          SYNAPSE_SQL_SERVER: ${{ secrets.SYNAPSE_SQL_SERVER }}
          SYNAPSE_DATABASE: ${{ secrets.SYNAPSE_DATABASE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          REDSHIFT_AWS_ACCESS_KEY_ID: ${{ secrets.REDSHIFT_AWS_ACCESS_KEY_ID }}
          REDSHIFT_AWS_SECRET_ACCESS_KEY: ${{ secrets.REDSHIFT_AWS_SECRET_ACCESS_KEY }}
          REDSHIFT_AWS_REGION: ${{ secrets.REDSHIFT_AWS_REGION }}
          MOTHERDUCK_API_TOKEN: ${{ secrets.MOTHERDUCK_API_TOKEN }}
          SINGLESTORE_HOST: ${{ secrets.SINGLESTORE_HOST }}
          SINGLESTORE_PORT: ${{ secrets.SINGLESTORE_PORT }}
          SINGLESTORE_USERNAME: ${{ secrets.SINGLESTORE_USERNAME }}
          SINGLESTORE_PASSWORD: ${{ secrets.SINGLESTORE_PASSWORD }}
          SINGLESTORE_DATABASE: ${{ secrets.SINGLESTORE_DATABASE }}
        run: |
          .venv/bin/python scripts/conformance/warehouse_leg.py up --engine "$PROVISA_ENGINE" \
            --state "$RUNNER_TEMP/warehouse" --env-file "$GITHUB_ENV"

      - name: Seed the table column calls read
        id: seed
        run: |
          .venv/bin/python scripts/conformance/function_support.py seed-columns \
            --pg "host=$CONFORMANCE_PG_HOST port=$CONFORMANCE_PG_PORT dbname=$CONFORMANCE_PG_DATABASE user=$CONFORMANCE_PG_USER password=$CONFORMANCE_PG_PASSWORD" \
            --out "$RUNNER_TEMP/function-columns.yaml"

      - name: Start the Provisa instance
        id: start
        uses: ./.github/actions/conformance-instance
        with:
          extra-tables: ${{ runner.temp }}/function-columns.yaml
          control-plane-url: ${{ matrix.control-plane-url }}
          boot-attempts: ${{ matrix.boot-attempts }}

      - name: Measure every pg_catalog function
        id: measure
        timeout-minutes: 110
        run: |
          mkdir -p "$RUNNER_TEMP/report"
          .venv/bin/python scripts/conformance/function_support.py measure \
            --engine "$PROVISA_ENGINE" \
            --pg "host=$CONFORMANCE_PG_HOST port=$CONFORMANCE_PG_PORT dbname=$CONFORMANCE_PG_DATABASE user=$CONFORMANCE_PG_USER password=$CONFORMANCE_PG_PASSWORD" \
            --provisa "host=127.0.0.1 port=$PROVISA_PGWIRE_PORT dbname=provisa user=$CONFORMANCE_USER password=$CONFORMANCE_PASSWORD sslmode=disable" \
            --out-json "$RUNNER_TEMP/report/function-support-$PROVISA_ENGINE.json" \
            --out-md "$RUNNER_TEMP/report/function-support-$PROVISA_ENGINE.md"

      - name: Summarise
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: |
          cat "$RUNNER_TEMP/report/function-support-$PROVISA_ENGINE.md" >> "$GITHUB_STEP_SUMMARY"
          cp "$RUNNER_TEMP/provisa/server.log" "$RUNNER_TEMP/report/server-$PROVISA_ENGINE.log"

      # Why the leg left no result, which the merge puts on the report beside it: the step that
      # failed and the end of the engine's and the instance's logs.
      - name: Record why the leg failed
        if: ${{ failure() }}
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          mkdir -p "$RUNNER_TEMP/report"
          logs=(--log "$RUNNER_TEMP/provisa/server.log")
          if [ -n "${{ matrix.demo-source }}" ]; then
            bash scripts/conformance/engine_service.sh demo-logs "${{ matrix.demo-source }}" "$RUNNER_TEMP/report/engine-$PROVISA_ENGINE.log"
            logs+=(--log "$RUNNER_TEMP/report/engine-$PROVISA_ENGINE.log")
          elif [ -n "${{ matrix.service }}" ]; then
            bash scripts/conformance/engine_service.sh logs "${{ matrix.service }}" "$RUNNER_TEMP/report/engine-$PROVISA_ENGINE.log"
            logs+=(--log "$RUNNER_TEMP/report/engine-$PROVISA_ENGINE.log")
          fi
          .venv/bin/python scripts/conformance/function_legs.py failure --engine "$PROVISA_ENGINE" \
            --steps "$STEPS" "${logs[@]}" --out "$RUNNER_TEMP/report/leg-failure-$PROVISA_ENGINE.json" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: function-support-${{ matrix.engine }}
          path: ${{ runner.temp }}/report/
          if-no-files-found: warn

      - name: Server log on failure
        if: ${{ failure() }}
        run: tail -n 400 "$RUNNER_TEMP/provisa/server.log" || true

      - name: Stop the Provisa instance
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/provisa/server.pid" ]; then kill "$(cat "$RUNNER_TEMP/provisa/server.pid")" || true; fi
          if [ -d "$RUNNER_TEMP/provisa/control-pg" ]; then .venv/bin/python -m provisa.core.control_plane_pg stop "$RUNNER_TEMP/provisa/control-pg" || true; fi

      # REQ-254: what the leg woke or provisioned is left stopped, suspended, paused or deleted,
      # whatever happened, after the instance that used it is gone; one that does not end so fails
      # the step, as the warehouse lane's own "Leave the ... stopped" steps do. The secrets are
      # those "Bring up the warehouse" gave the job.
      - name: Leave the warehouse stopped
        if: ${{ always() && matrix.lane == 'warehouse' }}
        run: |
          .venv/bin/python scripts/conformance/warehouse_leg.py down --engine "$PROVISA_ENGINE" \
            --state "$RUNNER_TEMP/warehouse" \
            || { echo "::error::the $PROVISA_ENGINE leg's warehouse could not be confirmed stopped: check it, it may be billing"; exit 1; }

  merge:
    name: results by engine
    needs: [plan, probe]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python
        uses: ./.github/actions/setup-python
        with:
          extras: dev

      - uses: actions/download-artifact@v4
        with:
          pattern: function-support-*
          path: ${{ runner.temp }}/legs

      - name: Merge the legs
        run: |
          status=0
          .venv/bin/python scripts/conformance/function_support.py merge \
            --engines "${{ needs.plan.outputs.engines }}" \
            --legs scripts/conformance/function_legs.yaml \
            --in "$RUNNER_TEMP/legs" \
            --out scripts/conformance/function_support.json \
            --out-md "$RUNNER_TEMP/function-support.md" || status=$?
          cat "$RUNNER_TEMP/function-support.md" >> "$GITHUB_STEP_SUMMARY"
          .venv/bin/python scripts/conformance/fill_docs.py scripts/conformance/function_support.json
          exit "$status"

      - name: Upload the data file and the pages
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: function-support
          path: |
            scripts/conformance/function_support.json
            docs/conformance/pgwire.md
            docs/conformance/overview.md
          if-no-files-found: error
