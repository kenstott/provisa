# Release: prebuilt inputs
#
# The Trino plugins, the image tarballs (and the OVA's amd64 set) and the UI dist the installers are built from.
#
# One leg of the release. Called by build-dmg.yml (the release orchestrator) on a tag, and by a
# manual dry run of it. `version` is the release's tag; nothing here reads the pushed ref.
# `publish` is false on a dry run: every artifact is built and uploaded to the RUN exactly as on
# a tag, and every step that leaves the run -- the draft release, its attachments, PyPI, an image
# push, a signed attestation -- is skipped. A failed job of this leg is re-run alone with
# "Re-run failed jobs" on the release's run; the legs it reads from (their artifacts are the
# run's) are not built again.
name: "Release: prebuilt inputs"

on:
  workflow_call:
    inputs:
      version:
        description: The release tag (v0.1.0-alpha.477).
        type: string
        required: true
      publish:
        description: Leave the run (draft release, attachments, PyPI, image pushes). False on a dry run.
        type: boolean
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      obs_images_name: ${{ steps.meta.outputs.obs_images_name }}
      demo_images_name: ${{ steps.meta.outputs.demo_images_name }}
      core_images_name: ${{ steps.meta.outputs.core_images_name }}
      core_images_amd64_name: ${{ steps.meta.outputs.core_images_amd64_name }}
      trino_image_name: ${{ steps.meta.outputs.trino_image_name }}
      trino_image_amd64_name: ${{ steps.meta.outputs.trino_image_amd64_name }}
      plugins_name: ${{ steps.meta.outputs.plugins_name }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        uses: ./.github/actions/release-metadata
        with:
          version: ${{ inputs.version }}

  # ── Calcite plugin download ──────────────────────────────────────────────────

  download-plugins:
    name: Download Calcite Trino plugins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Maven Central rather than a kenstott/calcite GitHub release: that release was deleted
      # out from under CI and every download began 404ing, while Central is immutable once
      # published and serves anonymously (GitHub Packages 401s even for public artifacts). Each
      # jar is shaded and carries its own META-INF/services/io.trino.spi.Plugin, so one jar per
      # directory is a complete plugin. Version pinned to the same coordinates
      # tests/conftest.py::_TRINO_PLUGIN_VERSION and ui-e2e-trino.yml use.
      - name: Download plugins from Maven Central
        run: |
          MAVEN="https://repo1.maven.org/maven2/io/simpleishard"
          VERSION="0.106.3"
          PLUGINS_DIR="trino/plugins"
          # name:version. trino-file (REQ-1960) is at 0.109.0; trino-salesforce (REQ-1946) and
          # trino-cloudops (REQ-1947) are at 0.108.0, the
          # first release with what Provisa needs of them; see tests/conftest.py _TRINO_PLUGIN_VERSIONS.
          for spec in trino-sharepoint:$VERSION trino-splunk:$VERSION trino-file:0.109.0 \
              trino-salesforce:0.108.0 trino-cloudops:0.108.0; do
            plugin="${spec%%:*}"
            version="${spec##*:}"
            mkdir -p "$PLUGINS_DIR/$plugin"
            curl -fsSL "$MAVEN/$plugin/$version/$plugin-$version.jar" \
              -o "$PLUGINS_DIR/$plugin/$plugin-$version.jar"
            ls "$PLUGINS_DIR/$plugin"/*.jar >/dev/null
          done

      # REQ-1494: Provisa's own function plugin (provisa_digest, provisa_fake_method), built from
      # trino-functions/ in a Maven container; the engine's compose mounts it beside the others.
      - name: Build the provisa-functions Trino plugin
        run: scripts/build_trino_functions.sh

      - name: Upload plugin directories
        uses: actions/upload-artifact@v4
        with:
          name: trino-plugins
          path: trino/plugins/
          retention-days: 1
          compression-level: 0

  package-plugins:
    name: Package Trino plugins tarball for release
    runs-on: ubuntu-latest
    needs: [metadata, download-plugins]
    steps:
      - name: Download plugin directories
        uses: actions/download-artifact@v4
        with:
          name: trino-plugins
          path: trino-plugins/

      - name: Package as single tarball
        run: |
          tar -czf "${{ needs.metadata.outputs.plugins_name }}" -C trino-plugins/ .

      - name: Upload plugins tarball
        uses: actions/upload-artifact@v4
        with:
          name: plugins-tarball
          path: "${{ needs.metadata.outputs.plugins_name }}"
          retention-days: 1
          compression-level: 0

  # ── Image pull jobs (one per layer) ─────────────────────────────────────────

  pull-images-core:
    name: Pull core Docker images (arm64)
    runs-on: ubuntu-latest
    # metadata is needed for the versioned trino_image_name the save step writes.
    needs: [metadata]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # The provisa/provisa:local image serves the React SPA from static/ (Dockerfile
      # COPY static/ ./static/). A clean checkout ships static/ empty, so without this
      # step the provisa-ui container returns 503 "UI not bundled". Build the SPA into
      # static/ before docker build. Mirrors the wheel job's UI toolchain.
      - name: Set up Python (mkdocs)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node 20 (vite build)
        uses: ./.github/actions/setup-ui
        with:
          node-version: "20"

      - name: Install docs-site build deps (mkdocs)
        uses: ./.github/actions/docs-site-deps

      - name: Build UI SPA into static/
        run: |
          ( cd provisa-ui && npm run build )
          cp -r provisa-ui/dist/. static/

      - name: Pull core images and build zaychik
        run: |
          # pipefail: a failed `docker save` piped into gzip otherwise ships a truncated image.
          set -o pipefail
          mkdir -p images trino-image
          for img in \
            "python:3.12-slim" \
            "postgres:16" \
            "edoburu/pgbouncer:latest" \
            "redis:7-alpine" \
            "busybox:latest"; do
            tag="${img##*/}"
            tag="${tag//:/-}"
            tag="${tag//\//-}"
            docker pull --platform linux/arm64 "$img"
            docker save "$img" | gzip -9 > "images/${tag}.tar.gz"
          done
          # Trino ships as its own release asset (see metadata trino_image_name): inside the
          # bundle its ~1 GiB pushed the archive past GitHub's 2 GiB per-asset limit. The asset
          # wraps the docker-save tarball in an outer tar so every consumer's extract step
          # (tar -xzf / unzip into a staging dir of *.tar.gz) keeps working unchanged.
          docker pull --platform linux/arm64 trinodb/trino:481
          mkdir -p trino-inner
          docker save trinodb/trino:481 | gzip -9 > trino-inner/trino-481.tar.gz
          tar -czf "trino-image/${{ needs.metadata.outputs.trino_image_name }}" -C trino-inner trino-481.tar.gz
          docker build --platform linux/arm64 -t provisa/zaychik:local ./zaychik
          docker save provisa/zaychik:local | gzip -9 > images/zaychik-local.tar.gz
          # App image in the core-images tarball so the Docker tier can docker load it
          # on demand (macOS/arm64) — no in-VM/host build needed.
          docker build --platform linux/arm64 -t provisa/provisa:local .
          docker save provisa/provisa:local | gzip -9 > images/provisa-local.tar.gz

      - name: Build provisa wheels for linux/arm64
        run: |
          mkdir -p provisa-wheels
          docker run --rm --platform linux/arm64 \
            -v "$PWD:/src:ro" \
            -v "$PWD/provisa-wheels:/wheels" \
            python:3.12-slim \
            bash -c "cp -r /src /tmp/build && cd /tmp/build && pip wheel --no-cache-dir --wheel-dir /wheels ."

      - name: Upload core image tarballs
        uses: actions/upload-artifact@v4
        with:
          name: docker-images-core
          path: images/
          retention-days: 1
          compression-level: 0

      - name: Upload trino image tarball
        uses: actions/upload-artifact@v4
        with:
          name: docker-images-trino
          path: trino-image/
          retention-days: 1
          compression-level: 0

      - name: Upload provisa wheels
        uses: actions/upload-artifact@v4
        with:
          name: provisa-wheels
          path: provisa-wheels/
          retention-days: 1
          compression-level: 0

  pull-images-core-amd64:
    name: Pull core Docker images (amd64) for OVA
    runs-on: ubuntu-latest
    # metadata is needed for the versioned trino_image_amd64_name the save step writes.
    needs: [metadata]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The provisa/provisa:local image serves the React SPA from static/ (Dockerfile
      # COPY static/ ./static/). A clean checkout ships static/ empty, so without this
      # step the provisa-ui container returns 503 "UI not bundled". Build the SPA into
      # static/ before docker build. Mirrors the wheel job's UI toolchain.
      - name: Set up Python (mkdocs)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node 20 (vite build)
        uses: ./.github/actions/setup-ui
        with:
          node-version: "20"

      - name: Install docs-site build deps (mkdocs)
        uses: ./.github/actions/docs-site-deps

      - name: Build UI SPA into static/
        run: |
          ( cd provisa-ui && npm run build )
          cp -r provisa-ui/dist/. static/

      - name: Pull core images (amd64), build zaychik and provisa
        run: |
          # pipefail: a failed `docker save` piped into gzip otherwise ships a truncated image.
          set -o pipefail
          mkdir -p images trino-image
          for img in \
            "python:3.12-slim" \
            "postgres:16" \
            "edoburu/pgbouncer:latest" \
            "redis:7-alpine" \
            "busybox:latest"; do
            tag="${img##*/}"
            tag="${tag//:/-}"
            tag="${tag//\//-}"
            docker pull --platform linux/amd64 "$img"
            docker save "$img" | gzip -9 > "images/${tag}.tar.gz"
          done
          # Trino ships as its own release asset (see metadata trino_image_amd64_name): inside
          # the bundle its ~1 GiB pushed the zip past GitHub's 2 GiB per-asset limit. Wrapped in
          # an outer tar so consumers extract it into their *.tar.gz staging dir unchanged.
          docker pull --platform linux/amd64 trinodb/trino:481
          mkdir -p trino-inner
          docker save trinodb/trino:481 | gzip -9 > trino-inner/trino-481.tar.gz
          tar -czf "trino-image/${{ needs.metadata.outputs.trino_image_amd64_name }}" -C trino-inner trino-481.tar.gz
          docker build --platform linux/amd64 -t provisa/zaychik:local ./zaychik
          docker save provisa/zaychik:local | gzip -9 > images/zaychik-local.tar.gz
          docker build --platform linux/amd64 -t provisa/provisa:local .
          docker save provisa/provisa:local | gzip -9 > images/provisa-local.tar.gz

      - name: Upload amd64 core image tarballs
        uses: actions/upload-artifact@v4
        with:
          name: docker-images-core-amd64
          path: images/
          retention-days: 1
          compression-level: 0

      - name: Upload amd64 trino image tarball
        uses: actions/upload-artifact@v4
        with:
          name: docker-images-trino-amd64
          path: trino-image/
          retention-days: 1
          compression-level: 0

  pull-images-obs:
    name: Pull obs Docker images (arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Pull obs images
        run: |
          # pipefail: a failed `docker save` piped into gzip otherwise ships a truncated image.
          set -o pipefail
          mkdir -p images
          for img in \
            "bitnamilegacy/minio:latest" \
            "ghcr.io/smithclay/otlp2parquet:latest" \
            "otel/opentelemetry-collector-contrib:0.99.0" \
            "prom/prometheus:v2.51.2" \
            "grafana/tempo:2.4.1" \
            "grafana/grafana:10.4.2"; do
            tag="${img##*/}"
            tag="${tag//:/-}"
            tag="${tag//\//-}"
            docker pull --platform linux/arm64 "$img"
            docker save "$img" | gzip -9 > "images/${tag}.tar.gz"
          done

      - name: Upload obs image tarballs
        uses: actions/upload-artifact@v4
        with:
          name: docker-images-obs
          path: images/
          retention-days: 1
          compression-level: 0

  pull-images-demo:
    name: Pull demo Docker images (arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build demo images (all Python — no Java petstore)
        run: |
          # pipefail: a failed `docker save` piped into gzip otherwise ships a truncated image.
          set -o pipefail
          mkdir -p images
          docker build --platform linux/arm64 -t provisa/petstore-demo:local ./demo/petstore_server
          docker save provisa/petstore-demo:local | gzip -9 > images/petstore-demo-local.tar.gz
          docker build --platform linux/arm64 -t provisa/graphql-demo:local ./demo/graphql_server
          docker save provisa/graphql-demo:local | gzip -9 > images/graphql-demo-local.tar.gz

      - name: Upload demo image tarballs
        uses: actions/upload-artifact@v4
        with:
          name: docker-images-demo
          path: images/
          retention-days: 1
          compression-level: 0

  # ── Windows build jobs ───────────────────────────────────────────────────────

  build-ui-dist:
    name: Build provisa-ui dist (Linux, for Windows native tier)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: ./.github/actions/setup-ui

      - name: Set up Python (offline docs site)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MkDocs (offline docs site)
        uses: ./.github/actions/docs-site-deps

      - name: Build provisa-ui
        run: |
          cd provisa-ui
          npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: provisa-ui-dist
          path: provisa-ui/dist/
          retention-days: 1

  # ── Package extension image tarballs (Option A) ─────────────────────────────

  package-obs-images:
    name: Package obs image tarballs for release
    runs-on: ubuntu-latest
    needs: [metadata, pull-images-obs]
    steps:
      - name: Download obs image tarballs
        uses: actions/download-artifact@v4
        with:
          name: docker-images-obs
          path: obs-images/

      - name: Package as single tarball
        run: |
          tar -czf "${{ needs.metadata.outputs.obs_images_name }}" -C obs-images/ .

      - name: Upload obs images tarball
        uses: actions/upload-artifact@v4
        with:
          name: obs-images-tarball
          path: "${{ needs.metadata.outputs.obs_images_name }}"
          retention-days: 1
          compression-level: 0

  package-demo-images:
    name: Package demo image tarballs for release
    runs-on: ubuntu-latest
    needs: [metadata, pull-images-demo]
    steps:
      - name: Download demo image tarballs
        uses: actions/download-artifact@v4
        with:
          name: docker-images-demo
          path: demo-images/

      - name: Package as single tarball
        run: |
          tar -czf "${{ needs.metadata.outputs.demo_images_name }}" -C demo-images/ .

      - name: Upload demo images tarball
        uses: actions/upload-artifact@v4
        with:
          name: demo-images-tarball
          path: "${{ needs.metadata.outputs.demo_images_name }}"
          retention-days: 1
          compression-level: 0

  package-core-images:
    name: Package core image tarballs for release
    runs-on: ubuntu-latest
    needs: [metadata, pull-images-core]
    steps:
      - name: Download core image tarballs
        uses: actions/download-artifact@v4
        with:
          name: docker-images-core
          path: core-images/

      - name: Package as single tarball
        run: |
          tar -czf "${{ needs.metadata.outputs.core_images_name }}" -C core-images/ .

      - name: Upload core images tarball
        uses: actions/upload-artifact@v4
        with:
          name: core-images-tarball
          path: "${{ needs.metadata.outputs.core_images_name }}"
          retention-days: 1
          compression-level: 0

  package-core-images-amd64:
    name: Package amd64 core image tarballs for Windows release
    runs-on: ubuntu-latest
    needs: [metadata, pull-images-core-amd64]
    steps:
      - name: Download amd64 core image tarballs
        uses: actions/download-artifact@v4
        with:
          name: docker-images-core-amd64
          path: core-images-amd64/

      - name: Package as zip (tarballs already compressed — store only)
        run: |
          cd core-images-amd64
          zip -0 "../${{ needs.metadata.outputs.core_images_amd64_name }}" *.tar.gz

      - name: Upload amd64 core images zip
        uses: actions/upload-artifact@v4
        with:
          name: core-images-amd64-tarball
          path: "${{ needs.metadata.outputs.core_images_amd64_name }}"
          retention-days: 1
          compression-level: 0
