# Release: prebuilt inputs
#
# The Trino plugins, the image tarballs (and the OVA's amd64 set) and the UI dist the installers are built from.
#
# One leg of the release. Called by build-dmg.yml (the release orchestrator) on a tag, and by a
# manual dry run of it. `version` is the release's tag; nothing here reads the pushed ref.
# `publish` is false on a dry run: every artifact is built and uploaded to the RUN, and every
# step that leaves the run -- the draft release, its attachments, PyPI, an image push, a signed
# attestation -- is skipped. On a release each job attaches the assets it built straight to the
# draft (.github/actions/attach-release-assets) instead of uploading them to the run, unless
# another job of the run reads them. A failed job of this leg is re-run alone with
# "Re-run failed jobs" on the release's run; the legs it reads from (their artifacts are the
# run's) are not built again.
name: "Release: prebuilt inputs"

on:
  workflow_call:
    inputs:
      version:
        description: The release tag (v0.1.0-alpha.477).
        type: string
        required: true
      publish:
        description: Leave the run (draft release, attachments, PyPI, image pushes). False on a dry run.
        type: boolean
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      obs_images_name: ${{ steps.meta.outputs.obs_images_name }}
      demo_images_name: ${{ steps.meta.outputs.demo_images_name }}
      core_images_manifest_name: ${{ steps.meta.outputs.core_images_manifest_name }}
      core_images_amd64_manifest_name: ${{ steps.meta.outputs.core_images_amd64_manifest_name }}
      trino_image_name: ${{ steps.meta.outputs.trino_image_name }}
      trino_image_amd64_name: ${{ steps.meta.outputs.trino_image_amd64_name }}
      plugins_name: ${{ steps.meta.outputs.plugins_name }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        uses: ./.github/actions/release-metadata
        with:
          version: ${{ inputs.version }}

  # ── Calcite plugin download ──────────────────────────────────────────────────

  download-plugins:
    name: Download Calcite Trino plugins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The pinned jars (tests/trino_plugins.py: versions and sha256s), the same ones every test
      # lane mounts: this job primes their cache, a hit or one checksum-verified fetch from Maven
      # Central (.github/actions/trino-plugins). Each jar is shaded and carries its own
      # META-INF/services/io.trino.spi.Plugin, so one jar per directory is a complete plugin. The
      # same action restores (or, on a miss, builds once) Provisa's own function plugin
      # (REQ-1494), provisa-functions, beside them.
      # The action's prime phase uploads the verified plugin directories as the run's
      # `trino-plugins` artifact, which package-plugins and the installer legs download. A second
      # upload of that name here was refused with HTTP 409 (run 45024448489).
      - name: Trino plugins
        uses: ./.github/actions/trino-plugins
        with:
          phase: prime
          # The prime phase uploads the verified plugins as this run's `trino-plugins` artifact,
          # which package-plugins downloads. A second upload under that name here was a 409.

  package-plugins:
    name: Package Trino plugins tarball for release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attaches what it builds to the draft release
    needs: [metadata, download-plugins]
    steps:
      # The attach action and the tag's notes page (ensure-release's body), first: a checkout
      # empties the workspace.
      - name: Checkout
        if: inputs.publish
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/actions
            docs/releases

      - name: Download plugin directories
        uses: actions/download-artifact@v4
        with:
          name: trino-plugins
          path: trino-plugins/

      - name: Package as single tarball
        run: |
          tar -czf "${{ needs.metadata.outputs.plugins_name }}" -C trino-plugins/ .

      # A dry run keeps it in the run (its only home: nothing is attached); a release attaches it
      # to the draft directly, never through an artifact.
      - name: Upload plugins tarball
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: plugins-tarball
          path: "${{ needs.metadata.outputs.plugins_name }}"
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Attach the plugins tarball to the draft release
        if: inputs.publish
        uses: ./.github/actions/attach-release-assets
        with:
          tag: ${{ inputs.version }}
          files: "${{ needs.metadata.outputs.plugins_name }}"

  # ── DuckDB extension wheels ─────────────────────────────────────────────────

  # REQ-294: the app image stages provisa-duckdb-ext's wheels at build time. The Pages index holds
  # them only after publish, and the images are built before it: a dry run publishes nothing (run
  # 45030695628: pip found none) and a release has not published yet. So both image builds take the
  # wheels this job builds in the same run, its provisa-duckdb-ext-wheels artifact. It never
  # attaches anything: "Release: cut" dispatches the attaching run on the tag.
  duckdb-extensions:
    name: DuckDB extension wheels
    permissions:
      contents: write   # the called workflow's declared default; nothing is attached (publish: false)
    uses: ./.github/workflows/build-duckdb-extensions.yml
    with:
      publish: false

  # ── Image pull jobs (one per layer) ─────────────────────────────────────────

  pull-images-core:
    name: Pull core Docker images (arm64)
    # A native arm64 runner, not QEMU on an x86 one: under emulation this job took 54 min to
    # 2 h 10 min (alpha.512-513) and the app image's `vite build` sat in "rendering chunks" for
    # 2.5 h until the run was cancelled (alpha.514, job 140926997608); release 513's dry run hung
    # 4 h+ in it. The amd64 twin, native, takes 17-29 min with the same steps.
    runs-on: ubuntu-24.04-arm
    # Twice the native twin's slowest measured run: a stall fails this job by name, not the run.
    timeout-minutes: 60
    permissions:
      contents: write   # attaches what it builds to the draft release
    # metadata is needed for the versioned trino_image_name the save step writes.
    needs: [metadata, duckdb-extensions]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # REQ-2225: the platform connector block of this run (release-platform-connectors.yml)
      # over the checkout's, before anything is packaged.
      - name: Platform connector block
        uses: actions/download-artifact@v4
        with:
          name: platform-connectors
          path: provisa/core

      # The app image's build and the saved images need more disk than every hosted runner
      # leaves free (an AWS-backed runner ran out mid-build, run 41836852453).
      - name: Free runner disk
        uses: ./.github/actions/free-runner-disk

      # The app image takes Pyodide from this directory, not from its CDN mid-build.
      - name: Pyodide downloads
        uses: ./.github/actions/pyodide-downloads

      # The image takes provisa-duckdb-ext from the wheels this run built (duckdb-extensions), a
      # release's as a dry run's: the image is built before publish writes the Pages index, which
      # then holds no wheels of this release. Outside the checkout, so the image's main build
      # context does not carry it.
      - name: DuckDB extension wheels
        uses: actions/download-artifact@v4
        with:
          name: provisa-duckdb-ext-wheels
          path: ${{ runner.temp }}/duckdb-ext-wheels

      - name: Pull core images and build zaychik
        env:
          DUCKDB_EXT_WHEELS: ${{ runner.temp }}/duckdb-ext-wheels
        run: |
          # pipefail: a failed `docker save` piped into gzip otherwise ships a truncated image.
          # save --platform: under the containerd image store (Docker 29+, ubuntu-26.04 runners) a
          # bare `docker save` exports every platform in the image index, and only the pulled one
          # is local, so it fails with "unable to create manifests file: NotFound: content digest".
          set -o pipefail
          mkdir -p images trino-image
          for img in \
            "python:3.12-slim" \
            "pgvector/pgvector:pg16-trixie@sha256:9cf8b511f0e9a2c209b61430fc139f1ab9c75edbb31fb1751db6617b246a897a" \
            "edoburu/pgbouncer:latest" \
            "redis:7-alpine" \
            "busybox:latest"; do
            # A digest-pinned image is pulled by digest (reproducible) but retagged and saved
            # by its tag: a loaded tarball has no registry digest, and the compose/helm
            # references are by tag, so the loaded image must carry that tag.
            ref="${img%@*}"
            tag="${ref##*/}"
            tag="${tag//:/-}"
            tag="${tag//\//-}"
            docker pull --platform linux/arm64 "$img"
            [ "$ref" = "$img" ] || docker tag "$img" "$ref"
            docker save --platform linux/arm64 "$ref" | gzip -9 > "images/${tag}.tar.gz"
          done
          # Trino ships as its own release asset (see metadata trino_image_name): inside the
          # bundle its ~1 GiB pushed the archive past GitHub's 2 GiB per-asset limit. The asset
          # wraps the docker-save tarball in an outer tar so every consumer's extract step
          # (tar -xzf / unzip into a staging dir of *.tar.gz) keeps working unchanged.
          docker pull --platform linux/arm64 trinodb/trino:481
          mkdir -p trino-inner
          docker save --platform linux/arm64 trinodb/trino:481 | gzip -9 > trino-inner/trino-481.tar.gz
          tar -czf "trino-image/${{ needs.metadata.outputs.trino_image_name }}" -C trino-inner trino-481.tar.gz
          docker build --platform linux/arm64 -t provisa/zaychik:local ./zaychik
          docker save --platform linux/arm64 provisa/zaychik:local | gzip -9 > images/zaychik-local.tar.gz
          # App image in the core-images tarball so the Docker tier can docker load it
          # on demand (macOS/arm64) — no in-VM/host build needed.
          docker build --platform linux/arm64 \
            --build-context pyodide-downloads="$PROVISA_NOTEBOOK_DOWNLOADS" \
            --build-context duckdb-ext-wheels="$DUCKDB_EXT_WHEELS" \
            -t provisa/provisa:local .
          docker save --platform linux/arm64 provisa/provisa:local | gzip -9 > images/provisa-local.tar.gz

      # REQ-2071: provisa depends on provisa-notebook, which PyPI does not have until the release
      # publishes it: its wheel is built first and found beside the others. REQ-2194: provisa's own
      # wheel carries its compiled encoders, so it comes from the Dockerfile's provisa-wheel stage
      # (built natively on this arm64 runner) and the rest are collected for it.
      - name: Build provisa wheels for linux/arm64
        run: |
          mkdir -p provisa-wheels
          docker build --platform linux/arm64 --target provisa-wheel \
            --output type=local,dest=provisa-wheel .
          python3 scripts/check-provisa-wheel.py provisa-wheel/provisa-*.whl --tag manylinux_2_28_aarch64
          docker run --rm --platform linux/arm64 \
            -v "$PWD:/src:ro" \
            -v "$PWD/provisa-wheel:/provisa-wheel:ro" \
            -v "$PWD/provisa-wheels:/wheels" \
            -v "$PROVISA_NOTEBOOK_DOWNLOADS:/pyodide-downloads" \
            -e PROVISA_NOTEBOOK_DOWNLOADS=/pyodide-downloads \
            python:3.12-slim \
            bash -c "cp -r /src /tmp/build && cd /tmp/build && pip install -q build \
              && (cd provisa-notebook && python -m provisa_notebook.build > /dev/null) \
              && python -m build --wheel provisa-notebook --outdir /wheels \
              && pip wheel --no-cache-dir --find-links /wheels --wheel-dir /wheels /provisa-wheel/provisa-*.whl \
              && pip install --no-deps --target /tmp/check /wheels/provisa-*.whl \
              && cd /tmp/check && python -c 'import provisa._encoders.pgwire'"

      - name: Upload core image tarballs
        uses: actions/upload-artifact@v4
        with:
          name: docker-images-core
          path: images/
          retention-days: 1
          compression-level: 0

      # A dry run keeps it in the run (its only home: nothing is attached); a release attaches it
      # to the draft directly, never through an artifact.
      # GitHub refuses a release asset of 2 GiB or more; a dry run fails here as a release would.
      - name: Check the trino image tarball is under 2 GiB
        uses: ./.github/actions/check-release-asset-size
        with:
          files: "trino-image/${{ needs.metadata.outputs.trino_image_name }}"

      - name: Upload trino image tarball
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: docker-images-trino
          path: trino-image/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Attach the trino image tarball to the draft release
        if: inputs.publish
        uses: ./.github/actions/attach-release-assets
        with:
          tag: ${{ inputs.version }}
          files: "trino-image/${{ needs.metadata.outputs.trino_image_name }}"

      - name: Upload provisa wheels
        uses: actions/upload-artifact@v4
        with:
          name: provisa-wheels
          path: provisa-wheels/
          retention-days: 1
          compression-level: 0

  pull-images-core-amd64:
    name: Pull core Docker images (amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attaches what it builds to the draft release
    # metadata is needed for the versioned trino_image_amd64_name the save step writes.
    needs: [metadata, duckdb-extensions]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # REQ-2225: the platform connector block of this run (release-platform-connectors.yml)
      # over the checkout's, before anything is packaged.
      - name: Platform connector block
        uses: actions/download-artifact@v4
        with:
          name: platform-connectors
          path: provisa/core

      # The app image's build and the saved images need more disk than every hosted runner
      # leaves free (an AWS-backed runner ran out mid-build, run 41836852453).
      - name: Free runner disk
        uses: ./.github/actions/free-runner-disk

      # The app image takes Pyodide from this directory, not from its CDN mid-build.
      - name: Pyodide downloads
        uses: ./.github/actions/pyodide-downloads

      # The image takes provisa-duckdb-ext from the wheels this run built (duckdb-extensions), a
      # release's as a dry run's: the image is built before publish writes the Pages index, which
      # then holds no wheels of this release. Outside the checkout, so the image's main build
      # context does not carry it.
      - name: DuckDB extension wheels
        uses: actions/download-artifact@v4
        with:
          name: provisa-duckdb-ext-wheels
          path: ${{ runner.temp }}/duckdb-ext-wheels

      - name: Pull core images (amd64), build zaychik and provisa
        env:
          DUCKDB_EXT_WHEELS: ${{ runner.temp }}/duckdb-ext-wheels
        run: |
          # pipefail: a failed `docker save` piped into gzip otherwise ships a truncated image.
          # save --platform: under the containerd image store (Docker 29+, ubuntu-26.04 runners) a
          # bare `docker save` exports every platform in the image index, and only the pulled one
          # is local, so it fails with "unable to create manifests file: NotFound: content digest".
          set -o pipefail
          mkdir -p images trino-image
          for img in \
            "python:3.12-slim" \
            "pgvector/pgvector:pg16-trixie@sha256:9cf8b511f0e9a2c209b61430fc139f1ab9c75edbb31fb1751db6617b246a897a" \
            "edoburu/pgbouncer:latest" \
            "redis:7-alpine" \
            "busybox:latest"; do
            # A digest-pinned image is pulled by digest (reproducible) but retagged and saved
            # by its tag: a loaded tarball has no registry digest, and the compose/helm
            # references are by tag, so the loaded image must carry that tag.
            ref="${img%@*}"
            tag="${ref##*/}"
            tag="${tag//:/-}"
            tag="${tag//\//-}"
            docker pull --platform linux/amd64 "$img"
            [ "$ref" = "$img" ] || docker tag "$img" "$ref"
            docker save --platform linux/amd64 "$ref" | gzip -9 > "images/${tag}.tar.gz"
          done
          # Trino ships as its own release asset (see metadata trino_image_amd64_name): inside
          # the bundle its ~1 GiB pushed the zip past GitHub's 2 GiB per-asset limit. Wrapped in
          # an outer tar so consumers extract it into their *.tar.gz staging dir unchanged.
          docker pull --platform linux/amd64 trinodb/trino:481
          mkdir -p trino-inner
          docker save --platform linux/amd64 trinodb/trino:481 | gzip -9 > trino-inner/trino-481.tar.gz
          tar -czf "trino-image/${{ needs.metadata.outputs.trino_image_amd64_name }}" -C trino-inner trino-481.tar.gz
          docker build --platform linux/amd64 -t provisa/zaychik:local ./zaychik
          docker save --platform linux/amd64 provisa/zaychik:local | gzip -9 > images/zaychik-local.tar.gz
          docker build --platform linux/amd64 \
            --build-context pyodide-downloads="$PROVISA_NOTEBOOK_DOWNLOADS" \
            --build-context duckdb-ext-wheels="$DUCKDB_EXT_WHEELS" \
            -t provisa/provisa:local .
          docker save --platform linux/amd64 provisa/provisa:local | gzip -9 > images/provisa-local.tar.gz

      - name: Upload amd64 core image tarballs
        uses: actions/upload-artifact@v4
        with:
          name: docker-images-core-amd64
          path: images/
          retention-days: 1
          compression-level: 0

      # A dry run keeps it in the run (its only home: nothing is attached); a release attaches it
      # to the draft directly, never through an artifact.
      # GitHub refuses a release asset of 2 GiB or more; a dry run fails here as a release would.
      - name: Check the amd64 trino image tarball is under 2 GiB
        uses: ./.github/actions/check-release-asset-size
        with:
          files: "trino-image/${{ needs.metadata.outputs.trino_image_amd64_name }}"

      - name: Upload amd64 trino image tarball
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: docker-images-trino-amd64
          path: trino-image/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Attach the amd64 trino image tarball to the draft release
        if: inputs.publish
        uses: ./.github/actions/attach-release-assets
        with:
          tag: ${{ inputs.version }}
          files: "trino-image/${{ needs.metadata.outputs.trino_image_amd64_name }}"

  pull-images-obs:
    name: Pull obs Docker images (arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Pull obs images
        run: |
          # pipefail: a failed `docker save` piped into gzip otherwise ships a truncated image.
          # save --platform: under the containerd image store (Docker 29+, ubuntu-26.04 runners) a
          # bare `docker save` exports every platform in the image index, and only the pulled one
          # is local, so it fails with "unable to create manifests file: NotFound: content digest".
          set -o pipefail
          mkdir -p images
          for img in \
            "bitnamilegacy/minio:latest" \
            "ghcr.io/smithclay/otlp2parquet:0.12.0" \
            "otel/opentelemetry-collector-contrib:0.99.0" \
            "prom/prometheus:v2.51.2" \
            "grafana/tempo:2.4.1" \
            "grafana/grafana:10.4.2"; do
            tag="${img##*/}"
            tag="${tag//:/-}"
            tag="${tag//\//-}"
            docker pull --platform linux/arm64 "$img"
            docker save --platform linux/arm64 "$img" | gzip -9 > "images/${tag}.tar.gz"
          done

      - name: Upload obs image tarballs
        uses: actions/upload-artifact@v4
        with:
          name: docker-images-obs
          path: images/
          retention-days: 1
          compression-level: 0

  pull-images-demo:
    name: Pull demo Docker images (arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build demo images (all Python — no Java petstore)
        run: |
          # pipefail: a failed `docker save` piped into gzip otherwise ships a truncated image.
          # save --platform: under the containerd image store (Docker 29+, ubuntu-26.04 runners) a
          # bare `docker save` exports every platform in the image index, and only the pulled one
          # is local, so it fails with "unable to create manifests file: NotFound: content digest".
          set -o pipefail
          mkdir -p images
          docker build --platform linux/arm64 -t provisa/petstore-demo:local ./demo/petstore_server
          docker save --platform linux/arm64 provisa/petstore-demo:local | gzip -9 > images/petstore-demo-local.tar.gz
          docker build --platform linux/arm64 -t provisa/graphql-demo:local ./demo/graphql_server
          docker save --platform linux/arm64 provisa/graphql-demo:local | gzip -9 > images/graphql-demo-local.tar.gz

      - name: Upload demo image tarballs
        uses: actions/upload-artifact@v4
        with:
          name: docker-images-demo
          path: images/
          retention-days: 1
          compression-level: 0

  # ── Windows build jobs ───────────────────────────────────────────────────────

  build-ui-dist:
    name: Build provisa-ui dist (Linux, for Windows native tier)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: ./.github/actions/setup-ui

      - name: Set up Python (offline docs site)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MkDocs (offline docs site)
        uses: ./.github/actions/docs-site-deps

      - name: Build provisa-ui
        run: |
          cd provisa-ui
          npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: provisa-ui-dist
          path: provisa-ui/dist/
          retention-days: 1

  # ── Package extension image tarballs (Option A) ─────────────────────────────

  package-obs-images:
    name: Package obs image tarballs for release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attaches what it builds to the draft release
    needs: [metadata, pull-images-obs]
    steps:
      # The attach action and the tag's notes page (ensure-release's body), first: a checkout
      # empties the workspace.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/actions
            docs/releases

      - name: Download obs image tarballs
        uses: actions/download-artifact@v4
        with:
          name: docker-images-obs
          path: obs-images/

      - name: Package as single tarball
        run: |
          tar -czf "${{ needs.metadata.outputs.obs_images_name }}" -C obs-images/ .

      # GitHub refuses a release asset of 2 GiB or more; a dry run fails here as a release would.
      - name: Check the obs images tarball is under 2 GiB
        uses: ./.github/actions/check-release-asset-size
        with:
          files: "${{ needs.metadata.outputs.obs_images_name }}"

      # A dry run keeps it in the run (its only home: nothing is attached); a release attaches it
      # to the draft directly, never through an artifact.
      - name: Upload obs images tarball
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: obs-images-tarball
          path: "${{ needs.metadata.outputs.obs_images_name }}"
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Attach the obs images tarball to the draft release
        if: inputs.publish
        uses: ./.github/actions/attach-release-assets
        with:
          tag: ${{ inputs.version }}
          files: "${{ needs.metadata.outputs.obs_images_name }}"

  package-demo-images:
    name: Package demo image tarballs for release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attaches what it builds to the draft release
    needs: [metadata, pull-images-demo]
    steps:
      # The attach action and the tag's notes page (ensure-release's body), first: a checkout
      # empties the workspace.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/actions
            docs/releases

      - name: Download demo image tarballs
        uses: actions/download-artifact@v4
        with:
          name: docker-images-demo
          path: demo-images/

      - name: Package as single tarball
        run: |
          tar -czf "${{ needs.metadata.outputs.demo_images_name }}" -C demo-images/ .

      # GitHub refuses a release asset of 2 GiB or more; a dry run fails here as a release would.
      - name: Check the demo images tarball is under 2 GiB
        uses: ./.github/actions/check-release-asset-size
        with:
          files: "${{ needs.metadata.outputs.demo_images_name }}"

      # A dry run keeps it in the run (its only home: nothing is attached); a release attaches it
      # to the draft directly, never through an artifact.
      - name: Upload demo images tarball
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: demo-images-tarball
          path: "${{ needs.metadata.outputs.demo_images_name }}"
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Attach the demo images tarball to the draft release
        if: inputs.publish
        uses: ./.github/actions/attach-release-assets
        with:
          tag: ${{ inputs.version }}
          files: "${{ needs.metadata.outputs.demo_images_name }}"

  package-core-images:
    name: Package core image assets for release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attaches what it builds to the draft release
    needs: [metadata, pull-images-core]
    steps:
      # The packaging scripts, the attach action and the tag's notes page (ensure-release's body),
      # first: a checkout empties the workspace.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/actions
            docs/releases
            scripts/ci

      - name: Download core image tarballs
        uses: actions/download-artifact@v4
        with:
          name: docker-images-core
          path: core-images/

      # One asset per image, an image of 1 GiB or more as numbered parts, and the manifest that
      # lists them: the one archive outgrew GitHub's 2 GiB per-asset limit (alpha.513, run
      # 46058735167). The script fails here when any asset is 2 GiB or more, so a dry run, which
      # uploads nothing to the release, fails as the release would.
      - name: Package as per-image assets under 2 GiB
        run: |
          bash scripts/ci/package_core_images.sh core-images arm64 "${{ inputs.version }}" \
            core-assets-arm64 1073741824
          test -f "core-assets-arm64/${{ needs.metadata.outputs.core_images_manifest_name }}"

      # A dry run keeps them in the run (their only home: nothing is attached); a release attaches
      # them to the draft directly, never through an artifact.
      - name: Upload core image assets
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: core-images-tarball
          path: core-assets-arm64/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Attach the core image assets to the draft release
        if: inputs.publish
        uses: ./.github/actions/attach-release-assets
        with:
          tag: ${{ inputs.version }}
          files: "core-assets-arm64/*"

  package-core-images-amd64:
    name: Package amd64 core image assets for release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attaches what it builds to the draft release
    needs: [metadata, pull-images-core-amd64]
    steps:
      # The packaging scripts, the attach action and the tag's notes page (ensure-release's body),
      # first: a checkout empties the workspace.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/actions
            docs/releases
            scripts/ci

      - name: Download amd64 core image tarballs
        uses: actions/download-artifact@v4
        with:
          name: docker-images-core-amd64
          path: core-images-amd64/

      # One asset per image, an image of 1 GiB or more as numbered parts, and the manifest that
      # lists them: the one archive outgrew GitHub's 2 GiB per-asset limit (alpha.513, run
      # 46058735167). The script fails here when any asset is 2 GiB or more, so a dry run, which
      # uploads nothing to the release, fails as the release would.
      - name: Package as per-image assets under 2 GiB
        run: |
          bash scripts/ci/package_core_images.sh core-images-amd64 amd64 "${{ inputs.version }}" \
            core-assets-amd64 1073741824
          test -f "core-assets-amd64/${{ needs.metadata.outputs.core_images_amd64_manifest_name }}"

      # A dry run keeps them in the run (their only home: nothing is attached); a release attaches
      # them to the draft directly, never through an artifact.
      - name: Upload amd64 core image assets
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: core-images-amd64-tarball
          path: core-assets-amd64/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Attach the amd64 core image assets to the draft release
        if: inputs.publish
        uses: ./.github/actions/attach-release-assets
        with:
          tag: ${{ inputs.version }}
          files: "core-assets-amd64/*"
