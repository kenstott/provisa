name: Conformance (Flight SQL)

# REQ-2167: Provisa's Arrow Flight SQL endpoint against the ADBC driver validation suite
# (github.com/adbc-drivers/validation, Apache-2.0, at a pinned commit; the project tags no
# releases), driven through the ADBC Flight SQL driver (adbc-driver-flightsql, Apache-2.0, pinned),
# both installed in their own virtualenv, never vendored. Provisa is described to the suite in
# scripts/conformance/flightsql/tests/provisa.py: the features it claims, and none of table
# creation, so the suite's queries that build a fixture with DDL are skipped (a Provisa schema is
# its model).
#
# Arrow's own Flight SQL integration scenarios (archery) pair a scripted client with a scripted
# reference server that asserts canned inputs, so they cannot be pointed at a real server.
#
# A failing test is data, written to the job summary and to the artifact conformance-flight-sql.json
# (read by scripts/conformance/fill_docs.py into docs/conformance/flight-sql.md), never a job
# failure. The job fails only when the Provisa instance did not start or no test ran.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit or branch to test (default: the dispatched one)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: conformance-flight-sql-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  flight-sql:
    name: Flight SQL conformance
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      VALIDATION_REPO: https://github.com/adbc-drivers/validation.git
      VALIDATION_SHA: 9f9f441
      ADBC_FLIGHTSQL_VERSION: "1.12.0"
      # The Flight port the instance start step gives (API port + 2).
      PROVISA_FLIGHT_PORT: "8903"
      PROVISA_API_PORT: "8901"
      PROVISA_PGWIRE_PORT: "8906"
      CONFORMANCE_PG_HOST: 127.0.0.1
      CONFORMANCE_PG_PORT: "55432"
      CONFORMANCE_PG_DATABASE: conformance
      CONFORMANCE_PG_USER: postgres
      CONFORMANCE_PG_PASSWORD: conformance
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_PASSWORD: conformance
          POSTGRES_DB: conformance
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python
        uses: ./.github/actions/setup-python
        with:
          extras: dev

      - name: Fetch the ADBC validation suite and Flight SQL driver
        run: |
          git clone --quiet "$VALIDATION_REPO" "$RUNNER_TEMP/validation"
          git -C "$RUNNER_TEMP/validation" checkout --quiet "$VALIDATION_SHA"
          head -n 3 "$RUNNER_TEMP/validation/LICENSE.txt"
          grep -q "Apache License" "$RUNNER_TEMP/validation/LICENSE.txt"
          python3 -m venv "$RUNNER_TEMP/adbc-venv"
          "$RUNNER_TEMP/adbc-venv/bin/pip" install --quiet --upgrade pip
          "$RUNNER_TEMP/adbc-venv/bin/pip" install --quiet "$RUNNER_TEMP/validation" \
            "adbc-driver-flightsql==$ADBC_FLIGHTSQL_VERSION" pytest
          "$RUNNER_TEMP/adbc-venv/bin/pip" show adbc-driver-flightsql | grep -i '^license'

      - name: Seed the PostgreSQL fixture
        run: |
          .venv/bin/python scripts/conformance/pgwire_catalog_types.py seed \
            --pg "host=$CONFORMANCE_PG_HOST port=$CONFORMANCE_PG_PORT dbname=$CONFORMANCE_PG_DATABASE user=$CONFORMANCE_PG_USER password=$CONFORMANCE_PG_PASSWORD"

      # The model, and how it presents the fixture under the names PostgreSQL gives it, so the same
      # statement runs unchanged on both servers:
      #   domain  conformance           -> the pgwire schema `conformance`
      #   source  conformance-pg        -> the PostgreSQL service above (postgresql)
      #   table   types_fixture         -> registered from schema `conformance`, alias types_fixture
      #   columns c_bool .. c_point     -> their own names, each declared with the type
      #                                    registration gives that PostgreSQL type, visible to
      #                                    org_admin; a type registration refuses (inet, money,
      #                                    xml, ...) is left out and named in the type report
      # naming.domain_prefix is false, so the table keeps its own name under the domain's schema.
      # The full model is scripts/conformance/pgwire_catalog_types.py (provisa_config).
      - name: Start the Provisa instance
        id: start
        run: |
          home="$RUNNER_TEMP/provisa"
          mkdir -p "$home"
          .venv/bin/python scripts/conformance/pgwire_catalog_types.py config \
            --out "$home/provisa.yaml" --pg-port "$CONFORMANCE_PG_PORT"
          started=$(.venv/bin/python -m provisa.core.control_plane_pg start "$home/control-pg" --init-sql db/init.sql)
          cp_host=$(sed -n 's/^PG_HOST=//p' <<<"$started")
          cp_port=$(sed -n 's/^PG_PORT=//p' <<<"$started")
          cp_password=$(sed -n 's/^PG_PASSWORD=//p' <<<"$started")
          echo "::add-mask::$cp_password"
          test -n "$cp_host" && test -n "$cp_port" && test -n "$cp_password"
          cp_url="postgresql+psycopg://provisa:$cp_password@/provisa?host=$cp_host&port=$cp_port"
          key=$(python3 -c 'import base64, os; print(base64.b64encode(os.urandom(32)).decode())')
          echo "::add-mask::$key"
          GRPC_PORT=$((PROVISA_API_PORT + 1)) \
          FLIGHT_PORT=$((PROVISA_API_PORT + 2)) \
          PROVISA_BOLT_PORT=$((PROVISA_API_PORT + 3)) \
          PROVISA_MCP_PORT=$((PROVISA_API_PORT + 4)) \
          PROVISA_DATA_DIR="$home" \
          PROVISA_TELEMETRY_DIR="$home/telemetry" \
          PROVISA_CONFIG="$home/provisa.yaml" \
          PROVISA_HOME="$home" \
          PROVISA_LICENSING_SANDBOX_DIR="$home/licensing" \
          PYTHON_KEYRING_BACKEND=tests._memory_keyring.MemoryKeyring \
          PROVISA_ENCRYPTION_KEY="$key" \
          ORG_ID=conformance \
          TENANT_DATABASE_URL="$cp_url" \
          PLATFORM_DATABASE_URL="$cp_url" \
            nohup .venv/bin/uvicorn main:app --host 127.0.0.1 --port "$PROVISA_API_PORT" \
            > "$home/server.log" 2>&1 &
          echo $! > "$home/server.pid"
          for _ in $(seq 1 90); do
            curl -sf "http://127.0.0.1:$PROVISA_API_PORT/health" >/dev/null && break
            sleep 2
          done
          curl -sf "http://127.0.0.1:$PROVISA_API_PORT/health" >/dev/null || { echo "::error::Provisa never answered /health"; tail -n 200 "$home/server.log"; exit 1; }
          # The model, as global-setup.ts bootstraps each backend (PUT /admin/config).
          status=$(curl -s -o "$home/config-response.txt" -w '%{http_code}' --retry 5 --retry-all-errors --retry-delay 3 \
            -X PUT -H 'Content-Type: application/yaml' --data-binary @"$home/provisa.yaml" \
            "http://127.0.0.1:$PROVISA_API_PORT/admin/config")
          if [ "${status:0:1}" != "2" ]; then
            echo "::error::PUT /admin/config answered $status"; cat "$home/config-response.txt"; tail -n 200 "$home/server.log"; exit 1
          fi
          # Warm (REQ-1882's readiness probe): the first statement is not paying for the warm-up.
          for _ in $(seq 1 90); do
            curl -sf "http://127.0.0.1:$PROVISA_API_PORT/ready" >/dev/null && break
            sleep 2
          done
          curl -sf "http://127.0.0.1:$PROVISA_API_PORT/ready" >/dev/null || { echo "::error::Provisa never answered /ready"; tail -n 200 "$home/server.log"; exit 1; }
          for _ in $(seq 1 60); do
            (exec 3<>"/dev/tcp/127.0.0.1/$PROVISA_PGWIRE_PORT") 2>/dev/null && break
            sleep 2
          done
          (exec 3<>"/dev/tcp/127.0.0.1/$PROVISA_PGWIRE_PORT") 2>/dev/null || { echo "::error::pgwire never listened on $PROVISA_PGWIRE_PORT"; tail -n 200 "$home/server.log"; exit 1; }
          echo "Provisa is up: API $PROVISA_API_PORT, pgwire $PROVISA_PGWIRE_PORT"

      - name: Run the validation suite
        continue-on-error: true
        timeout-minutes: 30
        env:
          PROVISA_FLIGHT_URI: grpc://127.0.0.1:${{ env.PROVISA_FLIGHT_PORT }}
          PROVISA_ROLE: org_admin
          PROVISA_FLIGHT_CATALOG: provisa
          PROVISA_FLIGHT_SCHEMA: conformance
        run: |
          for _ in $(seq 1 60); do
            (exec 3<>"/dev/tcp/127.0.0.1/$PROVISA_FLIGHT_PORT") 2>/dev/null && break
            sleep 2
          done
          cd scripts/conformance/flightsql
          "$RUNNER_TEMP/adbc-venv/bin/python" -m pytest -p no:cacheprovider \
            --junitxml="$RUNNER_TEMP/flight-sql-junit.xml" -q

      - name: Summarise
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/report"
          .venv/bin/python scripts/conformance/junit_summary.py "$RUNNER_TEMP/flight-sql-junit.xml" \
            flight-sql "ADBC driver validation suite" "$VALIDATION_SHA" \
            "with adbc-driver-flightsql $ADBC_FLIGHTSQL_VERSION" \
            "$RUNNER_TEMP/report/conformance-flight-sql.json" "$RUNNER_TEMP/report/conformance-flight-sql.md"
          cat "$RUNNER_TEMP/report/conformance-flight-sql.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: ${{ !cancelled() }}
        run: cp "$RUNNER_TEMP/provisa/server.log" "$RUNNER_TEMP/report/" || true

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: conformance-flight-sql
          path: ${{ runner.temp }}/report/
          if-no-files-found: warn

      - name: Server log on failure
        if: ${{ failure() }}
        run: tail -n 400 "$RUNNER_TEMP/provisa/server.log" || true

      - name: Stop the Provisa instance
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/provisa/server.pid" ]; then kill "$(cat "$RUNNER_TEMP/provisa/server.pid")" || true; fi
          if [ -d "$RUNNER_TEMP/provisa/control-pg" ]; then .venv/bin/python -m provisa.core.control_plane_pg stop "$RUNNER_TEMP/provisa/control-pg" || true; fi
