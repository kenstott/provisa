name: Trino plugin cache
description: >-
  The container suite mounts the pinned Trino plugin jars (tests/trino_plugins.py: _TRINO_PLUGINS
  at _TRINO_PLUGIN_VERSION, or at their own in _TRINO_PLUGIN_VERSIONS, each with its sha256). They
  are cached by that pin and Maven Central is asked for them once per pin, by one job.

  `phase: prime` is that job's (or a lone job's): it restores the cache, and on a miss downloads
  every jar (`python3 tests/trino_plugins.py fetch`, each checked against its sha256) and saves
  them at once. `phase: restore` is every parallel lane's, in a job that `needs:` the priming one:
  the cache must hit (a miss fails the step), and each jar is verified before the tests. A lane
  never downloads: release 510's lanes each missed an evicted cache and went to Maven Central
  from inside collection at the same moment, and one was refused with HTTP 429 (run
  44081179966). A missing or mismatched jar fails the verify step by name, before pytest.
inputs:
  phase:
    description: prime | restore
    required: true
  key-prefix:
    description: >-
      Put before the cache key. Empty everywhere but the action's own self-test
      (ci-leaf-check.yml), which round-trips a key of its own and never touches the real one. A
      prefix, not a suffix: a restore that misses its key takes the newest entry the key is a
      prefix of, so a self-test key that extended the real one was restored in its place -- its
      stand-in jars mounted into Trino, which refused the cloudops one and never became healthy
      (run 40005357162).
outputs:
  cache-hit:
    description: Whether the jars came from the cache.
    value: ${{ steps.trino-plugins.outputs.cache-hit }}
  jars:
    description: The jar paths the pin names.
    value: ${{ steps.trino-pin.outputs.jars }}
runs:
  using: composite
  steps:
    - name: Trino plugin phase
      shell: bash
      env:
        PHASE: ${{ inputs.phase }}
      run: |
        if [ "$PHASE" != prime ] && [ "$PHASE" != restore ]; then
          echo "::error::phase must be prime or restore, not '$PHASE'"; exit 1
        fi

    - name: Trino plugin pin
      id: trino-pin
      shell: bash
      run: |
        python3 - >> "$GITHUB_OUTPUT" <<'EOF'
        import ast
        tree = ast.parse(open("tests/trino_plugins.py").read())
        pins = {
            t.id: ast.literal_eval(n.value)
            for n in tree.body if isinstance(n, ast.Assign)
            for t in n.targets if isinstance(t, ast.Name)
            and t.id in ("_TRINO_PLUGIN_VERSION", "_TRINO_PLUGINS", "_TRINO_PLUGIN_VERSIONS")
        }
        # A plugin named in _TRINO_PLUGIN_VERSIONS is fetched at its own version; the cache key
        # carries each of those beside the pin, so moving any one of them is a new cache.
        own = pins["_TRINO_PLUGIN_VERSIONS"]
        versions = {n: own.get(n, pins["_TRINO_PLUGIN_VERSION"]) for n in pins["_TRINO_PLUGINS"]}
        # The key ends "-jars" after the pin, so no pin's key is a prefix of another's.
        print("version=" + "_".join([pins["_TRINO_PLUGIN_VERSION"], *(f"{n}-{own[n]}" for n in sorted(own))]))
        print("jars=" + " ".join(f"trino/plugins/{n}/{n}-{v}.jar" for n, v in versions.items()))
        EOF

    - name: Restore Trino plugins
      id: trino-plugins
      uses: actions/cache/restore@v4
      with:
        path: trino/plugins/trino-*
        key: ${{ inputs.key-prefix }}trino-plugins-${{ steps.trino-pin.outputs.version }}-jars
        # A lane's restore must hit: the priming job it needs saved this key in this run.
        fail-on-cache-miss: ${{ inputs.phase == 'restore' }}

    - name: Download Trino plugins
      if: inputs.phase == 'prime' && steps.trino-plugins.outputs.cache-hit != 'true'
      shell: bash
      run: python3 tests/trino_plugins.py fetch

    - name: Cache Trino plugins
      if: inputs.phase == 'prime' && steps.trino-plugins.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: trino/plugins/trino-*
        key: ${{ inputs.key-prefix }}trino-plugins-${{ steps.trino-pin.outputs.version }}-jars

    - name: Verify Trino plugins
      shell: bash
      run: python3 tests/trino_plugins.py verify

    # REQ-1494: Provisa's own function plugin, built from trino-functions/ by Maven. It is built
    # here, once per change to any input of the build (the Maven project, the portable fake
    # definitions it mounts, and the script that names the Maven image), and every lane restores
    # it. Lanes that each built it on first use asked Maven Central for its Maven plugins at the
    # same moment: core 13/18 got HTTP 429 for maven-compiler-plugin and bench a failed resolution
    # of maven-resources-plugin, both at collection (run 44216356740).
    - name: Restore the provisa-functions plugin
      id: provisa-functions
      uses: actions/cache/restore@v4
      with:
        path: trino/plugins/provisa-functions
        key: ${{ inputs.key-prefix }}provisa-functions-${{ hashFiles('trino-functions/**', 'provisa/fakes/portable/**', 'scripts/build_trino_functions.sh') }}-jar
        fail-on-cache-miss: ${{ inputs.phase == 'restore' }}

    - name: Build the provisa-functions plugin
      if: inputs.phase == 'prime' && steps.provisa-functions.outputs.cache-hit != 'true'
      shell: bash
      run: scripts/build_trino_functions.sh

    - name: Cache the provisa-functions plugin
      if: inputs.phase == 'prime' && steps.provisa-functions.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: trino/plugins/provisa-functions
        key: ${{ inputs.key-prefix }}provisa-functions-${{ hashFiles('trino-functions/**', 'provisa/fakes/portable/**', 'scripts/build_trino_functions.sh') }}-jar

    - name: Verify the provisa-functions plugin
      shell: bash
      run: |
        jar=trino/plugins/provisa-functions/provisa-functions-1.jar
        [ -s "$jar" ] || { echo "::error::$jar is missing after the cache step"; exit 1; }
