name: Install Microsoft ODBC Driver 18 for SQL Server
description: >-
  The runner image does not ship ODBC Driver 18. The SQL Server warehouse replica target
  (provisa/federation/mssql_warehouse_runtime.py), Fabric's SQL endpoint and
  demo/sources/sqlserver/prime.py all connect through it.

  Bounded: core 2/6 once sat in this install for its whole job (run 37690884511). Each transfer
  gives up and is retried, apt waits a bounded time for the lock; the caller bounds the step
  (`timeout-minutes` cannot be set inside a composite action).
runs:
  using: composite
  steps:
    - name: Install Microsoft ODBC Driver 18 for SQL Server
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
        CURL_OPTS: --fail --silent --show-error --location --connect-timeout 20 --max-time 120 --retry 5 --retry-all-errors
        APT_OPTS: -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=300
      run: |
        set -euo pipefail
        curl $CURL_OPTS https://packages.microsoft.com/keys/microsoft.asc \
          | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
        curl $CURL_OPTS "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list" \
          | sudo tee /etc/apt/sources.list.d/mssql-release.list > /dev/null
        sudo apt-get $APT_OPTS update -q
        sudo ACCEPT_EULA=Y DEBIAN_FRONTEND=noninteractive apt-get $APT_OPTS install -y -q msodbcsql18 unixodbc-dev
        odbcinst -q -d -n "ODBC Driver 18 for SQL Server"
