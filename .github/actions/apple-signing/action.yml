name: Import the Apple signing certificate
description: >-
  Import the Developer ID certificate into a build keychain codesign and xcrun may use. With no
  certificate configured the import is skipped and the installer is built unsigned. The
  certificate and its password are passed by the caller: a composite action cannot read secrets.
inputs:
  p12-base64:
    description: The signing certificate (.p12), base64. Empty skips the import.
    default: ""
  p12-password:
    description: The .p12's password.
    default: ""
runs:
  using: composite
  steps:
    - name: Import Apple signing certificate
      shell: bash
      env:
        APPLE_CERT_P12_BASE64: ${{ inputs.p12-base64 }}
        APPLE_CERT_P12_PASSWORD: ${{ inputs.p12-password }}
      run: |
        set -euo pipefail
        if [ -z "$APPLE_CERT_P12_BASE64" ]; then
          echo "No Apple signing certificate configured — skipping import"
          exit 0
        fi
        echo "$APPLE_CERT_P12_BASE64" | base64 --decode > /tmp/signing.p12
        security create-keychain -p "" build.keychain
        security unlock-keychain -p "" build.keychain
        # A new keychain locks itself after 5 idle minutes; the build runs longer than that
        # before it signs, and a locked keychain makes codesign wait for a password forever.
        security set-keychain-settings -lut 21600 build.keychain
        security list-keychains -d user -s build.keychain \
          $(security list-keychains -d user | tr -d '"' | tr '\n' ' ')
        security import /tmp/signing.p12 \
          -k build.keychain \
          -P "$APPLE_CERT_P12_PASSWORD" \
          -T /usr/bin/codesign \
          -T /usr/bin/xcrun
        security set-key-partition-list \
          -S apple-tool:,apple:,codesign: \
          -s -k "" build.keychain
        rm /tmp/signing.p12
        security find-identity -v -p codesigning build.keychain
