name: Boot the NixOS guest
description: >-
  Build a NixOS system (packaging/nixos's `ci` unless asked otherwise) as a QEMU VM, boot it on this runner under KVM, and copy the
  checkout onto its disk at ~/provisa. Afterwards `packaging/nixos/vm-run '<script>'` runs a script
  in the guest, and PROVISA_VM_SSH_CONFIG names the ssh config (host `vm`) for scp.
inputs:
  flake:
    description: "The flake whose system is booted: packaging/nixos, or packaging/nixos/host (a user's host, its provisa input taken from this checkout)"
    default: packaging/nixos
  system:
    description: "Which of the flake's nixosConfigurations to boot. packaging/nixos: ci (the Provisa host), bare (a host without its settings) or prepared (bare plus the settings); packaging/nixos/host: ci"
    default: ci
  user:
    description: "The guest user the workflow logs in as"
    default: provisa
runs:
  using: composite
  steps:
    # The guest's disk (Docker images, two dependency trees) and the system closure need more than
    # the runner image leaves free. None of these toolchains is used by this job.
    - uses: ./.github/actions/free-runner-disk

    # /dev/kvm is root-only on the runner image. Without it QEMU emulates the CPU in software and a
    # lane takes hours, so its absence ends the job here.
    - name: Enable KVM
      shell: bash
      run: |
        set -o pipefail
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        # --settle: the rule is applied by the time the check below reads the device's mode.
        sudo udevadm trigger --name-match=kvm --settle
        ls -l /dev/kvm
        test -w /dev/kvm

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes

    - name: Key for this run
      shell: bash
      run: |
        ssh-keygen -q -t ed25519 -N "" -f "$RUNNER_TEMP/vm_key"
        cp "$RUNNER_TEMP/vm_key.pub" "${{ inputs.flake }}/ci_authorized_key.pub"
        cat > "$RUNNER_TEMP/vm_ssh_config" <<EOF
        Host vm
          HostName 127.0.0.1
          Port 2222
          User ${{ inputs.user }}
          IdentityFile $RUNNER_TEMP/vm_key
          StrictHostKeyChecking no
          UserKnownHostsFile /dev/null
          LogLevel ERROR
          ServerAliveInterval 30
          SendEnv SPLUNKBASE_USERNAME SPLUNKBASE_PASSWORD FREE_ASKAMERICA_KEY
        EOF
        echo "PROVISA_VM_SSH_CONFIG=$RUNNER_TEMP/vm_ssh_config" >> "$GITHUB_ENV"

    # path: takes the directory as it is on disk, the run's key included; a git flake would see
    # only tracked files. A host flake's provisa input is this checkout, in place of GitHub's.
    - name: Build the VM
      shell: bash
      run: |
        provisa=()
        if [ "${{ inputs.flake }}" != packaging/nixos ]; then
          provisa=(--override-input provisa "git+file://$GITHUB_WORKSPACE" --no-write-lock-file)
        fi
        nix build "path:$GITHUB_WORKSPACE/${{ inputs.flake }}#nixosConfigurations.${{ inputs.system }}.config.system.build.vm" \
          "${provisa[@]}" --out-link "$RUNNER_TEMP/vm" --print-build-logs

    - name: Boot
      shell: bash
      env:
        PROVISA_SRC: ${{ github.workspace }}
        NIX_DISK_IMAGE: ${{ runner.temp }}/nixos.qcow2
      run: |
        # run-<hostName>-vm: the one script the build makes.
        nohup "$RUNNER_TEMP"/vm/bin/run-*-vm > "$RUNNER_TEMP/vm-console.log" 2>&1 < /dev/null &
        qemu=$!
        for _ in $(seq 1 60); do
          if ssh -F "$PROVISA_VM_SSH_CONFIG" -o ConnectTimeout=5 vm true 2>/dev/null; then
            ssh -F "$PROVISA_VM_SSH_CONFIG" vm 'nixos-version; nproc; free -g; df -h /'
            exit 0
          fi
          if ! kill -0 "$qemu" 2>/dev/null; then break; fi
          sleep 5
        done
        echo "the guest did not accept ssh"
        tail -n 200 "$RUNNER_TEMP/vm-console.log"
        exit 1

    # cp -r inside the guest reads symlinks via the virtio-9p driver, which returns
    # ELOOP for relative symlinks that traverse multiple directory levels (e.g.
    # demo/named/starthere/files/inquiries.sqlite -> ../../../files/inquiries.sqlite).
    # Archiving from the HOST runner's native FS avoids the 9P readlink() path: tar -c
    # on the host reads symlinks correctly, then pipes the archive over SSH; the guest's
    # tar -x recreates symlinks with symlinkat() without touching /mnt/src again.
    - name: Checkout onto the guest's disk
      shell: bash
      run: |
        set -eo pipefail
        tar -C "$GITHUB_WORKSPACE" -cf - . \
          | ssh -F "$PROVISA_VM_SSH_CONFIG" vm 'mkdir ~/provisa && tar -C ~/provisa -xf -'
