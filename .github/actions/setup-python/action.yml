name: Set up Python (uv)
description: >-
  Install uv and, unless `sync` is false, the project's locked dependencies with the named
  extras. THE one place a job gets its Python environment: a lane that needs another extra
  names it here, so two lanes cannot differ by an install step one of them forgot.
inputs:
  extras:
    description: Space-separated extras for `uv sync` (each becomes `--extra <name>`).
    default: dev
  client:
    description: Also install provisa-client with its dev extra (the container suite's lanes).
    default: "false"
  cache:
    description: Keep uv's download cache between runs, keyed on uv.lock.
    default: "false"
  sync:
    description: Run `uv sync`. False installs uv alone (a job that only calls `uv build`/`uvx`).
    default: "true"
runs:
  using: composite
  steps:
    # uv is pinned to the exact version uv.lock locks (tests/unit/test_ci_workflow_structure.py
    # holds the two equal). Given a range, setup-uv resolves it against the GitHub releases API
    # at run time; that lookup failed silently in 5 s in conformance-functions run 45698279072
    # (functions on mariadb) and the leg ran no test. An exact version makes no API call.
    - name: Install uv
      id: uv
      if: inputs.cache != 'true'
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.13.9"

    - name: Install uv (cached)
      id: uv-cached
      if: inputs.cache == 'true'
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.13.9"
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Name the uv install failure
      if: failure() && (steps.uv.outcome == 'failure' || steps.uv-cached.outcome == 'failure')
      shell: bash
      run: |
        echo "::error title=uv install failed::astral-sh/setup-uv could not install uv 0.13.9 from https://github.com/astral-sh/uv/releases/download/0.13.9/ (release download or runner tool cache); no test ran"
        exit 1

    - name: Install dependencies
      if: inputs.sync == 'true'
      shell: bash
      env:
        EXTRAS: ${{ inputs.extras }}
        CLIENT: ${{ inputs.client }}
      run: |
        set -euo pipefail
        args=()
        for extra in $EXTRAS; do args+=(--extra "$extra"); done
        uv sync --frozen "${args[@]}"
        if [ "$CLIENT" = "true" ]; then
          uv pip install -e "provisa-client/[dev]" -q
        fi

    # REQ-294: the runtime never installs a DuckDB extension, so a checkout stages them first.
    - name: Cache DuckDB extensions
      if: inputs.sync == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.duckdb/extensions
        key: duckdb-ext-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}

    - name: Stage DuckDB extensions
      if: inputs.sync == 'true'
      shell: bash
      run: uv run --no-sync python scripts/stage_duckdb_extensions.py
