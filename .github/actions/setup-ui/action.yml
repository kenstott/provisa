name: Set up the UI toolchain
description: >-
  Node, the UI's locked dependencies (`npm ci` in provisa-ui) and, when asked, Playwright's
  Chromium. THE one place a job gets its UI toolchain.
inputs:
  node-version:
    description: Node major version.
    default: "22"
  install:
    description: >-
      Run `npm ci`. False for a job whose own build script installs (packaging's build-wheel.sh
      and the macOS installer scripts), which needs Node and the npm cache only.
    default: "true"
  graph-render:
    description: >-
      Also `npm ci` in provisa-ui/graph-render, render_graph's renderer (its own locked package).
    default: "false"
  playwright:
    description: >-
      none | chromium. `chromium` installs no system packages: the ubuntu runner image already
      carries Chromium's shared libraries and fonts. `--with-deps` is not offered: it runs a full
      apt update, which fails (apt exit 100) or stalls when an Ubuntu mirror is unreachable.
    default: none
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: |
          provisa-ui/package-lock.json
          provisa-ui/graph-render/package-lock.json

    - name: Install UI deps
      if: inputs.install == 'true'
      shell: bash
      working-directory: provisa-ui
      run: npm ci

    - name: Install the graph renderer's deps
      if: inputs.graph-render == 'true'
      shell: bash
      working-directory: provisa-ui/graph-render
      run: npm ci

    - name: Install Playwright browser
      if: inputs.playwright == 'chromium'
      shell: bash
      working-directory: provisa-ui
      run: npx playwright install chromium
