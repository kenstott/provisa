name: Resolve release metadata
description: >-
  The release's channel, its PEP 440 version and the name of every asset, derived from the
  release tag. THE one place those names are decided: every leg of the release resolves them
  here from the same `version`, so a builder and the job that attaches its output cannot name
  an asset differently.
inputs:
  version:
    description: The release tag (v0.1.0-alpha.477).
    required: true
outputs:
  is_prerelease:
    value: ${{ steps.meta.outputs.is_prerelease }}
  channel:
    value: ${{ steps.meta.outputs.channel }}
  dmg_name:
    value: ${{ steps.meta.outputs.dmg_name }}
  dmg_obs_name:
    value: ${{ steps.meta.outputs.dmg_obs_name }}
  dmg_container_name:
    value: ${{ steps.meta.outputs.dmg_container_name }}
  dmg_demo_name:
    value: ${{ steps.meta.outputs.dmg_demo_name }}
  linux_name:
    value: ${{ steps.meta.outputs.linux_name }}
  windows_name:
    value: ${{ steps.meta.outputs.windows_name }}
  windows_container_name:
    value: ${{ steps.meta.outputs.windows_container_name }}
  jdbc_name:
    value: ${{ steps.meta.outputs.jdbc_name }}
  py_version:
    value: ${{ steps.meta.outputs.py_version }}
  obs_images_name:
    value: ${{ steps.meta.outputs.obs_images_name }}
  demo_images_name:
    value: ${{ steps.meta.outputs.demo_images_name }}
  core_images_name:
    value: ${{ steps.meta.outputs.core_images_name }}
  core_images_amd64_name:
    value: ${{ steps.meta.outputs.core_images_amd64_name }}
  trino_image_name:
    value: ${{ steps.meta.outputs.trino_image_name }}
  trino_image_amd64_name:
    value: ${{ steps.meta.outputs.trino_image_amd64_name }}
  plugins_name:
    value: ${{ steps.meta.outputs.plugins_name }}
runs:
  using: composite
  steps:
    - name: Resolve channel and versions from tag
      id: meta
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        TAG="${VERSION}"
        if [[ "$TAG" =~ -alpha(\.|$) ]]; then
          CHANNEL=alpha
          IS_PRERELEASE=true
        elif [[ "$TAG" =~ -beta(\.|$) ]]; then
          CHANNEL=beta
          IS_PRERELEASE=true
        elif [[ "$TAG" =~ -rc(\.|$) ]]; then
          CHANNEL=rc
          IS_PRERELEASE=true
        else
          CHANNEL=stable
          IS_PRERELEASE=false
        fi
        # PEP 440 version: v0.1.0-alpha.1 → 0.1.0a1
        PY_VERSION=$(echo "$TAG" | sed 's/^v//' \
          | sed 's/-alpha\.\([0-9]*\)/a\1/' \
          | sed 's/-beta\.\([0-9]*\)/b\1/' \
          | sed 's/-rc\.\([0-9]*\)/rc\1/')
        echo "is_prerelease=$IS_PRERELEASE"                              >> "$GITHUB_OUTPUT"
        echo "channel=$CHANNEL"                                          >> "$GITHUB_OUTPUT"
        echo "dmg_name=Provisa-${TAG}-macOS.dmg"                        >> "$GITHUB_OUTPUT"
        echo "dmg_obs_name=Provisa-Obs-${TAG}-macOS.dmg"                >> "$GITHUB_OUTPUT"
        echo "dmg_container_name=Provisa-Container-${TAG}-macOS.dmg"    >> "$GITHUB_OUTPUT"
        echo "dmg_demo_name=Provisa-Demo-${TAG}-macOS.dmg"              >> "$GITHUB_OUTPUT"
        echo "linux_name=Provisa-${TAG}-linux-x86_64.AppImage"          >> "$GITHUB_OUTPUT"
        echo "windows_name=Provisa-${TAG}-windows-x64.exe"              >> "$GITHUB_OUTPUT"
        echo "windows_container_name=Provisa-Container-${TAG}-windows-x64.exe" >> "$GITHUB_OUTPUT"
        echo "jdbc_name=provisa-jdbc-${TAG}.jar"                         >> "$GITHUB_OUTPUT"
        echo "py_version=$PY_VERSION"                                    >> "$GITHUB_OUTPUT"
        echo "obs_images_name=provisa-obs-images-${TAG}.tar.gz"         >> "$GITHUB_OUTPUT"
        echo "demo_images_name=provisa-demo-images-${TAG}.tar.gz"       >> "$GITHUB_OUTPUT"
        echo "core_images_name=provisa-core-images-${TAG}.tar.gz"            >> "$GITHUB_OUTPUT"
        echo "core_images_amd64_name=provisa-core-images-amd64-${TAG}.zip" >> "$GITHUB_OUTPUT"
        # The Trino engine image ships as its own asset: bundled with the rest it pushed the
        # core-images archives past GitHub's 2 GiB per-asset limit (alpha.308-310 failures).
        echo "trino_image_name=provisa-trino-image-${TAG}.tar.gz"          >> "$GITHUB_OUTPUT"
        echo "trino_image_amd64_name=provisa-trino-image-amd64-${TAG}.tar.gz" >> "$GITHUB_OUTPUT"
        echo "plugins_name=provisa-trino-plugins-${TAG}.tar.gz"            >> "$GITHUB_OUTPUT"
