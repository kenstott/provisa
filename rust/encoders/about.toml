# REQ-2194: cargo-about's settings for the licence notices of every crate linked into
# provisa._encoders (scripts/rust-third-party-notices.sh writes provisa/_encoders.THIRD_PARTY_NOTICES).
# The targets are the four platforms provisa's wheels are built for.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "CC0-1.0",
]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Provisa's own crates (publish = false) carry Provisa's licence, not a third party's.
private = { ignore = true }
