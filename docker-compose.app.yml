# Provisa application — overlay onto core.yml.
# Usage: docker compose -f docker-compose.core.yml -f docker-compose.app.yml up
services:
  provisa:
    restart: unless-stopped
    build: .
    ports:
      - "${API_PORT:-8000}:8000"
      - "${FLIGHT_PORT:-8815}:8815"
    volumes:
      - ./demo:/app/demo:ro
    environment:
      PG_HOST: "${CONFIG_DB_HOST:-postgres}"
      PG_PORT: "${CONFIG_DB_PORT:-5432}"
      PG_DATABASE: "${CONFIG_DB_NAME:-provisa}"
      PG_USER: "${CONFIG_DB_USER:-provisa}"
      PG_PASSWORD: "${CONFIG_DB_PASSWORD:-provisa}"
      # Control-plane SQLAlchemy URIs — the single chokepoint that reads the DB
      # connection (REQ-837). PLATFORM_DATABASE_URL has no fallback and the app
      # aborts at startup without it; the tenant default points at localhost, which
      # is wrong inside the container network. Build both from the PG_* vars above so
      # they track the same postgres service (parity with the Helm deployment).
      TENANT_DATABASE_URL: "postgresql+asyncpg://${CONFIG_DB_USER:-provisa}:${CONFIG_DB_PASSWORD:-provisa}@${CONFIG_DB_HOST:-postgres}:${CONFIG_DB_PORT:-5432}/${CONFIG_DB_NAME:-provisa}"
      PLATFORM_DATABASE_URL: "postgresql+asyncpg://${CONFIG_DB_USER:-provisa}:${CONFIG_DB_PASSWORD:-provisa}@${CONFIG_DB_HOST:-postgres}:${CONFIG_DB_PORT:-5432}/${CONFIG_DB_NAME:-provisa}"
      # Federation engine selection (REQ-1407). provisa.env sets PROVISA_ENGINE on the host; without
      # this passthrough the container never sees it and silently falls back to duckdb regardless of
      # the deployment's intended engine pin.
      PROVISA_ENGINE: "${PROVISA_ENGINE:-duckdb}"
      TRINO_HOST: trino
      TRINO_PORT: 8080
      # The Arrow Flight SQL proxy (trino_lifecycle.connect_infra reads ZAYCHIK_HOST/ZAYCHIK_PORT —
      # TRINO_FLIGHT_PORT was never read by anything). Its default `localhost` is the dev layout,
      # where the app runs on the host against core.yml's published port; inside the container network
      # localhost:8480 is the app itself, so a Trino deployment died at startup with
      # "dial tcp [::1]:8480: connect: connection refused". The helm chart already sets both.
      ZAYCHIK_HOST: zaychik
      ZAYCHIK_PORT: 8480
      FLIGHT_PORT: "${FLIGHT_PORT:-8815}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      # Passed through with NO default: the otel-collector service is defined only in
      # docker-compose.observability.yml, so an app-overlay default of
      # http://otel-collector:4317 names a host that does not exist in any deployment that
      # omits that overlay — the SaaS node logged endless "Failed to resolve 'otel-collector'"
      # for /v1/traces, /v1/logs and /v1/metrics. otel_setup.py:287 attaches the OTLP exporter
      # only when the endpoint is set, so unset here means telemetry stays local; whoever
      # actually starts a collector sets the endpoint (scripts/provisa does when the compose
      # set includes an observability overlay).
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:-provisa}"
      # The object store the OTLP parquet lands in, and the one compact_otel_signals reads to
      # build the `signals` Iceberg tables the ops reports query. Unlike the collector endpoint
      # above this is NOT conditional: minio is a core service (docker-compose.core.yml), and
      # minio-init creates ${PROVISA_OTEL_BUCKET} there, so every compose deployment has it.
      # scheduler/jobs.py returns immediately when the keys are unset — that gate says "native
      # tier, no object store", and leaving it unset here made the docker tier claim the same
      # thing: otlp2parquet wrote parquet forever and nothing ever compacted it, so traces,
      # queries, metrics and logs all reported zero rows on a node serving real traffic.
      PROVISA_OTEL_S3_ENDPOINT: "${PROVISA_OTEL_S3_ENDPOINT:-http://minio:9000}"
      PROVISA_OTEL_S3_ACCESS_KEY: "${PROVISA_OTEL_S3_ACCESS_KEY:-minioadmin}"
      PROVISA_OTEL_S3_SECRET_KEY: "${PROVISA_OTEL_S3_SECRET_KEY:-minioadmin}"
      PROVISA_OTEL_BUCKET: "${PROVISA_OTEL_BUCKET:-provisa-otel}"
      # Signed with the request by both the compactor's boto3 client and the Iceberg catalog Trino
      # dials. Cloudflare R2 issues its credentials against region `auto`; omitting the passthrough
      # left both signing for us-east-1 while otlp2parquet (which does read it) signed for auto.
      PROVISA_OTEL_S3_REGION: "${PROVISA_OTEL_S3_REGION:-us-east-1}"
      GRAPHQL_DEMO_ENABLED: "${GRAPHQL_DEMO_ENABLED:-false}"
      GRAPHQL_DEMO_URL: "${GRAPHQL_DEMO_URL:-http://graphql-demo:4000/graphql}"
    depends_on:
      postgres:
        condition: service_healthy
      trino:
        condition: service_healthy

  provisa-ui:
    restart: unless-stopped
    build: .
    command: ["uvicorn", "provisa.ui_server:app", "--host", "0.0.0.0", "--port", "3000"]
    ports:
      - "${UI_PORT:-3000}:3000"
    environment:
      PROVISA_ENGINE: "${PROVISA_ENGINE:-duckdb}"
    depends_on:
      - provisa
