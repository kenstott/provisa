# Provisa application — overlay onto core.yml.
# Usage: docker compose -f docker-compose.core.yml -f docker-compose.app.yml up
services:
  provisa:
    restart: unless-stopped
    # REQ-1443: PROVISA_EXTRAS is the pyproject extra set baked into the image. scripts/provisa
    # exports it from config.yaml's dq_checker. The default omits every checker — soda-core is
    # Elastic License 2.0 and must not ship in the hosted cloud plane's image.
    build:
      context: .
      args:
        PROVISA_EXTRAS: "${PROVISA_EXTRAS:-firebase,vector}"
    # 8 workers on the shared hosted instance: overrides the Dockerfile's default single-worker
    # CMD (that default stays generic — local/demo tiers don't need multiple processes). Safe as
    # of REQ-1900 (gRPC/Bolt/pgwire/MCP port-sharing, and Flight relayed from the one advertised
    # port by every worker, so every auxiliary protocol server is served by all N workers) and
    # REQ-1901 (the embedded-DuckDB materialize store no longer crashes a second worker's
    # readiness probe). This node's PROVISA_ENGINE is trino (preflight_engine enforces it), whose
    # materialize store is Postgres — no analogous multi-connection constraint at all.
    #
    # NOT SET HERE (REQ-1900): PROVISA_LAUNCH_ID + PROVISA_WORKERS. Without a launch id each of
    # the 8 workers does the whole boot under the control-plane boot lock, one after another, and
    # /health reports workers 1/1. Parallel worker boot and the /health roll call need a launch
    # id that is NEW ON EVERY START and shared by the 8 workers of that start — a fixed value in
    # `environment:` would be the same launch after a restart and skip the config apply. It has
    # to be generated by the command itself, e.g.
    #   sh -c 'PROVISA_WORKERS=8 PROVISA_LAUNCH_ID=$(cat /proc/sys/kernel/random/uuid) \
    #          exec uvicorn main:app --host 0.0.0.0 --port 8000 --timeout-keep-alive 620 --workers 8'
    command:
      [
        "uvicorn",
        "main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--timeout-keep-alive",
        "620",
        "--workers",
        "8",
      ]
    ports:
      - "${API_PORT:-8000}:8000"
      - "${FLIGHT_PORT:-8815}:8815"
    volumes:
      - ./demo:/app/demo:ro
      # The engine's tree (its config, its catalogs, the launch-settings file), shared with the
      # engine through the host: what the app renders here is what the engine starts on next.
      - ${PROVISA_TRINO_ETC_HOST:?the engine tree the launcher shares with the app}:/app/trino-host
      # Kafka client properties, which can hold a SASL password: a tmpfs this container and the
      # engine share (trino_kafka_client below), so they never reach a disk.
      - trino_kafka_client:/app/trino-host/kafka-client
      # The data directory, on a named volume: it holds the master key the product mints at the
      # first stored secret (and its other on-disk state). Kept only in the container's own
      # filesystem, the key is lost when the container is replaced (a rebuild, an image
      # update), and the next one cannot open the secrets vault and refuses to start.
      - provisa_data:/var/lib/provisa
      # REQ-1494: Provisa writes the platform fake key here as <fingerprint>.key; the engine
      # (docker-compose.core.yml) mounts the same directory to read it.
      - ${PROVISA_FAKE_KEY_DIR:-./.provisa/fake-key}:/etc/provisa/fake-key
    environment:
      PROVISA_DATA_DIR: /var/lib/provisa
      PROVISA_FAKE_KEY_DIR: /etc/provisa/fake-key  # REQ-1494
      # The deployment's master key, when the operator supplies one (a 32-byte key, base64):
      # it is used ahead of any key in the data directory. Unset, the key in the volume is used.
      PROVISA_ENCRYPTION_KEY: "${PROVISA_ENCRYPTION_KEY:-}"
      PG_HOST: "${CONFIG_DB_HOST:-postgres}"
      PG_PORT: "${CONFIG_DB_PORT:-5432}"
      PG_DATABASE: "${CONFIG_DB_NAME:-provisa}"
      PG_USER: "${CONFIG_DB_USER:-provisa}"
      PG_PASSWORD: "${CONFIG_DB_PASSWORD:?the control-plane database password: the launcher sets it}"
      # Control-plane SQLAlchemy URIs — the single chokepoint that reads the DB
      # connection (REQ-837). PLATFORM_DATABASE_URL has no fallback and the app
      # aborts at startup without it; the tenant default points at localhost, which
      # is wrong inside the container network. Build both from the PG_* vars above so
      # they track the same postgres service (parity with the Helm deployment).
      TENANT_DATABASE_URL: "postgresql+psycopg://${CONFIG_DB_USER:-provisa}:${CONFIG_DB_PASSWORD:?the control-plane database password: the launcher sets it}@${CONFIG_DB_HOST:-postgres}:${CONFIG_DB_PORT:-5432}/${CONFIG_DB_NAME:-provisa}"
      PLATFORM_DATABASE_URL: "postgresql+psycopg://${CONFIG_DB_USER:-provisa}:${CONFIG_DB_PASSWORD:?the control-plane database password: the launcher sets it}@${CONFIG_DB_HOST:-postgres}:${CONFIG_DB_PORT:-5432}/${CONFIG_DB_NAME:-provisa}"
      # Federation engine selection (REQ-1407). provisa.env sets PROVISA_ENGINE on the host; without
      # this passthrough the container never sees it and silently falls back to duckdb regardless of
      # the deployment's intended engine pin.
      PROVISA_ENGINE: "${PROVISA_ENGINE:-duckdb}"
      TRINO_HOST: trino
      PROVISA_TRINO_ETC_DIR: /app/trino-host
      TRINO_PORT: 8080
      # The Arrow Flight SQL proxy (trino_lifecycle.connect_infra reads ZAYCHIK_HOST/ZAYCHIK_PORT —
      # TRINO_FLIGHT_PORT was never read by anything). Its default `localhost` is the dev layout,
      # where the app runs on the host against core.yml's published port; inside the container network
      # localhost:8480 is the app itself, so a Trino deployment died at startup with
      # "dial tcp [::1]:8480: connect: connection refused". The helm chart already sets both.
      ZAYCHIK_HOST: zaychik
      ZAYCHIK_PORT: 8480
      FLIGHT_PORT: "${FLIGHT_PORT:-8815}"
      # core.yml's redis, which requires its password.
      REDIS_URL: "redis://:${PROVISA_REDIS_PASSWORD:?the Redis password, generated by the launcher}@redis:6379"
      # Passed through with NO default: the otel-collector service is defined only in
      # docker-compose.observability.yml, so an app-overlay default of
      # http://otel-collector:4317 names a host that does not exist in any deployment that
      # omits that overlay — the SaaS node logged endless "Failed to resolve 'otel-collector'"
      # for /v1/traces, /v1/logs and /v1/metrics. otel_setup.py:287 attaches the OTLP exporter
      # only when the endpoint is set, so unset here means telemetry stays local; whoever
      # actually starts a collector sets the endpoint (scripts/provisa does when the compose
      # set includes an observability overlay).
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:-provisa}"
      # The object store the OTLP parquet lands in, and the one compact_otel_signals reads to
      # build the `signals` Iceberg tables the ops reports query. Unlike the collector endpoint
      # above this is NOT conditional: minio is a core service (docker-compose.core.yml), and
      # minio-init creates ${PROVISA_OTEL_BUCKET} there, so every compose deployment has it.
      # scheduler/jobs.py returns immediately when the keys are unset — that gate says "native
      # tier, no object store", and leaving it unset here made the docker tier claim the same
      # thing: otlp2parquet wrote parquet forever and nothing ever compacted it, so traces,
      # queries, metrics and logs all reported zero rows on a node serving real traffic.
      PROVISA_OTEL_S3_ENDPOINT: "${PROVISA_OTEL_S3_ENDPOINT:-http://minio:9000}"
      # The launcher sets both: core.yml's minio root account, or an external store's keys.
      PROVISA_OTEL_S3_ACCESS_KEY: "${PROVISA_OTEL_S3_ACCESS_KEY:?the OTel object store access key}"
      PROVISA_OTEL_S3_SECRET_KEY: "${PROVISA_OTEL_S3_SECRET_KEY:?the OTel object store secret key}"
      PROVISA_OTEL_BUCKET: "${PROVISA_OTEL_BUCKET:-provisa-otel}"
      # Signed with the request by both the compactor's boto3 client and the Iceberg catalog Trino
      # dials. Cloudflare R2 issues its credentials against region `auto`; omitting the passthrough
      # left both signing for us-east-1 while otlp2parquet (which does read it) signed for auto.
      PROVISA_OTEL_S3_REGION: "${PROVISA_OTEL_S3_REGION:-us-east-1}"
      GRAPHQL_DEMO_ENABLED: "${GRAPHQL_DEMO_ENABLED:-false}"
      GRAPHQL_DEMO_URL: "${GRAPHQL_DEMO_URL:-http://graphql-demo:4000/graphql}"
    depends_on:
      postgres:
        condition: service_healthy
      trino:
        condition: service_healthy

  # The Kafka client properties an earlier release left in the engine tree's kafka-client directory
  # on disk, removed as the stack starts (docker-compose.core.yml).
  trino-exchange-init:
    environment:
      PROVISA_DEAD_ENGINE_FILES: "/engine-tree/kafka-client/*.properties"

  # The engine reads the Kafka client properties from the tmpfs the app writes them into, in place
  # of core's host directory (compose replaces a volume whose target matches).
  trino:
    volumes:
      - trino_kafka_client:/etc/trino/kafka-client:ro

  trino-worker:
    volumes:
      - trino_kafka_client:/etc/trino/kafka-client:ro

  provisa-ui:
    restart: unless-stopped
    build:
      context: .
      args:
        PROVISA_EXTRAS: "${PROVISA_EXTRAS:-firebase,vector}"
    # --timeout-keep-alive: uvicorn's 5s default closes an idle connection the browser still holds
    # pooled, and a splicing front door passes that close on to the browser, which does not retry a
    # POST — a form open longer than five seconds failed with "Failed to fetch". 620s is above the
    # front door's 300s splice idle timeout, so the proxy closes first.
    command: ["uvicorn", "provisa.ui_server:app", "--host", "0.0.0.0", "--port", "3000", "--timeout-keep-alive", "620"]
    ports:
      - "${UI_PORT:-3000}:3000"
    environment:
      PROVISA_ENGINE: "${PROVISA_ENGINE:-duckdb}"
    depends_on:
      - provisa

volumes:
  # Memory-backed, owned by Trino's user and closed to every other: the Kafka client properties
  # the app writes (provisa/core/trino_catalog_files.py, write_kafka_client_file) and the engine
  # reads. Written again whenever the app registers a Kafka catalog.
  trino_kafka_client:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=1000,gid=1000,mode=0700"
  # The API's data directory (PROVISA_DATA_DIR). `docker compose down -v` removes it, and with
  # it a minted master key — the secrets vault in the control-plane database then cannot be
  # opened. Keep it, or set PROVISA_ENCRYPTION_KEY.
  provisa_data:
