[project]
name = "provisa"
version = "0.1.0"
description = "Provisa is a compiler and runtime for building your data control plane."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    # REQ-1867: uvloop replaces asyncio's default event loop (libuv via Cython) for faster loop
    # scheduling across the whole app, not just one endpoint. No Windows wheels, same platform
    # gate this file already uses for chdb below.
    "uvloop; sys_platform != 'win32'",
    # REQ-1867: uvicorn's HTTP parser. Without httptools uvicorn falls back to h11, a pure-Python
    # parser that runs on the accepting loop for every request (measured: ~10% of a cached
    # GraphQL hit's CPU). uvicorn picks httptools up on its own when it is importable.
    "httptools",
    # REQ-1867: was already resolving transitively (langsmith/trino pull it in) but never
    # declared or actually used anywhere in the app — FastAPI's default response class still used
    # stdlib json. Declared explicitly now that provisa.api.app wires it in as the default.
    "orjson",
    # The response cache's stored-entry encoding (provisa/cache/codec.py, REQ-1896).
    "msgpack",
    # REQ-1915: incremental JSON parsing of a single-document source spooled to a file during a
    # replica build (orjson and jiter parse a whole buffer). The C backend (yajl2_c) is the one used.
    "ijson",
    "asyncpg",
    "pydantic>=2",
    "strawberry-graphql[fastapi]",
    "pyyaml",
    "graphql-core>=3.2.9,<3.3",
    # Bounded to the release the suite runs on: an unbounded pin installed 30.23 into alpha.485's
    # image while every test ran 30.9, and a renamed scope attribute failed every query there.
    "sqlglot>=30.23,<30.24",
    # REQ-2135: the SPARQL front end parses a query with rdflib and lowers its SPARQL algebra to
    # the graph IR. BSD-3-Clause, as are its isodate and pyparsing (MIT).
    "rdflib>=7.1,<8",
    # REQ-1494: the fake methods a column may name, checked when declared and, in the embedded
    # engine, computed seeded by the keyed digest of the value.
    "faker",
    "trino",
    "grpcio",
    "grpcio-tools",
    "grpcio-reflection",
    "grpcio-health-checking",  # REQ-1904: grpc.health.v1 HealthServicer for orchestrator probes
    "pyarrow",
    # One IANA release on every surface: zoneinfo reads the tzdata package (provisa/__init__.py
    # empties its search path), pyarrow reads a zoned timestamp through pytz, and the Rust encoders'
    # tables are built from rust/pgwire/third_party/chrono-tz/tz. All three are 2026f; bump together
    # (rust/pgwire/RESULTS.md, tests/unit/test_tz_agreement.py).
    "tzdata==2026.6",
    "pytz==2026.6",
    "adbc-driver-flightsql",
    "adbc-driver-manager",
    "adbc-driver-postgresql",  # REQ-1220: Arrow-native zero-copy ADBC transport for the pg engine
    "httpx",
    "redis[hiredis]",
    "fakeredis",
    "anthropic",
    # mcp 2.0 removed `mcp.server.fastmcp` (the FastMCP decorator API that
    # provisa/api/mcp/server.py is written against) in favour of
    # mcp.server.mcpserver. Unpinned, the image resolved to 2.0.0 and the MCP
    # endpoint failed to start with ModuleNotFoundError. Hold the 1.x line until
    # the server is ported.
    "mcp>=1.30.0,<2",
    "aisuite>=0.1",
    # REQ-1808: aisuite's own "openai" provider (used for vendor="openai" and for ANY REQ-1790
    # custom AI endpoint, since that's how a custom endpoint's base_url/api_key are actually
    # routed — see chat.py's _resolve_aisuite_routing) lazily imports the openai SDK itself;
    # aisuite does not declare it as a dependency (it ships every provider's import as optional).
    "openai",
    "apscheduler>=3.10",
    "inflect",
    "jsonpath-ng",
    # Reads an OpenAPI or Swagger spec and follows its references (provisa/openapi/mapper.py,
    # REQ-314). From the python-openapi project, over `referencing`. Apache-2.0.
    "jsonschema-path>=0.4,<0.5",
    "PyJWT[crypto]",
    "bcrypt",
    # REQ-1265: the LDAP auth provider's directory client. Pure Python, no native library.
    # LGPL-3.0: imported, never modified or statically linked.
    "ldap3>=2.9,<3",
    # REQ-1265: XML signature verification for the SAML auth provider, over lxml and
    # cryptography. Apache-2.0.
    "signxml>=4,<5",
    "lxml",
    # REQ-2185, REQ-2179: the reference library reads a PDF document by its pages and a Word
    # document by its headings. pypdf: BSD-3-Clause, pure Python. python-docx: MIT, over lxml.
    "pypdf>=6,<7",
    "python-docx>=1.2,<2",
    "motor",
    "elasticsearch>=8,<9",
    # REQ-1982: Azure Cosmos DB for NoSQL, read by its own SDK (no engine has a connector). MIT.
    "azure-cosmos>=4.9,<5",
    # REQ-1983: Qdrant, read by its own client (no engine has a connector). Apache-2.0.
    "qdrant-client>=1.12,<2",
    "aiokafka",
    # REQ-1951: the Avro codec for Debezium topics written against a schema registry (the
    # registry itself is asked over httpx). MIT; self-contained wheels, no native library.
    "fastavro>=1,<2",
    "websockets>=11.0",
    "boto3",
    "cryptography",
    # REQ-1802: OS-keychain-backed master key storage for the local encryption provider. When no
    # OS keychain backend is usable (headless Linux, sandboxed CI, a locked session) the same
    # provider falls back to a file under this host's Provisa data directory — but keyring should
    # be present so the OS-native path is the one actually used wherever one exists.
    "keyring",
    "sqlalchemy>=2",
    "duckdb-engine",
    "clickhouse-connect",
    "clickhouse-driver",
    # chdb (embedded ClickHouse) ships no Windows wheels. The native Windows tier
    # (REQ-979) runs the DuckDB engine, not chdb, so gate it off win32 — the WSL2
    # container tier provides full ClickHouse compute on Windows.
    "chdb; sys_platform != 'win32'",
    "snowflake-connector-python[pandas]",  # REQ-988: Snowflake engine driver (Arrow-native)
    "adbc-driver-snowflake",  # REQ-988: Arrow-native ADBC transport for the Snowflake direct driver
    "snowflake-sqlalchemy",  # REQ-988: SQLAlchemy dialect for the Snowflake SQLAlchemy fallback path
    "databricks-sql-connector",  # REQ-987: Databricks engine driver (Arrow-native Cloud Fetch)
    "google-cloud-bigquery",  # BigQuery engine driver
    "google-cloud-bigquery-storage",  # BigQuery Arrow-native reads (Storage Read API)
    "google-cloud-storage",  # GCS staging for BigQuery external-table links
    "protobuf>=6.33.5,<7",  # keep OTel/gRPC compatible while the google-cloud libs are present
    "grpcio-status<1.82",  # aligns with the pinned protobuf<7
    "pyodbc",  # Azure Synapse / Microsoft Fabric engine driver (T-SQL over TDS/ODBC)
    "azure-identity",  # Azure AD token auth for Fabric/Synapse (uses `az login` / managed identity)
    "impyla",  # REQ-1731: HiveServer2 direct driver (Thrift TCLIService)
    "pyexasol",  # REQ-1731: Exasol direct driver (Exasol's own WebSocket client)
    "pymysql",  # demo/sources/singlestore/prime.py — a plain sync client for a one-shot seed script
    "singlestoredb",  # REQ-990: the SingleStore client — the `singlestoredb://` engine DSN
    # (federation/engine.py _RDB_KINDS) and the store's streaming LOAD DATA LOCAL INFILE bulk path.
    "sqlalchemy-singlestoredb",  # the SQLAlchemy dialect for `singlestoredb://` (separate package)
    "dulwich",  # REQ-1524: the per-org model repository. Pure Python — no git binary on the
    # host (GitPython shells out) and no native build (pygit2 needs libgit2), which REQ-294's
    # airgap-capable distribution cannot carry a compiler for.
    "psycopg2-binary",
    # REQ-052/REQ-1882: the PostgreSQL DIRECT source driver — psycopg 3's extended protocol gives
    # per-connection server-side prepared statements (prepare_threshold) that psycopg2 lacks, and
    # psycopg_pool is its thread-safe shared pool.
    "psycopg[binary]",
    "psycopg-pool",
    "sqlalchemy-redshift",  # REQ-1730: redshift+psycopg2 dialect — generic-RDB land driver
    "pyathena",  # REQ-1981: Amazon Athena source, through its own API (over boto3)
    "opentelemetry-api>=1.45.2",  # CVE-2026-126360 fixed in 1.45.2; the SDK and exporters release in lockstep
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-grpc",
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-httpx",
    "opentelemetry-instrumentation-psycopg",
    "opentelemetry-instrumentation-redis",
    "opentelemetry-instrumentation-pymongo",
    "opentelemetry-instrumentation-grpc",
    # NOTE: the buenavista pgwire engine is a Provisa fork (vendor/buenavista, v0.5.0.post1 — adds
    # binary codecs for DECIMAL/JSON/array types) NOT published to PyPI. It is bundled INTO this
    # distribution as a top-level `buenavista` package (see [tool.setuptools.packages.find] below),
    # not fetched from an index — declaring it as a dependency would pull the wrong upstream package.
    # Its own runtime deps are folded in here instead (sqlglot already present):
    "python-dateutil",
    "duckdb==2.0.0",
    # REQ-1996: a Logs source reads Windows Event Log (.evtx) files, a binary chunked format;
    # pure Python, so nothing is built per platform.
    "python-evtx==0.8.1",
    "networkx>=3.0",
    "scipy",
    # REQ-2090: the MCP stats tools fit their models with statsmodels (the 0.14 line the Python
    # sandboxes' Pyodide ships), over pandas frames.
    "pandas",
    "statsmodels>=0.14.4,<0.15",
    "defusedxml",
    "jpype1",
    "minio",
    "pyiceberg",
    "deltalake",
    "neo4j",
    # REQ-1592: the model report is served as a workbook (GET /admin/report.xlsx). openpyxl was
    # already present transitively (databricks-sql-connector); a first-party surface that writes
    # XLSX cannot depend on another package's dependency graph to keep it there.
    "openpyxl",
    # The native/desktop control plane (REQ-1535) and the dedicated telemetry store are an
    # EMBEDDED PostgreSQL, so `provisa run` cannot start without pgserver — as an optional extra a
    # plain `pip install provisa` died at startup with ModuleNotFoundError: pgserver. pgserver ships
    # cp39-cp312 wheels and no sdist, which is why requires-python caps at <3.13: a 3.13 interpreter
    # must be refused by the RESOLVER with "requires a different Python", never installed and then
    # crashed at first `provisa run`.
    #
    # The marker is the wheel matrix, not a fallback: pgserver publishes linux x86_64, macOS
    # (x86_64 + arm64) and win_amd64 — no linux aarch64. The container tier's arm64 image is built
    # there and does not use the embedded plane (it runs a real PostgreSQL), so it must resolve;
    # `provisa run` on linux/aarch64 aborts with the explanation instead (cli._require_embedded_pg).
    # pixeltable-pgserver: the maintained pgserver fork, PostgreSQL 16.11 (pgserver 0.1.4, last
    # released 2024, ships 16.2, whose backend lacks a symbol pg_duckdb v1.1 needs; REQ-901).
    "pixeltable-pgserver==0.5.1; sys_platform != 'linux' or platform_machine != 'aarch64'",
    "anyio>=4.14.2",
    # REQ-2071: the Data Science area's in-browser Python (Pyodide, its packages, the
    # provisa-client wheel), served by ui_server at /pyodide. A package of its own only because
    # PyPI caps a file at 100 MB; it is part of every install, at this release's own version
    # (the release stamps the pin with the version).
    "provisa-notebook==0.1.0",
]

[project.scripts]
# REQ-1128: single-command launch of the embedded runtime — `provisa run`.
provisa = "provisa.cli:main"

[project.optional-dependencies]
# REQ-1126/REQ-1129: the pip-installable embedded tier. A fully functional, self-contained
# system — embedded PostgreSQL control plane (pgserver, REQ-2014) + embedded DuckDB engine
# + in-memory (fakeredis) cache — ready to `provisa run` immediately. The bundled Trino JVM is
# omitted (PyPI carries no JVM server); full multi-engine query stays available by pointing
# at a customer-provided external engine via TRINO_HOST/TRINO_PORT. duckdb is
# already a base dep; this extra names the tier explicitly and adds fakeredis for the embedded cache.
# The offline DuckDB extension blobs (REQ-1142) are hard deps here: pip install provisa[embedded]
# stages the extensions offline (no extensions.duckdb.org reach on first LOAD), matching
# _stage_duckdb_extensions in cli.py. TEMPORARY for DuckDB 2.0 (REQ-1142 amendment, TEMPORARY
# EXTENSION SOURCES FOR DUCKDB 2.0, maintainer decision 2026-11-06): the core extensions come from the
# third-party per-extension, per-platform wheels duckdb-extension-* (santosh-d3vpl3x/duckdb_extensions,
# MIT; each holds the official signed binary, DuckDB loads it signature-checked), pinned to the DuckDB
# version (avro too: iceberg loads it); provisa-duckdb-ext carries the rest (crypto and airport from Query.Farm, community). Dropped for Provisa's own
# per-extension projects once PyPI is available again.
embedded = [
    "duckdb",
    "fakeredis",
    "duckdb-extension-postgres-scanner==2.0.0",
    "duckdb-extension-httpfs==2.0.0",
    "duckdb-extension-sqlite-scanner==2.0.0",
    "duckdb-extension-iceberg==2.0.0",
    "duckdb-extension-azure==2.0.0",
    "duckdb-extension-delta==2.0.0",
    "duckdb-extension-avro==2.0.0",  # iceberg loads it
    "provisa-duckdb-ext>=0.2.2",  # 0.2.2: Query.Farm's airport
]
# Native/desktop tier: mcp-proxy is the Node-free stdio<->Streamable-HTTP bridge Claude Desktop
# launches to reach the local MCP server (REQ-1104). Bundled into the standalone runtime by the
# native installers (build-sfx.ps1 / build-dmg.sh) so the connector needs no Node and no user pip.
desktop = ["mcp-proxy"]
# Documentation site (MkDocs Material). Build: `mkdocs build`; serve: `mkdocs serve`; deploy: CI (.github/workflows/docs.yml).
docs = ["mkdocs-material", "pymdown-extensions", "mkdocs-static-i18n"]
mysql = ["aiomysql"]
sqlserver = ["aioodbc"]
oracle = ["oracledb"]
# SAP HANA source type: a generic self-only landing engine (build_sqlalchemy_engine, engine.py's
# _RDB_KINDS) reached via the hana+hdbcli SQLAlchemy dialect. hdbcli is SAP's own DBAPI driver;
# sqlalchemy-hana registers the dialect SQLAlchemy needs to speak it.
saphana = ["hdbcli", "sqlalchemy-hana"]
# The other generic self-only landing engines in _RDB_KINDS whose dialect is not a base dep, one extra
# per engine kind (federation/engine.py RDB_EXTRAS names each; selecting a kind without its extra is
# refused naming it). Each pairs the SQLAlchemy dialect with the DBAPI driver it loads.
cockroachdb = ["sqlalchemy-cockroachdb>=2,<3"]                        # Apache-2.0; psycopg2 is a base dep
db2 = ["ibm-db-sa>=0.4,<1", "ibm-db>=3,<4"]                            # Apache-2.0 (ibm-db bundles IBM's CLI driver)
exasol = ["sqlalchemy-exasol>=7,<8", "pyexasol>=0.26,<4"]              # BSD-2-Clause / MIT
# firebird-driver 2.x pins protobuf~=5.29 (via firebird-base 2), below the base protobuf>=6 pin; 1.10 does not.
firebird = ["sqlalchemy-firebird>=2.2,<3", "firebird-driver>=1.10,<2"]  # MIT / MIT (needs the Firebird client library)
monetdb = ["sqlalchemy-monetdb>=2,<3", "pymonetdb>=1.8,<2"]           # MIT / MPL-2.0
opengauss = ["opengauss-sqlalchemy>=2.4,<3"]                          # MIT; psycopg2 is a base dep
vertica = ["sqlalchemy-vertica-python>=0.6,<1", "vertica-python>=1.4,<2"]  # MIT / Apache-2.0
# REQ-1676: Cassandra read natively over CQL (Apache-2.0). The Trino connector needs nothing here.
cassandra = ["cassandra-driver>=3.29"]
all-drivers = [
    "aiomysql", "aioodbc", "oracledb", "hdbcli", "sqlalchemy-hana", "cassandra-driver>=3.29",
    "provisa[cockroachdb,db2,exasol,firebird,monetdb,opengauss,vertica]",
]
# REQ-1443: external data-quality checker, invoked out-of-process (never linked). Only the
# postgres package is needed — the checker aims at Provisa's own pgwire endpoint so it scans the
# FEDERATED view, which is why a Snowflake- or Iceberg-backed table needs no per-warehouse package.
# soda-core is Elastic License 2.0: acquired from PyPI on operator selection (the oracledb posture),
# never vendored, and NEVER enabled in the hosted cloud plane — ELv2 prohibits offering it as a
# managed service to third parties.
soda = ["soda-postgres"]
# The interchangeable Apache-2.0 checker. Same out-of-process contract, same results schema, same
# pgwire target — the difference is the contract dialect (GX expectation suite vs Soda checks YAML)
# and the licence: Apache 2.0 carries no hosted-service bar, so this extra IS cloud-eligible.
gx = ["great-expectations[postgresql]"]
# REQ-1443: the bundled demo (`provisa run --demo`, config/provisa-install.yaml) registers both
# checker sources — a great_expectations suite over the pet inventory and a soda contract over the
# referral vets — so the demo's quality scorecard is empty and its scans exit with ModuleNotFoundError
# unless a checker is present. Only GX is installed here because Apache 2.0 carries no hosted-service
# bar — the same demo config is valid in the cloud plane, where the soda scan reports the extra that
# would install it and lands nothing. `pip install provisa[embedded,demo]` is the pip route to the
# demo the installers already build (their apply_demo_checker_default picks gx for the same reason);
# add `soda` to run the second scan locally.
demo = ["great-expectations[postgresql]"]
firebase = ["firebase-admin"]
# Local embedding provider for catalog search (REQ-1008, provisa/vector/providers.py
# HuggingFaceLocalProvider). No network at query time once the model is cached.
vector = ["sentence-transformers"]
# Encryption master-key providers (REQ-690-694). boto3 (AWS KMS) is a base dependency,
# so aws_kms needs no extra. These optional SDKs auto-enable their provider in the
# registry (provisa/encryption/registry.py) once installed.
vault = ["hvac"]                      # HashiCorp Vault Transit
azure = ["azure-keyvault-keys"]       # Azure Key Vault (azure-identity is a base dep)
gcp = ["google-cloud-kms"]            # Google Cloud KMS
kms-all = ["hvac", "azure-keyvault-keys", "google-cloud-kms"]
dev = [
    # REQ-1873: the bundled extension binaries the pg-ext install command stages; its tests
    # install them into real Postgres containers.
    "provisa-pg-ext==0.2.0",
    "pytest",
    "pytest-asyncio",
    "pytest-timeout",  # scripts/ci/run_lane.py bounds every test, so a hang fails by name
    # REQ-2135: the standard SPARQL 1.1 Protocol client the endpoint's integration test queries
    # it with (W3C Software Notice and License, permissive).
    "sparqlwrapper>=2,<3",
    # REQ-2168: LangChain's Neo4j integration (MIT), which reads a graph's schema with
    # apoc.meta.data; the command-bindings acceptance test connects it to Provisa over Bolt.
    "langchain-neo4j==0.11.0",
    "pytest-bdd",
    "pytest-cov",
    # REQ-1759: tests/unit/ alone collects ~12K tests, single-process at ~1%/19s (~50min
    # projected) — too slow for a per-push CI gate. -n auto (unit-tests.yml) parallelizes across
    # the runner's cores.
    "pytest-xdist",
    "hypothesis",
    # tests/unit/test_ossie_convert.py validates the Ossie export against Ossie's own schema.
    "jsonschema",
    "ruff",
    "black",
    "pyright",
    "pre-commit",
    "bandit",
    "pip-audit",
    "import-linter",
    "syrupy",
    "respx",
    "python-pptx",
    # Test-time deps that were present-but-undeclared in the old venv (recreating
    # the venv dropped them): pandas for provisa_client.query_df. Declared so `uv sync` keeps it.
    "pandas",
    # REQ-2085: tests/integration/test_churn_demo.py runs the churn demo's notebook, which trains
    # a scikit-learn model, as a desktop Jupyter runs it.
    "scikit-learn>=1.9",
    # REQ-2039: the agriculture demo's notebook plots its regression; its test runs the cells.
    "matplotlib>=3.8",
    # Direct-driver libraries the unit suite exercises (test_drivers/routing/transpiler).
    # Declared so `uv sync` installs them and the driver tests run instead of skipping.
    "aiomysql",
    "oracledb",
    # REQ-1759: test_cassandra_fetch.py imports provisa.cassandra.fetch unconditionally (no
    # importorskip) — undeclared, it hard-fails collection/the test itself rather than skipping,
    # caught running the full unit suite for the first time in CI.
    "cassandra-driver>=3.29",
    # REQ-1266: the Firebase auth-provider unit tests (test_auth_providers.py TestFirebaseProvider)
    # importorskip("firebase_admin.auth"); declared here so the test env always has it and those
    # tests RUN instead of skipping. Same rationale as the direct-driver libs above.
    "firebase-admin",
    # REQ-1310: the invite-delivery test sends over SMTP to a real local server this provides.
    # Asserting on a captured message is only meaningful against a server that speaks the protocol.
    "aiosmtpd",
]

[build-system]
# REQ-2194: setuptools-rust compiles provisa._encoders, so provisa's wheel is a platform wheel.
requires = ["setuptools>=68", "setuptools-rust==1.13.0"]
build-backend = "setuptools.build_meta"

# REQ-2194: Provisa's Rust encoders, compiled into provisa itself as one extension module whose
# submodules are the encoders (provisa._encoders.pgwire, .grpc and .json). Every build
# compiles it, an editable one included (cargo on PATH), in release mode with the committed lock;
# a build without cargo fails, and there is no Python stand-in.
[[tool.setuptools-rust.ext-modules]]
target = "provisa._encoders"
path = "rust/encoders/Cargo.toml"
binding = "PyO3"
debug = false
args = ["--locked"]

# REQ-2071: in this repository provisa-notebook is the sibling directory, built in place
# (`python -m provisa_notebook.build`); a release publishes it to PyPI with provisa.
[tool.uv.sources]
provisa-notebook = { path = "provisa-notebook", editable = true }

[tool.uv]
# REQ-2194: `uv sync` rebuilds provisa (and so provisa._encoders) when the Rust source changes.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "rust/encoders/Cargo.toml" },
    { file = "rust/encoders/Cargo.lock" },
    { file = "rust/encoders/src/**/*.rs" },
    { file = "rust/encoders/json/Cargo.toml" },
    { file = "rust/encoders/json/src/**/*.rs" },
    { file = "rust/encoders/grpc/Cargo.toml" },
    { file = "rust/encoders/grpc/src/**/*.rs" },
    { file = "rust/pgwire/Cargo.toml" },
    { file = "rust/pgwire/src/**/*.rs" },
    { file = "rust/pgwire/third_party/**/*" },
]

[tool.setuptools.packages.find]
# The provisa tree plus the vendored buenavista fork, discovered from two roots so both
# ship as top-level packages in one self-contained wheel (buenavista is a Provisa fork not
# on PyPI — it must travel inside this distribution). A bare "provisa*" glob also swept in
# the sibling provisa_client project and namespace dirs under provisa-ui/ (leaking
# node_modules .py/.proto into the wheel), so discovery is scoped explicitly.
where = [".", "vendor/buenavista"]
include = ["provisa", "provisa.*", "buenavista", "buenavista.*"]

# Non-.py runtime data must ship in the wheel. setuptools bundles only .py by default,
# so the packaged native runtime lacked provisa/core/schema.sql — init_schema was skipped
# (schema_sql_path.exists() == False) and the control plane started with no `sources` table.
# These files are read at runtime via Path(__file__): the two schema.sql bootstraps and the
# gRPC approval.proto.
[tool.setuptools.package-data]
"*" = ["*.sql", "*.proto"]
# REQ-2194: _encoders.THIRD_PARTY_NOTICES is the licence notice of every Rust crate linked into
# provisa._encoders (scripts/rust-third-party-notices.sh).
# REQ-1127: the precompiled React UI (vite build output, staged into provisa/_ui/ by
# scripts/build-wheel.sh) and the runtime config/ files (staged into provisa/_config/) ship in
# the wheel so the delivery is self-contained on a Python-only, npm/Node-free host.
"provisa" = ["_ui/**/*", "_config/*.yaml", "_config/demo/files/*", "_encoders.THIRD_PARTY_NOTICES"]
# REQ-1923: the shipped schema of each branded GraphQL source (scripts/bake_graphql_brand_schema.py).
"provisa.graphql_remote" = ["_known_schemas/*.json.gz"]
# REQ-1923: the pinned spec of each branded OpenAPI source (scripts/bake_openapi_brand_spec.py).
"provisa.openapi" = ["_known_specs/*.json.gz", "_known_specs/*.additions.json", "_known_specs/*.exclusions.json", "_known_specs/THIRD_PARTY_NOTICES"]
# REQ-1494: the portable fake definition's versioned word lists and templates, and their notice.
"provisa.fakes" = ["portable/*.json", "portable/THIRD_PARTY_NOTICES"]
# REQ-2147: the profiler's classification kinds and the reference lists they test, and their notice.
"provisa.profiler" = ["classification_kinds.yaml", "reference/*.txt.gz", "reference/THIRD_PARTY_NOTICES"]
# REQ-2155: the standard roles' definitions, read by provisa.core.db.
"provisa.core" = ["standard_roles.yaml", "apoc_commands.yaml", "platform_connectors.yaml"]
# REQ-1984: the reader a Node source's declarations are read with, run by the source's runtime.
"provisa.node" = ["reader.mjs", "host.mjs"]
# REQ-2200: the reader a Go source's package is read with, compiled by the pinned Go toolchain.
"provisa.golang" = ["reader/go.mod", "reader/go.sum", "reader/main.go", "host/go.mod", "host/go.sum", "host/*.go", "services/go.mod", "services/*.go"]
# REQ-2138: a sparql source's reasoner, run from its source by the pinned JDK.
"provisa.sparql" = ["reasoner/Reasoner.java"]

[tool.pytest.ini_options]
testpaths = ["tests", "tests/steps"]
# Default lane = integration + unit + bdd against the shared dev stack.
# The e2e tier is a SEPARATE process lane (pytest -m e2e): it provisions its own
# isolated Docker stack on ephemeral ports and, being in-process, must override
# PG_PORT/TRINO_PORT/etc. in os.environ — which would redirect the dev-stack
# integration tests to the wrong stack if co-run in one process. packaging and
# cluster are likewise their own lanes (manual/live-minikube). scripts/test-all
# runs every lane and combines coverage. These are documented process-isolation
# lanes, not silent skips.
addopts = "-m 'not packaging and not cluster and not isolated and not demo_walk and not leak and not bench' --ignore=tests/e2e"
python_files = ["test_*.py", "*_test.py", "steps_*.py"]
asyncio_mode = "auto"
log_level = "DEBUG"
log_cli = false
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "unit: fast, no external services required",
    "bdd: pytest-bdd scenario tests (generated from tests/features/)",
    "integration: requires Docker Compose stack (PG + Trino)",
    "local_platform: runs on the local test platform (embedded Postgres, fakeredis; tests/local_platform.py) — no Docker stack",
    "requires_trino: reaches a Trino coordinator — the CI side of the test platform (tests/local_platform.py)",
    "e2e: full HTTP pipeline tests against running app",
    "slow: long-running tests",
    "postgres_engine: a catalog test (tests/unit/pgwire) whose statements reading no table run on a PostgreSQL engine, the plane's server standing in for it, rather than DuckDB",
    "requires_neo4j: requires Neo4j service (docker compose up neo4j)",
    "requires_sparql: requires SPARQL endpoint service (docker compose up fuseki)",
    "requires_elasticsearch: requires Elasticsearch service (docker compose up elasticsearch)",
    "requires_kafka: requires Kafka broker (docker compose up kafka)",
    "requires_debezium: requires Debezium Connect service (docker compose up debezium)",
    "requires_mongodb: requires MongoDB service (docker compose up mongodb)",
    "requires_ldap: requires the OpenLDAP directory service (docker compose up openldap)",
    "requires_saml_idp: requires the SAML identity provider (docker compose up saml-idp)",
    "requires_keycloak: requires the Keycloak identity provider (docker compose up keycloak)",
    "requires_pg_ext_targets: requires the external Postgres 15/16 containers (docker compose up pg-ext-target-15 pg-ext-target-16)",
    "requires_mariadb: requires MariaDB service (docker compose up mariadb)",
    "requires_tidb: requires TiDB service (docker compose up tidb)",
    "requires_cockroachdb: requires CockroachDB service (docker compose up cockroachdb)",
    "requires_greenplum: requires Greenplum service (docker compose up greenplum)",
    "requires_yugabytedb: requires YugabyteDB service (docker compose up yugabytedb)",
    "requires_sqlserver: requires SQL Server service (docker compose up sqlserver)",
    "requires_oracle: requires Oracle service (docker compose up oracle)",
    "requires_cassandra: requires Cassandra service (docker compose up cassandra)",
    "requires_clickhouse: requires ClickHouse service (docker compose up clickhouse); self-provisioned per-test",
    "requires_firebird: requires Firebird service (docker compose up firebird)",
    "requires_exasol: requires Exasol service (docker compose up exasol); amd64-only image",
    "requires_redshift: requires a live AWS Redshift cluster (REDSHIFT_* env); no self-provision",
    "requires_athena: requires a live Amazon Athena account (ATHENA_* env); no self-provision",
    "requires_vector: embeds with a local sentence-transformers model (the vector extra, CPU-only torch); its own CI lane (scripts/ci/run_lane.py vector)",
    "requires_polly_bakeoff: asks Polly real questions on paid models (OPENROUTER_API_KEY or ANTHROPIC_API_KEY); manual dispatch only (polly-bakeoff.yml)",
    "requires_warehouse: cloud-DW e2e needing external SaaS creds (Snowflake/Databricks/BigQuery/Fabric/Synapse); runs only in the warehouse lane where .env creds load, excluded from default lanes so it is never a phantom skip",
    "linux_mem: RLIMIT_AS cap test that only discriminates on Linux; on a macOS host the default lanes deselect it and the linux-mem container lane runs it instead (never a phantom skip)",
    "requires_sharepoint: requires a live SharePoint site (SHAREPOINT_* env); no self-provision",
    "requires_salesforce: requires a live Salesforce org (SF_* env); no self-provision",
    "requires_servicenow: requires a live ServiceNow instance (SERVICENOW_* env); no self-provision",
    "requires_microsoft_365: requires a live Microsoft 365 tenant (M365_* env); no self-provision",
    "requires_fabric: reaches Microsoft Fabric (needs its capacity, and the CI service principal as Admin on the Fabric workspace); in no CI lane (maintainer 2026-11-11)",
    "requires_google_workspace: requires a live Google Workspace domain (GWS_* env); no self-provision",
    "requires_cloudops: requires live Azure, AWS or GCP credentials (CLOUDOPS_* env); no self-provision",
    "requires_quickbooks: requires a live QuickBooks Online sandbox company (QUICKBOOKS_* env); no self-provision",
    "requires_shopify: requires a live Shopify store (SHOPIFY_* env); no self-provision",
    "requires_splunk: requires Splunk service (docker compose up splunk)",
    "requires_airport: requires the airport-go Flight shim (docker compose up airport-shim)",
    "requires_pinot: requires Pinot service (docker compose up pinot)",
    "requires_druid: requires Druid service (docker compose up druid)",
    "requires_hive: requires Hive metastore service (docker compose up hive-metastore)",
    "requires_hive_s3: requires Hive metastore + MinIO (docker compose up hive-s3-metastore minio)",
    "requires_prometheus: requires Prometheus service (docker compose up prometheus)",
    "requires_marquez: requires the Marquez OpenLineage server (docker compose up marquez)",
    "requires_openmetadata: requires the OpenMetadata server (docker compose up openmetadata)",
    "requires_atlas: requires the Apache Atlas server (docker compose up atlas)",
    "requires_datahub: requires the DataHub GMS server (docker compose up datahub-gms)",
    "requires_pgbouncer: requires PgBouncer service (docker compose up pgbouncer)",
    "requires_provisa_server: requires running Provisa server at localhost:8000",
    "packaging: installer/packaging flow; validated manually + by unit tests, deselected by default",
    "cluster: helm/minikube deployment test; own run lane (pytest -m cluster) against a live minikube, deselected by default",
    "demo_walk: walks a published demo's bundle as a sandbox visitor, one demo per run; its own lane (scripts/ci/run_lane.py demo_walk), run by demo-bundles.yml on the bundle it built, deselected by default",
    "leak: one server under a long mixed request loop and an org churn, its growth measured (REQ-2149); its own lane (scripts/ci/run_lane.py leak), on demand and before a release, deselected by default",
    "bench: every benchmark feature end to end over the bench's own four-source compose project; its own lane (scripts/ci/run_lane.py bench) (REQ-1911)",
    "isolated: needs its own pytest process (shared module-singleton state or a non-restartable JVM); own lane in scripts/test-all, deselected by default",
    "group_sources: tests/integration split — federated source connectors (auto-assigned, see tests/integration/conftest.py)",
    "group_engines: tests/integration split — federation/native query engines (auto-assigned, see tests/integration/conftest.py)",
    "group_protocols: tests/integration split — served protocols: bolt/pgwire/grpc/graphql/cypher/etc (auto-assigned, see tests/integration/conftest.py)",
    "group_auth_org: tests/integration split — auth, org lifecycle, invites, bootstrap (auto-assigned, see tests/integration/conftest.py)",
    "group_governance: tests/integration split — governance, RLS, security, rate limiting, schema/mutation admin (auto-assigned, see tests/integration/conftest.py)",
    "group_pipeline: tests/integration split — materialization, execution pipeline, and everything not in the other groups (auto-assigned, see tests/integration/conftest.py)",
]
filterwarnings = [
    "ignore::DeprecationWarning:pytest_asyncio",
    "ignore:ast\\.NameConstant is deprecated:DeprecationWarning:docstring_parser",
    "ignore:ast\\.Num is deprecated:DeprecationWarning:docstring_parser",
    "ignore:ast\\.Str is deprecated:DeprecationWarning:docstring_parser",
    "ignore:`LoggingHandler` in `opentelemetry-sdk` is deprecated:DeprecationWarning:opentelemetry",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    "ignore::ResourceWarning:asyncpg",
    "ignore::ResourceWarning:asyncio",
    "ignore::ResourceWarning:httpcore",
    "ignore::ResourceWarning:socketserver",
    "ignore::DeprecationWarning:opentelemetry",
]

[tool.coverage.run]
source = ["provisa"]
omit = ["provisa/proto/*", "provisa/migrations/*", "provisa/tools/*"]
# scripts/test-all runs the default lane and the e2e lane as separate processes
# and `coverage combine`s them; parallel=true tags each run's data file so they
# don't clobber each other.
parallel = true
# Server subprocesses (IsolatedServer / provisa_server) measure their own coverage
# via COVERAGE_PROCESS_START + the .pth trigger; they are shut down with SIGTERM, so
# a SIGTERM handler must flush their data or it is lost (out-of-process Bolt/Flight/
# gRPC/pgwire/governed-pipeline coverage). sigterm=true installs that handler.
sigterm = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
# Type-checking targets the product package only. Test modules are pytest
# fixtures/hooks/step-defs whose symbols pytest injects by name at runtime, so
# static "unused function/parameter/variable" analysis produces only false
# positives there — exclude tests from analysis rather than sprinkle pragmas.
include = ["provisa"]
exclude = ["provisa/proto", "**/__pycache__", "**/node_modules", "**/.*", ".venv", "tests", "**/tests"]
# Optional runtime dependencies (keyring, the mcp extra) are absent by design and their import
# sites already handle ImportError, so an unresolved import is a note and not a failure.
reportMissingImports = "warning"
reportMissingModuleSource = "none"
reportPrivateImportUsage = "none"
# pytest injects fixture/step-def symbols by name; excluded above, but the same shape appears in
# strawberry resolvers and mixin stub blocks inside provisa itself.
reportUnusedVariable = "none"
reportUnusedFunction = "none"
venvPath = "."
venv = ".venv"
extraPaths = ["vendor/buenavista", ".", "provisa-client", ".claude/commercial"]

[tool.importlinter]
root_package = "provisa"

[[tool.importlinter.contracts]]
name = "compiler must not import executor"
type = "forbidden"
source_modules = ["provisa.compiler"]
forbidden_modules = ["provisa.executor", "provisa.api"]

# REQ-1678: Cypher lowers to semantic SQL through the compiler by design (REQ-863), so the
# compiler is allowed; the executor and the API layer are not.
[[tool.importlinter.contracts]]
name = "cypher must not import executor"
type = "forbidden"
source_modules = ["provisa.cypher", "provisa.gql"]
forbidden_modules = ["provisa.executor", "provisa.api"]

# REQ-2135: the graph IR and its back end belong to no graph language; each language's front end
# parses into the IR and may import it, never the reverse.
[[tool.importlinter.contracts]]
name = "the graph back end imports no front end"
type = "forbidden"
source_modules = ["provisa.gql"]
forbidden_modules = ["provisa.cypher", "provisa.sparql_query"]

[tool.ruff]
target-version = "py312"
line-length = 100
# Generated protobuf bindings (scripts/gen_flightsql_proto.py), checked in as protoc writes them.
extend-exclude = ["provisa/proto/*_pb2.py", "provisa/proto/*_pb2.pyi"]

[tool.ruff.lint]
# Defaults (E, F, W) plus B006: mutable default arguments (0 existing violations).
extend-select = ["B006"]

# buenavista is bundled into the provisa distribution itself (see
# [tool.setuptools.packages.find]); no separate source/editable entry is needed. An editable
# `pip install -e .` exposes both provisa and the vendored buenavista from the two find roots.
