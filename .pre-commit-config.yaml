repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: ["-r", "provisa", "-ll", "-s", "B608"]
        pass_filenames: false
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        language: system
        # The project venv, not whatever pyright is first on PATH: the checker resolves imports
        # against the interpreter it runs under, so a system pyright types the code against a
        # different site-packages than CI's `uv run pyright` and the two disagree.
        entry: .venv/bin/python -m pyright
        args: ["provisa"]
        pass_filenames: false
        types: [python]
      - id: eslint-ui
        name: eslint-ui
        language: system
        entry: provisa-ui/scripts/precommit-eslint.sh
        files: ^provisa-ui/src/.*\.(ts|tsx)$
