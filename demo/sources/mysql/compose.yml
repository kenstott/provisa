# Optional demo source: plain MySQL (start-ui-install.sh --demo --source=mysql). Distinct from
# mariadb/tidb (already tested, MySQL wire-compatible siblings) — this is MySQL itself, which had
# zero e2e coverage at any tier before REQ-1732.
services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: provisa
      MYSQL_DATABASE: provisa_demo
    ports:
      - "${PROVISA_DEMO_MYSQL_PORT:-23307}:3306"
    volumes:
      - mysql_demo_data:/var/lib/mysql
    healthcheck:
      # `mysqladmin ping` alone is a known-inadequate readiness check for the official mysql
      # image: it can succeed against the entrypoint's TEMPORARY server (spun up to run init SQL,
      # then shut down and replaced by the real one) during MySQL's internal restart-on-init,
      # reporting "healthy" moments before the real server briefly refuses connections — caught
      # live (2026-09-16): source-meta/db-description's connect (5s timeout) intermittently failed
      # with a 422 in exactly this window despite `docker compose up --wait` already reporting
      # healthy. A real query against the actual target database only succeeds once the FINAL
      # server is up with that database created — mariadb's own healthcheck.sh --innodb_initialized
      # check (no mysql equivalent tool exists) verifies the same thing a different way.
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-uroot", "-pprovisa", "provisa_demo", "-e", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
volumes:
  mysql_demo_data:
