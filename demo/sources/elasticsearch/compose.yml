# Optional demo source: Elasticsearch (start-ui-install.sh --source=elasticsearch).
# Own compose project (provisa-demo-elasticsearch) on port 29200 (dev stack 9200, tests ephemeral).
# Read over HTTP by every engine without an Elasticsearch connector (REQ-1672); Trino keeps its
# connector. Under a Docker start the container joins the core stack's network (provision.py).
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    restart: unless-stopped
    ports:
      - "${PROVISA_DEMO_ES_PORT:-29200}:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - es_demo_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
volumes:
  es_demo_data:
