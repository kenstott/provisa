# Config fragment for the optional Elasticsearch demo source (REQ-1669). Registers the SOURCE
# with its index mapping; the table is for registering by hand through Register Table.
# prime.py creates and loads the index.
sources:
- id: elasticsearch-demo
  type: elasticsearch
  # A Trino coordinator is a container: it reaches the source at its network alias and container
  # port (start-ui-install.sh sets these), not the host-published PROVISA_DEMO_ES_PORT prime.py uses.
  host: ${env:PROVISA_DEMO_ES_SOURCE_HOST:-localhost}
  port: ${env:PROVISA_DEMO_ES_SOURCE_PORT:-29200}
  description: "Support ticket search index — tickets, status and priority (Elasticsearch)"
  mapping:
    tls: false
    tables:
    - name: support_tickets
      index: support_tickets
      discover: false
      columns:
      - name: ticket_id
        data_type: VARCHAR
        path: ticket_id
      - name: subject
        data_type: VARCHAR
        path: subject
      - name: status
        data_type: VARCHAR
        path: status
      - name: priority
        data_type: INTEGER
        path: priority
      - name: opened_at
        data_type: TIMESTAMP
        path: opened_at
