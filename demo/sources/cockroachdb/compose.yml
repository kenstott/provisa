# Optional demo source: CockroachDB (start-ui-install.sh --demo --source=cockroachdb). Postgres
# wire-compatible (reuses the asyncpg direct driver + postgres dialect, REQ-950/1097) — same
# image/config as docker-compose.test.yml's `cockroachdb` service, ported here for the
# source-to-query e2e.
services:
  cockroachdb:
    image: cockroachdb/cockroach:v24.1.0
    restart: unless-stopped
    command: start-single-node --insecure
    ports:
      - "${PROVISA_DEMO_COCKROACHDB_PORT:-26258}:26257"
    volumes:
      - cockroach_demo_data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health?ready=1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
volumes:
  cockroach_demo_data:
