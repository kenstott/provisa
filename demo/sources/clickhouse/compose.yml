#
# Optional demo source: ClickHouse (start-ui-install.sh --demo --source=clickhouse). Reached over
# clickhouse-connect HTTP (REQ-986) on ANY engine — same image/config as docker-compose.test.yml's
# `clickhouse` service, ported here for the source-to-query e2e. The stock image restricts
# `default` to loopback; CLICKHOUSE_USER/PASSWORD makes the entrypoint rewrite it to allow any
# network, matching the test harness's fixture exactly.
services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: provisa
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "${PROVISA_DEMO_CLICKHOUSE_PORT:-28123}:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
