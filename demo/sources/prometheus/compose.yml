# Optional demo source: Prometheus (start-ui-install.sh --demo --source=prometheus).
# Own compose project (provisa-demo-prometheus) on port 29090 (observability stack uses 9090).
# Read natively over the HTTP API by every engine without a live Prometheus connector (REQ-1689).
services:
  prometheus:
    image: prom/prometheus:v2.51.2
    restart: unless-stopped
    ports:
      - "${PROVISA_DEMO_PROMETHEUS_PORT:-29090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
