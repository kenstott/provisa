#
# Config fragment for the optional Splunk demo source (REQ-1692). Registers the SOURCE only: its
# Data Models list as tables in Register Table — prime.py seeds the `shelter_alerts` model, which
# is what the demo queries. On Trino this is the trino-splunk catalog; on every other engine the
# connector's bundled Calcite pgwire server is started and attached live (REQ-1690).
sources:
- id: splunk-demo
  type: splunk
  # A Trino coordinator is a container: it reaches the source at its network alias and container
  # port (start-ui-install.sh sets these), not the host-published PROVISA_DEMO_SPLUNK_PORT that
  # prime.py seeds through.
  host: ${env:PROVISA_DEMO_SPLUNK_SOURCE_HOST:-localhost}
  port: ${env:PROVISA_DEMO_SPLUNK_SOURCE_PORT:-8089}
  # The API token prime.py mints, handed over as PROVISA_DEMO_SPLUNK_TOKEN by start-ui-install.sh
  # (its value is generated by Splunk, so it cannot be written here). No default: an unset variable
  # fails the config load loudly rather than registering a source that cannot authenticate.
  password: ${env:PROVISA_DEMO_SPLUNK_TOKEN}
  description: "Shelter alert events — medical, intake and transfer alerts by animal (Splunk)"
  mapping:
    use_token: true
    # The demo container serves its management port with a self-signed certificate (REQ-724).
    disable_ssl_validation: true
