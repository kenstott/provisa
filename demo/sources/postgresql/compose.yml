#
# Optional demo source: PostgreSQL (start-ui-install.sh --demo --source=postgresql). Native
# postgres wire protocol (reuses the asyncpg direct driver + postgres dialect, REQ-950/1097),
# ported here for the source-to-query e2e (REQ-1768).
services:
  postgresql:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: provisa
      POSTGRES_PASSWORD: provisa
      POSTGRES_DB: provisa_demo
    ports:
      - "${PROVISA_DEMO_POSTGRESQL_PORT:-25432}:5432"
    volumes:
      - postgresql_demo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provisa -d provisa_demo"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
volumes:
  postgresql_demo_data:
