# Optional demo source: TiDB (start-ui-install.sh --demo --source=tidb). MySQL wire-compatible
# (reuses the aiomysql direct driver + mysql dialect, REQ-950/1097) — same image/config as
# docker-compose.test.yml's `tidb` service, ported here for the source-to-query e2e.
services:
  tidb:
    image: pingcap/tidb:latest
    restart: unless-stopped
    ports:
      - "${PROVISA_DEMO_TIDB_PORT:-24000}:4000"
    volumes:
      - tidb_demo_data:/tmp/tidb
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/4000' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
volumes:
  tidb_demo_data:
