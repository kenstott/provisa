#
# Config fragment for the optional Chinook demo source (REQ-1669). Registers the SOURCE only: its
# tables are what a Hasura v2 import of Hasura's own sample lands (Admin → Import), or what
# Register Table lists. Under a Docker start the coordinator reaches the container at chinook:5432
# (start-ui-install.sh sets PROVISA_DEMO_CHINOOK_SOURCE_*).
sources:
- id: chinook-demo
  type: postgresql
  host: ${env:PROVISA_DEMO_CHINOOK_SOURCE_HOST:-localhost}
  port: ${env:PROVISA_DEMO_CHINOOK_SOURCE_PORT:-25433}
  database: chinook
  username: provisa
  password: provisa
  description: "Chinook music catalogue subset — the tables Hasura's metadata sample tracks (Postgres)"
