# The audit demo's card on provisa.dev's live demos page (REQ-2006), generated from this file
# by scripts/gen-site-demos.mjs. published: true once the lead publishes it; card.png, a screenshot
# of the demo in Provisa, is beside it.
title: Single Audit readiness
description: >-
  An audit firm's nonprofit clients, their schedules of federal awards and their award records, in
  its own database, beside the Federal Audit Clearinghouse's filings and USAspending's obligations
  from government data. Do a client's recorded federal awards match what the government's records
  show paying it?
screenshot: card.png
published: false
group: public-data
# The oldest Provisa this demo's bundle runs on (REQ-2049): a puller running an older one is refused
# by name. The first release carrying the demo.
requires_provisa: 0.1.0a497
extras:
- vector
# The demo's video: its tagline names what the demo shows Provisa being.
video:
  tagline: "Public Data, Private Records"
