# The narrow entity bridges: one row per mention, written only by the entity-resolution job. Internal:
# the data steward's alone, read by the checks and the canonical tables built from them.
- source_id: er
  domain_id: customer360
  schema: er
  table: entity_org_bridge
  description: 'Each mention of an organization in the four systems, matched to the Salesforce account that is its golden record, or unresolved with why'
  columns:
  - {name: source_schema, data_type: varchar, is_primary_key: true, description: 'The source of the table the mention is in, as Provisa registers it: salesforce, servicenow, jira or stripe', visible_to: [data_steward]}
  - {name: source_table, data_type: varchar, is_primary_key: true, description: 'The table the mention is in', visible_to: [data_steward]}
  - {name: source_column, data_type: varchar, is_primary_key: true, description: 'The column whose value identifies the mention (the registry entry''s key)', visible_to: [data_steward]}
  - {name: source_key, data_type: varchar, is_primary_key: true, description: 'That column''s value: the mention', visible_to: [data_steward]}
  - {name: name_raw, data_type: varchar, description: 'How a steward sees the mention: its registry entry''s label', visible_to: [data_steward]}
  - {name: name_norm, data_type: varchar, description: 'The mention''s match text, normalised as the matching compares it', visible_to: [data_steward]}
  - {name: match_text, data_type: varchar, description: 'The string the fuzzy tier compares, from its registry entry''s match_text', visible_to: [data_steward]}
  - {name: label, data_type: varchar, description: 'Its registry entry''s label, formatted over the row', visible_to: [data_steward]}
  - {name: canonical_id, data_type: varchar, description: 'The id of the entity it is matched to: the Salesforce record''s id, or for a mention matched to none ''h:'' and the md5 of its source identity', visible_to: [data_steward]}
  - {name: golden_source, data_type: varchar, description: 'The authority whose record is the golden record, such as salesforce.Account; empty when unresolved', visible_to: [data_steward]}
  - {name: match_method, data_type: varchar, description: 'The tier that matched it: authority (a golden record itself), exact_domain, exact_email, exact_normalized or fuzzy; empty when unresolved', visible_to: [data_steward]}
  - {name: match_confidence, data_type: varchar, description: 'high, low (a fuzzy score from 0.85 to 0.95) or unresolved', visible_to: [data_steward]}
  - {name: match_score, data_type: double, description: 'The match''s score, from 0 to 1; empty when unresolved', visible_to: [data_steward]}
  - {name: unresolved_reason, data_type: varchar, description: 'Why it matched no golden record: no_candidate, below_floor, ambiguous or excluded; empty when matched', visible_to: [data_steward]}
  - {name: candidate_id, data_type: varchar, description: 'The golden record it came closest to, when unresolved', visible_to: [data_steward]}
  - {name: candidate_score, data_type: double, description: 'Its score against that record', visible_to: [data_steward]}
  - {name: match_run_id, data_type: varchar, description: 'The job''s run that wrote it', visible_to: [data_steward]}
  # Data stewards that may write correct a row; only the entity steward deletes, as the rerun
  # command's MERGE does when it replaces the bridge.
  write_grants:
  - role: data_steward
    operation: insert
    columns: [source_schema, source_table, source_column, source_key, name_raw, name_norm, match_text, label, canonical_id, golden_source, match_method, match_confidence, match_score, unresolved_reason, candidate_id, candidate_score, match_run_id]
  - role: data_steward
    operation: update
    columns: [source_schema, source_table, source_column, source_key, name_raw, name_norm, match_text, label, canonical_id, golden_source, match_method, match_confidence, match_score, unresolved_reason, candidate_id, candidate_score, match_run_id]
  - role: entity_steward
    operation: delete
