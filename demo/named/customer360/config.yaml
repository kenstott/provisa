#
# The WHOLE config of the named demo "customer360" (start-ui-install.sh --demo customer360; REQ-2034).
# Halyard Software sells to businesses. Its question: which accounts renewing this quarter have open
# P1 incidents, blocked fixes or overdue invoices? Four SaaS systems hold the answer, each with its
# own id for a customer and none shared:
#
#   salesforce  the CRM: accounts and their renewal opportunities (replica_rows/salesforce/)
#   servicenow  the service desk: companies and their incidents (replica_rows/servicenow/)
#   jira        engineering's ENG project: bugs, each naming its customer in the Customer field
#               (replica_rows/jira/)
#   stripe      billing: customers and their invoices (replica_rows/stripe/)
#   hub         the company's customer master (db/init.sql), read live: master customers and master
#               people, the crosswalks from each to every system's id with how each link was made
#               (a rule, a steward, or the matching model's run and its score), and when it last
#               synced
#   er          the narrow entity bridges (db/er.sql, schema er): each mention of an organization or
#               a person in the four systems, matched to Salesforce's record of it by the
#               entity-resolution job (entity_resolution/er_job.py). Rerun from Provisa by the
#               commands rerun_org_bridge and rerun_person_bridge (the entity steward's), or from a
#               shell by the job, which signals when it has written them. The data steward's alone
#   entity_resolution  the job's matching as a Python code source (entity_resolution/er_source.py),
#               whose two queries the rerun commands read
#
# The four systems hold people as well as customers (REQ-2034, amended 2026-11-14): Salesforce
# contacts, ServiceNow users, the reporter of each Jira bug and the billing contact of a Stripe
# customer. Which tables refer to an organization or a person is declared once, in
# entity_resolution/entity_resolution.py (ENTITY_SOURCES).
#
# The demo declares the four systems' rows (replica_rows/, REQ-2089): nothing calls Salesforce,
# ServiceNow, Jira or Stripe. Each system relates to the hub, not to the others.
#
# The answer through the hub is renewal_risk_hub. The check of the hub is one cascade of
# materialized views: system_records (each system record's evidence) -> crosswalk (each record
# matched to a Salesforce account by a rule it names) -> master (a golden record a group, its id
# from a hash of the group's anchor account) -> hub_findings (where the hub and the evidence
# disagree) -> hub_match_rate (the hub's links the evidence confirms, by month) and hub_corrected
# (the hub's links with the findings applied), which renewal_risk_checked reads. "This quarter" and
# "overdue" are measured from the day the hub last synced (sync_run).
auth:
  assignments_source: provisa
  default_assignments:
  - domain_id: '*'
    role_id: org_admin
  provider: none
cache:
  default_ttl: 300
  enabled: true
data_products:
# Account health: the renewal risk answer, the golden customer record behind it, and the check that
# says how far the hub can be trusted.
- id: account_health
  domain_id: customer360
  name: Account Health
  owner_role: org_admin
  purpose: Which accounts renewing this quarter are at risk, read across the CRM, the service desk,
    engineering and billing through the customer master, checked against the evidence in each system
  usage: Read renewal_risk_checked for the at-risk renewals, master for the golden customer record, and
    hub_findings and hub_match_rate for how far the customer master can be trusted
  limitations: A system record no rule can match to a Salesforce account (a short name, a personal
    email) keeps the link the hub gives it
  sla: Rebuilt each time the customer master syncs from the four systems
  support_contact: kennethstott@gmail.com
  tables: [view_master, view_hub_findings, view_hub_match_rate, view_renewal_risk_checked]
domains:
- id: customer360
  description: Halyard Software's customers across Salesforce, ServiceNow, Jira and Stripe, and the
    customer master that links them
federation_engine: duckdb
# The rerun of entity resolution, triggered from Provisa. The two queries are the code source's
# matching: each reads the registry's tables (entity_resolution.ENTITY_SOURCES) through Provisa as
# its caller and answers one bridge's rows for a new run. Each rerun command replaces one bridge
# from its query in one MERGE: rows it matches updated, new mentions inserted, and the rows of
# mentions no longer in the systems deleted (WHEN NOT MATCHED BY SOURCE). Each runs as its
# caller, which needs write, the bridge's insert, update and delete grants and the commands'
# assignment: entity_steward holds them.
functions:
- name: match_organizations
  function_name: match_organizations
  impl_kind: code_command
  kind: query
  domain_id: customer360
  description: Match each mention of an organization in the four systems to its Salesforce account, for a new run
  source_id: entity_resolution
  schema: code
  returns: ''
  visible_to: [data_steward]
  arguments:
  - name: accounts
    type: text
    arg_kind: table_ref
    columns:
    - {name: CreatedDate, type: timestamp}
    - {name: Id, type: text}
    - {name: Name, type: text}
    - {name: Website, type: text}
  - name: contacts
    type: text
    arg_kind: table_ref
    columns:
    - {name: AccountId, type: text}
    - {name: Email, type: text}
    - {name: FirstName, type: text}
    - {name: Id, type: text}
    - {name: LastName, type: text}
  - name: companies
    type: text
    arg_kind: table_ref
    columns:
    - {name: name, type: text}
    - {name: sys_id, type: text}
    - {name: website, type: text}
  - name: service_desk_users
    type: text
    arg_kind: table_ref
    columns:
    - {name: company, type: text}
    - {name: email, type: text}
    - {name: first_name, type: text}
    - {name: last_name, type: text}
    - {name: sys_id, type: text}
  - name: bugs
    type: text
    arg_kind: table_ref
    columns:
    - {name: customer, type: text}
    - {name: reporter_email, type: text}
    - {name: reporter_name, type: text}
  - name: stripe_customers
    type: text
    arg_kind: table_ref
    columns:
    - {name: billing_contact_name, type: text}
    - {name: email, type: text}
    - {name: id, type: text}
    - {name: name, type: text}
  output_columns:
  - {name: source_schema, type: text}
  - {name: source_table, type: text}
  - {name: source_column, type: text}
  - {name: source_key, type: text}
  - {name: name_raw, type: text}
  - {name: name_norm, type: text}
  - {name: match_text, type: text}
  - {name: label, type: text}
  - {name: canonical_id, type: text}
  - {name: golden_source, type: text}
  - {name: match_method, type: text}
  - {name: match_confidence, type: text}
  - {name: match_score, type: double}
  - {name: unresolved_reason, type: text}
  - {name: candidate_id, type: text}
  - {name: candidate_score, type: double}
  - {name: match_run_id, type: text}
- name: match_people
  function_name: match_people
  impl_kind: code_command
  kind: query
  domain_id: customer360
  description: Match each mention of a person in the four systems to its Salesforce contact within its organization, for a new run
  source_id: entity_resolution
  schema: code
  returns: ''
  visible_to: [data_steward]
  arguments:
  - name: accounts
    type: text
    arg_kind: table_ref
    columns:
    - {name: CreatedDate, type: timestamp}
    - {name: Id, type: text}
    - {name: Name, type: text}
    - {name: Website, type: text}
  - name: contacts
    type: text
    arg_kind: table_ref
    columns:
    - {name: AccountId, type: text}
    - {name: Email, type: text}
    - {name: FirstName, type: text}
    - {name: Id, type: text}
    - {name: LastName, type: text}
  - name: companies
    type: text
    arg_kind: table_ref
    columns:
    - {name: name, type: text}
    - {name: sys_id, type: text}
    - {name: website, type: text}
  - name: service_desk_users
    type: text
    arg_kind: table_ref
    columns:
    - {name: company, type: text}
    - {name: email, type: text}
    - {name: first_name, type: text}
    - {name: last_name, type: text}
    - {name: sys_id, type: text}
  - name: bugs
    type: text
    arg_kind: table_ref
    columns:
    - {name: customer, type: text}
    - {name: reporter_email, type: text}
    - {name: reporter_name, type: text}
  - name: stripe_customers
    type: text
    arg_kind: table_ref
    columns:
    - {name: billing_contact_name, type: text}
    - {name: email, type: text}
    - {name: id, type: text}
    - {name: name, type: text}
  output_columns:
  - {name: source_schema, type: text}
  - {name: source_table, type: text}
  - {name: source_column, type: text}
  - {name: source_key, type: text}
  - {name: name_raw, type: text}
  - {name: name_norm, type: text}
  - {name: match_text, type: text}
  - {name: label, type: text}
  - {name: canonical_id, type: text}
  - {name: golden_source, type: text}
  - {name: org_canonical_id, type: text}
  - {name: match_method, type: text}
  - {name: match_confidence, type: text}
  - {name: match_score, type: double}
  - {name: unresolved_reason, type: text}
  - {name: candidate_id, type: text}
  - {name: candidate_score, type: double}
  - {name: match_run_id, type: text}
- name: rerun_org_bridge
  function_name: rerun_org_bridge
  impl_kind: statement
  domain_id: customer360
  description: Rerun entity resolution for organizations, replacing entity_org_bridge with a new run's matches
  source_id: ''
  returns: ''
  visible_to: [data_steward]
  binding:
    sql: |-
      MERGE INTO "customer360"."entity_org_bridge" AS t
      USING (SELECT m.source_schema, m.source_table, m.source_column, m.source_key, m.name_raw, m.name_norm, m.match_text, m.label, m.canonical_id, m.golden_source, m.match_method, m.match_confidence, m.match_score, m.unresolved_reason, m.candidate_id, m.candidate_score, m.match_run_id
        FROM match_organizations('customer360.accounts', 'customer360.contacts', 'customer360.companies', 'customer360.service_desk_users', 'customer360.bugs', 'customer360.stripe_customers') AS m) AS s
      ON t.source_schema = s.source_schema AND t.source_table = s.source_table AND t.source_column = s.source_column AND t.source_key = s.source_key
      WHEN MATCHED THEN UPDATE SET name_raw = s.name_raw, name_norm = s.name_norm, match_text = s.match_text, label = s.label, canonical_id = s.canonical_id, golden_source = s.golden_source, match_method = s.match_method, match_confidence = s.match_confidence, match_score = s.match_score, unresolved_reason = s.unresolved_reason, candidate_id = s.candidate_id, candidate_score = s.candidate_score, match_run_id = s.match_run_id
      WHEN NOT MATCHED THEN INSERT (source_schema, source_table, source_column, source_key, name_raw, name_norm, match_text, label, canonical_id, golden_source, match_method, match_confidence, match_score, unresolved_reason, candidate_id, candidate_score, match_run_id) VALUES (s.source_schema, s.source_table, s.source_column, s.source_key, s.name_raw, s.name_norm, s.match_text, s.label, s.canonical_id, s.golden_source, s.match_method, s.match_confidence, s.match_score, s.unresolved_reason, s.candidate_id, s.candidate_score, s.match_run_id)
      WHEN NOT MATCHED BY SOURCE THEN DELETE
- name: rerun_person_bridge
  function_name: rerun_person_bridge
  impl_kind: statement
  domain_id: customer360
  description: Rerun entity resolution for people, replacing entity_person_bridge with a new run's matches
  source_id: ''
  returns: ''
  visible_to: [data_steward]
  binding:
    sql: |-
      MERGE INTO "customer360"."entity_person_bridge" AS t
      USING (SELECT m.source_schema, m.source_table, m.source_column, m.source_key, m.name_raw, m.name_norm, m.match_text, m.label, m.canonical_id, m.golden_source, m.org_canonical_id, m.match_method, m.match_confidence, m.match_score, m.unresolved_reason, m.candidate_id, m.candidate_score, m.match_run_id
        FROM match_people('customer360.accounts', 'customer360.contacts', 'customer360.companies', 'customer360.service_desk_users', 'customer360.bugs', 'customer360.stripe_customers') AS m) AS s
      ON t.source_schema = s.source_schema AND t.source_table = s.source_table AND t.source_column = s.source_column AND t.source_key = s.source_key
      WHEN MATCHED THEN UPDATE SET name_raw = s.name_raw, name_norm = s.name_norm, match_text = s.match_text, label = s.label, canonical_id = s.canonical_id, golden_source = s.golden_source, org_canonical_id = s.org_canonical_id, match_method = s.match_method, match_confidence = s.match_confidence, match_score = s.match_score, unresolved_reason = s.unresolved_reason, candidate_id = s.candidate_id, candidate_score = s.candidate_score, match_run_id = s.match_run_id
      WHEN NOT MATCHED THEN INSERT (source_schema, source_table, source_column, source_key, name_raw, name_norm, match_text, label, canonical_id, golden_source, org_canonical_id, match_method, match_confidence, match_score, unresolved_reason, candidate_id, candidate_score, match_run_id) VALUES (s.source_schema, s.source_table, s.source_column, s.source_key, s.name_raw, s.name_norm, s.match_text, s.label, s.canonical_id, s.golden_source, s.org_canonical_id, s.match_method, s.match_confidence, s.match_score, s.unresolved_reason, s.candidate_id, s.candidate_score, s.match_run_id)
      WHEN NOT MATCHED BY SOURCE THEN DELETE
naming:
  domain_prefix: true
  rules: []
roles:
- id: customer_success
  parents: [analyst]
  description: "Customer success: reads every system's customer records, the customer master and the renewal risk."
  capabilities: [data_product_read, glossary_read, query_development, usage]
  domain_access:
  - customer360
# Reruns entity resolution from Provisa: a data steward that may write, and the one role that may
# delete bridge rows, which replacing a bridge does. Any other data steward that may write (the org
# admin) may correct a bridge row but not replace the bridges.
- id: entity_steward
  parents: [data_steward]
  description: "Entity steward: reruns entity resolution, replacing the narrow entity bridges with a new run's matches."
  capabilities: [write]
  domain_access:
  - customer360
server:
  limits:
    default_row_limit: 200
    request_timeout: 60
    trino_query_timeout: 120
sources:
- id: salesforce
  type: salesforce
  base_url: ${env:CUSTOMER360_SF_LOGIN_URL:-}
  username: ${env:CUSTOMER360_SF_CONSUMER_KEY:-}
  password: ${env:CUSTOMER360_SF_CONSUMER_SECRET:-}
  cache_ttl: -1
  replicate: 0
  description: 'Halyard''s Salesforce CRM: its customers'' accounts and their renewals'
- id: servicenow
  type: servicenow
  base_url: ${env:CUSTOMER360_SERVICENOW_URL:-}
  username: ${env:CUSTOMER360_SERVICENOW_USERNAME:-}
  password: ${env:CUSTOMER360_SERVICENOW_PASSWORD:-}
  cache_ttl: -1
  replicate: 0
  description: 'Halyard''s ServiceNow service desk: its customers'' companies and their incidents'
- id: jira
  type: jira
  base_url: ${env:CUSTOMER360_JIRA_URL:-}
  username: ${env:CUSTOMER360_JIRA_EMAIL:-}
  password: ${env:CUSTOMER360_JIRA_TOKEN:-}
  cache_ttl: -1
  replicate: 0
  description: 'Halyard''s Jira: engineering''s bugs, each naming the customer it was raised for'
- id: stripe
  type: openapi
  path: brand:stripe
  base_url: https://api.stripe.com
  auth: {type: bearer, token: '${env:CUSTOMER360_STRIPE_KEY:-}'}
  cache_ttl: -1
  replicate: 0
  description: 'Halyard''s Stripe account (test mode): its customers and their invoices'
- id: hub
  type: postgresql
  host: ${env:CUSTOMER360_PG_HOST:-localhost}
  port: ${env:CUSTOMER360_PG_PORT:-30532}
  database: customer360${env:CUSTOMER360_PG_NS}
  username: provisa_reader
  password: provisa_reader
  description: 'Halyard''s customer master: master customers and people, and the crosswalks to each system''s id'
# The narrow entity bridges, in the hub's database, read and written as er_writer (db/reader.sql):
# rerun from Provisa by the two rerun commands (functions, below), each a MERGE through Provisa's
# write path, so the tables refresh with no signal; rerun from a shell by
# entity_resolution/er_job.py run, which signals this source when it is done (POST
# /data/sources/er/signal).
- id: er
  type: postgresql
  host: ${env:CUSTOMER360_PG_HOST:-localhost}
  port: ${env:CUSTOMER360_PG_PORT:-30532}
  database: customer360${env:CUSTOMER360_PG_NS}
  username: er_writer
  password: er_writer
  change_signal: signal
  description: 'The entity-resolution job''s narrow bridges: each mention of an organization or a person in the four systems, and the Salesforce record it is matched to'
# The matching, run inside Provisa: a Python package (code/entity_resolution.tar.gz, packed from
# entity_resolution/ by its pack.py, which prints the hash) whose two queries read the registry's
# tables through Provisa as the calling role and answer each bridge's rows for a new run.
- id: entity_resolution
  type: python
  description: 'The entity-resolution matching: each mention of an organization or a person in the four systems matched to its Salesforce record'
  mapping:
    runtime: python
    code: {kind: upload, upload: 9506e0bfaadb140e2c2343220aef747fa0c302aab1b78fadf8082d42a099950a, filename: entity_resolution.tar.gz}
    entry: er_source
tables:
- source_id: salesforce
  domain_id: customer360
  schema: salesforce
  table: Account
  alias: accounts
  description: Each customer's account in the CRM
  columns:
  - {name: Id, data_type: varchar, is_primary_key: true, description: 'The account''s Salesforce id', visible_to: [data_steward, customer_success]}
  - {name: Name, data_type: varchar, description: The customer's name, visible_to: [data_steward, customer_success]}
  - {name: Website, data_type: varchar, description: The customer's website, visible_to: [data_steward, customer_success]}
  - {name: Industry, data_type: varchar, description: Its industry, visible_to: [data_steward, customer_success]}
  - {name: Type, data_type: varchar, description: Customer, visible_to: [data_steward, customer_success]}
  - {name: BillingCountry, data_type: varchar, description: The country it is billed in, visible_to: [data_steward, customer_success]}
  - {name: CreatedDate, data_type: timestamp, description: When the account was created, visible_to: [data_steward, customer_success]}
- source_id: salesforce
  domain_id: customer360
  schema: salesforce
  table: Opportunity
  alias: opportunities
  description: Each account's renewals, won and open
  columns:
  - {name: Id, data_type: varchar, is_primary_key: true, description: 'The opportunity''s Salesforce id', visible_to: [data_steward, customer_success]}
  - {name: AccountId, data_type: varchar, description: The account it renews, visible_to: [data_steward, customer_success]}
  - {name: Name, data_type: varchar, description: What it is, visible_to: [data_steward, customer_success]}
  - {name: Type, data_type: varchar, description: Renewal, visible_to: [data_steward, customer_success]}
  - {name: StageName, data_type: varchar, description: Where it stands, visible_to: [data_steward, customer_success]}
  - {name: Amount, data_type: double, description: The contract's annual value in USD, visible_to: [data_steward, customer_success]}
  - {name: CloseDate, data_type: date, description: The day it is expected to close, visible_to: [data_steward, customer_success]}
  - {name: IsClosed, data_type: boolean, description: Whether it has closed, visible_to: [data_steward, customer_success]}
- source_id: salesforce
  domain_id: customer360
  schema: salesforce
  table: Contact
  alias: contacts
  description: The people at each customer the CRM knows
  columns:
  - {name: Id, data_type: varchar, is_primary_key: true, description: 'The contact''s Salesforce id', visible_to: [data_steward, customer_success]}
  - {name: AccountId, data_type: varchar, description: The account they work at, visible_to: [data_steward, customer_success]}
  - {name: FirstName, data_type: varchar, description: Their first name, visible_to: [data_steward, customer_success]}
  - {name: LastName, data_type: varchar, description: Their last name, visible_to: [data_steward, customer_success]}
  - {name: Email, data_type: varchar, description: Their email address, visible_to: [data_steward, customer_success]}
  - {name: Title, data_type: varchar, description: Their job title, visible_to: [data_steward, customer_success]}
  - {name: CreatedDate, data_type: timestamp, description: When the contact was created, visible_to: [data_steward, customer_success]}
- source_id: servicenow
  domain_id: customer360
  schema: servicenow
  table: core_company
  alias: companies
  description: Each customer's company record in the service desk
  columns:
  - {name: sys_id, data_type: varchar, is_primary_key: true, description: 'The company''s ServiceNow record id', visible_to: [data_steward, customer_success]}
  - {name: name, data_type: varchar, description: The company's name as the service desk wrote it, visible_to: [data_steward, customer_success]}
  - {name: website, data_type: varchar, description: The company's website, visible_to: [data_steward, customer_success]}
  - {name: city, data_type: varchar, description: Its city, visible_to: [data_steward, customer_success]}
  - {name: country, data_type: varchar, description: Its country, visible_to: [data_steward, customer_success]}
  - {name: customer, data_type: boolean, description: Whether it is a customer, visible_to: [data_steward, customer_success]}
  - {name: sys_created_on, data_type: timestamp, description: When the record was created, visible_to: [data_steward, customer_success]}
- source_id: servicenow
  domain_id: customer360
  schema: servicenow
  table: incident
  alias: incidents
  description: Every incident a customer raised with the service desk
  columns:
  - {name: sys_id, data_type: varchar, is_primary_key: true, description: 'The incident''s record id', visible_to: [data_steward, customer_success]}
  - {name: number, data_type: varchar, description: 'The incident''s number', visible_to: [data_steward, customer_success]}
  - {name: short_description, data_type: varchar, description: What it is about, visible_to: [data_steward, customer_success]}
  - {name: state, data_type: integer, description: '1 new, 2 in progress, 3 on hold, 6 resolved, 7 closed', visible_to: [data_steward, customer_success]}
