# The WHOLE config of the named demo "customer360" (start-ui-install.sh --demo customer360; REQ-2034).
# Halyard Software sells to businesses. Its question: which accounts renewing this quarter have open
# P1 incidents, blocked fixes or overdue invoices? Four SaaS systems hold the answer, each with its
# own id for a customer and none shared:
#
#   salesforce  the CRM: accounts and their renewal opportunities (replica_rows/salesforce/)
#   servicenow  the service desk: companies and their incidents (replica_rows/servicenow/)
#   jira        engineering's ENG project: bugs, each naming its customer in the Customer field
#               (replica_rows/jira/)
#   stripe      billing: customers and their invoices (replica_rows/stripe/)
#   hub         the company's customer master (db/init.sql), read live: master customers, the
#               crosswalk from each to every system's id, and when it last synced
#
# The demo declares the four systems' rows (replica_rows/, REQ-2089): nothing calls Salesforce,
# ServiceNow, Jira or Stripe. Each system relates to the hub, not to the others.
#
# The answer through the hub is renewal_risk_hub. The check of the hub is one cascade of
# materialized views: system_records (each system record's evidence) -> crosswalk (each record
# matched to a Salesforce account by a rule it names) -> master (a golden record a group, its id
# from a hash of the group's anchor account) -> hub_findings (where the hub and the evidence
# disagree) -> hub_match_rate (the hub's links the evidence confirms, by month) and hub_corrected
# (the hub's links with the findings applied), which renewal_risk_checked reads. "This quarter" and
# "overdue" are measured from the day the hub last synced (sync_run).
auth:
  assignments_source: provisa
  default_assignments:
  - domain_id: '*'
    role_id: org_admin
  provider: none
cache:
  default_ttl: 300
  enabled: true
data_products:
# Account health: the renewal risk answer, the golden customer record behind it, and the check that
# says how far the hub can be trusted.
- id: account_health
  domain_id: customer360
  name: Account Health
  owner_role: org_admin
  purpose: Which accounts renewing this quarter are at risk, read across the CRM, the service desk,
    engineering and billing through the customer master, checked against the evidence in each system
  usage: Read renewal_risk_checked for the at-risk renewals, master for the golden customer record, and
    hub_findings and hub_match_rate for how far the customer master can be trusted
  limitations: A system record no rule can match to a Salesforce account (a short name, a personal
    email) keeps the link the hub gives it
  sla: Rebuilt each time the customer master syncs from the four systems
  support_contact: kennethstott@gmail.com
  tables: [master, hub_findings, hub_match_rate, renewal_risk_checked]
domains:
- id: customer360
  description: Halyard Software's customers across Salesforce, ServiceNow, Jira and Stripe, and the
    customer master that links them
federation_engine: duckdb
naming:
  domain_prefix: true
  rules: []
roles:
- id: customer_success
  parents: [analyst]
  description: "Customer success: reads every system's customer records, the customer master and the renewal risk."
  capabilities: [data_product_read, glossary_read, query_development, usage]
  domain_access:
  - customer360
server:
  limits:
    default_row_limit: 200
    request_timeout: 60
    trino_query_timeout: 120
