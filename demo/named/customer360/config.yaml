#
# The WHOLE config of the named demo "customer360" (start-ui-install.sh --demo customer360; REQ-1858).
# docker-compose.yml in this directory brings up its database. TODO: the demo's question, and
# what each source holds.
#
#   customer360-db   the demo's Postgres, read live as provisa_reader (db/init.sql).
auth:
  assignments_source: provisa
  default_assignments:
  - domain_id: '*'
    role_id: org_admin
  provider: none
cache:
  default_ttl: 300
  enabled: true
domains:
- id: customer360
  description: TODO -- what the demo's data is about
federation_engine: duckdb
naming:
  domain_prefix: true
  rules: []
roles:
- id: customer360_analyst
  parents: [analyst]
  description: "TODO: what this demo's reader is for."
  capabilities: [data_product_read, glossary_read, query_development, usage]
  domain_access:
  - customer360
server:
  limits:
    default_row_limit: 100
    request_timeout: 60
    trino_query_timeout: 120
sources:
- id: customer360-db
  type: postgresql
  host: ${env:CUSTOMER360_PG_HOST:-localhost}
  port: ${env:CUSTOMER360_PG_PORT:-30532}
  database: customer360${env:CUSTOMER360_PG_NS}
  username: provisa_reader
  password: provisa_reader
  description: TODO -- the demo's database
tables:
- source_id: customer360-db
  domain_id: customer360
  schema: public
  table: customers
  description: TODO -- the demo's first table
  columns:
  - {name: id, data_type: integer, is_primary_key: true, description: The customer's id, visible_to: [data_steward, customer360_analyst]}
  - {name: name, data_type: varchar, description: The customer's name, visible_to: [data_steward, customer360_analyst]}
- source_id: customer360-db
  domain_id: customer360
  schema: public
  table: orders
  description: TODO -- the demo's second table
  columns:
  - {name: id, data_type: integer, is_primary_key: true, description: The order's id, visible_to: [data_steward, customer360_analyst]}
  - {name: customer_id, data_type: integer, description: The customer who placed it, visible_to: [data_steward, customer360_analyst]}
  - {name: amount, data_type: decimal, description: The order's total in USD, visible_to: [data_steward, customer360_analyst]}
views:
# The answer to the demo's question: what the tour's solution steps read.
- id: answer
  domain_id: customer360
  enable_aggregates: true
  enable_group_by: true
  description: TODO -- the answer to the demo's question
  sql: >-
    SELECT c.name, COUNT(*) AS orders, SUM(o.amount) AS total
    FROM "customer360"."customers" AS c
    JOIN "customer360"."orders" AS o ON o.customer_id = c.id
    GROUP BY c.name
  columns:
  - {name: name, data_type: varchar, description: The customer's name, visible_to: [data_steward, customer360_analyst]}
  - {name: orders, data_type: bigint, description: Orders the customer placed, visible_to: [data_steward, customer360_analyst]}
  - {name: total, data_type: decimal, description: What they came to in USD, visible_to: [data_steward, customer360_analyst]}
relationships:
- {id: order-to-customer, alias: PLACED_BY, cardinality: many-to-one, source_table_id: orders, source_column: customer_id, target_table_id: customers, target_column: id}
