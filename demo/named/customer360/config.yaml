  - {name: sys_id, data_type: varchar, is_primary_key: true, description: 'The user''s ServiceNow record id', visible_to: [data_steward, customer_success]}
  - {name: first_name, data_type: varchar, description: Their first name as the service desk wrote it, visible_to: [data_steward, customer_success]}
  - {name: last_name, data_type: varchar, description: Their last name, visible_to: [data_steward, customer_success]}
