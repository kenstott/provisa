#
# The named demo "customer360" (start-ui-install.sh --demo customer360; REQ-1858). This file is its one
# start point: `docker compose up -d` brings up Halyard Software's customer master hub, loaded from
# db/init.sql (written by generate.py), with the role Provisa reads it as.
#
#   postgres  the customer master hub (schema mdm): master customers, the crosswalk to each
#             system's id, and when it last synced. Salesforce, ServiceNow, Jira and Stripe need no
#             service: the demo declares their rows (replica_rows/).
#
# Port: 30532 the database; it can be moved by its variable.
x-demo-labels: &demo-labels
  com.provisa.demo: customer360
name: provisa-demo-customer360
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    labels:
      <<: *demo-labels
      com.provisa.demo.role: rdb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: customer360
    ports:
      - "127.0.0.1:${CUSTOMER360_PG_PORT:-30532}:5432"
    volumes:
      - customer360_pg:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - ./db/reader.sql:/docker-entrypoint-initdb.d/20-reader.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d customer360"]
      interval: 2s
      timeout: 5s
      retries: 60

volumes:
  customer360_pg:
