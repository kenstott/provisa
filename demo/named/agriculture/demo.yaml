# The agriculture demo's card on provisa.dev's live demos page (REQ-2006), generated from this file
# by scripts/gen-site-demos.mjs. published: true once card.png, a screenshot of the demo in
# Provisa, is beside it.
title: Weather and crop insurance losses
description: >-
  A crop insurer's portfolio of Corn Belt farms, in its own database, joined by county and crop year
  to the USDA's crop insurance losses by cause, NOAA's daily weather and NASS's county yields from
  government data: does weather explain the losses in our portfolio?
screenshot: card.png
published: true
group: public-data
# The oldest Provisa this demo's bundle runs on (REQ-2049): a puller running an older one is refused
# by name. The first release carrying the demo.
requires_provisa: 0.1.0a489
# The demo's video: its tagline names what the demo shows Provisa being.
video:
  tagline: "Public/Private Data Workbench"
