#
# What the reproduce demo runs once, in order, after the server is up (REQ-2016;
# scripts/run_demo_setup.py):
#
#   command  a command of config.yaml, called as org_admin with no arguments
#   refresh  a view of config.yaml with materialize: true, whose stored rows are built
#
# The first step that fails stops the run, naming the step. A demo with nothing to run deletes
# this file.
#
# The report is filed as the book was first booked, then the back office corrects a rate and the
# report is built again: two versions of the rates desk's 30 September figure, each recorded when
# Provisa built it. Reset first, so every start files the original before the correction.
steps:
- command: reset_fx_rate
- refresh: exposure
- command: correct_fx_rate
- refresh: exposure
