# The reproduce demo's card on provisa.dev's live demos page (REQ-2006), generated from this file
# by scripts/gen-site-demos.mjs. published: true once card.png, a screenshot of the demo in
# Provisa, is beside it.
title: Reproduce a report
description: >-
  A bank's exposure report, reproduced for its regulator from a live trading book: where a figure
  came from, column by column and refresh by refresh, and the report as it was filed, untouched by
  a correction recorded since. Every read of it is in the audit log.
screenshot: card.png
published: true
# The oldest Provisa this demo's bundle runs on (REQ-2049): a puller running an older one is refused
# by name. The first release carrying the demo.
requires_provisa: 0.1.0a491
# The demo's video: its tagline names what the demo shows Provisa being.
video:
  tagline: "Reproducible Reporting"
