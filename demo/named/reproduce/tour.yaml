#
# The reproduce demo's own tour (REQ-2010): the story of the demo, told with its own data. The step
# kinds and what each names are listed in demo/named/weblogs/tour.yaml; every name here is checked
# against the demo by tests/unit/test_named_demo_tour.py, and the words of each step are
# tour.steps.<key> in the UI's tour.json, in every language.
#
# The track: a regulator's question (where did this figure come from, and what did the report say
# when it was filed); the book and the report built from it; the figure's lineage to its source
# columns, and the refresh that built it; what renaming a source column would break; the report
# now; the report as of 30 September as recorded now, then as recorded when it was filed -- the
# time the report was first built and filed, taken from the refreshes step's answer (the report's
# recorded time is when the book entered or changed a figure, REQ-2109: the filed figures were
# entered before that first build and the correction after it, so the time falls between them);
# and the audit log of who read it, with the times they read it as of.
landing:
  route: /sql
  capability: query_development
steps:
- key: reproduceScenario
  route: /sources
  capability: source_registration
  source: reproduce-db
- key: reproduceBook
  route: /tables
  capability: table_registration
  table: reproduce-db.positions
- key: reproduceLineage
  route: /lineage
  capability: view_governance
  lineage: >-
    SELECT e.desk, e.exposure FROM "reproduce"."view_exposure" AS e
- key: reproduceRefreshes
  route: /sql
  capability: query_development
  sql: >-
    SELECT r.refreshed_at, r.definition_version, r.input_version, r.input_version_kind
    FROM "ops"."mv_refresh_lineage" AS r
    WHERE r.mv_id = 'view-view_exposure'
    ORDER BY r.refreshed_at
- key: reproduceImpact
  route: /tables
  capability: table_registration
  table: reproduce-db.positions
- key: reproduceNow
  route: /sql
  capability: query_development
  sql: >-
    SELECT e.desk, e.exposure, e.valid_from, e.recorded_at
    FROM "reproduce"."view_exposure" AS e
    ORDER BY e.desk
- key: reproduceAsOf
  as_of: "2026-09-30T12:00:00"
- key: reproduceAsOfNow
  sql: >-
    SELECT e.desk, e.exposure, e.recorded_at
    FROM "reproduce"."view_exposure" AS e
    ORDER BY e.desk
- key: reproduceAsFiled
  as_recorded_from: {step: reproduceRefreshes, row: 0, column: refreshed_at}
- key: reproduceFiled
  sql: >-
    SELECT e.desk, e.exposure, e.recorded_at
    FROM "reproduce"."view_exposure" AS e
    ORDER BY e.desk
- key: reproduceAudit
  sql: >-
    SELECT q.logged_at, q.user_name, q.role_id, q.as_of, q.as_recorded, q.table_names
    FROM "ops"."query_audit_log" AS q
    WHERE q.as_of IS NOT NULL
    ORDER BY q.logged_at DESC
    LIMIT 20
- key: reproduceRecap
  route: /tables
  capability: table_registration
  table: reproduce-db.positions
