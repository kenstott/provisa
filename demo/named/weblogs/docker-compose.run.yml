#
# The weblogs demo where it runs from its bundle (start-ui-install.sh --demo weblogs; REQ-2049):
# only the shop's database, loaded from the dump the bundle build wrote (dump/postgres.sql). The
# shop, nginx and the seeder ran once, in the build; their logs are the bundle's logs/. The shop
# database is read live (config.yaml shop-db), so it runs here.

x-demo-labels: &demo-labels
  com.provisa.demo: weblogs

name: provisa-demo-weblogs-run

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    labels:
      <<: *demo-labels
      com.provisa.demo.role: rdb
      # Where config.yaml's shop-db reads it, for the sandbox tier's node (REQ-2049,
      # scripts/demo_stores_sync.sh): it writes these two into the bundle's stores.env.
      com.provisa.demo.host_env: WEBLOGS_PG_HOST
      com.provisa.demo.port_env: WEBLOGS_PG_PORT
      com.provisa.demo.port: "5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shop
    ports:
      # Unset: 28432, as start-ui-install.sh --demo weblogs reads it. Set empty (the node, which
      # runs several versions at once): a port docker picks. On the loopback only: whatever reads
      # it from outside the compose network runs on this host.
      - "127.0.0.1:${WEBLOGS_PG_PORT-28432}:5432"
    volumes:
      - weblogs_run_pg:/var/lib/postgresql/data
      - ./dump/postgres.sql:/docker-entrypoint-initdb.d/10-shop.sql:ro
      - ./db/reader.sql:/docker-entrypoint-initdb.d/20-reader.sql:ro
      - ./db/init-complete.sh:/docker-entrypoint-initdb.d/99-complete.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/lib/postgresql/data/.provisa-init-complete && pg_isready -U postgres -d shop"]
      interval: 2s
      timeout: 5s
      retries: 60
      # The first start loads the dump before the marker is written; failures meanwhile do
      # not count.
      start_period: 600s

volumes:
  weblogs_run_pg:
