# The storefront demo's card on provisa.dev's live demos page (REQ-2006), generated from this file
# by scripts/gen-site-demos.mjs. published: true once card.png, a screenshot of the demo in
# Provisa, is beside it.
title: One model, app and BI
description: >-
  A retailer's order-history screen and its BI dashboard read one model of PostgreSQL, MongoDB and
  an internal REST service. The app asks one nested GraphQL query as the signed-in customer; Apache
  Superset charts revenue and late shipments over the PostgreSQL wire protocol as the analyst.
screenshot: card.png
published: true
# The oldest Provisa this demo's bundle runs on (REQ-2049): a puller running an older one is refused
# by name. The first release carrying the demo.
# The first release carrying the demo and what it needs: its tour's image steps, the pgwire catalog's
# constraint definitions and virtual columns, and JSON:API's composite ids.
requires_provisa: 0.1.0a491
# The demo's video: its tagline names what the demo shows Provisa being.
video:
  tagline: "One Model, Many Clients"
