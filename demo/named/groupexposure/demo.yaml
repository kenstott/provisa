# The groupexposure demo's card on provisa.dev's live demos page (REQ-2006), generated from this file
# by scripts/gen-site-demos.mjs. published: true
# Provisa, is beside it.
title: Group exposure through Wikidata
description: >-
  A Prague bank's corporate loan book, in its own database, joined by each borrower's owner's Legal
  Entity Identifier to Wikidata's chains of parent organizations over SPARQL: which corporate groups
  is the bank over its 25% large-exposure limit to? The bank, its borrowers and its loans are
  fictional; the groups that own them are real.
screenshot: card.png
published: true
group: public-data
# The oldest Provisa this demo's bundle runs on (REQ-2049): a puller running an older one is refused
# by name. The first release carrying the demo.
requires_provisa: 0.1.0a495
# The demo's video: its tagline names what the demo shows Provisa being.
video:
  tagline: "Knowledge Graphs Are Tables!"
