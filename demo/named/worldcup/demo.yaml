title: World Cup, one graph
description: >-
  Wikipedia's finals and confederation tables and Kaggle's match and goal datasets disagree on
  country names. A short Python function matches every name with an LLM, and the four public
  sources become one governed graph, with West Germany's titles counted as Germany's.
screenshot: card.png
published: true
# The oldest Provisa this demo's bundle runs on (REQ-2049): the first release carrying the demo.
requires_provisa: 0.1.0a493
