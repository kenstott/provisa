[project]
name = "country-alias"
version = "1.0.0"
description = "The FIFA member a team's name stands for, matched by an LLM"
requires-python = ">=3.12"
dependencies = ["anthropic==1.11.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["country_alias.py"]
