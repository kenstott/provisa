- source_id: wikipedia
  domain_id: worldcup
  schema: wikipedia
  table: list_of_fifa_world_cup_finals__list_of_fifa_world_cup_finals
  alias: finals
  description: 'Every FIFA World Cup final from 1930 to 2026, as Wikipedia lists it: the winners and runners-up
    by the names of their day (West Germany), the score, venue and crowd'
