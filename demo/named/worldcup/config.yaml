#
# The WHOLE config of the named demo "worldcup" (start-ui-install.sh --demo worldcup; REQ-2103).
# Public sources about the World Cup whose country names disagree become one governed graph.
#
#   wikipedia        Wikipedia's List of FIFA World Cup finals and the six confederation articles,
#                    crawled; each data table a table named as the crawl names it
#   kaggle_worldcup  Kaggle's FIFA World Cup dataset: tournaments, matches, players
#   kaggle_results   Kaggle's international results dataset: every goal since 1916
#   country_alias    a Python function (code/country_alias.tar.gz) that matches each team name to the
#                    FIFA member it stands for with an LLM; the relationships across sources join
#                    through it
#
# Every source is landed once from the rows the demo declares (replica_rows/, cache_ttl -1), so a
# start fetches no page, downloads no dataset and runs no function. country_alias's rows are its
# output from a real run, each one reviewed and corrected before they were declared.
auth:
  assignments_source: provisa
  default_assignments:
  - domain_id: '*'
    role_id: org_admin
  provider: none
cache:
  default_ttl: 300
  enabled: true
domains:
- id: worldcup
  description: 'The FIFA World Cup from public sources: Wikipedia''s finals and confederation members, Kaggle''s
    matches, players and goals, made to agree on country names'
federation_engine: duckdb
naming:
  domain_prefix: true
  rules: []
roles:
- id: fan
  description: Reads the World Cup domain's tables, views and graph.
  capabilities:
  - query_development
  domain_access:
  - worldcup
server:
  limits:
    default_row_limit: 1000
    request_timeout: 60
    trino_query_timeout: 120
sources:
- id: wikipedia
  type: files
  cache_ttl: -1
  replicate: 0
  federation_hints:
    brand: wikipedia
  mapping:
    crawl:
      start_urls:
      - https://en.wikipedia.org/wiki/List_of_FIFA_World_Cup_finals
      - https://en.wikipedia.org/wiki/Asian_Football_Confederation
      - https://en.wikipedia.org/wiki/Confederation_of_African_Football
      - https://en.wikipedia.org/wiki/CONCACAF
      - https://en.wikipedia.org/wiki/CONMEBOL
      - https://en.wikipedia.org/wiki/Oceania_Football_Confederation
      - https://en.wikipedia.org/wiki/UEFA
      max_depth: 0
      max_pages: 7
      request_delay: 1 seconds
      html_cache_ttl: 1 days
      user_agent: Provisa/0.1.0 (+https://provisa.dev) file-crawler
      content_selector: '#mw-content-text .mw-parser-output'
      remove_selectors:
      - .navbox
      - .navbox-styles
      - .sidebar
      - .hatnote
      - .infobox
      - .reflist
      - .references
      - .mw-references-wrap
      - .refbegin
      - sup.reference
      - cite
      - .citation
      - .cs1-maint
      - .cs1-hidden-error
      - .cs1-visible-error
      - .mw-editsection
      - .metadata
      - .ambox
      - .noprint
      - .catlinks
      - .toc
      - .thumb
      - figure
      - .gallery
      - .side-box
      - .sistersitebox
      - .portalbox
      - .authority-control
      - .shortdescription
      - .sortkey
      - style
      - '#coordinates'
      - section[aria-labelledby='See_also']
      link_selector: a[rel='mw:WikiLink']:not(.new):not(.mw-selflink):not(.mw-magiclink-isbn)
      follow_external_links: false
      table_selector: table.wikitable
      html_table_min_rows: 2
      allowed_file_extensions:
      - csv
      - tsv
      - xlsx
      - xls
      - json
      - parquet
  description: 'Wikipedia: the List of FIFA World Cup finals and the six confederation articles, crawled at depth
    0; each data table becomes a table named by its page and caption'
- id: kaggle_worldcup
  type: files
  cache_ttl: -1
  replicate: 0
  federation_hints:
    kaggle_owner: abecklas
    kaggle_ref: fifa-world-cup
  description: 'Kaggle''s FIFA World Cup dataset (abecklas/fifa-world-cup): WorldCups.csv, WorldCupMatches.csv and
    WorldCupPlayers.csv, 1930 to 2014'
- id: kaggle_results
  type: files
  cache_ttl: -1
  replicate: 0
  federation_hints:
    kaggle_owner: martj42
    kaggle_ref: international-football-results-from-1872-to-2017
  description: 'Kaggle''s international football results dataset (martj42/international-football-results-from-1872-to-2017):
    goalscorers.csv'
- id: country_alias
  type: python
  cache_ttl: -1
  replicate: 0
  mapping:
    runtime: python
    code:
      kind: upload
      upload: bbca888c502cb34a0c1b9ab5ac9ed50e6797c12bb9125b6559721de650ec3578
      filename: country_alias.tar.gz
    content_hash: bbca888c502cb34a0c1b9ab5ac9ed50e6797c12bb9125b6559721de650ec3578
  description: 'country_alias(name): matches a team''s name to the FIFA member it stands for with an LLM (code/country_alias.tar.gz,
    its source in country_alias/)'
