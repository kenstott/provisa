    description: The year of the final
  - name: winners
    data_type: varchar
    visible_to: *id001
    description: The winning team, by its name that year
  - name: score
    data_type: varchar
    visible_to: *id001
    description: The score; a dagger marks extra time and an asterisk a penalty shoot-out
  - name: runners_up
    data_type: varchar
    visible_to: *id001
