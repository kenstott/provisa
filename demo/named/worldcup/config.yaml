views:
- id: countries
  domain_id: worldcup
  enable_aggregates: true
  enable_group_by: true
  description: Every member association of the six confederations, by its FIFA code, its name on Wikipedia and its
    confederation
  sql: SELECT "code" AS code, "association" AS country, 'AFC' AS confederation FROM "worldcup"."afc_members" UNION
    ALL SELECT "code_union_of_north_african_football__unaf__5" AS code, "association_union_of_north_african_football__unaf__5"
    AS country, 'CAF' AS confederation FROM "worldcup"."caf_members" UNION ALL SELECT "code_north_american_zone__nafu__3"
    AS code, "association_north_american_zone__nafu__3" AS country, 'CONCACAF' AS confederation FROM "worldcup"."concacaf_members"
    UNION ALL SELECT "code" AS code, "association" AS country, 'CONMEBOL' AS confederation FROM "worldcup"."conmebol_members"
    UNION ALL SELECT "code" AS code, "association" AS country, 'OFC' AS confederation FROM "worldcup"."ofc_members"
    UNION ALL SELECT "code" AS code, "association" AS country, 'UEFA' AS confederation FROM "worldcup"."uefa_members"
  columns:
  - name: code
    data_type: varchar
    visible_to: *id001
    description: The member's three-letter FIFA code
  - name: country
    data_type: varchar
    visible_to: *id001
    description: The member, by the name Wikipedia gives it
  - name: confederation
    data_type: varchar
    visible_to: *id001
    description: 'Its confederation: AFC, CAF, CONCACAF, CONMEBOL, OFC or UEFA'
- id: team_names
  domain_id: worldcup
  description: 'Every team name the two sources write, once each: what country_alias is given to match'
  sql: SELECT DISTINCT name FROM (SELECT winners AS name FROM "worldcup"."finals" UNION ALL SELECT runners_up FROM
    "worldcup"."finals" UNION ALL SELECT country FROM "worldcup"."world_cups" UNION ALL SELECT winner FROM "worldcup"."world_cups"
    UNION ALL SELECT runners_up FROM "worldcup"."world_cups" UNION ALL SELECT third FROM "worldcup"."world_cups"
    UNION ALL SELECT fourth FROM "worldcup"."world_cups" UNION ALL SELECT home_team_name FROM "worldcup"."matches"
    UNION ALL SELECT away_team_name FROM "worldcup"."matches" UNION ALL SELECT team FROM "worldcup"."goalscorers")
    AS n WHERE name IS NOT NULL
  columns:
  - name: name
    data_type: varchar
    visible_to: *id001
    description: A team's name, as a source writes it
- id: goals
  domain_id: worldcup
  description: Each player's appearance in which they scored, own goals left out
  sql: SELECT match_id, player_name, team_initials, event FROM "worldcup"."players" WHERE event LIKE '%G%' AND event
    NOT LIKE '%OG%'
  columns:
  - name: match_id
    data_type: integer
    visible_to: *id001
    description: The match
  - name: player_name
    data_type: varchar
    visible_to: *id001
    description: The scorer
  - name: team_initials
    data_type: varchar
    visible_to: *id001
    description: The scorer's team, by its FIFA code that year
  - name: event
    data_type: varchar
    visible_to: *id001
    description: The goals, each a G with its minute
