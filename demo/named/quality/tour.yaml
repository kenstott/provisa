#
# The quality demo's own tour (REQ-2010, REQ-2051): what the demo is and its question; how it fits --
# the source, bronze with its raw fields, the checks computed on every landed batch, the relationship
# from a silver row to the checks that admitted it -- each step on a real row; then the answers:
# which checks admitted silver, what the bad batch failed on, what silver cleaned, and gold; the data
# product consumers are given (gold, silver and the checks); then a recap. Step kinds and checks are as tour.yaml of the weblogs demo describes them.
# Where the tour's "Look around on my own" leaves the visitor: the SQL page.
landing:
  route: /sql
  capability: query_development
steps:
- key: qualityIntro
  route: /sources
  capability: source_registration
  source: sales
- key: qualityBronze
  route: /tables
  capability: table_registration
  table: sales.bronze
  # Its detail panel: its probe is shown in its load section.
  open: load
- key: qualityRaw
  route: /sql
  capability: query_development
  sql: >-
    SELECT product, COUNT(*) AS lines FROM "sales"."bronze" WHERE batch_id = 1
    GROUP BY product ORDER BY product
- key: qualityChecks
  route: /sql
  capability: query_development
  sql: >-
    SELECT batch_id, run_id, check_name, failing_rows, outcome FROM "sales"."view_dq_results"
    ORDER BY batch_id, check_name
- key: qualityAdmitted
  route: /relationships
  capability: create_relationship
  relationship: ADMITTED_BY
- key: qualityWhichChecks
  route: /query
  capability: query_development
  example: 1-checks-that-admitted-silver
- key: qualityRefused
  route: /sql
  capability: query_development
  sql: >-
    SELECT line_id, sale_id, store, quantity, unit_price FROM "sales"."bronze"
    WHERE batch_id = 2 AND (UPPER(TRIM(store)) NOT IN ('S-01', 'S-02', 'S-03', 'S-04', 'S-05')
    OR quantity <= 0 OR NOT REGEXP_LIKE(REPLACE(TRIM(unit_price), '$', ''), '^[0-9]+([.][0-9]{1,2})?$'))
    ORDER BY line_id
- key: qualitySilver
  route: /sql
  capability: query_development
  sql: >-
    SELECT sale_id, store_id, product, sale_day, quantity, unit_price, amount, run_id
    FROM "sales"."view_silver" ORDER BY sale_id LIMIT 20
- key: qualityGold
  route: /sql
  capability: query_development
  sql: >-
    SELECT sale_day, product, sales, items, revenue, min_price, max_price FROM "sales"."view_gold"
    ORDER BY revenue DESC
- key: qualityProduct
  route: /data-products
  capability: data_product_read
  product: daily_sales
- key: qualityDone
  route: /sources
  capability: source_registration
  source: sales
