#
# The WHOLE config of the named demo "quality" (start-ui-install.sh --demo quality; REQ-2051): can
# this data be trusted before it reaches gold? A chain of five shops sends its sales as a feed, a
# batch a day, landed into bronze in the demo's own Postgres (docker-compose.yml's seeder runs
# sales.land_batch). Everything after bronze is a materialized view, kept current by the product's
# own cascade: a landing changes bronze, which refreshes dq_results, then silver, then gold.
#
#   bronze      every batch landed, read live: the well-formed fields typed on landing, the messy
#               ones (shop code, product, price) as the feed spelled them
#   dq_results  the checks, computed in SQL on every batch: per batch and check, how many rows fail
#               it, pass or fail, under the batch's run id
#   silver      bronze cleaned -- codes trimmed and upper-cased, product spellings made one, the
#               price cast to a number, the day derived, a resent sale kept once at its latest --
#               from the batches whose checks all passed only, the run id on every row
#   gold        totals by day and product: one GROUP BY over silver
#
# A batch that fails any check shows in dq_results as failed and never reaches silver or gold; the
# batches before it stay.
auth:
  assignments_source: provisa
  default_assignments:
  - domain_id: '*'
    role_id: org_admin
  provider: none
cache:
  default_ttl: 300
  enabled: true
data_products:
# What the chain's consumers are given: gold to read, silver for the row-level detail behind it, and
# dq_results as the evidence each batch passed its checks. Bronze, the raw landing, stays out.
- id: daily_sales
  domain_id: sales
  name: Daily Sales
  owner_role: org_admin
  purpose: The chain's sales by day and product, from feed batches that passed every check
  usage: Read gold for totals by day and product; read silver for the sales behind a total, and
    dq_results for the checks that admitted each batch
  limitations: A batch that fails any check is held out whole, so a day it covers shows no sales until
    a corrected batch lands
  sla: Refreshed each time a batch lands; a batch reaches silver only once its checks pass
  support_contact: kennethstott@gmail.com
domains:
- id: sales
  description: A chain of five shops' daily sales feed, landed into bronze and refined through
    checked materialized views into silver and gold
federation_engine: duckdb
naming:
  domain_prefix: true
  rules: []
roles: []
server:
  limits:
    default_row_limit: 100
    request_timeout: 120
    trino_query_timeout: 120
sources:
- id: sales
  type: postgresql
  host: ${env:QUALITY_PG_HOST:-localhost}
  port: ${env:QUALITY_PG_PORT:-28632}
  database: sales${env:QUALITY_PG_NS}
  username: provisa
  password: provisa
  description: The chain's sales database, where the feed lands
tables:
- source_id: sales
  domain_id: sales
  schema: sales
  table: store
  description: The chain's shops
  columns:
  - {name: store_id, data_type: varchar, is_primary_key: true, description: 'The shop''s code, such as S-01', visible_to: [org_admin]}
  - {name: name, data_type: varchar, description: The shop's name, visible_to: [org_admin]}
  - {name: region, data_type: varchar, description: The region the shop is in, visible_to: [org_admin]}
- source_id: sales
  domain_id: sales
  schema: sales
  table: bronze
  # A landing appends: the probe reads the latest landed_at, and a new one is a change that
  # refreshes the views over bronze.
  watermark_column: landed_at
  change_signal: probe
  cache_ttl: 10
  enable_aggregates: true
  enable_group_by: true
  description: 'Bronze: every batch landed, as delivered and never changed; the well-formed fields typed
    on landing, the messy ones kept as the feed spelled them'
  columns:
  - {name: line_id, data_type: integer, is_primary_key: true, description: The line of the feed, visible_to: [org_admin]}
  - {name: batch_id, data_type: integer, description: The day's batch, visible_to: [org_admin]}
  - {name: landed_at, data_type: timestamp, description: When the batch landed in bronze, visible_to: [org_admin]}
  - {name: sale_id, data_type: varchar, description: The sale's id, visible_to: [org_admin]}
  - {name: sold_at, data_type: timestamp, description: When it was sold, visible_to: [org_admin]}
  - {name: quantity, data_type: integer, description: How many were sold, visible_to: [org_admin]}
  - {name: store, data_type: varchar, description: 'The shop''s code as the feed spelled it, such as " s-01"', visible_to: [org_admin]}
  - {name: product, data_type: varchar, description: 'The product as the feed spelled it, such as "COFFEE" or "cofee"', visible_to: [org_admin]}
  - {name: unit_price, data_type: varchar, description: 'The price of one as the feed wrote it, such as "$4.50" or "4.5"', visible_to: [org_admin]}
views:
# The checks: per batch and check, how many of the batch's rows fail it; a batch passes when every
# check has none.
- id: dq_results
  domain_id: sales
  product_id: daily_sales
  materialize: true
  enable_aggregates: true
  enable_group_by: true
  description: Every check on every landed batch, in SQL; per batch and check, how many rows fail it,
    pass or fail, under the batch's run id
  sql: >-
    SELECT c.batch_id, CONCAT('dq-b', CAST(c.batch_id AS VARCHAR)) AS run_id, c.check_name,
      c.definition, c.failing_rows,
      CASE WHEN c.failing_rows = 0 THEN 'pass' ELSE 'fail' END AS outcome
    FROM (
      SELECT batch_id, 'sale_id_present' AS check_name, 'every sale has an id' AS definition,
        SUM(CASE WHEN TRIM(sale_id) = '' THEN 1 ELSE 0 END) AS failing_rows
      FROM "sales"."bronze" GROUP BY batch_id
      UNION ALL
      SELECT batch_id, 'store_known' AS check_name,
        'every shop code, trimmed and upper-cased, is one of the chain''s shops' AS definition,
        SUM(CASE WHEN UPPER(TRIM(store)) IN ('S-01', 'S-02', 'S-03', 'S-04', 'S-05') THEN 0 ELSE 1 END) AS failing_rows
      FROM "sales"."bronze" GROUP BY batch_id
      UNION ALL
      SELECT batch_id, 'quantity_positive' AS check_name, 'every quantity is above zero' AS definition,
        SUM(CASE WHEN quantity > 0 THEN 0 ELSE 1 END) AS failing_rows
      FROM "sales"."bronze" GROUP BY batch_id
      UNION ALL
      SELECT batch_id, 'price_is_a_number' AS check_name,
        'every price, its dollar sign dropped, is a number with at most two decimals' AS definition,
        SUM(CASE WHEN REGEXP_LIKE(REPLACE(TRIM(unit_price), '$', ''), '^[0-9]+([.][0-9]{1,2})?$') THEN 0 ELSE 1 END) AS failing_rows
      FROM "sales"."bronze" GROUP BY batch_id
    ) AS c
  columns:
  - {name: batch_id, data_type: integer, description: The batch checked, visible_to: [org_admin]}
  - {name: run_id, data_type: varchar, description: 'The batch''s check run, such as dq-b1', visible_to: [org_admin]}
  - {name: check_name, data_type: varchar, description: The check, visible_to: [org_admin]}
  - {name: definition, data_type: varchar, description: What the check asks of every row, visible_to: [org_admin]}
  - {name: failing_rows, data_type: bigint, description: How many rows of the batch fail the check, visible_to: [org_admin]}
  - {name: outcome, data_type: varchar, description: 'pass, or fail when any row fails it', visible_to: [org_admin]}
# Silver: bronze cleaned, from the batches whose checks all passed.
- id: silver
  domain_id: sales
  product_id: daily_sales
  materialize: true
  enable_aggregates: true
  enable_group_by: true
  description: 'Silver: the sales of every batch whose checks all passed, cleaned -- codes trimmed and
    upper-cased, one spelling a product, the price a number, the day derived, a resent sale kept once at
    its latest -- with the run id that admitted them'
  sql: >-
    SELECT sale_id, batch_id, run_id, store_id, product, sold_at, sale_day, quantity, unit_price,
      quantity * unit_price AS amount
    FROM (
      SELECT TRIM(b.sale_id) AS sale_id, b.batch_id, p.run_id,
        UPPER(TRIM(b.store)) AS store_id,
        CASE LOWER(TRIM(b.product))
          WHEN 'cofee' THEN 'coffee' WHEN 'muffins' THEN 'muffin' WHEN 'sandwhich' THEN 'sandwich'
          ELSE LOWER(TRIM(b.product)) END AS product,
        b.sold_at, CAST(b.sold_at AS DATE) AS sale_day, b.quantity,
        CAST(REPLACE(TRIM(b.unit_price), '$', '') AS DECIMAL(8, 2)) AS unit_price,
        ROW_NUMBER() OVER (PARTITION BY TRIM(b.sale_id) ORDER BY b.line_id DESC) AS version
      FROM "sales"."bronze" AS b
      JOIN (
        SELECT batch_id, MIN(run_id) AS run_id FROM "sales"."view_dq_results"
        GROUP BY batch_id HAVING SUM(CASE WHEN outcome = 'fail' THEN 1 ELSE 0 END) = 0
      ) AS p ON p.batch_id = b.batch_id
    ) AS s
    WHERE version = 1
  columns:
  - {name: sale_id, data_type: varchar, description: The sale's id, visible_to: [org_admin]}
  - {name: batch_id, data_type: integer, description: The batch it came in, visible_to: [org_admin]}
  - {name: run_id, data_type: varchar, description: The check run that admitted the batch, visible_to: [org_admin]}
  - {name: store_id, data_type: varchar, description: 'The shop''s code, trimmed and upper-cased', visible_to: [org_admin]}
  - {name: product, data_type: varchar, description: 'The product, one spelling each', visible_to: [org_admin]}
  - {name: sold_at, data_type: timestamp, description: When it was sold, visible_to: [org_admin]}
  - {name: sale_day, data_type: date, description: The day it was sold, visible_to: [org_admin]}
  - {name: quantity, data_type: integer, description: 'How many, as the latest line of the sale says', visible_to: [org_admin]}
  - {name: unit_price, data_type: 'decimal(8,2)', description: 'The price of one, as a number', visible_to: [org_admin]}
  - {name: amount, data_type: 'decimal(18,2)', description: Quantity times unit price, visible_to: [org_admin]}
# Gold: totals by day and product, one GROUP BY over silver.
- id: gold
  domain_id: sales
  product_id: daily_sales
  materialize: true
  enable_aggregates: true
  enable_group_by: true
  description: 'Gold: totals by day and product over silver -- sales, items, revenue and the price range'
  sql: >-
    SELECT sale_day, product, COUNT(*) AS sales, SUM(quantity) AS items, SUM(amount) AS revenue,
      MIN(unit_price) AS min_price, MAX(unit_price) AS max_price
    FROM "sales"."view_silver"
    GROUP BY sale_day, product
  columns:
  - {name: sale_day, data_type: date, description: The day, visible_to: [org_admin]}
  - {name: product, data_type: varchar, description: The product, visible_to: [org_admin]}
  - {name: sales, data_type: bigint, description: How many sales, visible_to: [org_admin]}
  - {name: items, data_type: bigint, description: How many items they sold, visible_to: [org_admin]}
  - {name: revenue, data_type: 'decimal(38,2)', description: What they took, visible_to: [org_admin]}
  - {name: min_price, data_type: 'decimal(8,2)', description: The lowest price paid, visible_to: [org_admin]}
  - {name: max_price, data_type: 'decimal(8,2)', description: The highest price paid, visible_to: [org_admin]}
relationships:
- {id: batch-checks, alias: CHECKED_BY, cardinality: one-to-many, source_table_id: bronze, source_column: batch_id, target_table_id: view_dq_results, target_column: batch_id}
- {id: silver-checks, alias: ADMITTED_BY, cardinality: one-to-many, source_table_id: view_silver, source_column: run_id, target_table_id: view_dq_results, target_column: run_id}
- {id: silver-store, alias: SOLD_AT, cardinality: many-to-one, source_table_id: view_silver, source_column: store_id, target_table_id: store, target_column: store_id}
# The rows of one batch: silver joins bronze to the checks computed over bronze, by batch.
- {id: batch-rows, alias: IN_BATCH, cardinality: one-to-many, source_table_id: bronze, source_column: batch_id, target_table_id: bronze, target_column: batch_id}
