# The quality demo's card on provisa.dev's live demos page (REQ-2006, REQ-2051).
title: Data you can trust
description: >-
  A chain of shops' daily sales feed, landed into bronze and refined into silver and gold by
  materialized views that check every batch: landing a batch is all it takes, a clean batch
  reaches gold, and a bad one is shown failed and never reaches silver.
screenshot: card.png
published: true
group: provision
# The oldest Provisa this demo's bundle runs on (REQ-2049): the first release with a live table
# watched for its views (REQ-2055) and their refresh read as fresh (#268).
requires_provisa: 0.1.0a489
# The demo's video: its tagline names what the demo shows Provisa being.
video:
  tagline: "Medallion Warehouse. We Got It."
