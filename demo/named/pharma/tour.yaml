#
# The pharma demo's own tour (REQ-2010): the story of the demo, told with its own data. The step
# kinds and what each names are listed in demo/named/weblogs/tour.yaml; every name here is checked
# against the demo by tests/unit/test_named_demo_tour.py, and the words of each step are
# tour.steps.<key> in the UI's tour.json, in every language.
#
# The track: the scenario (the pharmacy's question, and its two kinds of data); how the pieces fit
# (its own formulary, the public tables, the joins by NDC and by firm, the pharmacy's
# terms); the answer in SQL, in GraphQL and over REST, over the view that joins supply to risk; a
# recap.
# Where the tour's "Look around on my own" leaves the visitor: the SQL page, with its example queries.
landing:
  route: /sql
  capability: query_development
steps:
- key: pharmaScenario
  route: /sources
  capability: source_registration
  source: pharmacy
- key: pharmaGovdata
  source: govdata
- key: pharmaFormulary
  route: /tables
  capability: table_registration
  table: pharmacy.products
- key: pharmaShortages
  table: govdata.fda_drug_shortages
- key: pharmaJoin
  route: /relationships
  capability: create_relationship
  relationship: RECALLED_BY
- key: pharmaTerms
  route: /admin/ontology
  capability: glossary_read
  term: supply risk
- key: pharmaAnswer
  route: /sql
  capability: query_development
  sql: >-
    SELECT r.generic_name, r.manufacturer, r.product_ndc, r.risk, r.shortage_availability,
           r.worst_recall_class, r.days_of_supply, r.prescriptions_2023
    FROM "pharma"."view_product_risk" AS r
    WHERE r.risk <> 'none'
    ORDER BY r.critical DESC, r.days_of_supply
    LIMIT 15
- key: pharmaByRisk
  route: /query
  capability: query_development
  example: 1-products-by-risk
- key: pharmaRest
  route: /openapi
  capability: query_development
  api: GET /data/rest/pharma/view_product_risk?groupBy=risk&aggregate=count,sum
- key: pharmaRecap
  route: /sources
  capability: source_registration
  source: govdata
