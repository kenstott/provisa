#
# The named demo "pharma" (start-ui-install.sh --demo pharma; REQ-1858). This file is its one
# start point: `docker compose up -d` brings up its database.
#
#   postgres  the pharmacy's database: its formulary and stock, generated by db/init.sql, with
#             the role Provisa reads it as (db/reader.sql).
#
# The govdata tables have no container: they are landed from AskAmerica when the bundle is built.
#
# Port: 29532 the database; it can be moved by its variable.
x-demo-labels: &demo-labels
  com.provisa.demo: pharma
name: provisa-demo-pharma
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    labels:
      <<: *demo-labels
      com.provisa.demo.role: rdb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pharma
    ports:
      - "127.0.0.1:${PHARMA_PG_PORT:-29532}:5432"
    volumes:
      - pharma_pg:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - ./db/reader.sql:/docker-entrypoint-initdb.d/20-reader.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pharma"]
      interval: 2s
      timeout: 5s
      retries: 60

volumes:
  pharma_pg:
