#
# The pharma demo where it runs from its bundle (start-ui-install.sh --demo pharma; REQ-2049):
# the database, loaded from the dump the bundle build wrote (dump/postgres.sql), read only. The
# seeder ran once, in the build.

x-demo-labels: &demo-labels
  com.provisa.demo: pharma

name: provisa-demo-pharma-run

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    labels:
      <<: *demo-labels
      com.provisa.demo.role: rdb
      # Where config.yaml's pharmacy source reads it, for the sandbox tier's node (REQ-2049,
      # scripts/demo_stores_sync.sh): it writes these two into the bundle's stores.env.
      com.provisa.demo.host_env: PHARMA_PG_HOST
      com.provisa.demo.port_env: PHARMA_PG_PORT
      com.provisa.demo.port: "5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pharma
    ports:
      # Unset: 28832. Set empty (the node, which runs several versions at once): a port docker
      # picks. On the loopback only.
      - "127.0.0.1:${PHARMA_PG_PORT-28832}:5432"
    volumes:
      - pharma_run_pg:/var/lib/postgresql/data
      - ./dump/postgres.sql:/docker-entrypoint-initdb.d/10-pharma.sql:ro
      - ./db/reader.sql:/docker-entrypoint-initdb.d/20-reader.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pharma"]
      interval: 2s
      timeout: 5s
      retries: 60

volumes:
  pharma_run_pg:
