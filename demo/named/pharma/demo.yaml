# The pharma demo's card on provisa.dev's live demos page (REQ-2006), generated from this file
# by scripts/gen-site-demos.mjs. published: true
# Provisa, is beside it.
title: Drug shortage and recall risk
description: >-
  A hospital pharmacy's formulary and stock, in its own database, joined by NDC and manufacturer to
  FDA's drug shortages and recalls and to Medicaid's prescriptions from government data: which of
  our products face shortage or recall risk?
screenshot: card.png
published: true
group: public-data
# The oldest Provisa this demo's bundle runs on (REQ-2049): a puller running an older one is refused
# by name. The first release carrying the demo.
requires_provisa: 0.1.0a491
# The demo's video: its tagline names what the demo shows Provisa being.
video:
  tagline: "Supply Risk Radar"
