title: Data room for a sale
description: >-
  A retailer selling itself gives each bidder's clean team governed access to its own order system
  and CRM until the deal date, with no exports: aggregates, profiles, quality scores and masked
  samples, every statement audited. No customer identity leaves the room.
screenshot: card.png
published: true
group: provision
# The oldest Provisa this demo's bundle runs on (REQ-2049): a puller running an older one is refused
# by name. The first release carrying the demo.
requires_provisa: 0.1.0a492
# The demo's video: its tagline names what the demo shows Provisa being.
video:
  tagline: "Governed Data Room"
