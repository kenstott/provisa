#
# The named demo "dataroom" (start-ui-install.sh --demo dataroom; REQ-1858). This file is its one
# start point: `docker compose up -d` brings up its database, which db/init.sql fills.
#
#   postgres  Northfield Supply's order and finance system (db/init.sql), with the role Provisa
#             reads it as.
#
# Port: 30032 the database; it can be moved by its variable.
x-demo-labels: &demo-labels
  com.provisa.demo: dataroom
name: provisa-demo-dataroom
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    labels:
      <<: *demo-labels
      com.provisa.demo.role: rdb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dataroom
    ports:
      - "127.0.0.1:${DATAROOM_PG_PORT:-30032}:5432"
    volumes:
      - dataroom_pg:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - ./db/reader.sql:/docker-entrypoint-initdb.d/20-reader.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dataroom"]
      interval: 2s
      timeout: 5s
      retries: 60

volumes:
  dataroom_pg:
