#
# The WHOLE config of the named demo "dataroom" (start-ui-install.sh --demo dataroom; REQ-1858).
# Northfield Supply is selling itself. Instead of exporting extracts to a data room, it connects
# Provisa to its own systems and gives each prospective buyer's clean team (bidder_a, bidder_b)
# governed access until the deal date: aggregate views, profiles, quality scores and masked
# samples. No customer identity leaves the room.
#
#   finance        the order and finance system, Postgres, read live as provisa_reader (db/init.sql)
#   crm            the Salesforce CRM, its accounts and opportunities, landed once from
#                  replica_rows/crm/ (cache_ttl -1: nothing reads Salesforce)
#   room-profiler  the profile of its tables (setup.yaml profiles them once)
#
# A bidder reads every column but a customer's identity: the names of the customers, the CRM's
# businesses and their deals are the seller's alone, and each email and phone is masked.
auth:
  assignments_source: provisa
  default_assignments:
  - domain_id: '*'
    role_id: org_admin
  provider: none
cache:
  default_ttl: 300
  enabled: true
domains:
- id: dataroom
  description: 'Northfield Supply''s customers, orders and invoices, and what a prospective buyer''s clean
    team is shown of them: aggregates, profiles, quality scores and masked samples'
federation_engine: duckdb
naming:
  domain_prefix: true
  rules: []
roles:
- id: bidder_a
  description: 'Bidder A''s clean team: reads the data room''s aggregate views, profiles, quality scores
    and masked samples, never a customer''s identity. Granted until the deal date.'
  capabilities:
  - query_development
  domain_access:
  - dataroom
- id: bidder_b
  description: 'Bidder B''s clean team: reads the data room''s aggregate views, profiles, quality scores
    and masked samples, never a customer''s identity. Granted until the deal date.'
  capabilities:
  - query_development
  domain_access:
  - dataroom
server:
  limits:
    default_row_limit: 100
    request_timeout: 120
    trino_query_timeout: 120
sources:
- id: finance
  type: postgresql
  host: ${env:DATAROOM_PG_HOST:-localhost}
  port: ${env:DATAROOM_PG_PORT:-30032}
  database: dataroom${env:DATAROOM_PG_NS}
  username: provisa_reader
  password: provisa_reader
  description: 'Northfield Supply''s order and finance system: its customers, their orders and the invoices,
    read in place'
- id: crm
  type: salesforce
  base_url: ${env:SF_LOGIN_URL:-}
  username: ${env:SF_CONSUMER_KEY:-}
  password: ${env:SF_CONSUMER_SECRET:-}
  cache_ttl: -1
  replicate: 0
  description: 'Northfield Supply''s Salesforce CRM: its business accounts and their opportunities, landed
    once from the rows the demo declares'
- id: room-profiler
  type: data_profiler
  description: 'Profile of the order and invoice tables: what each column holds, its nulls, distinct values
    and ranges, and the duplicates in each table'
  mapping:
    cron: 0 2 * * *
    low_cardinality_max: 100
    drift_window: 7
    drift_season: none
    drift_distance: 3.0
    drift_slope: 3.0
    drift_ks: 0.2
    drift_psi: 0.25
    correlation_max_columns: 20
    joint_max_distinct: 20
    category_max_columns: 10
tables:
- source_id: finance
  domain_id: dataroom
  schema: public
  table: customers
  profiler_source_id: room-profiler
  description: 'Who each customer is and where they buy: a bidder reads every column but the name, with
    the email and phone masked'
  columns:
  - name: id
    data_type: integer
    description: The customer's number
    visible_to: &id001
    - org_admin
    - bidder_a
    - bidder_b
    is_primary_key: true
  - name: name
    data_type: varchar
    description: The customer's name; never shown to a bidder
    visible_to: &id002
    - org_admin
  - name: email
    data_type: varchar
    description: The customer's email address; its name part masked for a bidder
    visible_to: *id001
    masks:
    - to:
      - bidder_a
      - bidder_b
      mask:
        type: regex
        pattern: ^[^@]+
        replace: '***'
  - name: phone
    data_type: varchar
    description: The customer's phone number; its digits masked for a bidder
    visible_to: *id001
    masks:
    - to:
      - bidder_a
      - bidder_b
      mask:
        type: regex
        pattern: '[0-9]'
        replace: X
  - name: segment
    data_type: varchar
    description: consumer, small business or enterprise
    visible_to: *id001
  - name: region
    data_type: varchar
    description: northeast, south, midwest or west
    visible_to: *id001
  - name: first_order_date
    data_type: date
    description: The day of the customer's first order
    visible_to: *id001
- source_id: finance
  domain_id: dataroom
  schema: public
  table: orders
  profiler_source_id: room-profiler
  description: Every order since 2023
  columns:
  - name: id
    data_type: integer
    description: The order's number
    visible_to: *id001
    is_primary_key: true
  - name: customer_id
    data_type: integer
    description: The customer who placed it
    visible_to: *id001
  - name: ordered_at
    data_type: date
    description: The day it was placed
    visible_to: *id001
  - name: channel
    data_type: varchar
    description: web, store or marketplace
    visible_to: *id001
  - name: amount
    data_type: decimal
    description: The order's total in USD
    visible_to: *id001
