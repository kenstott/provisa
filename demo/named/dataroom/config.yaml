views:
- id: customer_counts
  domain_id: dataroom
  enable_aggregates: true
  enable_group_by: true
  description: How many customers each segment and region has, and how many of them ordered in the last
    twelve months
  sql: SELECT c.segment, c.region, COUNT(*) AS customers, COUNT(*) FILTER (WHERE c.id IN (SELECT o.customer_id
    FROM "dataroom"."orders" AS o WHERE o.ordered_at > DATE '2025-09-30')) AS active_customers FROM "dataroom"."customers"
    AS c GROUP BY c.segment, c.region
  columns:
  - name: segment
    data_type: varchar
    description: The customers' segment
    visible_to: *id003
  - name: region
    data_type: varchar
    description: The customers' region
    visible_to: *id003
  - name: customers
    data_type: bigint
    description: Customers in the segment and region
    visible_to: *id003
  - name: active_customers
    data_type: bigint
    description: Of them, those who ordered in the twelve months to 2026-09-30
    visible_to: *id003
- id: cohorts
  domain_id: dataroom
  enable_aggregates: true
  enable_group_by: true
  description: 'Each quarterly cohort of new customers: how many of them still ordered in each later quarter,
    and what they spent'
  sql: SELECT CAST(EXTRACT(YEAR FROM c.first_order_date) AS INTEGER) * 10 + CAST(EXTRACT(QUARTER FROM
    c.first_order_date) AS INTEGER) AS cohort, (CAST(EXTRACT(YEAR FROM o.ordered_at) AS INTEGER) * 4 +
    CAST(EXTRACT(QUARTER FROM o.ordered_at) AS INTEGER)) - (CAST(EXTRACT(YEAR FROM c.first_order_date)
    AS INTEGER) * 4 + CAST(EXTRACT(QUARTER FROM c.first_order_date) AS INTEGER)) AS quarters_since, COUNT(DISTINCT
    c.id) AS active_customers, SUM(o.amount) AS revenue FROM "dataroom"."customers" AS c JOIN "dataroom"."orders"
    AS o ON o.customer_id = c.id GROUP BY 1, 2
  columns:
  - name: cohort
    data_type: integer
    description: The quarter of the customers' first order, as year and quarter (20231 is 2023 Q1)
    visible_to: *id003
  - name: quarters_since
    data_type: integer
    description: Quarters after the first order
    visible_to: *id003
  - name: active_customers
    data_type: bigint
    description: Customers of the cohort who ordered in that quarter
    visible_to: *id003
  - name: revenue
    data_type: decimal
    description: What they spent in that quarter, in USD
    visible_to: *id003
- id: revenue_by_segment
  domain_id: dataroom
  enable_aggregates: true
  enable_group_by: true
  description: Revenue, orders and the average order of each segment, by year
  sql: SELECT CAST(EXTRACT(YEAR FROM o.ordered_at) AS INTEGER) AS year, c.segment, COUNT(*) AS orders,
    SUM(o.amount) AS revenue, ROUND(AVG(o.amount), 2) AS average_order FROM "dataroom"."orders" AS o JOIN
    "dataroom"."customers" AS c ON c.id = o.customer_id GROUP BY 1, 2
  columns:
  - name: year
    data_type: integer
    description: The year the orders were placed
    visible_to: *id003
  - name: segment
    data_type: varchar
    description: The customers' segment
    visible_to: *id003
  - name: orders
    data_type: bigint
    description: Orders placed
    visible_to: *id003
  - name: revenue
    data_type: decimal
    description: Their total in USD
    visible_to: *id003
  - name: average_order
    data_type: decimal
    description: The average order in USD
    visible_to: *id003
- id: pipeline
  domain_id: dataroom
  enable_aggregates: true
  enable_group_by: true
  description: 'The sales pipeline by industry and stage: how many deals, their value, and their value
    weighted by the chance each closes'
  sql: SELECT a."Industry" AS industry, o."StageName" AS stage, COUNT(*) AS deals, SUM(o."Amount") AS
    amount, SUM(o."Amount" * o."Probability" / 100.0) AS weighted_amount FROM "dataroom"."opportunities"
    AS o JOIN "dataroom"."accounts" AS a ON a."Id" = o."AccountId" GROUP BY 1, 2
  columns:
  - name: industry
    data_type: varchar
    description: The accounts' industry
    visible_to: &id004
    - org_admin
    - bidder_a
    - bidder_b
  - name: stage
    data_type: varchar
    description: Where the deals stand
    visible_to: *id004
  - name: deals
    data_type: bigint
    description: Deals at that stage
    visible_to: *id004
  - name: amount
    data_type: double
    description: Their value in USD
    visible_to: *id004
  - name: weighted_amount
    data_type: double
    description: Their value weighted by the chance each closes, in USD
    visible_to: *id004
- id: data_quality
  domain_id: dataroom
  enable_aggregates: true
  enable_group_by: true
  description: 'A score for each check of the seller''s records: the share of rows that pass it'
  sql: SELECT 'customers' AS table_name, 'has an email' AS data_check, COUNT(*) AS total_rows, COUNT(*)
    FILTER (WHERE email IS NULL) AS failing_rows FROM "dataroom"."customers" UNION ALL SELECT 'customers',
    'phone has ten digits', COUNT(*), COUNT(*) FILTER (WHERE LENGTH(REGEXP_REPLACE(phone, '[^0-9X]', '',
    'g')) <> 10) FROM "dataroom"."customers" UNION ALL SELECT 'invoices', 'paid', COUNT(*), COUNT(*) FILTER
    (WHERE paid_at IS NULL) FROM "dataroom"."invoices"
  columns:
  - name: table_name
    data_type: varchar
    description: The table checked
    visible_to: *id003
  - name: data_check
    data_type: varchar
    description: What each row is checked for
    visible_to: *id003
  - name: total_rows
    data_type: bigint
    description: Rows checked
    visible_to: *id003
  - name: failing_rows
    data_type: bigint
    description: Rows that fail the check
    visible_to: *id003
- id: customer_sample
  domain_id: dataroom
  description: 'One customer in fifty, as a bidder reads them: no name, the email and phone masked'
  sql: SELECT c.id, c.email, c.phone, c.segment, c.region, c.first_order_date FROM "dataroom"."customers"
    AS c WHERE c.id % 50 = 0
  columns:
  - name: id
    data_type: integer
    description: The customer's number
    visible_to: *id003
  - name: email
    data_type: varchar
    description: The customer's email address, its name part masked for a bidder
    visible_to: *id003
  - name: phone
    data_type: varchar
    description: The customer's phone number, its digits masked for a bidder
    visible_to: *id003
  - name: segment
    data_type: varchar
    description: The customer's segment
    visible_to: *id003
  - name: region
    data_type: varchar
    description: The customer's region
    visible_to: *id003
  - name: first_order_date
    data_type: date
    description: The day of the customer's first order
    visible_to: *id003
relationships:
- id: order-to-customer
  alias: PLACED_BY
  cardinality: many-to-one
  source_table_id: orders
  source_column: customer_id
  target_table_id: customers
  target_column: id
- id: invoice-to-order
  alias: BILLS
  cardinality: many-to-one
  source_table_id: invoices
  source_column: order_id
  target_table_id: orders
  target_column: id
- id: opportunity-to-account
  alias: WITH
  cardinality: many-to-one
  source_table_id: opportunities
  source_column: AccountId
  target_table_id: accounts
  target_column: Id
- id: account-to-customer
  alias: IS_CUSTOMER
  cardinality: many-to-one
  source_table_id: accounts
  source_column: CustomerNumber__c
  target_table_id: customers
  target_column: id
