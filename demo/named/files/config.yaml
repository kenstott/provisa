#
# The WHOLE config of the named demo "files" (start-ui-install.sh --demo files; REQ-2032): an
# instant data lake. A small city's open-data drop -- a folder of mixed files, generated by
# generate.py into drop/ -- is read where it lies by one files source, every file a table, with no
# load step:
#
#   complaints_2026_08.csv, complaints_2026_09.csv  311 complaints, one file a month: ONE table over
#                                                   the glob complaints_*.csv, so a new month's file
#                                                   needs no table of its own (REQ-788)
#   building_permits.parquet                        building permits
#   budget_2026.xlsx                                the city budget (its sheet "budget")
#   inspections.json                                inspections of permitted work
#
# The folder is named by PROVISA_NAMED_DEMO_DIR, which start-ui-install.sh sets to this directory.
auth:
  assignments_source: provisa
  default_assignments:
  - domain_id: '*'
    role_id: org_admin
  provider: none
cache:
  default_ttl: 300
  enabled: true
domains:
- id: city
  description: A city's open-data drop -- 311 complaints, building permits, the budget and inspections
    -- read from the files it was published as
federation_engine: duckdb
naming:
  domain_prefix: true
  rules: []
roles: []
server:
  limits:
    default_row_limit: 100
    request_timeout: 60
    trino_query_timeout: 120
sources:
- id: drop
  type: files
  path: ${env:PROVISA_NAMED_DEMO_DIR}/drop
  description: The city's open-data drop, a folder of CSV, Parquet, Excel and JSON files
tables:
- source_id: drop
  domain_id: city
  schema: drop
  table: complaints
  # GraphQL's Aggregate and GroupBy fields, which the example queries (queries/) use.
  enable_aggregates: true
  enable_group_by: true
  file_glob: complaints_*.csv
  description: 311 complaints, one CSV file a month, read as one table
  columns:
  - {name: complaint_id, data_type: varchar, is_primary_key: true, description: The complaint's number, visible_to: [data_steward]}
  - {name: opened_at, data_type: varchar, description: When the complaint was made, visible_to: [data_steward]}
  - {name: status, data_type: varchar, description: 'open or closed', visible_to: [data_steward]}
  - {name: closed_at, data_type: varchar, description: 'When the complaint was closed; empty while it is open', visible_to: [data_steward]}
  - {name: category, data_type: varchar, description: 'What the complaint is about: noise, dust, a blocked sidewalk and so on', visible_to: [data_steward]}
  - {name: neighborhood, data_type: varchar, description: The neighborhood the complaint is in, visible_to: [data_steward]}
  - {name: address, data_type: varchar, description: The street address the complaint is about, visible_to: [data_steward]}
- source_id: drop
  domain_id: city
  schema: drop
  table: building_permits
  # GraphQL's Aggregate and GroupBy fields, which the example queries (queries/) use.
  enable_aggregates: true
  enable_group_by: true
  alias: permits
  description: Building permits, from a Parquet file
  columns:
  - {name: permit_id, data_type: varchar, is_primary_key: true, description: The permit's number, visible_to: [data_steward]}
  - {name: address, data_type: varchar, description: The street address of the permitted work, visible_to: [data_steward]}
  - {name: neighborhood, data_type: varchar, description: The neighborhood of the permitted work, visible_to: [data_steward]}
  - {name: permit_type, data_type: varchar, description: 'What is permitted: a new building, an addition, a demolition or a renovation', visible_to: [data_steward]}
  - {name: issued_on, data_type: date, description: When the permit was issued, visible_to: [data_steward]}
  - {name: expires_on, data_type: date, description: When the permit expires, visible_to: [data_steward]}
  - {name: status, data_type: varchar, description: 'active until it expires, then expired', visible_to: [data_steward]}
  - {name: valuation, data_type: bigint, description: The declared value of the work in USD, visible_to: [data_steward]}
- source_id: drop
  domain_id: city
  schema: drop
  table: budget_2026__budget
  # GraphQL's Aggregate and GroupBy fields, which the example queries (queries/) use.
  enable_aggregates: true
  enable_group_by: true
  alias: budget
  description: The city's 2026 budget, a line a department and neighborhood, from an Excel workbook's
    sheet "budget"
  columns:
  - {name: neighborhood, data_type: varchar, description: The neighborhood the money is spent in, visible_to: [data_steward]}
  - {name: department, data_type: varchar, description: The department spending it, visible_to: [data_steward]}
  - {name: amount, data_type: bigint, description: The budgeted amount in USD, visible_to: [data_steward]}
- source_id: drop
  domain_id: city
  schema: drop
  table: inspections
  # GraphQL's Aggregate and GroupBy fields, which the example queries (queries/) use.
  enable_aggregates: true
  enable_group_by: true
  description: Inspections of permitted work, from a JSON file
  columns:
  - {name: inspection_id, data_type: integer, is_primary_key: true, description: The inspection's number, visible_to: [data_steward]}
  - {name: permit_id, data_type: varchar, description: The permit whose work was inspected, visible_to: [data_steward]}
  - {name: inspected_on, data_type: varchar, description: When the work was inspected, visible_to: [data_steward]}
  - {name: result, data_type: varchar, description: 'passed, failed or corrections needed', visible_to: [data_steward]}
views:
# The answer to the question, stored: for each neighborhood, the complaints made at an address
# with an active building permit, and how many such permits there are.
- id: complaints_near_construction
  domain_id: city
  materialize: true
  enable_aggregates: true
  enable_group_by: true
  description: For each neighborhood, the complaints made at an address with active construction,
    and the active permits they are about
  sql: >-
    SELECT c.neighborhood, COUNT(*) AS complaints, COUNT(DISTINCT p.permit_id) AS active_permits
    FROM "city"."complaints" AS c
    JOIN "city"."permits" AS p ON p.address = c.address
    WHERE p.status = 'active'
    GROUP BY c.neighborhood
  columns:
  - {name: neighborhood, data_type: varchar, description: The neighborhood, visible_to: [data_steward]}
  - {name: complaints, data_type: bigint, description: Complaints made at an address with an active permit, visible_to: [data_steward]}
  - {name: active_permits, data_type: bigint, description: The active permits those complaints are about, visible_to: [data_steward]}
relationships:
- {id: permit-complaints, alias: DRAWS, cardinality: one-to-many, source_table_id: permits, source_column: address, target_table_id: complaints, target_column: address}
- {id: inspection-permit, alias: INSPECTS, cardinality: many-to-one, source_table_id: inspections, source_column: permit_id, target_table_id: permits, target_column: permit_id}
- {id: complaint-budget, alias: BUDGETED, cardinality: one-to-many, source_table_id: complaints, source_column: neighborhood, target_table_id: budget, target_column: neighborhood}
glossary_terms:
- name: open complaint
  definition: 'A 311 complaint the city has not yet closed: its status is open and it has no closed time.'
  domains:
  - city
  # Grounded by the terms its columns give: a kind of complaint, told apart by its status.
  edges:
  - to: complaint
    rel_type: KIND_OF
  - to: complaint status
    rel_type: RELATED_TO
