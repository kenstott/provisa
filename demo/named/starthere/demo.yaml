# The Start here demo's card on provisa.dev's live demos page (REQ-2006): the standard demo's pet
# store, inquiries, quality checker and data product, the objects every Deep Dive is told with.
title: Start here
description: >-
  The whole product on one small dataset, with every Deep Dive: relationships, model,
  govern, quality, query, test data, publish, operate.
screenshot: card.png
published: true
# Listed first on the live demos page and in --list-demos.
order: 1
# Its tour is the product's core tour, with the Deep Dives after it: it has no tour.yaml of its own.
tour: core
# The oldest Provisa this demo's bundle runs on (REQ-2049): the first release carrying the demo.
requires_provisa: 0.1.0a492
