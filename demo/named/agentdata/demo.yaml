# The agentdata demo's card on provisa.dev's live demos page (REQ-2006), generated from this file
# by scripts/gen-site-demos.mjs. published: true once card.png, a screenshot of the demo in
# Provisa, is beside it.
title: Give an agent your data
description: >-
  Can an AI agent be given a retailer's order data and held to what its user may see? In the MCP
  explorer, the agent an outside client would get, a West support agent's assistant reads only the
  West's customers with emails masked, the analyst's reads every region and no email, and each
  answer opens to the governed SQL that ran.
screenshot: card.png
published: true
group: agents
# The oldest Provisa this demo's bundle runs on (REQ-2049): a puller running an older one is refused
# by name. The first release carrying the MCP explorer's explain of a tool call and the tour's mcp
# steps.
requires_provisa: 0.1.0a496
# The demo's video: its tagline names what the demo shows Provisa being.
video:
  tagline: "Governed Data for Agents"
