#
# The named demo "agentdata" (start-ui-install.sh --demo agentdata; REQ-1858). This file is its one
# start point: `docker compose up -d` brings up its database and seeds it.
#
#   postgres  the demo's database (db/init.sql), with the role Provisa reads it as.
#   seeder    TODO: writes what the demo's data needs beyond db/init.sql (seed.py), then exits.
#
# Port: 30332 the database; it can be moved by its variable.
x-demo-labels: &demo-labels
  com.provisa.demo: agentdata
name: provisa-demo-agentdata
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    labels:
      <<: *demo-labels
      com.provisa.demo.role: rdb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentdata
    ports:
      - "127.0.0.1:${AGENTDATA_PG_PORT:-30332}:5432"
    volumes:
      - agentdata_pg:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - ./db/reader.sql:/docker-entrypoint-initdb.d/20-reader.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agentdata"]
      interval: 2s
      timeout: 5s
      retries: 60

volumes:
  agentdata_pg:
