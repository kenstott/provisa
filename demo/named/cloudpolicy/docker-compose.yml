#
# The named demo "cloudpolicy" (start-ui-install.sh --demo cloudpolicy; REQ-1858, REQ-2102). This
# file is its one start point: `docker compose up -d` brings up the security team's review store.
#
#   postgres  the review store (db/init.sql, pgvector), its fourteen days of review history
#             (db/history.sql) and the role Provisa reads and writes it as (db/reader.sql).
#
# The cloud inventory and the incidents are the rows the demo declares (replica_rows/), and the
# policy's reader runs inside Provisa from code/: neither is a service here.
#
# Port: 30232 the database; it can be moved by its variable.
x-demo-labels: &demo-labels
  com.provisa.demo: cloudpolicy
name: provisa-demo-cloudpolicy
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    labels:
      <<: *demo-labels
      com.provisa.demo.role: rdb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cloudpolicy
    ports:
      - "127.0.0.1:${CLOUDPOLICY_PG_PORT:-30232}:5432"
    volumes:
      - cloudpolicy_pg:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - ./db/history.sql:/docker-entrypoint-initdb.d/15-history.sql:ro
      - ./db/reader.sql:/docker-entrypoint-initdb.d/20-reader.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cloudpolicy"]
      interval: 2s
      timeout: 5s
      retries: 60
volumes:
  cloudpolicy_pg:
