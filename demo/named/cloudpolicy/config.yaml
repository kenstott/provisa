views:
# §4.2 as a view: every attached disk whose key the cloud manages, with the machine it is on.
- id: cmek_violations
  domain_id: cloudpolicy
  enable_aggregates: true
  enable_group_by: true
  description: 'Every disk attached to a virtual machine without a customer-managed key: what §4.2 forbids'
  sql: >-
    SELECT d.cloud_provider, d.account_id, d.application, d.resource_name, d.storage_type,
    d.encryption_type, m.instance_name, d.resource_id
    FROM "cloudpolicy"."storage_resources" AS d
    JOIN "cloudpolicy"."compute_resources" AS m ON m.resource_id = d.attached_instance_id
    WHERE d.key_id IS NULL
  columns:
  - {name: cloud_provider, data_type: varchar, description: The cloud it is in, visible_to: [data_steward, auditor, app_payments]}
  - {name: account_id, data_type: varchar, description: 'The subscription, account or project', visible_to: [data_steward, auditor, app_payments]}
  - {name: application, data_type: varchar, description: The application team that owns it, visible_to: [data_steward, auditor, app_payments]}
  - {name: resource_name, data_type: varchar, description: The disk's name, visible_to: [data_steward, auditor, app_payments]}
  - {name: storage_type, data_type: varchar, description: 'Managed Disk, EBS Volume or Persistent Disk', visible_to: [data_steward, auditor, app_payments]}
  - {name: encryption_type, data_type: varchar, description: 'How it is encrypted, in the cloud''s words', visible_to: [data_steward, auditor, app_payments]}
  - {name: instance_name, data_type: varchar, description: The machine it is attached to, visible_to: [data_steward, auditor, app_payments]}
  - {name: resource_id, data_type: varchar, description: The cloud's own id for the disk, visible_to: [data_steward, auditor, app_payments]}
# The daily review: each attached disk on the review day, 2026-10-20, the day the inventory was
# taken (generate.py REVIEW_DAY), by the policy's rules. A disk with a
# customer-managed key is compliant (§4.2). Otherwise an exception opened within 90 days covers it
# (§4.3); an open incident is past its deadline (§6.1) or within it; an incident closed while the
# disk is still not compliant, an exception that has expired, or nothing filed at all.
- id: daily_review
  domain_id: cloudpolicy
  enable_aggregates: true
  enable_group_by: true
  description: Each attached disk on the review day, classified by the policy's rules
  sql: >-
    SELECT d.resource_id, d.resource_name, d.cloud_provider, d.account_id, d.application,
    CASE
      WHEN d.key_id IS NOT NULL THEN 'compliant'
      WHEN x.number IS NOT NULL AND (DATE '2026-10-20' - CAST(x.opened_at AS DATE)) < 90 THEN 'covered by an exception'
      WHEN o.number IS NOT NULL AND (DATE '2026-10-20' - CAST(o.opened_at AS DATE))
        > CASE o.priority WHEN 1 THEN 7 WHEN 2 THEN 14 WHEN 3 THEN 30 ELSE 90 END THEN 'overdue'
      WHEN o.number IS NOT NULL THEN 'violation, ticketed'
      WHEN l.number IS NOT NULL THEN 'closed, still not compliant'
      WHEN x.number IS NOT NULL THEN 'exception expired'
      ELSE 'violation, no ticket'
    END AS status,
    CASE
      WHEN d.key_id IS NOT NULL THEN NULL
      WHEN x.number IS NOT NULL AND (DATE '2026-10-20' - CAST(x.opened_at AS DATE)) < 90 THEN x.number
      WHEN o.number IS NOT NULL THEN o.number
      WHEN l.number IS NOT NULL THEN l.number
      ELSE x.number
    END AS incident_number
    FROM "cloudpolicy"."storage_resources" AS d
    LEFT JOIN (SELECT cmdb_ci__display, number, opened_at,
      ROW_NUMBER() OVER (PARTITION BY cmdb_ci__display ORDER BY opened_at DESC) AS n
      FROM "cloudpolicy"."incident" WHERE category = 'Policy exception') AS x
      ON x.cmdb_ci__display = d.resource_name AND x.n = 1
    LEFT JOIN (SELECT cmdb_ci__display, number, opened_at, priority,
      ROW_NUMBER() OVER (PARTITION BY cmdb_ci__display ORDER BY opened_at DESC) AS n
      FROM "cloudpolicy"."incident" WHERE category = 'Security' AND resolved_at IS NULL) AS o
      ON o.cmdb_ci__display = d.resource_name AND o.n = 1
    LEFT JOIN (SELECT cmdb_ci__display, number,
      ROW_NUMBER() OVER (PARTITION BY cmdb_ci__display ORDER BY opened_at DESC) AS n
      FROM "cloudpolicy"."incident" WHERE category = 'Security') AS l
      ON l.cmdb_ci__display = d.resource_name AND l.n = 1
    WHERE d.attached_instance_id IS NOT NULL
  columns:
  - {name: resource_id, data_type: varchar, description: The disk, visible_to: [data_steward, auditor, app_payments]}
  - {name: resource_name, data_type: varchar, description: The disk's name, visible_to: [data_steward, auditor, app_payments]}
  - {name: cloud_provider, data_type: varchar, description: The cloud it is in, visible_to: [data_steward, auditor, app_payments]}
  - {name: account_id, data_type: varchar, description: 'The subscription, account or project', visible_to: [data_steward, auditor, app_payments]}
  - {name: application, data_type: varchar, description: The application team that owns it, visible_to: [data_steward, auditor, app_payments]}
  - {name: status, data_type: varchar, description: What the review finds, visible_to: [data_steward, auditor, app_payments]}
  - {name: incident_number, data_type: varchar, description: The incident that decides it, visible_to: [data_steward, auditor, app_payments]}
# §5.1 as a view: database servers with a public address.
- id: public_database_servers
  domain_id: cloudpolicy
  description: 'Every database server with a public IP address: what §5.1 forbids'
  sql: >-
    SELECT cloud_provider, account_id, application, instance_name, public_ip
    FROM "cloudpolicy"."compute_resources"
    WHERE instance_name LIKE '%-db-%' AND public_ip IS NOT NULL
  columns:
  - {name: cloud_provider, data_type: varchar, description: The cloud it is in, visible_to: [data_steward, auditor, app_payments]}
  - {name: account_id, data_type: varchar, description: 'The subscription, account or project', visible_to: [data_steward, auditor, app_payments]}
  - {name: application, data_type: varchar, description: The application team that owns it, visible_to: [data_steward, auditor, app_payments]}
  - {name: instance_name, data_type: varchar, description: The database server, visible_to: [data_steward, auditor, app_payments]}
  - {name: public_ip, data_type: varchar, description: Its public IP address, visible_to: [data_steward, auditor, app_payments]}
# Each incident beside the policy section it cites: a disk-encryption incident cites §4.2, an
# exception §4.3, and a section the policy does not have is no control at all.
- id: incident_controls
  domain_id: cloudpolicy
  description: Each incident, the policy section it cites, and whether that is the control it is about
  sql: >-
    SELECT i.number, i.short_description, i.category, i.u_policy_control AS cited, p.heading AS cited_heading,
    CASE
      WHEN p.section IS NULL THEN 'cites a section the policy does not have'
      WHEN i.category = 'Policy exception' AND i.u_policy_control <> '4.3' THEN 'cites the wrong control'
      WHEN i.category = 'Security' AND i.u_policy_control <> '4.2' THEN 'cites the wrong control'
      ELSE 'cites its control'
    END AS finding
    FROM "cloudpolicy"."incident" AS i
    LEFT JOIN "cloudpolicy"."policy_sections" AS p ON p.section = i.u_policy_control
  columns:
  - {name: number, data_type: varchar, description: The incident's number, visible_to: [data_steward, auditor, app_payments]}
  - {name: short_description, data_type: varchar, description: What it is about, visible_to: [data_steward, auditor, app_payments]}
  - {name: category, data_type: varchar, description: Security or Policy exception, visible_to: [data_steward, auditor, app_payments]}
  - {name: cited, data_type: varchar, description: The policy section it cites, visible_to: [data_steward, auditor, app_payments]}
  - {name: cited_heading, data_type: text, description: That section's heading; empty when the policy has no such section, visible_to: [data_steward, auditor, app_payments]}
  - {name: finding, data_type: varchar, description: Whether it cites the control it is about, visible_to: [data_steward, auditor, app_payments]}
# The controls no check enforces.
- id: unchecked_controls
  domain_id: cloudpolicy
  description: The policy's controls that no check the security team runs enforces
  sql: >-
    SELECT p.section, p.heading
    FROM "cloudpolicy"."policy_sections" AS p
    LEFT JOIN "cloudpolicy"."control_checks" AS c ON c.section = p.section
    WHERE c.section IS NULL
  columns:
  - {name: section, data_type: text, description: The section number, visible_to: [data_steward, auditor, app_payments]}
  - {name: heading, data_type: text, description: The control's heading, visible_to: [data_steward, auditor, app_payments]}
rls_rules:
# The payments team reads its own resources, its own incidents and its own review rows.
- {description: The payments team reads its own machines only., table_id: compute_resources, role_id: app_payments, filter: "application = 'payments'"}
- {description: The payments team reads its own disks only., table_id: storage_resources, role_id: app_payments, filter: "application = 'payments'"}
- {description: The payments team reads its own incidents only., table_id: incident, role_id: app_payments, filter: "assignment_group__display = 'Payments'"}
- {description: The payments team reads its own review history only., table_id: review_history, role_id: app_payments, filter: "application = 'payments'"}
relationships:
- {id: disk-to-machine, alias: ATTACHED_TO, cardinality: many-to-one, source_table_id: storage_resources, source_column: attached_instance_id, target_table_id: compute_resources, target_column: resource_id}
- {id: incident-to-disk, alias: ABOUT, cardinality: many-to-one, source_table_id: incident, source_column: cmdb_ci__display, target_table_id: storage_resources, target_column: resource_name}
- {id: incident-to-control, alias: CITES, cardinality: many-to-one, source_table_id: incident, source_column: u_policy_control, target_table_id: policy_sections, target_column: section}
- {id: check-to-control, alias: ENFORCES, cardinality: many-to-one, source_table_id: control_checks, source_column: section, target_table_id: policy_sections, target_column: section}
- {id: review-to-disk, alias: REVIEWS, cardinality: many-to-one, source_table_id: review_history, source_column: resource_id, target_table_id: storage_resources, target_column: resource_id}
functions:
# Each clause's embedding, written to the review store: embed() embeds the clause's words with the
# model, and the rows are written through the store's write route.
- name: embed_clauses
  function_name: embed_clauses
  impl_kind: statement
  domain_id: cloudpolicy
  description: Embed every clause of the policy and write each embedding to clause_vectors
  source_id: ''
  returns: ''
  visible_to: [data_steward]
  binding:
    sql: >-
      INSERT INTO "cloudpolicy"."clause_vectors" (section, clause_vec)
      SELECT p.section, embed('sentence-transformers/all-MiniLM-L6-v2', p.clause)
      FROM "cloudpolicy"."policy_sections" AS p
scheduled_triggers:
# The daily review, kept: each morning the day's review is written to review_history through the
# governed pipeline, as org_admin, under its write grant.
- id: daily-review
  name: Keep the day's review
  cron: '0 6 * * *'
  role: org_admin
  sql: >-
    INSERT INTO "cloudpolicy"."review_history"
    (review_date, resource_id, resource_name, cloud_provider, account_id, application, status, incident_number)
    SELECT CAST('{{YYYY-MM-DD}}' AS DATE), resource_id, resource_name, cloud_provider, account_id, application, status, incident_number
    FROM "cloudpolicy"."view_daily_review"
