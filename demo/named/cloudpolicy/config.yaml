# The WHOLE config of the named demo "cloudpolicy" (start-ui-install.sh --demo cloudpolicy;
# REQ-2102). The company's security policy says every disk attached to a virtual machine uses a
# customer-managed key (CMEK). The security lead reviews it across Azure, AWS and Google Cloud,
# after the fact, from what is already recorded: the cloud inventory, the incidents filed against
# it, and the policy itself.
#
#   inventory      the cloud inventory (cloudops): virtual machines and disks across the three
#                  clouds. The demo declares its rows (replica_rows/inventory/): it reads no cloud.
#   itsm           the security team's ServiceNow incidents, the demo's declared rows the same way
#                  (replica_rows/itsm/): it calls no instance.
#   policy-reader  a Python package (code/policy_reader.tar.gz) whose policy_sections reads the
#                  policy's published HTML, shipped inside it, into a row a control.
#   review-db      the team's own review store (db/): the checks it runs, the daily review's
#                  history and each clause's embedding.
auth:
  assignments_source: provisa
  default_assignments:
  - domain_id: '*'
    role_id: org_admin
  provider: none
cache:
  default_ttl: 300
  enabled: true
domains:
- id: cloudpolicy
  description: The cloud security policy, the resources it governs across Azure, AWS and Google Cloud, and the incidents filed against them
federation_engine: duckdb
naming:
  domain_prefix: true
  rules: []
roles:
- id: auditor
  parents: [viewer]
  description: "The security lead: reads every account's resources and incidents, and the policy."
  capabilities:
  - query_development
  domain_access:
  - cloudpolicy
- id: app_payments
  parents: [viewer]
  description: "The payments team: reads its own resources and incidents only, and the policy."
  capabilities:
  - query_development
  domain_access:
  - cloudpolicy
server:
  limits:
    default_row_limit: 500
    request_timeout: 120
    trino_query_timeout: 120
vector_models:
# A local sentence-transformers model: no key, no network once it is cached (provisa[vector],
# which demo.yaml declares).
- id: sentence-transformers/all-MiniLM-L6-v2
  provider: huggingface
  dimensions: 384
  enabled: true
sources:
- id: inventory
  type: cloudops
  # Each cloud's values are empty: the demo reads no cloud. Its tables are TTL -1 replicas landed
  # from the rows the demo declares (replica_rows/inventory/).
  cache_ttl: -1
  replicate: 0
  mapping:
    azure_tenant_id: ${env:CLOUDPOLICY_AZURE_TENANT_ID:-}
    azure_client_id: ${env:CLOUDPOLICY_AZURE_CLIENT_ID:-}
    azure_client_secret: ${env:CLOUDPOLICY_AZURE_CLIENT_SECRET:-}
    azure_subscription_ids: ${env:CLOUDPOLICY_AZURE_SUBSCRIPTION_IDS:-}
    aws_access_key_id: ${env:CLOUDPOLICY_AWS_ACCESS_KEY_ID:-}
    aws_secret_access_key: ${env:CLOUDPOLICY_AWS_SECRET_ACCESS_KEY:-}
    aws_region: ${env:CLOUDPOLICY_AWS_REGION:-}
    aws_account_ids: ${env:CLOUDPOLICY_AWS_ACCOUNT_IDS:-}
    gcp_credentials_path: ${env:CLOUDPOLICY_GCP_CREDENTIALS_PATH:-}
    gcp_project_ids: ${env:CLOUDPOLICY_GCP_PROJECT_IDS:-}
  description: The cloud inventory across Azure, AWS and Google Cloud, landed once from the rows the demo declares
- id: itsm
  type: servicenow
  base_url: ${env:CLOUDPOLICY_SERVICENOW_URL:-}
  username: ${env:CLOUDPOLICY_SERVICENOW_USERNAME:-}
  password: ${env:CLOUDPOLICY_SERVICENOW_PASSWORD:-}
  cache_ttl: -1
  replicate: 0
  description: The security team's ServiceNow incidents, landed once from the rows the demo declares
# The policy's reader: the archive in code/ is the org's upload under the content hash of the code
# it unpacks to (policy/pack.py prints both).
- id: policy-reader
  type: python
  description: A Python package that reads the cloud security policy's published HTML into a row a control
  mapping:
    runtime: python
    code: {kind: upload, upload: 04ae29c7cf01a6479975dbaf9c46079826fa9d9185722ced0e71bb9e9fb5bca5, filename: policy_reader.tar.gz}
- id: review-db
  type: postgresql
  host: ${env:CLOUDPOLICY_PG_HOST:-localhost}
  port: ${env:CLOUDPOLICY_PG_PORT:-30232}
  database: cloudpolicy${env:CLOUDPOLICY_PG_NS}
  username: provisa_demo
  password: provisa_demo
  description: The security team's review store, with pgvector
