#
# The WHOLE config of the named demo "churn" (start-ui-install.sh --demo churn; REQ-1858).
# A subscription business asks which customers are about to cancel. Its data scientist reads the
# governed customer features into pandas, as the analyst role, in the browser's Notebook tab, and
# trains a scikit-learn model on them; email addresses arrive masked, as that role is served them.
# The features are a materialized view over the customers and their monthly usage, built through
# the governed pipeline when the demo is set up (setup.yaml).
#
#   churn-db   the business's customers and their usage, read live as provisa_reader (db/init.sql).
auth:
  assignments_source: provisa
  default_assignments:
  - domain_id: '*'
    role_id: org_admin
  provider: none
cache:
  default_ttl: 300
  enabled: true
domains:
- id: churn
  description: A subscription business's customers, their monthly usage and who has cancelled
federation_engine: duckdb
naming:
  domain_prefix: true
  rules: []
roles:
- id: analyst
  description: "The data scientist: reads the customers and their usage, with email addresses masked."
  capabilities:
  - query_development
  domain_access:
  - churn
server:
  limits:
    # Every customer in one read: the model is trained on all of them.
    default_row_limit: 2000
    request_timeout: 60
    trino_query_timeout: 120
sources:
- id: churn-db
  type: postgresql
  host: ${env:CHURN_PG_HOST:-localhost}
  port: ${env:CHURN_PG_PORT:-29932}
  database: churn
  username: provisa_reader
  password: provisa_reader
  description: The subscription business's customer database
tables:
- source_id: churn-db
  domain_id: churn
  schema: public
  table: customers
  description: Every customer, their plan and region, and the date they cancelled if they have
  columns:
  - {name: id, data_type: integer, is_primary_key: true, description: The customer's id, visible_to: [org_admin, analyst]}
  - {name: email, data_type: varchar, description: The customer's email address; masked for the analyst, visible_to: [org_admin, analyst], masks: [{to: [analyst], mask: {type: regex, pattern: '^[^@]+', replace: '***'}}]}
  - {name: region, data_type: varchar, description: 'Where the customer is billed: NA, EU or APAC', visible_to: [org_admin, analyst]}
  - {name: plan, data_type: varchar, description: 'The plan they are on: basic, pro or team', visible_to: [org_admin, analyst]}
  - {name: tenure_months, data_type: integer, description: How many months they have been a customer, visible_to: [org_admin, analyst]}
  - {name: cancelled_on, data_type: date, description: The day they cancelled; empty while they are a customer, visible_to: [org_admin, analyst]}
- source_id: churn-db
  domain_id: churn
  schema: public
  table: usage
  description: Each customer's use of the product, month by month, for the last twelve months
  columns:
  - {name: customer_id, data_type: integer, is_primary_key: true, description: The customer, visible_to: [org_admin, analyst]}
  - {name: month, data_type: date, is_primary_key: true, description: The first day of the month, visible_to: [org_admin, analyst]}
  - {name: logins, data_type: integer, description: How many times they signed in that month, visible_to: [org_admin, analyst]}
  - {name: support_tickets, data_type: integer, description: How many support tickets they opened that month, visible_to: [org_admin, analyst]}
views:
# What the model is trained on: one row a customer, their year of usage summed up, and whether they
# cancelled. Materialized, built when the demo is set up; the email mask is the analyst's here too.
- id: churn_features
  domain_id: churn
  materialize: true
  enable_aggregates: true
  description: One row a customer -- plan, region, tenure, a year of usage, and whether they cancelled
  sql: >-
    SELECT c.id AS customer_id, c.email, c.region, c.plan, c.tenure_months,
      AVG(u.logins) AS logins_per_month, SUM(u.support_tickets) AS tickets,
      CASE WHEN c.cancelled_on IS NULL THEN 0 ELSE 1 END AS churned
    FROM "churn"."customers" AS c
    JOIN "churn"."usage" AS u ON u.customer_id = c.id
    GROUP BY c.id, c.email, c.region, c.plan, c.tenure_months, c.cancelled_on
  columns:
  - {name: customer_id, data_type: integer, description: The customer's id, visible_to: [org_admin, analyst]}
  - {name: email, data_type: varchar, description: The customer's email address; masked for the analyst, visible_to: [org_admin, analyst], masks: [{to: [analyst], mask: {type: regex, pattern: '^[^@]+', replace: '***'}}]}
  - {name: region, data_type: varchar, description: Where the customer is billed, visible_to: [org_admin, analyst]}
  - {name: plan, data_type: varchar, description: The plan they are on, visible_to: [org_admin, analyst]}
  - {name: tenure_months, data_type: integer, description: How many months they have been a customer, visible_to: [org_admin, analyst]}
  - {name: logins_per_month, data_type: double, description: Their average sign-ins a month over the year, visible_to: [org_admin, analyst]}
  - {name: tickets, data_type: bigint, description: The support tickets they opened in the year, visible_to: [org_admin, analyst]}
  - {name: churned, data_type: integer, description: '1 if they have cancelled, 0 if not', visible_to: [org_admin, analyst]}
relationships:
- {id: usage-to-customer, alias: USED_BY, cardinality: many-to-one, source_table_id: usage, source_column: customer_id, target_table_id: customers, target_column: id}
