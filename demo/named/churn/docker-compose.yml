#
# The named demo "churn" (start-ui-install.sh --demo churn; REQ-1858). This file is its one
# start point: `docker compose up -d` brings up its database, loaded from db/init.sql.
#
#   postgres  the demo's database (db/init.sql), with the role Provisa reads it as.
#
# Port: 29932 the database; it can be moved by its variable.
x-demo-labels: &demo-labels
  com.provisa.demo: churn
name: provisa-demo-churn
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    labels:
      <<: *demo-labels
      com.provisa.demo.role: rdb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: churn
    ports:
      - "127.0.0.1:${CHURN_PG_PORT:-29932}:5432"
    volumes:
      - churn_pg:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - ./db/reader.sql:/docker-entrypoint-initdb.d/20-reader.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d churn"]
      interval: 2s
      timeout: 5s
      retries: 60

volumes:
  churn_pg:
