# The WHOLE config of the named demo "testdata" (start-ui-install.sh --demo testdata; REQ-2053).
# docker-compose.yml in this directory brings up its database.
#
# The question: can I build and test against realistic data without exposing production? The
# shop's database is production. Three environments read it (setup.yaml): prod, the real rows;
# preprod, Test (fake): production's own rows with each column that declares a fake (the sensitive
# and identifying ones, the operator's choice) faked for every role and the rest real, so totals
# and joins are production's; dev, Test (synthetic): every table generated from prod's profile,
# nothing real, a categorical column's values drawn from its synthetic rule. The keys are faked
# alike (hash), so a join through a relationship still matches.
#
#   shop-db        the shop's Postgres, read live as provisa_reader (db/init.sql), its password
#                  Provisa's own secret SHOP_DB_PASSWORD (secrets.yaml, written to the org's vault)
#   shop-profiler  the profile of its tables, which dev is generated from
auth:
  assignments_source: provisa
  default_assignments:
  - domain_id: '*'
    role_id: org_admin
  provider: none
cache:
  default_ttl: 300
  enabled: true
domains:
- id: shop
  description: The shop's production database -- customers, products, orders and their lines
  steward: org_admin
federation_engine: duckdb
naming:
  domain_prefix: true
  rules: []
roles:
- id: analyst
  description: "Queries the shop's data."
  capabilities:
  - query_development
  domain_access:
  - shop
server:
  limits:
    default_row_limit: 100
    request_timeout: 60
    trino_query_timeout: 120
sources:
- id: shop-db
  type: postgresql
  host: ${env:TESTDATA_PG_HOST:-localhost}
  port: ${env:TESTDATA_PG_PORT:-29432}
  database: testdata
  username: provisa_reader
  password: ${secret:SHOP_DB_PASSWORD}
  description: The shop's production database
- id: shop-profiler
  type: data_profiler
  description: The profile of the shop's tables, which dev's rows are generated from
  mapping:
    cron: 0 2 * * *
    low_cardinality_max: 100
    drift_window: 7
    drift_season: none
    drift_distance: 3.0
    drift_slope: 3.0
    drift_ks: 0.2
    drift_psi: 0.25
    correlation_max_columns: 20
    joint_max_distinct: 20
    category_max_columns: 10
tables:
- source_id: shop-db
  domain_id: shop
  schema: public
  profiler_source_id: shop-profiler
  table: customers
  description: Who has signed up, and where they live
  columns:
  - {name: id, data_type: integer, is_primary_key: true, description: 'The customer''s id', fake: "hash()", visible_to: [org_admin, analyst]}
  - {name: name, data_type: varchar, description: 'The customer''s name', fake: "name()", visible_to: [org_admin, analyst]}
  - {name: email, data_type: varchar, description: 'The customer''s email address', fake: "email()", visible_to: [org_admin, analyst]}
  - {name: city, data_type: varchar, description: 'Where the customer lives', fake: "city()", visible_to: [org_admin, analyst]}
  - {name: region, data_type: varchar, description: 'The customer''s sales region', synthetic_rule: "categories((North, South, East, West))", visible_to: [org_admin, analyst]}
  - {name: joined_on, data_type: date, description: 'When the customer signed up', fake: "uniform(min='2024-01-01', max='2026-06-30')", visible_to: [org_admin, analyst]}
- source_id: shop-db
  domain_id: shop
  schema: public
  profiler_source_id: shop-profiler
  table: products
  description: What the shop sells
  columns:
  - {name: id, data_type: integer, is_primary_key: true, description: 'The product''s id', visible_to: [org_admin, analyst]}
  - {name: name, data_type: varchar, description: 'The product''s name', visible_to: [org_admin, analyst]}
  - {name: category, data_type: varchar, description: 'The product''s category', synthetic_rule: "categories((Books, Games, Garden, Kitchen))", visible_to: [org_admin, analyst]}
  - {name: price, data_type: 'decimal(8,2)', description: 'The price in USD', visible_to: [org_admin, analyst]}
  - {name: stock, data_type: integer, description: 'Units in stock', visible_to: [org_admin, analyst]}
  - {name: description, data_type: varchar, description: 'The product''s description', visible_to: [org_admin, analyst]}
- source_id: shop-db
  domain_id: shop
  schema: public
  profiler_source_id: shop-profiler
  table: orders
  description: Each order a customer placed
  columns:
  - {name: id, data_type: integer, is_primary_key: true, description: 'The order''s id', visible_to: [org_admin, analyst]}
  - {name: customer_id, data_type: integer, description: 'The customer who placed it', fake: "hash()", visible_to: [org_admin, analyst]}
  - {name: placed_at, data_type: timestamp, description: 'When it was placed', visible_to: [org_admin, analyst]}
  - {name: status, data_type: varchar, description: 'placed, paid, shipped, delivered or cancelled', synthetic_rule: "categories((placed, paid, shipped, delivered, cancelled))", visible_to: [org_admin, analyst]}
- source_id: shop-db
  domain_id: shop
  schema: public
  profiler_source_id: shop-profiler
  table: order_items
  description: The lines of each order
  columns:
  - {name: id, data_type: integer, is_primary_key: true, description: 'The line''s id', visible_to: [org_admin, analyst]}
  - {name: order_id, data_type: integer, description: 'The order the line is on', visible_to: [org_admin, analyst]}
  - {name: product_id, data_type: integer, description: 'The product ordered', visible_to: [org_admin, analyst]}
  - {name: quantity, data_type: integer, description: 'Units ordered', visible_to: [org_admin, analyst]}
  - {name: unit_price, data_type: 'decimal(8,2)', description: 'The price of one unit when ordered', visible_to: [org_admin, analyst]}
# The customers' personal data is pii: a Test (fake) environment is refused while a pii column has
# no fake, and every read of one is in the record (ops.pii_access).
tag_assignments:
- {tag_id: pii, object_type: column, table_ref: shop-db.public.customers, column_name: name}
- {tag_id: pii, object_type: column, table_ref: shop-db.public.customers, column_name: email}
- {tag_id: pii, object_type: column, table_ref: shop-db.public.customers, column_name: city}
relationships:
- {id: order-customer, alias: PLACED_BY, graphql_alias: customer, cardinality: many-to-one, source_table_id: orders, source_column: customer_id, target_table_id: customers, target_column: id}
- {id: item-order, alias: ON_ORDER, cardinality: many-to-one, source_table_id: order_items, source_column: order_id, target_table_id: orders, target_column: id}
- {id: item-product, alias: OF_PRODUCT, cardinality: many-to-one, source_table_id: order_items, source_column: product_id, target_table_id: products, target_column: id}
views:
# What each region spends, by category: the tour's answer, the same query in every environment.
- id: sales_by_region
  domain_id: shop
  enable_aggregates: true
  enable_group_by: true
  description: Sales by customer region and product category
  columns:
  - {name: region, data_type: varchar, description: The customers' sales region, visible_to: [org_admin, analyst]}
  - {name: category, data_type: varchar, description: The products' category, visible_to: [org_admin, analyst]}
  - {name: orders, data_type: bigint, description: Orders with a line of the category, visible_to: [org_admin, analyst]}
  - {name: revenue, data_type: decimal, description: What those lines came to in USD, visible_to: [org_admin, analyst]}
  sql: >-
    SELECT c.region, p.category, COUNT(DISTINCT o.id) AS orders,
    SUM(i.quantity * i.unit_price) AS revenue
    FROM "shop"."order_items" AS i
    JOIN "shop"."orders" AS o ON o.id = i.order_id
    JOIN "shop"."customers" AS c ON c.id = o.customer_id
    JOIN "shop"."products" AS p ON p.id = i.product_id
    GROUP BY c.region, p.category
