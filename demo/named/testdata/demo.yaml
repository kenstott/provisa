title: Test data
description: >-
  A shop's production database, read in prod as it is and in two Test (fake) environments, dev and
  test, as realistic generated data computed by the engine at the read. Can I test against
  realistic data without touching production? The same queries, views and joins answer in all
  three; only prod sees the real rows.
screenshot: card.png
published: true
# The oldest Provisa this demo's bundle runs on (REQ-2049): a puller running an older one is refused
# by name. The first release carrying the demo, its setup's environment step and the tour's env step.
requires_provisa: 0.1.0a490
