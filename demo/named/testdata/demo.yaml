title: Test data
description: >-
  A shop's production database in three environments: prod, the real rows; pre-prod, production's
  rows with every sensitive column faked for every role; and dev, generated from production's
  profile with nothing real. The same queries, views and joins answer in all three.
screenshot: card.png
published: true
# The oldest Provisa this demo's bundle runs on (REQ-2049): a puller running an older one is refused
# by name. The first release carrying the demo, its setup's environment step and the tour's env step.
requires_provisa: 0.1.0a490
