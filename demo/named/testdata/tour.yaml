#
# The testdata demo's own tour (REQ-2010): the story of the demo, told with its own data. The step
# kinds and what each names are listed in demo/named/weblogs/tour.yaml; every name here is checked
# against the demo by tests/unit/test_named_demo_tour.py, and the words of each step are
# tour.steps.<key> in the UI's tour.json, in every language.
#
# The track: the scenario (the shop's production database, and three environments over it); the
# model's fakes on the sensitive and identifying columns, the operator's choice; the steward's
# coverage check, as the setup showed it before pre-prod existed; production's real rows; pre-prod,
# Test (fake): the same rows with every sensitive column faked, for every role, and the totals
# exactly production's; dev, Test (synthetic): rows generated from production's profile, nothing
# real, keys still joining, and the report comparing them with the profile they were drawn from;
# a recap back in prod. "Where next?" is the Environments page.
landing:
  route: /admin/environments
  capability: environment_management
steps:
- key: testdataScenario
  route: /sources
  capability: source_registration
  source: shop-db
- key: testdataTables
  route: /tables
  capability: table_registration
  table: shop-db.customers
  # Its detail panel, on the columns' Testing tab: each column's fake is shown only there.
  open: columns.testing
- key: testdataCoverage
  image: coverage.png
- key: testdataCoverageNow
  route: /sql
  capability: query_development
  sql: >-
    SELECT table_name, column_name, tags, status, reason FROM "meta"."sensitive_coverage"
    ORDER BY table_name, column_name
- key: testdataProd
  sql: >-
    SELECT id, name, email, city, region, joined_on
    FROM "shop"."customers"
    ORDER BY id
    LIMIT 10
- key: testdataProdAnswer
  sql: >-
    SELECT region, category, orders, revenue
    FROM "shop"."view_sales_by_region"
    ORDER BY revenue DESC
    LIMIT 10
- key: testdataToPreprod
  env: preprod
- key: testdataPreprod
  sql: >-
    SELECT id, name, email, city, region, joined_on
    FROM "shop"."customers"
    ORDER BY region, joined_on
    LIMIT 10
- key: testdataPreprodAnswer
  sql: >-
    SELECT region, category, orders, revenue
    FROM "shop"."view_sales_by_region"
    ORDER BY revenue DESC
    LIMIT 10
- key: testdataPreprodAnalyst
  role: shop_analyst
- key: testdataPreprodAsAnalyst
  sql: >-
    SELECT name, email, city, region
    FROM "shop"."customers"
    ORDER BY region, name
    LIMIT 10
- key: testdataToDev
  env: dev
- key: testdataDev
  sql: >-
    SELECT id, name, email, city, region, joined_on
    FROM "shop"."customers"
    ORDER BY id
    LIMIT 10
- key: testdataDevAnswer
  sql: >-
    SELECT region, category, orders, revenue
    FROM "shop"."view_sales_by_region"
    ORDER BY revenue DESC
    LIMIT 10
- key: testdataDevGraphql
  route: /query
  capability: query_development
  example: 1-orders-by-customer
- key: testdataReport
  image: report.png
- key: testdataToProd
  route: /sql
  capability: query_development
  env: prod
- key: testdataDone
  route: /tables
  capability: table_registration
  table: shop-db.orders
