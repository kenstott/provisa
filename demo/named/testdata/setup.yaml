#
# What the testdata demo runs once, in order, after the server is up (REQ-2016, REQ-2053;
# scripts/run_demo_setup.py): its two Test (fake) environments, dev and test, each a branch of
# the model whose reads are answered with every column's fake. prod is the environment a request
# naming none is served, with the real rows.
steps:
- profile: shop-profiler
- environment: {name: preprod, data_mode: test_fake}
- environment: {name: dev, data_mode: test_synthetic}
