#
# The insider demo where it runs from its bundle (start-ui-install.sh --demo insider; REQ-2049):
# the database, loaded from the dump the bundle build wrote (dump/postgres/<database>.sql) -- setup.yaml's
# match signals with it -- read only (db/reader.sql): every sandbox of the demo shares it.

x-demo-labels: &demo-labels
  com.provisa.demo: insider

name: provisa-demo-insider-run

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    labels:
      <<: *demo-labels
      com.provisa.demo.role: rdb
      # Where config.yaml's bank source reads it, for the sandbox tier's node (REQ-2049,
      # scripts/demo_stores_sync.sh): it writes these two into the bundle's stores.env.
      com.provisa.demo.host_env: INSIDER_PG_HOST
      com.provisa.demo.ns_env: INSIDER_PG_NS
      com.provisa.demo.access: db/reader.sql
      com.provisa.demo.port_env: INSIDER_PG_PORT
      com.provisa.demo.port: "5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: insider
    ports:
      # Unset: 28232. Set empty (the node, which runs several versions at once): a port docker
      # picks. On the loopback only.
      - "127.0.0.1:${INSIDER_PG_PORT-28232}:5432"
    volumes:
      - insider_run_pg:/var/lib/postgresql/data
      - ./dump/postgres:/dumps:ro
      - ./dump/load-postgres.sh:/docker-entrypoint-initdb.d/10-load.sh:ro
      - ./db/reader.sql:/docker-entrypoint-initdb.d/20-reader.sql:ro
      - ./db/init-complete.sh:/docker-entrypoint-initdb.d/99-complete.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/lib/postgresql/data/.provisa-init-complete && pg_isready -U postgres -d insider"]
      interval: 2s
      timeout: 5s
      retries: 60
      # The first start loads the dump before the marker is written; failures meanwhile do
      # not count.
      start_period: 600s

volumes:
  insider_run_pg:
