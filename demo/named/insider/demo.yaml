# The insider demo's card on provisa.dev's live demos page (REQ-2006), generated from this file
# by scripts/gen-site-demos.mjs. published: true once card.png, a screenshot of the demo in
# Provisa, is beside it.
title: Insider review
description: >-
  A bank's outbound mail matched against its control room's watch list of deals in discussion, by
  name, ticker and code name and, through a local embedding model, by meaning, and checked for
  customer data: one ranked review queue, with the watch list itself never shown to the reviewer.
screenshot: card.png
published: true
# The oldest Provisa this demo's bundle runs on (REQ-2049): a puller running an older one is refused
# by name. The first release carrying the demo and its Polly answers made at the bundle build.
requires_provisa: 0.1.0a490
# Its matching embeds each message with a local sentence-transformers model: the vector extra.
extras:
- vector
