# The WHOLE config of the named demo "insider" (start-ui-install.sh --demo insider; REQ-2056): is
# anyone sending deal-sensitive or customer data out of the bank? Northgate Partners, a fictional
# bank, reviews its outbound mail against its control room's watch list of the deals in discussion.
# Every message its employees sent is matched to every deal (message_deal_signals, then
# match_deals, setup.yaml) -- the company's names, its ticker, the code name, and the deal in other
# words through the demo's own local embedding model -- and weighted by who sent it and where it
# went; the same mail is checked for customer data. One materialized view is the review queue, over
# three systems:
#
#   mail             the bank's Microsoft 365 mail: the canonical messages and message_recipients
#                    tables, each message in its sender's mailbox. No sandbox has a tenant, so the
#                    source's replica is the demo's declared rows (replica_rows/mail/, REQ-2089) and
#                    never refreshes (cache_ttl: -1): Microsoft Graph is never read
#   control_room     the control room's watch list, an Excel workbook (control_room/watch_list.xlsx):
#                    the deals, who was brought over the wall for each, each deal's counterparties
#                    and the screening scope, a sheet each
#   bank             the bank's Postgres: its employees and desks, its customers and who read them,
#                    the personal mail providers compliance lists, and the match signals (db/init.sql)
#   insider_signals  a code resolver (code/insider_signals.tar.gz, its source in insider_signals/):
#                    deal_signals, the column transform that matches a message to a deal
#
# Governance is half the demo: the watch list is read only by the control room (and a deal team,
# its own deal's rows); a first-level reviewer reads only the queue's rows of their own desks -- the
# flagged entity, the deal withheld -- and never a row of the list; the customer records are tagged
# pii. A read of the queue is governed against the tables it reads, so the queue reads deal_match
# (which match_deals writes the flagged entity into) and not the watch list.
auth:
  assignments_source: provisa
  default_assignments:
  - domain_id: '*'
    role_id: org_admin
  provider: none
cache:
  default_ttl: 300
  enabled: true
domains:
- id: bank
  description: Northgate Partners, a fictional bank -- its Microsoft 365 mail, its control room's
    watch list workbook and its own database of employees and customers -- its outbound mail reviewed
    for deal-sensitive and customer data
federation_engine: duckdb
naming:
  domain_prefix: true
  rules: []
roles:
# The control room: the watch list and every case.
- id: control_room
  parents: [analyst]
  description: "The control room: the watch list and every case."
  capabilities: [data_product_read, glossary_read, query_development]
  domain_access: [bank]
# First-level reviewers: their own desks' cases, the deal withheld; never the watch list.
- id: reviewer_ana
  parents: [analyst]
  description: "A first-level reviewer: the cases of the desks Ana reviews, the deal withheld, never the watch list."
  capabilities: [data_product_read, glossary_read, query_development]
  domain_access: [bank]
- id: reviewer_ben
  parents: [analyst]
  description: "A first-level reviewer: the cases of the desks Ben reviews, the deal withheld, never the watch list."
  capabilities: [data_product_read, glossary_read, query_development]
  domain_access: [bank]
# A deal team: its own deal's rows of the watch list and of the queue.
- id: deal_team_falcon
  parents: [analyst]
  description: "The Falcon deal team: its own deal's rows of the watch list and of the review queue."
  capabilities: [data_product_read, glossary_read, query_development]
  domain_access: [bank]
server:
  limits:
    default_row_limit: 100
    request_timeout: 120
    trino_query_timeout: 120
vector_models:
# A local sentence-transformers model: no key, no network once it is cached (provisa[vector],
# which demo.yaml declares). match_deals reads each message close to a deal's description with it.
- id: sentence-transformers/all-MiniLM-L6-v2
  provider: huggingface
  dimensions: 384
  enabled: true
sources:
- id: bank
  type: postgresql
  host: ${env:INSIDER_PG_HOST:-localhost}
  port: ${env:INSIDER_PG_PORT:-28232}
  database: insider${env:INSIDER_PG_NS}
  username: provisa
  password: provisa
  description: Northgate Partners' database, read live
# The bank's mail in Microsoft 365, every mailbox. Its replica is the demo's declared rows
# (replica_rows/mail/, REQ-2089): it never refreshes, so nothing reads Microsoft Graph.
- id: mail
  type: microsoft_365
  cache_ttl: -1
  mapping:
    resources: [mail]
    mailboxes:
      everyone: true
    mail_since: "2026-10-01"
  description: Northgate Partners' Microsoft 365 mail, every employee's mailbox
# The control room's own workbook: the watch list, one sheet for each of its tables.
- id: control_room
  type: files
  path: ${env:PROVISA_NAMED_DEMO_DIR}/control_room
  description: The control room's watch list, an Excel workbook it keeps itself
- id: insider_signals
  type: python
  mapping:
    runtime: python
    code:
      kind: upload
      upload: 4734fa5817cc32692bb44f133e42e2b227166bb3f4d6b2ea203622af171567df
      filename: insider_signals.tar.gz
  description: 'deal_signals: what a message says of a watch-list deal, by name and by meaning (code/insider_signals.tar.gz,
    its source in insider_signals/)'
tables:
- source_id: bank
  domain_id: bank
  schema: bank
  table: deal_match
  enable_aggregates: true
  enable_group_by: true
  description: 'Per message and deal it speaks of: how strongly it names the deal, how close it reads to
    the deal, the signals, whether its sender is on the deal''s team, whether it went to one of the
    deal''s counterparties and whether it was sent before the announcement; written by match_deals'
  columns:
  - {name: message_id, data_type: varchar, description: 'The message', visible_to: [data_steward, control_room, deal_team_falcon, reviewer_ana, reviewer_ben], is_primary_key: true}
  - {name: deal_id, data_type: varchar, description: 'The deal', visible_to: [data_steward, control_room, deal_team_falcon, reviewer_ana, reviewer_ben], is_primary_key: true}
  - {name: flagged_entity, data_type: varchar, description: 'The flagged entity: the company the deal is about', visible_to: [data_steward, control_room, deal_team_falcon, reviewer_ana, reviewer_ben]}
  - {name: name_match, data_type: double, description: 'The strongest match of the company''s names, its ticker or the code name, from 0 to 1', visible_to: [data_steward, control_room, deal_team_falcon, reviewer_ana, reviewer_ben]}
  - {name: meaning_match, data_type: double, description: 'How close the message reads to the deal''s description, from 0 to 1', visible_to: [data_steward, control_room, deal_team_falcon, reviewer_ana, reviewer_ben]}
  - {name: signals, data_type: varchar, description: 'The signals that fired: legal_name, alias, ticker, code_name, meaning', visible_to: [data_steward, control_room, deal_team_falcon, reviewer_ana, reviewer_ben]}
  - {name: sender_on_team, data_type: integer, description: '1 when its sender was brought over the wall for the deal', visible_to: [data_steward, control_room, deal_team_falcon, reviewer_ana, reviewer_ben]}
  - {name: to_counterparty, data_type: integer, description: '1 when it went to one of the deal''s own counterparties', visible_to: [data_steward, control_room, deal_team_falcon, reviewer_ana, reviewer_ben]}
  - {name: before_announcement, data_type: integer, description: '1 when it was sent before the deal was announced', visible_to: [data_steward, control_room, deal_team_falcon, reviewer_ana, reviewer_ben]}
  write_grants:
  - {role: org_admin, operation: insert, columns: [message_id, deal_id, flagged_entity, name_match, meaning_match, signals, sender_on_team, to_counterparty, before_announcement]}
  - {role: org_admin, operation: update, columns: [message_id, deal_id, flagged_entity, name_match, meaning_match, signals, sender_on_team, to_counterparty, before_announcement]}
  - {role: org_admin, operation: delete}
- source_id: bank
  domain_id: bank
  schema: bank
  table: employee
  enable_aggregates: true
  enable_group_by: true
  description: 'The bank''''s employees and their desks'
  columns:
  - {name: employee_id, data_type: varchar, description: 'The employee', visible_to: [data_steward, control_room, deal_team_falcon, reviewer_ana, reviewer_ben], is_primary_key: true}
  - {name: name, data_type: varchar, description: 'Their name', visible_to: [data_steward, control_room, deal_team_falcon, reviewer_ana, reviewer_ben]}
  - {name: email, data_type: varchar, description: 'Their bank address', visible_to: [data_steward, control_room, deal_team_falcon, reviewer_ana, reviewer_ben]}
  - {name: desk, data_type: varchar, description: 'Their desk', visible_to: [data_steward, control_room, deal_team_falcon, reviewer_ana, reviewer_ben]}
- source_id: bank
  domain_id: bank
  schema: bank
  table: desk_reviewer
  enable_aggregates: true
  enable_group_by: true
  description: 'Which first-level reviewer each desk''''s mail goes to'
  columns:
  - {name: desk, data_type: varchar, description: 'The desk', visible_to: [data_steward, control_room, deal_team_falcon, reviewer_ana, reviewer_ben], is_primary_key: true}
  - {name: reviewer, data_type: varchar, description: 'The reviewer''''s role', visible_to: [data_steward, control_room, deal_team_falcon, reviewer_ana, reviewer_ben]}
- source_id: bank
  domain_id: bank
  schema: bank
  table: customer
  enable_aggregates: true
  enable_group_by: true
  description: 'The bank''''s customers'
  columns:
  - {name: customer_id, data_type: varchar, description: 'The customer', visible_to: [data_steward, control_room], is_primary_key: true}
  - {name: name, data_type: varchar, description: 'Their name', visible_to: [data_steward, control_room]}
  - {name: email, data_type: varchar, description: 'Their address', visible_to: [data_steward, control_room]}
  - {name: ssn, data_type: varchar, description: 'Their social security number', visible_to: [data_steward, control_room]}
  - {name: account_no, data_type: varchar, description: 'Their account number', visible_to: [data_steward, control_room]}
- source_id: bank
  domain_id: bank
