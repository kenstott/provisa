# The WHOLE config of the named demo "insider" (start-ui-install.sh --demo insider; REQ-2056): is
# anyone sending deal-sensitive or customer data out of the bank? Northgate Partners, a fictional
# bank, reviews its outbound mail against its control room's watch list of the deals in discussion.
# Every message its employees sent is matched to every deal (match_deals, setup.yaml) -- the
# company's names, its ticker, the code name, and the deal in other words through the demo's own
# local embedding model -- and weighted by who sent it and where it went; the same mail is checked
# for customer data. One materialized view is the review queue, over three systems:
#
#   mail          the bank's Microsoft 365 mail: the canonical messages and message_recipients
#                 tables, each message in its sender's mailbox. No sandbox has a tenant, so the
#                 source's replica is the demo's declared rows (replica_rows/mail/, REQ-2089) and
#                 never refreshes (cache_ttl: -1)
#   control_room  the control room's watch list, an Excel workbook (control_room/watch_list.xlsx):
#                 the deals, who was brought over the wall for each, and each deal's counterparties
#   bank          the bank's Postgres: its employees and desks, its customers and who read them, the
#                 personal mail providers compliance lists, and the match signals (db/init.sql)
#
# Governance is half the demo: the watch list is read only by the control room (and a deal team,
# its own deal's rows); a first-level reviewer reads only the queue's rows of their own desks -- the
# flagged entity, the deal withheld -- and never a row of the list; the customer records are tagged
# pii. A read of the queue is governed against the tables it reads, so the queue reads deal_match
# (which match_deals writes the flagged entity into) and not the watch list.
auth:
  assignments_source: provisa
  default_assignments:
  - domain_id: '*'
    role_id: org_admin
  provider: none
cache:
  default_ttl: 300
  enabled: true
domains:
- id: bank
  description: Northgate Partners, a fictional bank -- its Microsoft 365 mail, its control room's
    watch list workbook and its own database of employees and customers -- its outbound mail reviewed
    for deal-sensitive and customer data
federation_engine: duckdb
naming:
  domain_prefix: true
  rules: []
roles:
# The control room: the watch list and every case.
- id: control_room
  description: "The control room: the watch list and every case."
  capabilities: [query_development]
  domain_access: [bank]
# First-level reviewers: their own desks' cases, the deal withheld; never the watch list.
- id: reviewer_ana
  description: "A first-level reviewer: the cases of the desks Ana reviews, the deal withheld, never the watch list."
  capabilities: [query_development]
  domain_access: [bank]
- id: reviewer_ben
  description: "A first-level reviewer: the cases of the desks Ben reviews, the deal withheld, never the watch list."
  capabilities: [query_development]
  domain_access: [bank]
# A deal team: its own deal's rows of the watch list and of the queue.
- id: deal_team_falcon
  description: "The Falcon deal team: its own deal's rows of the watch list and of the review queue."
  capabilities: [query_development]
  domain_access: [bank]
server:
  limits:
    default_row_limit: 100
    request_timeout: 120
    trino_query_timeout: 120
vector_models:
# A local sentence-transformers model: no key, no network once it is cached (provisa[vector],
# which demo.yaml declares). match_deals reads each message close to a deal's description with it.
- id: sentence-transformers/all-MiniLM-L6-v2
  provider: huggingface
  dimensions: 384
  enabled: true
sources:
- id: bank
  type: postgresql
  host: ${env:INSIDER_PG_HOST:-localhost}
  port: ${env:INSIDER_PG_PORT:-28232}
  database: insider
  username: provisa
  password: provisa
  description: Northgate Partners' database, read live
# The bank's mail in Microsoft 365, every mailbox. Its replica is the demo's declared rows
# (replica_rows/mail/, REQ-2089): it never refreshes, so no sandbox reads Microsoft Graph.
- id: mail
  type: microsoft_365
  cache_ttl: -1
  mapping:
    resources: [mail]
    mailboxes:
      everyone: true
    mail_since: "2026-10-01"
  description: Northgate Partners' Microsoft 365 mail, every employee's mailbox
# The control room's own workbook: the watch list, one sheet for each of its tables.
- id: control_room
  type: files
  path: ${env:PROVISA_NAMED_DEMO_DIR}/control_room
  description: The control room's watch list, an Excel workbook it keeps itself
tables:
- source_id: bank
  domain_id: bank
  schema: bank
  table: deal_match
  enable_aggregates: true
  enable_group_by: true
  description: 'Per message and deal it speaks of: how strongly it names the deal, how close it reads to
    the deal, the signals, whether its sender is on the deal''s team, whether it went to one of the
    deal''s counterparties and whether it was sent before the announcement; written by match_deals'
  columns:
  - {name: message_id, data_type: varchar, description: 'The message', visible_to: [org_admin, control_room, deal_team_falcon, reviewer_ana, reviewer_ben], is_primary_key: true}
  - {name: deal_id, data_type: varchar, description: 'The deal', visible_to: [org_admin, control_room, deal_team_falcon, reviewer_ana, reviewer_ben], is_primary_key: true}
  - {name: flagged_entity, data_type: varchar, description: 'The flagged entity: the company the deal is about', visible_to: [org_admin, control_room, deal_team_falcon, reviewer_ana, reviewer_ben]}
  - {name: name_match, data_type: double, description: 'The strongest match of the company''s names, its ticker or the code name, from 0 to 1', visible_to: [org_admin, control_room, deal_team_falcon, reviewer_ana, reviewer_ben]}
  - {name: meaning_match, data_type: double, description: 'How close the message reads to the deal''s description, from 0 to 1', visible_to: [org_admin, control_room, deal_team_falcon, reviewer_ana, reviewer_ben]}
  - {name: signals, data_type: varchar, description: 'The signals that fired: legal_name, alias, ticker, code_name, meaning', visible_to: [org_admin, control_room, deal_team_falcon, reviewer_ana, reviewer_ben]}
  - {name: sender_on_team, data_type: integer, description: '1 when its sender was brought over the wall for the deal', visible_to: [org_admin, control_room, deal_team_falcon, reviewer_ana, reviewer_ben]}
  - {name: to_counterparty, data_type: integer, description: '1 when it went to one of the deal''s own counterparties', visible_to: [org_admin, control_room, deal_team_falcon, reviewer_ana, reviewer_ben]}
  - {name: before_announcement, data_type: integer, description: '1 when it was sent before the deal was announced', visible_to: [org_admin, control_room, deal_team_falcon, reviewer_ana, reviewer_ben]}
  write_grants:
  - {role: org_admin, operation: insert, columns: [message_id, deal_id, flagged_entity, name_match, meaning_match, signals, sender_on_team, to_counterparty, before_announcement]}
  - {role: org_admin, operation: update, columns: [message_id, deal_id, flagged_entity, name_match, meaning_match, signals, sender_on_team, to_counterparty, before_announcement]}
  - {role: org_admin, operation: delete}
- source_id: bank
  domain_id: bank
  schema: bank
  table: employee
  enable_aggregates: true
  enable_group_by: true
  description: 'The bank''''s employees and their desks'
  columns:
  - {name: employee_id, data_type: varchar, description: 'The employee', visible_to: [org_admin, control_room, deal_team_falcon, reviewer_ana, reviewer_ben], is_primary_key: true}
  - {name: name, data_type: varchar, description: 'Their name', visible_to: [org_admin, control_room, deal_team_falcon, reviewer_ana, reviewer_ben]}
  - {name: email, data_type: varchar, description: 'Their bank address', visible_to: [org_admin, control_room, deal_team_falcon, reviewer_ana, reviewer_ben]}
  - {name: desk, data_type: varchar, description: 'Their desk', visible_to: [org_admin, control_room, deal_team_falcon, reviewer_ana, reviewer_ben]}
- source_id: bank
  domain_id: bank
  schema: bank
  table: desk_reviewer
  enable_aggregates: true
  enable_group_by: true
  description: 'Which first-level reviewer each desk''''s mail goes to'
  columns:
  - {name: desk, data_type: varchar, description: 'The desk', visible_to: [org_admin, control_room, deal_team_falcon, reviewer_ana, reviewer_ben], is_primary_key: true}
  - {name: reviewer, data_type: varchar, description: 'The reviewer''''s role', visible_to: [org_admin, control_room, deal_team_falcon, reviewer_ana, reviewer_ben]}
- source_id: bank
  domain_id: bank
  schema: bank
  table: customer
  enable_aggregates: true
  enable_group_by: true
  description: 'The bank''''s customers'
  columns:
  - {name: customer_id, data_type: varchar, description: 'The customer', visible_to: [org_admin, control_room], is_primary_key: true}
  - {name: name, data_type: varchar, description: 'Their name', visible_to: [org_admin, control_room]}
  - {name: email, data_type: varchar, description: 'Their address', visible_to: [org_admin, control_room]}
  - {name: ssn, data_type: varchar, description: 'Their social security number', visible_to: [org_admin, control_room]}
  - {name: account_no, data_type: varchar, description: 'Their account number', visible_to: [org_admin, control_room]}
- source_id: bank
  domain_id: bank
  schema: bank
  table: customer_access
  enable_aggregates: true
  enable_group_by: true
  description: 'The bank''''s own log of who read customer records, and when'
  columns:
  - {name: access_id, data_type: integer, description: 'The read', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben], is_primary_key: true}
  - {name: employee_id, data_type: varchar, description: 'Who read', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: accessed_at, data_type: timestamp, description: 'When', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: table_name, data_type: varchar, description: 'What they read', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: records_read, data_type: integer, description: 'How many records', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
- source_id: control_room
  domain_id: bank
  schema: control_room
  table: watch_list__deals
  alias: deal
  enable_aggregates: true
  enable_group_by: true
  description: 'The control room''s watch list, its workbook''s sheet "deals": each deal in discussion, its code name, the company, aliases and ticker, what kind of deal it is, and when it was announced'
  columns:
  - {name: deal_id, data_type: varchar, description: 'The deal', visible_to: [org_admin, control_room, deal_team_falcon], is_primary_key: true}
  - {name: code_name, data_type: varchar, description: 'The project code name the deal team uses', visible_to: [org_admin, control_room, deal_team_falcon]}
  - {name: legal_name, data_type: varchar, description: 'The company''s legal name', visible_to: [org_admin, control_room, deal_team_falcon]}
  - {name: aliases, data_type: varchar, description: 'Other names the company goes by, separated by semicolons', visible_to: [org_admin, control_room, deal_team_falcon]}
  - {name: ticker, data_type: varchar, description: 'The company''s ticker', visible_to: [org_admin, control_room, deal_team_falcon]}
  - {name: deal_type, data_type: varchar, description: 'merger, acquisition, loan or underwriting', visible_to: [org_admin, control_room, deal_team_falcon]}
  - {name: description, data_type: varchar, description: 'What the deal is, in a sentence', visible_to: [org_admin, control_room, deal_team_falcon]}
  - {name: announced_on, data_type: varchar, description: 'When the deal was announced, as YYYY-MM-DD; empty while it is not public', visible_to: [org_admin, control_room, deal_team_falcon]}
- source_id: control_room
  domain_id: bank
  schema: control_room
  table: watch_list__deal_team
  alias: deal_team
  enable_aggregates: true
  enable_group_by: true
  description: 'Who was brought over the wall for each deal, and when, the workbook''s sheet "deal_team"'
  columns:
  - {name: deal_id, data_type: varchar, description: 'The deal', visible_to: [org_admin, control_room, deal_team_falcon], is_primary_key: true}
  - {name: employee_id, data_type: varchar, description: 'The employee brought over the wall', visible_to: [org_admin, control_room, deal_team_falcon], is_primary_key: true}
  - {name: over_wall_at, data_type: varchar, description: 'When they were brought over the wall, ISO-8601', visible_to: [org_admin, control_room, deal_team_falcon]}
- source_id: control_room
  domain_id: bank
  schema: control_room
  table: watch_list__counterparties
  alias: deal_counterparty
  enable_aggregates: true
  enable_group_by: true
  description: 'The mail domains of each deal''s own counterparties: the company, its counsel; the workbook''s sheet "counterparties"'
  columns:
  - {name: deal_id, data_type: varchar, description: 'The deal', visible_to: [org_admin, control_room, deal_team_falcon], is_primary_key: true}
  - {name: domain, data_type: varchar, description: 'A counterparty''s mail domain', visible_to: [org_admin, control_room, deal_team_falcon], is_primary_key: true}
- source_id: mail
  domain_id: bank
  schema: default
  table: messages
  enable_aggregates: true
  enable_group_by: true
  description: 'The employees'' sent mail, in Microsoft 365: one row a message, in its sender''s mailbox'
  columns:
  - {name: provider, data_type: varchar, description: 'The mail platform: microsoft', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: account, data_type: varchar, description: 'The mailbox it is held in: its sender''s', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: id, data_type: varchar, description: 'The message', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben], is_primary_key: true}
  - {name: thread_id, data_type: varchar, description: 'Its conversation', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: internet_message_id, data_type: varchar, description: 'Its Message-ID header', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: in_reply_to, data_type: varchar, description: 'Microsoft Graph''s in reply to', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: reference_ids, data_type: json, description: 'Microsoft Graph''s reference ids', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: subject, data_type: varchar, description: 'Its subject', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: snippet, data_type: varchar, description: 'The start of its text', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: from_address, data_type: varchar, description: 'Who sent it: their address', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: from_name, data_type: varchar, description: 'Who sent it: their name', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: sender_address, data_type: varchar, description: 'Microsoft Graph''s sender address', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: to_addresses, data_type: json, description: 'Its To recipients, a JSON list', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: cc_addresses, data_type: json, description: 'Its Cc recipients, a JSON list', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: bcc_addresses, data_type: json, description: 'Its Bcc recipients, a JSON list', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: reply_to_addresses, data_type: json, description: 'Microsoft Graph''s reply to addresses', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: sent_at, data_type: timestamp, description: 'When it was sent', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: received_at, data_type: timestamp, description: 'When the mailbox received it', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: created_at, data_type: timestamp, description: 'Microsoft Graph''s created at', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: updated_at, data_type: timestamp, description: 'Microsoft Graph''s updated at', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: is_read, data_type: boolean, description: 'Microsoft Graph''s is read', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: is_draft, data_type: boolean, description: 'Microsoft Graph''s is draft', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: is_flagged, data_type: boolean, description: 'Microsoft Graph''s is flagged', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: flag_status, data_type: varchar, description: 'Microsoft Graph''s flag status', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: importance, data_type: varchar, description: 'Microsoft Graph''s importance', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: has_attachments, data_type: boolean, description: 'Whether it carries attachments', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: size_bytes, data_type: bigint, description: 'Microsoft Graph''s size bytes', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: folder_ids, data_type: json, description: 'The folders it is in, a JSON list', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: categories, data_type: json, description: 'Microsoft Graph''s categories', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: inference_classification, data_type: varchar, description: 'Microsoft Graph''s inference classification', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: is_read_receipt_requested, data_type: boolean, description: 'Microsoft Graph''s is read receipt requested', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: is_delivery_receipt_requested, data_type: boolean, description: 'Microsoft Graph''s is delivery receipt requested', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: body_text, data_type: varchar, description: 'Its text', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: body_html, data_type: varchar, description: 'Its HTML', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: headers, data_type: json, description: 'Its internet headers, a JSON list', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: change_key, data_type: varchar, description: 'Microsoft Graph''s change key', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: web_link, data_type: varchar, description: 'Microsoft Graph''s web link', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: classification_labels, data_type: json, description: 'Microsoft Graph''s classification labels', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: conversation_index, data_type: varchar, description: 'Microsoft Graph''s conversation index', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: flag_start_at, data_type: timestamp, description: 'Microsoft Graph''s flag start at', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: flag_due_at, data_type: timestamp, description: 'Microsoft Graph''s flag due at', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: flag_completed_at, data_type: timestamp, description: 'Microsoft Graph''s flag completed at', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: landed_at, data_type: timestamp, description: 'When this row was landed', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
- source_id: mail
  domain_id: bank
  schema: default
  table: message_recipients
  enable_aggregates: true
  enable_group_by: true
  description: 'Each message''s sender and recipients, in Microsoft 365: one row an address'
  columns:
  - {name: provider, data_type: varchar, description: 'The mail platform: microsoft', visible_to: [org_admin, control_room]}
  - {name: account, data_type: varchar, description: 'The mailbox the message is held in', visible_to: [org_admin, control_room]}
  - {name: message_id, data_type: varchar, description: 'The message', visible_to: [org_admin, control_room], is_primary_key: true}
  - {name: kind, data_type: varchar, description: 'from, to, cc or bcc', visible_to: [org_admin, control_room], is_primary_key: true}
  - {name: position, data_type: bigint, description: 'Its place among the kind', visible_to: [org_admin, control_room], is_primary_key: true}
  - {name: address, data_type: varchar, description: 'The address', visible_to: [org_admin, control_room]}
  - {name: name, data_type: varchar, description: 'The name shown with it', visible_to: [org_admin, control_room]}
  - {name: landed_at, data_type: timestamp, description: 'When this row was landed', visible_to: [org_admin, control_room]}
- source_id: bank
  domain_id: bank
  schema: bank
  table: personal_mail_domain
  enable_aggregates: true
  enable_group_by: true
  description: 'The personal mail providers the bank''s compliance team lists: mail to one is mail to a person'
  columns:
  - {name: domain, data_type: varchar, description: 'A personal mail provider''s domain', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben], is_primary_key: true}
views:
- id: review_queue
  domain_id: bank
  materialize: true
  enable_aggregates: true
  enable_group_by: true
  description: 'The review queue: per message and deal, or per message carrying customer data, its
    score and the signals that fired; a first-level reviewer reads their own desks'' cases, the deal withheld'
  sql: >-
    SELECT c.message_id, c.deal_id, c.flagged_entity AS flagged, e.name AS sender, e.desk, r.reviewer,
      m.sent_at, m.subject, c.signals,
      1 - c.sender_on_team AS outside_team,
      CASE WHEN w.outside_recipients > 0 THEN 1 ELSE 0 END AS outside_bank,
      CASE WHEN w.personal_recipients > 0 THEN 1 ELSE 0 END AS personal,
      c.before_announcement, c.to_counterparty,
      ROUND(CAST(GREATEST(c.name_match, c.meaning_match)
        * (0.5 + 0.5 * (1 - c.sender_on_team)
          + 0.5 * CASE WHEN w.outside_recipients > 0 THEN 1 ELSE 0 END
          + 0.3 * CASE WHEN w.personal_recipients > 0 THEN 1 ELSE 0 END)
        * CASE WHEN c.before_announcement = 1 THEN 1.3 ELSE 0.4 END
        * CASE WHEN c.sender_on_team = 1 AND c.to_counterparty = 1 THEN 0.3 ELSE 1 END AS NUMERIC), 3) AS score
    FROM "bank"."deal_match" AS c
    JOIN "bank"."messages" AS m ON m.id = c.message_id
    JOIN "bank"."employee" AS e ON e.email = m.from_address
    JOIN "bank"."desk_reviewer" AS r ON r.desk = e.desk
    JOIN (SELECT rc.message_id,
        SUM(CASE WHEN be.employee_id IS NULL THEN 1 ELSE 0 END) AS outside_recipients,
        SUM(CASE WHEN pd.domain IS NOT NULL THEN 1 ELSE 0 END) AS personal_recipients
      FROM "bank"."message_recipients" AS rc
      LEFT JOIN "bank"."employee" AS be ON be.email = rc.address
      LEFT JOIN "bank"."personal_mail_domain" AS pd ON pd.domain = SPLIT_PART(rc.address, '@', 2)
      WHERE rc.kind IN ('to', 'cc', 'bcc')
      GROUP BY rc.message_id) AS w ON w.message_id = m.id
    UNION ALL
    SELECT m.id AS message_id, CAST(NULL AS VARCHAR) AS deal_id, 'customer data' AS flagged,
      e.name AS sender, e.desk, r.reviewer, m.sent_at, m.subject,
      CONCAT_WS(', ',
        CASE WHEN REGEXP_LIKE(m.body_text, '[0-9]{3}-[0-9]{2}-[0-9]{4}') THEN 'ssn' END,
        CASE WHEN REGEXP_LIKE(m.body_text, 'ACCT-[0-9]{8}') THEN 'account number' END,
        CASE WHEN SUM(CASE WHEN a.accessed_at BETWEEN m.sent_at - INTERVAL '7 days' AND m.sent_at
          THEN a.records_read ELSE 0 END) > 0 THEN 'read customer records that week' END) AS signals,
      0 AS outside_team,
      CASE WHEN w.outside_recipients > 0 THEN 1 ELSE 0 END AS outside_bank,
      CASE WHEN w.personal_recipients > 0 THEN 1 ELSE 0 END AS personal,
      0 AS before_announcement, 0 AS to_counterparty,
      ROUND(CAST(0.5 * (CASE WHEN REGEXP_LIKE(m.body_text, '[0-9]{3}-[0-9]{2}-[0-9]{4}') THEN 1 ELSE 0 END
          + CASE WHEN REGEXP_LIKE(m.body_text, 'ACCT-[0-9]{8}') THEN 1 ELSE 0 END)
        * (0.5 + 0.5 * CASE WHEN w.outside_recipients > 0 THEN 1 ELSE 0 END
          + 0.3 * CASE WHEN w.personal_recipients > 0 THEN 1 ELSE 0 END)
        * CASE WHEN SUM(CASE WHEN a.accessed_at BETWEEN m.sent_at - INTERVAL '7 days' AND m.sent_at
          THEN a.records_read ELSE 0 END) > 0 THEN 2 ELSE 1 END AS NUMERIC), 3) AS score
    FROM "bank"."messages" AS m
    JOIN "bank"."employee" AS e ON e.email = m.from_address
    JOIN "bank"."desk_reviewer" AS r ON r.desk = e.desk
    JOIN (SELECT rc.message_id,
        SUM(CASE WHEN be.employee_id IS NULL THEN 1 ELSE 0 END) AS outside_recipients,
        SUM(CASE WHEN pd.domain IS NOT NULL THEN 1 ELSE 0 END) AS personal_recipients
      FROM "bank"."message_recipients" AS rc
      LEFT JOIN "bank"."employee" AS be ON be.email = rc.address
      LEFT JOIN "bank"."personal_mail_domain" AS pd ON pd.domain = SPLIT_PART(rc.address, '@', 2)
      WHERE rc.kind IN ('to', 'cc', 'bcc')
      GROUP BY rc.message_id) AS w ON w.message_id = m.id
    LEFT JOIN "bank"."customer_access" AS a ON a.employee_id = e.employee_id
    WHERE REGEXP_LIKE(m.body_text, '[0-9]{3}-[0-9]{2}-[0-9]{4}') OR REGEXP_LIKE(m.body_text, 'ACCT-[0-9]{8}')
    GROUP BY m.id, m.sent_at, m.subject, m.body_text, w.outside_recipients,
      w.personal_recipients, e.name, e.desk, r.reviewer
  columns:
  - {name: message_id, data_type: varchar, description: The message, visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: deal_id, data_type: varchar, description: 'The deal it was matched to; withheld from a first-level reviewer', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben], masks: [{to: [org_admin, control_room]}, {to: ['*'], mask: {type: constant, value: withheld}}]}
  - {name: flagged, data_type: varchar, description: 'The flagged entity: the company the deal is about, or customer data', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: sender, data_type: varchar, description: Who sent it, visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: desk, data_type: varchar, description: The sender''s desk, visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: reviewer, data_type: varchar, description: The first-level reviewer the case goes to, visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: sent_at, data_type: timestamp, description: When it was sent, visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: subject, data_type: varchar, description: Its subject, visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: signals, data_type: varchar, description: What it matched, visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: outside_team, data_type: integer, description: 1 when its sender was not on the deal''s team, visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: outside_bank, data_type: integer, description: 1 when a recipient was outside the bank, visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: personal, data_type: integer, description: 1 when a recipient was a personal address, visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: before_announcement, data_type: integer, description: 1 when it was sent before the deal was announced, visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: to_counterparty, data_type: integer, description: 1 when it went to one of the deal''s own counterparties, visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
  - {name: score, data_type: double, description: 'The score: the match weighted by who sent it and where it went', visible_to: [org_admin, control_room, reviewer_ana, reviewer_ben]}
functions:
# Every message matched to every deal, as signals in deal_signal (matching.py).
- name: match_deals
  function_name: match_deals
  impl_kind: python
  kind: mutation
  domain_id: bank
  description: Match every message to every watch-list deal -- its names, ticker and code name, and its
    description by meaning through the local embedding model -- and write what it finds to deal_match
  source_id: ''
  returns: ''
  visible_to: [org_admin]
  binding:
    callable: demo.named.insider.matching:match_deals
rls_rules:
# A first-level reviewer reads only the mail of the desks they review and the matches of that mail
# (the flagged entity among them); of the watch list itself, nothing: no grant names them.
- {description: "Ana reads only the mail sent from the desks she reviews.", table_id: messages, role_id: reviewer_ana, filter: "from_address IN (SELECT own_e.email FROM \"bank\".\"employee\" AS own_e JOIN \"bank\".\"desk_reviewer\" AS own_r ON own_r.desk = own_e.desk WHERE own_r.reviewer = current_setting('provisa.role'))"}
- {description: "Ana reads only the customer accesses of the desks she reviews.", table_id: customer_access, role_id: reviewer_ana, filter: "employee_id IN (SELECT own_e.employee_id FROM \"bank\".\"employee\" AS own_e JOIN \"bank\".\"desk_reviewer\" AS own_r ON own_r.desk = own_e.desk WHERE own_r.reviewer = current_setting('provisa.role'))"}
- {description: "Ana reads only the matches in the mail of the desks she reviews.", table_id: deal_match, role_id: reviewer_ana, filter: "message_id IN (SELECT own_m.id FROM \"bank\".\"messages\" AS own_m WHERE own_m.from_address IN (SELECT own_e.email FROM \"bank\".\"employee\" AS own_e JOIN \"bank\".\"desk_reviewer\" AS own_r ON own_r.desk = own_e.desk WHERE own_r.reviewer = current_setting('provisa.role')))"}
- {description: "Ben reads only the mail sent from the desks he reviews.", table_id: messages, role_id: reviewer_ben, filter: "from_address IN (SELECT own_e.email FROM \"bank\".\"employee\" AS own_e JOIN \"bank\".\"desk_reviewer\" AS own_r ON own_r.desk = own_e.desk WHERE own_r.reviewer = current_setting('provisa.role'))"}
- {description: "Ben reads only the customer accesses of the desks he reviews.", table_id: customer_access, role_id: reviewer_ben, filter: "employee_id IN (SELECT own_e.employee_id FROM \"bank\".\"employee\" AS own_e JOIN \"bank\".\"desk_reviewer\" AS own_r ON own_r.desk = own_e.desk WHERE own_r.reviewer = current_setting('provisa.role'))"}
- {description: "Ben reads only the matches in the mail of the desks he reviews.", table_id: deal_match, role_id: reviewer_ben, filter: "message_id IN (SELECT own_m.id FROM \"bank\".\"messages\" AS own_m WHERE own_m.from_address IN (SELECT own_e.email FROM \"bank\".\"employee\" AS own_e JOIN \"bank\".\"desk_reviewer\" AS own_r ON own_r.desk = own_e.desk WHERE own_r.reviewer = current_setting('provisa.role')))"}
# A deal team reads only its own deal of the watch list.
- {description: "The Falcon team reads only its own deal.", table_id: deal, role_id: deal_team_falcon, filter: "deal_id = 'D-01'"}
- {description: "The Falcon team reads only its own deal's team.", table_id: deal_team, role_id: deal_team_falcon, filter: "deal_id = 'D-01'"}
- {description: "The Falcon team reads only its own deal's counterparties.", table_id: deal_counterparty, role_id: deal_team_falcon, filter: "deal_id = 'D-01'"}
- {description: "The Falcon team reads only the matches on its own deal.", table_id: deal_match, role_id: deal_team_falcon, filter: "deal_id = 'D-01'"}
tag_assignments:
# The customer records are pii: every read of them is in the record (ops.pii_access).
- {tag_id: pii, object_type: column, table_ref: bank.bank.customer, column_name: name}
- {tag_id: pii, object_type: column, table_ref: bank.bank.customer, column_name: email}
- {tag_id: pii, object_type: column, table_ref: bank.bank.customer, column_name: ssn}
- {tag_id: pii, object_type: column, table_ref: bank.bank.customer, column_name: account_no}
relationships:
- {id: match-message, alias: MATCHED_MESSAGE, cardinality: many-to-one, source_table_id: deal_match, source_column: message_id, target_table_id: messages, target_column: id}
- {id: match-deal, alias: MATCHED_DEAL, cardinality: many-to-one, source_table_id: deal_match, source_column: deal_id, target_table_id: deal, target_column: deal_id}
- {id: message-sender, alias: SENT_BY, cardinality: many-to-one, source_table_id: messages, source_column: from_address, target_table_id: employee, target_column: email}
- {id: employee-reviewer, alias: REVIEWED_BY, cardinality: many-to-one, source_table_id: employee, source_column: desk, target_table_id: desk_reviewer, target_column: desk}
- {id: message-recipient, alias: SENT_TO, cardinality: one-to-many, source_table_id: messages, source_column: id, target_table_id: message_recipients, target_column: message_id}
- {id: access-employee, alias: READ_BY, cardinality: many-to-one, source_table_id: customer_access, source_column: employee_id, target_table_id: employee, target_column: employee_id}
- {id: deal-team, alias: OVER_THE_WALL, cardinality: one-to-many, source_table_id: deal, source_column: deal_id, target_table_id: deal_team, target_column: deal_id}
- {id: team-employee, alias: TEAM_MEMBER, cardinality: many-to-one, source_table_id: deal_team, source_column: employee_id, target_table_id: employee, target_column: employee_id}
- {id: deal-counterparty, alias: COUNTERPARTY, cardinality: one-to-many, source_table_id: deal, source_column: deal_id, target_table_id: deal_counterparty, target_column: deal_id}
- {id: queue-message, alias: QUEUED, cardinality: many-to-one, source_table_id: view_review_queue, source_column: message_id, target_table_id: messages, target_column: id}
- {id: queue-checks, alias: CASE_MATCH, cardinality: one-to-many, source_table_id: view_review_queue, source_column: message_id, target_table_id: deal_match, target_column: message_id}
