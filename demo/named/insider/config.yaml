  columns:
  - {name: access_id, data_type: integer, description: 'The read', visible_to: [data_steward, control_room, reviewer_ana, reviewer_ben], is_primary_key: true}
  - {name: employee_id, data_type: varchar, description: 'Who read', visible_to: [data_steward, control_room, reviewer_ana, reviewer_ben]}
  - {name: accessed_at, data_type: timestamp, description: 'When', visible_to: [data_steward, control_room, reviewer_ana, reviewer_ben]}
  - {name: table_name, data_type: varchar, description: 'What they read', visible_to: [data_steward, control_room, reviewer_ana, reviewer_ben]}
  - {name: records_read, data_type: integer, description: 'How many records', visible_to: [data_steward, control_room, reviewer_ana, reviewer_ben]}
- source_id: control_room
  domain_id: bank
  schema: control_room
  table: watch_list__deals
  alias: deal
  enable_aggregates: true
  enable_group_by: true
  description: 'The control room''s watch list, its workbook''s sheet "deals": each deal in discussion, its code name, the company, aliases and ticker, what kind of deal it is, and when it was announced'
  columns:
  - {name: deal_id, data_type: varchar, description: 'The deal', visible_to: [data_steward, control_room, deal_team_falcon], is_primary_key: true}
