  - {name: deal_id, data_type: varchar, description: 'The deal it is screened against', visible_to: [data_steward, control_room], is_primary_key: true}
- source_id: mail
  domain_id: bank
  schema: default
  table: messages
  enable_aggregates: true
  enable_group_by: true
  description: 'The employees'' sent mail, in Microsoft 365: one row a message, in its sender''s mailbox'
  columns:
