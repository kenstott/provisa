  - {name: landed_at, data_type: timestamp, description: 'When this row was landed', visible_to: [data_steward, control_room, reviewer_ana, reviewer_ben]}
- source_id: mail
  domain_id: bank
  schema: default
  table: message_recipients
  enable_aggregates: true
  enable_group_by: true
  description: 'Each message''s sender and recipients, in Microsoft 365: one row an address'
  columns:
  - {name: provider, data_type: varchar, description: 'The mail platform: microsoft', visible_to: [data_steward, control_room, reviewer_ana, reviewer_ben]}
  - {name: account, data_type: varchar, description: 'The mailbox the message is held in', visible_to: [data_steward, control_room, reviewer_ana, reviewer_ben]}
  - {name: message_id, data_type: varchar, description: 'The message', visible_to: [data_steward, control_room, reviewer_ana, reviewer_ben], is_primary_key: true}
  - {name: kind, data_type: varchar, description: 'from, to, cc or bcc', visible_to: [data_steward, control_room, reviewer_ana, reviewer_ben], is_primary_key: true}
  - {name: position, data_type: bigint, description: 'Its place among the kind', visible_to: [data_steward, control_room, reviewer_ana, reviewer_ben], is_primary_key: true}
  - {name: address, data_type: varchar, description: 'The address', visible_to: [data_steward, control_room, reviewer_ana, reviewer_ben]}
  - {name: name, data_type: varchar, description: 'The name shown with it', visible_to: [data_steward, control_room, reviewer_ana, reviewer_ben]}
  - {name: landed_at, data_type: timestamp, description: 'When this row was landed', visible_to: [data_steward, control_room, reviewer_ana, reviewer_ben]}
- source_id: bank
  domain_id: bank
  schema: bank
  table: personal_mail_domain
  enable_aggregates: true
  enable_group_by: true
  description: 'The personal mail providers the bank''s compliance team lists: mail to one is mail to a person'
  columns:
  - {name: domain, data_type: varchar, description: 'A personal mail provider''s domain', visible_to: [data_steward, control_room, reviewer_ana, reviewer_ben], is_primary_key: true}
views:
# Each message's recipients with the domain of their address, stored: the cross-system joins below
# (to the bank's staff, its personal mail providers and a deal's counterparties) are relationships
# on its columns.
- id: recipient
  domain_id: bank
  materialize: true
  description: 'Each message''s recipients -- To, Cc and Bcc -- with the domain of their address'
  sql: >-
    SELECT r.message_id, r.kind, r.address, SPLIT_PART(r.address, '@', 2) AS domain
    FROM "bank"."message_recipients" AS r
    WHERE r.kind IN ('to', 'cc', 'bcc')
  columns:
  - {name: message_id, data_type: varchar, description: The message, visible_to: [data_steward, control_room, reviewer_ana, reviewer_ben]}
  - {name: kind, data_type: varchar, description: 'to, cc or bcc', visible_to: [data_steward, control_room, reviewer_ana, reviewer_ben]}
  - {name: address, data_type: varchar, description: The recipient''s address, visible_to: [data_steward, control_room, reviewer_ana, reviewer_ben]}
  - {name: domain, data_type: varchar, description: The address''s domain, visible_to: [data_steward, control_room, reviewer_ana, reviewer_ben]}
# Each message against each deal its screening scope names (every deal), embedded by the demo's
# local model and matched by deal_signals; a view that applies a column transform is stored, so
# match_deals filters on its outputs.
- id: message_deal_signals
  domain_id: bank
  materialize: true
  description: 'Each message against each watch-list deal it is screened against: its strongest match by
    name, its match by meaning and the signals that fired'
  sql: >-
    SELECT m.id AS message_id, d.deal_id, d.legal_name, m.from_address AS sender_address, m.sent_at,
      d.announced_on,
      deal_signals(m.subject, m.body_text, d.legal_name, d.aliases, d.ticker, d.code_name,
        embed('sentence-transformers/all-MiniLM-L6-v2', CONCAT(m.subject, '. ', m.body_text)),
        embed('sentence-transformers/all-MiniLM-L6-v2', d.description))
    FROM "bank"."screening" AS s
    JOIN "bank"."messages" AS m ON m.id = s.message_id
    JOIN "bank"."deal" AS d ON d.deal_id = s.deal_id
  columns:
  - {name: message_id, data_type: varchar, description: The message, visible_to: [data_steward]}
  - {name: deal_id, data_type: varchar, description: The deal, visible_to: [data_steward]}
  - {name: legal_name, data_type: varchar, description: 'The company''s legal name', visible_to: [data_steward]}
  - {name: sender_address, data_type: varchar, description: 'Who sent it: their address', visible_to: [data_steward]}
  - {name: sent_at, data_type: timestamp, description: When it was sent, visible_to: [data_steward]}
  - {name: announced_on, data_type: varchar, description: 'When the deal was announced, as YYYY-MM-DD; empty while it is not public', visible_to: [data_steward]}
  - {name: name_match, data_type: double, description: 'Its strongest match by name, 0 to 1', visible_to: [data_steward]}
  - {name: meaning_match, data_type: double, description: 'Its match by meaning, 0 below the floor', visible_to: [data_steward]}
  - {name: signals, data_type: varchar, description: 'The signals that fired, in order; empty when none did', visible_to: [data_steward]}
- id: review_queue
  domain_id: bank
  materialize: true
  enable_aggregates: true
  enable_group_by: true
  description: 'The review queue: per message and deal, or per message carrying customer data, its
    score and the signals that fired; a first-level reviewer reads their own desks'' cases, the deal withheld'
  sql: >-
    SELECT c.message_id, c.deal_id, c.flagged_entity AS flagged, e.name AS sender, e.desk, r.reviewer,
      m.sent_at, m.subject, c.signals,
      1 - c.sender_on_team AS outside_team,
      CASE WHEN w.outside_recipients > 0 THEN 1 ELSE 0 END AS outside_bank,
      CASE WHEN w.personal_recipients > 0 THEN 1 ELSE 0 END AS personal,
      c.before_announcement, c.to_counterparty,
      ROUND(CAST(GREATEST(c.name_match, c.meaning_match)
        * (0.5 + 0.5 * (1 - c.sender_on_team)
          + 0.5 * CASE WHEN w.outside_recipients > 0 THEN 1 ELSE 0 END
          + 0.3 * CASE WHEN w.personal_recipients > 0 THEN 1 ELSE 0 END)
        * CASE WHEN c.before_announcement = 1 THEN 1.3 ELSE 0.4 END
        * CASE WHEN c.sender_on_team = 1 AND c.to_counterparty = 1 THEN 0.3 ELSE 1 END AS NUMERIC), 3) AS score
    FROM "bank"."deal_match" AS c
    JOIN "bank"."messages" AS m ON m.id = c.message_id
    JOIN "bank"."employee" AS e ON e.email = m.from_address
    JOIN "bank"."desk_reviewer" AS r ON r.desk = e.desk
    JOIN (SELECT rc.message_id,
        SUM(CASE WHEN be.employee_id IS NULL THEN 1 ELSE 0 END) AS outside_recipients,
        SUM(CASE WHEN pd.domain IS NOT NULL THEN 1 ELSE 0 END) AS personal_recipients
      FROM "bank"."view_recipient" AS rc
      LEFT JOIN "bank"."employee" AS be ON be.email = rc.address
      LEFT JOIN "bank"."personal_mail_domain" AS pd ON pd.domain = rc.domain
      GROUP BY rc.message_id) AS w ON w.message_id = m.id
    UNION ALL
    SELECT m.id AS message_id, CAST(NULL AS VARCHAR) AS deal_id, 'customer data' AS flagged,
      e.name AS sender, e.desk, r.reviewer, m.sent_at, m.subject,
      CONCAT_WS(', ',
        CASE WHEN REGEXP_LIKE(m.body_text, '[0-9]{3}-[0-9]{2}-[0-9]{4}') THEN 'ssn' END,
        CASE WHEN REGEXP_LIKE(m.body_text, 'ACCT-[0-9]{8}') THEN 'account number' END,
        CASE WHEN SUM(CASE WHEN a.accessed_at BETWEEN m.sent_at - INTERVAL '7 days' AND m.sent_at
          THEN a.records_read ELSE 0 END) > 0 THEN 'read customer records that week' END) AS signals,
      0 AS outside_team,
      CASE WHEN w.outside_recipients > 0 THEN 1 ELSE 0 END AS outside_bank,
      CASE WHEN w.personal_recipients > 0 THEN 1 ELSE 0 END AS personal,
      0 AS before_announcement, 0 AS to_counterparty,
      ROUND(CAST(0.5 * (CASE WHEN REGEXP_LIKE(m.body_text, '[0-9]{3}-[0-9]{2}-[0-9]{4}') THEN 1 ELSE 0 END
          + CASE WHEN REGEXP_LIKE(m.body_text, 'ACCT-[0-9]{8}') THEN 1 ELSE 0 END)
        * (0.5 + 0.5 * CASE WHEN w.outside_recipients > 0 THEN 1 ELSE 0 END
          + 0.3 * CASE WHEN w.personal_recipients > 0 THEN 1 ELSE 0 END)
        * CASE WHEN SUM(CASE WHEN a.accessed_at BETWEEN m.sent_at - INTERVAL '7 days' AND m.sent_at
          THEN a.records_read ELSE 0 END) > 0 THEN 2 ELSE 1 END AS NUMERIC), 3) AS score
    FROM "bank"."messages" AS m
    JOIN "bank"."employee" AS e ON e.email = m.from_address
    JOIN "bank"."desk_reviewer" AS r ON r.desk = e.desk
    JOIN (SELECT rc.message_id,
        SUM(CASE WHEN be.employee_id IS NULL THEN 1 ELSE 0 END) AS outside_recipients,
        SUM(CASE WHEN pd.domain IS NOT NULL THEN 1 ELSE 0 END) AS personal_recipients
      FROM "bank"."view_recipient" AS rc
      LEFT JOIN "bank"."employee" AS be ON be.email = rc.address
      LEFT JOIN "bank"."personal_mail_domain" AS pd ON pd.domain = rc.domain
      GROUP BY rc.message_id) AS w ON w.message_id = m.id
    LEFT JOIN "bank"."customer_access" AS a ON a.employee_id = e.employee_id
    WHERE REGEXP_LIKE(m.body_text, '[0-9]{3}-[0-9]{2}-[0-9]{4}') OR REGEXP_LIKE(m.body_text, 'ACCT-[0-9]{8}')
    GROUP BY m.id, m.sent_at, m.subject, m.body_text, w.outside_recipients,
      w.personal_recipients, e.name, e.desk, r.reviewer
  columns:
  - {name: message_id, data_type: varchar, description: The message, visible_to: [data_steward, control_room, reviewer_ana, reviewer_ben]}
  - {name: deal_id, data_type: varchar, description: 'The deal it was matched to; withheld from a first-level reviewer', visible_to: [data_steward, control_room, reviewer_ana, reviewer_ben], masks: [{to: [data_steward, control_room]}, {mask: {type: constant, value: withheld}}]}
  - {name: flagged, data_type: varchar, description: 'The flagged entity: the company the deal is about, or customer data', visible_to: [data_steward, control_room, reviewer_ana, reviewer_ben]}
  - {name: sender, data_type: varchar, description: Who sent it, visible_to: [data_steward, control_room, reviewer_ana, reviewer_ben]}
  - {name: desk, data_type: varchar, description: The sender''s desk, visible_to: [data_steward, control_room, reviewer_ana, reviewer_ben]}
  - {name: reviewer, data_type: varchar, description: The first-level reviewer the case goes to, visible_to: [data_steward, control_room, reviewer_ana, reviewer_ben]}
  - {name: sent_at, data_type: timestamp, description: When it was sent, visible_to: [data_steward, control_room, reviewer_ana, reviewer_ben]}
  - {name: subject, data_type: varchar, description: Its subject, visible_to: [data_steward, control_room, reviewer_ana, reviewer_ben]}
  - {name: signals, data_type: varchar, description: What it matched, visible_to: [data_steward, control_room, reviewer_ana, reviewer_ben]}
  - {name: outside_team, data_type: integer, description: 1 when its sender was not on the deal''s team, visible_to: [data_steward, control_room, reviewer_ana, reviewer_ben]}
  - {name: outside_bank, data_type: integer, description: 1 when a recipient was outside the bank, visible_to: [data_steward, control_room, reviewer_ana, reviewer_ben]}
  - {name: personal, data_type: integer, description: 1 when a recipient was a personal address, visible_to: [data_steward, control_room, reviewer_ana, reviewer_ben]}
  - {name: before_announcement, data_type: integer, description: 1 when it was sent before the deal was announced, visible_to: [data_steward, control_room, reviewer_ana, reviewer_ben]}
  - {name: to_counterparty, data_type: integer, description: 1 when it went to one of the deal''s own counterparties, visible_to: [data_steward, control_room, reviewer_ana, reviewer_ben]}
  - {name: score, data_type: double, description: 'The score: the match weighted by who sent it and where it went', visible_to: [data_steward, control_room, reviewer_ana, reviewer_ben]}
functions:
# What a message says of a deal: its names fuzzily, its ticker and code name as words, and the
# cosine of the two embeddings, applied in message_deal_signals (insider_signals.py).
- name: deal_signals
  function_name: deal_signals
  impl_kind: code_columns
  kind: query
  schema_name: code
  domain_id: bank
  description: For each message and deal, its strongest match by name, its match by meaning and the
    signals that fired
  source_id: insider_signals
  returns: ''
  visible_to: [data_steward]
  arguments:
  - {name: subject, type: text}
  - {name: body, type: text}
  - {name: legal_name, type: text}
  - {name: aliases, type: text}
  - {name: ticker, type: text}
  - {name: code_name, type: text}
  - {name: message_vector, type: json}
  - {name: deal_vector, type: json}
  output_columns:
  - {name: name_match, type: double}
  - {name: meaning_match, type: double}
  - {name: signals, type: text}
# Every message and deal that any signal ties, written to deal_match with who sent it and where it
# went, from the stored message_deal_signals.
- name: match_deals
  function_name: match_deals
  impl_kind: statement
  domain_id: bank
  description: Write every message and deal a signal ties -- its names, ticker and code name, or its
    description by meaning -- to deal_match, with whether its sender is on the deal's team, whether it
    went to a counterparty and whether it was sent before the announcement
  source_id: ''
  returns: ''
  visible_to: [data_steward]
  binding:
    sql: >-
      INSERT INTO "bank"."deal_match" (message_id, deal_id, flagged_entity, name_match,
        meaning_match, signals, sender_on_team, to_counterparty, before_announcement)
      SELECT s.message_id, s.deal_id, s.legal_name, s.name_match, s.meaning_match, s.signals,
        CASE WHEN t.employee_id IS NULL THEN 0 ELSE 1 END,
        CASE WHEN c.deal_id IS NULL THEN 0 ELSE 1 END,
        CASE WHEN s.announced_on IS NULL OR s.announced_on = ''
          OR CAST(s.sent_at AS DATE) < CAST(s.announced_on AS DATE) THEN 1 ELSE 0 END
      FROM "bank"."view_message_deal_signals" AS s
      JOIN "bank"."employee" AS e ON e.email = s.sender_address
      LEFT JOIN "bank"."deal_team" AS t ON t.deal_id = s.deal_id AND t.employee_id = e.employee_id
      LEFT JOIN (SELECT DISTINCT r.message_id, k.deal_id FROM "bank"."view_recipient" AS r
        JOIN "bank"."deal_counterparty" AS k ON k.domain = r.domain) AS c
        ON c.message_id = s.message_id AND c.deal_id = s.deal_id
      WHERE s.signals <> ''
rls_rules:
# A first-level reviewer reads only the mail of the desks they review and the matches of that mail
# (the flagged entity among them); of the watch list itself, nothing: no grant names them.
- {description: "Ana reads only the mail sent from the desks she reviews.", table_id: messages, role_id: reviewer_ana, filter: "from_address IN (SELECT own_e.email FROM \"bank\".\"employee\" AS own_e JOIN \"bank\".\"desk_reviewer\" AS own_r ON own_r.desk = own_e.desk WHERE own_r.reviewer = current_setting('provisa.role'))"}
- {description: "Ana reads only the recipients of the mail sent from the desks she reviews.", table_id: message_recipients, role_id: reviewer_ana, filter: "account IN (SELECT own_e.email FROM \"bank\".\"employee\" AS own_e JOIN \"bank\".\"desk_reviewer\" AS own_r ON own_r.desk = own_e.desk WHERE own_r.reviewer = current_setting('provisa.role'))"}
- {description: "Ana reads only the customer accesses of the desks she reviews.", table_id: customer_access, role_id: reviewer_ana, filter: "employee_id IN (SELECT own_e.employee_id FROM \"bank\".\"employee\" AS own_e JOIN \"bank\".\"desk_reviewer\" AS own_r ON own_r.desk = own_e.desk WHERE own_r.reviewer = current_setting('provisa.role'))"}
- {description: "Ana reads only the matches in the mail of the desks she reviews.", table_id: deal_match, role_id: reviewer_ana, filter: "message_id IN (SELECT own_m.id FROM \"bank\".\"messages\" AS own_m WHERE own_m.from_address IN (SELECT own_e.email FROM \"bank\".\"employee\" AS own_e JOIN \"bank\".\"desk_reviewer\" AS own_r ON own_r.desk = own_e.desk WHERE own_r.reviewer = current_setting('provisa.role')))"}
- {description: "Ben reads only the mail sent from the desks he reviews.", table_id: messages, role_id: reviewer_ben, filter: "from_address IN (SELECT own_e.email FROM \"bank\".\"employee\" AS own_e JOIN \"bank\".\"desk_reviewer\" AS own_r ON own_r.desk = own_e.desk WHERE own_r.reviewer = current_setting('provisa.role'))"}
- {description: "Ben reads only the recipients of the mail sent from the desks he reviews.", table_id: message_recipients, role_id: reviewer_ben, filter: "account IN (SELECT own_e.email FROM \"bank\".\"employee\" AS own_e JOIN \"bank\".\"desk_reviewer\" AS own_r ON own_r.desk = own_e.desk WHERE own_r.reviewer = current_setting('provisa.role'))"}
- {description: "Ben reads only the customer accesses of the desks he reviews.", table_id: customer_access, role_id: reviewer_ben, filter: "employee_id IN (SELECT own_e.employee_id FROM \"bank\".\"employee\" AS own_e JOIN \"bank\".\"desk_reviewer\" AS own_r ON own_r.desk = own_e.desk WHERE own_r.reviewer = current_setting('provisa.role'))"}
- {description: "Ben reads only the matches in the mail of the desks he reviews.", table_id: deal_match, role_id: reviewer_ben, filter: "message_id IN (SELECT own_m.id FROM \"bank\".\"messages\" AS own_m WHERE own_m.from_address IN (SELECT own_e.email FROM \"bank\".\"employee\" AS own_e JOIN \"bank\".\"desk_reviewer\" AS own_r ON own_r.desk = own_e.desk WHERE own_r.reviewer = current_setting('provisa.role')))"}
# A deal team reads only its own deal of the watch list.
- {description: "The Falcon team reads only its own deal.", table_id: deal, role_id: deal_team_falcon, filter: "deal_id = 'D-01'"}
- {description: "The Falcon team reads only its own deal's team.", table_id: deal_team, role_id: deal_team_falcon, filter: "deal_id = 'D-01'"}
- {description: "The Falcon team reads only its own deal's counterparties.", table_id: deal_counterparty, role_id: deal_team_falcon, filter: "deal_id = 'D-01'"}
- {description: "The Falcon team reads only the matches on its own deal.", table_id: deal_match, role_id: deal_team_falcon, filter: "deal_id = 'D-01'"}
tag_assignments:
# The customer records are pii: every read of them is in the record (ops.pii_access).
- {tag_id: pii, object_type: column, table_ref: bank.bank.customer, column_name: name}
- {tag_id: pii, object_type: column, table_ref: bank.bank.customer, column_name: email}
- {tag_id: pii, object_type: column, table_ref: bank.bank.customer, column_name: ssn}
- {tag_id: pii, object_type: column, table_ref: bank.bank.customer, column_name: account_no}
relationships:
- {id: screening-message, alias: SCREENS, cardinality: many-to-one, source_table_id: screening, source_column: message_id, target_table_id: messages, target_column: id}
- {id: screening-deal, alias: SCREENED_AGAINST, cardinality: many-to-one, source_table_id: screening, source_column: deal_id, target_table_id: deal, target_column: deal_id}
- {id: match-message, alias: MATCHED_MESSAGE, cardinality: many-to-one, source_table_id: deal_match, source_column: message_id, target_table_id: messages, target_column: id}
- {id: match-deal, alias: MATCHED_DEAL, cardinality: many-to-one, source_table_id: deal_match, source_column: deal_id, target_table_id: deal, target_column: deal_id}
- {id: message-sender, alias: SENT_BY, cardinality: many-to-one, source_table_id: messages, source_column: from_address, target_table_id: employee, target_column: email}
- {id: employee-reviewer, alias: REVIEWED_BY, cardinality: many-to-one, source_table_id: employee, source_column: desk, target_table_id: desk_reviewer, target_column: desk}
- {id: message-address, alias: ADDRESSED, cardinality: one-to-many, source_table_id: messages, source_column: id, target_table_id: message_recipients, target_column: message_id}
- {id: message-recipient, alias: SENT_TO, cardinality: one-to-many, source_table_id: messages, source_column: id, target_table_id: view_recipient, target_column: message_id}
- {id: recipient-employee, alias: RECIPIENT_STAFF, cardinality: many-to-one, source_table_id: view_recipient, source_column: address, target_table_id: employee, target_column: email}
- {id: recipient-personal, alias: PERSONAL_PROVIDER, cardinality: many-to-one, source_table_id: view_recipient, source_column: domain, target_table_id: personal_mail_domain, target_column: domain}
- {id: recipient-counterparty, alias: AT_COUNTERPARTY, cardinality: one-to-many, source_table_id: view_recipient, source_column: domain, target_table_id: deal_counterparty, target_column: domain}
- {id: access-employee, alias: READ_BY, cardinality: many-to-one, source_table_id: customer_access, source_column: employee_id, target_table_id: employee, target_column: employee_id}
- {id: deal-team, alias: OVER_THE_WALL, cardinality: one-to-many, source_table_id: deal, source_column: deal_id, target_table_id: deal_team, target_column: deal_id}
- {id: team-employee, alias: TEAM_MEMBER, cardinality: many-to-one, source_table_id: deal_team, source_column: employee_id, target_table_id: employee, target_column: employee_id}
- {id: deal-counterparty, alias: COUNTERPARTY, cardinality: one-to-many, source_table_id: deal, source_column: deal_id, target_table_id: deal_counterparty, target_column: deal_id}
- {id: queue-message, alias: QUEUED, cardinality: many-to-one, source_table_id: view_review_queue, source_column: message_id, target_table_id: messages, target_column: id}
- {id: queue-checks, alias: CASE_MATCH, cardinality: one-to-many, source_table_id: view_review_queue, source_column: message_id, target_table_id: deal_match, target_column: message_id}
