- source_id: control_room
  domain_id: bank
  schema: control_room
  table: watch_list__deal_team
  alias: deal_team
  enable_aggregates: true
  enable_group_by: true
  description: 'Who was brought over the wall for each deal, and when; the workbook''s sheet "deal_team"'
  columns:
  - {name: deal_id, data_type: varchar, description: 'The deal', visible_to: [data_steward, control_room, deal_team_falcon], is_primary_key: true}
  - {name: employee_id, data_type: varchar, description: 'The employee brought over the wall', visible_to: [data_steward, control_room, deal_team_falcon], is_primary_key: true}
  - {name: over_wall_at, data_type: varchar, description: 'When they were brought over the wall, ISO-8601', visible_to: [data_steward, control_room, deal_team_falcon]}
- source_id: control_room
  domain_id: bank
  schema: control_room
  table: watch_list__counterparties
  alias: deal_counterparty
  enable_aggregates: true
  enable_group_by: true
  description: 'The mail domains of each deal''s own counterparties: the company, its counsel; the workbook''s sheet "counterparties"'
