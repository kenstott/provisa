views:
# The answer: each column of the customers table as the latest profile run found it -- its nulls,
# distinct values and range.
- id: customer_columns
  domain_id: harbor
  description: Each customers column as the latest profile run found it -- its nulls, distinct
    values and range
  sql: >-
    SELECT c.column_name, c.data_type, c.row_count, c.null_count, c.null_share,
           c.distinct_count, c.distinct_ratio, c.min_value, c.max_value
    FROM "harbor"."customer_profile" AS c
    WHERE c.run_time = (SELECT MAX(p.run_time) FROM "harbor"."customer_profile" AS p)
  columns:
  - {name: column_name, data_type: varchar, description: The customers column, visible_to: [org_admin, analyst]}
  - {name: data_type, data_type: varchar, description: Its data type, visible_to: [org_admin, analyst]}
  - {name: row_count, data_type: bigint, description: Rows profiled, visible_to: [org_admin, analyst]}
  - {name: null_count, data_type: bigint, description: Rows with no value, visible_to: [org_admin, analyst]}
  - {name: null_share, data_type: double, description: The share of rows with no value, visible_to: [org_admin, analyst]}
  - {name: distinct_count, data_type: bigint, description: Its distinct values (approximate), visible_to: [org_admin, analyst]}
  - {name: distinct_ratio, data_type: double, description: Its distinct values per row, visible_to: [org_admin, analyst]}
  - {name: min_value, data_type: varchar, description: Its smallest value, visible_to: [org_admin, analyst]}
  - {name: max_value, data_type: varchar, description: Its largest value, visible_to: [org_admin, analyst]}
# Every shape a text column's values take in the latest run: where one column holds several formats.
- id: customer_formats
  domain_id: harbor
  description: Each shape the values of a customers text column take in the latest profile run, and
    how many rows take it -- one column holding several formats shows as several shapes
  sql: >-
    SELECT s.column_name, s.rank, s.shape, s.row_count
    FROM "harbor"."customer_value_shapes" AS s
    WHERE s.run_time = (SELECT MAX(p.run_time) FROM "harbor"."customer_value_shapes" AS p)
  columns:
  - {name: column_name, data_type: varchar, description: The customers column, visible_to: [org_admin, analyst]}
  - {name: rank, data_type: integer, description: 'The shape''s rank by rows, 1 the commonest', visible_to: [org_admin, analyst]}
  - {name: shape, data_type: varchar, description: 'The shape: A an upper-case letter, a a lower-case one, 9 a digit, other characters as they are', visible_to: [org_admin, analyst]}
  - {name: row_count, data_type: bigint, description: The rows whose value takes it, visible_to: [org_admin, analyst]}
relationships:
- {id: order-of-customer, alias: PLACED_BY, graphql_alias: customer, cardinality: many-to-one, source_table_id: orders, source_column: customer_id, target_table_id: customers, target_column: customer_id}
# The vocabulary of data profiling: abstract terms, grounded through their edges in the terms the
# profile's columns derive.
glossary_terms:
- name: data profile
  definition: 'A recorded description of what a table holds: for each column its nulls, distinct values, range, distribution and the shapes its values take, measured by a profile run.'
  domains:
  - harbor
  edges:
  - to: null share
    rel_type: RELATED_TO
- name: plausible type
  definition: 'What a column actually holds -- an email, a phone number, a postal code, a category -- inferred from its profile, name and tags. A label, not a value.'
  domains:
  - harbor
  edges:
  - to: data profile
    rel_type: PART_OF
- name: value shape
  definition: 'A value with each character reduced to its class: an upper-case letter A, a lower-case one a, a digit 9. A column whose values take several shapes holds several formats.'
  domains:
  - harbor
  edges:
  - to: data profile
    rel_type: PART_OF
- name: duplicate row
  definition: 'A row that repeats another in every profiled column -- often one customer entered twice under two numbers.'
  domains:
  - harbor
  edges:
  - to: data profile
    rel_type: PART_OF
- name: placeholder value
  definition: 'A value written where the real one was unknown -- 1900-01-01 for a date, 999999.99 for an amount -- that looks valid and distorts every measure taken over it.'
  domains:
  - harbor
  edges:
  - to: data profile
    rel_type: RELATED_TO
