# The WHOLE config of the named demo "profiling" (start-ui-install.sh --demo profiling; REQ-1858).
# docker-compose.yml in this directory brings up its database. What is actually in this data? An
# outdoor retailer has bought Harbor Outfitters and received its CRM's customers and orders.
#
#   crm              the acquired CRM's Postgres (db/init.sql), read live as provisa_reader.
#   harbor-profiler  the built-in Data Profiler. Both tables are its members: a run measures each
#                    column's nulls, distinct values, range, shapes and plausible type, the rows
#                    repeated and the key values held twice. Its first run is made when the demo is
#                    built (setup.yaml) and every sandbox opens with it.
auth:
  assignments_source: provisa
  default_assignments:
  - domain_id: '*'
    role_id: org_admin
  provider: none
cache:
  default_ttl: 300
  enabled: true
domains:
- id: harbor
  description: The customers and orders of Harbor Outfitters, a retailer just acquired, and the
    profile of each table
federation_engine: duckdb
naming:
  domain_prefix: true
  rules: []
roles:
- id: analyst
  description: "Queries the harbor domain's data."
  capabilities:
  - query_development
  domain_access:
  - harbor
server:
  limits:
    default_row_limit: 100
    request_timeout: 120
    trino_query_timeout: 120
sources:
- id: crm
  type: postgresql
  host: ${env:PROFILING_PG_HOST:-localhost}
  port: ${env:PROFILING_PG_PORT:-28732}
  database: profiling${env:PROFILING_PG_NS}
  username: provisa_reader
  password: provisa_reader
  description: Harbor Outfitters' CRM database, as it came with the acquisition -- its customers and
    orders
- id: harbor-profiler
  type: data_profiler
  description: Nightly profile of the acquired tables -- what each column holds, its nulls, distinct
    values, ranges and shapes, the duplicates and how one column depends on another
  mapping:
    cron: 0 2 * * *
    low_cardinality_max: 100
    drift_window: 7
    drift_season: none
    drift_distance: 3.0
    drift_slope: 3.0
    drift_ks: 0.2
    drift_psi: 0.25
    correlation_max_columns: 20
    joint_max_distinct: 20
    category_max_columns: 10
tables:
- source_id: crm
  domain_id: harbor
  schema: public
  table: customers
  profiler_source_id: harbor-profiler
  description: The acquired company's customers, as its CRM held them
  columns:
  - {name: customer_id, data_type: integer, is_primary_key: true, description: The customer's number, visible_to: [org_admin, analyst]}
  - {name: full_name, data_type: varchar, description: The customer's name, visible_to: [org_admin, analyst]}
  - {name: email, data_type: varchar, description: The customer's email address, visible_to: [org_admin, analyst]}
  - {name: phone, data_type: varchar, description: The customer's phone number, visible_to: [org_admin, analyst]}
  - {name: country, data_type: varchar, description: The customer's country, visible_to: [org_admin, analyst]}
  - {name: postal_code, data_type: varchar, description: The customer's postal code, visible_to: [org_admin, analyst]}
  - {name: signup_date, data_type: date, description: When the customer signed up, visible_to: [org_admin, analyst]}
  - {name: lifetime_value, data_type: decimal, description: 'What the customer has spent in all, net of refunds, in USD', visible_to: [org_admin, analyst]}
  - {name: status, data_type: varchar, description: 'active, churned or prospect', visible_to: [org_admin, analyst]}
  - {name: marketing_opt_in, data_type: boolean, description: Whether the customer agreed to marketing, visible_to: [org_admin, analyst]}
- source_id: crm
  domain_id: harbor
  schema: public
  table: orders
  profiler_source_id: harbor-profiler
  description: The acquired company's orders
  columns:
  - {name: order_id, data_type: integer, is_primary_key: true, description: The order's number, visible_to: [org_admin, analyst]}
  - {name: customer_id, data_type: integer, description: The customer who placed it, visible_to: [org_admin, analyst]}
  - {name: order_date, data_type: date, description: When it was placed, visible_to: [org_admin, analyst]}
  - {name: amount, data_type: decimal, description: 'Its amount, in its currency', visible_to: [org_admin, analyst]}
  - {name: currency, data_type: varchar, description: The currency of the amount, visible_to: [org_admin, analyst]}
  - {name: channel, data_type: varchar, description: 'Where it was placed: web, store or phone', visible_to: [org_admin, analyst]}
  - {name: discount_pct, data_type: integer, description: 'The discount given, in percent', visible_to: [org_admin, analyst]}
# The profiler's results, each named by the table it profiles and its kind; the seed names it
# <member>_<member's id>_profile_<kind>. Every role that reads the member reads its profile.
- source_id: harbor-profiler
  domain_id: harbor
  profile_of: customers
  kind: runs
  alias: customer_profile_runs
  description: 'Each profile run of the customers table: when, how many rows, the duplicates it found'
