#
# The named demo "profiling" (start-ui-install.sh --demo profiling; REQ-1858). This file is its one
# start point: `docker compose up -d` brings up its database, which db/init.sql generates.
#
#   postgres  the demo's database (db/init.sql), with the role Provisa reads it as.
#
# Port: 28732 the database; it can be moved by its variable.
x-demo-labels: &demo-labels
  com.provisa.demo: profiling
name: provisa-demo-profiling
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    labels:
      <<: *demo-labels
      com.provisa.demo.role: rdb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: profiling
    ports:
      - "127.0.0.1:${PROFILING_PG_PORT:-28732}:5432"
    volumes:
      - profiling_pg:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - ./db/reader.sql:/docker-entrypoint-initdb.d/20-reader.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d profiling"]
      interval: 2s
      timeout: 5s
      retries: 60

volumes:
  profiling_pg:
