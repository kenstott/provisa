# The profiling demo's card on provisa.dev's live demos page (REQ-2006), generated from this file
# by scripts/gen-site-demos.mjs. published: true once card.png, a screenshot of the demo in
# Provisa, is beside it.
title: What is actually in this data?
description: >-
  The customer and order tables an outdoor retailer received when it bought a smaller one, profiled
  by Provisa's built-in Data Profiler: nulls, distinct values, ranges, formats, plausible types and
  duplicates, landed as governed tables.
screenshot: card.png
published: true
# The oldest Provisa this demo's bundle runs on (REQ-2049): a puller running an older one is refused
# by name. The first release carrying the demo.
requires_provisa: 0.1.0a490
# The demo's video: its tagline names what the demo shows Provisa being.
video:
  tagline: "Data Profiling. Next Level."
