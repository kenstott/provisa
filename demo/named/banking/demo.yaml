#
# The banking demo's card on provisa.dev's live demos page (REQ-2006, REQ-2107), generated from
# this file by scripts/gen-site-demos.mjs. published: true once card.png, a screenshot of the demo
# in Provisa, is beside it.
title: EOD reporting without copying the ledger
description: >-
  A bank's end-of-day totals, built at each day's close in the warehouse straight from a ledger
  that is never copied there. Each day reads as it was reported and as restated since, and the
  dashboard, BI and an agent give the same answer, down to the postings behind every total.
screenshot: card.png
published: true
# REQ-2035: the regions the demo runs in. start-ui-install.sh starts a headless node for each
# region in headless and the node the visitor uses in visitor's region; both on one model store.
regions:
  visitor: warehouse
  headless: [ledger]
# The oldest Provisa this demo's bundle runs on (REQ-2049): a puller running an older one is refused
# by name. The first release carrying the demo and the features it shows (the next after alpha.494).
requires_provisa: 0.1.0a495
