#
# The WHOLE config of the named demo "hasuramigration" (start-ui-install.sh --demo hasuramigration; REQ-1858).
# docker-compose.yml in this directory brings up its database.
#
# An outfitter's storefront app ran on Hasura v2. Its metadata export (hasura/metadata) was imported
# through Admin > Import: the tables, their custom names, every relationship, the roles with their
# row rules, column lists and write permissions, the action, the cron and the event trigger below
# are the import's output, as the import wrote them (tests/unit/test_hasura_migration_demo_config.py
# checks they match). Added by hand: the column types and descriptions, which a preview reads from
# the database; and, as the demo has no payments, fulfilment or reports service, a default for each
# handler URL's variable (the import names each to set) and the nightly digest switched off. Then what Hasura could not do: the sales team's Salesforce accounts,
# joined to the business customers who buy for them.
#
#   outfitters   the store's Postgres, read live as provisa_reader (db/init.sql)
#   crm          the sales team's Salesforce org: its Account object, landed once when the demo is
#                built and read from that copy
auth:
  assignments_source: provisa
  default_assignments:
  - domain_id: '*'
    role_id: org_admin
  provider: none
cache:
  default_ttl: 300
  enabled: true
domains:
- id: store
  description: The outfitter's store -- customers, the catalog, orders and their lines
- id: crm
  description: The sales team's Salesforce accounts
- id: default
  description: The command the store's Hasura action became
federation_engine: duckdb
naming:
  domain_prefix: true
  rules: []
server:
  limits:
    default_row_limit: 100
    request_timeout: 60
    trino_query_timeout: 120
sources:
- id: outfitters
  type: postgresql
  host: ${env:HASURAMIGRATION_PG_HOST:-localhost}
  port: ${env:HASURAMIGRATION_PG_PORT:-29732}
  database: hasuramigration${env:HASURAMIGRATION_PG_NS}
  username: provisa_reader
  password: provisa_reader
  description: The store's database, which the Hasura app read and wrote
- id: crm
  type: salesforce
  # Account's rows are declared beside this config (replica_rows/crm/crm.Account.tsv, REQ-2089),
  # as the sales team's org held them: they land as its replica, and nothing ever calls
  # Salesforce, at the bundle build or in a sandbox.
  base_url: ${env:SF_LOGIN_URL:-}
  username: ${env:SF_CONSUMER_KEY:-}
  password: ${env:SF_CONSUMER_SECRET:-}
  cache_ttl: -1
  replicate: 0
  description: The sales team's Salesforce org, landed once when the demo is built
tables:
- source_id: outfitters
  domain_id: store
  schema: public
  table: customers
  description: The store's customers; a business customer names its Salesforce account
  columns:
  - {name: email, data_type: text, description: Email address, visible_to: [customer, org_admin, support, support_lead]}
  - {name: first_name, data_type: text, alias: givenName, description: First name, visible_to: [customer, org_admin, support, support_lead]}
  - {name: id, data_type: integer, is_primary_key: true, description: The customer's id -- the app's user key, visible_to: [analyst, customer, org_admin, support, support_lead]}
  - {name: last_name, data_type: text, alias: familyName, description: Last name, visible_to: [customer, org_admin, support, support_lead]}
  - {name: created_at, data_type: timestamptz, description: When the customer signed up, visible_to: [analyst, org_admin, support, support_lead]}
  - {name: sf_account_id, data_type: varchar, description: The Salesforce account a business customer buys for, visible_to: [analyst, org_admin, support, support_lead]}
  write_grants:
  - role: customer
    operation: update
    columns: [first_name, last_name]
    rows: "id = current_setting('provisa.hasura_user_id')"
    check: "TRUE"
  - role: org_admin
    operation: insert
    columns: [email, first_name, id, last_name, created_at, sf_account_id]
    check: "TRUE"
  - role: org_admin
    operation: update
    columns: [email, first_name, id, last_name, created_at, sf_account_id]
    rows: "TRUE"
    check: "TRUE"
  - role: org_admin
    operation: delete
    rows: "TRUE"
- source_id: outfitters
  domain_id: store
  schema: public
  table: order_items
  description: The lines of each order
  columns:
  - {name: id, data_type: integer, is_primary_key: true, description: The line's id, visible_to: [analyst, customer, org_admin, support, support_lead]}
  - {name: order_id, data_type: integer, description: The order it belongs to, visible_to: [analyst, customer, org_admin, support, support_lead]}
  - {name: product_id, data_type: integer, description: The product ordered, visible_to: [analyst, customer, org_admin, support, support_lead]}
  - {name: quantity, data_type: integer, description: How many, visible_to: [analyst, customer, org_admin, support, support_lead]}
  - {name: unit_price_cents, data_type: integer, description: Price per unit in cents, visible_to: [analyst, customer, org_admin, support, support_lead]}
  write_grants:
  - role: org_admin
    operation: insert
    columns: [id, order_id, product_id, quantity, unit_price_cents]
    check: "TRUE"
  - role: org_admin
    operation: update
    columns: [id, order_id, product_id, quantity, unit_price_cents]
    rows: "TRUE"
    check: "TRUE"
  - role: org_admin
    operation: delete
    rows: "TRUE"
- source_id: outfitters
  domain_id: store
  schema: public
  table: orders
  description: Each order a customer placed, its status and total
  columns:
  - {name: id, data_type: integer, is_primary_key: true, description: The order's id, visible_to: [analyst, customer, org_admin, support, support_lead]}
  - {name: placed_at, data_type: timestamptz, description: When it was placed, visible_to: [analyst, customer, org_admin, support, support_lead]}
  - {name: ship_to, data_type: text, description: Delivery address, visible_to: [customer, org_admin, support, support_lead]}
  - {name: status, data_type: text, description: "placed, packed, shipped, delivered or cancelled", visible_to: [analyst, customer, org_admin, support, support_lead]}
  - {name: total_cents, data_type: integer, description: Order total in cents, visible_to: [analyst, customer, org_admin, support, support_lead]}
  - {name: customer_id, data_type: integer, description: The customer who placed it, visible_to: [analyst, org_admin, support, support_lead]}
  write_grants:
  - role: customer
    operation: insert
    columns: [ship_to]
    check: "customer_id = current_setting('provisa.hasura_user_id')"
    presets:
    - {column: customer_id, source: session, name: hasura_user_id}
    - {column: status, source: literal, value: placed}
  - role: support
    operation: update
    columns: [ship_to, status]
    rows: "status IN ('placed', 'packed')"
    check: "status IN ('placed', 'packed', 'cancelled')"
  - role: org_admin
    operation: insert
    columns: [id, placed_at, ship_to, status, total_cents, customer_id]
    check: "TRUE"
  - role: org_admin
    operation: update
    columns: [id, placed_at, ship_to, status, total_cents, customer_id]
    rows: "TRUE"
    check: "TRUE"
  - role: org_admin
    operation: delete
    rows: "TRUE"
  - role: support_lead
    operation: update
    columns: [ship_to, status]
    rows: "status IN ('placed', 'packed')"
    check: "status IN ('placed', 'packed', 'cancelled')"
- source_id: outfitters
  domain_id: store
  schema: public
  table: products
  alias: catalog
  description: The catalog the store sells
  columns:
  - {name: id, data_type: integer, is_primary_key: true, description: The product's id, visible_to: [analyst, customer, org_admin, support, support_lead]}
  - {name: name, data_type: text, description: Product name, visible_to: [analyst, customer, org_admin, support, support_lead]}
  - {name: price_cents, data_type: integer, description: List price in cents, visible_to: [analyst, customer, org_admin, support, support_lead]}
  - {name: sku, data_type: text, description: Stock-keeping unit, visible_to: [analyst, customer, org_admin, support, support_lead]}
  - {name: active, data_type: boolean, description: Still sold, visible_to: [analyst, org_admin, support, support_lead]}
  write_grants:
  - role: org_admin
    operation: insert
    columns: [id, name, price_cents, sku, active]
    check: "TRUE"
  - role: org_admin
    operation: update
    columns: [id, name, price_cents, sku, active]
    rows: "TRUE"
    check: "TRUE"
  - role: org_admin
    operation: delete
    rows: "TRUE"
- source_id: crm
  domain_id: crm
  schema: crm
  table: Account
  alias: accounts
  description: The sales team's accounts in Salesforce -- who owns the relationship with each business
  columns:
  - {name: Id, data_type: varchar, is_primary_key: true, description: The account's Salesforce id, visible_to: [analyst, org_admin, support, support_lead]}
  - {name: Name, data_type: varchar, description: The business, visible_to: [analyst, org_admin, support, support_lead]}
  - {name: Industry, data_type: varchar, description: Its industry, visible_to: [analyst, org_admin, support, support_lead]}
  - {name: Type, data_type: varchar, description: "Customer - Direct or Customer - Channel", visible_to: [analyst, org_admin, support, support_lead]}
  - {name: BillingCity, data_type: varchar, description: Where it is billed, visible_to: [analyst, org_admin, support, support_lead]}
relationships:
- {id: customers.orders, source_table_id: customers, target_table_id: orders, source_column: id, target_column: customer_id, cardinality: one-to-many, graphql_alias: orders}
- {id: order_items.order, source_table_id: order_items, target_table_id: orders, source_column: order_id, target_column: id, cardinality: many-to-one, graphql_alias: order}
- {id: order_items.product, source_table_id: order_items, target_table_id: catalog, source_column: product_id, target_column: id, cardinality: many-to-one, graphql_alias: product}
- {id: orders.customer, source_table_id: orders, target_table_id: customers, source_column: customer_id, target_column: id, cardinality: many-to-one, graphql_alias: customer}
- {id: orders.items, source_table_id: orders, target_table_id: order_items, source_column: id, target_column: order_id, cardinality: one-to-many, graphql_alias: items}
- {id: catalog.order_items, source_table_id: catalog, target_table_id: order_items, source_column: id, target_column: product_id, cardinality: one-to-many, graphql_alias: order_items}
# What Hasura could not do: a business customer's Salesforce account, approved like any other.
- {id: customers.account, source_table_id: customers, target_table_id: accounts, source_column: sf_account_id, target_column: Id, cardinality: many-to-one, graphql_alias: account, alias: BUYS_FOR}
rls_rules:
- table_id: customers
  role_id: customer
  description: "A customer reads only their own customer record."
  filter: "id = current_setting('provisa.hasura_user_id')"
- table_id: order_items
  role_id: customer
  description: "A customer reads only the lines of their own orders."
  filter: "EXISTS (SELECT 1 FROM orders AS _r1 WHERE _r1.id = order_id AND CAST(_r1.customer_id AS TEXT) = current_setting('provisa.hasura_user_id'))"
- table_id: orders
  role_id: customer
  description: "A customer reads only their own orders."
  filter: "customer_id = current_setting('provisa.hasura_user_id')"
- table_id: orders
  role_id: analyst
  description: "Reporting leaves out cancelled orders."
  filter: "status != 'cancelled'"
- table_id: catalog
  role_id: customer
  description: "A customer sees only the products on sale."
  filter: "active = TRUE"
roles:
- id: analyst
  description: "Reports on the shop: reads orders and the catalog, without cancelled orders."
  capabilities: [query_development]
  domain_access: ["*"]
- id: customer
  description: "A shop customer as the app signs one in: their own record, orders and order lines, and the active catalog."
  capabilities: [query_development, write]
  domain_access: ["*"]
- id: support
  description: "Customer support: reads and updates customers and their orders to resolve requests."
  capabilities: [query_development, write]
  domain_access: ["*"]
- id: support_lead
  description: "Leads customer support: what support does, for the requests support escalates."
  capabilities: [query_development, write]
  domain_access: ["*"]
# A customer as the app signs one in: Ana, customer 1. The role's session value stands in for the
# x-hasura-user-id claim her token would carry, so the tour reads the store as she does.
- id: ana
  description: "Ana, customer 1, as the app signs her in: the customer role with her user id set."
  capabilities: [query_development, write]
  domain_access: ["*"]
  parent_role_id: customer
  session_vars: {hasura_user_id: "1"}
webhooks:
- name: refund_order
  url: "${env:PAYMENTS_BASE_URL:-https://payments.example}/refund"
  kind: mutation
  domain_id: default
  visible_to: [support]
  arguments:
  - {name: order_id, type: integer}
  - {name: reason, type: text}
  inline_return_type:
  - {name: refund_id, type: String}
  - {name: status, type: String}
scheduled_triggers:
- id: order_placed
  on: {table: outfitters.public.orders, event: change}
  url: "${env:FULFILMENT_WEBHOOK_URL:-https://fulfilment.example/order-placed}"
- id: nightly_sales_digest
  cron: "0 6 * * *"
  url: "${env:REPORTS_BASE_URL:-https://reports.example}/digest"
  enabled: false
