# The retail demo's own tour (REQ-2010, REQ-2035): one config, two data processing environments,
# and what a reader gets depends on their assigned region as well as any other rule. The scenario
# and its question; where regions are defined -- the platform's regions and their purposes, the
# org's regions and their stores, one engine per region; homing, the engine's rules -- each
# subsidiary's source and an EU table homed in the EU; the register of data subject requests and
# how it joins; then the data steward's rules, one reader at a time on the visitor's US node: group
# reporting with EU customers pseudonymised and the record naming eu as the region that answered,
# EU marketing reading consenting customers only, the data protection officer's access and erasure
# views, the insider review queue and its reveal to an EU reviewer; then the one audit record
# across both regions, the legal limits, and a recap. Step kinds and checks are as tour.yaml of the
# weblogs demo describes them, and region (a platform region's row on /admin/platform and
# /admin/regions, its tab on /admin/org-engine, Admin > Federation as a sandbox's visitor reaches
# it) and purposes (the legend of region purposes). No Polly step: nothing here asks for a
# conversation.
# Where the tour's "Look around on my own" leaves the visitor: the SQL page.
landing:
  route: /sql
  capability: query_development
steps:
# The scenario.
- key: retailScenario
  route: /sources
  capability: source_registration
  source: eu-shop
# Where regions are defined: the platform's config grants them (the Platform page, read-only in a
# sandbox), the org holds them with their stores, and each runs its own engine.
- key: retailPlatformRegions
  route: /admin/platform
  capability: platform_settings
  region: eu
- key: retailPurposes
  purposes: true
- key: retailOrgRegions
  route: /admin/regions
  capability: org_settings
  region: eu
- key: retailEngines
  route: /admin/org-engine
  capability: org_settings
  region: eu
# Homing, the engine's rules: each subsidiary's source names its home, and an EU table is homed in
# the EU (its region, on its detail panel).
- key: retailRegions
  route: /sources
  capability: source_registration
  source: us-shop
- key: retailEuCustomers
  route: /tables
  capability: table_registration
  table: eu-shop.customers
  open: identity.region
# The register of requests and how it joins.
- key: retailRequests
  table: group-ref.subject_requests
- key: retailJoin
  route: /relationships
  capability: create_relationship
  relationship: ASKS_ABOUT_EU
# Security, the data steward's rules, applied in the home region before anything leaves. Group
# reporting, as the group's analysts read it: the header's role, so SQL and GraphQL both read as
# group_analyst.
- key: retailAsAnalyst
  route: /query
  capability: query_development
  role: group_analyst
- key: retailGroupView
  route: /sql
  capability: query_development
  sql: >-
    SELECT subsidiary, customer, country, joined_on FROM "retail"."view_group_customers"
    ORDER BY subsidiary, joined_on DESC LIMIT 20
- key: retailGroupGraphql
  route: /query
  capability: query_development
  example: 1-group-customers
# Back to every role in the header: the SQL explorer's roles below are picked from all of them.
- key: retailEveryRole
  role: all
# EU marketing reads only the customers who agreed.
- key: retailAudience
  route: /sql
  capability: query_development
  role: marketing_eu
  sql: >-
    SELECT customer_id, full_name, country, consent_recorded_at
    FROM "retail"."view_eu_marketing_audience" ORDER BY consent_recorded_at DESC LIMIT 20
# The data protection officer answers a request for access and plans an erasure.
- key: retailAsDpo
  role: dpo
- key: retailAccess
  sql: >-
    SELECT request_id, email, subsidiary, customer_id, full_name, country, marketing_consent
    FROM "retail"."view_subject_access" ORDER BY subsidiary
- key: retailErasure
  sql: >-
    SELECT request_id, subsidiary, table_name, row_key FROM "retail"."view_erasure_plan"
    ORDER BY subsidiary, table_name, row_key
# The insider review: the queue, then the sender revealed to an EU reviewer.
- key: retailAsReviewer
  role: reviewer
- key: retailQueue
  sql: >-
    SELECT message_id, sent_at, sender_pseudonym, sender_email, recipient_domain, score, signals
    FROM "retail"."view_eu_mail_review" WHERE score >= 70 ORDER BY score DESC, sent_at DESC
- key: retailAsEuReviewer
  role: reviewer,region__eu
- key: retailReveal
  sql: >-
    SELECT message_id, sent_at, sender_pseudonym, sender_email, recipient_domain, score, signals
    FROM "retail"."view_eu_mail_review" WHERE score >= 70 ORDER BY score DESC, sent_at DESC
# One record across both regions: who read what, and which region answered.
- key: retailAsAdmin
  role: all
- key: retailAudit
  sql: >-
    SELECT logged_at, role_id, table_name, region, row_count FROM "ops"."queries"
    WHERE domain_id = 'retail' ORDER BY logged_at DESC LIMIT 20
# What the features do not do, and a recap.
- key: retailLimits
  route: /sources
  capability: source_registration
  source: group-ref
- key: retailRecap
  route: /relationships
  capability: create_relationship
  relationship: ASKS_ABOUT_EU
