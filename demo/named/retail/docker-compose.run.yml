#
# The retail demo where it runs from its bundle (start-ui-install.sh --demo retail; REQ-2049):
# the group's three databases, loaded from the dump the bundle build wrote (dump/postgres/<database>.sql),
# read only.

x-demo-labels: &demo-labels
  com.provisa.demo: retail

name: provisa-demo-retail-run

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    labels:
      <<: *demo-labels
      com.provisa.demo.role: rdb
      # Where config.yaml's retail-db reads it, for the sandbox tier's node (REQ-2049,
      # scripts/demo_stores_sync.sh): it writes these two into the bundle's stores.env.
      com.provisa.demo.host_env: RETAIL_PG_HOST
      com.provisa.demo.ns_env: RETAIL_PG_NS
      com.provisa.demo.access: run/reader.sql
      com.provisa.demo.port_env: RETAIL_PG_PORT
      com.provisa.demo.port: "5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      # Unset: 29332. Set empty (the node, which runs several versions at once): a port docker
      # picks. On the loopback only.
      - "127.0.0.1:${RETAIL_PG_PORT-29332}:5432"
    volumes:
      - retail_run_pg:/var/lib/postgresql/data
      - ./dump/postgres:/dumps:ro
      - ./dump/load-postgres.sh:/docker-entrypoint-initdb.d/10-load.sh:ro
      - ./run/reader.sql:/docker-entrypoint-initdb.d/20-reader.sql:ro
      - ./db/init-complete.sh:/docker-entrypoint-initdb.d/99-complete.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/lib/postgresql/data/.provisa-init-complete && pg_isready -U postgres -d group_ref"]
      interval: 2s
      timeout: 5s
      retries: 60
      # The first start loads the dump before the marker is written; failures meanwhile do
      # not count.
      start_period: 600s

volumes:
  retail_run_pg:
