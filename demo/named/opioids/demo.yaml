# The opioids demo's card on provisa.dev's live demos page (REQ-2006), generated from this file
# by scripts/gen-site-demos.mjs. published: true once card.png, a screenshot of the demo in
# Provisa, is beside it.
title: Opioid settlement funds and overdose deaths
description: >-
  A state opioid settlement fund's payments to Ohio's counties, in its own database, joined by
  county to CDC's overdose deaths, the Census Bureau's population and federal spending from
  government data: which counties have the most overdose deaths for the treatment the fund pays for?
screenshot: card.png
published: true
# The oldest Provisa this demo's bundle runs on (REQ-2049): a puller running an older one is refused
# by name. The first release carrying the demo.
requires_provisa: 0.1.0a490
# The demo's video: its tagline names what the demo shows Provisa being.
video:
  tagline: "Public Data, Private Records"
