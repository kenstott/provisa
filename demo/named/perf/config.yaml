roles:
- capabilities:
  - query_development
  domain_access:
  - pet-store
  - shelter
  id: analyst
- id: org_admin_unguarded
  capabilities:
  - source_registration
  - table_registration
  - create_relationship
  - create_view
  - approve_view
  - approve_relationship
  - access_config
  - user_management
  - masking_config
  - column_grant
  - view_governance
  - query_development
  - full_results
  - write
  - usage
  - org_settings
  - observability
  - environment_management
  - environment_switch
  - glossary_read
  - glossary_rw
  - org_glossary_rw
  - data_product_read
  - data_product_rw
  - ignore_relationships
  domain_access:
  - '*'
server:
  limits:
    default_row_limit: 100
    request_timeout: 60
    trino_query_timeout: 120
sources:
- description: Great Expectations quality scans — each results table is one suite's per-check outcomes,
    landed as ordinary source rows
  id: dq-checker
  mapping:
    database: provisa
    host: ${env:PROVISA_DQ_HOST:-localhost}
    password: ${env:PROVISA_DQ_PASSWORD:-provisa}
    port: ${env:PROVISA_PGWIRE_PORT:-5439}
    user: ${env:PROVISA_DQ_USER:-org_admin}
  type: great_expectations
- description: Soda quality scans — each results table is one contract's per-check outcomes, landed as
    ordinary source rows
  id: dq-soda
  mapping:
    database: provisa
    host: ${env:PROVISA_DQ_HOST:-localhost}
    password: ${env:PROVISA_DQ_PASSWORD:-provisa}
    port: ${env:PROVISA_PGWIRE_PORT:-5439}
    user: ${env:PROVISA_DQ_USER:-org_admin}
  type: soda
- description: Nightly profile of the pet store's tables — distributions, drift, duplicates, dependence
    and proposed constraints, one run per night
  id: demo-profiler
  mapping:
    cron: 0 2 * * *
    low_cardinality_max: 100
    drift_window: 7
    drift_season: none
    drift_distance: 3.0
    drift_slope: 3.0
    drift_ks: 0.2
    drift_psi: 0.25
    correlation_max_columns: 20
    joint_max_distinct: 20
    category_max_columns: 10
  type: data_profiler
- description: Animal shelter GraphQL API — staff schedules, breed catalogue, and animal assignment records
    managed by shelter operations
  id: graphql-demo
  path: ${env:GRAPHQL_DEMO_URL:-http://graphql-demo:4000/graphql}
  type: graphql_remote
- description: Customer adoption inquiry records — prospective pet owner interest submissions tracked
    by the front-desk team, including inquiry type, message, and resolution status
  id: inquiries-sqlite
  path: ${env:PROVISA_DEMO_DIR:-./demo/files}/inquiries.sqlite
  type: sqlite
- description: Internal pet store inventory — tracks animals available for sale, pricing, species, and
    breed assignments managed by the inventory department
  id: pet-store-sqlite
  path: ${env:PROVISA_DEMO_DIR:-./demo/files}/pet_store.sqlite
  type: sqlite
- auth_config:
    type: none
  base_url: ${env:PETSTORE_BASE_URL:-http://petstore-mock:8080/api/v3}
  cache_ttl: 300
  description: Petstore e-commerce API — browse available animals, check inventory levels, retrieve purchase
    orders, and manage customer accounts through the public storefront
  id: petstore-api
  path: ${env:PETSTORE_BASE_URL:-http://petstore-mock:8080/api/v3}/openapi.json
  type: openapi
- id: bench-postgresql
  type: postgresql
  host: ${env:PROVISA_BENCH_POSTGRESQL_HOST:-localhost}
  port: ${env:PROVISA_BENCH_POSTGRESQL_PORT:-25632}
  database: provisa_bench
  username: provisa
  password: provisa
  description: Perf bench RDB — orders + order_items, wide OLTP shape (PostgreSQL)
- id: bench-clickhouse
  type: clickhouse
  host: ${env:PROVISA_BENCH_CLICKHOUSE_HOST:-localhost}
  port: ${env:PROVISA_BENCH_CLICKHOUSE_PORT:-28623}
  username: default
  password: provisa
  description: Perf bench DW — order_events fact table, wide analytics shape (ClickHouse)
- id: bench-mongodb
  type: mongodb
  host: ${env:PROVISA_BENCH_MONGO_HOST:-localhost}
  port: ${env:PROVISA_BENCH_MONGO_PORT:-27317}
  database: provisa_bench
  description: Perf bench doc store — order_docs, wide nested per-order documents (MongoDB)
  federation_hints:
    direct_connection: 'true'
- id: bench-neo4j
  type: neo4j
  host: ${env:PROVISA_BENCH_NEO4J_HOST:-localhost}
  port: ${env:PROVISA_BENCH_NEO4J_HTTP_PORT:-27974}
  database: neo4j
  description: Perf bench graph store — Customer/Order/Product with PLACED/CONTAINS edges (Neo4j)
