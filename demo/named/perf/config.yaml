- source_id: bench-neo4j
  domain_id: perf-bench
  schema: neo4j
  table: bench_contains_edge
  description: 'One row per CONTAINS edge (order, product pair), keyed by the edge''s own surrogate id
    (REQ-1865: the prior flat shape had no natural single-column key -- order_id repeats per item, product_id
    repeats per order, and the seed data assigns CONTAINS relationships no per-edge id of its own -- and
    a later nested-items-array reshape traded that away for a single-column key at the cost of breaking
    the compiler''s junction-table join traversal, since order_id/product_id stopped being plain scalar
    columns. Neo4j''s own elementId(e) gives every relationship a genuine per-edge identity for free:
    order_id/product_id stay plain columns (join traversal and best_effort_cypher_for_sql both keep working
    unmodified).'
  row_materialize: true
  cache_ttl: 300
  query_template: "MATCH (o:Order)-[e:CONTAINS]->(p:Product) RETURN elementId(e) AS contains_id, o.order_id\
    \ AS order_id, p.product_id AS product_id,\n       e.quantity AS quantity, e.unit_price AS unit_price\n\
    ORDER BY contains_id"
  columns:
  - name: contains_id
    data_type: text
    is_primary_key: true
    visible_to:
    - org_admin
    - analyst
    - org_admin_unguarded
  - name: order_id
    data_type: integer
    visible_to:
    - org_admin
    - analyst
    - org_admin_unguarded
  - name: product_id
    data_type: integer
    visible_to:
    - org_admin
    - analyst
    - org_admin_unguarded
  - name: quantity
    data_type: integer
    visible_to:
    - org_admin
    - analyst
    - org_admin_unguarded
  - name: unit_price
    data_type: numeric
    visible_to:
    - org_admin
    - analyst
    - org_admin_unguarded
