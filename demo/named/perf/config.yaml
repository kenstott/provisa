# The WHOLE config of the named "perf" demo (start-ui-install.sh --demo perf): the standard demo
# config (config/provisa-install.yaml) with the perf demo's own domain, sources, tables,
# relationships and role appended, merged once and dumped. A named demo's config.yaml is used in
# place of the standard demo config (REQ-1858), so this file is exactly what the demo registers.
# Dumping drops comments: the perf sections' explanations are kept in the notes below.
#
# Notes carried from the former fragment.yaml:
#   * EVERY source needs explicit `tables:` entries. pgwire's catalog is built by walking registered
#     TableMeta rows (provisa/pgwire/catalog_populate.py), so a bare `sources:` entry never reaches
#     the SQL catalog, whatever the connector type.
#   * The perf-bench sources are postgresql (RDB), clickhouse (DW), mongodb (doc store) and neo4j
#     (graph), sharing an order_id/customer_id join-key domain. Ports match this directory's
#     docker-compose.yml.
#   * bench-mongodb sets federation_hints.direct_connection: the single-node replica set advertises
#     its internal Compose address, which hangs from outside the network (REQ-1902).
#   * bench-orders-events and bench-orders-docs are the cross-engine relationships the SQL
#     federated_join needs; registering them is the fix, not a --relationship-guard=false bypass.
#   * org_admin_unguarded (REQ-1890) is a literal copy of org_admin's capabilities plus
#     ignore_relationships.
auth:
  assignments_source: provisa
  default_assignments:
  - domain_id: '*'
    role_id: org_admin
  provider: none
cache:
  default_ttl: 300
  enabled: true
data_products:
- purpose: Pet health records — inventory and referral vets for care history
  domain_id: pet-store
  id: pet_health
  name: Pet Health
  owner: org_admin
  support_contact: kennethstott@gmail.com
- purpose: Shelter staffing — employee roster and shift coverage
  domain_id: shelter
  id: workforce_ops
  name: Workforce Ops
  owner: org_admin
  support_contact: kennethstott@gmail.com
discovery:
  api_key: ${env:ANTHROPIC_API_KEY:-}
  min_confidence: 0.7
  sample_size: 20
glossary_terms:
- name: referral
  definition: The act of sending a pet to an outside veterinary practice for care beyond in-house capability.
  domains:
  - pet-store
  edges:
  - to: clinic
    rel_type: RELATED_TO
  - to: specialty
    rel_type: RELATED_TO
- name: clinic
  definition: The outside veterinary practice a pet is referred to.
  domains:
  - pet-store
- name: specialty
  definition: The area of veterinary care a referral clinic focuses on.
  domains:
  - pet-store
- name: personnel record
  definition: An employee's role and tenure at the shelter, held for staffing and HR reporting.
  domains:
  - shelter
- name: department
  definition: The organizational unit an employee is assigned to.
  domains:
  - shelter
  edges:
  - to: personnel record
    rel_type: PART_OF
- name: hire date
  definition: The date an employee started working at the shelter.
  domains:
  - shelter
  edges:
  - to: personnel record
    rel_type: PART_OF
- name: shift coverage
  definition: The window and place a shelter staff member is scheduled to work, used for weekly coverage
    and handoff planning.
  domains:
  - shelter
  edges:
  - to: shift start
    rel_type: RELATED_TO
  - to: shift end
    rel_type: RELATED_TO
  - to: schedule location
    rel_type: RELATED_TO
- name: shift start
  definition: The time a scheduled shift begins.
  domains:
  - shelter
- name: shift end
  definition: The time a scheduled shift ends.
  domains:
  - shelter
- name: schedule location
  definition: The place a scheduled shift takes place.
  domains:
  - shelter
domains:
- description: Pet store — Petstore public API (OpenAPI), internal inventory (PG), and customer inquiries
    (SQLite) federated into one virtual database
  id: pet-store
- description: Animal shelter staff and breed management — employees, assignments, schedules from GraphQL
    demo server
  id: shelter
- id: perf-bench
  description: Cross-engine performance benchmark — orders/customers/products spread across an RDB, DW,
    doc store, and graph store sharing an order_id/customer_id join-key domain
federation_engine: duckdb
functions:
- arguments:
  - name: name
    type: String
  - name: breed
    type: String
  - name: status
    type: String
  binding:
    callable: demo.py_functions:add_pet
  description: Add a new pet to inventory
  domain_id: pet-store
  function_name: add_pet
  impl_kind: python
  kind: mutation
  name: add_pet
  product_id: pet_health
  return_schema:
    properties:
      id:
        type: integer
      name:
        type: string
      breed:
        type: string
      status:
        type: string
    type: object
  returns: ''
  source_id: ''
  visible_to:
  - org_admin
- arguments:
  - arg_kind: result_set
    columns:
    - name: id
      type: integer
    - name: region
      type: text
    name: input
    type: String
  binding:
    method: /provisa.demo.Enrich/EnrichRows
    target: ${env:DEMO_GRPC_TARGET:-localhost:50071}
  description: Demo gRPC command that ENRICHES an input relation — materializes the referenced result_set,
    sends its rows to the service, returns each row plus a deterministic embedding + geo marker (REQ-885)
  domain_id: pet-store
  function_name: enrich_grpc_set
  impl_kind: grpc
  kind: query
  name: enrich_grpc_set
  output_columns:
  - name: embedding
    type: text
  - name: geo
    type: text
  - name: id
    type: integer
  return_schema:
    items:
      properties:
        embedding:
          type: string
        geo:
          type: string
        id:
          type: integer
      type: object
    type: array
  returns: ''
  source_id: ''
  visible_to:
  - org_admin
- binding:
    method: /provisa.demo.RandomData/GetRandomSet
    target: ${env:DEMO_GRPC_TARGET:-localhost:50071}
  description: Demo gRPC command returning a random-valued dataset (set-returning) via the JSON unary
    bridge (REQ-885)
  domain_id: pet-store
  function_name: random_grpc_set
  impl_kind: grpc
  kind: query
  name: random_grpc_set
  return_schema:
    items:
      properties:
        active:
          type: boolean
        amount:
          type: number
        id:
          type: integer
        region:
          type: string
      type: object
    type: array
  returns: ''
  source_id: ''
  visible_to:
  - org_admin
- arguments:
  - name: rows
    type: Int
  - name: seed
    type: Int
  binding:
    callable: demo.py_functions:random_dataset
  description: Demo Provisa-hosted Python command returning a random-valued dataset (set-returning, REQ-885)
  domain_id: pet-store
  function_name: random_python_set
  impl_kind: python
  kind: query
  name: random_python_set
  return_schema:
    items:
      properties:
        active:
          type: boolean
        amount:
          type: number
        id:
          type: integer
        region:
          type: string
      type: object
    type: array
  returns: ''
  source_id: ''
  visible_to:
  - org_admin
graphql_remote:
  max_list_depth: 2
  max_list_items: 100
  max_object_depth: 5
mail:
  base_url: ${env:PROVISA_MAIL_BASE_URL:-http://localhost:5173}
  from_address: ${env:PROVISA_MAIL_FROM:-provisa@localhost}
  provider: ${env:PROVISA_MAIL_PROVIDER:-smtp}
  resend:
    api_key: ${env:PROVISA_EMAIL_API_KEY:-}
  microsoft365:
    tenant_id: ${env:PROVISA_MAIL_M365_TENANT_ID:-}
    client_id: ${env:PROVISA_MAIL_M365_CLIENT_ID:-}
    client_secret: ${env:PROVISA_MAIL_M365_CLIENT_SECRET:-}
    sender: ${env:PROVISA_MAIL_M365_SENDER:-}
metrics:
- datatype: bigint
  description: Number of customer inquiries, re-grainable by any dim_pet attribute
  expression: COUNT(fact_pet_inquiries.id)
  from_fact: fact_pet_inquiries
  name: fact_pet_inquiries_id_count
  visible_to:
  - org_admin
  - analyst
naming:
  domain_prefix: true
  rules: []
observability:
  endpoint: http://localhost:4319
  ops_snapshot_retention_hours: 1
  protocol: http/protobuf
  sample_rate: 1.0
  service_name: provisa
