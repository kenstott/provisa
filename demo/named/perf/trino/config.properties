#
# The three-device benchmark's Trino engine (device 3, METHODOLOGY.md): one coordinator that also
# runs tasks. Provisa on device 1 creates its catalogs over SQL (catalog.management=dynamic). No
# retry policy: an optimistic or knob run's queries are short and an exchange manager is one more
# service to size.
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
catalog.management=dynamic
catalog.store=memory
query.max-memory=32GB
query.max-memory-per-node=32GB
