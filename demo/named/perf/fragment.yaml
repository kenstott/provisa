- source_id: bench-mongodb
  domain_id: perf-bench
  # Matches this source's own `database: provisa_bench` (line ~55) — confirmed live (DuckDB's
  # attach error suggested "_src_bench-mongodb.provisa_bench.order_docs"), same copy-paste
  # mistake as bench-clickhouse's schema field (see that entry's comment).
  schema: provisa_bench
  table: order_docs
  description: Sales dept case-file doc-store orders — top-level + flattened nested fields, see generate_mongo.py
  columns:
  - {name: order_id, data_type: integer, is_primary_key: true, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: customer_id, data_type: integer, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: status, data_type: varchar, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: order_date, data_type: date, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: created_at, data_type: date, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: updated_at, data_type: date, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: customer_tier, data_type: varchar, path: customer_profile.tier, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: customer_lifetime_value, data_type: numeric, path: customer_profile.lifetime_value, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: payment_amount, data_type: numeric, path: payment.amount, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: shipping_carrier, data_type: varchar, path: shipping.carrier, visible_to: [org_admin, analyst, org_admin_unguarded]}
- source_id: bench-neo4j
  domain_id: perf-bench
  schema: neo4j
  table: bench_order_node
  # Matches Neo4j's own node label (generate_neo4j.py's seed), needed for cypher_cross_engine's
  # MATCH (o:Order) — the auto-derived label from the table's own name (bench_order_node) never
  # matches a hand-authored Cypher query's literal label text.
  alias: Order
  description: One row per Order node
  # REQ-1865: query-driven, row-level cache instead of a full-table land for a keyed lookup --
  # order_id is projected by this template's own RETURN clause (config_loader._validate_row_materialize
  # checks this at registration), so a point lookup wraps this query with a filter instead of
  # materializing every Order node.
  row_materialize: true
  cache_ttl: 300
  query_template: >-
    MATCH (o:Order)
    RETURN o.order_id AS order_id, o.customer_id AS customer_id, o.region AS region,
           o.channel AS channel, o.status AS status, o.amount AS amount, o.discount AS discount,
           o.tax AS tax, o.shipping_cost AS shipping_cost, o.currency AS currency,
           o.payment_method AS payment_method, o.priority AS priority,
           o.warehouse_id AS warehouse_id, o.order_date AS order_date,
           o.created_at AS created_at, o.fulfillment_days AS fulfillment_days
    ORDER BY o.order_id
  columns:
  - {name: order_id, data_type: integer, is_primary_key: true, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: customer_id, data_type: integer, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: region, data_type: varchar, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: channel, data_type: varchar, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: status, data_type: varchar, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: amount, data_type: numeric, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: discount, data_type: numeric, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: tax, data_type: numeric, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: shipping_cost, data_type: numeric, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: currency, data_type: varchar, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: payment_method, data_type: varchar, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: priority, data_type: varchar, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: warehouse_id, data_type: integer, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: order_date, data_type: varchar, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: created_at, data_type: varchar, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: fulfillment_days, data_type: integer, visible_to: [org_admin, analyst, org_admin_unguarded]}
- source_id: bench-neo4j
  domain_id: perf-bench
  schema: neo4j
  table: bench_customer_node
  alias: Customer
  description: One row per Customer node
  row_materialize: true  # REQ-1865 -- see bench_order_node's comment
  cache_ttl: 300
  query_template: >-
    MATCH (c:Customer)
    RETURN c.customer_id AS customer_id, c.name AS name, c.tier AS tier, c.region AS region,
           c.industry AS industry, c.employees AS employees, c.lifetime_value AS lifetime_value,
           c.signup_year AS signup_year, c.churn_risk AS churn_risk,
           c.primary_contact_email AS primary_contact_email
    ORDER BY c.customer_id
  columns:
  - {name: customer_id, data_type: integer, is_primary_key: true, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: name, data_type: varchar, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: tier, data_type: varchar, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: region, data_type: varchar, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: industry, data_type: varchar, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: employees, data_type: integer, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: lifetime_value, data_type: numeric, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: signup_year, data_type: integer, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: churn_risk, data_type: numeric, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: primary_contact_email, data_type: varchar, visible_to: [org_admin, analyst, org_admin_unguarded]}
- source_id: bench-neo4j
  domain_id: perf-bench
  schema: neo4j
  table: bench_product_node
  alias: Product
  description: One row per Product node
  row_materialize: true  # REQ-1865 -- see bench_order_node's comment
  cache_ttl: 300
  query_template: >-
    MATCH (p:Product)
    RETURN p.product_id AS product_id, p.sku AS sku, p.name AS name, p.category AS category,
           p.unit_cost AS unit_cost, p.list_price AS list_price, p.supplier_id AS supplier_id,
           p.active AS active, p.launch_year AS launch_year
    ORDER BY p.product_id
  columns:
  - {name: product_id, data_type: integer, is_primary_key: true, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: sku, data_type: varchar, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: name, data_type: varchar, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: category, data_type: varchar, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: unit_cost, data_type: numeric, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: list_price, data_type: numeric, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: supplier_id, data_type: integer, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: active, data_type: boolean, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: launch_year, data_type: integer, visible_to: [org_admin, analyst, org_admin_unguarded]}
- source_id: bench-neo4j
  domain_id: perf-bench
  schema: neo4j
  table: bench_placed_edge
  description: One row per PLACED edge (which customer placed which order)
  # REQ-1865: order_id is unique per row here (one customer places any given order exactly once)
  # -- a genuine single-column key, unlike bench_contains_edge's composite (order_id, product_id).
  row_materialize: true
  cache_ttl: 300
  query_template: >-
    MATCH (c:Customer)-[:PLACED]->(o:Order)
    RETURN c.customer_id AS customer_id, o.order_id AS order_id
    ORDER BY o.order_id
  columns:
  - {name: customer_id, data_type: integer, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: order_id, data_type: integer, is_primary_key: true, visible_to: [org_admin, analyst, org_admin_unguarded]}
- source_id: bench-neo4j
  domain_id: perf-bench
  schema: neo4j
  table: bench_contains_edge
  description: >-
    One row per CONTAINS edge (order, product pair), keyed by the edge's own surrogate id
    (REQ-1865: the prior flat shape had no natural single-column key -- order_id repeats per
    item, product_id repeats per order, and the seed data assigns CONTAINS relationships no
    per-edge id of its own -- and a later nested-items-array reshape traded that away for a
    single-column key at the cost of breaking the compiler's junction-table join traversal,
    since order_id/product_id stopped being plain scalar columns. Neo4j's own elementId(e) gives
    every relationship a genuine per-edge identity for free: order_id/product_id stay plain
    columns (join traversal and best_effort_cypher_for_sql both keep working unmodified).
  row_materialize: true
  cache_ttl: 300
  query_template: >-
    MATCH (o:Order)-[e:CONTAINS]->(p:Product)
    RETURN elementId(e) AS contains_id, o.order_id AS order_id, p.product_id AS product_id,
           e.quantity AS quantity, e.unit_price AS unit_price
    ORDER BY contains_id
  columns:
  - {name: contains_id, data_type: text, is_primary_key: true, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: order_id, data_type: integer, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: product_id, data_type: integer, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: quantity, data_type: integer, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: unit_price, data_type: numeric, visible_to: [org_admin, analyst, org_admin_unguarded]}

relationships:
# federated_join/large_federated_join's SQL variant (queries.py) runs a real
# orders JOIN order_events JOIN order_docs ON order_id — V002 rejected it with
# "no approved relationship exists" because these two cross-engine FKs were never registered
# (the module docstring's "no relationships are registered" note was about why the GraphQL
# variant uses multiple root fields instead of one nested selection, not a decision to leave the
# SQL join unauthorized). Registering the real cross-engine relationships is the correct fix, not
# a --relationship-guard=false bypass (V002 exists to mark approved traversal, not to be routed
# around by benchmark code).
- alias: HAS_EVENT
  cardinality: one-to-many
  id: bench-orders-events
  source_table_id: orders
  source_column: order_id
  target_table_id: order_events
  target_column: order_id
- alias: HAS_DOC
  # order_docs.order_id is genuinely 1:1 with orders.order_id — both are primary keys.
  # cardinality now supports "one-to-one" directly (provisa/core/models.py Cardinality enum).
  cardinality: one-to-one
  id: bench-orders-docs
  source_table_id: orders
  source_column: order_id
  target_table_id: order_docs
  target_column: order_id
- alias: HAS_ITEM
  # cypher_single_source's MATCH (o:Orders)-[:HAS_ITEM]->(i:OrderItems) — same-source (Postgres)
  # FK join, but V002 requires an approved relationship for ANY join regardless of whether it's
  # cross-engine, so this needed registering too (confirmed live: "no approved relationship
  # exists" for orders/order_items, same class of gap as HAS_EVENT/HAS_DOC above).
  cardinality: one-to-many
  id: bench-orders-items
  source_table_id: orders
  source_column: order_id
  target_table_id: order_items
  target_column: order_id
# REQ-1586 junction-backed edges — cypher_cross_engine's MATCH (c:Customer)-[:PLACED]->(o:Order)
# / -[:CONTAINS]->(p:Product) need PLACED/CONTAINS registered as Cypher relationship TYPES, not
# just a pair of many-to-one FKs from the edge table to each node (confirmed live: the old
# many-to-one-per-side shape left cypher_router's label_map with no "PLACED"/"CONTAINS" alias at
# all, so any query naming them 403'd with "Unregistered relationship type(s)"). via_label_source:
# fixed + alias names the edge type directly, mirroring config/provisa-install.yaml's
# pets-treated-by-vets (the same two-different-entities junction shape).
# table_repo.find_by_table_name resolves a "virtual name": alias when the table has one, else
# table_name (confirmed live) — bench_customer_node/bench_order_node/bench_product_node now have
# aliases (Customer/Order/Product, above), so source_table_id/target_table_id here must reference
# THOSE aliases, not the raw table_name — the raw name silently no longer resolves once a table
# has an alias, and rel_repo.upsert's ValueError on an unresolved reference is swallowed by
# _upsert_relationships ("retried after source registration" — never happens for static config),
# so this failed with no visible error at all: label_map simply never got PLACED/CONTAINS.
- alias: PLACED
  cardinality: one-to-many
  id: bench-placed
  source_table_id: Customer
  source_column: customer_id
  target_table_id: Order
  target_column: order_id
  via_table: bench_placed_edge
  via_source_column: customer_id
  via_target_column: order_id
  via_label_source: fixed
- alias: CONTAINS
  cardinality: one-to-many
  id: bench-contains
  source_table_id: Order
  source_column: order_id
  target_table_id: Product
  target_column: product_id
  via_table: bench_contains_edge
  via_source_column: order_id
  via_target_column: product_id
  via_label_source: fixed

# REQ-1887: org_admin_unguarded — org_admin's exact capability/domain_access clone (literal copy
# of provisa/core/db.py's _ORG_ADMIN_CAPABILITIES / provisa/core/schema.sql:1094-1104's seed, not
# a parent_role_id inheritance: provisa/core/config_loader.py's role-loading step (`for role in
# config.roles: await role_repo.upsert(conn, role)`) upserts each config role's capabilities
# literally, with no flatten_roles() merge at load or read time — provisa/core/models.py's
# flatten_roles is called nowhere in the runtime path (only provisa/api/admin/roles_router.py
# resolves parent_role_id, and only at an admin-mutation write, which this config load never goes
# through) — so a parent_role_id-only role here would carry ignore_relationships alone with no
# other capability and domain_access: [] instead of ["*"]. role_repo.upsert (REQ-1349) refuses to
# write id in ("platform_admin", "org_admin") only, so this new id upserts normally.
roles:
- id: org_admin_unguarded
  capabilities:
  - source_registration
  - table_registration
  - create_relationship
  - create_view
  - approve_view
  - approve_relationship
  - access_config
  - user_management
  - masking_config
  - column_grant
  - view_governance
  - query_development
  - full_results
  - write
  - usage
  - org_settings
  - observability
  - environment_management
  - environment_switch
  - glossary_read
  - glossary_rw
  - org_glossary_rw
  - data_product_read
  - data_product_rw
  - ignore_relationships
  domain_access:
  - "*"
