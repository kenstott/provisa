- source_id: bench-clickhouse
  domain_id: perf-bench
  # ClickHouse's own default database, confirmed live (system.tables) — order_events was never
  # created under a "public" database (that's the Postgres source's convention, wrongly
  # copy-pasted here); this caused "Database public does not exist" the moment a federated query
  # actually reached ClickHouse (only surfaced once the compiler's @N param-substitution bug,
  # fixed separately, stopped masking it with an earlier syntax error).
  schema: default
  table: order_events
  description: Sales dept analytics event fact table (22 cols) — see generate_clickhouse.py
  enable_aggregates: true
  enable_group_by: true
  # REQ-1865: reached only via JOIN in federated_join/large_federated_join (on order_id, not its
  # own PK event_id) — key-pushdown handles a non-PK join column fine (query_residency.py), so
  # this needs no reshape, just the opt-in. Without it, this 60M-row ClickHouse table pays a full
  # SELECT * land on every cold start via the generic MATERIALIZED path (make_clickhouse_loader).
  row_materialize: true
  cache_ttl: 300
  columns:
  - {name: event_id, data_type: integer, is_primary_key: true, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: order_id, data_type: integer, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: customer_id, data_type: integer, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: event_type, data_type: varchar, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: event_ts, data_type: timestamp, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: channel, data_type: varchar, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: campaign_id, data_type: integer, visible_to: [org_admin, analyst, org_admin_unguarded]}
  - {name: device, data_type: varchar, visible_to: [org_admin, analyst, org_admin_unguarded]}
