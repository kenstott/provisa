#
# The named demo "churnprod" (start-ui-install.sh --demo churnprod; REQ-1858). This file is its one
# start point: `docker compose up -d` brings up its database, loaded from db/init.sql.
#
#   postgres  the demo's database (db/init.sql, the churn demo's rows), with the role Provisa
#             reads it as.
#
# The churn model's two packages run inside Provisa, from the archives in code/: no service here.
#
# Port: 30132 the database; it can be moved by its variable.
x-demo-labels: &demo-labels
  com.provisa.demo: churnprod
name: provisa-demo-churnprod
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    labels:
      <<: *demo-labels
      com.provisa.demo.role: rdb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: churnprod
    ports:
      - "127.0.0.1:${CHURNPROD_PG_PORT:-30132}:5432"
    volumes:
      - churnprod_pg:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - ./db/reader.sql:/docker-entrypoint-initdb.d/20-reader.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d churnprod"]
      interval: 2s
      timeout: 5s
      retries: 60

volumes:
  churnprod_pg:
