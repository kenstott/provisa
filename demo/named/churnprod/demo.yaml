title: Churn risk in production
description: >-
  Which customers are about to cancel, scored in production? The churn model ships as a Python
  package whose function is a table: joined to the customers, it ranks every one, emails masked for
  the analyst and only its own region's rows for the EU team, with a Node twin beside it.
screenshot: card.png
published: true
