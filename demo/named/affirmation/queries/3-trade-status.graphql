# Every allocation as the matcher found it: matched, or the break it names.
query TradeStatus {
  p__viewTradeStatus(order_by: [{ tradeRef: asc }], limit: 50) {
    tradeRef
    fundAccount
    security
    status
    breakType
    detail
  }
}
