# How many breaks each broker's confirmations hold, and the most a day any of them would cost.
query BreaksByBroker {
  p__viewBreakQueueGroupBy(by: [brokerCode], order_by: [{ groupKey: { brokerCode: asc } }]) {
    groupKey
    aggregate {
      count
      max {
        penaltyPerDay
      }
    }
  }
}
