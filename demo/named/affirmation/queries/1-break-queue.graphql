# The break queue, least time to the cutoff first: each break, what differs, the minutes left
# before its market's cutoff and what a failed settlement would accrue a day.
query BreakQueue {
  p__viewBreakQueue(order_by: [{ minutesToCutoff: asc }, { penaltyPerDay: desc }], limit: 20) {
    tradeRef
    security
    brokerCode
    breakType
    detail
    minutesToCutoff
    currency
    penaltyPerDay
  }
}
