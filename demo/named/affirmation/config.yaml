  - {name: trade_ref, data_type: varchar, description: 'The allocation it confirms', visible_to: [data_steward, settlements]}
  - {name: broker_code, data_type: varchar, description: 'The broker', visible_to: [data_steward, settlements]}
  - {name: side, data_type: varchar, description: 'BUY or SELL, as the broker has it', visible_to: [data_steward, settlements]}
  - {name: quantity, data_type: integer, description: 'The shares, as the broker has them', visible_to: [data_steward, settlements]}
  - {name: price, data_type: decimal, description: 'The broker''s price', visible_to: [data_steward, settlements]}
  - {name: commission, data_type: decimal, description: 'The broker''s commission', visible_to: [data_steward, settlements]}
  - {name: net_amount, data_type: decimal, description: 'What changes hands: the gross with the commission', visible_to: [data_steward, settlements]}
