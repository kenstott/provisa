# The WHOLE config of the named demo "affirmation" (start-ui-install.sh --demo affirmation; REQ-2006):
# which of today's trades will not affirm before the cutoff, why, and what a failed settlement
# would cost? Larkspur Asset Management, a fictional asset manager, keeps each trade in four
# systems that never see one another: the order system's allocation, the execution system's fills,
# the broker's confirmation and the custodian's settlement instruction. A Python code table matches
# each allocation across the four and names each break; a statement command logs the affirmation of
# every allocation that matched (setup.yaml). The break queue gives each break the time left to its
# market's cutoff and the penalty a day a failed settlement would accrue.
#
#   oms      the order management system: orders and their allocations to the funds
#   ems      the execution management system: each order's fills
#   broker   the brokers' confirmations, as the matching platform delivers them
#   custody  the custodian's settlement instructions
#   desk     the middle office: the funds' standing settlement instructions, each market's cutoff
#            and penalty, the desk's clock and the affirmation log
#   matcher  a code resolver (code/trade_match.tar.gz, its source in matcher/): trade_match, the
#            table that matches one allocation's four records and names each break
#
# All five databases are one Postgres server's (db/, written by generate.py).
auth:
  assignments_source: provisa
  default_assignments:
  - domain_id: '*'
    role_id: org_admin
  provider: none
cache:
  default_ttl: 300
  enabled: true
domains:
- id: postrade
  description: Larkspur Asset Management's post-trade flow -- orders, fills, broker confirmations and
    custodian instructions -- matched, its breaks named and its matched trades affirmed
federation_engine: duckdb
naming:
  domain_prefix: true
  rules: []
roles:
# The settlements desk: every system, the break queue and the affirmation log.
- id: settlements
  parents: [analyst]
  description: "The settlements desk: every system's records, the break queue and the affirmation log."
  capabilities: [data_product_read, glossary_read, query_development, usage]
  domain_access: [postrade]
server:
  limits:
    default_row_limit: 100
    request_timeout: 120
    trino_query_timeout: 120
sources:
- id: oms
  type: postgresql
  host: ${env:AFFIRMATION_PG_HOST:-localhost}
  port: ${env:AFFIRMATION_PG_PORT:-30632}
  database: affirmation_oms${env:AFFIRMATION_PG_NS}
  username: provisa
  password: provisa
  description: 'The order management system: orders and their allocations to the funds, read live'
- id: ems
  type: postgresql
  host: ${env:AFFIRMATION_PG_HOST:-localhost}
  port: ${env:AFFIRMATION_PG_PORT:-30632}
  database: affirmation_ems${env:AFFIRMATION_PG_NS}
  username: provisa
  password: provisa
  description: 'The execution management system: each order''s fills, read live'
- id: broker
  type: postgresql
  host: ${env:AFFIRMATION_PG_HOST:-localhost}
  port: ${env:AFFIRMATION_PG_PORT:-30632}
  database: affirmation_broker${env:AFFIRMATION_PG_NS}
  username: provisa
  password: provisa
  description: 'The brokers'' confirmations from the matching platform, read live'
- id: custody
  type: postgresql
  host: ${env:AFFIRMATION_PG_HOST:-localhost}
  port: ${env:AFFIRMATION_PG_PORT:-30632}
  database: affirmation_custody${env:AFFIRMATION_PG_NS}
  username: provisa
  password: provisa
  description: 'The custodian''s settlement instructions, read live'
- id: desk
  type: postgresql
  host: ${env:AFFIRMATION_PG_HOST:-localhost}
  port: ${env:AFFIRMATION_PG_PORT:-30632}
  database: affirmation_desk${env:AFFIRMATION_PG_NS}
  username: provisa
  password: provisa
  description: 'The middle office: standing settlement instructions, cutoffs, penalties, the clock and the affirmation log'
- id: matcher
  type: python
  mapping:
    runtime: python
    code:
      kind: upload
      upload: 8df1af12df0103247048991428345e6a8b69aa133fbea72c85a71435a2ca5c48
      filename: trade_match.tar.gz
  description: 'trade_match: one allocation matched across the four systems, each break named (code/trade_match.tar.gz,
    its source in matcher/)'
tables:
- source_id: oms
  domain_id: postrade
  schema: public
  table: orders
  enable_aggregates: true
  enable_group_by: true
  description: 'Each order the traders placed today: the security, side, quantity, market and the broker it went to'
  columns:
  - {name: order_id, data_type: varchar, is_primary_key: true, description: 'The order', visible_to: [data_steward, settlements]}
  - {name: isin, data_type: varchar, description: 'The security''s ISIN', visible_to: [data_steward, settlements]}
  - {name: security, data_type: varchar, description: 'The security''s name', visible_to: [data_steward, settlements]}
  - {name: side, data_type: varchar, description: 'BUY or SELL', visible_to: [data_steward, settlements]}
  - {name: quantity, data_type: integer, description: 'The shares ordered', visible_to: [data_steward, settlements]}
  - {name: market, data_type: varchar, description: 'Where it settles: US, DE, FR or NL', visible_to: [data_steward, settlements]}
  - {name: currency, data_type: varchar, description: 'The currency it settles in', visible_to: [data_steward, settlements]}
  - {name: broker_code, data_type: varchar, description: 'The broker it was placed with', visible_to: [data_steward, settlements]}
  - {name: trader, data_type: varchar, description: 'The trader who placed it', visible_to: [data_steward, settlements]}
  - {name: trade_date, data_type: date, description: 'The trade date', visible_to: [data_steward, settlements]}
- source_id: oms
  domain_id: postrade
  schema: public
  table: allocations
  enable_aggregates: true
  enable_group_by: true
  description: 'Each order split across the funds: the allocation is the trade the broker confirms and the custodian settles'
  columns:
  - {name: trade_ref, data_type: varchar, is_primary_key: true, description: 'The allocation''s reference, which the confirmation and the instruction carry', visible_to: [data_steward, settlements]}
  - {name: order_id, data_type: varchar, description: 'The order it allocates', visible_to: [data_steward, settlements]}
  - {name: fund_account, data_type: varchar, description: 'The fund it is allocated to', visible_to: [data_steward, settlements]}
  - {name: quantity, data_type: integer, description: 'The shares allocated to the fund', visible_to: [data_steward, settlements]}
  - {name: settle_date, data_type: date, description: 'The settlement date the order system expects', visible_to: [data_steward, settlements]}
- source_id: ems
  domain_id: postrade
  schema: public
  table: executions
  enable_aggregates: true
  enable_group_by: true
  description: 'Each fill of each order, at the price it was done at'
  columns:
  - {name: exec_id, data_type: varchar, is_primary_key: true, description: 'The fill', visible_to: [data_steward, settlements]}
  - {name: order_id, data_type: varchar, description: 'The order it fills', visible_to: [data_steward, settlements]}
  - {name: quantity, data_type: integer, description: 'The shares filled', visible_to: [data_steward, settlements]}
  - {name: price, data_type: decimal, description: 'The price it was done at', visible_to: [data_steward, settlements]}
  - {name: executed_at, data_type: timestamp, description: 'When it was done', visible_to: [data_steward, settlements]}
- source_id: broker
  domain_id: postrade
  schema: public
  table: confirmations
  enable_aggregates: true
  enable_group_by: true
  description: 'Each broker confirmation: the allocation it confirms, the broker''''s price, commission and net amount, and the settlement instructions it will deliver to'
  columns:
