  - {name: affirmed_at, data_type: timestamp, description: 'When it was affirmed, by the desk''s clock', visible_to: [data_steward, settlements]}
  - {name: affirmed_by, data_type: varchar, description: 'What affirmed it', visible_to: [data_steward, settlements]}
  write_grants:
  - {role: org_admin, operation: insert, columns: [trade_ref, affirmed_at, affirmed_by]}
# The matching engine, a table: its columns are its Match's fields, its parameters the function's
# TradeLegs (_nf_ columns), required where the function gives no default. A leg not yet arrived
# reads as absent.
- source_id: matcher
  domain_id: postrade
  schema: default
  table: trade_match
  description: 'One allocation matched across the order, execution, broker and custodian systems: a row a break, naming it and what differs, or one matched row'
  columns:
  - {name: trade_ref, data_type: varchar, description: 'The allocation matched', visible_to: [data_steward, settlements]}
  - {name: status, data_type: varchar, description: 'matched, or break', visible_to: [data_steward, settlements]}
  - {name: break_type, data_type: varchar, description: 'The break: no_confirmation, no_instruction, side, quantity, price, settlement_date, ssi, instruction_quantity, instruction_settlement_date or net_amount; empty when matched', visible_to: [data_steward, settlements]}
  - {name: detail, data_type: varchar, description: 'What differs, in words; empty when matched', visible_to: [data_steward, settlements]}
  - {name: _nf_trade_ref, data_type: varchar, native_filter_type: query_arg, native_filter_required: true, description: 'The allocation''s reference', visible_to: [viewer]}
  - {name: _nf_side, data_type: varchar, native_filter_type: query_arg, native_filter_required: true, description: 'The order system''s side', visible_to: [viewer]}
  - {name: _nf_quantity, data_type: double, native_filter_type: query_arg, native_filter_required: true, description: 'The quantity allocated', visible_to: [viewer]}
  - {name: _nf_settle_date, data_type: date, native_filter_type: query_arg, native_filter_required: true, description: 'The settlement date the order system expects', visible_to: [viewer]}
  - {name: _nf_exec_price, data_type: double, native_filter_type: query_arg, native_filter_required: true, description: 'The average price of the order''s fills', visible_to: [viewer]}
  - {name: _nf_ssi_custodian, data_type: varchar, native_filter_type: query_arg, native_filter_required: true, description: 'The custodian the fund''s standing instructions name', visible_to: [viewer]}
  - {name: _nf_ssi_account, data_type: varchar, native_filter_type: query_arg, native_filter_required: true, description: 'The account the fund''s standing instructions name', visible_to: [viewer]}
  - {name: _nf_confirm_side, data_type: varchar, native_filter_type: query_arg, native_filter_required: false, description: 'The broker''s side; absent with no confirmation', visible_to: [viewer]}
  - {name: _nf_confirm_quantity, data_type: double, native_filter_type: query_arg, native_filter_required: false, description: 'The broker''s quantity', visible_to: [viewer]}
  - {name: _nf_confirm_price, data_type: double, native_filter_type: query_arg, native_filter_required: false, description: 'The broker''s price', visible_to: [viewer]}
  - {name: _nf_confirm_net, data_type: double, native_filter_type: query_arg, native_filter_required: false, description: 'The broker''s net amount', visible_to: [viewer]}
  - {name: _nf_confirm_settle_date, data_type: date, native_filter_type: query_arg, native_filter_required: false, description: 'The broker''s settlement date', visible_to: [viewer]}
  - {name: _nf_confirm_custodian, data_type: varchar, native_filter_type: query_arg, native_filter_required: false, description: 'The custodian the broker will deliver to', visible_to: [viewer]}
  - {name: _nf_confirm_account, data_type: varchar, native_filter_type: query_arg, native_filter_required: false, description: 'The account the broker will deliver to', visible_to: [viewer]}
  - {name: _nf_instruction_quantity, data_type: double, native_filter_type: query_arg, native_filter_required: false, description: 'The custodian instruction''s quantity; absent with no instruction', visible_to: [viewer]}
  - {name: _nf_instruction_net, data_type: double, native_filter_type: query_arg, native_filter_required: false, description: 'The custodian instruction''s net amount', visible_to: [viewer]}
  - {name: _nf_instruction_settle_date, data_type: date, native_filter_type: query_arg, native_filter_required: false, description: 'The custodian instruction''s settlement date', visible_to: [viewer]}
views:
# Each allocation with its four systems' records side by side, a leg not yet arrived empty: what
# trade_match is given (the legs-to-match relationship feeds it these columns).
- id: trade_legs
  domain_id: postrade
  description: Each allocation with its order, its fills' average price, its fund's standing instructions,
    the broker's confirmation and the custodian's instruction side by side; a leg not yet arrived is empty
  sql: >-
    SELECT a.trade_ref, a.fund_account, o.order_id, o.isin, o.security, o.side,
      CAST(a.quantity AS DOUBLE) AS quantity, o.market, o.currency, o.broker_code, o.trade_date,
      a.settle_date, e.exec_price, s.custodian_bic AS ssi_custodian, s.safekeeping_account AS ssi_account,
      c.confirm_id, c.side AS confirm_side, CAST(c.quantity AS DOUBLE) AS confirm_quantity,
      CAST(c.price AS DOUBLE) AS confirm_price, CAST(c.net_amount AS DOUBLE) AS confirm_net,
      c.settle_date AS confirm_settle_date, c.custodian_bic AS confirm_custodian,
      c.safekeeping_account AS confirm_account, CAST(i.quantity AS DOUBLE) AS instruction_quantity,
      CAST(i.net_amount AS DOUBLE) AS instruction_net, i.settle_date AS instruction_settle_date
    FROM "postrade"."allocations" AS a
    JOIN "postrade"."orders" AS o ON o.order_id = a.order_id
    JOIN (SELECT x.order_id, CAST(SUM(x.quantity * x.price) / SUM(x.quantity) AS DOUBLE) AS exec_price
      FROM "postrade"."executions" AS x GROUP BY x.order_id) AS e ON e.order_id = a.order_id
    JOIN "postrade"."ssi" AS s ON s.fund_account = a.fund_account AND s.market = o.market
    LEFT JOIN "postrade"."confirmations" AS c ON c.trade_ref = a.trade_ref
    LEFT JOIN "postrade"."instructions" AS i ON i.trade_ref = a.trade_ref
  columns:
  - {name: trade_ref, data_type: varchar, description: 'The allocation', visible_to: [data_steward, settlements]}
  - {name: fund_account, data_type: varchar, description: 'The fund', visible_to: [data_steward, settlements]}
  - {name: order_id, data_type: varchar, description: 'The order', visible_to: [data_steward, settlements]}
  - {name: isin, data_type: varchar, description: 'The security''s ISIN', visible_to: [data_steward, settlements]}
  - {name: security, data_type: varchar, description: 'The security', visible_to: [data_steward, settlements]}
  - {name: side, data_type: varchar, description: 'BUY or SELL', visible_to: [data_steward, settlements]}
  - {name: quantity, data_type: double, description: 'The shares allocated', visible_to: [data_steward, settlements]}
  - {name: market, data_type: varchar, description: 'Where it settles', visible_to: [data_steward, settlements]}
  - {name: currency, data_type: varchar, description: 'The currency it settles in', visible_to: [data_steward, settlements]}
  - {name: broker_code, data_type: varchar, description: 'The broker', visible_to: [data_steward, settlements]}
  - {name: trade_date, data_type: date, description: 'The trade date', visible_to: [data_steward, settlements]}
  - {name: settle_date, data_type: date, description: 'The settlement date the order system expects', visible_to: [data_steward, settlements]}
  - {name: exec_price, data_type: double, description: 'The average price of the order''s fills', visible_to: [data_steward, settlements]}
  - {name: ssi_custodian, data_type: varchar, description: 'The custodian the fund''s standing instructions name', visible_to: [data_steward, settlements]}
  - {name: ssi_account, data_type: varchar, description: 'The account they name', visible_to: [data_steward, settlements]}
  - {name: confirm_id, data_type: varchar, description: 'The broker''s confirmation; empty when none arrived', visible_to: [data_steward, settlements]}
  - {name: confirm_side, data_type: varchar, description: 'The broker''s side', visible_to: [data_steward, settlements]}
  - {name: confirm_quantity, data_type: double, description: 'The broker''s quantity', visible_to: [data_steward, settlements]}
  - {name: confirm_price, data_type: double, description: 'The broker''s price', visible_to: [data_steward, settlements]}
  - {name: confirm_net, data_type: double, description: 'The broker''s net amount', visible_to: [data_steward, settlements]}
  - {name: confirm_settle_date, data_type: date, description: 'The broker''s settlement date', visible_to: [data_steward, settlements]}
  - {name: confirm_custodian, data_type: varchar, description: 'The custodian the broker will deliver to', visible_to: [data_steward, settlements]}
  - {name: confirm_account, data_type: varchar, description: 'The account the broker will deliver to', visible_to: [data_steward, settlements]}
  - {name: instruction_quantity, data_type: double, description: 'The custodian instruction''s quantity; empty when none was sent', visible_to: [data_steward, settlements]}
  - {name: instruction_net, data_type: double, description: 'The custodian instruction''s net amount', visible_to: [data_steward, settlements]}
  - {name: instruction_settle_date, data_type: date, description: 'The custodian instruction''s settlement date', visible_to: [data_steward, settlements]}
# Every allocation matched by trade_match: a row a break, or one matched row. Stored, so the
# affirm_matched command and the break queue read its rows rather than calling the matcher again.
- id: trade_status
  domain_id: postrade
  materialize: true
  enable_aggregates: true
  enable_group_by: true
  description: Every allocation matched across the four systems -- a row a break, naming it and what differs, or one matched row
  sql: >-
    SELECT l.trade_ref, l.fund_account, l.security, l.isin, l.side, l.quantity, l.market, l.currency,
      l.broker_code, l.trade_date, ROUND(l.quantity * l.exec_price, 2) AS gross_amount,
      m.status, m.break_type, m.detail
    FROM "postrade"."view_trade_legs" AS l
    JOIN "postrade"."trade_match" AS m ON m.trade_ref = l.trade_ref
  columns:
  - {name: trade_ref, data_type: varchar, description: 'The allocation', visible_to: [data_steward, settlements]}
  - {name: fund_account, data_type: varchar, description: 'The fund', visible_to: [data_steward, settlements]}
  - {name: security, data_type: varchar, description: 'The security', visible_to: [data_steward, settlements]}
  - {name: isin, data_type: varchar, description: 'The security''s ISIN', visible_to: [data_steward, settlements]}
  - {name: side, data_type: varchar, description: 'BUY or SELL', visible_to: [data_steward, settlements]}
  - {name: quantity, data_type: double, description: 'The shares allocated', visible_to: [data_steward, settlements]}
  - {name: market, data_type: varchar, description: 'Where it settles', visible_to: [data_steward, settlements]}
  - {name: currency, data_type: varchar, description: 'The currency it settles in', visible_to: [data_steward, settlements]}
  - {name: broker_code, data_type: varchar, description: 'The broker', visible_to: [data_steward, settlements]}
  - {name: trade_date, data_type: date, description: 'The trade date', visible_to: [data_steward, settlements]}
  - {name: gross_amount, data_type: double, description: 'The allocation''s value at the average execution price', visible_to: [data_steward, settlements]}
  - {name: status, data_type: varchar, description: 'matched, or break', visible_to: [data_steward, settlements]}
  - {name: break_type, data_type: varchar, description: 'The break; empty when matched', visible_to: [data_steward, settlements]}
  - {name: detail, data_type: varchar, description: 'What differs, in words; empty when matched', visible_to: [data_steward, settlements]}
# The answer: each break with the time left to its market's cutoff, by the desk's clock, and what a
# failed settlement would accrue a day there.
- id: break_queue
  domain_id: postrade
  enable_aggregates: true
  enable_group_by: true
  description: Each break, with the minutes left before its market's affirmation cutoff and the penalty a day a failed settlement would accrue
  sql: >-
    SELECT s.trade_ref, s.fund_account, s.security, s.side, s.quantity, s.market, s.broker_code,
      s.break_type, s.detail,
      r.cutoff_minutes - CAST(EXTRACT(EPOCH FROM (k.as_at - CAST(s.trade_date AS TIMESTAMP))) AS INTEGER) / 60
        AS minutes_to_cutoff,
      r.cutoff_rule, s.currency, s.gross_amount,
      CAST(ROUND(s.gross_amount * r.penalty_bp_per_day / 10000, 2) AS DOUBLE) AS penalty_per_day,
      r.penalty_basis
    FROM "postrade"."view_trade_status" AS s
    JOIN "postrade"."settlement_rules" AS r ON r.market = s.market
    CROSS JOIN "postrade"."desk_clock" AS k
    WHERE s.status = 'break'
  columns:
  - {name: trade_ref, data_type: varchar, description: 'The allocation', visible_to: [data_steward, settlements]}
  - {name: fund_account, data_type: varchar, description: 'The fund', visible_to: [data_steward, settlements]}
  - {name: security, data_type: varchar, description: 'The security', visible_to: [data_steward, settlements]}
  - {name: side, data_type: varchar, description: 'BUY or SELL', visible_to: [data_steward, settlements]}
  - {name: quantity, data_type: double, description: 'The shares allocated', visible_to: [data_steward, settlements]}
  - {name: market, data_type: varchar, description: 'Where it settles', visible_to: [data_steward, settlements]}
  - {name: broker_code, data_type: varchar, description: 'The broker', visible_to: [data_steward, settlements]}
  - {name: break_type, data_type: varchar, description: 'The break', visible_to: [data_steward, settlements]}
  - {name: detail, data_type: varchar, description: 'What differs, in words', visible_to: [data_steward, settlements]}
  - {name: minutes_to_cutoff, data_type: integer, description: 'Minutes left before the market''s affirmation cutoff; below zero once it has passed', visible_to: [data_steward, settlements]}
  - {name: cutoff_rule, data_type: varchar, description: 'The cutoff, in words', visible_to: [data_steward, settlements]}
  - {name: currency, data_type: varchar, description: 'The currency of the amounts', visible_to: [data_steward, settlements]}
  - {name: gross_amount, data_type: double, description: 'The allocation''s value', visible_to: [data_steward, settlements]}
  - {name: penalty_per_day, data_type: double, description: 'What a failed settlement would accrue a day', visible_to: [data_steward, settlements]}
  - {name: penalty_basis, data_type: varchar, description: 'What that cost is', visible_to: [data_steward, settlements]}
functions:
# Every allocation that matched in all four systems, affirmed: written to the affirmation log at
# the desk's time, from the stored trade_status.
- name: affirm_matched
  function_name: affirm_matched
  impl_kind: statement
  domain_id: postrade
  description: Log the affirmation of every allocation that matched in all four systems, at the desk's time
  source_id: ''
  returns: ''
  visible_to: [data_steward]
  binding:
    sql: >-
      INSERT INTO "postrade"."affirmation_log" (trade_ref, affirmed_at, affirmed_by)
      SELECT s.trade_ref, k.as_at, 'affirm_matched'
      FROM "postrade"."view_trade_status" AS s
      CROSS JOIN "postrade"."desk_clock" AS k
      WHERE s.status = 'matched'
relationships:
# A join from the legs to the matcher feeds each allocation's four records to the function, one
# call for each allocation.
- id: legs-to-match
  alias: MATCHED_AS
  cardinality: one-to-many
  source_table_id: view_trade_legs
  source_column: trade_ref
  target_table_id: trade_match
  target_column: trade_ref
  parameters: {trade_ref: trade_ref, side: side, quantity: quantity, settle_date: settle_date, exec_price: exec_price, ssi_custodian: ssi_custodian, ssi_account: ssi_account, confirm_side: confirm_side, confirm_quantity: confirm_quantity, confirm_price: confirm_price, confirm_net: confirm_net, confirm_settle_date: confirm_settle_date, confirm_custodian: confirm_custodian, confirm_account: confirm_account, instruction_quantity: instruction_quantity, instruction_net: instruction_net, instruction_settle_date: instruction_settle_date}
- {id: allocation-order, alias: ALLOCATES, cardinality: many-to-one, source_table_id: allocations, source_column: order_id, target_table_id: orders, target_column: order_id}
- {id: execution-order, alias: FILLS, cardinality: many-to-one, source_table_id: executions, source_column: order_id, target_table_id: orders, target_column: order_id}
- {id: confirmation-allocation, alias: CONFIRMS, cardinality: one-to-one, source_table_id: confirmations, source_column: trade_ref, target_table_id: allocations, target_column: trade_ref}
- {id: instruction-allocation, alias: SETTLES, cardinality: one-to-one, source_table_id: instructions, source_column: trade_ref, target_table_id: allocations, target_column: trade_ref}
- {id: affirmation-allocation, alias: AFFIRMS, cardinality: one-to-one, source_table_id: affirmation_log, source_column: trade_ref, target_table_id: allocations, target_column: trade_ref}
- {id: queue-allocation, alias: HOLDS_UP, cardinality: many-to-one, source_table_id: view_break_queue, source_column: trade_ref, target_table_id: allocations, target_column: trade_ref}
- {id: queue-rule, alias: CUT_OFF_BY, cardinality: many-to-one, source_table_id: view_break_queue, source_column: market, target_table_id: settlement_rules, target_column: market}
