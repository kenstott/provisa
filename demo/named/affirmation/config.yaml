  - {name: trade_ref, data_type: varchar, description: 'The allocation it settles', visible_to: [data_steward, settlements]}
  - {name: fund_account, data_type: varchar, description: 'The fund', visible_to: [data_steward, settlements]}
  - {name: side, data_type: varchar, description: 'BUY or SELL', visible_to: [data_steward, settlements]}
  - {name: quantity, data_type: integer, description: 'The shares to receive or deliver', visible_to: [data_steward, settlements]}
  - {name: net_amount, data_type: decimal, description: 'The cash to pay or receive', visible_to: [data_steward, settlements]}
  - {name: settle_date, data_type: date, description: 'The settlement date instructed', visible_to: [data_steward, settlements]}
  - {name: status, data_type: varchar, description: 'The instruction''s status at the custodian', visible_to: [data_steward, settlements]}
- source_id: desk
  domain_id: postrade
  schema: public
  table: ssi
  enable_aggregates: true
  enable_group_by: true
  description: 'Each fund''''s standing settlement instructions in each market: the custodian and account a broker must deliver to'
  columns:
  - {name: fund_account, data_type: varchar, is_primary_key: true, description: 'The fund', visible_to: [data_steward, settlements]}
  - {name: market, data_type: varchar, is_primary_key: true, description: 'The market', visible_to: [data_steward, settlements]}
  - {name: custodian_bic, data_type: varchar, description: 'The custodian in that market', visible_to: [data_steward, settlements]}
  - {name: safekeeping_account, data_type: varchar, description: 'The fund''s account there', visible_to: [data_steward, settlements]}
- source_id: desk
  domain_id: postrade
  schema: public
  table: settlement_rules
  enable_aggregates: true
  enable_group_by: true
  description: 'Each market''''s settlement cycle, its affirmation cutoff and what a failed settlement costs a day there'
  columns:
  - {name: market, data_type: varchar, is_primary_key: true, description: 'The market', visible_to: [data_steward, settlements]}
  - {name: settlement_cycle_days, data_type: integer, description: 'Days from trade date to settlement', visible_to: [data_steward, settlements]}
  - {name: cutoff_minutes, data_type: integer, description: 'The cutoff, in minutes after midnight UTC starting the trade date', visible_to: [data_steward, settlements]}
  - {name: cutoff_rule, data_type: varchar, description: 'The cutoff, in words', visible_to: [data_steward, settlements]}
  - {name: penalty_bp_per_day, data_type: decimal, description: 'What a failed settlement costs a day, in basis points of its value', visible_to: [data_steward, settlements]}
  - {name: penalty_basis, data_type: varchar, description: 'What that cost is', visible_to: [data_steward, settlements]}
- source_id: desk
  domain_id: postrade
  schema: public
  table: desk_clock
  enable_aggregates: true
  enable_group_by: true
  description: 'The time the desk is at: the cutoffs count down from it'
  columns:
