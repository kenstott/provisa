#
# The WHOLE config of the named demo "vulnerabilities" (start-ui-install.sh --demo vulnerabilities):
# which vulnerabilities attackers are known to exploit sit in a software company's code, and how far
# past CISA's remediation due date each one is. Its own code is read live from its Postgres; the
# vulnerability data comes from govdata.
#
#   code     the source-control host's database (db/init.sql): the company's repositories, the
#            packages each pins, and the Dependabot alerts raised on the vulnerable pins. Generated.
#            docker-compose.yml brings it up.
#   govdata  AskAmerica's government data: the NVD's CVE records and the weaknesses (CWE) each is
#            an instance of, MITRE's CWE catalog, and CISA's Known Exploited Vulnerabilities (KEV)
#            catalog. A real account, so each table is landed once, when the demo's bundle is built,
#            and read from that replica for good (cache_ttl -1, replicate 0). The NVD tables hold a
#            quarter of a million CVEs; their landing filter keeps only the CVEs the alerts name.
#
# exploited_in_our_code, materialized, joins the open alerts to the KEV catalog: the answer.
auth:
  assignments_source: provisa
  default_assignments:
  - domain_id: '*'
    role_id: org_admin
  provider: none
cache:
  default_ttl: 300
  enabled: true
domains:
- id: security
  description: A software company's repositories, the packages they pin and the Dependabot alerts on
    them, with the NVD's CVE records, MITRE's weaknesses and CISA's known exploited vulnerabilities
federation_engine: duckdb
naming:
  domain_prefix: true
  rules: []
roles:
- id: analyst
  description: "Queries the security domain's findings."
  capabilities:
  - query_development
  domain_access:
  - security
server:
  limits:
    default_row_limit: 100
    request_timeout: 60
    trino_query_timeout: 120
sources:
- id: code
  type: postgresql
  host: ${env:VULNERABILITIES_PG_HOST:-localhost}
  port: ${env:VULNERABILITIES_PG_PORT:-28332}
  database: vulnerabilities${env:VULNERABILITIES_PG_NS}
  username: provisa_reader
  password: provisa_reader
  description: The source-control host's database -- repositories, their dependency manifests and
    the Dependabot alerts on them
- id: govdata
  type: govdata
  # The AskAmerica key, needed only to land the tables: the bundle build has it. A sandbox reads
  # the landed replicas and never this source, so it runs with none.
  username: ${env:ASKAMERICA_API_KEY:-}
  database: cyber_vuln
  cache_ttl: -1
  replicate: 0
  description: Government data from AskAmerica -- the NVD's CVEs, MITRE's CWE catalog and CISA's
    known exploited vulnerabilities, landed once when the demo is built
tables:
- source_id: code
  domain_id: security
  schema: public
  table: repositories
  description: The company's repositories, who owns each and how exposed it is
  columns:
  - {name: repo_id, data_type: integer, is_primary_key: true, description: The repository's number, visible_to: [org_admin, analyst]}
  - {name: name, data_type: varchar, description: The repository's name, visible_to: [org_admin, analyst]}
  - {name: team, data_type: varchar, description: The team that owns it, visible_to: [org_admin, analyst]}
  - {name: language, data_type: varchar, description: Its main language, visible_to: [org_admin, analyst]}
  - {name: ecosystem, data_type: varchar, description: 'The package ecosystem its manifest is in: maven, npm, pip, composer or go', visible_to: [org_admin, analyst]}
  - {name: criticality, data_type: varchar, description: 'How critical it is to the business: high, medium or low', visible_to: [org_admin, analyst]}
  - {name: internet_facing, data_type: boolean, description: Whether it serves the internet, visible_to: [org_admin, analyst]}
- source_id: code
  domain_id: security
  schema: public
  table: dependencies
  description: Each repository's dependency manifest -- the packages it pins, by version
  columns:
  - {name: repo_id, data_type: integer, is_primary_key: true, description: The repository that pins the package, visible_to: [org_admin, analyst]}
  - {name: package_name, data_type: varchar, is_primary_key: true, description: The package, visible_to: [org_admin, analyst]}
  - {name: ecosystem, data_type: varchar, description: The package's ecosystem, visible_to: [org_admin, analyst]}
  - {name: version, data_type: varchar, description: The version pinned, visible_to: [org_admin, analyst]}
  - {name: scope, data_type: varchar, description: 'runtime, or development only', visible_to: [org_admin, analyst]}
- source_id: code
  domain_id: security
  schema: public
  table: dependabot_alerts
  enable_aggregates: true
  enable_group_by: true
  description: The Dependabot alerts on the vulnerable pins -- one for each pin and CVE
  columns:
  - {name: alert_id, data_type: integer, is_primary_key: true, description: The alert's number, visible_to: [org_admin, analyst]}
  - {name: repo_id, data_type: integer, description: The repository it was raised in, visible_to: [org_admin, analyst]}
  - {name: ecosystem, data_type: varchar, description: The package's ecosystem, visible_to: [org_admin, analyst]}
  - {name: package_name, data_type: varchar, description: The vulnerable package, visible_to: [org_admin, analyst]}
  - {name: vulnerable_version, data_type: varchar, description: The version pinned when the alert was raised, visible_to: [org_admin, analyst]}
  - {name: fixed_version, data_type: varchar, description: The first version that fixes it, visible_to: [org_admin, analyst]}
  - {name: cve_id, data_type: varchar, description: The CVE the alert is about, visible_to: [org_admin, analyst]}
  - {name: severity, data_type: varchar, description: 'The advisory''s severity: critical, high, medium or low', visible_to: [org_admin, analyst]}
  - {name: state, data_type: varchar, description: 'open, fixed or dismissed', visible_to: [org_admin, analyst]}
  - {name: created_at, data_type: date, description: When the alert was raised, visible_to: [org_admin, analyst]}
  - {name: fixed_at, data_type: date, description: When it was fixed, visible_to: [org_admin, analyst]}
- source_id: govdata
  domain_id: security
  schema: cyber_vuln
  table: vulnerabilities
  alias: cves
  # Only the CVEs the alerts name: the NVD holds every one ever published.
  landing_filter: cve_id IN ('CVE-2017-5638', 'CVE-2019-11358', 'CVE-2020-14343', 'CVE-2020-1938', 'CVE-2021-23337', 'CVE-2021-3129', 'CVE-2021-33503', 'CVE-2021-44228', 'CVE-2021-44906', 'CVE-2021-45046', 'CVE-2022-1471', 'CVE-2022-22817', 'CVE-2022-22965', 'CVE-2022-24785', 'CVE-2022-25845', 'CVE-2022-42889', 'CVE-2023-32681', 'CVE-2023-44487', 'CVE-2023-46604')
  description: The NVD's record of each CVE the alerts name -- what it is, when it was published,
    and its CVSS score
  columns:
  - {name: cve_id, data_type: varchar, is_primary_key: true, description: The CVE's identifier, visible_to: [org_admin, analyst]}
  - {name: published, data_type: varchar, description: When the NVD published it (ISO 8601), visible_to: [org_admin, analyst]}
  - {name: description_en, data_type: varchar, description: What the vulnerability is, visible_to: [org_admin, analyst]}
  - {name: cvss_v31_score, data_type: double, description: Its CVSS v3.1 base score from 0 to 10, visible_to: [org_admin, analyst]}
  - {name: cvss_v31_severity, data_type: varchar, description: 'Its CVSS v3.1 severity: LOW, MEDIUM, HIGH or CRITICAL', visible_to: [org_admin, analyst]}
  - {name: cvss_v31_vector, data_type: varchar, description: Its CVSS v3.1 vector -- how it is exploited and what it reaches, visible_to: [org_admin, analyst]}
- source_id: govdata
  domain_id: security
  schema: cyber_vuln
  table: vulnerability_cwes
  alias: cve_weaknesses
  landing_filter: cve_id IN ('CVE-2017-5638', 'CVE-2019-11358', 'CVE-2020-14343', 'CVE-2020-1938', 'CVE-2021-23337', 'CVE-2021-3129', 'CVE-2021-33503', 'CVE-2021-44228', 'CVE-2021-44906', 'CVE-2021-45046', 'CVE-2022-1471', 'CVE-2022-22817', 'CVE-2022-22965', 'CVE-2022-24785', 'CVE-2022-25845', 'CVE-2022-42889', 'CVE-2023-32681', 'CVE-2023-44487', 'CVE-2023-46604')
  description: The weaknesses (CWE) each CVE is an instance of, as the NVD classifies it
  columns:
  - {name: cve_id, data_type: varchar, is_primary_key: true, description: The CVE, visible_to: [org_admin, analyst]}
  - {name: cwe_id, data_type: varchar, is_primary_key: true, description: The weakness it is an instance of, visible_to: [org_admin, analyst]}
- source_id: govdata
  domain_id: security
  schema: cyber_vuln
  table: cwe_catalog
  alias: weaknesses
  description: MITRE's catalog of software weaknesses (CWE)
  columns:
  - {name: cwe_id, data_type: varchar, is_primary_key: true, description: The weakness's identifier, visible_to: [org_admin, analyst]}
  - {name: name, data_type: varchar, description: The weakness's name, visible_to: [org_admin, analyst]}
  - {name: abstraction, data_type: varchar, description: 'How specific it is: Pillar, Class, Base or Variant', visible_to: [org_admin, analyst]}
  - {name: description, data_type: varchar, description: What the weakness is, visible_to: [org_admin, analyst]}
- source_id: govdata
  domain_id: security
  schema: cyber_vuln
  table: kev_catalog
  alias: kev
  description: CISA's catalog of Known Exploited Vulnerabilities -- each CVE attackers are known to
    exploit, and the date federal agencies must remediate it by
  columns:
  - {name: cve_id, data_type: varchar, is_primary_key: true, description: The CVE, visible_to: [org_admin, analyst]}
  - {name: vendor_project, data_type: varchar, description: The vendor or project, visible_to: [org_admin, analyst]}
  - {name: product, data_type: varchar, description: The product, visible_to: [org_admin, analyst]}
  - {name: vulnerability_name, data_type: varchar, description: CISA's name for the vulnerability, visible_to: [org_admin, analyst]}
  - {name: date_added, data_type: varchar, description: When CISA added it to the catalog (YYYY-MM-DD), visible_to: [org_admin, analyst]}
  - {name: required_action, data_type: varchar, description: What CISA requires be done about it, visible_to: [org_admin, analyst]}
  - {name: due_date, data_type: varchar, description: 'The date federal agencies must remediate it by (YYYY-MM-DD)', visible_to: [org_admin, analyst]}
  - {name: known_ransomware_use, data_type: varchar, description: 'Whether ransomware campaigns are known to use it: Known or Unknown', visible_to: [org_admin, analyst]}
views:
# The answer: each open alert whose CVE attackers are known to exploit, with the repository it sits
# in and how many days past CISA's remediation due date it is. Stored, and built again when its
# inputs change.
- id: exploited_in_our_code
  domain_id: security
  materialize: true
  enable_aggregates: true
  enable_group_by: true
  description: Each open Dependabot alert whose CVE is in CISA's Known Exploited Vulnerabilities
    catalog -- the repository, the package and the fix, and the days since CISA's due date passed
  sql: >-
    SELECT a.alert_id, r.name AS repository, r.team, r.criticality, r.internet_facing,
           a.package_name, a.vulnerable_version, a.fixed_version, a.cve_id,
           k.vulnerability_name, k.known_ransomware_use,
           CAST(k.due_date AS DATE) AS cisa_due_date,
           CURRENT_DATE - CAST(k.due_date AS DATE) AS days_past_due,
           v.cvss_v31_score, v.cvss_v31_severity
    FROM "security"."dependabot_alerts" AS a
    JOIN "security"."repositories" AS r ON r.repo_id = a.repo_id
    JOIN "security"."kev" AS k ON k.cve_id = a.cve_id
    LEFT JOIN "security"."cves" AS v ON v.cve_id = a.cve_id
    WHERE a.state = 'open'
  columns:
  - {name: alert_id, data_type: integer, description: The alert's number, visible_to: [org_admin, analyst]}
  - {name: repository, data_type: varchar, description: The repository the alert is in, visible_to: [org_admin, analyst]}
  - {name: team, data_type: varchar, description: The team that owns it, visible_to: [org_admin, analyst]}
  - {name: criticality, data_type: varchar, description: How critical the repository is to the business, visible_to: [org_admin, analyst]}
  - {name: internet_facing, data_type: boolean, description: Whether the repository serves the internet, visible_to: [org_admin, analyst]}
  - {name: package_name, data_type: varchar, description: The vulnerable package, visible_to: [org_admin, analyst]}
  - {name: vulnerable_version, data_type: varchar, description: The version pinned, visible_to: [org_admin, analyst]}
  - {name: fixed_version, data_type: varchar, description: The first version that fixes it, visible_to: [org_admin, analyst]}
  - {name: cve_id, data_type: varchar, description: The CVE, visible_to: [org_admin, analyst]}
  - {name: vulnerability_name, data_type: varchar, description: CISA's name for it, visible_to: [org_admin, analyst]}
  - {name: known_ransomware_use, data_type: varchar, description: Whether ransomware campaigns are known to use it, visible_to: [org_admin, analyst]}
  - {name: cisa_due_date, data_type: date, description: The date CISA set to remediate it by, visible_to: [org_admin, analyst]}
  - {name: days_past_due, data_type: integer, description: Days since that date passed, visible_to: [org_admin, analyst]}
  - {name: cvss_v31_score, data_type: double, description: Its CVSS v3.1 base score, visible_to: [org_admin, analyst]}
  - {name: cvss_v31_severity, data_type: varchar, description: Its CVSS v3.1 severity, visible_to: [org_admin, analyst]}
relationships:
- {id: dependency-in-repository, alias: PINNED_IN, graphql_alias: repository, cardinality: many-to-one, source_table_id: dependencies, source_column: repo_id, target_table_id: repositories, target_column: repo_id}
- {id: alert-in-repository, alias: RAISED_IN, graphql_alias: repository, cardinality: many-to-one, source_table_id: dependabot_alerts, source_column: repo_id, target_table_id: repositories, target_column: repo_id}
- {id: alert-about-cve, alias: ABOUT, graphql_alias: cve, cardinality: many-to-one, source_table_id: dependabot_alerts, source_column: cve_id, target_table_id: cves, target_column: cve_id}
- {id: alert-exploited, alias: EXPLOITED_AS, graphql_alias: kev, cardinality: many-to-one, source_table_id: dependabot_alerts, source_column: cve_id, target_table_id: kev, target_column: cve_id}
- {id: cve-exploited, alias: EXPLOITED_AS, graphql_alias: kev, cardinality: one-to-one, source_table_id: cves, source_column: cve_id, target_table_id: kev, target_column: cve_id}
- {id: cve-weakness, alias: INSTANCE_OF, graphql_alias: weaknesses, cardinality: one-to-many, source_table_id: cves, source_column: cve_id, target_table_id: cve_weaknesses, target_column: cve_id}
- {id: weakness-of-catalog, alias: WEAKNESS, graphql_alias: weakness, cardinality: many-to-one, source_table_id: cve_weaknesses, source_column: cwe_id, target_table_id: weaknesses, target_column: cwe_id}
# The vocabulary of vulnerability management: abstract terms, grounded through their edges in the
# terms the tables' columns derive (cve, cwe, cvss v31 score, due date, severity).
glossary_terms:
- name: common vulnerabilities and exposures
  definition: 'CVE: the public catalog of known vulnerabilities, one identifier (CVE-YYYY-NNNN) for each. The NVD records each one''s description and score.'
  domains:
  - security
  edges:
  - to: cve
    rel_type: RELATED_TO
- name: known exploited vulnerability
  definition: 'KEV: a CVE that attackers are known to exploit in the wild. CISA keeps the catalog, with a date by which federal agencies must remediate each one.'
  domains:
  - security
  edges:
  - to: common vulnerabilities and exposures
    rel_type: KIND_OF
  - to: due date
    rel_type: RELATED_TO
- name: common weakness enumeration
  definition: 'CWE: MITRE''s catalog of the kinds of mistake in software that vulnerabilities are instances of -- injection, deserialization of untrusted data, path traversal.'
  domains:
  - security
  edges:
  - to: cwe
    rel_type: RELATED_TO
- name: common vulnerability scoring system
  definition: 'CVSS: a score from 0 to 10 of how severe a vulnerability is, from how it is exploited and what it reaches. It does not say whether anyone exploits it.'
  domains:
  - security
  edges:
  - to: cvss v31 score
    rel_type: RELATED_TO
- name: dependency alert
  definition: 'An alert raised when a repository pins a package version with a published advisory: the package, the CVE and the version that fixes it.'
  domains:
  - security
  edges:
  - to: severity
    rel_type: RELATED_TO
  - to: common vulnerabilities and exposures
    rel_type: RELATED_TO
- name: remediation due date
  definition: 'The date by which a known exploited vulnerability must be fixed. CISA sets one for federal agencies; many companies hold themselves to it.'
  domains:
  - security
  edges:
  - to: known exploited vulnerability
    rel_type: RELATED_TO
