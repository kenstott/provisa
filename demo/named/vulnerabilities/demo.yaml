# The vulnerabilities demo's card on provisa.dev's live demos page (REQ-2006), generated from this file
# by scripts/gen-site-demos.mjs. published: true
# Provisa, is beside it.
title: Exploited vulnerabilities in our code
description: >-
  A software company's repositories and the Dependabot alerts on their packages, in its own
  database, joined by CVE to the NVD and CISA's catalog of Known Exploited Vulnerabilities from
  government data: which vulnerabilities attackers exploit sit in our code, and how far past CISA's
  due date are they?
screenshot: card.png
published: true
group: public-data
# The oldest Provisa this demo's bundle runs on (REQ-2049): a puller running an older one is refused
# by name. The first release carrying the demo.
requires_provisa: 0.1.0a490
# The demo's video: its tagline names what the demo shows Provisa being.
video:
  tagline: "Public/Private Security Workbench"
