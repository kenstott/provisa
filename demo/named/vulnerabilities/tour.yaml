#
# The vulnerabilities demo's own tour (REQ-2010): the story of the demo, told with its own data. The step
# kinds and what each names are listed in demo/named/weblogs/tour.yaml; every name here is checked
# against the demo by tests/unit/test_named_demo_tour.py, and the words of each step are
# tour.steps.<key> in the UI's tour.json, in every language.
#
# The track: the scenario and the features it shows; how the pieces fit, each step on its real
# object; the solution, as predesigned queries over the transports that fit it (a Polly step is
# optional, its answer stored); a recap; and "Where next?", the landing page below.
# Where the tour's "Look around on my own" leaves the visitor: the SQL page.
landing:
  route: /sql
  capability: query_development
steps:
# The scenario and the features the demo shows.
- key: vulnerabilitiesScenario
  route: /sources
  capability: source_registration
  source: code
- key: vulnerabilitiesGovdata
  source: govdata
# How the pieces fit: the alerts, the NVD's CVEs landed through their filter, CISA's catalog, and
# the relationship that marks a CVE as exploited.
- key: vulnerabilitiesAlerts
  route: /tables
  capability: table_registration
  table: code.dependabot_alerts
- key: vulnerabilitiesNvd
  route: /tables
  capability: table_registration
  table: govdata.vulnerabilities
  # Its detail panel: its landing filter is shown in its load section.
  open: load
- key: vulnerabilitiesKev
  table: govdata.kev_catalog
- key: vulnerabilitiesJoin
  route: /relationships
  capability: create_relationship
  relationship: EXPLOITED_AS
- key: vulnerabilitiesTerms
  route: /admin/ontology
  capability: glossary_read
  term: known exploited vulnerability
# The answer, in SQL, GraphQL, Cypher and REST.
- key: vulnerabilitiesAnswer
  route: /sql
  capability: query_development
  sql: >-
    SELECT e.repository, e.team, e.package_name, e.cve_id, e.vulnerability_name,
           e.cisa_due_date, e.days_past_due, e.internet_facing
    FROM "security"."view_exploited_in_our_code" AS e
    ORDER BY e.internet_facing DESC, e.days_past_due DESC
    LIMIT 20
- key: vulnerabilitiesByTeam
  route: /query
  capability: query_development
  example: 1-exploited-by-team
- key: vulnerabilitiesGraph
  route: /graph
  capability: query_development
  cypher: >-
    MATCH (r:S__Repositories)<-[i:RAISED_IN]-(a:S__DependabotAlerts)-[b:ABOUT]->(c:S__Cves)-[e:EXPLOITED_AS]->(k:S__Kev)
    WHERE a.state = 'open' RETURN r, i, a, b, c, e, k
- key: vulnerabilitiesRest
  route: /openapi
  capability: query_development
  api: GET /data/rest/security/view_exploited_in_our_code?groupBy=team&aggregate=count
- key: vulnerabilitiesRecap
  route: /sources
  capability: source_registration
  source: govdata
