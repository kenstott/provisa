#
# The named demo "banksecrecy" (start-ui-install.sh --demo banksecrecy; REQ-1858). This file is its one
# start point: `docker compose up -d` brings up its database and seeds it.
#
#   postgres  the demo's database (db/init.sql): a bank's customers, accounts, branches, tellers
#             and a month of cash at its windows, with the role Provisa reads it as.
#
# Port: 30432 the database; it can be moved by its variable.
x-demo-labels: &demo-labels
  com.provisa.demo: banksecrecy
name: provisa-demo-banksecrecy
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    labels:
      <<: *demo-labels
      com.provisa.demo.role: rdb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: banksecrecy
    ports:
      - "127.0.0.1:${BANKSECRECY_PG_PORT:-30432}:5432"
    volumes:
      - banksecrecy_pg:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - ./db/reader.sql:/docker-entrypoint-initdb.d/20-reader.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d banksecrecy"]
      interval: 2s
      timeout: 5s
      retries: 60

volumes:
  banksecrecy_pg:
