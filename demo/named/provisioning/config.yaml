#
# The WHOLE config of the named demo "provisioning" (start-ui-install.sh --demo provisioning;
# REQ-2067): how do downstream teams get the big datasets they need as soon as they are ready,
# without copying them or writing extraction jobs? A coffee roaster's warehouse takes three feeds,
# builds datasets from them as they land, and provisions them to two teams.
#
#   warehouse  the warehouse's Postgres (db/init.sql): its products, the dataset-ready notices it
#              sends and the pulls its consumers record, read live as provisa_reader.
#   feeds      the Kafka broker the feeds arrive on: orders, prices and stock counts, each landed
#              into this org's own table as it arrives.
#
# order_margins is the dataset provisioned: every order with its revenue, cost and margin, kept
# with every version of each row (bitemporal, delta) so a consumer reads it as of a version time.
# close_by_category is built over it and the stock feeds (the view cascade). Each has a load
# management window: when users and clients may read it.
#
# Two teams read order_margins: finance sees its margins; data science sees them masked, and no
# service orders (a row rule). Inside the dataset's window, a scheduled trigger writes a notice for
# each team -- finance first, data science two minutes later -- and the notices table's live Kafka
# output publishes each to the topic dataset-ready. A consumer (consumer.py) pulls the dataset over
# Arrow Flight as of the notice's time and records the pull.
auth:
  assignments_source: provisa
  default_assignments:
  - domain_id: '*'
    role_id: org_admin
  provider: none
cache:
  default_ttl: 300
  enabled: true
domains:
- id: provisioning
  description: A coffee roaster's warehouse -- its feeds, the datasets it builds from them and how
    they reach the teams downstream
federation_engine: duckdb
naming:
  domain_prefix: true
  rules: []
roles:
# The finance team: every order, margins included.
- id: finance
  capabilities:
  - query_development
  domain_access:
  - provisioning
# The data science team's feature store: margins masked, product orders only.
- id: data_science
  capabilities:
  - query_development
  domain_access:
  - provisioning
server:
  limits:
    default_row_limit: 100
    request_timeout: 60
    trino_query_timeout: 120
sources:
- id: warehouse
  type: postgresql
  host: ${env:PROVISIONING_PG_HOST:-localhost}
  port: ${env:PROVISIONING_PG_PORT:-28032}
  database: provisioning
  username: provisa_reader
  password: provisa_reader
  description: The warehouse's own database -- its products, the notices it sends and the pulls
    its consumers record
- id: feeds
  type: kafka
  host: ${env:PROVISIONING_KAFKA_HOST:-127.0.0.1}
  # The address the broker advertises is this port (docker-compose.yml).
  port: ${env:PROVISIONING_KAFKA_PORT:-29192}
  description: The broker the warehouse's feeds arrive on -- orders, prices and stock counts
tables:
- source_id: warehouse
  domain_id: provisioning
  schema: public
  table: products
  description: What the roaster sells, and what one costs it
  columns:
  - {name: sku, data_type: varchar, is_primary_key: true, description: The product's code, visible_to: [org_admin, finance, data_science]}
  - {name: name, data_type: varchar, description: The product's name, visible_to: [org_admin, finance, data_science]}
  - {name: category, data_type: varchar, description: 'beans, equipment, merchandise or services', visible_to: [org_admin, finance, data_science]}
  - {name: unit_cost, data_type: decimal, description: What one costs the roaster in USD, visible_to: [org_admin, finance]}
- source_id: warehouse
  domain_id: provisioning
  schema: public
  table: notices
  description: Each notice a team is sent that a dataset is ready, and the dataset's version time
  # Each new notice is published to the topic dataset-ready as it is written.
  live:
    strategy: poll
    watermark_column: notice_id
    poll_interval: 2
    outputs:
    - type: kafka
      topic: dataset-ready
      key_column: consumer
      bootstrap_servers: ${env:PROVISIONING_KAFKA_HOST:-127.0.0.1}:${env:PROVISIONING_KAFKA_PORT:-29192}
      role: org_admin
  columns:
  - {name: notice_id, data_type: integer, is_primary_key: true, description: The notice's number, visible_to: [org_admin, finance, data_science]}
  - {name: dataset, data_type: varchar, description: The dataset that is ready, visible_to: [org_admin, finance, data_science], writable_by: [org_admin]}
  - {name: consumer, data_type: varchar, description: The team it is for, visible_to: [org_admin, finance, data_science], writable_by: [org_admin]}
  - {name: version_time, data_type: timestamptz, description: 'When it was sent: the version of the dataset a pull reads, as of this time', visible_to: [org_admin, finance, data_science]}
- source_id: warehouse
  domain_id: provisioning
  schema: public
  table: pulls
  description: Each pull a team's consumer made of a dataset, as the consumer recorded it
  enable_aggregates: true
  enable_group_by: true
  columns:
  - {name: pull_id, data_type: integer, is_primary_key: true, description: The pull's number, visible_to: [org_admin, finance, data_science]}
  - {name: notice_id, data_type: integer, description: The notice it answered, visible_to: [org_admin, finance, data_science]}
  - {name: consumer, data_type: varchar, description: The team that pulled, visible_to: [org_admin, finance, data_science]}
  - {name: dataset, data_type: varchar, description: The dataset it pulled, visible_to: [org_admin, finance, data_science]}
  - {name: version_time, data_type: timestamptz, description: 'The version it read, as of this time', visible_to: [org_admin, finance, data_science]}
  - {name: notified_at, data_type: timestamptz, description: When the consumer had the notice, visible_to: [org_admin, finance, data_science]}
  - {name: pulled_at, data_type: timestamptz, description: When it had every row, visible_to: [org_admin, finance, data_science]}
  - {name: rows, data_type: bigint, description: The rows it read, visible_to: [org_admin, finance, data_science]}
  - {name: seconds, data_type: double, description: How long the pull took, visible_to: [org_admin, finance, data_science]}
  - {name: rows_per_sec, data_type: double, description: Rows read a second, visible_to: [org_admin, finance, data_science]}
  - {name: refused, data_type: varchar, description: 'Why the pull was refused, if it was', visible_to: [org_admin, finance, data_science]}
- source_id: feeds
  domain_id: provisioning
  schema: default
  table: orders
  description: Every order as it arrives on the feed, landed here a few seconds later
  live:
    strategy: kafka
    kafka:
      topic: orders
  push_debounce_quiet: 1
  push_debounce_max_delay: 10
  enable_aggregates: true
  enable_group_by: true
  columns:
  - {name: order_id, data_type: varchar, is_primary_key: true, description: The order's id, visible_to: [org_admin, finance, data_science]}
  - {name: sku, data_type: varchar, description: The product ordered, visible_to: [org_admin, finance, data_science]}
  - {name: quantity, data_type: integer, description: How many were ordered, visible_to: [org_admin, finance, data_science]}
  - {name: unit_price, data_type: decimal, description: The price each sold at in USD, visible_to: [org_admin, finance, data_science]}
  - {name: ordered_at, data_type: timestamp, description: When it was placed (UTC), visible_to: [org_admin, finance, data_science]}
- source_id: feeds
  domain_id: provisioning
  schema: default
  table: prices
  description: Each product's current list price, from the price feed
  live:
    strategy: kafka
    kafka:
      topic: prices
  columns:
  - {name: sku, data_type: varchar, is_primary_key: true, description: The product, visible_to: [org_admin, finance, data_science]}
  - {name: list_price, data_type: decimal, description: Its list price in USD, visible_to: [org_admin, finance, data_science]}
  - {name: changed_at, data_type: timestamp, description: When the price was set (UTC), visible_to: [org_admin, finance, data_science]}
- source_id: feeds
  domain_id: provisioning
  schema: default
  table: inventory
  description: Each product's stock on hand, from the stock-count feed
  live:
    strategy: kafka
    kafka:
      topic: inventory
  columns:
  - {name: sku, data_type: varchar, is_primary_key: true, description: The product, visible_to: [org_admin, finance, data_science]}
  - {name: on_hand, data_type: integer, description: Units on hand, visible_to: [org_admin, finance, data_science]}
  - {name: counted_at, data_type: timestamp, description: When they were counted (UTC), visible_to: [org_admin, finance, data_science]}
views:
# The dataset provisioned: every order with its revenue, cost and margin. Each version of each row
# is kept (delta), so a pull reads it as of a notice's version time. Readable by users and clients
# all day but 00:00-00:30 UTC; a real warehouse would usually open a narrower, overnight window.
- id: order_margins
  domain_id: provisioning
  materialize: true
  bitemporal_mode: delta
  bitemporal_key: [order_id]
  off_peak_window: '00:30-00:00'
  off_peak_tz: UTC
  enable_aggregates: true
  enable_group_by: true
  description: Every order with its product, revenue, cost and margin -- the dataset the finance
    and data science teams pull
  sql: >-
    SELECT o.order_id, o.sku, p.name AS product, p.category, o.quantity,
      o.quantity * o.unit_price AS revenue, o.quantity * p.unit_cost AS cost,
      o.quantity * (o.unit_price - p.unit_cost) AS margin, o.ordered_at
    FROM "provisioning"."orders" AS o
    JOIN "provisioning"."products" AS p ON p.sku = o.sku
  columns:
  - {name: order_id, data_type: varchar, description: The order's id, visible_to: [org_admin, finance, data_science]}
  - {name: sku, data_type: varchar, description: The product ordered, visible_to: [org_admin, finance, data_science]}
  - {name: product, data_type: varchar, description: The product's name, visible_to: [org_admin, finance, data_science]}
  - {name: category, data_type: varchar, description: The product's category, visible_to: [org_admin, finance, data_science]}
  - {name: quantity, data_type: integer, description: How many were ordered, visible_to: [org_admin, finance, data_science]}
  - {name: revenue, data_type: decimal, description: What the order came to in USD, visible_to: [org_admin, finance, data_science]}
  - {name: cost, data_type: decimal, description: What the goods cost the roaster in USD, visible_to: [org_admin, finance, data_science], masks: [{to: [data_science], mask: {type: constant, value: '0'}}]}
  - {name: margin, data_type: decimal, description: Revenue less cost in USD, visible_to: [org_admin, finance, data_science], masks: [{to: [data_science], mask: {type: constant, value: '0'}}]}
  - {name: ordered_at, data_type: timestamp, description: When it was placed (UTC), visible_to: [org_admin, finance, data_science]}
# Finance's close: each category's revenue and margin with the value of its stock, built over the
# dataset and the price and stock feeds as they land. Readable only 02:00-02:15 UTC.
- id: close_by_category
  domain_id: provisioning
  materialize: true
  off_peak_window: '02:00-02:15'
  off_peak_tz: UTC
  description: Each category's revenue and margin, with the value of the stock on hand at list
    price -- finance's close, read only in its window
  sql: >-
    SELECT m.category, SUM(m.revenue) AS revenue, SUM(m.margin) AS margin,
      MAX(s.stock_value) AS stock_value
    FROM "provisioning"."view_order_margins" AS m
    LEFT JOIN (
      SELECT p.category, SUM(i.on_hand * pr.list_price) AS stock_value
      FROM "provisioning"."inventory" AS i
      JOIN "provisioning"."prices" AS pr ON pr.sku = i.sku
      JOIN "provisioning"."products" AS p ON p.sku = i.sku
      GROUP BY p.category
    ) AS s ON s.category = m.category
    GROUP BY m.category
  columns:
  - {name: category, data_type: varchar, description: The category, visible_to: [org_admin, finance]}
  - {name: revenue, data_type: decimal, description: Its revenue in USD, visible_to: [org_admin, finance]}
  - {name: margin, data_type: decimal, description: Its margin in USD, visible_to: [org_admin, finance]}
  - {name: stock_value, data_type: decimal, description: Its stock on hand at list price in USD, visible_to: [org_admin, finance]}
rls_rules:
# Data science builds features from product orders: service orders are not its to see.
- {table_id: view_order_margins, role_id: data_science, filter: "category <> 'services'"}
relationships:
- {id: order-to-product, alias: ORDERED, cardinality: many-to-one, source_table_id: orders, source_column: sku, target_table_id: products, target_column: sku}
- {id: stock-to-product, alias: STOCK_OF, cardinality: one-to-one, source_table_id: inventory, source_column: sku, target_table_id: products, target_column: sku}
- {id: price-to-product, alias: PRICE_OF, cardinality: one-to-one, source_table_id: prices, source_column: sku, target_table_id: products, target_column: sku}
- {id: pull-to-notice, alias: ANSWERS, cardinality: many-to-one, source_table_id: pulls, source_column: notice_id, target_table_id: notices, target_column: notice_id}
# The notices, inside the dataset's window (01:00-23:59 UTC): finance every five minutes, data
# science two minutes after it. A customization built from scheduled triggers and the notices
# table's Kafka output, not a feature of its own.
scheduled_triggers:
- id: notify-finance
  name: Tell finance order_margins is ready
  cron: '*/5 1-23 * * *'
  sql: INSERT INTO "provisioning"."notices" (dataset, consumer) VALUES ('order_margins', 'finance')
  role: org_admin
- id: notify-data-science
  name: Tell data science order_margins is ready
  cron: '2-59/5 1-23 * * *'
  sql: INSERT INTO "provisioning"."notices" (dataset, consumer) VALUES ('order_margins', 'data_science')
  role: org_admin
glossary_terms:
- name: provisioning
  definition: 'Getting a dataset to the teams that use it: telling them it is ready and letting each read its own governed view of it, without copies or extraction jobs.'
  domains:
  - provisioning
  edges:
  - to: dataset
    rel_type: RELATED_TO
- name: version time
  definition: 'The moment a dataset is read as of: every row as it stood then, so a refresh landing during a pull cannot mix two versions.'
  domains:
  - provisioning
  edges:
  - to: version time
    rel_type: RELATED_TO
- name: load window
  definition: 'The hours a dataset may be read by users and clients; outside them a read is refused, saying when the window next opens. The warehouse''s own refreshes run at any time.'
  domains:
  - provisioning
  edges:
  - to: provisioning
    rel_type: RELATED_TO
- name: margin
  definition: 'Revenue less what the goods cost: what finance reads in full and data science sees masked.'
  domains:
  - provisioning
  edges:
  - to: margin
    rel_type: RELATED_TO
