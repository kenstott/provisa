#
# The provisioning demo where it runs from its bundle (start-ui-install.sh --demo provisioning;
# REQ-2049, REQ-2067): the warehouse database, loaded from the dump the bundle build wrote
# (dump/postgres/<database>.sql) with the notices and pulls the build recorded; the broker and the feeds, as in
# the build. Every sandbox of the demo lands the feeds from the one broker into its own tables,
# under its own consumer group. The consumers (consumer.py) are not run here: a sandbox shows the
# pulls the build recorded, and a local start runs them live (docker-compose.yml).
#
# The broker's port is PROVISIONING_KAFKA_PORT, 29192 unless set, never one docker picks: it advertises
# the address its clients dial (see the kafka service). So two versions of the demo do not run on
# one host from their bundles at once where the stores are reached on 127.0.0.1; on the sandbox
# tier's network each is reached by name.

x-demo-labels: &demo-labels
  com.provisa.demo: provisioning

name: provisa-demo-provisioning-run

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    labels:
      <<: *demo-labels
      com.provisa.demo.role: rdb
      # Where config.yaml's warehouse source reads it, for the sandbox tier's node (REQ-2049,
      # scripts/demo_stores_sync.sh): it writes these two into the bundle's stores.env.
      com.provisa.demo.host_env: PROVISIONING_PG_HOST
      com.provisa.demo.ns_env: PROVISIONING_PG_NS
      com.provisa.demo.access: db/reader.sql
      com.provisa.demo.port_env: PROVISIONING_PG_PORT
      com.provisa.demo.port: "5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: provisioning
    ports:
      # Unset: 28032. Set empty (the node, which runs several versions at once): a port docker
      # picks. On the loopback only.
      - "127.0.0.1:${PROVISIONING_PG_PORT-28032}:5432"
    volumes:
      - provisioning_run_pg:/var/lib/postgresql/data
      - ./dump/postgres:/dumps:ro
      - ./dump/load-postgres.sh:/docker-entrypoint-initdb.d/10-load.sh:ro
      - ./db/reader.sql:/docker-entrypoint-initdb.d/20-reader.sql:ro
      - ./db/init-complete.sh:/docker-entrypoint-initdb.d/99-complete.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/lib/postgresql/data/.provisa-init-complete && pg_isready -U postgres -d provisioning"]
      interval: 2s
      timeout: 5s
      retries: 60
      # The first start loads the dump before the marker is written; failures meanwhile do
      # not count.
      start_period: 600s
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    restart: unless-stopped
    labels:
      <<: *demo-labels
      com.provisa.demo.role: stream
      # Where config.yaml's orders source reaches it, for the sandbox tier's node (REQ-2049,
      # scripts/demo_stores_sync.sh). No port_env: a broker advertises the port its clients dial,
      # so its port is never one docker picks (see the header).
      com.provisa.demo.host_env: PROVISIONING_KAFKA_HOST
      com.provisa.demo.port: "${PROVISIONING_KAFKA_PORT:-29192}"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,HOST://0.0.0.0:${PROVISIONING_KAFKA_PORT:-29192},CONTROLLER://0.0.0.0:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      CLUSTER_ID: cHJvdmlzaW9uaW5nLWRtMQ
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"
      DEMO_STORES_NETWORK: ${DEMO_STORES_NETWORK:-}
    # The HOST listener advertises the address its client dials: on this host, 127.0.0.1; on the
    # sandbox tier's network (DEMO_STORES_NETWORK, which the node joins the stores to), this
    # container's own name there, its hostname. Decided when it starts.
    command:
      - bash
      - -c
      - >-
        if [ -n "$$DEMO_STORES_NETWORK" ]; then host="$$(hostname)"; else host=127.0.0.1; fi;
        export KAFKA_ADVERTISED_LISTENERS="INTERNAL://kafka:9092,HOST://$$host:${PROVISIONING_KAFKA_PORT:-29192}";
        exec /etc/confluent/docker/run
    ports:
      # The same port inside and out: the address the broker advertises is the one dialled.
      - "127.0.0.1:${PROVISIONING_KAFKA_PORT:-29192}:${PROVISIONING_KAFKA_PORT:-29192}"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s
  producer:
    image: provisa-demo-provisioning-producer:1
    build:
      context: .
      dockerfile: Dockerfile.producer
    restart: unless-stopped
    labels:
      <<: *demo-labels
      com.provisa.demo.role: producer
    environment:
      FEEDS_BOOTSTRAP: kafka:9092
      # Each sandbox lands the feeds into its own tables: a shorter history than a local start's.
      ORDERS_HISTORY: "50000"
      ORDERS_PER_SECOND: "5"
    healthcheck:
      # Healthy once the month of orders is on the broker (producer.py's mark).
      test: ["CMD", "python", "-c", "import os, sys; sys.exit(not os.path.exists('/tmp/feeds-ready'))"]
      interval: 2s
      timeout: 5s
      retries: 300
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  provisioning_run_pg:
