#
# The data vault demo where it runs from its bundle (start-ui-install.sh --demo datavault;
# REQ-2063, REQ-2049). Its two databases are read live (config.yaml orders and crm), holding what
# the bundle's build left in them -- its setup.yaml had run: every scripted change made. The
# vault's satellites keep the history of those changes in the bundle's seeded/views.duckdb.
#
#   orders  the order system, loaded from dump/orders/, read only (db/run-orders.sql)
#   crm     the CRM, loaded from dump/crm/, read only (db/run-crm.sql)
#
# Both are shared by every sandbox of the demo. Ports: 29232 and 29233, on the loopback only;
# each moved by its variable, and set empty, published on a free one.
x-demo-labels: &demo-labels
  com.provisa.demo: datavault

name: provisa-demo-datavault-run

services:
  orders:
    image: postgres:16
    restart: unless-stopped
    labels:
      <<: *demo-labels
      com.provisa.demo.role: rdb
      # Where config.yaml reads it (the sandbox tier's node writes stores.env from these).
      com.provisa.demo.host_env: DATAVAULT_ORDERS_HOST
      com.provisa.demo.ns_env: DATAVAULT_ORDERS_NS
      com.provisa.demo.access: db/run-orders.sql
      com.provisa.demo.port_env: DATAVAULT_ORDERS_PORT
      com.provisa.demo.port: "5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orders
    ports:
      # Unset: 29232. Set empty (the node, which runs several versions at once): a port docker
      # picks. On the loopback only.
      - "127.0.0.1:${DATAVAULT_ORDERS_PORT-29232}:5432"
    volumes:
      - datavault_run_orders:/var/lib/postgresql/data
      - ./dump/orders:/dumps:ro
      - ./dump/load-postgres.sh:/docker-entrypoint-initdb.d/10-load.sh:ro
      - ./db/run-orders.sql:/docker-entrypoint-initdb.d/20-access.sql:ro
      - ./db/init-complete.sh:/docker-entrypoint-initdb.d/99-complete.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/lib/postgresql/data/.provisa-init-complete && pg_isready -U postgres -d orders"]
      interval: 2s
      timeout: 5s
      retries: 60
      # The first start loads the dump before the marker is written; failures meanwhile do
      # not count.
      start_period: 600s
  crm:
    image: postgres:16
    restart: unless-stopped
    labels:
      <<: *demo-labels
      com.provisa.demo.role: rdb
      # Where config.yaml reads it (the sandbox tier's node writes stores.env from these).
      com.provisa.demo.host_env: DATAVAULT_CRM_HOST
      com.provisa.demo.ns_env: DATAVAULT_CRM_NS
      com.provisa.demo.access: db/run-crm.sql
      com.provisa.demo.port_env: DATAVAULT_CRM_PORT
      com.provisa.demo.port: "5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crm
    ports:
      # Unset: 29233. Set empty (the node, which runs several versions at once): a port docker
      # picks. On the loopback only.
      - "127.0.0.1:${DATAVAULT_CRM_PORT-29233}:5432"
    volumes:
      - datavault_run_crm:/var/lib/postgresql/data
      - ./dump/crm:/dumps:ro
      - ./dump/load-postgres.sh:/docker-entrypoint-initdb.d/10-load.sh:ro
      - ./db/run-crm.sql:/docker-entrypoint-initdb.d/20-access.sql:ro
      - ./db/init-complete.sh:/docker-entrypoint-initdb.d/99-complete.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/lib/postgresql/data/.provisa-init-complete && pg_isready -U postgres -d crm"]
      interval: 2s
      timeout: 5s
      retries: 60
      # The first start loads the dump before the marker is written; failures meanwhile do
      # not count.
      start_period: 600s

volumes:
  datavault_run_orders:
  datavault_run_crm:
