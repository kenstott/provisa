  source_id: ''
  returns: ''
  visible_to: [org_admin]
  binding:
    sql: >-
      INSERT INTO "crm"."account" (account_code, account_name, contact_name, contact_title, contact_email, phone, address, city, postal_code, country, load_date)
      VALUES ('ALFKI', 'Alfreds Futterkiste', 'Maria Anders', 'Sales Representative', 'maria.anders@alfreds.example', '030-0074321', 'Obere Str. 57', 'Berlin', '12209', 'Germany', TIMESTAMP '1997-10-01 09:00:00')
- name: move_alfreds_in_crm
  function_name: move_alfreds_in_crm
  impl_kind: statement
  domain_id: crm
  description: 'The CRM receives the same move, on 15 November 1997'
