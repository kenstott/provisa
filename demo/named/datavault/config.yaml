rls_rules:
# An analyst reads the satellites of European customers only, and the views built on them.
- {description: "Shows the EU analyst only the customers in European countries.", table_id: view_sat_customer_orders, role_id: analyst_eu, filter: "country IN ('Austria', 'Belgium', 'Denmark', 'Finland', 'France', 'Germany', 'Ireland', 'Italy', 'Norway', 'Poland', 'Portugal', 'Spain', 'Sweden', 'Switzerland', 'UK')"}
- {description: "Shows the EU analyst only the customers in European countries.", table_id: view_sat_customer_crm, role_id: analyst_eu, filter: "country IN ('Austria', 'Belgium', 'Denmark', 'Finland', 'France', 'Germany', 'Ireland', 'Italy', 'Norway', 'Poland', 'Portugal', 'Spain', 'Sweden', 'Switzerland', 'UK')"}
- {description: "Shows the EU analyst only the customers in European countries.", table_id: view_customer_as_known, role_id: analyst_eu, filter: "country IN ('Austria', 'Belgium', 'Denmark', 'Finland', 'France', 'Germany', 'Ireland', 'Italy', 'Norway', 'Poland', 'Portugal', 'Spain', 'Sweden', 'Switzerland', 'UK')"}
- {description: "Shows the EU analyst only the customers in European countries.", table_id: view_dim_customer, role_id: analyst_eu, filter: "country IN ('Austria', 'Belgium', 'Denmark', 'Finland', 'France', 'Germany', 'Ireland', 'Italy', 'Norway', 'Poland', 'Portugal', 'Spain', 'Sweden', 'Switzerland', 'UK')"}
relationships:
# Hub-link-hub: GraphQL walks a customer to its orders and an order to its products.
- {id: customer-orders, alias: PLACED, cardinality: one-to-many, source_table_id: view_hub_customer, source_column: customer_hk, target_table_id: view_link_customer_order, target_column: customer_hk}
- {id: order-customer, alias: PLACED_BY, cardinality: many-to-one, source_table_id: view_link_customer_order, source_column: order_hk, target_table_id: view_hub_order, target_column: order_hk}
- {id: order-lines, alias: CONTAINS, cardinality: one-to-many, source_table_id: view_hub_order, source_column: order_hk, target_table_id: view_link_order_product, target_column: order_hk}
- {id: line-product, alias: OF_PRODUCT, cardinality: many-to-one, source_table_id: view_link_order_product, source_column: product_hk, target_table_id: view_hub_product, target_column: product_hk}
# A hub to its satellites.
- {id: customer-orders-sat, alias: AS_ORDERS_HAS_IT, cardinality: one-to-many, source_table_id: view_hub_customer, source_column: customer_hk, target_table_id: view_sat_customer_orders, target_column: customer_hk}
- {id: customer-crm-sat, alias: AS_CRM_HAS_IT, cardinality: one-to-many, source_table_id: view_hub_customer, source_column: customer_hk, target_table_id: view_sat_customer_crm, target_column: customer_hk}
- {id: customer-as-known, alias: KNOWN_AS, cardinality: one-to-many, source_table_id: view_hub_customer, source_column: customer_hk, target_table_id: view_customer_as_known, target_column: customer_hk}
- {id: customer-now, alias: STANDS_AS, cardinality: one-to-many, source_table_id: view_hub_customer, source_column: customer_hk, target_table_id: view_dim_customer, target_column: customer_hk}
- {id: product-sat, alias: DESCRIBED_AS, cardinality: one-to-many, source_table_id: view_hub_product, source_column: product_hk, target_table_id: view_sat_product, target_column: product_hk}
