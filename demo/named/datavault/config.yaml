  domain_id: orders
  description: 'The order system receives Alfreds Futterkiste''s move, on 1 September 1997'
  source_id: ''
  returns: ''
  visible_to: [org_admin]
  binding:
    sql: >-
      INSERT INTO "orders"."customer" (customer_id, company_name, contact_name, contact_title, address, city, region, postal_code, country, phone, load_date)
      VALUES ('ALFKI', 'Alfreds Futterkiste', 'Maria Anders', 'Sales Representative', 'Kurfürstendamm 21', 'Berlin', NULL, '10719', 'Germany', '030-0074321', TIMESTAMP '1997-09-01 09:00:00')
