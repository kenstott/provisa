  binding:
    sql: >-
      INSERT INTO "crm"."account" (account_code, account_name, contact_name, contact_title, contact_email, phone, address, city, postal_code, country, load_date)
      VALUES ('ALFKI', 'Alfreds Futterkiste', 'Maria Anders', 'Sales Representative', 'maria.anders@alfreds.example', '030-0074321', 'Kurfürstendamm 21', 'Berlin', '10719', 'Germany', TIMESTAMP '1997-11-15 09:00:00')
