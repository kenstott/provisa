# The streaming demo's card on provisa.dev's live demos page (REQ-2006), generated from this file
# by scripts/gen-site-demos.mjs. published: true
# Provisa, is beside it.
title: Live order stream
description: >-
  A coffee shop's orders arrive live on a Kafka topic and are joined to its catalog in Postgres.
  Which regions placed the most orders in the last five minutes? A view refreshed by every batch
  of orders that lands answers it in SQL, GraphQL and REST, and a subscription watches it move.
screenshot: card.png
published: true
group: bi
# The oldest Provisa this demo's bundle runs on (REQ-2049): a puller running an older one is refused
# by name. The first release carrying the demo.
requires_provisa: 0.1.0a489
# The demo's video: its tagline names what the demo shows Provisa being.
video:
  tagline: "Live Data, Live Answers"
