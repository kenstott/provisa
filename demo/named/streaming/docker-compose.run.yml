#
# The streaming demo where it runs from its bundle (start-ui-install.sh --demo streaming;
# REQ-2049): the catalog, loaded from the dump the bundle build wrote (dump/postgres.sql), read
# only; the broker and the live order feed, as in the build. Every sandbox of the demo lands the
# orders from the one broker into its own table, under its own consumer group.
#
# The broker's port is STREAMING_KAFKA_PORT, 29092 unless set, never one docker picks: it advertises
# the address its clients dial (see the kafka service). So two versions of the demo do not run on
# one host from their bundles at once where the stores are reached on 127.0.0.1; on the sandbox
# tier's network each is reached by name.

x-demo-labels: &demo-labels
  com.provisa.demo: streaming

name: provisa-demo-streaming-run

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    labels:
      <<: *demo-labels
      com.provisa.demo.role: rdb
      # Where config.yaml's streaming-db reads it, for the sandbox tier's node (REQ-2049,
      # scripts/demo_stores_sync.sh): it writes these two into the bundle's stores.env.
      com.provisa.demo.host_env: STREAMING_PG_HOST
      com.provisa.demo.port_env: STREAMING_PG_PORT
      com.provisa.demo.port: "5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: streaming
    ports:
      # Unset: 28732. Set empty (the node, which runs several versions at once): a port docker
      # picks. On the loopback only.
      - "127.0.0.1:${STREAMING_PG_PORT-28732}:5432"
    volumes:
      - streaming_run_pg:/var/lib/postgresql/data
      - ./dump/postgres.sql:/docker-entrypoint-initdb.d/10-streaming.sql:ro
      - ./db/reader.sql:/docker-entrypoint-initdb.d/20-reader.sql:ro
      - ./db/init-complete.sh:/docker-entrypoint-initdb.d/99-complete.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/lib/postgresql/data/.provisa-init-complete && pg_isready -U postgres -d streaming"]
      interval: 2s
      timeout: 5s
      retries: 60
      # The first start loads the dump before the marker is written; failures meanwhile do
      # not count.
      start_period: 600s
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    restart: unless-stopped
    labels:
      <<: *demo-labels
      com.provisa.demo.role: stream
      # Where config.yaml's orders source reaches it, for the sandbox tier's node (REQ-2049,
      # scripts/demo_stores_sync.sh). No port_env: a broker advertises the port its clients dial,
      # so its port is never one docker picks (see the header).
      com.provisa.demo.host_env: STREAMING_KAFKA_HOST
      com.provisa.demo.port: "${STREAMING_KAFKA_PORT:-29092}"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,HOST://0.0.0.0:${STREAMING_KAFKA_PORT:-29092},CONTROLLER://0.0.0.0:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      CLUSTER_ID: c3RyZWFtaW5nLWRlbW8tMQ
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # An hour of orders is all any reader of the demo looks back over.
      KAFKA_LOG_RETENTION_MS: 3600000
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"
      DEMO_STORES_NETWORK: ${DEMO_STORES_NETWORK:-}
    # The HOST listener advertises the address its client dials: on this host, 127.0.0.1; on the
    # sandbox tier's network (DEMO_STORES_NETWORK, which the node joins the stores to), this
    # container's own name there, its hostname. Decided when it starts.
    command:
      - bash
      - -c
      - >-
        if [ -n "$$DEMO_STORES_NETWORK" ]; then host="$$(hostname)"; else host=127.0.0.1; fi;
        export KAFKA_ADVERTISED_LISTENERS="INTERNAL://kafka:9092,HOST://$$host:${STREAMING_KAFKA_PORT:-29092}";
        exec /etc/confluent/docker/run
    ports:
      # The same port inside and out: the address the broker advertises is the one dialled.
      - "127.0.0.1:${STREAMING_KAFKA_PORT:-29092}:${STREAMING_KAFKA_PORT:-29092}"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s
  producer:
    image: provisa-demo-streaming-producer:1
    build:
      context: .
      dockerfile: Dockerfile.producer
    restart: unless-stopped
    labels:
      <<: *demo-labels
      com.provisa.demo.role: producer
    environment:
      ORDERS_BOOTSTRAP: kafka:9092
      ORDERS_PER_SECOND: "4"
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  streaming_run_pg:
