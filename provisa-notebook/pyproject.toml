[project]
name = "provisa-notebook"
version = "0.1.0"
description = "Provisa's in-browser Python: a self-hosted Pyodide and the provisa-client wheel, served by Provisa's UI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["provisa_notebook*"]

[tool.setuptools.package-data]
provisa_notebook = ["assets/**/*"]
