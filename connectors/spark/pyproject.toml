[project]
name = "provisa-spark-connector"
version = "0.1.0"
description = "The Spark connector for Provisa: tables and commands from one annotated Spark script."
requires-python = ">=3.12,<3.13"
dependencies = ["pyspark-client>=4.0,<5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["provisa_spark"]
