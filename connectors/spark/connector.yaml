# The Spark connector's standard file (REQ-2221, REQ-2225), read by `provisa connector build`.
description: A connection to your Spark cluster through Spark Connect.
icon: icon.svg
requires:
  cluster:
    # Left unset, a source runs on the organisation's default Spark cluster.
    org_default: spark_cluster
settings:
  replicate:
    # 0 is always replicated (REQ-826): a long job is built and refreshed without a query, and a
    # steward can turn it off.
    default: 0
