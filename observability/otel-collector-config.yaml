receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: provisa
  otlphttp/parquet:
    endpoint: http://otlp2parquet:4318
    tls:
      insecure: true
  debug:
    verbosity: basic

processors:
  batch:
    timeout: ${OTEL_COLLECTOR_BATCH_TIMEOUT}
  # REQ-1425: the parquet lane feeds otel.signals.traces, whose readers (the ops queries report and
  # the trace views) select on service_name = the Provisa service. Trino's coordinator exports a
  # span per query stage/task/split to the same endpoint, which was ~2/3 of the parquet files the
  # per-minute compaction job had to sweep — for rows no view ever reads. Those spans still reach
  # the trace backend in the dev overlay; they just do not enter the Iceberg lane.
  filter/parquet_traces:
    error_mode: ignore
    traces:
      span:
        - 'resource.attributes["service.name"] != "${PROVISA_OTEL_SERVICE_NAME}"'
        # REQ-1428: the control plane's own database traffic. asyncpg auto-instrumentation emits a
        # span per statement — BEGIN, COMMIT, every SELECT the API makes against its metadata
        # store — and measured 1080 of every 1134 spans reaching the lane. Compaction inlines rows
        # into INSERT statements, so that volume cost one Iceberg commit per few hundred spans and
        # ingest permanently outran the job: the backlog grew, the queries report stayed empty, and
        # every row of the flood was one no ops view reads. Live inspection keeps them via the dev
        # overlay's Tempo pipeline; the Iceberg lane carries query spans, not connection chatter.
        - 'instrumentation_scope.name == "opentelemetry.instrumentation.asyncpg"'

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [filter/parquet_traces, batch]
      exporters: [otlphttp/parquet, debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, otlphttp/parquet]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/parquet, debug]
