# Dev overlay: adds Grafana Tempo trace export on top of the core config.
# Used via: --config=otel-collector-config.yaml --config=otel-collector-config.dev.yaml
exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  pipelines:
    # Tempo gets EVERY span, including the Trino coordinator's — live trace inspection is exactly
    # where they are useful. The core `traces` pipeline (parquet lane) keeps its service filter, so
    # this overlay must not redefine it (REQ-1425).
    traces/tempo:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
